# Canonical manufacturer names for the IEEE OUI registry (shared/ouiregistry).
#
# The IEEE registry spells one manufacturer many ways ("Cisco Systems, Inc",
# "Cisco Systems Inc", "Cisco SPVTG"; "Hewlett Packard" / "HP Inc." /
# "Hewlett Packard Enterprise"). The rule engine, the identity matcher and the
# end-of-life join each need ONE spelling per manufacturer, so this file maps
# registrant strings onto a canonical display name. A registrant that is not
# listed here resolves to its own cleaned IEEE spelling, uncanonicalised.
#
# Inputs, and how they combine (scripts/generate-oui-registry.mjs):
#
#   standards/oui/ieee-{mal,mam,mas}.tsv   the vendored IEEE snapshot
#                                          (`make refresh-oui`; never hand-edited)
#   this file                              registrant -> canonical, plus pins
#
# Fields:
#
#   vendor:       the canonical display name (at most 64 characters, unique).
#   registrants:  EXACT registrant strings as they appear in the snapshot
#                 (after whitespace normalisation). Each must match at least one
#                 snapshot row, and may belong to only one vendor.
#   pins:         prefixes claimed by name REGARDLESS of registrant. A pin beats
#                 the registrant mapping of its own prefix. 24-bit "AA:BB:CC",
#                 28-bit "AA:BB:CC:D", 36-bit "AA:BB:CC:DE:F". A prefix may be
#                 pinned to only one vendor.
#   source:       REQUIRED when any pin is absent from the IEEE snapshot
#                 (locally-administered or convention prefixes): the public
#                 document that says what the prefix means.
#
# "IEEE Registration Authority" and "Private" are not manufacturers: they mean
# the registry does not say who owns the block, and the lookup returns nothing
# for them. The generator rejects a vendor entry naming either.
#
# Generation FAILS when a registrant or an unsourced pin matches nothing in the
# snapshot. After `make refresh-oui`, a registrant the IEEE renamed shows up
# here as a generation failure, which is the cue to update this file.
#
# Sections group vendors by the kind of thing they mostly make; they are
# comments only and carry no meaning for the generator.

