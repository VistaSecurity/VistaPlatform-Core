# Connector registry — single source of truth for the external systems the
# platform integrates with (ADR-0004 D5, asset-inventory initiative).
#
# Today the answer is split across two CHECK constraints in schema.sql:
# `platform_integrations.integration_type` (twelve types, no CMDB, no ITSM, no
# NetBox) and `cmdb_sync_profiles.platform_type` (four CMDB platforms). A CHECK
# is a poor registry: it carries no kind, no direction, no notion of what an
# integration produces, and adding one means a schema migration.
#
# This registry is the replacement. Phase 0 declares it and audits it against
# the CHECK lists so the two cannot drift; a later phase generates the CHECK
# from this file and retires the hand-maintained lists. **Do not edit the CHECK
# constraints as part of a registry change** — the audit exists precisely to
# make that a deliberate, separate step.
#
# The registry drives:
#   - shared/connectors/registry_gen.go (Go constants and definitions),
#     regenerated by `make generate`, drift-audited by `make audit`
#   - the --check assertion that every `live` connector still appears in one of
#     the two schema.sql CHECK lists
#
# Fields:
#   key              stable identifier; for a live connector this must match the
#                    value used in the corresponding CHECK constraint
#   label            display name
#   kind             cloud | cmdb | network_source_of_truth | itsm | siem |
#                    notification | edr_mdm | sbom_source | secrets_store
#   direction        pull (we read from it) | push (we write to it) | both
#   produces_classes asset-class keys this connector can create assets for.
#                    Plain strings: standards/asset-classes.yaml is the source
#                    of truth for the class tree, and this registry does not
#                    depend on it beyond naming keys. Empty for connectors that
#                    produce no assets (notification sinks, ticket sinks).
#   status           live | registered | planned. The three are answers to
#                    different questions, and collapsing them is what let four
#                    keys sit in a CHECK constraint for a year claiming to be
#                    shipped:
#                      live       — an implementation exists and dispatches on
#                                   this key. shared/connectors/implementations.go
#                                   names the package, and the registry test
#                                   fails if it is missing.
#                      registered — the key is ACCEPTED by the schema (a row may
#                                   carry it) but nothing dispatches on it. The
#                                   catalogue shows it as "not yet available"
#                                   and the UI must not offer it.
#                      planned    — declared here only. Not in any CHECK, so the
#                                   database would reject a row carrying it.
#   schema_source    live and registered connectors only: which CHECK constraint
#                    carries this key — platform_integrations | cmdb_sync_profiles
#                    | connector_connections
#   feature          OPTIONAL entitlement key (a billable_items key) this
#                    connector is gated on. Absent means Core: free in every
#                    edition. The edition itself is NOT restated here —
#                    shared/entitlements.EditionFor(feature) is the single
#                    source for that, and duplicating it would give the two a
#                    way to disagree.
#   description      what the connector does, and what it is NOT for
#
# Adding an entry: edit this file, run `make generate`, commit the regenerated
# shared/connectors/registry_gen.go and the TS mirror. A new `live` entry also
# needs its key in the matching CHECK constraint AND an entry in
# shared/connectors/implementations.go, or the audit fails.

version: 1

kinds:
  - cloud
  - cmdb
  - network_source_of_truth
  - itsm
  - siem
  - notification
  - edr_mdm
  - sbom_source
  # ADR-0004 D5 names the eight above. `secrets_store` is the ninth: a vault
  # or secrets manager is read for the crypto posture it holds (PKI mounts,
  # transit key algorithms), which is neither a cloud we enumerate resources
  # in nor a CMDB we sync configuration items with.
  - secrets_store

connectors:
  # --- cloud (platform_integrations) ----------------------------------------
  - key: aws
    label: Amazon Web Services
    kind: cloud
    direction: pull
    produces_classes: [compute_instance, object_storage, managed_database, cloud_load_balancer, serverless_function]
    status: live
    schema_source: platform_integrations
    description: >-
      Pulls EC2, S3, RDS, ELB, Lambda and ACM inventory with placement facts
      (cloud.account_id, cloud.region, cloud.vpc_id, cloud.subnet_id) and the
      certificates and keys those services present.

  - key: azure
    label: Microsoft Azure
    kind: cloud
    direction: pull
    produces_classes: [compute_instance, object_storage, managed_database, cloud_load_balancer, serverless_function, key_store]
    status: live
    schema_source: platform_integrations
    description: >-
      Pulls virtual machines, storage accounts, SQL databases, application
      gateways, functions and Key Vault inventory, with subscription and
      region placement facts.

  - key: gcp
    label: Google Cloud Platform
    kind: cloud
    direction: pull
    produces_classes: [compute_instance, object_storage, managed_database, cloud_load_balancer, serverless_function]
    status: live
    schema_source: platform_integrations
    description: >-
      Pulls Compute Engine, Cloud Storage, Cloud SQL, load balancers and Cloud
      Functions inventory, with project and region placement facts.

  # --- notification (platform_integrations) ---------------------------------
  - key: slack
    label: Slack
    kind: notification
    direction: push
    produces_classes: []
    status: live
    schema_source: platform_integrations
    description: >-
      Delivers alerts to a Slack workspace. A sink only: it never reads, and
      never creates an asset.

  - key: pagerduty
    label: PagerDuty
    kind: notification
    direction: push
    produces_classes: []
    status: live
    schema_source: platform_integrations
    description: >-
      Raises PagerDuty incidents from alerts. A sink only.

  # --- siem (platform_integrations) -----------------------------------------
  - key: datadog
    label: Datadog
    kind: siem
    direction: push
    produces_classes: []
    status: live
    schema_source: platform_integrations
    description: >-
      Ships events and metrics to Datadog. Classified as a siem sink rather
      than an observability source because nothing is read back: the platform
      is the producer in this relationship.

  - key: splunk
    label: Splunk
    kind: siem
    direction: push
    produces_classes: []
    status: live
    schema_source: platform_integrations
    description: >-
      Ships findings and audit events to Splunk (OCSF for event export, per
      ADR-0005 D6). Push only today; a pull direction would mean treating
      Splunk as an inventory source, which is a separate decision.

  # --- source repositories (platform_integrations) --------------------------
  - key: github
    label: GitHub
    kind: sbom_source
    direction: pull
    produces_classes: []
    status: registered
    schema_source: platform_integrations
    description: >-
      Reads repository metadata and dependency data. Produces software
      inventory, not assets — a repository is not a configuration item, and
      the source-code scanning that once mapped repos to assets was removed
      because no repository-to-asset mapping ever existed.
      REGISTERED, NOT LIVE: the platform_integrations CHECK accepts the key,
      but nothing in the tree dispatches on it — the collector went with the
      source-code scanning that was deleted.

  - key: gitlab
    label: GitLab
    kind: sbom_source
    direction: pull
    produces_classes: []
    status: registered
    schema_source: platform_integrations
    description: >-
      Reads project metadata and dependency data. Produces software inventory,
      not assets. REGISTERED, NOT LIVE: no collector dispatches on this key.

  - key: bitbucket
    label: Bitbucket
    kind: sbom_source
    direction: pull
    produces_classes: []
    status: registered
    schema_source: platform_integrations
    description: >-
      Reads repository metadata and dependency data. Produces software
      inventory, not assets. REGISTERED, NOT LIVE: no collector dispatches on
      this key.

  # --- secrets_store (platform_integrations) ---------------------------------
  - key: hashicorp_vault
    label: HashiCorp Vault
    kind: secrets_store
    direction: pull
    produces_classes: [key_store]
    status: registered
    schema_source: platform_integrations
    description: >-
      Reads Vault's own posture — which secret engines and PKI mounts exist,
      the transit key algorithms and sizes, and PKI role configuration — as
      key_store assets. Posture only: no secret and no key material is
      retrieved or stored (CLAUDE.md, "Collect posture, never key material").
      REGISTERED, NOT LIVE: the key is carried by the platform_integrations
      CHECK, but no Vault collector exists — it is roadmap
      (docsv4/internal/roadmap/encryption-detection-opportunities.md). No code
      dispatches on the type, and the tenant-facing create handler's `oneof`
      does not accept it, so nothing reaches Vault today.

  # --- escape hatch (platform_integrations) ---------------------------------
  - key: custom
    label: Custom integration
    kind: cmdb
    direction: both
    produces_classes: []
    status: live
    schema_source: platform_integrations
    description: >-
      A tenant-defined integration configured through the generic integration
      form. Deliberately claims no classes: what a custom integration produces
      is not knowable from the registry, so nothing downstream may assume a
      shape for it.

  # --- cmdb (cmdb_sync_profiles) --------------------------------------------
  - key: servicenow
    label: ServiceNow CMDB
    kind: cmdb
    direction: both
    produces_classes: [server, workstation, switch, router, firewall, printer, application, business_service]
    status: live
    schema_source: cmdb_sync_profiles
    feature: cmdb_sync
    description: >-
      Two-way sync with the ServiceNow CMDB: pull configuration items as
      assets, push discovered assets and their relationships back. The class
      tree is ServiceNow-derived (ADR-0002 D2), so the CI-class mapping is
      close to identity.

  - key: device42
    label: Device42
    kind: cmdb
    direction: both
    produces_classes: [server, workstation, switch, router, firewall, application]
    status: live
    schema_source: cmdb_sync_profiles
    feature: cmdb_sync
    description: Two-way sync with a Device42 CMDB.

  - key: solarwinds
    label: SolarWinds
    kind: cmdb
    direction: pull
    produces_classes: [server, switch, router, firewall]
    status: live
    schema_source: cmdb_sync_profiles
    feature: cmdb_sync
    description: >-
      Pulls monitored nodes from SolarWinds as assets. Pull only: SolarWinds is
      a monitoring system of record, and pushing discovered devices into it
      would create nodes it would then try to poll.

  - key: oomnitza
    label: Oomnitza
    kind: cmdb
    direction: both
    produces_classes: [server, workstation, mobile, application]
    status: live
    schema_source: cmdb_sync_profiles
    feature: cmdb_sync
    description: >-
      Two-way sync with Oomnitza's enterprise technology management inventory.

  # --- network_source_of_truth (connector_connections) -----------------------
  - key: netbox
    label: NetBox
    kind: network_source_of_truth
    direction: pull
    produces_classes: [server, switch, router, firewall]
    status: live
    schema_source: connector_connections
    feature: connector_netbox
    description: >-
      Pulls sites, prefixes, VLANs, device types and devices from NetBox
      (ADR-0001 D3 Q3, ADR-0004 D5). Sites become location context, prefixes
      and VLANs become network segments, devices become observations through
      the identification engine. NetBox is the source of truth for network
      structure, so the pull direction wins on conflict.
      Direction is PULL, not both: v1 writes NOTHING back. What NetBox does not
      know about is surfaced as a read-only Drift view for the network team to
      act on in NetBox itself — pushing discovered devices into a source of
      truth would make it a mirror of our guesses rather than a statement of
      their intent. A push direction is a separate, deliberate decision.

  - key: jira
    label: Jira
    kind: itsm
    direction: push
    produces_classes: []
    status: planned
    description: >-
      Creates and updates Jira issues from tickets. Push only, and deliberately
      so: the boundary review refused a workflow engine, so Jira owns the
      workflow and the platform owns the finding.

  - key: intune
    label: Microsoft Intune
    kind: edr_mdm
    direction: pull
    produces_classes: [workstation, mobile]
    status: planned
    description: >-
      Pulls managed endpoints with their OS, hardware and compliance facts.
      The managed-endpoint coverage a network-observation-only inventory
      cannot reach: a laptop that never appears on a monitored segment.

  - key: jamf
    label: Jamf Pro
    kind: edr_mdm
    direction: pull
    produces_classes: [workstation, mobile]
    status: planned
    description: >-
      Pulls managed macOS and iOS endpoints with their OS, hardware and
      software inventory.

  - key: osquery
    label: osquery
    kind: edr_mdm
    direction: pull
    produces_classes: [server, workstation]
    status: planned
    description: >-
      Adapter over an existing osquery fleet, reading host facts and software
      inventory from the customer's own deployment. An adapter, not an
      embedding: osquery was rejected as a dependency on CGO and licence
      grounds (ADR-0004), so this consumes results rather than linking the
      engine.

  - key: sbom_upload
    label: SBOM upload
    kind: sbom_source
    direction: pull
    produces_classes: []
    status: planned
    description: >-
      Ingests a CycloneDX 1.6 or SPDX 2.3/3.0 document uploaded by the tenant
      and turns it into software installs against an existing asset. Produces
      no assets of its own: an SBOM describes what runs on something, and
      inventing the something from a document nobody verified is how a CMDB
      fills with ghosts.
