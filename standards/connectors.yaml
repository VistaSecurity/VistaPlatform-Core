# Connector registry — single source of truth for the external systems the
# platform integrates with (ADR-0004 D5, asset-inventory initiative).
#
# Today the answer is split across several CHECK constraints in schema.sql —
# `platform_integrations.integration_type` (cloud, plus keys nothing dispatches
# on), `cmdb_sync_profiles.platform_type` (four CMDB platforms),
# `connector_connections.connector_key` (NetBox), `tenant_notification_channels.
# channel_type` (notification delivery) and `audit.siem_integrations.type`
# (SIEM export). A CHECK is a poor registry: it carries no kind, no direction,
# no notion of what an integration produces, and adding one means a schema
# migration.
#
# This registry is the replacement. Phase 0 declares it and audits it against
# the CHECK lists so the two cannot drift; a later phase generates the CHECK
# from this file and retires the hand-maintained lists. **Do not edit the CHECK
# constraints as part of a registry change** — the audit exists precisely to
# make that a deliberate, separate step.
#
# The registry drives:
#   - shared/connectors/registry_gen.go (Go constants and definitions),
#     regenerated by `make generate`, drift-audited by `make audit`
#   - the --check assertion that every `live` and `registered` connector still
#     appears in the CHECK constraint that carries it, and that every value in
#     each of those CHECKs is either a registry entry or an explicitly retired
#     value (`retired_check_values`, below)
#
# TRUTHFULNESS RULE (integrations review 2026-09, M32-M35): every claim in an
# entry — status, direction, produces_classes, description — must match what the
# code on main does today. An entry that promises more than the code delivers
# is how a catalogue came to offer a Lambda collector that never existed and a
# "live" Azure connector whose every run failed. When a connector's behaviour
# changes, change its entry in the same PR; for the CMDB platforms
# `produces_classes` is additionally pinned to the mapping templates by
# services/inventory-service/ee/cmdbsync/registry_classes_test.go.
#
# Fields:
#   key              stable identifier; for a live connector this must match the
#                    value used in the corresponding CHECK constraint
#   label            display name
#   kind             cloud | cmdb | network_source_of_truth | itsm | siem |
#                    notification | edr_mdm | sbom_source | secrets_store |
#                    generic
#   direction        pull (we read from it) | push (we write to it) | both
#   produces_classes asset-class keys this connector CREATES ASSETS for — what
#                    a run can actually produce, not what the vendor has.
#                    Plain strings, checked against standards/asset-classes.yaml
#                    by shared/connectors' tests. Empty for connectors that
#                    produce no assets (notification sinks, ticket sinks).
#   status           live | registered | planned. The three are answers to
#                    different questions, and collapsing them is what let four
#                    keys sit in a CHECK constraint for a year claiming to be
#                    shipped:
#                      live       — an implementation exists and dispatches on
#                                   this key. shared/connectors/implementations.go
#                                   names the package, and the registry test
#                                   fails if it is missing.
#                      registered — the key is ACCEPTED by the schema (a row may
#                                   carry it) but nothing dispatches on it. The
#                                   catalogue shows it as "not yet available"
#                                   and the UI must not offer it.
#                      planned    — declared here only. Not in any CHECK, so the
#                                   database would reject a row carrying it.
#   schema_source    live and registered connectors only: which CHECK constraint
#                    carries this key — platform_integrations | cmdb_sync_profiles
#                    | connector_connections | tenant_notification_channels |
#                    siem_integrations — or `none` for a LIVE connector that
#                    keeps no connection row at all (an upload endpoint rather
#                    than a configured integration).
#   configured_by    OPTIONAL. Who sets the connector up: `tenant` (default —
#                    the tenant's own admins, in Settings → Integrations or
#                    Discovery) or `platform_operator` (the deployment's
#                    operator, in the administration console; the tenant sees
#                    the connector in the catalogue but cannot add it). SIEM
#                    export is platform-global, so it is the latter.
#   feature          OPTIONAL entitlement key (a billable_items key) this
#                    connector is gated on. Absent means Core: free in every
#                    edition. The edition itself is NOT restated here —
#                    shared/entitlements.EditionFor(feature) is the single
#                    source for that, and duplicating it would give the two a
#                    way to disagree.
#   description      what the connector does, and what it is NOT for
#
# `retired_check_values` (top-level, after `kinds`) lists values a CHECK still
# accepts that nothing acts on and the catalogue deliberately does not offer.
# Each carries the reason. It exists so the reverse audit ("every CHECK value
# has a registry entry") can keep failing on a NEW unexplained value without
# forcing a schema migration for a dead one: a retired value must still be in
# its CHECK (a stale entry fails) and must not also be a registry entry for
# that same CHECK (a contradiction fails).
#
# Adding an entry: edit this file, run `make generate`, commit the regenerated
# shared/connectors/registry_gen.go and the TS mirror. A new `live` entry also
# needs its key in the matching CHECK constraint AND an entry in
# shared/connectors/implementations.go, or the audit fails.

version: 1

kinds:
  - cloud
  - cmdb
  - network_source_of_truth
  - itsm
  - siem
  - notification
  - edr_mdm
  - sbom_source
  # ADR-0004 D5 names the eight above. `secrets_store` is the ninth: a vault
  # or secrets manager is read for the crypto posture it holds (PKI mounts,
  # transit key algorithms), which is neither a cloud we enumerate resources
  # in nor a CMDB we sync configuration items with.
  - secrets_store
  # `generic` is the tenth: the one key (`custom`) that is not any particular
  # kind of system. It used to be filed under `cmdb`, which put a card that
  # does nothing under the "CMDB / ITSM" heading.
  - generic

# CHECK values the schema still accepts that nothing acts on and the catalogue
# does not offer (see the header). Keyed by schema_source, then by value, with
# the reason. The audit fails if a value listed here is no longer in its CHECK,
# or is also a registry entry for that same CHECK.
retired_check_values:
  platform_integrations:
    slack: >-
      Dead row type. Slack alerts are delivered from tenant notification
      channels (tenant_notification_channels); admin-service refuses to create,
      update or test a platform_integrations row of this type.
    pagerduty: >-
      Dead row type. PagerDuty alerts are delivered from tenant notification
      channels (tenant_notification_channels); admin-service refuses to create,
      update or test a platform_integrations row of this type.
    datadog: >-
      Dead row type. Datadog forwarding is SIEM export (audit.siem_integrations);
      admin-service refuses to create, update or test a platform_integrations
      row of this type.
    splunk: >-
      Dead row type. Splunk forwarding is SIEM export (audit.siem_integrations);
      admin-service refuses to create, update or test a platform_integrations
      row of this type.
  tenant_notification_channels:
    sms: >-
      Reserved, never delivered. notification-service accepts the type and its
      sender is a placeholder that refuses every message permanently. Not
      offered anywhere, and not promised: it is neither live nor planned.

connectors:
  # --- cloud (platform_integrations) ----------------------------------------
  - key: aws
    label: Amazon Web Services
    kind: cloud
    direction: pull
    produces_classes: [compute_instance, virtual_network, subnet, cloud_load_balancer, api_gateway, cdn_distribution, key_store, object_storage, managed_database]
    status: live
    schema_source: platform_integrations
    description: >-
      Reads EC2 instances, VPCs and subnets; ALB, NLB and classic ELB load
      balancers; API Gateway (v2) APIs; CloudFront distributions; KMS keys; S3
      buckets and RDS instances, with placement facts (cloud.account_id,
      cloud.region, cloud.vpc_id, cloud.subnet_id). Load-balancer and CloudFront
      certificates are collected with their ACM metadata. Lambda functions are
      not collected, and ACM is read only as metadata on those certificates,
      not as inventory of its own.

  - key: azure
    label: Microsoft Azure
    kind: cloud
    direction: pull
    produces_classes: [compute_instance, virtual_network, subnet, cloud_load_balancer, key_store, object_storage, managed_database]
    status: live
    schema_source: platform_integrations
    description: >-
      Reads virtual machines, virtual networks and subnets; Application Gateway
      and load balancers; Key Vault keys; storage accounts and SQL databases,
      with subscription and region placement facts. Azure Functions are not
      collected.

  - key: gcp
    label: Google Cloud Platform
    kind: cloud
    direction: pull
    produces_classes: [compute_instance, virtual_network, subnet, cloud_load_balancer, key_store, object_storage, managed_database]
    status: live
    schema_source: platform_integrations
    description: >-
      Reads Compute Engine instances, VPC networks and subnetworks; HTTPS load
      balancers and SSL proxies; Cloud KMS keys; Cloud Storage buckets and Cloud
      SQL instances, with project and region placement facts. Cloud Functions
      are not collected.

  # --- notification (tenant_notification_channels) --------------------------
  # Delivery lives in notification-service, from a tenant's notification
  # channels (Settings → Integrations → Add connection). Every one of these is
  # a sink: it never reads, and never creates an asset. Microsoft Teams is not
  # supported and is deliberately absent.
  - key: email
    label: Email
    kind: notification
    direction: push
    produces_classes: []
    status: live
    schema_source: tenant_notification_channels
    description: >-
      Emails alerts to the recipients listed on a notification channel. Sent
      through the SMTP settings the platform operator has configured; a channel
      is flagged in the console while none are. A sink only.

  - key: slack
    label: Slack
    kind: notification
    direction: push
    produces_classes: []
    status: live
    schema_source: tenant_notification_channels
    description: >-
      Posts alerts to a Slack channel through an incoming-webhook URL held on a
      notification channel. A sink only: it never reads, and never creates an
      asset.

  - key: pagerduty
    label: PagerDuty
    kind: notification
    direction: push
    produces_classes: []
    status: live
    schema_source: tenant_notification_channels
    description: >-
      Raises PagerDuty incidents from alerts through the Events API v2, using
      the integration (routing) key held on a notification channel. A sink only.

  - key: webhook
    label: Generic webhook
    kind: notification
    direction: push
    produces_classes: []
    status: live
    schema_source: tenant_notification_channels
    description: >-
      POSTs each alert as JSON to a URL you choose, optionally authenticated
      (bearer, basic or a custom header) and signed with an HMAC-SHA256
      signature the receiver can verify. A sink only. Not the SIEM webhook:
      that one carries the audit event stream and is configured by the
      platform operator.

  - key: in_app
    label: In-app notifications
    kind: notification
    direction: push
    produces_classes: []
    status: live
    schema_source: tenant_notification_channels
    description: >-
      Delivers alerts to the notification bell in the console. Every tenant
      gets this channel automatically when it is created; it needs no setup.
      A sink only.

  # --- siem (audit.siem_integrations) ---------------------------------------
  # SIEM export forwards the AUDIT event stream of the whole deployment, so it
  # is platform-global: it is configured by the platform operator in the
  # administration console (Security & Trust → SIEM Export), never by a tenant,
  # and is an Enterprise capability (siem_export). It is not the place findings
  # go, and the events are not OCSF (ADR-0005 D6 commits OCSF to the device
  # inventory export, which ships today as the xBOM download).
  - key: splunk
    label: Splunk
    kind: siem
    direction: push
    produces_classes: []
    status: live
    schema_source: siem_integrations
    configured_by: platform_operator
    feature: siem_export
    description: >-
      Ships the platform audit event stream to Splunk HTTP Event Collector
      (HEC event format; verified against Splunk Enterprise 9.4). Findings are
      not exported and events are not OCSF. Configured by the platform
      operator (SIEM Export, Enterprise), not per tenant. Push only; a pull
      direction would mean treating Splunk as an inventory source, which is a
      separate decision.

  - key: datadog
    label: Datadog
    kind: siem
    direction: push
    produces_classes: []
    status: live
    schema_source: siem_integrations
    configured_by: platform_operator
    feature: siem_export
    description: >-
      Ships the platform audit event stream to Datadog Logs (Logs API v2,
      DD-API-KEY, site-derived intake). Contract-tested against the documented
      API, not verified against a live Datadog organization. Configured by the
      platform operator (SIEM Export, Enterprise), not per tenant. Classified
      as a siem sink rather than an observability source because nothing is
      read back.

  - key: elastic
    label: Elasticsearch
    kind: siem
    direction: push
    produces_classes: []
    status: live
    schema_source: siem_integrations
    configured_by: platform_operator
    feature: siem_export
    description: >-
      Ships the platform audit event stream to Elasticsearch through the bulk
      API, into a data stream or an index, with an API key or basic
      authentication (verified against Elasticsearch 8.15). A re-sent batch is
      not duplicated: the event id is the document id. Configured by the
      platform operator (SIEM Export, Enterprise), not per tenant.

  - key: generic_webhook
    label: Generic webhook (SIEM)
    kind: siem
    direction: push
    produces_classes: []
    status: live
    schema_source: siem_integrations
    configured_by: platform_operator
    feature: siem_export
    description: >-
      Posts batches of the platform audit event stream as a JSON array to a URL
      the operator chooses, with no authentication, bearer, basic or one custom
      header, and an HMAC-SHA256 signature the receiver can verify. Our own
      documented contract rather than a vendor's. Configured by the platform
      operator (SIEM Export, Enterprise), not per tenant.

  # --- source repositories (platform_integrations) --------------------------
  - key: github
    label: GitHub
    kind: sbom_source
    direction: pull
    produces_classes: []
    status: registered
    schema_source: platform_integrations
    description: >-
      Reads repository metadata and dependency data. Produces software
      inventory, not assets — a repository is not a configuration item, and
      the source-code scanning that once mapped repos to assets was removed
      because no repository-to-asset mapping ever existed.
      REGISTERED, NOT LIVE: the platform_integrations CHECK accepts the key,
      but nothing in the tree dispatches on it — the collector went with the
      source-code scanning that was deleted.

  - key: gitlab
    label: GitLab
    kind: sbom_source
    direction: pull
    produces_classes: []
    status: registered
    schema_source: platform_integrations
    description: >-
      Reads project metadata and dependency data. Produces software inventory,
      not assets. REGISTERED, NOT LIVE: no collector dispatches on this key.

  - key: bitbucket
    label: Bitbucket
    kind: sbom_source
    direction: pull
    produces_classes: []
    status: registered
    schema_source: platform_integrations
    description: >-
      Reads repository metadata and dependency data. Produces software
      inventory, not assets. REGISTERED, NOT LIVE: no collector dispatches on
      this key.

  # --- secrets_store (platform_integrations) ---------------------------------
  - key: hashicorp_vault
    label: HashiCorp Vault
    kind: secrets_store
    direction: pull
    produces_classes: [key_store]
    status: registered
    schema_source: platform_integrations
    description: >-
      Reads Vault's own posture — which secret engines and PKI mounts exist,
      the transit key algorithms and sizes, and PKI role configuration — as
      key_store assets. Posture only: no secret and no key material is
      retrieved or stored (CLAUDE.md, "Collect posture, never key material").
      REGISTERED, NOT LIVE: the key is carried by the platform_integrations
      CHECK, but no Vault collector exists — it is roadmap
      (docsv4/internal/roadmap/encryption-detection-opportunities.md). No code
      dispatches on the type, and the tenant-facing create handler's `oneof`
      does not accept it, so nothing reaches Vault today.

  # --- escape hatch (platform_integrations) ---------------------------------
  # What actually reads a `custom` row: nothing. device-interrogation-service's
  # POST /integrations accepts the type and stores the row (its config check
  # for `custom` is "no requirements"), and resource-tracker / health metrics
  # count platform_integrations rows for the cloud providers only. No collector,
  # scheduler or delivery path dispatches on it, and no page offers to create
  # one. (inventory-service's own /integrations CRUD writes a different table,
  # `integrations`, with a free-text type; it is unrelated to this key.) So it
  # is registered: accepted by the schema, implemented by nothing.
  - key: custom
    label: Custom integration
    kind: generic
    direction: both
    produces_classes: []
    status: registered
    schema_source: platform_integrations
    description: >-
      A generic integration row: the schema and the integrations API accept
      the type, but nothing reads, runs or delivers through it, there is no
      page to add one, and it claims no asset classes.
      REGISTERED, NOT LIVE. The direction is nominal.

  # --- cmdb (cmdb_sync_profiles) --------------------------------------------
  - key: servicenow
    label: ServiceNow CMDB
    kind: cmdb
    direction: both
    produces_classes: [server, hypervisor, virtual_machine, computer, workstation, network_device, switch, router, firewall, load_balancer, access_point, storage_device, printer, hardware, application, business_service]
    status: live
    schema_source: cmdb_sync_profiles
    feature: cmdb_sync
    description: >-
      Two-way sync with the ServiceNow CMDB. Push: hardware assets go through
      the Identification and Reconciliation Engine, so ServiceNow's own rules
      decide whether a CI already exists, with the relationships between them
      (runs on, hosted on, depends on, contains, ...). Pull: one paginated
      listing per CI class the class mapping names — servers, network and
      storage devices, virtual machines, applications and business services —
      creating the matching assets, incrementally on the last-updated time.
      Certificates, keys and crypto configurations are not written as CIs; the
      crypto posture travels in the CI description. Basic and OAuth client
      credentials only. Contract-tested against ServiceNow's documented APIs,
      not verified against a live instance.

  - key: device42
    label: Device42
    kind: cmdb
    direction: both
    produces_classes: [hardware, hypervisor, switch, server, virtual_machine, cluster]
    status: live
    schema_source: cmdb_sync_profiles
    feature: cmdb_sync
    description: >-
      Two-way sync with Device42, devices only. Push: infrastructure assets
      become Device42 devices; certificates, keys, crypto configurations and
      libraries are not sent, and a device is never matched by name alone (by
      its Device42 id or serial number). The crypto posture goes in the
      device's notes. Pull: every device, page by page, classified by its type
      and switch / virtual-host / blade flags (a plain physical device is
      `hardware`, not a guessed server). Basic authentication only.
      Contract-tested against Device42's published API, not verified against a
      live instance.

  - key: solarwinds
    label: SolarWinds
    kind: cmdb
    direction: pull
    produces_classes: [firewall, load_balancer, wireless_controller, access_point, router, switch, printer, storage_device, hypervisor, workstation, server, hardware]
    status: live
    schema_source: cmdb_sync_profiles
    feature: cmdb_sync
    description: >-
      Pulls the monitored nodes from SolarWinds Orion, page by page, and
      classifies each from its machine type and description text (switch,
      router, firewall, server, ...); a node no keyword recognises becomes
      `hardware`. Pull only: SolarWinds is a monitoring system of record, and
      pushing discovered devices into it would create nodes it would then try
      to poll. Basic authentication only. Contract-tested against the Orion SDK
      documentation, not verified against a live Orion.

  - key: oomnitza
    label: Oomnitza
    kind: cmdb
    direction: both
    produces_classes: [laptop, workstation, server, virtual_machine, mobile, printer, network_device, switch, router, firewall, access_point, storage_device, hardware]
    status: live
    schema_source: cmdb_sync_profiles
    feature: cmdb_sync
    description: >-
      Two-way sync with Oomnitza's asset register, assets only. Push:
      infrastructure assets become Oomnitza assets; certificates, keys, crypto
      configurations and libraries are not sent. Pull: every asset, page by
      page, classified by its asset type (laptops, desktops, servers, virtual
      machines, phones and tablets, printers, network gear, storage); a type it
      does not know becomes `hardware`, not a guessed server. The type, status
      and last-modified field names are Oomnitza defaults. Contract-tested
      against Oomnitza's published API, not verified against a live instance.

  # --- network_source_of_truth (connector_connections) -----------------------
  - key: netbox
    label: NetBox
    kind: network_source_of_truth
    direction: pull
    produces_classes: [switch, router, firewall, vpn_gateway, load_balancer, wireless_controller, access_point, server, hypervisor, storage_device, bmc, printer, workstation, laptop, iot_device, plc, rtu, hmi, unknown_host]
    status: live
    schema_source: connector_connections
    feature: connector_netbox
    description: >-
      Pulls sites, prefixes, VLANs, device types and devices from NetBox
      (ADR-0001 D3 Q3, ADR-0004 D5). Sites become location context, prefixes
      and VLANs become network segments, devices become observations through
      the identification engine, classed by their NetBox device role (a role
      the shipped table and the connection's own mapping do not know arrives
      as `unknown_host`, never a guess). Where the two disagree: NetBox's site
      and region are written onto the assets it matches, while a prefix that
      matches a network segment you already drew keeps your name, environment,
      tags and auto-approval — only provenance and site and VLAN details are
      added.
      Direction is PULL, not both: v1 writes NOTHING back. What NetBox does not
      know about is surfaced as a read-only Drift view for the network team to
      act on in NetBox itself — pushing discovered devices into a source of
      truth would make it a mirror of our guesses rather than a statement of
      their intent. A push direction is a separate, deliberate decision.

  - key: jira
    label: Jira
    kind: itsm
    direction: push
    produces_classes: []
    status: planned
    description: >-
      Creates and updates Jira issues from tickets. Push only, and deliberately
      so: the boundary review refused a workflow engine, so Jira owns the
      workflow and the platform owns the finding.

  - key: intune
    label: Microsoft Intune
    kind: edr_mdm
    direction: pull
    produces_classes: [workstation, mobile]
    status: planned
    description: >-
      Pulls managed endpoints with their OS, hardware and compliance facts.
      The managed-endpoint coverage a network-observation-only inventory
      cannot reach: a laptop that never appears on a monitored segment.

  - key: jamf
    label: Jamf Pro
    kind: edr_mdm
    direction: pull
    produces_classes: [workstation, mobile]
    status: planned
    description: >-
      Pulls managed macOS and iOS endpoints with their OS, hardware and
      software inventory.

  - key: osquery
    label: osquery
    kind: edr_mdm
    direction: pull
    produces_classes: [server, workstation]
    status: planned
    description: >-
      Adapter over an existing osquery fleet, reading host facts and software
      inventory from the customer's own deployment. An adapter, not an
      embedding: osquery was rejected as a dependency on CGO and licence
      grounds (ADR-0004), so this consumes results rather than linking the
      engine.

  # --- sbom_source (an upload endpoint: no connection row) -------------------
  - key: sbom_upload
    label: SBOM upload
    kind: sbom_source
    direction: pull
    produces_classes: [application]
    status: live
    schema_source: none
    description: >-
      Ingests a CycloneDX 1.4–1.7 or SPDX 2.2/2.3 JSON document you upload
      (Discovery → SBOM Upload) and records its components as software
      installs. Uploaded against an existing asset, it adds to that asset's
      Software tab and creates no asset. With no target asset, the document's
      own subject becomes an application asset that waits in Approvals as
      "declared from SBOM upload" until someone admits it. XML, SPDX 3.0 and
      cryptographic (CBOM) components are refused or skipped with a
      warning, and the dependency graph is counted but not stored. There is no
      stored connection: it is an upload, not a configured integration.
