# Findings registry — single source of truth for the platform's finding
# producers and kinds (ADR-0005 D3, asset-inventory initiative).
#
# A *finding* is a judgement a producer makes from facts, against a catalogue
# or a rule: "this OS is end of life", "this package has CVE-X", "this control
# fails". It is not a fact (a statement with provenance) and not an alert (a
# stateful, deduped notification). All producers write to one `findings` table;
# `producer` and `kind` are validated against this registry rather than a CHECK
# constraint, the same way alert types are.
#
# The registry drives:
#   - the generated Go registry in shared/
#     (shared/findings/registry_gen.go — regenerate with `make generate`,
#      checked for drift by `make audit`)
#   - risk rollup: only kinds with feeds_risk: true contribute to
#     assets.risk_score (MAX over active findings that feed risk, ADR-0005 D4)
#   - the findings UI (severity badges, titles, grouping by producer)
#
# Fields on a producer:
#   key          stable producer identifier (matches findings.producer)
#   label        display name
#   description  what this producer judges and from what
#   catalogue    the catalogue or rule source it evaluates against, or none
#   kinds        the finding kinds this producer may emit
#
# Fields on a kind:
#   key              stable kind identifier (matches findings.kind); unique
#                    within a producer
#   severity_model   fixed (one severity at open) | ladder (escalates through
#                    rungs as the condition worsens)
#   default_severity fixed kinds: the severity at open. May be `from-catalogue`
#                    (crypto) or `from-control` (compliance) where the value is
#                    resolved at evaluation time.
#   rungs            ladder kinds: ordered worst-last list of
#                    { threshold, severity, score }. `threshold` is a free-text
#                    label for the boundary the rung represents; the producer
#                    owns its units (days past EOL, days stale, …).
#   score            0-100 contribution to risk for a fixed kind. Ignored for
#                    ladder kinds (each rung carries its own score) and forced
#                    to 0 where feeds_risk is false.
#                    PROVISIONAL: only `catalogue` and `cvss_x10` scores are
#                    anchored to something published. Every literal number
#                    below — the eol rungs, the configuration and drift
#                    scores, pqc_vulnerable's 40 — was chosen by judgement and
#                    is to be revisited when the producer that emits it ships
#                    (phase 3). See REGISTRIES.md, "Values chosen without a
#                    standard"; do not cite them as calibrated.
#   score_source     how the score is derived. `fixed` (the declared number),
#                    `catalogue` (algorithms.risk_score of the worst linked
#                    component — see CLAUDE.md "The catalogue drives risk
#                    scoring"), `cvss_x10` (CVSS base score x10, the convention
#                    models.RiskBands is anchored to), or `ladder`.
#   subject_types    which finding subjects this kind may be about. Must be a
#                    subset of the subject_types list at the bottom of this file.
#   feeds_risk       whether this kind contributes to the asset risk rollup.
#                    Hygiene kinds are false: they are data quality, reported
#                    separately, and must never inflate a security score.
#   title_template   one-line title; {subject} is substituted with
#                    findings.subject_label, {detail} with a producer-supplied
#                    detail string.
#   guidance         CUSTOMER-FACING remediation guidance for the kind: what a
#                    person does about a finding of this kind. Required, and
#                    deliberately separate from `description` — that one is
#                    written for us and carries internal history, table names
#                    and workstream numbers, none of which belongs in front of
#                    a tenant or in a prompt. This is the text the Findings
#                    inspector shows, and it is the REMEDIATOR seam's null
#                    default (ADR-0008 D1): a deployment with no model
#                    configured answers "draft me a plan" with this, which is
#                    why it has to be useful on its own rather than a
#                    placeholder for something an AI would say better.
#                    Generic to the kind, never to one instance: nothing here
#                    may assume a particular asset, vendor or value.
#   description      shown in the findings UI and the docs.
#
# Adding an entry: edit this file, run `make generate`, commit the regenerated
# shared/findings/registry_gen.go. `make audit` fails if they drift.

version: 1

# What "open" means, in the query language, in ONE place.
#
# Both halves are load-bearing. `detection_state` is the finding's own lifecycle
# — is the condition still detected? INACTIVE means it went away — and
# `workflow_status` is the human one: has anybody dealt with it? Counting only
# the first includes findings someone already signed off; counting only the
# second includes findings that have since been fixed.
#
# Generated into BOTH shared/findings (Go `OpenQuery`) and
# packages/primitives/src/findings (`OPEN_FINDINGS_QUERY`), because the two
# halves of this question live in different languages: the facet rail WRITES
# this text when its "has open findings" checkbox is ticked, and the inventory
# service's `has_findings` facet COMPILES the same text to produce the number
# beside it. They were two hand-written expressions once, over two different
# tables, and the facet was withdrawn in Gate 1 because the count described a
# different set from the list it led to.
open_query: "finding:(detection_state:ACTIVE and workflow_status not in (RESOLVED, SUPPRESSED))"

# The finding-subject vocabulary. Used everywhere (findings, tickets, alerts —
# ADR-0005 D3/D7). Every kind's subject_types must be drawn from this list.
subject_types:
  - asset
  - endpoint
  - certificate
  - key
  - crypto_configuration
  - software_install
  - relationship
  - control
  - framework

producers:
  # --- compliance -----------------------------------------------------------
  - key: compliance
    label: Compliance
    description: >-
      Evaluates activated framework controls against tenant inventory and
      records the controls that fail.
    catalogue: frameworks
    kinds:
      - key: control_noncompliant
        severity_model: fixed
        default_severity: from-control
        score: 0
        score_source: fixed
        subject_types: [asset, certificate]
        feeds_risk: false
        title_template: "Control {subject} is noncompliant"
        guidance: >-
          Open the control to see which measurement failed and what it
          expected. Fix the underlying object — the asset or the certificate
          the measurement was taken on — and the next evaluation closes the
          finding. Where the requirement genuinely does not apply here, record
          a control override with a rationale rather than leaving the finding
          open.
        description: >-
          A published framework's control failed evaluation against one
          concrete object. The subject is the object the measurement was taken
          on — the asset, or the certificate — and `control_id` names the
          control it failed. One finding per (control, subject) pair, which is
          the granularity a tenant triages, assigns and raises a ticket at.

          Written as `[control]` when the registry first landed, before the
          writer moved (workstream 3.1). A control-subject finding cannot be
          reached by `finding:(…)` from an asset, cannot be counted by the
          `has_findings` facet, and cannot carry a per-asset assignment — all
          three are live product surfaces, so the subject is the object, not
          the control.

          The retired compliance table's three-value asset-kind CHECK maps onto
          TWO: network_asset → asset, crypto_implementation → asset,
          certificate → certificate. `asset_type` there named the measurement
          KIND, not the type of the id beside it — `asset_id` was always the
          asset's for the first two — so renaming the third value to
          `crypto_configuration` would have made every one of those rows claim
          to point at a `crypto_implementations.id` it has never held. A
          configuration measurement is scoped and selected per ASSET; the
          configurations it was taken over travel in
          `evidence.crypto_implementation_ids`.

          `crypto_configuration` is RESERVED for the `configuration` producer
          below (workstream 3.5), which measures one configuration at a time
          and carries its id. Do not add it back here without a writer that
          actually puts a crypto_implementations.id in subject_id.

          Does not feed the per-asset risk rollup: compliance is scored by the
          framework score, and double-counting a control across every asset it
          touches would swamp the rollup.

  # --- crypto ---------------------------------------------------------------
  - key: crypto
    label: Cryptography
    description: >-
      Judges observed cryptographic posture — negotiated configurations,
      certificates and their algorithms — against the algorithms catalogue.
    catalogue: algorithms
    kinds:
      - key: weak_configuration
        severity_model: fixed
        default_severity: from-catalogue
        score: 0
        score_source: catalogue
        subject_types: [crypto_configuration, endpoint]
        feeds_risk: true
        title_template: "{subject} {detail}"
        guidance: >-
          Review the component or rule named in the finding. Move weak or
          acceptable components to strong or recommended alternatives: disable the obsolete protocol version, remove the
          cipher suite from the server's list, or move the key exchange to a
          modern curve. Change it on the service itself, not on the client — a
          client-side workaround leaves the endpoint willing to negotiate the
          weak option with anything else that asks. Re-scan the endpoint
          afterwards to confirm the new negotiation.
        description: >-
          A crypto configuration negotiates a protocol version, cipher suite,
          key exchange, signature, symmetric or hash algorithm the catalogue
          rates weak or acceptable, or an applicable key-size/hash rule fails.
          Weakness chooses the weak title; acceptable-only names that rating.
          Strong/recommended components alone emit nothing. The numeric score
          retains the maximum catalogue, persisted configuration and applicable
          rule assessment; severity follows from banding that score. Never hardcode a second opinion here — edit
          the catalogue row.
      - key: weak_certificate
        severity_model: fixed
        default_severity: from-catalogue
        score: 0
        score_source: catalogue
        subject_types: [certificate]
        feeds_risk: true
        title_template: "{subject} {detail}"
        guidance: >-
          Reissue the certificate with a key and signature algorithm the
          catalogue rates strong or recommended. Address any key-size/hash failure,
          and use SHA-256 or better for the signature. Replace it everywhere it is
          deployed, then revoke the old one so a copy left on another host
          cannot still be used.
        description: >-
          A certificate's key algorithm, key size or signature algorithm is
          rated weak or acceptable by the catalogue, or fails a size/hash rule.
          The title follows strength independently of numeric risk; incomplete
          historical evidence retains the prior finding pending reassessment.
          Expiry is an alert (certificate_expiring), not a finding.
      - key: pqc_vulnerable
        severity_model: fixed
        default_severity: medium
        score: 40
        score_source: fixed
        subject_types: [crypto_configuration, certificate, key]
        feeds_risk: true
        title_template: "{subject} is vulnerable to quantum attack"
        guidance: >-
          Plan a migration to a post-quantum or hybrid algorithm for this
          subject. Nothing here is broken today: NIST IR 8547 deprecates these
          primitives in 2030 and disallows them in 2035, so the work is
          inventory-led — confirm what depends on this key or configuration,
          check whether the software and the peers support a PQC or hybrid
          option yet, and schedule the change. Long-lived data protected by
          this key is the part to prioritise.
        description: >-
          The subject uses a classical asymmetric primitive broken by Shor's
          algorithm (signature, kem, key-agree, pke) per NIST IR 8547.
          Classification is the denylist in pqc_readiness.go — a subject not
          classified is unclassified, never assumed safe.

      - key: weak_wireless_auth
        severity_model: fixed
        default_severity: from-catalogue
        score: 0
        score_source: catalogue
        subject_types: [asset]
        feeds_risk: true
        title_template: "{subject} {detail}"
        guidance: >-
          Move the wireless LAN named in the finding to WPA2 or WPA3 with the
          AES (CCMP) cipher only. Open networks, WEP and TKIP give a listener in
          range little or no protection. If a legacy client forces TKIP or WEP,
          put that client on its own SSID and VLAN with no route to anything
          that matters, then replace it. Re-read the controller afterwards to
          confirm the LAN reports the new authentication.
        description: >-
          An access point serves a wireless LAN whose authentication is open or
          whose cipher is TKIP or WEP. The subject is the access point asset
          (the LAN itself is not an asset); the evidence names each SSID. The
          cipher is scored by its algorithms-catalogue row (wireless_lans.
          algorithm_id), so editing the row changes the score. A LAN whose
          cipher is `auto` or unrecorded is not assessed and raises nothing.

      - key: unencrypted_at_rest
        severity_model: fixed
        default_severity: from-catalogue
        score: 0
        score_source: catalogue
        subject_types: [asset]
        feeds_risk: true
        title_template: "{subject} {detail}"
        guidance: >-
          Turn on encryption at rest for the resource named in the finding —
          default encryption on the bucket, storage encryption on the database,
          or the provider's equivalent. For a database this usually means
          restoring an encrypted snapshot into a new instance, because storage
          encryption often cannot be switched on in place; plan the cutover.
          Prefer a key your organisation manages if you need to control who can
          decrypt the data. Re-run the cloud discovery afterwards to confirm the
          resource now reports encryption.
        description: >-
          A cloud storage or database resource reports that its data is not
          encrypted at rest (crypto_applications.configuration_data:
          encryption_determined true, encrypted false). The subject is the
          resource's asset; several unencrypted records on one asset are one
          finding whose evidence names each. The score is the algorithms
          catalogue row AT-REST-PLAINTEXT (90, the at-rest ladder's unencrypted
          rung); edit the row to change it. An encrypted resource
          raises nothing, whoever holds the key — provider-managed versus
          customer-managed is shown on the Data Protection lens, not scored as
          risk (owner decision, 2026-10-23). A record whose encryption could not
          be determined raises nothing and is not counted as assessed. The pass
          claims crypto coverage only for an asset whose at-rest records are
          its whole crypto surface (no crypto configurations), so it never
          speaks for configurations the main crypto pass did not judge.

  # --- eol ------------------------------------------------------------------
  - key: eol
    label: End of life
    description: >-
      Compares observed operating systems, software and hardware against the
      end-of-life catalogue.
    catalogue: eol_catalogue
    kinds:
      - key: os_end_of_life
        severity_model: ladder
        rungs:
          - { threshold: "within 90 days of end of life", severity: low, score: 30 }
          - { threshold: "past end of life", severity: high, score: 70 }
          - { threshold: "past end of life by more than 365 days", severity: critical, score: 90 }
        score_source: ladder
        subject_types: [asset]
        feeds_risk: true
        title_template: "{subject} runs an end-of-life operating system ({detail})"
        guidance: >-
          Upgrade the operating system to a release that is still supported,
          or move the workload to a host that runs one. An end-of-life OS
          receives no security fixes, so the exposure grows with every
          advisory published after the date. Where an upgrade is genuinely
          blocked, isolate the host and record the compensating controls.
        description: >-
          The asset's os.name/os.version facts resolve to a catalogue entry
          whose end-of-life date has passed or is approaching. Escalates as the
          date recedes.
      - key: software_end_of_life
        severity_model: ladder
        rungs:
          - { threshold: "within 90 days of end of life", severity: low, score: 20 }
          - { threshold: "past end of life", severity: medium, score: 50 }
          - { threshold: "past end of life by more than 365 days", severity: high, score: 75 }
        score_source: ladder
        subject_types: [software_install]
        feeds_risk: true
        title_template: "{subject} is end of life ({detail})"
        guidance: >-
          Upgrade the package to a supported version, or remove it if nothing
          still needs it. Check what depends on it first — an end-of-life
          library is often pulled in by something else, and upgrading the
          dependent is the real fix.
        description: >-
          An installed software product has passed, or is approaching, its
          catalogue end-of-life date. Scored below OS end-of-life because the
          blast radius of one package is narrower than the platform it runs on.
      - key: hardware_end_of_support
        severity_model: ladder
        rungs:
          - { threshold: "within 180 days of end of support", severity: low, score: 20 }
          - { threshold: "past end of support", severity: medium, score: 50 }
          - { threshold: "past end of support by more than 365 days", severity: high, score: 70 }
        score_source: ladder
        subject_types: [asset]
        feeds_risk: true
        title_template: "{subject} hardware is past vendor support ({detail})"
        guidance: >-
          Plan the hardware refresh. Past end of support the vendor issues no
          further firmware fixes, so a future advisory against this model has
          no remedy. Until it is replaced, keep it off management networks
          reachable from anywhere untrusted.
        description: >-
          The asset's hw.vendor/hw.model facts resolve to a catalogue entry
          whose end-of-support date has passed or is approaching. Unsupported
          hardware stops receiving firmware fixes.

  # --- vulnerability --------------------------------------------------------
  - key: vulnerability
    label: Vulnerability
    description: >-
      Matches installed software against the mirrored vulnerability catalogue
      by CPE and Package URL.
    catalogue: vulnerability_catalogue
    kinds:
      - key: known_vulnerability
        severity_model: fixed
        default_severity: from-catalogue
        score: 0
        score_source: cvss_x10
        subject_types: [software_install, asset]
        feeds_risk: true
        title_template: "{subject} is affected by {detail}"
        guidance: >-
          Apply the vendor's fixed version for this advisory. Where a patch is
          not available yet, apply the vendor's documented mitigation and
          re-check when one ships. Confirm afterwards that the installed
          version really changed — the finding closes on the next inventory
          pass, not on the change ticket.
        description: >-
          An installed software version matches a catalogue advisory by CPE or
          PURL. Score is the CVSS base score x10 (the convention
          models.RiskBands is anchored to), so severity bands land on the CVSS
          qualitative ratings. A CVE with no CVSS score scores 0 and is
          reported as not scored, never as harmless.

  # --- configuration --------------------------------------------------------
  - key: configuration
    label: Configuration
    description: >-
      Judges how a device is managed and what it exposes, from endpoint and
      interrogation facts, against the configuration rule table.
    catalogue: configuration_rules
    kinds:
      - key: plaintext_management
        severity_model: fixed
        default_severity: high
        score: 70
        score_source: fixed
        subject_types: [asset, endpoint]
        feeds_risk: true
        title_template: "{subject} is managed over a plaintext protocol ({detail})"
        guidance: >-
          Move management onto the encrypted equivalent — SSH instead of
          Telnet, HTTPS instead of HTTP, SFTP instead of FTP, SNMPv3 instead
          of v1 or v2c — and then disable the plaintext service so it cannot
          be reached at all. Treat any credential used over the plaintext
          service as exposed and rotate it.
        description: >-
          The asset's management plane runs over a protocol with no transport
          confidentiality — Telnet, HTTP, FTP, SNMP v1/v2c. Credentials and
          configuration cross the network in the clear.
      - key: default_credentials_exposed
        severity_model: fixed
        default_severity: critical
        score: 90
        score_source: fixed
        subject_types: [asset, endpoint]
        feeds_risk: true
        title_template: "{subject} accepts default credentials"
        guidance: >-
          Change the credential now, on the device itself, and then check
          whether the same default is in use anywhere else. A vendor default
          is published, so assume it has been tried. Where the device allows
          it, disable the default account rather than only changing its
          password.
        description: >-
          A management endpoint accepted a documented vendor default
          credential. The finding records that it was accepted; it never
          records the credential itself (see "Collect posture, never key
          material").
      - key: insecure_service_exposed
        severity_model: fixed
        default_severity: medium
        score: 50
        score_source: fixed
        subject_types: [endpoint]
        feeds_risk: true
        title_template: "{subject} exposes an insecure service ({detail})"
        guidance: >-
          Close the port, bind the service to a management interface, or put
          it behind an authenticating proxy. Decide first whether the service
          is needed on this segment at all — the cheapest fix is usually
          removing an exposure nobody was using.
        description: >-
          An endpoint listens on a service the rule table rates as unsafe to
          expose on this segment — an unauthenticated database port, a debug
          interface, a legacy file-sharing protocol.

  # --- hygiene --------------------------------------------------------------
  - key: hygiene
    label: Inventory hygiene
    description: >-
      Reports gaps in the inventory itself — missing ownership, missing
      classification, suspected duplicates, stale records. Data quality, not
      security: nothing here feeds risk.
    catalogue: none
    kinds:
      - key: no_owner
        severity_model: fixed
        default_severity: low
        score: 0
        score_source: fixed
        subject_types: [asset]
        feeds_risk: false
        title_template: "{subject} has no owner"
        guidance: >-
          Set an owner email or a support group on the asset. An unowned asset
          has nobody to send a finding to, which is what makes it the one that
          stays unfixed.
        description: An asset has no owner_email and no support_group.
      - key: no_class
        severity_model: fixed
        default_severity: low
        score: 0
        score_source: fixed
        subject_types: [asset]
        feeds_risk: false
        title_template: "{subject} is unclassified"
        guidance: >-
          Classify the asset, or add an identification rule that classifies
          this shape of asset automatically. An unclassified asset is
          invisible to class facets and to every class-scoped policy, so it is
          silently excluded from work it should be part of.
        description: >-
          An asset has no class, or sits on a placeholder class the classifier
          could not refine. An unclassified asset is invisible to class facets
          and to any class-scoped policy.
      - key: no_location
        severity_model: fixed
        default_severity: low
        score: 0
        score_source: fixed
        subject_types: [asset]
        feeds_risk: false
        title_template: "{subject} has no location"
        guidance: >-
          Record a site, region or zone on the asset. Location is what turns a
          finding into a work order somebody can act on, and it is what scopes
          an exposure to a building or a plant.
        description: An asset has no site, region, zone or location record.
      - key: duplicate_suspected
        severity_model: fixed
        default_severity: medium
        score: 0
        score_source: fixed
        subject_types: [asset]
        feeds_risk: false
        title_template: "{subject} may be a duplicate of {detail}"
        guidance: >-
          Compare the two records and either merge them through the Approvals
          queue or record why they are genuinely different. Leaving both means
          every count that involves this asset is wrong by one, in a direction
          nobody can see.
        description: >-
          The identification engine found two assets sharing an identifier but
          disagreeing on others, so it did not merge them. The merge proposal
          goes to Approvals; this finding is how it surfaces in the inventory.
      - key: stale
        severity_model: ladder
        rungs:
          - { threshold: "not seen for 30 days", severity: low, score: 0 }
          - { threshold: "not seen for 90 days", severity: medium, score: 0 }
          - { threshold: "not seen for 180 days", severity: high, score: 0 }
        score_source: ladder
        subject_types: [asset, endpoint, software_install]
        feeds_risk: false
        title_template: "{subject} has not been seen for {detail}"
        guidance: >-
          Confirm whether the subject still exists. If it does, find out why
          no collector has seen it — a decommissioned sensor, a changed
          network path, or an agent that stopped reporting. If it does not,
          archive the record so it stops being counted as part of the estate.
        description: >-
          No collector has observed the subject within the freshness window.
          Stale records are the main way an inventory silently becomes wrong;
          escalating rungs prompt an archive decision.
      - key: orphan_relationship
        severity_model: fixed
        default_severity: low
        score: 0
        score_source: fixed
        subject_types: [relationship]
        feeds_risk: false
        title_template: "Relationship {subject} points at a missing asset"
        guidance: >-
          Delete the relationship, or restore the asset it points at if it was
          archived by mistake. An edge to a missing asset makes dependency
          views read as complete when they are not.
        description: >-
          A relationship edge references an asset that has been archived or
          deleted. The edge is kept so the history stays readable, but it
          should be resolved.
      # --- DCIM record quality (DCIM gap 6; seeded controls IH-007 to IH-015).
      # Each is a statement about the asset's DCIM record — placement,
      # cabling, interfaces, addressing, commercial lifecycle — raised on the
      # ASSET so the Inventory Hygiene framework's `finding`-shape
      # measurements can count it per asset. Every one is evaluated only for
      # monitored assets and only where the record holds the data the
      # question is about: a missing warranty date, a device type nobody set
      # or a port no neighbour reports on is not a violation of anything.
      - key: not_racked
        severity_model: fixed
        default_severity: low
        score: 0
        score_source: fixed
        subject_types: [asset]
        feeds_risk: false
        title_template: "{subject} is rack-mountable but not in a rack ({detail})"
        guidance: >-
          Open Infrastructure → Racks, open the rack the device is mounted in
          and place it on the elevation at its unit. If the device is not
          rack-mounted at all, the device type on the asset's Hardware tab is
          wrong: choose one with a height of 0 U, or a child device type for a
          blade in a chassis bay.
        description: >-
          A monitored hardware asset has a device type with a height above
          0 U, is not installed in a parent device's bay, and records no
          rack. A rack-mountable device with no rack is a device nobody can
          find on a floor plan.
      - key: no_rack_position
        severity_model: fixed
        default_severity: low
        score: 0
        score_source: fixed
        subject_types: [asset]
        feeds_risk: false
        title_template: "{subject} is in rack {detail} but has no position"
        guidance: >-
          Open Infrastructure → Racks, open the rack named in the finding and
          drag the device onto the unit it occupies on the front or rear
          elevation. Without a position the rack's utilisation and free-space
          figures cannot count it.
        description: >-
          A monitored asset records a rack but no position in it. Devices
          whose type is 0 U (vertical PDUs, cable managers) and children in a
          parent's bay have no position by design and are not reported.
      - key: planned_cable_stale
        severity_model: fixed
        default_severity: low
        score: 0
        score_source: fixed
        subject_types: [asset]
        feeds_risk: false
        title_template: "{subject} has {detail} planned for more than 90 days"
        guidance: >-
          Open the asset's Ports tab and review each planned cable the finding
          lists: mark it connected once it is installed, or delete it if the
          work was cancelled. A plan nobody finished makes the port look
          spoken for when it is free.
        description: >-
          A cable whose operational status is planned was created more than
          90 days ago. Raised on the asset at the cable's A end (the B end
          when the A end is not an asset, such as a circuit termination); the
          evidence lists the cables.
      - key: cable_unconfirmed
        severity_model: fixed
        default_severity: medium
        score: 0
        score_source: fixed
        subject_types: [asset]
        feeds_risk: false
        title_template: "{subject} has {detail} its neighbours have not confirmed in 30 days"
        guidance: >-
          Open the asset's Ports tab and check each cable the finding lists
          against the port it is on. The device reports LLDP or CDP
          neighbours, so a connected cable that no neighbour has confirmed is
          either recorded on the wrong port or leads to a device that does
          not advertise itself. Correct the cable, or — when the far device
          genuinely does not speak LLDP or CDP — record a control override
          with that rationale.
        description: >-
          A declared or imported, connected cable on one of the asset's
          interfaces has existed for 30 days without an LLDP or CDP
          observation confirming it, while the asset itself has reported
          neighbour data in the same 30 days. An asset with no neighbour data
          at all is not reported: absent data is not a contradiction.
      - key: interface_no_type
        severity_model: fixed
        default_severity: low
        score: 0
        score_source: fixed
        subject_types: [asset]
        feeds_risk: false
        title_template: "{subject} has {detail} with no type"
        guidance: >-
          Open the asset's Interfaces tab and set the type of each interface
          the finding lists, or apply the asset's device type on the Hardware
          tab so its interface templates set the types. The type is what
          cable compatibility, speed reporting and the faceplate drawing read.
        description: >-
          An active interface on a monitored asset has the type `other` or
          no type at all — what a collector records when it could not say
          what the port is. The identity engine's placeholder interfaces
          (`observed-N`, holding an address no collector named an interface
          for) are not reported: nothing measured them, and they are replaced
          when a collector names the interface.
      - key: duplicate_address
        severity_model: fixed
        default_severity: high
        score: 0
        score_source: fixed
        subject_types: [asset]
        feeds_risk: false
        title_template: "{subject} shares the address {detail} with another asset in the same VRF"
        guidance: >-
          Open Infrastructure → Networks, find the address in its prefix and
          compare the assets it is assigned to. Remove the stale assignment,
          move one of them into the VRF it really belongs to, or — when the
          address is shared on purpose — give it the anycast, VIP or
          first-hop-redundancy role that allows sharing.
        description: >-
          Two active addresses with the same host part and the same VRF (or
          both in the global table) are assigned to interfaces of different
          monitored assets. Addresses whose role allows sharing (anycast, VIP,
          VRRP, HSRP, GLBP, CARP) are not reported, as NetBox does not.
      - key: warranty_expired
        severity_model: fixed
        default_severity: medium
        score: 0
        score_source: fixed
        subject_types: [asset]
        feeds_risk: false
        title_template: "{subject}'s warranty ended on {detail}"
        guidance: >-
          Open the asset's Hardware tab and review the Lifecycle card. Renew
          the warranty and record the new end date, or plan the replacement
          and record the decommission date when it leaves service.
        description: >-
          The asset's recorded warranty end date is in the past. An asset
          with no warranty end recorded is not reported: unknown is not
          expired.
      - key: past_end_of_support
        severity_model: fixed
        default_severity: high
        score: 0
        score_source: fixed
        subject_types: [asset]
        feeds_risk: false
        title_template: "{subject} is past end of support ({detail})"
        guidance: >-
          Open the asset's Hardware tab; the Lifecycle card shows the end of
          support and whether it comes from the device type or the platform.
          Upgrade the platform, replace the hardware, or buy extended support
          and record it on the device type or platform. An unsupported
          device receives no further fixes from its vendor.
        description: >-
          The asset's effective end of support — the earlier of its device
          type's and its platform's, each declared or taken from the linked
          end-of-life catalogue entry — is in the past. Decided by the same
          rule the Lifecycle card shows; an asset with no date on either is
          not reported.
      - key: end_of_support_soon
        severity_model: fixed
        default_severity: medium
        score: 0
        score_source: fixed
        subject_types: [asset]
        feeds_risk: false
        title_template: "{subject} reaches end of support within 12 months ({detail})"
        guidance: >-
          Open the asset's Hardware tab; the Lifecycle card shows the end of
          support and its source. Schedule the upgrade or replacement now,
          while it is maintenance rather than an incident.
        description: >-
          The asset's effective end of support falls between today and twelve
          months from today. An asset already past end of support is reported
          as past_end_of_support instead, not as both.

  # --- drift ----------------------------------------------------------------
  - key: drift
    label: Drift
    description: >-
      Compares the current population of a prefix or an asset against its
      recent baseline window and reports what changed. Rule-based defaults
      first; the ADR-0008 drift seam may propose more later.
    catalogue: none
    kinds:
      - key: new_class_in_segment
        severity_model: fixed
        default_severity: medium
        score: 30
        score_source: fixed
        subject_types: [asset]
        feeds_risk: true
        title_template: "{subject} is the first {detail} seen in its prefix"
        guidance: >-
          Confirm whether the asset belongs on this network. If it does,
          nothing needs fixing and the finding can be resolved. If it does
          not, move it — an unexpected class on a network is usually either a
          misconfigured port or something nobody meant to plug in.
        description: >-
          An asset of a class never before seen in this prefix was
          observed. A printer on a server VLAN is worth a look; an OT device on
          a corporate VLAN is worth a call.
      - key: unexpected_protocol
        severity_model: fixed
        default_severity: medium
        score: 40
        score_source: fixed
        subject_types: [asset, endpoint]
        feeds_risk: true
        title_template: "{subject} started speaking {detail}"
        guidance: >-
          Find out what started using the protocol and whether it was a
          planned change. A newly-appearing plaintext or remote-access
          protocol is the case worth chasing; where it was intentional,
          resolve the finding so the baseline picks the new behaviour up.
        description: >-
          An asset began using a protocol it has not used in the baseline
          window. Newly-appearing plaintext or remote-access protocols are the
          cases that matter.
      - key: port_profile_changed
        severity_model: fixed
        default_severity: low
        score: 20
        score_source: fixed
        subject_types: [asset]
        feeds_risk: true
        title_template: "{subject}'s listening ports changed ({detail})"
        guidance: >-
          Compare the current listening ports against what this asset is
          supposed to run, and confirm the change was planned. Ports opening
          is the signal to chase first, but a port closing unexpectedly can
          mean a service has failed rather than been removed.
        description: >-
          The set of listening sockets on an asset differs from its baseline.
          Ports opening is the signal; ports closing is recorded but scored the
          same because either direction can mean an unplanned change.
      - key: host_key_changed
        severity_model: fixed
        default_severity: high
        score: 70
        score_source: fixed
        subject_types: [asset]
        feeds_risk: true
        title_template: "{subject} presented a different SSH host key ({detail})"
        guidance: >-
          Confirm the device's SSH host key changed for a reason you know
          about — it was replaced, rebuilt, or its key was rotated. If it was,
          re-pin the key from the device's page so interrogation can resume;
          the platform will not authenticate against an unrecognised key until
          you do. If nothing explains it, treat it as an interception of the
          management session and change the device's credentials before
          re-pinning, because the previous ones may have been offered to
          whatever answered.
        description: >-
          The SSH host key a managed device presented differs from the one
          pinned when the platform first contacted it. Interrogation was
          refused before any credential was sent. A replaced device and an
          on-path attacker look identical from here, which is why this fails
          closed rather than re-pinning itself.
      - key: new_issuer
        severity_model: fixed
        default_severity: medium
        score: 30
        score_source: fixed
        subject_types: [certificate, asset]
        feeds_risk: true
        title_template: "{subject} presented a certificate from a new issuer ({detail})"
        guidance: >-
          Confirm the new issuer is one you chose. A planned CA migration
          explains it and the finding can be resolved; an issuer nobody
          recognises on a connection that should be direct is what an
          interception looks like, and is worth treating as one until it is
          explained.
        description: >-
          A certificate was observed from an issuer not seen for this subject
          in the baseline window. A changed issuer is either a planned CA
          migration or an interception.

  # --- topology ---------------------------------------------------------------
  - key: topology
    label: Topology
    description: >-
      Compares what the network says about its own cabling — LLDP and CDP
      neighbour tables read by interrogation (DCIM row 3.3,
      inventory-service cable_intake.go) — against the cables people declared.
    catalogue: none
    kinds:
      - key: cable_drift
        severity_model: fixed
        default_severity: medium
        score: 0
        score_source: fixed
        subject_types: [asset]
        feeds_risk: false
        title_template: "{subject}'s cabling differs from what its neighbours report ({detail})"
        guidance: >-
          Open the asset's Interfaces tab and compare each port named in the
          finding with the neighbour the device reports on it. If the device
          was re-patched on purpose, update the cable so the record matches the
          network; if the cable record is right, find out what is plugged into
          that port instead. The finding resolves on the next interrogation in
          which the neighbours agree with the cables, or as soon as one of
          those cables is changed.
        description: >-
          An LLDP or CDP neighbour observed on a port contradicts an active
          cable on that port (or on the far port the neighbour names): the
          cable's far end, followed through any patch panels, is a different
          device or port. Evidence lists each contradicted port with both ends.
          Inventory accuracy, not exposure, so it does not feed risk.
