# Cable type registries and the termination compatibility matrix (DCIM build, row 0.4;
# asset-inventory ADR-0010 D6, DATA_MODEL section 4).
#
# The cable types, length units and status choices are facts derived from NetBox 4.x
# (Apache-2.0), NetBox v4.3.5, verbatim: netbox/dcim/choices.py (CableTypeChoices,
# CableLengthUnitChoices, LinkStatusChoices) and COMPATIBLE_TERMINATION_TYPES in
# netbox/dcim/constants.py. standards/netbox-choices.v4.3.5.json is the snapshot the
# parity tests compare against.
# See public/NOTICE.
#
# Generated by scripts/generate-dcim-types.mjs (`make generate`) into
# shared/dcim/types_gen.go, packages/primitives/src/dcim/types.gen.ts and the
# inventory-service OpenAPI enums. `make audit` fails on drift.
version: 1

# group is one of copper | fibre | power | other, from NetBox's optgroup headings
# (its Copper heading includes coaxial; usb is a heading of its own, grouped here as other).
cable_types:
  - { key: "cat3", label: "CAT3", group: copper }
  - { key: "cat5", label: "CAT5", group: copper }
  - { key: "cat5e", label: "CAT5e", group: copper }
  - { key: "cat6", label: "CAT6", group: copper }
  - { key: "cat6a", label: "CAT6a", group: copper }
  - { key: "cat7", label: "CAT7", group: copper }
  - { key: "cat7a", label: "CAT7a", group: copper }
  - { key: "cat8", label: "CAT8", group: copper }
  - { key: "dac-active", label: "Direct Attach Copper (Active)", group: copper }
  - { key: "dac-passive", label: "Direct Attach Copper (Passive)", group: copper }
  - { key: "mrj21-trunk", label: "MRJ21 Trunk", group: copper }
  - { key: "coaxial", label: "Coaxial", group: copper }
  - { key: "mmf", label: "Multimode Fiber", group: fibre }
  - { key: "mmf-om1", label: "Multimode Fiber (OM1)", group: fibre }
  - { key: "mmf-om2", label: "Multimode Fiber (OM2)", group: fibre }
  - { key: "mmf-om3", label: "Multimode Fiber (OM3)", group: fibre }
  - { key: "mmf-om4", label: "Multimode Fiber (OM4)", group: fibre }
  - { key: "mmf-om5", label: "Multimode Fiber (OM5)", group: fibre }
  - { key: "smf", label: "Singlemode Fiber", group: fibre }
  - { key: "smf-os1", label: "Singlemode Fiber (OS1)", group: fibre }
  - { key: "smf-os2", label: "Singlemode Fiber (OS2)", group: fibre }
  - { key: "aoc", label: "Active Optical Cabling (AOC)", group: fibre }
  - { key: "usb", label: "USB", group: other }
  - { key: "power", label: "Power", group: power }

length_units:
  - { key: "km", label: "Kilometers" }
  - { key: "m", label: "Meters" }
  - { key: "cm", label: "Centimeters" }
  - { key: "mi", label: "Miles" }
  - { key: "ft", label: "Feet" }
  - { key: "in", label: "Inches" }

cable_status:
  - { key: "connected", label: "Connected" }
  - { key: "planned", label: "Planned" }
  - { key: "decommissioning", label: "Decommissioning" }

# Which termination kinds a cable end may be cabled to, by ObjectKind
# (standards/vocabulary.yaml); NetBox's COMPATIBLE_TERMINATION_TYPES with its model
# names mapped to our keys. Written out in both directions; the generator refuses a
# matrix that is not symmetric. NetBox's is symmetric.
compatible_terminations:
  circuit_termination: [interface, front_port, rear_port, circuit_termination]
  console_port: [console_server_port, front_port, rear_port]
  console_server_port: [console_port, front_port, rear_port]
  interface: [interface, circuit_termination, front_port, rear_port]
  front_port: [console_port, console_server_port, interface, front_port, rear_port, circuit_termination]
  power_feed: [power_port]
  power_outlet: [power_port]
  power_port: [power_outlet, power_feed]
  rear_port: [console_port, console_server_port, interface, front_port, rear_port, circuit_termination]
