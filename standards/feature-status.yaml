# Vista Platform feature status — the source of the website's release-status page.
#
# One entry per capability a customer would look for. At every Core release the
# public `Release Status` workflow turns this file, as it stands at the release
# tag, into features/latest.json on the `release-status` branch. A feature
# marked `available` is in that release, which passed the release's gates (CI,
# the release pipeline, release-candidate verification); nothing extra runs.
#
#   status   available | in_progress | planned
#   edition  the smallest edition that includes it: core | enterprise | msp
#   docs     a user doc under docsv4/core/, without `.md`; the website renders it
#            at https://vistasecurity.io/docs/<docs>/. Omit when the user docs
#            are not public (Enterprise and MSP docs are not).
#
# Edit freely: a status change reaches the site with the next release.
# Validated by scripts/feature-status.mjs (make feature-status-test).

groups:
  - id: deploy_operate
    name: Deploy & operate
  - id: discover_inventory
    name: Discover & inventory
  - id: evaluate_prove
    name: Evaluate & prove
  - id: integrations
    name: Integrations
  - id: security_trust
    name: Security & trust

features:
  # ── Deploy & operate ────────────────────────────────────────────────────────
  - id: self_hosted_install
    group: deploy_operate
    name: Self-hosted install
    summary: One Helm chart installs the whole platform on your own Kubernetes cluster.
    status: available
    edition: core
    docs: operate/deployment/production-checklist
  - id: sensor_collection
    group: deploy_operate
    name: Network sensors
    summary: A lightweight sensor on your network captures traffic and reports what it sees.
    status: available
    edition: core
    docs: features/SENSOR_REGISTRATION
  - id: access_control
    group: deploy_operate
    name: Roles and permissions
    summary: Role-based access control for every user, with invitations for new members.
    status: available
    edition: core
    docs: features/roles-and-permissions
  - id: audit_log
    group: deploy_operate
    name: Audit log
    summary: Every administrative and security-relevant action is recorded and searchable.
    status: available
    edition: core
    docs: guides/audit-logging
  - id: api_and_mcp
    group: deploy_operate
    name: API tokens and MCP server
    summary: API tokens, and a read-only MCP server that lets AI agents query your inventory.
    status: available
    edition: core
    docs: features/api-tokens-and-mcp
  - id: sso
    group: deploy_operate
    name: Single sign-on
    summary: Sign in through your own identity provider (OIDC or SAML) with group-to-role mapping.
    status: available
    edition: enterprise

  # ── Discover & inventory ────────────────────────────────────────────────────
  - id: passive_discovery
    group: discover_inventory
    name: Passive network discovery
    summary: Finds hosts, services and the cryptography they use from observed traffic.
    status: available
    edition: core
    docs: features/discovery
  - id: selected_asset_scan
    group: discover_inventory
    name: Active scan
    summary: Probe the assets you choose for their TLS, SSH and certificate details on demand.
    status: available
    edition: core
    docs: features/active-scanning
  - id: device_interrogation
    group: discover_inventory
    name: Network device interrogation
    summary: Reads crypto configuration directly from firewalls, load balancers and switches.
    status: available
    edition: core
    docs: features/device-interrogation
  - id: cloud_discovery
    group: discover_inventory
    name: Cloud discovery
    summary: Inventories certificates, keys and endpoints in AWS, Azure and Google Cloud.
    status: available
    edition: core
    docs: features/aws-cloud-discovery
  - id: pcap_ingestion
    group: discover_inventory
    name: PCAP upload
    summary: Upload a packet capture and get the same inventory a live sensor would produce.
    status: available
    edition: core
    docs: features/pcap-ingestion
  - id: spreadsheet_import
    group: discover_inventory
    name: Spreadsheet import
    summary: Bring an existing asset list in from a spreadsheet.
    status: available
    edition: core
    docs: features/spreadsheet-import
  - id: canonical_inventory
    group: discover_inventory
    name: Unified asset inventory
    summary: One record per real asset, with lenses for infrastructure, certificates, keys and more.
    status: available
    edition: core
    docs: features/inventory-and-lenses
  - id: identity_intake
    group: discover_inventory
    name: One identity for every sighting
    summary: Every discovery path identifies a device the same way, explains key and address changes, and lets you link or pin what it cannot tell.
    status: available
    edition: core
    docs: features/identity-evidence
  - id: network_map
    group: discover_inventory
    name: Network and crypto map
    summary: See every device by site and network, marked by the crypto it serves.
    status: available
    edition: core
    docs: features/map
  - id: software_inventory
    group: discover_inventory
    name: Software inventory
    summary: Installed software from host agents and SBOM uploads, tied to the assets running it.
    status: available
    edition: core
    docs: features/sbom
  - id: crypto_inventory
    group: discover_inventory
    name: Certificates, keys and crypto configurations
    summary: Every certificate, key and TLS/SSH configuration, linked to where it is used.
    status: available
    edition: core
    docs: features/certificate-chain-management
  - id: third_party_connections
    group: discover_inventory
    name: Third-party connections
    summary: Tracks the external services your hosts talk to, and the crypto those connections use.
    status: available
    edition: core
    docs: features/third-party-and-external-connections
  - id: coverage_freshness
    group: discover_inventory
    name: Asset lifecycle and freshness
    summary: Shows when each asset was last seen, and retires what is no longer there.
    status: available
    edition: core
    docs: features/asset-lifecycle-management
  - id: ot_discovery
    group: discover_inventory
    name: OT / ICS discovery
    summary: Active probing and an inventory view for Modbus, DNP3, BACnet and other OT protocols.
    status: in_progress
    edition: enterprise

  # ── Evaluate & prove ────────────────────────────────────────────────────────
  - id: crypto_assessment
    group: evaluate_prove
    name: Crypto risk assessment
    summary: Scores every crypto configuration against a standards-anchored algorithm catalogue.
    status: available
    edition: core
    docs: features/crypto-risks
  - id: pqc_exposure
    group: evaluate_prove
    name: Post-quantum readiness
    summary: Shows which cryptography is quantum-vulnerable and tracks migration progress.
    status: available
    edition: core
    docs: features/algorithm-reference
  - id: compliance_findings
    group: evaluate_prove
    name: Compliance frameworks and findings
    summary: Continuous evaluation against built-in frameworks, with findings for every failure.
    status: available
    edition: core
    docs: features/compliance-frameworks
  - id: regulated_frameworks
    group: evaluate_prove
    name: Regulated frameworks
    summary: SOC 2, PCI DSS, ISO 27001, NIST CSF and IEC 62351-3, delivered as a signed content bundle.
    status: available
    edition: enterprise
  - id: custom_policies
    group: evaluate_prove
    name: Custom compliance policies
    summary: Write your own frameworks, controls and measurement rules for internal standards.
    status: available
    edition: enterprise
  - id: threshold_overrides
    group: evaluate_prove
    name: Threshold overrides
    summary: Tune the measurement thresholds of the frameworks you have activated.
    status: in_progress
    edition: enterprise
  - id: cbom_generation
    group: evaluate_prove
    name: CBOM generation
    summary: Immutable, content-hashed cryptographic bills of materials for any scope of assets.
    status: available
    edition: core
    docs: cbom/cbom-artifacts
  - id: cbom_cyclonedx
    group: evaluate_prove
    name: CycloneDX export
    summary: Download any CBOM as a standard CycloneDX 1.7 document.
    status: available
    edition: core
    docs: cbom/cbom-artifacts
  - id: cbom_evidence
    group: evaluate_prove
    name: Signed CBOMs, attestation and comparison
    summary: Signed artifacts with compliance attestation, SPDX and PDF export, and drift comparison.
    status: available
    edition: enterprise
  - id: remediation
    group: evaluate_prove
    name: Remediation and ticketing
    summary: Alerts, a work queue and plans, with tickets linked to the assets and findings they fix.
    status: available
    edition: core
    docs: features/remediation

  # ── Integrations ────────────────────────────────────────────────────────────
  - id: cmdb_sync
    group: integrations
    name: CMDB / ITSM sync
    summary: Two-way sync with ServiceNow, Device42, SolarWinds and Oomnitza, with dry run and undo.
    status: available
    edition: enterprise
  - id: netbox
    group: integrations
    name: NetBox connector
    summary: Pull sites, prefixes, VLANs and devices from NetBox and see where reality differs.
    status: available
    edition: enterprise
  - id: siem_export
    group: integrations
    name: SIEM export
    summary: Forward audit events to Splunk, Elastic, Datadog or a webhook.
    status: available
    edition: enterprise

  # ── Security & trust ────────────────────────────────────────────────────────
  - id: tenant_isolation
    group: security_trust
    name: Tenant isolation
    summary: Row-level security in the database keeps every tenant's data separate.
    status: available
    edition: core
    docs: security-posture
  - id: service_mtls
    group: security_trust
    name: Encrypted service mesh
    summary: Mutual TLS between every platform service and its datastores.
    status: available
    edition: core
    docs: operate/security/service-mesh-mtls
  - id: no_key_material
    group: security_trust
    name: Posture, never key material
    summary: We record which algorithms a device uses, never the keys it uses them with.
    status: available
    edition: core
    docs: security-posture
  - id: signed_releases
    group: security_trust
    name: Signed releases
    summary: Every image, chart and binary is signed, with an SBOM and build provenance you can verify.
    status: available
    edition: core
    docs: operate/releases
  - id: source_available
    group: security_trust
    name: Readable source
    summary: Core is built in public from source anyone can read and rebuild.
    status: available
    edition: core
    docs: platform-overview
  - id: continuous_scanning
    group: security_trust
    name: Continuous security scanning
    summary: Static analysis on every change and nightly vulnerability scans of the published images.
    status: available
    edition: core
    docs: security-posture
  - id: signed_windows_binaries
    group: security_trust
    name: Code-signed Windows binaries
    summary: Authenticode-signed sensor and agent binaries for Windows.
    status: planned
    edition: core
