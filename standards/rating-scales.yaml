# ADR-0016 explicit API contracts. Caller behavior is verified by separate tests/guards.
version: 1
concepts:
  risk:
    unit: points_0_100
    direction: higher_is_worse
    unknown: Use risk_assessed_by for asset coverage and existing finding evidence
      for unscored results; numeric zero alone is insufficient.
    owner: shared/riskbands
    range:
      - 0
      - 100
    types:
      - number
      - integer
  risk_band:
    unit: ordinal
    direction: higher_is_worse
    unknown: Absent/unassessed is separate from Informational.
    owner: shared/riskbands
    enum_source: risk_display
    types:
      - string
  severity:
    unit: ordinal
    direction: higher_is_worse
    unknown: Missing is not info; invalid values must not silently become Medium.
    owner: shared/severity
    enum_source: severity
    types:
      - string
  control_severity:
    unit: ordinal
    direction: higher_is_worse
    unknown: Optional override may be absent; required baseline has four valid values.
    owner: shared/severity
    enum_source: control_severity
    types:
      - string
  algorithm_strength:
    unit: ordinal
    direction: higher_is_better
    unknown: Unresolved current external strength is null; other producers retain
      their documented absent/empty sentinel. Never infer recommended.
    owner: shared/strength and algorithms catalogue
    types:
      - string
    enum_source: algorithm_strength
  external_strength_legacy:
    unit: ordinal
    direction: higher_is_better
    unknown: unknown is the legacy missing assessment; historical good has no exact
      four-band mapping.
    owner: inventory-service external connections
    values:
      - good
      - weak
      - unknown
    types:
      - string
  cvss:
    unit: points_0_10
    direction: higher_is_worse
    unknown: null means no published score; zero is CVSS None.
    owner: vulnerability catalogue
    range:
      - 0
      - 10
    types:
      - number
      - integer
  cvss_severity:
    unit: ordinal
    direction: higher_is_worse
    unknown: null means unscored; none is a measured CVSS zero.
    owner: CVSS source vocabulary
    values:
      - none
      - low
      - medium
      - high
      - critical
    types:
      - string
  compliance:
    unit: weighted_percent
    direction: higher_is_better
    unknown: null when no assessed control weight; display coverage separately.
    owner: compliance-engine
    range:
      - 0
      - 100
    types:
      - number
      - integer
  health:
    unit: index_0_100
    direction: higher_is_better
    unknown: Factor null or health_status unknown; history lacking availability
      cannot prove measurement.
    owner: tenant-health-service
    range:
      - 0
      - 100
    types:
      - number
      - integer
  health_status:
    unit: ordinal
    direction: higher_is_better
    unknown: unknown means no measured factors; critical can remain in historical
      records.
    owner: shared/healthbands
    enum_source: health_with_history
    types:
      - string
  resource_index:
    unit: index_0_100
    direction: higher_is_better
    unknown: Existing backend fallback values registered, cleanup deferred unless a
      visible dependency proves need.
    owner: resource-tracker-service
    range:
      - 0
      - 100
    types:
      - number
      - integer
  confidence_fraction:
    unit: fraction
    direction: higher_is_better
    unknown: Preserve field-specific absent/null convention; no unit guessing.
    owner: identity/classification producer
    range:
      - 0
      - 1
    types:
      - number
      - integer
  confidence_percent:
    unit: percent
    direction: higher_is_better
    unknown: Absent/null; stored percentage is not a 0..1 fraction.
    owner: asset observation adapter
    range:
      - 0
      - 100
    types:
      - number
      - integer
  match_confidence:
    unit: fraction
    direction: higher_is_better
    unknown: Existing matcher zero means unscored, including omitted accepted_score.
    owner: identity matcher
    range:
      - 0
      - 1
    types:
      - number
      - integer
  no_estimate_confidence:
    unit: fraction
    direction: context_dependent
    unknown: Current seam reports zero to mean no estimate; do not fabricate confidence.
    owner: AI/source seam
    range:
      - 0
      - 1
    types:
      - number
      - integer
  service_confidence:
    unit: ordinal
    direction: higher_is_better
    unknown: Absent means no service classification.
    owner: service classification
    values:
      - low
      - medium
      - high
    types:
      - string
  attainment:
    unit: percent
    direction: higher_is_better
    unknown: Absent or unmeasured denominator is not a completed assessment;
      preserve documented current contract.
    owner: owning progress API
    range:
      - 0
      - 100
    types:
      - number
      - integer
  population_share:
    unit: percent
    direction: context_dependent
    unknown: No population means no meaningful distribution; no security judgment
      implied.
    owner: admin distribution API
    range:
      - 0
      - 100
    types:
      - number
      - integer
  utilization:
    unit: percent
    direction: target_range
    unknown: Preserve source availability; zero is a possible measurement, optimal
      target depends on resource.
    owner: resource/monitoring API
    range:
      - 0
      - null
    types:
      - number
      - integer
  relative_change:
    unit: percent
    direction: context_dependent
    unknown: Keep current zero-baseline convention; correction deferred before UI
      adoption.
    owner: inventory trends
    range:
      - null
      - null
    types:
      - number
      - integer
  quantum_level:
    unit: nist_level
    direction: higher_is_better
    unknown: Preserve source null/sentinel; never convert absence into a risk grade.
    owner: NIST algorithm metadata
    range:
      - 0
      - 5
    types:
      - number
      - integer
  security_bits:
    unit: bits
    direction: higher_is_better
    unknown: Absent/null when catalogue lacks this metadata.
    owner: algorithm metadata
    range:
      - 0
      - null
    types:
      - number
      - integer
  operational_severity:
    unit: ordinal
    direction: higher_is_worse
    unknown: Operational severity has its own vocabulary, not finding severity.
    owner: resource-tracker-service
    values:
      - info
      - warning
      - critical
    types:
      - string
  metadata:
    unit: structure
    direction: not_applicable
    unknown: Container, boolean, count map or policy discriminator, not a numeric grade.
    owner: enclosing contract
    types:
      - object
      - array
      - string
      - boolean
      - number
      - integer
      - unspecified
  quota_consumption:
    unit: percent_of_limit
    direction: higher_is_worse
    unknown: Missing limit/usage is not zero consumption; interpret unlimited/zero
      limits at the quota boundary.
    owner: quota/alert policy
    range:
      - 0
      - null
    types:
      - number
      - integer
  evidence_completeness:
    unit: categorical
    types:
      - string
    direction: not_applicable
    unknown: Missing does not establish complete; source reports complete or partial.
    owner: inventory-service certificate evidence
    values:
      - complete
      - partial
  external_strength_filter:
    unit: query_selection
    direction: not_applicable
    unknown: unassessed selects NULL strength, including unresolved prior weakness;
      omitted selects all.
    owner: inventory-service external connections
    enum_source: algorithm_strength_filter
    types:
      - string
  strength_vocabulary_version:
    unit: vocabulary_discriminator
    direction: not_applicable
    unknown: "Required on historical external connection rows: 1 is original
      good/weak/unknown, 2 is canonical nullable strength."
    owner: inventory-service external connections
    values:
      - 1
      - 2
    types:
      - integer
