# Measurement-type registry — single source of truth for what a compliance
# control can measure (ADR-0005 D5, BUILD_PLAN workstream 3.6).
#
# A *measurement* is one scalar extracted from the inventory, about one subject,
# which a control's rule (threshold / presence / pattern / range) then judges.
# Until this file existed, the vocabulary lived twice: as a hand-written switch
# of 19 SQL blocks in the compliance-engine, and as a hand-written INSERT of 19
# rows in scripts/database/seed.sql. Nothing held the two together, and the SQL
# was the only place that knew what a code actually measured.
#
# The registry drives:
#   - services/compliance-engine/internal/services/measurement_registry_gen.go
#   - scripts/database/seed.sql  (1 generated region: the measurement_types rows)
#   both regenerated by `make generate`, drift-audited by `make audit`.
#
# There is NO SQL in this file, and there never may be. `measurement_types` has
# an `extraction_query` column that was never executed; ADR-0005 D5 drops it
# rather than honouring it, because SQL in a seeded row is an injection hazard
# and an upgrade hazard at once. What a row may declare instead is:
#
#   * a SHAPE — one of five whitelisted FROM/JOIN skeletons defined in Go
#     (services/compliance-engine/internal/services/measurement_shapes.go). The
#     shape owns the tables, the tenant and soft-delete predicates, the subject
#     id and the evidence columns. Adding a shape is a reviewed code change.
#   * a VALUE — the name of one *selectable* the shape offers: a column, or a
#     fixed SQL expression the shape defines. Never an expression written here.
#   * a WHERE — a QUERY-LANGUAGE predicate (QUERY_LANGUAGE.md) over the shape's
#     query target, compiled by shared/query against the production catalogue
#     into a parameterised clause. Field names are resolved against the
#     catalogue, so a typo is a generation-time error and no identifier from
#     this file ever reaches SQL.
#   * a TRANSFORM — one of a whitelisted set of pure Go functions applied to the
#     scanned value (`identity` by default).
#   * an EVIDENCE projection — which of the shape's selectables travel on the
#     finding, under which metadata key.
#
# Three-valued by construction. A measurement that yields no row is NOT
# ASSESSED, never "passed": a control over an absent fact scores nothing at all
# (rule_evaluator's reasonNothingInScope), which is the whole point of the
# `fact` and `finding` shapes below.
#
# Fields on a measurement type:
#   code               stable identifier; matches measurement_types.code and is
#                      what a control_measurements row resolves through
#   name               human label shown in the rule builder
#   description        what the scalar means, and what a rule over it asserts
#   data_type          integer | string | enum | date | boolean — the CHECK on
#                      measurement_types.data_type, and what the validator uses
#                      to decide which rule types are compatible
#   category           grouping in the rule builder
#   units              optional unit label
#   valid_range        optional {min,max} advisory range for numeric types
#   allowed_rule_types which of threshold/presence/pattern/range may target it
#   enum_values        closed value set, for `enum` types
#   valid_operators    threshold operators offered by the rule builder
#   subject            asset | certificate — the findings-registry subject type
#                      a violation is recorded against. Checked against the
#                      shape's own subject at generation time.
#   source             shape / value / where / transform / evidence, above,
#                      plus the per-shape bound parameters below.
#
# Per-shape `source` fields. Each names an entry in a Go whitelist — the
# generator checks only that it LOOKS like an identifier, so nothing from this
# file can ever reach SQL as text:
#
#   fact_key           `fact` shape only, and REQUIRED there: which asset_facts
#                      key the row extracts. Omitting it would extract over
#                      every key at once.
#   assessed_by        `finding` shape only, and REQUIRED there: the producer
#                      whose name must appear in `assets.risk_assessed_by`
#                      before the shape reports a count. This is the gate that
#                      keeps a producer which has NEVER RUN from reading as
#                      "zero findings, therefore compliant".
#   via                `finding` shape only, optional. Which findings belong to
#                      the asset:
#                        (omitted)          the subject IS the asset
#                        relationship       findings on `relationship` subjects
#                                           for edges the asset takes part in —
#                                           a relationship is not "under" either
#                                           end, so a control over orphan edges
#                                           has to reach them explicitly
#                        asset_or_endpoint  BOTH asset- and endpoint-subject
#                                           findings, for a kind a producer
#                                           raises at either granularity. The
#                                           `configuration` producer records
#                                           plaintext management on the asset
#                                           when an interrogation says so and on
#                                           the endpoint when one socket is the
#                                           plaintext service; a control reading
#                                           only one of them would report a
#                                           device with a live Telnet listener
#                                           as compliant.
#                      The whitelist is measurementFindingVias in
#                      measurement_shapes.go, and adding a value is a reviewed
#                      code change plus a golden regeneration. Every via must
#                      also be EXECUTED by a test —
#                      measurement_finding_via_integration_test.go — because the
#                      generator, the whitelist and the golden all check the
#                      statement without ever running it.
#   subject_where      a query-language predicate over the SUBJECT rows, as
#                      opposed to `where`, which narrows what is counted.
#   measured_at        which selectable (or `now`) dates the measurement.
#
# Adding a measurement type: add a row here, run `make generate`, commit the
# regenerated Go and seed region. If it needs a shape or a transform that does
# not exist, add it in Go first — that is deliberately the harder half.

version: 1

# The five shapes, defined in measurement_shapes.go. Listed here so this file is
# readable on its own; the generator checks every `source.shape` against Go.
shapes:
  - name: certificate
    subject: certificate
    target: certificate
    description: >-
      One row per LEAF certificate the tenant holds (is_ca_certificate = false;
      CA certificates are not the posture surface these controls describe).
      Subject is the certificate.
  - name: crypto_configuration
    subject: asset
    target: crypto_configuration
    description: >-
      One row per live crypto configuration of a live asset, with the endpoint
      it was observed on. Subject is the ASSET — the configurations travel in
      evidence.crypto_implementation_ids — because that is what the per-asset
      reconcile keys on.
  - name: asset
    subject: asset
    target: asset
    description: >-
      One row per live asset. The shape for inventory hygiene: attributes the
      asset either has or has not.
  - name: fact
    subject: asset
    target: asset
    description: >-
      One row per `asset_facts` row with the declared key, for a live asset,
      not past its expires_at. An asset with no such fact yields NO row, so a
      control over it reads as not assessed rather than as clean.
  - name: finding
    subject: asset
    target: finding
    description: >-
      One row per live asset whose `risk_assessed_by` records the declared
      producer, valued with the count of that producer's matching ACTIVE,
      unsuppressed findings. The producer gate is what keeps a producer that
      has NEVER RUN from reading as "zero findings, therefore compliant".

measurement_types:

  # ---------------------------------------------------------------------------
  # Certificate shape
  # ---------------------------------------------------------------------------

  - code: cert_expiration_days
    name: Certificate Expiration Days
    description: Number of days until certificate expiration
    data_type: integer
    category: certificate
    units: days
    valid_range: { min: 0, max: 36500 }
    allowed_rule_types: [threshold, range]
    valid_operators: ["<=", ">=", "<", ">", "==", "!="]
    subject: certificate
    source:
      shape: certificate
      value: expiration_days
      where: exists(not_after)
      transform: days_floor
      order_by: not_after_asc
      # When the measurement was TAKEN, not the certificate's not_after. Using
      # not_after stamped every finding's first_seen/last_seen with a future
      # date (CMP-10); it travels in the evidence instead.
      measured_at: now
      evidence:
        - { key: common_name, from: common_name }
        - { key: algorithm, from: public_key_algorithm }
        - { key: key_size, from: public_key_size }
        - { key: not_after, from: not_after, always: true }

  - code: key_size
    name: Key Size (RSA/DSA/DH)
    description: >-
      Cryptographic key size in bits for the finite-field family (RSA, DSA,
      Diffie-Hellman). Minimum 2048 bits (NIST SP 800-131A).
    data_type: integer
    category: certificate
    units: bits
    valid_range: { min: 0, max: 16384 }
    allowed_rule_types: [threshold, range]
    valid_operators: ["<=", ">=", "<", ">", "==", "!="]
    subject: certificate
    source:
      shape: certificate
      value: public_key_size
      where: exists(key_size)
      # A key size is only meaningful against the floor for its own family, so
      # the row filter routes each certificate to exactly one of key_size /
      # key_size_ec and emits neither when the algorithm cannot be classified
      # (CMP-4: not assessed beats wrongly assessed).
      row_filter: key_family_finite_field
      evidence:
        - { key: common_name, from: common_name }
        - { key: algorithm, from: public_key_algorithm }
        - { key: key_family, const: finite_field }

  - code: key_size_ec
    name: Key Size (Elliptic Curve)
    description: >-
      Cryptographic key size in bits for the elliptic-curve family (ECDSA,
      EdDSA, X25519). Minimum 256 bits — equivalent to 128-bit classical
      security, above the RSA-2048 floor.
    data_type: integer
    category: certificate
    units: bits
    valid_range: { min: 0, max: 1024 }
    allowed_rule_types: [threshold, range]
    valid_operators: ["<=", ">=", "<", ">", "==", "!="]
    subject: certificate
    source:
      shape: certificate
      value: public_key_size
      where: exists(key_size)
      row_filter: key_family_elliptic_curve
      evidence:
        - { key: common_name, from: common_name }
        - { key: algorithm, from: public_key_algorithm }
        - { key: key_family, const: elliptic_curve }

  - code: cert_algorithm
    name: Certificate Algorithm
    description: Public key algorithm used in certificate (RSA, ECDSA, EdDSA, etc.)
    data_type: enum
    category: certificate
    allowed_rule_types: [pattern, presence]
    enum_values: [RSA, ECDSA, EdDSA, DSA]
    subject: certificate
    source:
      shape: certificate
      value: public_key_algorithm
      where: exists(key_algorithm)
      evidence:
        - { key: common_name, from: common_name }
        - { key: key_size, from: public_key_size }

  - code: cert_pqc_status
    name: Certificate PQC Status
    description: >-
      Post-quantum readiness of a certificate public-key algorithm:
      quantum_vulnerable (classical RSA/ECDSA/EdDSA/DSA/DH) or quantum_safe
      (NIST PQC: ML-KEM/ML-DSA/SLH-DSA).
    data_type: enum
    category: certificate
    allowed_rule_types: [pattern, presence]
    enum_values: [quantum_vulnerable, quantum_safe]
    subject: certificate
    source:
      shape: certificate
      value: public_key_algorithm
      # Deliberately unfiltered: a certificate whose algorithm we could not read
      # is not provably post-quantum, and classifyPQCAlgorithm answers
      # quantum_vulnerable for it. Absent is not safe.
      transform: pqc_class
      evidence:
        - { key: common_name, from: common_name }
        - { key: algorithm, from: public_key_algorithm }

  - code: cert_sig_pqc_status
    name: Certificate Signature PQC Status
    description: >-
      Post-quantum readiness of the algorithm a certificate was SIGNED with (the
      CA's signature): quantum_vulnerable (classical RSA/ECDSA/EdDSA/DSA) or
      quantum_safe (NIST PQC: ML-DSA/SLH-DSA/FN-DSA).
    data_type: enum
    category: certificate
    allowed_rule_types: [pattern, presence]
    enum_values: [quantum_vulnerable, quantum_safe]
    subject: certificate
    source:
      shape: certificate
      value: signature_algorithm
      where: exists(signature_alg)
      transform: pqc_class
      evidence:
        - { key: signature_algorithm, from: signature_algorithm, always: true }
        - { key: common_name, from: common_name }

  - code: cert_validity_days
    name: Certificate Validity Period (days)
    description: >-
      Total validity period of a certificate in days (not_after - not_before);
      distinct from days-until-expiry. Flags over-long certificate lifetimes
      (CA/Browser Forum max validity is trending toward 47 days).
    data_type: integer
    category: certificate
    units: days
    valid_range: { min: 0, max: 36500 }
    allowed_rule_types: [threshold, range]
    valid_operators: ["<=", ">=", "<", ">", "==", "!="]
    subject: certificate
    source:
      shape: certificate
      value: validity_days
      where: exists(not_after) and exists(not_before)
      transform: days_trunc
      evidence:
        - { key: common_name, from: common_name }

  - code: certificate_chain_valid
    name: Certificate Chain Valid
    description: Whether the certificate chain is valid and trusted
    data_type: boolean
    category: certificate
    allowed_rule_types: [presence]
    subject: certificate
    source:
      shape: certificate
      value: is_self_signed
      transform: chain_valid
      evidence:
        - { key: common_name, from: common_name }
        - { key: issuer_dn, from: issuer_dn }

  # ---------------------------------------------------------------------------
  # Crypto-configuration shape
  # ---------------------------------------------------------------------------

  - code: tls_version
    name: TLS Protocol Version
    description: TLS protocol version (TLS1.0, TLS1.1, TLS1.2, TLS1.3)
    data_type: enum
    category: tls
    units: version
    allowed_rule_types: [pattern, presence]
    enum_values: ["TLS1.0", "TLS1.1", "TLS1.2", "TLS1.3"]
    subject: asset
    source:
      shape: crypto_configuration
      value: protocol_version
      where: protocol:TLS and exists(protocol_version)
      evidence:
        - { group: endpoint }

  - code: key_exchange_algorithm
    name: Key Exchange Algorithm
    description: Key exchange algorithm used in TLS (ECDHE, DHE, RSA, ECDH, DH, NULL)
    data_type: enum
    category: cipher
    allowed_rule_types: [pattern, presence]
    enum_values: [ECDHE, DHE, RSA, ECDH, DH, "NULL"]
    subject: asset
    source:
      shape: crypto_configuration
      value: key_exchange_algorithm
      where: exists(key_exchange)
      evidence:
        - { group: endpoint }
        - { key: cipher_suite, from: cipher_suite }

  - code: symmetric_encryption
    name: Symmetric Encryption Algorithm
    description: Symmetric encryption algorithm (AES-128-GCM, AES-256-GCM, ChaCha20-Poly1305, etc.)
    data_type: enum
    category: cipher
    allowed_rule_types: [pattern, presence]
    enum_values:
      [AES-128-GCM, AES-256-GCM, AES-128-CBC, AES-256-CBC, ChaCha20-Poly1305, 3DES, DES, RC4]
    subject: asset
    source:
      shape: crypto_configuration
      value: symmetric_encryption
      where: exists(symmetric_algorithm)
      evidence:
        - { group: endpoint }
        - { key: cipher_suite, from: cipher_suite }

  - code: hash_algorithm
    name: Hash Algorithm
    description: Hash algorithm used in cipher suite (SHA256, SHA384, SHA512, SHA1, MD5)
    data_type: enum
    category: cipher
    allowed_rule_types: [pattern, presence]
    enum_values: [SHA256, SHA384, SHA512, SHA1, MD5]
    subject: asset
    source:
      shape: crypto_configuration
      value: hash_algorithm
      where: exists(hash_algorithm)
      evidence:
        - { group: endpoint }
        - { key: cipher_suite, from: cipher_suite }

  - code: cipher_suite_name
    name: Cipher Suite Name
    description: Full cipher suite name (e.g., TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384)
    data_type: string
    category: cipher
    allowed_rule_types: [pattern, presence]
    subject: asset
    source:
      shape: crypto_configuration
      value: cipher_suite
      where: exists(cipher_suite)
      evidence:
        - { group: endpoint }

  - code: pfs_support
    name: Perfect Forward Secrecy Support
    description: Whether the connection supports Perfect Forward Secrecy (PFS)
    data_type: boolean
    category: tls
    allowed_rule_types: [presence]
    subject: asset
    source:
      shape: crypto_configuration
      value: key_exchange_algorithm
      where: exists(key_exchange)
      transform: pfs
      evidence:
        - { key: key_exchange_algorithm, from: key_exchange_algorithm, always: true }
        - { group: endpoint }

  - code: tls_compression_enabled
    name: TLS Compression Enabled
    description: >-
      Whether TLS compression is enabled (should be disabled: CRIME). Read from
      the probe record, three-valued — a configuration whose probe did not
      record compression yields no measurement and is reported as not assessed,
      never as "compression disabled".
    data_type: boolean
    category: tls
    allowed_rule_types: [presence]
    subject: asset
    source:
      shape: crypto_configuration
      value: tls_compression
      where: protocol:TLS
      evidence:
        - { group: endpoint }

  - code: ot_protocol_encryption
    name: OT Protocol Encryption
    description: >-
      Encryption status of an industrial / OT protocol session (Modbus, DNP3,
      MMS, ICCP, BACnet, EtherNet/IP). Returns the literal string "absent" when
      the protocol carries no cryptographic protection (a high-severity finding
      for OT cryptographic audits) and "present" when crypto is observed.
    data_type: enum
    category: ot
    allowed_rule_types: [pattern]
    enum_values: [absent, present]
    subject: asset
    source:
      shape: crypto_configuration
      # The protocol set must stay in sync with the OT entries of the
      # protocol_type enum; it is a closed value set in the query catalogue, so
      # a protocol that leaves the enum fails generation here rather than
      # silently matching nothing.
      where: >-
        protocol in (Modbus, DNP3, MMS, ICCP, BACnet, BACnet_SC, EtherNet_IP,
        OPC_UA, HART_IP, S7)
      value: ot_encryption_state
      evidence:
        - { key: protocol, from: protocol, always: true }
        - { group: endpoint }
        - { key: cipher_suite, from: cipher_suite_coalesced }

  - code: config_kex_pqc_status
    name: Config Key-Exchange PQC Status
    description: >-
      Post-quantum readiness of a crypto-config key-exchange algorithm:
      quantum_vulnerable (classical RSA/ECDH/DH) or quantum_safe (NIST PQC
      ML-KEM or a hybrid such as X25519MLKEM768). The most urgent PQC control —
      harvest-now-decrypt-later exposure.
    data_type: enum
    category: cipher
    allowed_rule_types: [pattern, presence]
    enum_values: [quantum_vulnerable, quantum_safe]
    subject: asset
    source:
      shape: crypto_configuration
      value: key_exchange_algorithm
      where: exists(key_exchange)
      transform: pqc_class
      evidence:
        - { key: algorithm, from: key_exchange_algorithm, always: true }
        - { group: endpoint }
        - { key: cipher_suite, from: cipher_suite }

  - code: config_sig_pqc_status
    name: Config Signature PQC Status
    description: >-
      Post-quantum readiness of a crypto-config signature/authentication
      algorithm: quantum_vulnerable (classical RSA/ECDSA/EdDSA) or quantum_safe
      (NIST PQC: ML-DSA/SLH-DSA/FN-DSA).
    data_type: enum
    category: cipher
    allowed_rule_types: [pattern, presence]
    enum_values: [quantum_vulnerable, quantum_safe]
    subject: asset
    source:
      shape: crypto_configuration
      value: signature_algorithm
      where: exists(signature_algorithm)
      transform: pqc_class
      evidence:
        - { key: algorithm, from: signature_algorithm, always: true }
        - { group: endpoint }
        - { key: cipher_suite, from: cipher_suite }

  - code: config_sym_strength
    name: Config Symmetric Quantum Margin
    description: >-
      Quantum strength margin of a crypto-config symmetric cipher: quantum_safe
      (AES-192/256 or ChaCha20, retain >=128-bit security under Grover) or
      quantum_marginal (AES-128 and weaker, below the post-quantum / CNSA 2.0
      margin). Advisory.
    data_type: enum
    category: cipher
    allowed_rule_types: [pattern, presence]
    enum_values: [quantum_safe, quantum_marginal]
    subject: asset
    source:
      shape: crypto_configuration
      value: symmetric_encryption
      where: exists(symmetric_algorithm)
      transform: symmetric_margin
      evidence:
        - { key: symmetric_encryption, from: symmetric_encryption, always: true }
        - { group: endpoint }
        - { key: cipher_suite, from: cipher_suite }

  # ---------------------------------------------------------------------------
  # Asset shape — inventory hygiene (ADR-0005 D5; the `hygiene` producer's
  # no_owner / no_class / no_location / stale kinds as direct predicates, since
  # the producer itself is workstream 3.5)
  # ---------------------------------------------------------------------------

  - code: asset_has_owner
    name: Asset Has Owner
    description: >-
      Whether a monitored asset names someone accountable for it — an
      owner_email or a support_group. Mirrors the hygiene producer's `no_owner`
      finding: an asset with neither is an asset nobody can be asked about.
    data_type: boolean
    category: hygiene
    allowed_rule_types: [presence]
    subject: asset
    source:
      shape: asset
      value: owner_present
      where: status:monitoring
      evidence:
        - { group: asset }
        - { key: owner_email, from: owner_email }
        - { key: support_group, from: support_group }

  - code: asset_class
    name: Asset Class
    description: >-
      The asset's class key from the platform taxonomy. `unknown_host` is the
      placeholder the classifier assigns when it could not decide, and an
      unclassified asset is invisible to class facets and to any class-scoped
      policy (the hygiene producer's `no_class` finding).
    data_type: string
    category: hygiene
    allowed_rule_types: [pattern, presence]
    subject: asset
    source:
      shape: asset
      value: class_key
      where: status:monitoring
      evidence:
        - { group: asset }

  - code: asset_has_location
    name: Asset Has Location
    description: >-
      Whether a monitored asset records where it is — a site, region, zone or a
      location row. Mirrors the hygiene producer's `no_location` finding.
    data_type: boolean
    category: hygiene
    allowed_rule_types: [presence]
    subject: asset
    source:
      shape: asset
      value: location_present
      where: status:monitoring
      evidence:
        - { group: asset }
        - { key: site, from: site }
        - { key: region, from: region }

  - code: last_seen_days
    name: Days Since Last Seen
    description: >-
      Days since any collector last observed the asset. The hygiene producer's
      `stale` ladder starts at 30 days; a record nothing has confirmed for
      longer is the main way an inventory silently becomes wrong.
    data_type: integer
    category: hygiene
    units: days
    valid_range: { min: 0, max: 36500 }
    allowed_rule_types: [threshold, range]
    valid_operators: ["<=", ">=", "<", ">", "==", "!="]
    subject: asset
    source:
      shape: asset
      value: last_seen_days
      where: status:monitoring
      transform: days_floor
      measured_at: now
      evidence:
        - { group: asset }
        - { key: last_seen_at, from: last_seen_at, always: true }

  # ---------------------------------------------------------------------------
  # Finding shape — one producer's judgements, counted per asset
  # ---------------------------------------------------------------------------

  - code: duplicate_suspected_count
    name: Suspected Duplicate Count
    description: >-
      How many open `duplicate_suspected` findings the hygiene producer holds
      against this asset — two records sharing an identifier that the
      identification engine would not merge on its own. Zero is the compliant
      value. An asset the hygiene producer has never evaluated yields NO
      measurement and is reported as not assessed, never as clean.
    data_type: integer
    category: hygiene
    units: findings
    valid_range: { min: 0, max: 1000 }
    allowed_rule_types: [threshold, range]
    valid_operators: ["<=", ">=", "<", ">", "==", "!="]
    subject: asset
    source:
      shape: finding
      assessed_by: hygiene
      value: finding_count
      where: producer:hygiene and kind:duplicate_suspected
      subject_where: status:monitoring
      measured_at: now
      evidence:
        - { group: asset }

  - code: orphan_relationship_count
    name: Orphan Relationship Count
    description: >-
      How many open `orphan_relationship` findings the hygiene producer holds
      against relationships this asset takes part in — edges pointing at an
      asset that has been archived or deleted. Zero is the compliant value;
      an asset the producer has never evaluated is not assessed.
    data_type: integer
    category: hygiene
    units: findings
    valid_range: { min: 0, max: 1000 }
    allowed_rule_types: [threshold, range]
    valid_operators: ["<=", ">=", "<", ">", "==", "!="]
    subject: asset
    source:
      shape: finding
      assessed_by: hygiene
      via: relationship
      value: finding_count
      where: producer:hygiene and kind:orphan_relationship
      subject_where: status:monitoring
      measured_at: now
      evidence:
        - { group: asset }

  # NOT ASSESSED ANYWHERE TODAY, and deliberately so. The finding shape reports
  # a count only for an asset whose `risk_assessed_by` names the producer, and
  # the `configuration` producer does not write that entry: all three of its
  # kinds feed risk, so claiming coverage before the cross-producer risk
  # recompute (workstream 3.2) would render an asset with an open HIGH
  # plaintext_management finding as "assessed, Informational" — score 0 WITH a
  # producer present is how the product says "somebody looked and found
  # nothing". The entry lands with 3.2's recompute and this measurement starts
  # answering then; until it does the control reads NOT ASSESSED, which is the
  # honest half of a three-valued answer. See the "Risk coverage" section on
  # services/inventory-service/internal/producers/configuration.go.
  - code: mgmt_plaintext
    name: Plaintext Management Findings
    description: >-
      How many open `plaintext_management` findings this asset carries — a
      management plane reached over Telnet, FTP, SNMP v1/v2c or another protocol
      with no transport confidentiality. Zero is the compliant value. An asset
      the configuration producer has never evaluated yields NO measurement and
      is reported as not assessed, never as clean. Counts findings on the asset
      itself and on its endpoints, so a device with a live Telnet listener
      cannot read as compliant because the finding was recorded against the
      socket rather than the host.
    data_type: integer
    category: configuration
    units: findings
    valid_range: { min: 0, max: 1000 }
    allowed_rule_types: [threshold, range]
    valid_operators: ["<=", ">=", "<", ">", "==", "!="]
    subject: asset
    source:
      shape: finding
      assessed_by: configuration
      via: asset_or_endpoint
      value: finding_count
      where: producer:configuration and kind:plaintext_management
