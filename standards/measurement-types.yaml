  # ---------------------------------------------------------------------------
  # Fact shape — lifecycle, over the platform-resolved eol.* facts
  # ---------------------------------------------------------------------------

  - code: os_eol_days
    name: Days Until OS End of Life
    description: >-
      Days until the end-of-life date the EOL catalogue resolved for this
      asset's operating system (`eol.os.date`). Negative once the date has
      passed. An asset with no resolved date yields NO measurement — an OS the
      catalogue does not cover is not assessed, not supported.
    data_type: integer
    category: lifecycle
    units: days
    valid_range: { min: -36500, max: 36500 }
    allowed_rule_types: [threshold, range]
    valid_operators: ["<=", ">=", "<", ">", "==", "!="]
    subject: asset
    source:
      shape: fact
      fact_key: eol.os.date
      value: fact_value
      where: status:monitoring
      transform: days_until_date
      measured_at: now
      evidence:
        - { group: asset }
        - { key: eol_date, from: fact_value, always: true }
        - { key: fact_source, from: fact_source_ref }

  - code: software_eol_days
    name: Days Until Software End of Life
    description: >-
      Days until the end-of-life date the EOL catalogue resolved for an
      installed software product on this asset (`eol.sw.date`). Negative once
      the date has passed. One measurement per resolved date; an asset with
      none is not assessed.
    data_type: integer
    category: lifecycle
    units: days
    valid_range: { min: -36500, max: 36500 }
    allowed_rule_types: [threshold, range]
    valid_operators: ["<=", ">=", "<", ">", "==", "!="]
    subject: asset
    source:
      shape: fact
      fact_key: eol.sw.date
      value: fact_value
      where: status:monitoring
      transform: days_until_date
      measured_at: now
      evidence:
        - { group: asset }
        - { key: eol_date, from: fact_value, always: true }
        - { key: fact_source, from: fact_source_ref }

  - code: hardware_eos_days
    name: Days Until Hardware End of Support
    description: >-
      Days until the end-of-SUPPORT date the EOL catalogue resolved for this
      asset's hardware (`eol.hw.date`) — the date after which the vendor ships
      no more firmware fixes, not the date it stopped selling it. Negative once
      the date has passed; hardware the catalogue does not cover is not
      assessed.
    data_type: integer
    category: lifecycle
    units: days
    valid_range: { min: -36500, max: 36500 }
    allowed_rule_types: [threshold, range]
    valid_operators: ["<=", ">=", "<", ">", "==", "!="]
    subject: asset
    source:
      shape: fact
      fact_key: eol.hw.date
      value: fact_value
      where: status:monitoring
      transform: days_until_date
      measured_at: now
      evidence:
        - { group: asset }
        - { key: eos_date, from: fact_value, always: true }
        - { key: fact_source, from: fact_source_ref }
