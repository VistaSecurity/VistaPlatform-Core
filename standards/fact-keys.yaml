# Fact-key registry — single source of truth for the namespaced keys that may
# appear in `asset_facts.key` (ADR-0005 D2, ADR-0004 D1/D3).
#
# A *fact* is a statement about a subject with provenance — "this server runs
# Ubuntu 22.04, measured by agent X at T". Facts are not judgements; a
# judgement is a finding (standards/findings-registry.yaml). `asset_facts` is
# the extensible key-value store beside the typed columns, unique per
# (asset, key, source_ref) so two collectors may hold different values for the
# same key and the reconciliation precedence chooses the displayed one.
#
# Registering a key here is what lets the UI, the compliance extractor, the
# query language and the export all know the type of a value they have never
# seen before. An unregistered key is rejected at write time — there is no
# CHECK constraint, so facts.ValidateValue is the enforcement point.
#
# The registry drives:
#   - shared/facts/keys_gen.go (Go constants and definitions)
#   - packages/primitives/src/facts/keys.gen.ts (TS union and definitions)
#   both regenerated by `make generate`, drift-audited by `make audit`.
#
# Fields:
#   key          the namespaced key, `namespace.name` (dots, lower snake)
#   type         string | integer | boolean | date | array | object
#   enum         scalar keys only: the closed set of permitted values
#   item_schema  array and object keys: a JSON-schema fragment describing an
#                array element (for arrays) or the value itself (for objects).
#                It is documentation and validation vocabulary, not a runtime
#                validator — ValidateValue type-checks the container; the
#                producer owns the shape of what it puts inside.
#   description  what the fact states, and how it is measured
#   producers    which collectors may write this key. A collector writing a key
#                it is not listed for is a bug: it means two subsystems disagree
#                about who owns a fact, which is how the same key ends up with
#                two meanings.
#   status       optional: `active` (the default) or `retired`. A retired key
#                stays registered — older collectors still send it, and rows
#                already written keep their meaning — but the data it carried
#                now has a model of its own, and the platform stops STORING it
#                as a fact from the producers the reason names. `retired`
#                requires `retired_reason`: what replaced it, and which writes
#                stopped when.
#   retired_reason
#                required with `status: retired`, refused without it.
#   redact       whether the value must be masked in exports, logs and AI
#                prompts. Must be stated explicitly on every key — a new key
#                cannot inherit "not sensitive" by omission. Nothing at launch
#                is redacted, because nothing here is key material: we collect
#                posture, never secrets (CLAUDE.md). The flag exists so that a
#                key which ever does carry something sensitive has to say so.
#
# Adding a key: edit this file, run `make generate`, commit the regenerated Go
# and TS. `make audit` fails if they drift.

version: 1

# Collectors permitted to write facts. Every key's `producers` list is drawn
# from this vocabulary.
producers:
  - sensor                # the standalone libpcap sensor on a customer network
  - platform-sensor       # cluster-sensor-service, the in-cluster equivalent
  - device-agent          # the agent binary, local host mode and remote mode
  - device-interrogation  # device-interrogation-service, command-driven
  - cloud-collector       # AWS / Azure / GCP inventory collectors
  - connector             # external systems (CMDB, NetBox, ITSM, EDR/MDM)
  - import                # spreadsheet / CSV import
  - sbom                  # SBOM ingest
  - enricher              # platform-side catalogue resolution (EOL, CPE)

keys:
  # --- os.* : operating system, as the host reports it -----------------------
  - key: os.name
    type: string
    description: >-
      Operating-system product name as the host reports it, normalised to the
      vendor's own spelling ("Ubuntu", "Windows Server 2022", "IOS-XE").
      Resolved against the EOL catalogue together with os.version.
    producers: [device-agent, device-interrogation, cloud-collector, connector, import]
    redact: false

  - key: os.version
    type: string
    description: >-
      Operating-system version string as reported ("22.04.3 LTS", "17.09.04a").
      Kept verbatim rather than parsed: the catalogue match is by product plus
      version, and reformatting loses the vendor's own release identity.
    producers: [device-agent, device-interrogation, cloud-collector, connector, import]
    redact: false

  - key: os.kernel
    type: string
    description: >-
      Kernel or build identifier beneath the OS version ("6.8.0-45-generic",
      "10.0.20348.2402"). Distinct from os.version: a patched kernel on an
      unchanged distribution release is exactly the difference that matters to
      a vulnerability match.
    producers: [device-agent]
    redact: false

  - key: os.eol_date
    type: date
    description: >-
      End-of-life date for this OS release as DECLARED by the source — a vendor
      field on an imported record, or a connector's own lifecycle data. The
      platform's own catalogue-resolved answer is eol.os.date; keeping them
      apart is what lets the UI say whether a date was asserted by the customer
      or derived by us.
    producers: [connector, import]
    redact: false

  # --- hw.* : hardware identity ---------------------------------------------
  - key: hw.vendor
    type: string
    description: >-
      Hardware manufacturer ("Dell Inc.", "Cisco Systems", "Siemens"). Seeded
      by DMI on hosts, by sysObjectID or LLDP on network gear, and — when
      nothing better is available — by OUI lookup of the MAC, which the
      platform performs at ingestion against the full IEEE registry
      (enricher). The sensors no longer resolve it; an older sensor binary may
      still send its own table's answer, which the platform's supersedes.
    producers: [device-agent, device-interrogation, sensor, platform-sensor, connector, import, enricher]
    redact: false

  - key: hw.model
    type: string
    description: >-
      Hardware model or product name ("PowerEdge R650", "Catalyst 9300-48P").
      With hw.vendor this is the key into the hardware end-of-support
      catalogue. The passive sensors write it only from a frame that states a
      model as a FIELD — the CDP platform TLV, the LLDP-MED inventory
      model-name TLV — never from a free-text banner, because a model guessed
      out of prose would silently poison the end-of-support join.
    producers: [device-agent, device-interrogation, connector, import, sensor, platform-sensor]
    redact: false

  - key: hw.serial
    type: string
    description: >-
      Manufacturer serial number. A strong identifier for the identification
      engine and the usual join key to a CMDB or an asset-management system.
      Identifying but not secret — redacting it would break identity matching
      and the CMDB sync, which is the whole point of collecting it.
    producers: [device-agent, device-interrogation, cloud-collector, connector, import]
    redact: false

  - key: hw.uuid
    type: string
    description: >-
      System UUID (SMBIOS / DMI on hosts, instance UUID in a hypervisor or
      cloud). The most reliable hardware identifier where it exists, and the
      one that survives a rename or a re-address.
    producers: [device-agent, cloud-collector, connector]
    redact: false

  - key: hw.firmware_version
    type: string
    description: >-
      BIOS, UEFI, or device firmware version. Separate from os.version because
      on an appliance or an OT device the firmware IS the software, and it is
      what a vendor advisory names.
    producers: [device-agent, device-interrogation]
    redact: false

  # --- net.* : network posture ----------------------------------------------
  - key: net.uptime_seconds
    type: integer
    description: >-
      Seconds since last boot, as reported. Read as a freshness and a patching
      signal: a device up for 400 days has not taken a kernel update.
    producers: [device-agent, device-interrogation]
    redact: false

  - key: net.interfaces
    type: array
    item_schema:
      type: object
      properties:
        name: { type: string, description: "interface name as the device calls it (eth0, GigabitEthernet1/0/1)" }
        mac: { type: string, description: "MAC address, lower-case colon-separated" }
        addresses:
          type: array
          items: { type: string }
          description: "assigned IP addresses in CIDR form"
        static_addresses:
          type: array
          items: { type: string }
          description: >-
            The subset of `addresses` the host's own configuration reports as
            statically configured (Linux: no lease lifetime; Windows:
            PrefixOrigin/SuffixOrigin Manual; macOS: ConfigMethod Manual),
            spelled exactly as in `addresses`. A pinned address matches its
            asset even inside a segment flagged DHCP. An address in
            neither this list nor `dynamic_addresses` is unknown.
        dynamic_addresses:
          type: array
          items: { type: string }
          description: >-
            The subset of `addresses` the host reports as leased — DHCP, or a
            router advertisement (SLAAC) — spelled exactly as in `addresses`.
        vlan: { type: integer, description: "access or native VLAN id, where the device reports one" }
        state: { type: string, enum: [up, down, unknown], description: "operational state" }
        admin_state:
          type: string
          enum: [up, down, testing, unknown]
          description: >-
            Administrative state, where the device reports one separately from
            the operational state (SNMP ifAdminStatus, a shut interface). An
            interface that is down because someone shut it is a different fact
            from one that is down because the link failed, and collapsing them
            into `state` loses the only half an operator can act on.
        speed: { type: integer, description: "negotiated speed in Mbit/s, 0 when unknown" }
        mtu: { type: integer, description: "MTU in bytes, where the device reports one" }
        kind: { type: string, description: "the OS's kind for a software interface: vlan, bond, team, bridge" }
        parent: { type: string, description: "a VLAN sub-interface's lower device" }
        lag: { type: string, description: "the bond or team the interface is a member of" }
        type: { type: string, description: "interface-type registry key (1000base-t, 10gbase-x-sfpp, lag, bridge, ieee802.11ac, …), where the device states one" }
        mode: { type: string, enum: [access, tagged, tagged-all], description: "802.1Q mode, where the device reports one" }
        tagged_vlans:
          type: array
          items: { type: integer }
          description: "VLAN ids the interface trunks, beside its untagged `vlan`"
      required: []
    description: >-
      Every network interface the device has, with its addresses and state.
      The authoritative addresses for an asset are its endpoints; this fact is
      the interface-level view an operator expects on a device page, including
      the down and unaddressed ones an endpoint row would never show.
      Item fields beyond the original shape, sent by the device agent since
      DCIM row 1.5a: `mtu`, `kind` (vlan / bond / team / bridge), `parent`
      (a VLAN sub-interface's lower device) and `lag` (the bond it is a
      member of). Sent by the UniFi collector since row 1.5b: `type`, `mode`
      and `tagged_vlans`, and an item with NO name — a client a controller
      lists, whose own name for its interface the controller does not know
      (its MAC and address become identifiers on a synthetic interface).
    producers: [device-agent, device-interrogation, cloud-collector]
    redact: false
    status: retired
    retired_reason: >-
      Interfaces and their addresses are modelled (DCIM row 1.2/1.3,
      ADR-0010 D3): `interfaces`, `ip_addresses`, `mac_addresses`, written by
      the identity engine from a sighting's identity.ObservedInterfaces. Since
      row 1.5a the platform no longer stores this fact for HOSTS — the device
      agent still sends the list in this shape on the wire, and
      device-interrogation-service turns it into observed interfaces. The
      generic SNMP stopped in row 1.5d (its interfaces, addresses and VLANs
      travel as InterrogateResult.Network), and so did the Cisco, Palo Alto,
      Fortinet and F5 collectors in row 1.5c. Since row 1.5b it is not stored
      for anything a UniFi controller reports either — a managed device's
      interfaces or a client's address (every SUBJECT-bound net.interfaces):
      the list rides on that subject's sighting. Cloud enumeration stopped in
      row 1.5f (an ENI is an observed `virtual` interface). No platform
      collector writes it any more; the key stays registered for older
      collectors and for rows already stored.

  - key: net.neighbors
    type: array
    item_schema:
      type: object
      properties:
        protocol: { type: string, enum: [lldp, cdp, arp], description: "how the neighbour was learned" }
        remote_name: { type: string, description: "neighbour system name as advertised" }
        remote_port: { type: string, description: "neighbour port identifier" }
        remote_mac: { type: string, description: "neighbour MAC address" }
        remote_address: { type: string, description: "neighbour IP address" }
        local_port: { type: string, description: "local interface the neighbour was seen on" }
      required: [protocol]
    description: >-
      Directly-attached neighbours learned from LLDP, CDP or the ARP table.
      This is the raw observation; the connected-to relationships built from it
      are edges in asset_relationships, and go through approval like any other
      inferred fact.
    producers: [device-agent, device-interrogation, sensor, platform-sensor]
    redact: false

  - key: net.mdns_services
    type: array
    item_schema:
      type: string
      description: >-
        DNS-SD service type in the two-label form the protocol uses,
        "_service._proto" — "_ipp._tcp", "_airplay._tcp", "_workstation._tcp".
    description: >-
      Service types the host advertises over multicast DNS, as observed
      passively. The single strongest passive class signal on a modern LAN: a
      device announcing _ipp._tcp is a printer, _airplay._tcp is a media
      endpoint, _workstation._tcp is a desktop. Service TYPES only — never the
      instance name, never the TXT record, and never the port, because those
      carry user-chosen strings ("Bob's MacBook", a print job title) that are
      about a person rather than an asset.
    producers: [sensor, platform-sensor]
    redact: false

  - key: net.vlans
    type: array
    item_schema:
      type: object
      properties:
        id:
          type: integer
          description: >-
            802.1Q VLAN id. Absent on an untagged network — a controller's
            default LAN has a name, a prefix and a gateway but no tag, and
            inventing 0 or 1 for it would assert a tag nobody configured.
        name: { type: string, description: "VLAN name as configured" }
        subnet: { type: string, description: "associated prefix in CIDR form, where the device declares one" }
        gateway:
          type: string
          description: >-
            The device's own address on this network, where it declares one.
            Read at ingest: with a subnet, the address becomes a claimed
            identifier of the device, and the device becomes the gateway of
            every prefix where it holds it (prefixes.gateway_*, via
            inventory-service's internal gateway-links route, which takes the
            run's complete list so a network no longer reported is unlinked).
            An entry without a subnet is skipped.
        dhcp_enabled: { type: boolean, description: "whether the device serves DHCP on this network" }
        dhcp_range_configured:
          type: boolean
          description: >-
            Whether a DHCP pool is configured on this network. The RANGE itself,
            and every DHCP option beside it, are deliberately not collected:
            they are the operator's addressing plan and the network's name
            servers, boot servers and domain — an attacker's map of the network
            — and nothing in the inventory reads them. Whether the network hands
            out addresses at all is what tells a reader an unmanaged device
            could appear on it.
        purpose:
          type: string
          description: >-
            What the network is for, as the controller states it (UniFi:
            corporate, guest, vlan-only) — the prefix's network type.
      required: []
    description: >-
      VLANs the device knows about — configured on a switch or controller,
      tagged on a host trunk. The seed for VLANs and prefixes: a VLAN here
      with a prefix becomes a pending prefix, approved like any other proposal.
      Since DCIM row 1.5b a UniFi controller's networks are recorded as the
      tenant's PREFIXES and VLANs directly (the list rides on the site
      gateway's sighting, bound to it as the fact's subject, with each
      network's `purpose`), and no UniFi net.vlans is stored as a fact.
      Since row 1.5c the Cisco, Palo Alto, Fortinet and F5 collectors no
      longer emit it: their VLANs and connected prefixes are `vlans` and
      `prefixes` objects, written by the identity engine.
    producers: [device-interrogation, connector]
    redact: false

  - key: net.route_next_hop_count
    type: integer
    description: >-
      How many DISTINCT next hops the device's routing table forwards through.
      A summary, and deliberately the only thing recorded about routing
      (ADR-0004 D1: "routes summarised as next-hop count"). The prefixes and
      the next-hop addresses themselves are never stored — a routing table is
      a map of the customer's network for anyone who reaches our database, and
      nothing in the inventory reads one. The count is what says whether a
      device is an edge with one default route or a core router with forty
      paths, which is the part an inventory can act on.
    producers: [device-interrogation]
    redact: false

  # --- cloud.* : cloud placement --------------------------------------------
  - key: cloud.provider
    type: string
    enum: [aws, azure, gcp, other]
    description: >-
      Which cloud the resource lives in. `other` covers a provider the platform
      has no collector for but a connector or an import can still name — an
      honest "somewhere else", rather than silently forcing it into one of the
      three we support.
    producers: [cloud-collector, connector, import]
    redact: false

  - key: cloud.account_id
    type: string
    description: >-
      Account, subscription or project identifier that owns the resource (AWS
      account id, Azure subscription id, GCP project id). Identifying, not
      secret: it appears in every ARN and is what an operator uses to find the
      resource in their own console.
    producers: [cloud-collector, connector, import]
    redact: false

  - key: cloud.region
    type: string
    description: >-
      Provider region or location as the provider names it ("us-east-1",
      "westeurope", "europe-west4"). Not normalised across providers — the
      operator searches for the string their console shows.
    producers: [cloud-collector, connector, import]
    redact: false

  - key: cloud.resource_id
    type: string
    description: >-
      The provider's own identifier for the resource — an ARN, an Azure
      resource id, a GCP self-link or an instance id. The identity a cloud
      asset is deduplicated on, and the link back into the provider's console.
    producers: [cloud-collector, connector]
    redact: false

  - key: cloud.vpc_id
    type: string
    description: >-
      Identifier of the VPC, VNet or network the resource sits in. The cloud
      analogue of a VRF, and what makes "which of these instances
      share a network" answerable without an agent.
    producers: [cloud-collector, connector]
    redact: false
    status: retired
    retired_reason: >-
      A cloud network is an IPAM object now (asset-inventory ADR-0009
      amendment, DCIM row 1.5f): the VPC / VNet / GCP network is a container
      prefix and its child prefixes are prefixes, each carrying the network's
      provider id in `prefixes.cloud_network_ref`, and an instance's private
      addresses are `ip_addresses` on its ENI interfaces. Which network a
      resource sits in is answered by prefix containment of its addresses,
      not by a copied id. Cloud enumeration no longer writes it; the key
      stays registered for rows already stored.

  - key: cloud.subnet_id
    type: string
    description: >-
      Identifier of the child prefix within the VPC or VNet. Finer than
      cloud.vpc_id and usually what a security group or a route is scoped to.
    producers: [cloud-collector, connector]
    redact: false
    status: retired
    retired_reason: >-
      A cloud child network is a prefix now (asset-inventory ADR-0009 amendment,
      DCIM row 1.5f), and an instance's addresses sit on its ENI interfaces,
      so the prefix a resource is in is the prefix that contains its address.
      Cloud enumeration no longer writes it; the key stays registered for
      rows already stored.

  - key: cloud.security_groups
    type: array
    item_schema:
      type: object
      properties:
        id: { type: string, description: "provider group identifier" }
        name: { type: string, description: "group name as configured" }
      required: [id]
    description: >-
      Security groups, NSGs or firewall rule sets attached to the resource.
      Membership only — this is the group the resource is IN, never the rules
      inside it. Rules are configuration to be judged (a finding), not a fact
      about the asset, and pulling whole rule sets would mean storing an
      attacker's map of the network.
    producers: [cloud-collector, connector]
    redact: false

  # --- cloud.* : lifecycle (asset-inventory ADR-0009 D6, DCIM row 4.6) ------
  - key: cloud.listing
    type: string
    description: >-
      Which provider listing last returned this resource, as
      `<resource_type>@<region>` (`global` for an account-wide call such as
      S3 ListBuckets or every Azure / GCP listing). It is the key the account's
      `cloud.enumeration_coverage` is read with: a resource is only ever judged
      absent by the listing that is supposed to return it.
    producers: [cloud-collector]
    redact: false

  - key: cloud.last_enumerated_at
    type: date
    description: >-
      When a provider listing last returned this resource. Disappearance is
      measured against it: a later COMPLETE run of the same listing (the
      account's `cloud.enumeration_coverage`) that did not return the resource
      is what moves it to stale on its class's window — a failed or partial
      listing proves nothing about absence and moves nothing.
    producers: [cloud-collector]
    redact: false

  - key: cloud.provider_state
    type: string
    description: >-
      The lifecycle state the provider reports for the resource, normalised to
      lower case (`running`, `stopped`, `terminated`, `shutting-down`,
      `deleting`, `pending_deletion`, …). A terminal state is recorded as the
      reason the resource went stale. GCP's `TERMINATED` means stopped and is
      recorded as `stopped`.
    producers: [cloud-collector]
    redact: false

  - key: cloud.enumeration_coverage
    type: object
    item_schema:
      type: object
      additionalProperties: { type: string, format: date-time }
    description: >-
      On a cloud ACCOUNT asset: for each listing (`<resource_type>@<region>`),
      when that listing last completed with every scope answering. The
      lifecycle sweep compares a resource's `cloud.last_enumerated_at` with the
      coverage of its `cloud.listing`; a listing that never completed is never
      evidence of absence.
    producers: [cloud-collector]
    redact: false

  # --- sw.* : software ------------------------------------------------------
  - key: sw.package_count
    type: integer
    description: >-
      How many software packages the collector enumerated on this asset. A
      coverage fact, not an inventory: the packages themselves are rows in
      software_installs. Its job is to distinguish "no software found" from
      "software was never enumerated" — the same three-valued honesty the risk
      rollup applies with risk_assessed_by.
    producers: [device-agent, sbom, connector]
    redact: false

  - key: sw.cpe
    type: string
    description: >-
      The CPE 2.3 name for this asset's product, RESOLVED by the platform from
      the vendor and product it already knows. Written by the enricher, never by
      a collector: nothing on a host reports its own CPE, and a CPE assembled by
      string-formatting a vendor name is a guess that reads like an identifier.
      The enricher emits it only where a vulnerability_matches row already
      carries that exact cpe_match_string for the vendor:product — i.e. where the
      name is one an advisory actually uses — because a CPE nothing matches
      against is a fact with no consumer and a wrong one silently mismatches
      every CVE for the product.
    producers: [enricher]
    redact: false

  # --- svc.* : listening services -------------------------------------------
  - key: svc.listening_sockets
    type: array
    item_schema:
      type: object
      properties:
        address: { type: string, description: "bound address; 0.0.0.0 or :: means all interfaces" }
        port: { type: integer, description: "bound port" }
        transport: { type: string, enum: [tcp, udp], description: "transport protocol" }
        process: { type: string, description: "process or service name holding the socket, where the collector can see it" }
        bound_local: { type: boolean, description: "the socket is bound to a loopback address and is reachable only from the host itself; an explicit false is an answer" }
      required: [port, transport]
    description: >-
      Sockets the host is listening on, as observed locally by the agent. This
      is the host's own view, which sees loopback-only and firewalled services
      a network scan cannot; the network-visible services remain endpoints.
      The baseline the drift producer's port_profile_changed compares against.
    producers: [device-agent]
    redact: false

  - key: svc.bound_udp_sockets
    type: array
    item_schema:
      type: object
      properties:
        address: { type: string, description: "bound local address" }
        port: { type: integer, description: "bound local port" }
        process: { type: string, description: "process name, where visible" }
        role: { type: string, enum: [unknown], description: "listener/client role is not proven by the platform API" }
      required: [port, role]
    description: >-
      UDP bindings whose local address and port were measured but whose role is
      unknown. UDP has no listen state, and several platform APIs expose no
      peer, so these are preserved as evidence without claiming that every
      client socket is a listening service.
    producers: [device-agent]
    redact: false

  - key: net.outbound_connections
    type: array
    item_schema:
      type: object
      properties:
        local_address: { type: string, description: "measured local address used as the connection source" }
        remote_address: { type: string, description: "measured remote peer address" }
        remote_port: { type: integer, description: "measured remote peer port" }
        transport: { type: string, enum: [tcp, udp], description: "transport protocol" }
        process: { type: string, description: "process name, where visible" }
      required: [local_address, remote_address, remote_port, transport]
    description: >-
      Explicitly opted-in, bounded and coalesced remote peers reported by a
      host. Local ephemeral ports and process ids are excluded so repeated
      collections have stable identity and durable facts do not retain
      boot-local identifiers.
    producers: [device-agent]
    redact: false

  # --- certs.* : the host's own trust stores ---------------------------------
  #
  # SUMMARY ONLY. The certificates a host TRUSTS are not the certificates it
  # SERVES: the served ones are crypto posture and belong in `certificates`,
  # reached through an endpoint. A trust store is a property of the host, and
  # what matters about it is its shape — how many anchors, and whether anything
  # in it is not a certificate at all.
  - key: certs.store_count
    type: integer
    description: >-
      How many certificates the host's trust stores hold in total, summed over
      every store the collector could read. A coverage-and-shape fact, not an
      inventory: the certificates themselves are never stored from this path.
      An unusually large count is a machine trusting far more anchors than it
      needs; the absence of the fact means no store was read, which is not the
      same as a host with no trust store.
    producers: [device-agent]
    redact: false

  - key: certs.non_certificate_blocks
    type: integer
    description: >-
      How many PEM blocks in the host's trust stores were refused on TYPE — a
      PRIVATE KEY, an RSA PRIVATE KEY, a CERTIFICATE REQUEST — summed over
      every store read. A count, never the content: a private key loose in a
      trust directory is worth an operator knowing about and is never worth
      carrying. An explicit 0 is an answer (the stores were read and held only
      certificates); an absent fact means no store was read. The hygiene
      producer's finding is computed from this (BUILD_PLAN 3.5).
    producers: [device-agent]
    redact: false

  # --- eol.* : platform-resolved lifecycle ----------------------------------
  - key: eol.os.date
    type: date
    description: >-
      End-of-life date for the asset's OS, RESOLVED by the platform from the
      EOL catalogue using os.name and os.version. Written by the enricher, not
      by a collector, and carries the catalogue as its source_ref so a disputed
      date is traceable to the entry that produced it. The eol producer's
      os_end_of_life finding is computed from this.
    producers: [enricher]
    redact: false

  - key: eol.sw.date
    type: date
    description: >-
      End-of-life date for an installed software product, resolved by the
      platform from the EOL catalogue. Separate from eol.os.date because an OS
      release and an application release end support on their own schedules and
      an asset routinely has both — collapsing them into one key would make the
      second write overwrite the first under the (asset, key, source_ref)
      uniqueness.
    producers: [enricher]
    redact: false

  - key: eol.hw.date
    type: date
    description: >-
      End-of-support date for the asset's hardware, resolved by the platform
      from the EOL catalogue using hw.vendor and hw.model. Support end, not
      sale end: the date after which the vendor ships no more firmware fixes.
    producers: [enricher]
    redact: false

  # --- mgmt.* : how the device is managed -----------------------------------
  - key: mgmt.protocol
    type: string
    description: >-
      The protocol the device's management plane is reached on, as observed
      ("ssh", "telnet", "https", "http", "snmpv2c", "snmpv3", "winrm",
      "redfish", "ipmi"). Left open rather than enumerated: the point is to
      record what was actually seen, and an unknown management protocol on an
      appliance is a finding, not a value to be forced into a closed list.
    producers: [device-interrogation, sensor, platform-sensor, device-agent]
    redact: false

  - key: mgmt.plaintext
    type: boolean
    description: >-
      Whether the management protocol in mgmt.protocol carries credentials and
      configuration without transport encryption. An explicit false is an
      answer, not an absence — a device with no mgmt.plaintext fact has not
      been assessed, and must not be displayed as safe. A false speaks only
      for the protocol its own source named, so answers are never resolved
      newest-wins across sources: an HTTPS or SSH run's false does not clear
      an SNMP v2c true. A writer of ssh + false must have positively assessed
      that telnet is off. Feeds the configuration producer's
      plaintext_management finding.
    producers: [device-interrogation, sensor, platform-sensor, device-agent]
    redact: false

  # --- agent.* : which agent reported ---------------------------------------
  - key: agent.id
    type: string
    description: >-
      Identifier of the agent instance that reported these facts. Provenance
      the operator can act on: when two collectors disagree, this is how they
      find the one that is wrong.
    producers: [device-agent]
    redact: false

  - key: agent.mode
    type: string
    enum: [local, remote]
    description: >-
      Which mode the reporting agent ran in — `local` (installed on the host it
      describes) or `remote` (reached the host over SSH or WinRM). One binary,
      two modes (ADR-0004 D3). The distinction is not cosmetic: local mode sees
      loopback sockets, package databases and disk encryption that remote mode
      cannot, so the mode bounds what the absence of a fact is allowed to mean.
    producers: [device-agent]
    redact: false
