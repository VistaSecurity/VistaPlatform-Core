# Alert-type registry — single source of truth for the platform's alert catalog.
#
# Every stateful alert type the platform can raise is declared here
# (NOTIFICATION_ALERTING_ARCHITECTURE.md §8.2). The registry drives:
#   - the generated Go catalog in compliance-engine
#     (services/compliance-engine/internal/alertcatalog/registry_gen.go —
#      regenerate with `make generate`, checked for drift by `make audit`)
#   - the tenant catalog UI (Settings → Alert Rules)
#   - default-enabled semantics (absence of a tenant_alert_settings row means
#     the registry default applies)
#
# Fields:
#   id                stable alert_type identifier (matches alerts.alert_type)
#   track             tenant | platform
#   kind              policy (thresholds shaped by activated compliance
#                     frameworks) | operational (detector-owned parameters)
#   status            live (detector active) | planned (catalog entry shown
#                     greyed; detector not yet wired)
#   source            producing service (alert_source on the rails)
#   subject_type      what one alert instance is about
#   severity_model    ladder (escalates through rungs) | fixed
#   baseline_rung     ladder types with a TUNABLE ladder: the product-default
#                     warning rung. The tenant preference rung REPLACES this;
#                     policy rungs are always ADDITIVE (never reduce warning).
#   rungs             ladder types with a FIXED ladder: the whole ladder,
#                     worst-last, as { threshold, severity }. `threshold` is a
#                     label in the detector's own units and is NOT parsed — the
#                     producer owns the numbers, this owns what a rung means.
#                     Use this where the boundaries come from a published
#                     standard (the CVSS qualitative bands) or from the finding
#                     ladder the alert is driven by, so there is nothing for a
#                     tenant to tune. Mutually exclusive with baseline_rung.
#   default_severity  fixed types: severity at open
#   auto_resolve      how the system observes the condition cleared
#   enabled_by_default  catalog toggle default
#   description       shown in the catalog UI

version: 1

alert_types:
  # --- tenant track ---------------------------------------------------------
  - id: certificate_expiring
    track: tenant
    kind: policy
    status: live
    source: inventory-service
    subject_type: certificate
    severity_model: ladder
    baseline_rung: { days: 60, severity: medium }
    auto_resolve: renewed certificate observed (not_after beyond every rung)
    enabled_by_default: true
    description: >-
      A certificate is approaching (or past) expiry. One alert per
      certificate, escalating as expiry nears. Activated compliance policies
      add rungs (e.g. PCI-DSS adds a high-severity rung at its 30-day
      boundary); your own rung replaces the 60-day product default.

  - id: control_noncompliant
    track: tenant
    kind: policy
    status: live
    source: compliance-engine
    subject_type: control
    severity_model: fixed
    default_severity: from-control
    auto_resolve: finding cleared on re-evaluation
    enabled_by_default: true
    description: >-
      A control in an activated framework went noncompliant. One alert per
      control (with affected-asset count), not one per asset.

  - id: compliance_score_drop
    track: tenant
    kind: policy
    status: live
    source: compliance-engine
    subject_type: framework
    severity_model: fixed
    default_severity: medium
    auto_resolve: score recovers
    enabled_by_default: true
    description: A framework's compliance score fell more than 10 points in 24 hours.

  - id: hygiene_score_drop
    track: tenant
    kind: policy
    status: live
    source: compliance-engine
    subject_type: framework
    severity_model: fixed
    default_severity: medium
    auto_resolve: score recovers
    enabled_by_default: true
    description: >-
      Your Inventory Hygiene score fell more than 10 points in 24 hours. Same
      detector and same threshold as the compliance score drop, split out as its
      own type because inventory hygiene is data quality rather than security
      posture — it is worth routing (and silencing) separately.

  # `known_vulnerability` and `end_of_life` are driven by the findings the
  # vulnerability and eol producers write, not by a detector of their own. No
  # activated framework contributes a rung to either today; they are `policy`
  # rather than `operational` because what they report is posture, and because
  # their thresholds are judgements about a standard rather than knobs on a
  # detector.
  #
  # Note what a rung grades. These ladders grade the ALERT — how urgently
  # somebody should be told — which is not the same question as the finding's
  # severity, which grades how much risk the condition adds to the asset and is
  # what feeds the risk rollup. The two can differ, and that is deliberate: an
  # end-of-life package and an end-of-life operating system are the same
  # deadline but not the same blast radius.
  - id: known_vulnerability
    track: tenant
    kind: policy
    status: live
    source: compliance-engine
    subject_type: software_install
    severity_model: ladder
    rungs:
      - { threshold: "CVSS 4.0 or higher (Medium)", severity: medium }
      - { threshold: "CVSS 7.0 or higher (High)", severity: high }
      - { threshold: "CVSS 9.0 or higher (Critical)", severity: critical }
    auto_resolve: >-
      the vulnerability finding stops being detected — the next inventory pass
      sees a fixed version, or the install is gone
    enabled_by_default: true
    description: >-
      An installed software version matches a published advisory. One alert per
      install, escalating with the worst CVSS across every advisory that matched
      it. The rungs are the CVSS v3.1/v4.0 qualitative severity ratings, the same
      anchor the platform's risk bands use. Advisories below CVSS 4.0, and
      advisories the feed has not scored, are recorded as findings and shown on
      the asset — they just do not open an alert; "not scored" is never reported
      as "nothing found".

  - id: end_of_life
    track: tenant
    kind: policy
    status: live
    source: compliance-engine
    subject_type: asset
    severity_model: ladder
    rungs:
      - { threshold: "180 days to end of life", severity: low }
      - { threshold: "90 days to end of life", severity: medium }
      - { threshold: "past end of life", severity: high }
      - { threshold: "past end of life by more than a year", severity: critical }
    auto_resolve: >-
      the end-of-life finding stops being detected — the next inventory pass
      sees an upgraded version, or the subject is gone
    enabled_by_default: true
    description: >-
      Something on this asset has passed, or is approaching, the date its vendor
      stops shipping fixes — its operating system, its hardware, or an installed
      package. One alert per subject, escalating as the date nears and then
      recedes. The first rung a subject can reach depends on how far ahead the
      catalogue starts reporting it: 180 days for hardware, 90 days for an
      operating system or a package.

  # `drift_detected` is the third findings-driven type. Like the two above it has
  # no detector of its own: the drift producer compares a subject against its
  # recent baseline window and writes the findings, and this type is how a
  # subject with an open one gets told about.
  #
  # The ladder is the four severities a drift finding can carry, and the rung is
  # simply the worst open finding's own severity — drift has no second scale to
  # grade on (no CVSS, no deadline), so inventing one would be a second opinion
  # about a judgement the findings registry already made.
  - id: drift_detected
    track: tenant
    kind: policy
    status: live
    source: compliance-engine
    subject_type: asset
    severity_model: ladder
    rungs:
      - { threshold: "a change the drift producer graded low", severity: low }
      - { threshold: "a change the drift producer graded medium", severity: medium }
      - { threshold: "a change the drift producer graded high", severity: high }
      - { threshold: "a change the drift producer graded critical", severity: critical }
    auto_resolve: >-
      the drift findings stop being detected — the next pass sees the subject
      back in line with its baseline, or somebody accepts the change and
      resolves the finding
    enabled_by_default: true
    description: >-
      Something about this subject changed relative to its recent baseline: a new
      device class on its segment, a protocol it has not spoken before, a
      different set of listening ports, or a certificate from an issuer it has
      not presented. One alert per subject, graded by the worst open drift
      finding. Drift is not automatically bad — most of these are planned
      changes, and resolving the finding is how you tell the baseline so.

  - id: sensor_offline
    track: tenant
    kind: operational
    status: live
    source: sensor-manager
    subject_type: sensor
    severity_model: fixed
    default_severity: high
    auto_resolve: heartbeat returns
    enabled_by_default: true
    description: A sensor stopped reporting (15-minute dwell before opening).

  - id: discovery_agent_offline
    track: tenant
    kind: operational
    status: live
    source: device-interrogation-service
    subject_type: agent
    severity_model: fixed
    default_severity: high
    auto_resolve: heartbeat returns
    enabled_by_default: true
    description: A discovery agent stopped reporting (15-minute dwell before opening).

  - id: discovery_job_failed
    track: tenant
    kind: operational
    status: live
    source: cluster-sensor-service
    subject_type: job
    severity_model: fixed
    default_severity: medium
    auto_resolve: next run succeeds
    enabled_by_default: true
    description: A discovery job failed.

  - id: failed_login_burst
    track: tenant
    kind: operational
    status: live
    source: audit
    subject_type: user
    severity_model: fixed
    default_severity: high
    auto_resolve: manual
    enabled_by_default: true
    description: >-
      Multiple failed login attempts in a short window (audit alert rule).
      Detection is the audit-service rule engine; tune conditions under
      Settings → Alert Rules.

  - id: asset_limit_approaching
    track: tenant
    kind: operational
    status: live
    source: auth-service
    subject_type: tenant
    severity_model: ladder
    baseline_rung: { percent: 80, severity: info }
    auto_resolve: usage drops below the lowest rung
    enabled_by_default: true
    description: Asset usage is approaching the plan limit (80% info, 95% high).

  # --- platform track -------------------------------------------------------
  - id: service_down
    track: platform
    kind: operational
    status: live
    source: monitoring
    subject_type: service
    severity_model: fixed
    default_severity: critical
    auto_resolve: health check recovers
    enabled_by_default: true
    description: A platform service is failing health checks.

  - id: metric_threshold
    track: platform
    kind: operational
    status: live
    source: monitoring
    subject_type: service
    severity_model: fixed
    default_severity: from-threshold
    auto_resolve: metric recovers
    enabled_by_default: true
    description: >-
      A monitored metric crossed its configured threshold
      (monitoring_alert_thresholds). Detection is the monitoring evaluator.

  - id: tenant_health_degraded
    track: platform
    kind: operational
    status: live
    source: tenant-health-service
    subject_type: tenant
    severity_model: fixed
    default_severity: medium
    auto_resolve: health score recovers
    enabled_by_default: true
    description: A tenant's health score degraded below threshold.

  - id: delivery_failure_rate
    track: platform
    kind: operational
    status: planned
    source: notification-service
    subject_type: channel
    severity_model: fixed
    default_severity: high
    auto_resolve: deliveries succeed again
    enabled_by_default: true
    description: >-
      Notification deliveries are failing (the watcher's watcher — surfaces
      broken SMTP credentials, dead webhooks).
