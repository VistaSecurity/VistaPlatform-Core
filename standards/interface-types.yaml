# Interface, port and power-port type registries (DCIM build, row 0.4; asset-inventory ADR-0010 D3).
#
# Every key and label below is NetBox v4.3.5's, verbatim and case-sensitive
# (netbox/dcim/choices.py, netbox/wireless/choices.py), and nothing else:
# standards/netbox-choices.v4.3.5.json is the machine-extracted snapshot, and
# the Go and vitest parity tests fail on a key that is missing from, or not in,
# the snapshot. Apache-2.0; see public/NOTICE. Groups follow NetBox's optgroup headings.
#
# Validation is in Go and TypeScript, not in SQL: the columns are CHECK-free text
# (DATA_MODEL section 2.4). Generated by scripts/generate-dcim-types.mjs
# (`make generate`) into shared/dcim/types_gen.go, packages/primitives/src/dcim/types.gen.ts
# and the inventory-service OpenAPI enums; `make audit` fails on drift.
#
# speed_kbps is our own addition (not a NetBox field): the nominal line rate where the
# type names one; omitted otherwise.
version: 1

