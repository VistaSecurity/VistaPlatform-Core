  # ===========================================================================
  # banner — what a service said about itself
  # ===========================================================================
  #
  # The weakest evidence here, and scoped accordingly. Each pattern anchors on
  # an HTTP `Server:` header family and proposes `web_application` — the thing
  # answering on that port is a web application, which is a statement about the
  # SERVICE and is true whatever host it runs on.
  #
  # Three families are deliberately absent:
  #
  #   * SSH. `SSH-2.0-OpenSSH_9.6` says the host runs sshd. It says nothing
  #     about what the host IS — every class in the taxonomy from `server` to
  #     `switch` to `plc` runs one — and `service_daemon` would be proposing a
  #     class for the host on the strength of a login service.
