# Classification rules — the evidence behind every class proposal.
#
# ADR-0004 D6 (asset-inventory): class proposals are produced by a rule table
# seeded from OUI → vendor → likely class, SNMP sysObjectID → vendor and model,
# EtherNet/IP identity → OT class, cloud resource type → cloud class, service
# identification → application class, and banner regexes. Rules are DATA a
# platform admin curates, not code, so the catalogue grows without a release and
# the learned classifier of workstream 4.2 has features to train on.
#
# This file is the source of truth. `make generate` writes:
#   shared/classify/rules_gen.go   — the Go table the engine loads by default
#   scripts/database/seed.sql      — one generated region, the seeded rows
# and `make audit` runs the same generator with --check and fails on drift.
#
# A rule NEVER decides anything on its own. Everything here produces a
# PROPOSAL that goes through Approvals (ADR-0008 D3), and a proposal nobody
# approves leaves the asset unclassified.
#
# ---------------------------------------------------------------------------
# The one rule that governs every rule: A WRONG CLASS IS WORSE THAN NO CLASS.
# ---------------------------------------------------------------------------
#
# An absent class shows as unclassified, which reads as "we have not worked
# this out yet" and invites someone to look. A wrong class shows as a fact, and
# a plausible-looking wrong proposal is the one that gets bulk-approved. So:
#
#   * When a vendor's products span several classes, give the rule a VENDOR and
#     NO CLASS. Most OUI rules here are vendor-only, deliberately: Dell, HP,
#     Netgear, Ubiquiti and MikroTik each sell things from three or four
#     different classes under one OUI, and picking the most common one is a
#     guess wearing a decimal.
#   * Prefer a broad class that is certainly right (`network_device`) over a
#     narrow one that is probably right (`switch`). The taxonomy is a tree and
#     a later, better-evidenced rule can refine an ancestor without
#     contradicting it — see the conflict rule in shared/classify.
#   * If two rules disagree about the class at similar confidence, the engine
#     proposes NO class and reports both. That is the intended outcome, not a
#     failure to handle.
#
# ---------------------------------------------------------------------------
# Fields
# ---------------------------------------------------------------------------
#
#   kind         one of the kinds listed below. Decides how `pattern` matches.
#   pattern      the thing matched, in the kind's own syntax. Unique per kind.
#   class        an asset-class key from standards/asset-classes.yaml. OPTIONAL
#                — omit it for a vendor-only rule.
#   vendor       the manufacturer this pattern identifies. Optional.
#   model        the specific model, where the pattern pins one. Rarely set:
#                most patterns identify a family, not a product.
#   confidence   0.50–0.95. What the rule asserts, not how sure we are that the
#                pattern matched. See the ladder below.
#   source_url   REQUIRED. Where the mapping comes from. A rule that cannot
#                cite anything is somebody's memory, and this file is read by
#                people who were not in the room.
#
# Confidence ladder, applied consistently:
#
#   0.90–0.95  the thing DECLARED its identity in a vocabulary with exactly one
#              meaning (a cloud provider's resource type).
#   0.80–0.89  a registered identifier belonging to a vendor with one product
#              line, or a model prefix that names a product family.
#   0.70–0.79  a registered identifier for a vendor whose products span a
#              family, narrowed only to a broad class; the collector's own
#              platform identity; or a device's standardised self-declaration
#              of what it DOES, where that declaration has one meaning (an
#              802.1AB WLAN-access-point bit, an advertised print service).
#   0.50–0.69  an inference from observed behaviour — a banner, a port profile,
#              or a self-declared function that several kinds of device make
#              (a CDP `switch` bit: true of a switch, and of a router with a
#              switch module).
#
# A vendor-only rule carries the confidence of its VENDOR claim (0.85 for an
# IEEE assignment), because that is all it asserts.
#
# ---------------------------------------------------------------------------
# Rule kinds
# ---------------------------------------------------------------------------
#
#   oui           pattern is the 24-bit IEEE assignment as 6 uppercase hex
#                 digits, no separators ("00000C"). Matches the first three
#                 octets of any MAC in the input, in any spelling.
#
#   sysobjectid   pattern is an OID prefix under 1.3.6.1.4.1 — the IANA
#                 private-enterprise arc. Matched on ARC boundaries, so
#                 1.3.6.1.4.1.9 does not match enterprise 99, and the LONGEST
#                 matching prefix wins so a vendor can add product-tree rules
#                 under their enterprise rule without disturbing it.
#
#   enip          pattern is an ODVA vendor id in decimal, from the
#                 EtherNet/IP List Identity response. Exact match.
#
#   cloud_type    pattern is a provider resource type as the cloud collectors
#                 spell it ("aws_s3_bucket"). Exact, case-insensitive.
#
#   banner        pattern is an RE2 regexp matched against every banner the
#                 collectors captured. The regexp carries its own anchoring —
#                 there is no separate "which banner" field, so write patterns
#                 that could only match the protocol they mean.
#
#   port_profile  pattern is a comma-separated ascending port list. It matches
#                 only when EVERY listed port is open. One open port is not a
#                 profile; these exist for combinations that mean one thing.
#
#   model         pattern is a case-insensitive PREFIX of the model or product
#                 id the device stated. Longest matching prefix wins. When the
#                 rule names a vendor AND the input names one, they must agree
#                 — so a Cisco PID prefix cannot fire on another vendor's model
#                 string that happens to start the same way.
#
#   platform      pattern is the collector path's own identity for the device:
#                 the management API it answered ("panos"), or the device
#                 profile it was registered under ("cisco_asa"). Exact,
#                 case-insensitive. This is the kind that carries "a box
#                 answering the FortiOS API is a FortiGate, and a FortiGate is
#                 a firewall" WITHOUT letting that conclusion leak onto every
#                 device an OUI merely attributes to Fortinet.
#
#   cdp_capabilities   pattern is an ascending comma-separated SET of Cisco CDP
#                 capability names ("router,switch"), spelled as
#                 shared/hostobs' CDP decoder spells them. A rule matches only
#                 when EVERY name is advertised, and only the matching rules
#                 naming the MOST capabilities are returned — so a rule for a
#                 combination REFINES the single-capability rules under it
#                 rather than arguing with them.
#
#   lldp_capability   the same matching, over IEEE 802.1AB system capabilities.
#                 Two kinds and not one because the vocabularies are different
#                 words for overlapping ideas: CDP's `switch` says the device
#                 switches, while 802.1AB's `bridge` is the bridging FUNCTION,
#                 which an access point and a desk phone also perform. One
#                 shared kind would let a rule written for one protocol fire on
#                 the other's advertisement.
#
#   mdns_service  pattern is one DNS-SD service type in its registry spelling
#                 ("_ipp._tcp"), lowercase. Exact, case-insensitive. What the
#                 host advertises about ITSELF on the segment, which is why
#                 this is a rule and an SSH banner is not.
#
#   os_name       pattern is an RE2 regexp matched against the operating system
#                 the host named when asked — the `os.name` fact a host
#                 inventory writes, or the OS a vendor management API reported.
#                 The pattern carries its own anchoring, as a banner's does.
#                 This is the only kind whose evidence comes from INSIDE the
#                 host rather than off the wire, and the only one a
#                 general-purpose computer can match at all.

version: 1

kinds:
  - oui
  - sysobjectid
  - enip
  - cloud_type
  - banner
  - port_profile
  - model
  - platform
  - cdp_capabilities
  - lldp_capability
  - mdns_service
  - os_name

# Citations reused across whole blocks, so the rules below stay readable.
# (YAML anchors; the generator resolves them before it sees a rule.)
sources:
  ieee: &ieee https://standards-oui.ieee.org/
  iana_pen: &iana_pen https://www.iana.org/assignments/enterprise-numbers/
  odva: &odva https://www.odva.org/subscriptions-services/vendor-id-list/

# ---------------------------------------------------------------------------
# oui — one table, one owner
# ---------------------------------------------------------------------------
#
# OUI → VENDOR lives in standards/oui-vendors.csv and nowhere else. That table
# is workstream 2.5's (shared/hostobs compiles it into the sensor so a passive
# capture can name a manufacturer with no network call), it is curated, and it
# already covers 462 prefixes across 118 manufacturers.
#
# This file does NOT restate any of it. A second copy of the same mapping is a
# second copy that drifts — and it already had: a first cut of this file
# carried 123 hand-written OUI rules, and when the CSV landed 27 of them
# disagreed with it about the vendor's own name (Netgear/NETGEAR,
# Brother/Brother Industries, Rockwell Automation/Allen-Bradley for the same
# prefix). Nothing would have failed; the two tables would simply have told a
# customer two different things.
#
# So `oui_classes` maps a VENDOR — spelled exactly as the CSV spells it — onto
# the class its products are, and the generator emits one `oui` rule per CSV
# prefix:
#
#   * a vendor in this map     → a rule with that vendor AND that class
#   * a vendor not in this map → a rule with that vendor and NO class
#
# The second case is the majority and the default, which is the rule of thumb
# working as intended: of 462 prefixes only about a third carry a class.
#
# The generator FAILS on a vendor here that the CSV does not contain, because a
# typo would otherwise be a class that silently never applies to anything.
#
# What belongs in this map: a vendor whose networked products are all one
# thing. What does not, with the reason, because these are the judgement calls
# somebody will want to revisit:
#
#   * Dell, HP, Intel, IBM, Apple, Supermicro — servers, laptops, workstations
#     and (Dell, HP) switches and printers under one assignment. Supermicro is
#     the near miss: almost every Supermicro NIC is in a server, and "almost" is
#     not "unambiguous".
#   * NETGEAR, TP-Link, D-Link, Linksys — switches and APs, but also NAS
#     (ReadyNAS) and cameras on the same prefixes.
#   * Ubiquiti Networks — UniFi is network gear, but UniFi Protect cameras and
#     Access readers carry the same assignments.
#   * Cisco Meraki — the same shape as Ubiquiti, and excluded for the same
#     reason: MS switches, MR access points and MX appliances share their
#     assignments with MV cameras and MT environmental sensors, which are not
#     network devices at all.
#   * Zebra Technologies — label printers, but the Motorola enterprise line came
#     with them: TC/MC handheld computers and wireless barcode scanners are on
#     the same prefixes, and a warehouse has far more of those than printers.
#   * Fortinet — FortiSwitch and FortiAP share FortiGate's prefixes. The
#     FortiGate conclusion is earned by ANSWERING the FortiOS API, and lives in
#     a `platform` rule where that evidence is.
#   * Siemens — four prefixes spanning industrial, building technology and
#     medical imaging.
#   * Moxa, Lantronix, Digi International — serial device servers and protocol
#     gateways: network infrastructure on one side, an OT bus on the other.
#   * Xerox — 00:00:01 is Xerox's original Ethernet assignment and predates
#     their print business entirely.
#   * Raspberry Pi — a computer, an IoT controller, a kiosk or a PLC gateway
#     depending entirely on what somebody did with it.
#   * American Power Conversion — UPSs and rack PDUs, for which the taxonomy has
#     no class and `iot_device` would be a category error.
#
# Confidence follows the same ladder as everything else in this file, and a
# vendor-only rule gets `oui_vendor_only_confidence` below.

# What a rule asserts when it names only the manufacturer: an IEEE assignment
# is a strong claim about who made the thing and no claim at all about what it
# is.
oui_vendor_only_confidence: 0.85

# ---------------------------------------------------------------------------
# Vendor names: one manufacturer, one spelling
# ---------------------------------------------------------------------------
#
# Every `vendor:` a rule below names must be spelled EXACTLY as
# standards/oui-vendors.csv spells it, and the generator fails on any that is
# not. This is not tidiness. The engine refuses to choose between two rules
# naming DIFFERENT vendors at similar confidence, so two spellings of one
# manufacturer do not disagree loudly — they CANCEL. `Dell` on the OUI rule
# against `Dell Inc.` on the sysObjectID rule meant a Dell server seen by both
# MAC and SNMP came back with no vendor AND no class; `Ubiquiti` against
# `Ubiquiti Networks` did the same to every UniFi device. Both also break the
# hw.vendor join the end-of-life catalogue exists for.
#
# A manufacturer with no prefix in the CSV is legitimate — these three are
# reached over SNMP and have never appeared in the MAC table — but it has to be
# DECLARED here, so that adding their OUI later cannot quietly introduce a
# second spelling.
vendors_outside_oui_table:
  - Zyxel
  - Brocade
  - Citrix
  - H3C

# ---------------------------------------------------------------------------
# Citations for prefixes IEEE did not assign
# ---------------------------------------------------------------------------
#
# An OUI rule cites the IEEE registry, because that is where OUI → vendor comes
# from. For a LOCALLY-ADMINISTERED prefix that citation is false: the U/L bit
# means nobody registered it, and `FA:16:3E → OpenStack` is a convention of that
# platform's own. A citation that does not say what the rule says is worse than
# no citation, because it is aimed at a reader who will not go and check.
#
# The generator REQUIRES an entry here for every locally-administered prefix in
# the CSV, and accepts one for a universally-administered prefix whose registrant
# is not the name the table uses.
oui_sources:
  # Locally administered — required.
  '52:54:00': https://libvirt.org/formatdomain.html
  'FA:16:3E': https://docs.openstack.org/neutron/latest/configuration/neutron.html
  '02:42:AC': https://docs.docker.com/engine/network/drivers/bridge/
  # Registered to Cadmus Computer Systems; every frame carrying it in practice
  # is a VirtualBox guest, which is what the table names it.
  '08:00:27': https://www.virtualbox.org/manual/ch06.html

oui_classes:

  # --- virtualisation --------------------------------------------------------
  # A hypervisor-assigned MAC is the strongest OUI evidence there is: the
  # address was minted BY the thing that decides what the guest is. Note that
  # plain "Microsoft" is absent and "Microsoft Hyper-V" is present — only the
  # 00:15:5D pool is a guest NIC; the rest are Surface hardware and Xbox.
  VMware:             { class: virtual_machine, confidence: 0.85 }
  Microsoft Hyper-V:  { class: virtual_machine, confidence: 0.85 }
  Xen:                { class: virtual_machine, confidence: 0.80 }
  Oracle VirtualBox:  { class: virtual_machine, confidence: 0.85 }
  Parallels:          { class: virtual_machine, confidence: 0.85 }
  QEMU virtual NIC:   { class: virtual_machine, confidence: 0.80 }
  OpenStack:          { class: virtual_machine, confidence: 0.75 }
  Docker:             { class: container,       confidence: 0.75 }

  # --- network infrastructure ------------------------------------------------
  # `network_device` and not `switch` or `router`: each of these sells both, and
  # the common ancestor is certainly right where either leaf is only probably
  # right. A model rule or an SNMP walk refines it later, and the engine treats
  # that refinement as agreement rather than as a conflict.
  Cisco Systems:      { class: network_device, confidence: 0.70 }
  Juniper Networks:   { class: network_device, confidence: 0.70 }
  Arista Networks:    { class: network_device, confidence: 0.75 }
  Extreme Networks:   { class: network_device, confidence: 0.70 }
  Allied Telesis:     { class: network_device, confidence: 0.70 }
  Aruba Networks:     { class: network_device, confidence: 0.75 }
  Ruckus Wireless:    { class: network_device, confidence: 0.75 }
  Cambium Networks:   { class: network_device, confidence: 0.70 }
  MikroTik:           { class: network_device, confidence: 0.75 }
  Hirschmann:         { class: network_device, confidence: 0.75 }

  # --- security appliances ---------------------------------------------------
  Palo Alto Networks:   { class: firewall,      confidence: 0.85 }
  Check Point Software: { class: firewall,      confidence: 0.80 }
  SonicWall:            { class: firewall,      confidence: 0.80 }
  WatchGuard Technologies: { class: firewall,   confidence: 0.80 }
  F5 Networks:          { class: load_balancer, confidence: 0.85 }

  # --- storage ---------------------------------------------------------------
  # Western Digital is here rather than under a disk maker's heading: a bare
  # drive has no MAC, so a WD assignment on the wire is a My Cloud NAS.
  NetApp:          { class: storage_device, confidence: 0.85 }
  Pure Storage:    { class: storage_device, confidence: 0.85 }
  Synology:        { class: storage_device, confidence: 0.85 }
  QNAP Systems:    { class: storage_device, confidence: 0.85 }
  EMC:             { class: storage_device, confidence: 0.75 }
  Western Digital: { class: storage_device, confidence: 0.80 }

  # --- printers --------------------------------------------------------------
  # A networked device from a print vendor is a printer.
  Brother Industries: { class: printer, confidence: 0.85 }
  Ricoh:              { class: printer, confidence: 0.85 }
  Lexmark:            { class: printer, confidence: 0.85 }
  Konica Minolta:     { class: printer, confidence: 0.85 }
  Canon:              { class: printer, confidence: 0.80 }
  Seiko Epson:        { class: printer, confidence: 0.80 }
  Kyocera:            { class: printer, confidence: 0.80 }
  Fuji Xerox:         { class: printer, confidence: 0.80 }

  # --- cameras and building IoT ----------------------------------------------
  # `iot_device` rather than a camera class: the taxonomy has no camera leaf,
  # and each of these also ships NVRs, intercoms and access controllers on the
  # same assignments. iot_device is their common ancestor and right for all.
  Hikvision:           { class: iot_device, confidence: 0.80 }
  Dahua Technology:    { class: iot_device, confidence: 0.80 }
  Axis Communications: { class: iot_device, confidence: 0.80 }
  Espressif:           { class: iot_device, confidence: 0.75 }

  # --- industrial control ----------------------------------------------------
  # `ot_device` and not `plc`: these vendors ship PLCs, but also drives, I/O
  # heads, HMIs and gateways on the same assignments. The EtherNet/IP identity
  # and the OT probers are what narrow an OT device to a PLC; an OUI is not.
  Rockwell Automation: { class: ot_device, confidence: 0.80 }
  Beckhoff Automation: { class: ot_device, confidence: 0.75 }
  Phoenix Contact:     { class: ot_device, confidence: 0.75 }
  WAGO:                { class: ot_device, confidence: 0.75 }
  Omron:               { class: ot_device, confidence: 0.70 }
  Schneider Electric:  { class: ot_device, confidence: 0.70 }

rules:
  # ===========================================================================
  # sysobjectid — IANA private-enterprise numbers
  # ===========================================================================
  #
  # sysObjectID is 1.3.6.1.4.1.<enterprise>.<the vendor's own product tree>.
  # The enterprise number is the one part with a registry behind it, so these
  # rules stop there. The product tree beneath it is the vendor's own and has
  # no public registry — a rule that read it would be reverse-engineering, and
  # the LONGEST-prefix match exists so a platform admin who HAS reverse-
  # engineered one for their own fleet can add it here without disturbing the
  # enterprise rule above it.
  #
  # Net-SNMP (8072) and UCD-SNMP (2021) are deliberately absent: they identify
  # the AGENT, not the hardware it runs on. Reporting "Net-SNMP" as a hardware
  # vendor would put a software package in hw.vendor and break the
  # end-of-life catalogue join that key exists for.
  #
  # Class is omitted where the enterprise number genuinely does not imply one:
  # HP, Dell and VMware each sell servers, switches and printers under a single
  # number, and choosing between them would be a fabricated fact.
  - kind: sysobjectid
    pattern: 1.3.6.1.4.1.9
    class: network_device
    vendor: Cisco Systems
    confidence: 0.70
    source_url: *iana_pen
  - kind: sysobjectid
    pattern: 1.3.6.1.4.1.11
    vendor: Hewlett Packard
    confidence: 0.85
    source_url: *iana_pen
  - kind: sysobjectid
    pattern: 1.3.6.1.4.1.43
    vendor: 3Com
    confidence: 0.85
    source_url: *iana_pen
  - kind: sysobjectid
    pattern: 1.3.6.1.4.1.171
    class: network_device
    vendor: D-Link
    confidence: 0.70
    source_url: *iana_pen
  - kind: sysobjectid
    pattern: 1.3.6.1.4.1.207
    class: network_device
    vendor: Allied Telesis
    confidence: 0.70
    source_url: *iana_pen
  - kind: sysobjectid
    pattern: 1.3.6.1.4.1.318
    vendor: American Power Conversion
    confidence: 0.85
    source_url: *iana_pen
  - kind: sysobjectid
    pattern: 1.3.6.1.4.1.674
    vendor: Dell
    confidence: 0.85
    source_url: *iana_pen
  - kind: sysobjectid
    pattern: 1.3.6.1.4.1.789
    class: storage_device
    vendor: NetApp
    confidence: 0.80
    source_url: *iana_pen
  - kind: sysobjectid
    pattern: 1.3.6.1.4.1.890
    class: network_device
    vendor: Zyxel
    confidence: 0.70
    source_url: *iana_pen
  - kind: sysobjectid
    pattern: 1.3.6.1.4.1.1916
    class: network_device
    vendor: Extreme Networks
    confidence: 0.70
    source_url: *iana_pen
  - kind: sysobjectid
    pattern: 1.3.6.1.4.1.1991
    class: network_device
    vendor: Brocade
    confidence: 0.70
    source_url: *iana_pen
  # Huawei is the HP/Dell case with a different flag on it: enterprise 2011 is
  # the whole company's arc — CloudEngine switches, NetEngine routers, USG
  # firewalls, FusionServer servers and OceanStor arrays all sit under it — so
  # `network_device` would be wrong for every server and every array. Vendor
  # only.
  - kind: sysobjectid
    pattern: 1.3.6.1.4.1.2011
    vendor: Huawei Technologies
    confidence: 0.85
    source_url: *iana_pen
  - kind: sysobjectid
    pattern: 1.3.6.1.4.1.2636
    class: network_device
    vendor: Juniper Networks
    confidence: 0.70
    source_url: *iana_pen
  - kind: sysobjectid
    pattern: 1.3.6.1.4.1.3375
    class: load_balancer
    vendor: F5 Networks
    confidence: 0.80
    source_url: *iana_pen
  - kind: sysobjectid
    pattern: 1.3.6.1.4.1.4526
    class: network_device
    vendor: NETGEAR
    confidence: 0.70
    source_url: *iana_pen
  - kind: sysobjectid
    pattern: 1.3.6.1.4.1.5951
    class: load_balancer
    vendor: Citrix
    confidence: 0.75
    source_url: *iana_pen
  - kind: sysobjectid
    pattern: 1.3.6.1.4.1.6876
    vendor: VMware
    confidence: 0.85
    source_url: *iana_pen
  # Fortinet is VENDOR-ONLY here, and the reason is the same one that keeps the
  # Fortinet OUI rules vendor-only: FortiSwitch, FortiAP, FortiAnalyzer and
  # FortiManager all answer SNMP under enterprise 12356, so `firewall` would be
  # asserted for every one of them. The FortiGate conclusion is earned by
  # ANSWERING the FortiOS API and lives in the `platform` rule where that
  # evidence is. A platform admin who has worked out the FortiGate product arc
  # for their own fleet can add it as a longer prefix; longest wins.
  - kind: sysobjectid
    pattern: 1.3.6.1.4.1.12356
    vendor: Fortinet
    confidence: 0.85
    source_url: *iana_pen
  - kind: sysobjectid
    pattern: 1.3.6.1.4.1.14988
    class: network_device
    vendor: MikroTik
    confidence: 0.70
    source_url: *iana_pen
  - kind: sysobjectid
    pattern: 1.3.6.1.4.1.20916
    class: iot_device
    vendor: Hikvision
    confidence: 0.75
    source_url: *iana_pen
  - kind: sysobjectid
    pattern: 1.3.6.1.4.1.25461
    class: firewall
    vendor: Palo Alto Networks
    confidence: 0.80
    source_url: *iana_pen
  - kind: sysobjectid
    pattern: 1.3.6.1.4.1.25506
    class: network_device
    vendor: H3C
    confidence: 0.70
    source_url: *iana_pen
  - kind: sysobjectid
    pattern: 1.3.6.1.4.1.30065
    class: network_device
    vendor: Arista Networks
    confidence: 0.70
    source_url: *iana_pen
  - kind: sysobjectid
    pattern: 1.3.6.1.4.1.41112
    class: network_device
    vendor: Ubiquiti Networks
    confidence: 0.70
    source_url: *iana_pen

  # ===========================================================================
  # enip — ODVA vendor ids from the EtherNet/IP List Identity response
  # ===========================================================================
  #
  # One rule, and that is not an oversight. A device answering List Identity is
  # certainly industrial, but the ODVA vendor-id list is a subscriber document
  # and this file's rule is that a mapping has to be citable. Vendor id 1 is
  # the one every EtherNet/IP reference states outright. The rest belong here
  # too — added from the ODVA list by a platform admin who has it, through
  # Catalog ▸ Classification rules, which is exactly the growth path ADR-0004
  # D6 asks for.
  - kind: enip
    pattern: "1"
    class: ot_device
    vendor: Rockwell Automation
    confidence: 0.80
    source_url: *odva

  # ===========================================================================
  # cloud_type — what a cloud provider says a resource IS
  # ===========================================================================
  #
  # The highest-confidence evidence in this file. A resource type is not
  # inferred from anything: the provider's own API states it, in a closed
  # vocabulary, and it maps onto exactly one class.
  #
  # Only the 18 types the cloud collectors actually emit today are here.
  # `compute_instance` and `serverless_function` are declared in
  # standards/connectors.yaml but nothing produces them yet, and a rule with no
  # producer is a layer shipped without its consumer — it lands with the
  # collector, not before it.
  - kind: cloud_type
    pattern: aws_alb
    class: cloud_load_balancer
    confidence: 0.95
    source_url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/introduction.html
  - kind: cloud_type
    pattern: aws_nlb
    class: cloud_load_balancer
    confidence: 0.95
    source_url: https://docs.aws.amazon.com/elasticloadbalancing/latest/network/introduction.html
  - kind: cloud_type
    pattern: aws_elb
    class: cloud_load_balancer
