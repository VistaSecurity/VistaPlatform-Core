  # ===========================================================================
  # port_profile — combinations that mean one thing
  # ===========================================================================
  #
  # Two rules, both printers, because a port profile has to be UNMISTAKABLE to
  # be worth anything and almost none are. 9100 with 631 is a network printer
  # speaking raw JetDirect and IPP; 9100 with 515 is the same printer speaking
  # LPD. Nothing else ships that pair.
  #
  # What was considered and left out:
  #
  #   * 623 (IPMI) → `bmc`. IPMI is UDP, and the open-port list carries no
  #     protocol, so the rule would fire on a TCP service that happens to sit
  #     on 623.
  #   * 502 (Modbus/TCP) → `ot_device`. One open port is not a profile. Modbus
  #     on 502 is genuinely industrial, but a single port is also what a
  #     honeypot, a port-forward and a protocol gateway look like, and the OT
  #     probers measure the protocol rather than guessing from the number.
  #   * 3389 (RDP) → anything. RDP says the host runs Windows, which is an OS
  #     fact and belongs in os.name, not a class.
  - kind: port_profile
    pattern: 631,9100
    class: printer
    confidence: 0.80
    source_url: https://www.pwg.org/ipp/everywhere.html
  - kind: port_profile
    pattern: 515,9100
    class: printer
    confidence: 0.75
    source_url: https://datatracker.ietf.org/doc/html/rfc1179

