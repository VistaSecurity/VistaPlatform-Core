  # ===========================================================================
  # cdp_capabilities — what a Cisco device says it DOES
  # ===========================================================================
  #
  # These three replace a hardcoded switch statement in
  # shared/deviceinterrogation/cisco_ops.go, which read a CDP neighbour's
  # advertised capability string and returned `switch` or `router` from Go. It
  # was the last class hint left outside this table after 2.10a, and it was in
  # the worst place for one: a rule nobody could see, curate or cite.
  #
  # The ANSWERS are unchanged, deliberately — `TestClassHintParity_…` compares
  # this table against a verbatim transcription of the pre-move behaviour, and a
  # refactor that quietly re-decided what a device is would be the wrong-fact-
  # that-looks-right this file exists to avoid.
  #
  # Note the combination rule and why it is not a contradiction. A device that
  # both switches and routes advertises both bits, and the engine returns only
  # the MOST SPECIFIC matching set, so `router,switch` is the only rule
  # consulted for it — not an argument with the two single-capability rules
  # underneath.
  #
  # Its class is `network_device`, their common ancestor, and this is the ONE
  # answer the move out of Go deliberately changed. The Go switch statement
  # returned `switch` for "Router Switch", on the reasoning that the more
  # specific answer is the one it forwards at. That is true of a Catalyst doing
  # inter-VLAN routing and false of an ISR with a built-in or modular switch —
  # which advertises exactly the same two bits and is a router. So `switch` is
  # PROBABLY right, and the rule of thumb at the top of this file says prefer a
  # broad class that is CERTAINLY right over a narrow one that is probably
  # right. `network_device` is certainly right for both.
  #
  # It also makes the two capability kinds agree. `lldp_capability`
  # `bridge,router` — the same device seen over the other protocol — already
  # answers `network_device`, with that argument spelled out below. Two
  # opposite answers for one evidence shape in one table is itself the
  # curation bug this file exists to catch, and a reviewer reading both would
  # not know which principle was live.
  #
  # Nothing is lost where the evidence is better: a recognised Catalyst PID is
  # an 0.85 `model` rule, `network_device` is its ancestor and therefore
  # dropped as a refinement, and the answer is still `switch`.
  #
  # What is deliberately absent:
  #
  #   * `host` → anything. Every end station sets it, from a server to a
  #     laptop to a badge reader, and the taxonomy's honest answer for "some
  #     computer" is the one the fallback already gives.
  #   * `voip_phone` / `cvta_phone` → a phone class. There isn't one:
  #     standards/asset-classes.yaml has no `ip_phone`, and `iot_device` would
  #     be a category error for a desk telephone. Adding the class is a
  #     taxonomy decision, not a rule.
  #   * `igmp_capable`, `repeater`, `remotely_managed`, `two_port_mac_relay`
  #     and the two bridge bits → anything. They describe a FEATURE, not a
  #     kind of device.
  - kind: cdp_capabilities
    pattern: router
    class: router
    confidence: 0.65
    source_url: https://www.cisco.com/c/en/us/support/docs/network-management/discovery-protocol-cdp/13414-103.html
  - kind: cdp_capabilities
    pattern: router,switch
    class: network_device
    confidence: 0.70
    source_url: https://www.cisco.com/c/en/us/support/docs/network-management/discovery-protocol-cdp/13414-103.html
  - kind: cdp_capabilities
    pattern: switch
    class: switch
    confidence: 0.65
    source_url: https://www.cisco.com/c/en/us/support/docs/network-management/discovery-protocol-cdp/13414-103.html

  # ===========================================================================
  # lldp_capability — IEEE 802.1AB system capabilities
  # ===========================================================================
  #
  # Table 8-4 of 802.1AB. A wired segment is full of these and they are the
  # strongest passive class signal on it — but only two of the eleven bits mean
  # one thing on their own, and the restraint is most of the value here.
  #
  #   * `bridge` alone → NOTHING. It is the bridging function, and an access
  #     point bridges, a desk phone's built-in two-port switch bridges, and a
  #     hypervisor's vSwitch bridges. "Bridge means switch" is the single
  #     easiest wrong rule to write in this file.
  #   * `bridge` WITH `router` → `network_device`, their common ancestor, and
  #     not `switch` or `router`. The device does both; both leaves would be
  #     half right, and the tree exists so that a broad answer can be certainly
  #     right (see the rule of thumb at the top of this file). The engine
  #     returns only this rule for such a device, so it refines the `router`
  #     rule below rather than arguing with it.
  #   * `wlan_access_point` → `access_point`. Nothing but an access point sets
  #     it; this is the one genuinely unambiguous bit.
  #   * `router` alone → `router`. It forwards at layer 3 and does not bridge.
  #   * `telephone` → no rule, for the same reason CDP's `voip_phone` gets
  #     none: the taxonomy has no phone class.
  #   * `station_only` → no rule. It says the device neither bridges nor
  #     routes, which is true of a server, a laptop, a printer and a camera
  #     alike, so there is no class it narrows to.
  #   * `repeater`, `docsis_cable_device`, `c_vlan_component`,
  #     `s_vlan_component`, `two_port_mac_relay`, `other` → no rule. A feature
  #     or, for `other`, an explicit refusal to say.
  - kind: lldp_capability
    pattern: bridge,router
    class: network_device
    confidence: 0.70
    source_url: https://standards.ieee.org/ieee/802.1AB/7514/
  - kind: lldp_capability
    pattern: router
    class: router
    confidence: 0.65
    source_url: https://standards.ieee.org/ieee/802.1AB/7514/
  - kind: lldp_capability
    pattern: wlan_access_point
    class: access_point
    confidence: 0.75
    source_url: https://standards.ieee.org/ieee/802.1AB/7514/

  # ===========================================================================
  # mdns_service — what a host advertises about itself
  # ===========================================================================
  #
  # A DNS-SD advertisement is the host describing its own function to the
  # segment, unprompted. That makes it a statement about the HOST, which is
  # exactly what an SSH banner is not — every class in the taxonomy runs sshd,
  # and none of them advertise `_ipp._tcp` unless they accept print jobs.
  #
  # Printers, plus a handful of consumer smart-home and media protocols. That
  # is not an oversight. The DNS-SD registry is large and almost every other
  # entry describes software rather than a kind of device: `_smb._tcp` is a
  # NAS, a server, a workstation and a printer with scan-to-share;
  # `_workstation._tcp` is whatever Avahi is installed on; `_ssh._tcp` is the
  # banner problem with a different transport.
  #
  # The smart-device rules (`smart_device`, the consumer sibling of
  # `iot_device`) are the protocols only a consumer device RECEIVES on:
  #
  #   * `_googlecast._tcp` — a Google Cast receiver: a Chromecast, a TV or
  #     speaker with Cast built in, a Nest smart display. Chrome browses for
  #     it; it does not advertise it.
  #   * `_matter._tcp` — a Matter operational node. Matter is the consumer
  #     smart-home standard (plugs, bulbs, locks, thermostats).
  #
  # Deliberately NOT given a rule, because each is advertised by
  # general-purpose computers too, and a wrong class is worse than no class:
  #
  #   * `_airplay._tcp`, `_raop._tcp` — every Mac advertises an AirPlay
  #     receiver, not only Apple TVs and AirPlay speakers.
  #   * `_spotify-connect._tcp` — the Spotify desktop app advertises it.
  #   * `_ssh._tcp`, `_sftp-ssh._tcp` — Macs, Linux hosts and NAS units alike.
  #   * `_companion-link._tcp` — every Apple device: Mac, iPhone, iPad, Apple TV.
  #   * `_dns-sd._udp` — the DNS-SD meta-query itself; it says nothing about the
  #     host.
  #   * `_hap._tcp` — a HomeKit accessory, usually. But Homebridge and Home
  #     Assistant's HomeKit bridge advertise it from an ordinary Linux host,
  #     which has no os_name rule to conflict with, so the box would be
  #     proposed as a smart device. Until a corroborating signal (a vendor)
  #     can be required alongside it, it stays out.
  #
  # Two the brief proposed and this file does not carry yet, for want of a
  # citation: `_amzn-wplay._tcp` (Fire TV) and `_xboxda._tcp` (Xbox). Neither
  # is in the IANA service-name registry, and no vendor document found names
  # them. Every rule here cites its source; add them with one.
  - kind: mdns_service
    pattern: _ipp._tcp
    class: printer
    confidence: 0.75
    source_url: https://www.rfc-editor.org/rfc/rfc8011.html
  - kind: mdns_service
    pattern: _ipps._tcp
    class: printer
    confidence: 0.75
    source_url: https://www.rfc-editor.org/rfc/rfc8010.html
  - kind: mdns_service
    pattern: _pdl-datastream._tcp
    class: printer
    confidence: 0.70
    source_url: https://www.pwg.org/ipp/everywhere.html
  - kind: mdns_service
    pattern: _printer._tcp
    class: printer
    confidence: 0.75
    source_url: https://datatracker.ietf.org/doc/html/rfc1179
  - kind: mdns_service
    pattern: _matter._tcp
    class: smart_device
    confidence: 0.75
    source_url: https://csa-iot.org/all-solutions/matter/
  - kind: mdns_service
    pattern: _googlecast._tcp
    class: smart_device
    confidence: 0.75
    source_url: https://developers.google.com/cast/docs/discovery

  # ===========================================================================
  # os_name — what the host says it runs
  # ===========================================================================
  #
  # Every other kind in this file keys on something a device emitted onto a
  # network or on an identifier registered to a manufacturer. A general-purpose
  # computer emits none of it: its OUI belongs to Dell or Intel and is
  # vendor-only by design, it answers no SNMP, it advertises no capability, and
  # its model string ("XPS 16 9640", "OptiPlex 7010") is a consumer product line
  # no catalogue will ever enumerate. So the commonest thing on a corporate
  # network was the one thing the rules could not classify, and a fully
  # inventoried laptop — OS, vendor, model, serial, 106 packages, 69 certificate
  # stores, 83 listening sockets — stayed `unknown_host`.
  #
  # An OS name closes exactly that gap and nothing wider. What it establishes is
  # that the subject is a general-purpose computer; what it does NOT establish
  # is which KIND of computer, and the rules below stop where the evidence does.
  #
  #   * A client Windows or macOS release → `computer`, never `workstation` or
  #     `laptop`. Those are siblings ("a desktop computer used by a person" and
  #     "a portable computer used by a person") and an OS name cannot tell them
  #     apart: the asset this rule was written for is a Windows 11 laptop, and
  #     `workstation` would have been the narrow-and-probably-wrong answer the
  #     header of this file forbids. Their common ancestor is certainly right,
  #     and a later rule or a reviewer can refine it without contradicting it.
  #   * A Windows SERVER release → `server`. Microsoft ships and licenses those
  #     editions for server use only; this is one product line with one meaning,
  #     which is what the 0.80 band is for. `server` refines `computer`, so a
  #     host matching both resolves to `server` rather than conflicting.
  #   * Linux and the BSDs → NO RULE, deliberately. A distribution name is not a
  #     statement of function: Debian runs on a rack server, a developer's
  #     desktop, a firewall appliance, a NAS, a label printer and a Ubiquiti
  #     gateway, and every one of those is a different class. There is no
  #     spelling of "Ubuntu" that means `server`, so the honest answer is the
  #     one this file always gives when a vendor spans several classes: say
  #     nothing, and let the OUI, the capabilities or a human decide.
  #   * Network-appliance operating systems (IOS, JunOS, PAN-OS, FortiOS) get no
  #     rule here either. The `platform` kind already carries them, from the
  #     management API the collector actually spoke to, and that is a stronger
  #     claim than a version banner's spelling of the same name.
  #
  # The patterns are word-anchored rather than prefixed, because the same four
  # answers arrive spelled four ways: `Microsoft Windows 11 Pro` from WMI,
  # `Windows 11 Pro` from the agent's own probe, `Microsoft Windows Server 2022
  # Datacenter` from one and `Windows Server 2022` from another. They are also
  # mutually exclusive on every real name — no client release contains the words
  # "windows server", and no server release contains a client version number.
  - kind: os_name
    pattern: (?i)\bwindows[ ]+server\b
    class: server
    confidence: 0.80
    source_url: https://learn.microsoft.com/en-us/windows-server/get-started/editions-comparison-windows-server-2022
  - kind: os_name
    pattern: (?i)\bwindows[ ]+(xp|vista|7|8|8\.1|10|11)\b
    class: computer
    confidence: 0.75
    source_url: https://learn.microsoft.com/en-us/windows/release-health/windows11-release-information
  - kind: os_name
    pattern: (?i)^(mac ?os( ?x)?|os ?x)\b
    class: computer
    confidence: 0.75
    source_url: https://support.apple.com/en-us/109033

  # ===========================================================================
  # dhcp_vendor_class — what the DHCP client calls itself
  # ===========================================================================
  #
  # DHCP option 60, the vendor class identifier (RFC 2132 section 9.13), is a
  # string the client's DHCP implementation puts in every DISCOVER and REQUEST
  # without anyone configuring it. The sensor's DHCP decoder (shared/hostobs)
  # records it as the `dhcp_vendor_class` attribute, and it is passive evidence
  # about hosts the wire otherwise says little about: a Windows laptop's MAC
  # names Intel or Dell, which is vendor-only by design, while its DHCP
  # exchange names a Windows client.
  #
  # What it names is the DHCP CLIENT SOFTWARE — not the hardware manufacturer,
  # and so never a vendor on its own (the decoder says so too: option 60 is a
  # classification signal, never hw.vendor). The rules below stop at what the
  # client software establishes:
  #
  #   * `MSFT 5.0` → `computer`, no vendor. Microsoft's DHCP extensions
  #     ([MS-DHCPE], "DHCPv4 Option Code 60 - Vendor Class Identifier Option")
  #     define it as the Windows DHCP client's identifier, and the Windows DHCP
  #     server predefines it as the class of "Windows 2000 and later" clients
  #     ([MS-DHCPM]). The OS vendor is not the hardware vendor, so the rule
  #     states a class only. A Windows SERVER sends
  #     it too, and that is fine: `server` refines `computer`, so a host the
  #     os_name rules call a server resolves to `server`, not to a conflict.
  #     Exact-anchored, so `MSFT 5.0 XBOX` (which [MS-DHCPE] defines for a
  #     console that "claims to be" an Xbox) and `MSFT 98` (a Windows 9x client
  #     that understands none of the vendor options) match nothing. 0.75, not
  #     higher: the same specification notes that not every Xbox uses the XBOX
  #     form, so a console may yet send the plain string.
  #   * `android-dhcp-<release>` → `mobile`, 0.70. The Android network stack
  #     builds it from the platform release (NetworkStack DhcpPacket.getVendorId).
  #     The bottom of the 0.70–0.79 band rather than 0.75 because Android TVs and
  #     some set-top boxes run the same stack and send the same string; such a
  #     device usually advertises `_googlecast._tcp` as well, whose
  #     `smart_device` rule (0.75) sits within the conflict epsilon of this one
  #     and is unrelated in the taxonomy, so the engine proposes nothing for it
  #     — the honest outcome — rather than calling a television a phone.
  #   * `Cisco AP <model>` → `access_point`, vendor Cisco Systems, 0.80. Cisco
  #     documents these strings, one per Aironet / Catalyst access-point
  #     family, as what its lightweight APs send so a DHCP server can hand them
  #     a controller address in option 43. One product line, one meaning.
  #   * `Hewlett-Packard JetDirect` → `printer`, vendor Hewlett Packard, 0.80.
  #     The JetDirect network interface on HP printers identifies itself this
  #     way. No HP-published document stating the string could be found; the
  #     citation is the SANS Internet Storm Center diary that documents it.
  #     Other HP spellings (`HP LaserJet …`, `HP OfficeJet …`) are NOT ruled:
  #     they are plausible, and nothing citable says a printer sends them.
  #
  # Deliberately NOT given a rule — each was considered:
  #
  #   * `udhcp <ver>` — BusyBox's DHCP client. It is inside home routers, IP
  #     cameras, televisions, smart plugs and NAS units alike; it names a
  #     toolkit, not a device.
  #   * `dhcpcd-<ver>` — the dhcpcd client, on any Linux or BSD host: a server,
  #     a desktop, a Raspberry Pi, an appliance. The os_name reasoning about
  #     distributions applies unchanged.
  #   * `PXEClient…` — a network boot ROM. It is a server or a workstation
  #     mid-boot, and the string says nothing about which.
  #   * `AAPL…` (`AAPLBSDPC/…`, Apple's NetBoot client) — the OUI already names
  #     Apple, and the class it would carry is wrong: a Mac, an iPhone and an
  #     Apple TV are three different classes.
  #   * `Linux …`, `SUNW.…` / `Sun Microsystems` — too broad, and historic.
  #   * `ubnt` (Ubiquiti) — would be vendor-only, and the OUI registry already
  #     states that vendor for every Ubiquiti MAC.
  #   * `Polycom-…`, `Yealink …` desk phones — recognisable, but the taxonomy has
  #     no phone class (see the CDP/LLDP telephone note above), and `iot_device`
  #     for a desk telephone is a category error.
  #
  # Option 55 (the parameter request list, stored as `dhcp_param_request_list`)
  # is a FINGERPRINT of the client implementation rather than a statement, and
  # matching it needs a curated corpus (Fingerbank-style). It is not this kind;
  # it would be a later kind of its own.
  - kind: dhcp_vendor_class
    pattern: '^Cisco AP '
    class: access_point
    vendor: Cisco Systems
    confidence: 0.80
    source_url: https://www.cisco.com/c/en/us/support/docs/wireless-mobility/wireless-lan-wlan/97066-dhcp-option-43-00.html
  - kind: dhcp_vendor_class
    pattern: ^Hewlett-Packard JetDirect
    class: printer
    vendor: Hewlett Packard
    confidence: 0.80
    source_url: https://isc.sans.edu/diary/1652
  - kind: dhcp_vendor_class
    pattern: ^MSFT 5\.0$
    class: computer
    confidence: 0.75
    source_url: https://learn.microsoft.com/en-us/openspecs/windows_protocols/ms-dhcpe/819e0181-af14-42c6-b454-9f37b133031b
  - kind: dhcp_vendor_class
    pattern: ^android-dhcp-
    class: mobile
    confidence: 0.70
    source_url: https://android.googlesource.com/platform/packages/modules/NetworkStack/+/refs/heads/main/src/android/net/dhcp/DhcpPacket.java
