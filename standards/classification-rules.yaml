  # ===========================================================================
  # banner — what a service said about itself
  # ===========================================================================
  #
  # The weakest evidence here, and scoped accordingly. Each pattern anchors on
  # an HTTP `Server:` header family and proposes `web_application` — the thing
  # answering on that port is a web application, which is a statement about the
  # SERVICE and is true whatever host it runs on.
  #
  # Three families are deliberately absent:
  #
  #   * SSH. `SSH-2.0-OpenSSH_9.6` says the host runs sshd. It says nothing
  #     about what the host IS — every class in the taxonomy from `server` to
  #     `switch` to `plc` runs one — and `service_daemon` would be proposing a
  #     class for the host on the strength of a login service.
  #   * Reverse proxies and CDNs. `Server: cloudflare` describes the thing
  #     ANSWERING, which is not the asset. A rule here would classify the
  #     customer's origin as somebody else's edge.
  #   * Anything that identifies a device by an embedded web server. "HP HTTP
  #     Server" is on printers and on iLO service processors alike, and the two
  #     are different classes.
  #
  # Vendors are omitted throughout: the vendor of a web application is a
  # SOFTWARE vendor, and writing "Apache Software Foundation" into a proposal
  # that intake may land in hw.vendor would break the hardware end-of-life
  # join that key exists for.
  - kind: banner
    pattern: '(?i)^server:\s*apache(?:[/ ]|$)'
    class: web_application
    confidence: 0.65
    source_url: https://httpd.apache.org/docs/current/mod/core.html#servertokens
