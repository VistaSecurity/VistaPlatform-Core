  # === application =========================================================
  - key: application
    parent: null
    label: Application
    description: >-
      Software running on a host. Dependent identity: matched by its host
      asset plus product plus instance name, not by an address of its own.
    icon: AppWindow
    cmdb_ci_type: cmdb_ci_appl
    cyclonedx_type: application
    legacy_asset_type: service
    # `name` carries the DEPENDENT-identity key of ADR-0002 D3, not a label: an
    # application is identified by its host plus product plus instance, and that
    # tuple is written into a `name` identifier scoped by the class key (see
    # identity.ResolveDependent / applicationDependentIdentifier).
    #
    # Without it these classes had `[cmdb_sys_id]` alone, so an application from
    # any source but a CMDB could never be matched a second time: the first
    # sighting created an asset carrying a hostname identifier that was not
    # allowed to vote, and every sighting after that hit the floor and opened
    # ANOTHER merge proposal. A poller on a fifteen-minute schedule produced
    # ninety-six a day.
    #
    # hostname/fqdn are deliberately NOT added: they would match the HOST asset,
    # and an application is not its host.
    identifier_precedence: [cmdb_sys_id, name]
    attribute_schema:
      type: object
      properties:
        product:
          type: string
          description: Software product name.
        version:
          type: string
          description: Product version.
        vendor:
          type: string
          description: Publisher of the software.

