  # === leaves ==============================================================
  - key: external
    parent: null
    label: External party
    description: >-
      An endpoint belonging to somebody else. Today's external-connections
      destination. Never actively probed (active-probing scope rule).
    icon: ExternalLink
    cmdb_ci_type: null
    cyclonedx_type: service
    legacy_asset_type: endpoint
    identifier_precedence: [fqdn, ip_address]
    attribute_schema:
      type: object
      properties:
        organization:
          type: string
          description: Organisation the endpoint is attributed to, if known.
        relationship:
          type: string
          enum: [vendor, partner, customer, unknown]
          description: How the tenant relates to that organisation.

  - key: unknown_host
    parent: null
    label: Unknown host
    description: >-
      A reachable address inside the tenant's own space that nothing has
      identified further, or a serial nothing has classified yet. A real asset
      with a real gap, not a placeholder — it is what makes "how much don't we
      know" answerable.
    icon: CircleQuestionMark
    cmdb_ci_type: null
    cyclonedx_type: device
    legacy_asset_type: endpoint
    # The two STRONGEST identifiers the product has lead here — especially here.
    #
    # The class says what a thing IS, not how it is recognised, and the two are
    # independent: a host an agent is INSTALLED ON but nothing has classified
    # still carries the strongest identifier the product has. Omitting agent_id
    # (as this list did until 2.11b) meant a host-inventory report whose only
    # durable identity was its agent id could never DECIDE a match, so every
    # collection either created another asset or — once the agent id was owned
    # by the first one — opened a merge proposal on every run.
    #
    # `serial_number` leads for the same reason, resolved (ADR-0002
    # D3 erratum). A serial is a globally unique SINGLETON: two observations
    # sharing one are one device whatever their class, so refusing to match on
    # it does not make the class more honest, it makes the class unable to
    # recognise something it has already met. Refusing it produced a fresh merge
    # proposal per run for every serial-only device — a NetBox estate's spare
    # chassis, which have a serial and nothing else — and forced the NetBox
    # connector to skip them (its classCanMatch) and workstream 2.11b to work
    # around it.
    #
    # Neither widens what LANDS as unknown_host: only a host we issued an agent
    # id to has one, and a serial arrives from a CMDB, a DCIM or the hardware
    # itself. Both widen what can be RECOGNISED again, which is the whole job.
    # The singleton guard is unaffected — a serial that DISAGREES with the one
    # the matched asset carries is still outcome three, at every class.
    identifier_precedence:
      [serial_number, agent_id, ssh_host_key_fingerprint, mac_address, fqdn,
       hostname, ip_address]
    attribute_schema:
      type: object
      properties: {}
