version: 1
updated: 2025-09-29

metadata:
  organization: VistaSecurity
  project: vistaplatform
  gateway:
    host: https://api.example.com
    api_prefix: /api/v2
    legacy_api_prefix: /api/v1  # Deprecated but still functional
    # Subdomain that hosts API traffic in multi-host topologies
    # (ec2-smoke single-host-behind-ALB, RKE2 IngressRoute, etc.).
    # Used by scripts/generate-traefik-config.mjs when gateway_routes_ui=true.
    api_host_subdomain: api

# Per-deployment topology flags consumed by the registry-driven generators.
# Keep these aligned with the actual ingress topology of each environment:
#  - development: web-ui and admin-ui served directly by Vite (no Traefik UI routing)
#  - ec2-smoke:   single EC2 host behind an ALB; Traefik must front both API and UIs by Host()
#  - production:  RKE2/k8s ingress splits Hosts to api-gateway/web-ui/admin-ui Services,
#                 so the api-gateway pod's Traefik handles only /api/* (no UI routers)
deployments:
  development:
    gateway_routes_ui: false
  ec2-smoke:
    gateway_routes_ui: true
  production:
    gateway_routes_ui: false

# Infrastructure services that are manually defined (not generated from registry)
# These require environment-specific configuration and are excluded from generation.
# The .env file is auto-generated by scripts/generate-dev-env.sh
infrastructure:
  exceptions:
    - postgres
    - redis
    - nats
    - influxdb
    - api-gateway
    # Observability stack
    - otel-collector
    - prometheus
    - jaeger
    - grafana
    - adminer
    - portainer
  rationale: "Infrastructure and observability services are environment-specific and not driven by service registry"

  # Development port generation configuration
  # Used by scripts/generate-dev-env.mjs to create .env
  dev_port_generation:
    base_port: 18000
    # Fixed ports (locked for ALB target group compatibility or well-known ports)
    fixed_ports:
      api_gateway: 8080
      web_ui: 3000
      admin_ui: 3006
      jaeger_ui: 16686
    # Generated ports (base_port + offset, avoids dev tool conflicts)
    generated_ports:
      nats_client: 0      # 18000
      nats_http: 1        # 18001
      grafana: 2          # 18002
      adminer: 3          # 18003
      portainer: 4        # 18004 (HTTPS UI → container 9443; dev override only)
    # Database and infrastructure ports (keep defaults, rarely conflict)
    default_ports:
      postgres: 5432
      redis: 6379
      influxdb: 8086
      otel_grpc: 4317
      otel_http: 4318
    # Environment variable names for port overrides
    port_env_vars:
      api_gateway: API_GATEWAY_HOST_PORT
      web_ui: WEB_UI_HOST_PORT
      admin_ui: ADMIN_UI_HOST_PORT
      postgres: POSTGRES_HOST_PORT
      redis: REDIS_HOST_PORT
      nats_client: NATS_CLIENT_HOST_PORT
      nats_http: NATS_HTTP_HOST_PORT
      influxdb: INFLUXDB_HOST_PORT
      grafana: GRAFANA_HOST_PORT
      adminer: ADMINER_HOST_PORT
      portainer: PORTAINER_HTTPS_HOST_PORT
      otel_grpc: OTEL_GRPC_HOST_PORT
      otel_http: OTEL_HTTP_HOST_PORT
      jaeger_ui: JAEGER_UI_HOST_PORT
      # Service-specific port env vars (matching docker-compose.yml)
      resource-tracker-service: RESOURCE_TRACKER_HOST_PORT
      tenant-health-service: TENANT_HEALTH_HOST_PORT
      cluster-sensor-service: CLUSTER_SENSOR_HOST_PORT

# =============================================================================
# Docker Base Image Versions
# =============================================================================
# Single source of truth for all base image versions used across services.
# To update an image: change the version here, then run 'make generate'.
# The generated docker-compose-services.yml and .env will both reflect the change.
# See docsv4/development/standards/DOCKER_IMAGE_MANAGEMENT.md for upgrade process.
# =============================================================================
docker_images:
  # Standard Docker Hub images (default for all environments)
  go_builder: "golang:1.26-alpine"   # Multi-stage build stage for all Go services
  runtime: "alpine:3.24.1"           # Final runtime stage for all Go services
  node: "node:24-alpine"             # Node.js services and frontend builds

  # Docker Hardened Images (dhi.io) — used when dhi.enabled=true in .dev-config.json
  # These are the CVE-scanned equivalents of the standard images above.
  # Update alongside the standard versions when upgrading base images.
  # NOTE: DHI rebuilds the alpine3.24 track same-day on every upstream Go patch;
  # alpine3.23 lags by days-to-weeks (sometimes skipping a patch release). Stay
  # on whichever Alpine track DHI is actively prioritizing to avoid CVE lag.
  dhi:
    go_builder: "dhi.io/golang:1.26-alpine3.24-dev"
    runtime: "dhi.io/alpine-base:3.24-dev"
    node: "dhi.io/node:24-alpine3.22-dev"

ui:
  # The tenant UI host is served by web-ui, built from the frontend-v2/ source
  # (build-and-swap, ADR-0013): the Service keeps its `web-ui` identity (name +
  # :3000 host port + chart webUi.* + dist/release image `web-ui`); only the build
  # source is frontend-v2.
  tenant:
    name: web-ui
    external_port: 3000
    internal_port: 3001
    path: frontend-v2
    # Subdomain used in multi-host topologies (ec2-smoke ALB, RKE2 ingress).
    # Combined with the deployment DOMAIN to form e.g. app.example.com.
    host_subdomain: app
  # The admin UI host is served by admin-ui ("VISTA Operations"), built from the
  # admin-ui-v2/ source (build-and-swap, ADR-0013 — same pattern as web-ui): the
  # Service/image keep the original `admin-ui` identity; the source directory
  # stays admin-ui-v2/.
  admin:
    name: admin-ui
    external_port: 3006
    internal_port: 3007
    path: admin-ui-v2
    host_subdomain: admin

# ─── Admin plane ────────────────────────────────────────────────────
#
# The platform-admin control plane: routes that are CROSS-TENANT and are
# reachable only by a platform admin (`platform_access_token` + a platform RBAC
# permission). These are the crown jewels — the RBAC gate on them is the only
# thing standing between a caller and every tenant's data — so they must not be
# reachable on the public tenant host at all.
#
# Consumed by:
#   scripts/generate-k8s-ingress.mjs  — emits, for every prefix below,
#       * an ALLOW route on the admin host (tls.adminDnsName), optionally
#         behind the operator's IP allow-list, and
#       * a DENY route on the tenant host (tls.dnsName) that never reaches a
#         backend.
#   scripts/audit-admin-plane.mjs     — fails `make audit` when a Go service
#       mounts a platform-admin-gated route group whose path is not listed
#       here, or when the generated chart is missing a deny/allow pair.
#
# Paths are relative to /api/v1 and /api/v2 — both versions are generated.
# A trailing "/" means prefix match; no trailing slash means that exact path
# and anything under it (used where a service mixes tenant-admin and
# platform-admin routes under the same /admin segment — see sensor-manager).
#
# KNOWN GAP, deliberately not listed: inventory-service POST/PUT
# /inventory-service/algorithms are platform-permission-gated *methods* on a
# path whose GET is tenant-facing. Host-based splitting cannot express that;
# the RBAC gate remains the only control..
admin_plane:
  prefixes:
    # admin-service — platform-admin login + the entire /admin/** console API,
    # including the MSP management plane and platform billing administration.
    - /admin-service/auth/
    - /admin-service/admin/
    - /admin-service/status/
    # auth-service — cross-tenant impersonation. /platform currently holds NO
    # gated routes, only the three PUBLIC branding/signup endpoints excepted
    # below — the deny stays so a future gated route under /platform is
    # deny-by-default. (An earlier comment here claimed the prefix was empty;
    # it never was, and the deny silently 404'd platform branding on every
    # Kubernetes install. If you add a PUBLIC route under this prefix it MUST
    # go into public_exceptions, or it is dead on the tenant host.)
    - /auth-service/admin/
    - /auth-service/platform/
    # sensor-manager — NOTE the narrow prefix. /sensor-manager/admin/settings
    # and /admin/capture-defaults are TENANT-admin routes that must stay on the
    # public host; only /admin/sensors is the cross-tenant fleet roll-up.
    - /sensor-manager/admin/sensors
    - /sensor-manager/platform/
    # monitoring-service — platform metrics, SIEM log export, alerting,
    # trends, the Traefik dashboard proxy, and system status.
    - /monitoring-service/platform/
    - /monitoring-service/logs/
    - /monitoring-service/alerting/
    - /monitoring-service/trends/
    - /monitoring-service/gateway/
    - /monitoring-service/admin/
    # compliance-engine — per-tenant manual re-evaluation and the platform-track
    # stateful alert feed (raised under the sentinel platform tenant).
    - /compliance-engine/admin/
    # device-interrogation-service — cross-tenant job queues and job repair.
    - /device-interrogation-service/admin/
    # notification-service — platform channels, rules, maintenance windows,
    # history, and the platform staff inbox.
    - /notification-service/platform/
    # tenant-health-service — the WHOLE service is a cross-tenant governance
    # surface consumed only by admin-ui.
    - /tenant-health-service/

  # ─── Internal plane ──────────────────────────────────────────────
  #
  # Service-to-service routes. Unlike the admin plane there is no host these
  # should be reachable on from outside the cluster at ALL, so they get a deny
  # on BOTH the tenant and the admin host.
  #
  # They are HMAC-gated (INTERNAL_AUTH_SECRET), so this is defence in depth
  # rather than a fix for a live hole. The argument for it: no browser and no
  # customer integration ever calls these, so publishing them at the edge buys
  # nothing and exposes an HMAC verifier plus whatever parsing sits behind it to
  # anonymous internet traffic. A deployment whose INTERNAL_AUTH_SECRET leaked —
  # one shared secret across every service, with no rotation lever — would
  # otherwise have no second line of defence.
  #
  # Every caller was verified to be an in-cluster Go service reaching the peer
  # through PeerURL/<svc>URL, never through the edge. S2S traffic addresses
  # Services directly and does not transit Traefik, so denying these at the
  # ingress does not affect it.
  internal_prefixes:
    # POST /send — the raw delivery path that bypasses the rule engine.
    # Callers: monitoring-service, audit-service, cluster-sensor-service,
    # device-interrogation-service, admin-service (ee/billing, on v2).
    - /notification-service/internal/
    # POST /pcap/jobs/:id/results — pcap-processor returning job output.
    - /sensor-manager/internal/
    # POST /api-tokens/exchange — mcp-service resolving PATs to grants.
    # Sole caller reaches auth-service via PeerServiceURLAuto (in-cluster,
    # never through the edge). HMAC-gated with RequireInternalOnly.
    - /auth-service/internal/

  # Prefixes whose first URL segment does not name the Service that answers
  # them. /admin-service/status/** is historically routed to monitoring-service.
  service_overrides:
    /admin-service/status/: monitoring-service

  # Paths that sit *inside* one of the prefixes above but must remain reachable
  # on the public host. Each needs a justification: something outside the
  # operator's network has to reach it.
  public_exceptions:
    # Inbound billing-provider webhook. The provider posts from its own
    # infrastructure to the public host; it can never come from the operator's
    # admin network. Payload authenticity is established by the provider's
    # signature, verified in the handler — not by network position.
    - /admin-service/admin/billing/webhook/
    # Public platform branding, read by the tenant login/signup pages before
    # any authentication exists. Serving the fallback wordmark instead is how
    # this deny's over-reach was finally noticed.
    - /auth-service/platform/config
    - /auth-service/platform/ui-config
    # Social-signup provider discovery (ee builds; the route simply doesn't
    # exist in Core, where this exception then matches nothing). The signup
    # page reads it unauthenticated to render the provider buttons.
    - /auth-service/platform/sso-providers

  # Anonymous-public routes that live under a denied prefix ON PURPOSE: they
  # establish the platform-admin session, so they belong on the ADMIN host
  # only, and being unreachable on the tenant host is the design, not a bug.
  # Consumed by scripts/audit-admin-plane.mjs's inverse check (A2) — a public
  # route under a denied prefix must be EITHER a public_exception (tenant host
  # must serve it) OR listed here (admin host serves it). Anything in neither
  # list fails the audit. NB: password-reset emails must link to the admin
  # host, or the link 404s.
  admin_host_public:
    # Platform-admin login, token refresh, and password reset.
    - /admin-service/auth/
    # Staff SSO discovery + OAuth dance; callback host is the admin host.
    - /admin-service/admin/sso/

services:
  - key: auth-service
    name: auth-service
    dir: services/auth-service
    description: Tenant authentication and authorization
    internal_port: 8080
    external_port: 8081
    route_prefix: /auth-service
    gateway_timeout: 15s
    status: active
    # Secrets required by the running service. The audit step
    # (scripts/audit-compose-secrets.mjs) verifies each compose file
    # injects every secret listed here using the strict ${VAR:?...} form.
    required_secrets: [INTERNAL_AUTH_SECRET, ENCRYPTION_MASTER_KEY, JWT_SECRET]
    docker:
      type: go-service
      dependencies: [postgres, redis]
      env_template: standard-go-service
    endpoints:
      - path: /tenant/:id/security-summary
        method: GET
        description: "Get security metrics for a specific tenant (for tenant health service)"
        auth_required: true
        rbac_permissions: [platform.analytics, platform.health]

  - key: inventory-service
    name: inventory-service
    dir: services/inventory-service
    description: Asset and inventory management (Infrastructure Assets, Crypto Configurations, CMDB sync)
    internal_port: 8080
    external_port: 8082
    route_prefix: /inventory-service
    gateway_timeout: 30s
    api_versions: [v1, v2]
    status: active
    # ENCRYPTION_MASTER_KEY: CMDB connector credentials (cmdb_sync_profiles.
    # connection_config) are encrypted at rest with the shared AES-256-GCM
    # envelope service.
    required_secrets: [INTERNAL_AUTH_SECRET, ENCRYPTION_MASTER_KEY, JWT_SECRET]
    docker:
      type: go-service
      dependencies: [postgres, redis, nats]
      env_template: standard-go-service
    endpoints:
      - path: /tenant/:id/activity-summary
        method: GET
        description: "Get activity metrics for a specific tenant (for tenant health service)"
        auth_required: true
        rbac_permissions: [platform.analytics, platform.health]
    v2_routes:
      description: "CMDB-aligned terminology. v2 routes point to same handlers as v1."
      renamed_paths:
        /assets: /infrastructure-assets
        /crypto-implementations: /crypto-configurations
      new_paths:
        - /cmdb/profiles
        - /cmdb/profiles/:id
        - /cmdb/profiles/:id/test
        - /cmdb/profiles/:id/sync
        - /cmdb/profiles/:id/jobs

  - key: compliance-engine
    name: compliance-engine
    dir: services/compliance-engine
    description: Compliance checks and monitoring
    internal_port: 8080
    external_port: 8083
    route_prefix: /compliance-engine
    gateway_timeout: 30s
    status: active
    # Compliance engine validates tenant bearer tokens (JWT_SECRET) AND acts as
    # an HMAC client: the resource-tracking middleware signs metric posts to
    # resource-tracker-service and the audit middleware/job-logger sign activity
    # logs to audit-service — both via serviceauth.SignRequestFromEnv, which
    # reads INTERNAL_AUTH_SECRET. Without it, those calls degrade to an unsigned
    # X-Internal-Call header and every receiver rejects them with 401.
    required_secrets: [INTERNAL_AUTH_SECRET, JWT_SECRET]
    docker:
      type: go-service
      dependencies: [postgres, nats]
      env_template: standard-go-service

  - key: cbom-service
    name: cbom-service
    dir: services/cbom-service
    description: CBOM (Cryptographic Bill of Materials) artifacts, scopes, comparison
    internal_port: 8080
    external_port: 8084
    route_prefix: /cbom-service
    gateway_timeout: 60s
    status: active
    required_secrets: [INTERNAL_AUTH_SECRET, JWT_SECRET]
    docker:
      type: go-service
      dependencies: [postgres, nats]
      env_template: standard-go-service

  - key: sensor-manager
    name: sensor-manager
    dir: services/sensor-manager
    description: Sensor deployment and management
    internal_port: 8080
    external_port: 8085
    route_prefix: /sensor-manager
    gateway_timeout: 30s
    status: active
    required_secrets: [INTERNAL_AUTH_SECRET, ENCRYPTION_MASTER_KEY, JWT_SECRET]
    docker:
      type: go-service
      dependencies: [postgres, influxdb, nats]
      env_template: standard-go-service

  - key: cluster-sensor-service
    name: cluster-sensor-service
    dir: services/cluster-sensor-service
    description: Cluster discovery service
    internal_port: 8080
    external_port: 8088
    route_prefix: /cluster-sensor-service
    gateway_timeout: 30s
    status: active
    required_secrets: [INTERNAL_AUTH_SECRET, ENCRYPTION_MASTER_KEY, JWT_SECRET]
    docker:
      type: go-service
      dependencies: [postgres, redis, nats]
      env_template: standard-go-service

  - key: admin-service
    name: admin-service
    dir: services/admin-service
    description: Platform administration service
    internal_port: 8080
    external_port: 8089
    route_prefix: /admin-service
    gateway_timeout: 15s
    status: active
    required_secrets:
      - INTERNAL_AUTH_SECRET
      - ENCRYPTION_MASTER_KEY
      - JWT_SECRET
      # Stripe billing — admin-service owns the Stripe integration, which is
      # an Enterprise/MSP edition capability and lives under
      # services/admin-service/ee/billing/ (absent from a Core build).
      # Webhook signature
      # verification needs STRIPE_WEBHOOK_SECRET; signup wizard surfaces
      # STRIPE_PUBLISHABLE_KEY to the browser via runtime config.
      - STRIPE_SECRET_KEY
      - STRIPE_PUBLISHABLE_KEY
      - STRIPE_WEBHOOK_SECRET
    docker:
      type: go-service
      dependencies: [postgres, redis, nats]
      env_template: standard-go-service

  - key: monitoring-service
    name: monitoring-service
    dir: services/monitoring-service
    description: System health monitoring
    internal_port: 8080
    external_port: 8091
    route_prefix: /monitoring-service
    gateway_timeout: 15s
    status: active
    required_secrets: [INTERNAL_AUTH_SECRET, ENCRYPTION_MASTER_KEY, JWT_SECRET]
    docker:
      type: go-service
      dependencies: [postgres, redis, nats, influxdb]
      env_template: standard-go-service
    endpoints:
      - path: /platform/summary
        method: GET
        description: "Get aggregated platform metrics summary for a time range"
        auth_required: true
        rbac_permissions: [platform.analytics, platform.health]
      - path: /platform/services/:name
        method: GET
        description: "Get detailed metrics for a specific service"
        auth_required: true
        rbac_permissions: [platform.analytics, platform.health]
      - path: /platform/incidents
        method: GET
        description: "Get recent service incidents"
        auth_required: true
        rbac_permissions: [platform.analytics, platform.health]
      - path: /platform/uptime
        method: GET
        description: "Get system uptime statistics"
        auth_required: true
        rbac_permissions: [platform.analytics, platform.health]
      - path: /tenant/:id/performance-summary
        method: GET
        description: "Get performance metrics for a specific tenant (for tenant health service)"
        auth_required: true
        rbac_permissions: [platform.analytics, platform.health]
      - path: /version
        method: GET
        description: "Aggregated version info for the web-UI About page (web/chart/per-service versions + skew detection)"
        auth_required: true
        rbac_permissions: []

  - key: resource-tracker-service
    name: resource-tracker-service
    dir: services/resource-tracker-service
    description: Resource tracking and management
    internal_port: 8080
    external_port: 8092
    route_prefix: /resource-tracker-service
    gateway_timeout: 15s
    status: active
    required_secrets: [INTERNAL_AUTH_SECRET, ENCRYPTION_MASTER_KEY, JWT_SECRET]
    docker:
      type: go-service
      dependencies: [postgres, nats]
      env_template: standard-go-service
    endpoints:
      - path: /tenant/:id/resource-summary
        method: GET
        description: "Get resource health metrics for a specific tenant (for tenant health service)"
        auth_required: true
        rbac_permissions: [platform.analytics, platform.health]

  - key: tenant-health-service
    name: tenant-health-service
    dir: services/tenant-health-service
    description: Tenant health monitoring service
    internal_port: 8080
    external_port: 8093
    route_prefix: /tenant-health-service
    gateway_timeout: 15s
    status: active
    required_secrets: [INTERNAL_AUTH_SECRET, JWT_SECRET]
    docker:
      type: go-service
      dependencies: [postgres, nats]
      env_template: standard-go-service

  - key: device-interrogation-service
    name: device-interrogation-service
    dir: services/device-interrogation-service
    description: Network device and cloud provider cryptographic configuration interrogation
    internal_port: 8080
    external_port: 8095
    route_prefix: /device-interrogation-service
    gateway_timeout: 45s
    status: active
    required_secrets: [INTERNAL_AUTH_SECRET, ENCRYPTION_MASTER_KEY, JWT_SECRET]
    docker:
      type: go-service
      dependencies: [postgres, redis, nats]
      env_template: standard-go-service

  - key: audit-service
    name: audit-service
    dir: services/audit-service
    description: Centralized audit logging service for compliance and security
    internal_port: 8080
    external_port: 8096
    route_prefix: /audit-service
    gateway_timeout: 15s
    status: active
    # ENCRYPTION_MASTER_KEY: SIEM integration credentials
    # (audit.siem_integrations.config — Splunk HEC token, Datadog API key,
    # webhook secrets) go through shared/security/credentials. The create path
    # is in-memory today; the key is declared now so persistence cannot land
    # without the plumbing already in place ( gap 7).
    required_secrets: [INTERNAL_AUTH_SECRET, ENCRYPTION_MASTER_KEY, JWT_SECRET]
    docker:
      type: go-service
      dependencies: [postgres, nats]
      env_template: standard-go-service

  - key: notification-service
    name: notification-service
    dir: services/notification-service
    description: Unified notification service for multi-channel alert delivery
    internal_port: 8080
    external_port: 8097
    route_prefix: /notification-service
    gateway_timeout: 15s
    status: active
    required_secrets: [INTERNAL_AUTH_SECRET, ENCRYPTION_MASTER_KEY, JWT_SECRET]
    docker:
      type: go-service
      dependencies: [postgres, nats]
      env_template: standard-go-service

  - key: discovery-processor-service
    name: discovery-processor-service
    dir: services/discovery-processor-service
    description: Automatic processing of sensor discoveries into assets
    internal_port: 8080
    external_port: 8090
    route_prefix: /discovery-processor-service
    gateway_timeout: 15s
    status: active
    required_secrets: [INTERNAL_AUTH_SECRET]
    docker:
      type: go-service
      dependencies: [postgres, nats]
      env_template: standard-go-service

  - key: mcp-service
    name: mcp-service
    dir: services/mcp-service
    description: Read-only MCP (Model Context Protocol) server exposing tenant inventory, compliance and CBOM tools to AI agents
    internal_port: 8080
    external_port: 8100
    route_prefix: /mcp-service
    # MCP tool calls fan out to several platform reads (e.g. a compliance
    # summary evaluates a framework); give them the same headroom as
    # pcap-processor rather than the 15s default.
    gateway_timeout: 30s
    status: active
    # No datastore: the service holds no state. It signs the PAT→JWT
    # exchange call to auth-service with INTERNAL_AUTH_SECRET and calls
    # other services with the exchanged user JWT.
    required_secrets: [INTERNAL_AUTH_SECRET]
    docker:
      type: go-service
      dependencies: []
      env_template: standard-go-service

  - key: pcap-processor
    name: pcap-processor
    dir: services/pcap-processor
    description: PCAP file processing worker for TLS/SSH/STARTTLS crypto extraction
    internal_port: 8080
    external_port: 8098
    route_prefix: /pcap-processor
    gateway_timeout: 30s
    status: active
    required_secrets: [INTERNAL_AUTH_SECRET]
    docker:
      type: go-service
      dependencies: [postgres, nats]
      env_template: standard-go-service

docs:
  architecture_dir: docsv4/architecture
  features_dir: docsv4/product/features
  operations_dir: docsv4/operations
  standards_dir: docsv4/development/standards

rules:
  internal_service_port: 8080
  gateway_first: true
  route_pattern: "/api/v1/{service-name}/{resource}"
  dir_naming: kebab-case
  file_naming:
    config: kebab-case
    code: camelCase
