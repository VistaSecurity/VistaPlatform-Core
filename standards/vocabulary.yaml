# Mappings that are NOT objects of ours but that sync must know (ADR-0010 D8).
mappings:
  - ours: cloud_account asset + cloud.region
    netbox: virtualization/cluster of type <provider>
    note: Mirrored for sync fidelity only; the account asset stays the inventory object.
  - ours: asset_classes leaf under hardware / virtual
    netbox: dcim/device-role
    note: One seeded device role per class leaf; the role ↔ class table is generated into shared/dcim/roles_gen.go.
  - ours: asset_endpoints
    netbox: ipam/service
    direction: push only
