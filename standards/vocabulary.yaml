# Product vocabulary — THE single source of truth for object nouns (ADR-0010 D2).
#
# Why this file exists: two renames (Network Assets → Infrastructure Assets,
# network spaces → network segments) each cost weeks because the noun lived in
# UI strings, OpenAPI schema names, table names, lens keys and docs with no
# registry tying them together. This file is that registry, and
# `scripts/audit-vocabulary.mjs` (run by `make audit`) fails the build when a
# forbidden synonym appears where a canonical noun belongs.
#
# Generated from this file by `scripts/generate-vocabulary.mjs` (via `make generate`):
#   1. shared/dcim/objectkind_gen.go      — ObjectKind constants + label tables
#   2. packages/primitives/src/dcim/object-kinds.gen.ts
#   3. api/openapi/components/object-kind.yaml (the enum every polymorphic field uses;
#                       also inlined into inventory-service.openapi.yaml)
#   4. docsv4/core/concepts/vocabulary.md  — the customer-facing glossary table
#
# Fields per object:
#   key           canonical snake_case key; also the ObjectKind value and the
#                 table name's singular (table = plural below)
#   label         UI singular label        plural: UI plural label
#   table         Postgres table (null = not a table: a role on another table)
#   go_type       Go type in shared/dcim or the owning service
#   ts_type       TypeScript type in @vistasecurity/primitives
#   openapi       OpenAPI schema name
#   netbox        NetBox object it maps to (module/object), or null
#   phase         BUILD_PLAN phase in which the table ships
#   forbidden     words that must NOT be used for this object in UI strings,
#                 OpenAPI names, table/column names, nav/lens labels or
#                 docsv4/core. Checked case-insensitively, whole word, in the
#                 scopes listed under `audit.scopes`. Each entry may carry
#                 `after_phase` so a word is only forbidden once its replacement
#                 ships.
#
# Exceptions to NetBox naming (ADR-0010 D2) are marked `exception: true` and
# carry a `why`. Do not add an exception without an ADR amendment.

version: 1

# The BUILD_PLAN phase the tree has reached. The orchestrator bumps this at each
# phase gate. A forbidden entry with `after_phase: N` is enforced only once
# current_phase >= N (the phase in which its replacement ships); an entry with no
# after_phase is enforced from day one.
current_phase: 1

audit:
  scopes:
    ui_strings:
      - frontend-v2/src/**/*.{ts,tsx}
      - admin-ui-v2/src/**/*.{ts,tsx}
      - packages/primitives/src/**/*.{ts,tsx}
    openapi:
      - api/openapi/*.yaml
    schema:
      - scripts/database/schema.sql
    customer_docs:
      - docsv4/core/**/*.md
      - docsv4/enterprise/**/*.md
      - docsv4/msp/**/*.md
  # Files that legitimately name the retired words (guards that hunt for them,
  # the migration ADRs, this file's own tests). Keep this list short.
  allow_files:
    - scripts/audit-vocabulary.mjs
    - scripts/audit-vocabulary.test.mjs
    - docsv4/internal/**
    - CHANGELOG.md
    - docsv4/core/releases/**   # historical release notes name what they renamed

# ---------------------------------------------------------------------------
# Cross-cutting nouns that are NOT DCIM objects but whose names the guard
# protects because they collide with NetBox's.
# ---------------------------------------------------------------------------
reserved:
  - key: tenant
    label: Tenant
    plural: Tenants
    meaning: The platform account. Never the ownership label on an object.
    forbidden_as: [business unit, organization]
  - key: asset
    label: Asset
    plural: Assets
    meaning: The configuration item (ADR-0002). A NetBox Device or Virtual Machine is an asset.
    netbox: dcim/device, virtualization/virtual-machine
    exception: true
    why: ADR-0002 made the asset the CI; a second "device" noun would be a second inventory.
    forbidden_in_ui:
      - { word: network asset, allow_paths: ['docsv4/enterprise/integrations/cmdb-terminology-glossary.md', 'docsv4/core/operate/deployment/database-migrations.md'], note: "The CMDB glossary's old-to-new table and the migration runbook name the retired term on purpose." }
      - { word: CI, where: [ui_strings], allow_paths: ['frontend-v2/src/sections/settings/cmdb*', 'packages/primitives/src/connectors/**', 'packages/primitives/src/query/**'], note: "UI strings only: inventory pages say Asset. The CMDB connector UI and its registry keep CI because it is the connected system's own term (ServiceNow, Device42); docs are not scanned for the same reason. The query language's `ci` alias (query/) is a saved-query identifier; retiring it is a behaviour change, deferred." }
      - { word: configuration item, where: [ui_strings], allow_paths: ['frontend-v2/src/sections/settings/cmdb*', 'packages/primitives/src/connectors/**'], note: "UI strings only; see CI." }
  - key: endpoint
    label: Endpoint
    plural: Endpoints
    meaning: A listening (address, port, transport, protocol) on an asset.
    netbox: ipam/service
    exception: true
    why: Our `service` class is a declared business/technical service; NetBox's Service is our endpoint.
  - key: service
    label: Service
    plural: Services
    meaning: The `service` asset class (business or technical service). Never an L4 listener.
  - key: crypto_configuration
    label: Crypto Configuration
    plural: Crypto Configurations
    meaning: Existing term; table remains crypto_implementations (technical identifier).
    forbidden_in_ui:
      - { word: crypto implementation, allow_paths: ['docsv4/enterprise/integrations/cmdb-terminology-glossary.md'], note: "The CMDB glossary's old-to-new table names the retired term on purpose." }
  - key: infrastructure_asset
    label: Infrastructure Asset
    plural: Infrastructure Assets
    forbidden_in_ui:
      - { word: network asset, allow_paths: ['docsv4/enterprise/integrations/cmdb-terminology-glossary.md', 'docsv4/core/operate/deployment/database-migrations.md'], note: "see the asset entry." }

objects:
  # ---- tenancy ------------------------------------------------------------
  - key: business_unit
    label: Business Unit
    plural: Business Units
    table: business_units
    go_type: BusinessUnit
    ts_type: BusinessUnit
    openapi: BusinessUnit
    netbox: tenancy/tenant (+ tenancy/tenant-group via parent)
    exception: true
    why: >
      "Tenant" is the platform account; "Organization" collides with AWS/GCP
      Organizations and Azure Management Groups, which become cloud inventory
      items (ADR-0009). Business Unit is ServiceNow CSDM's term and our existing
      column.
    phase: 1
    forbidden:
      # Narrowed at gate 1: the tenant's own organisation ("your organization",
      # Settings -> Organization, the AI provider's organisation key) is correct
      # prose. Forbidden where it would name the OWNER of an asset or prefix:
      # OpenAPI schema names, and the inventory / IPAM / sync documentation.
      - { word: organization, where: [openapi], names_only: true, after_phase: 1, note: "OpenAPI schema names only; the owner of an object is a Business Unit." }
      - { word: organization, where: [customer_docs], paths: ['docsv4/core/inventory/networks.md', 'docsv4/core/inventory/interfaces.md', 'docsv4/core/concepts/**'], after_phase: 1, note: "Settings -> Organization is the tenant's own organisation and stays; limited to the IPAM, interface and concepts pages, where the word would name an object's owner. Elsewhere it is the tenant's own organisation (audit log, trust decisions, Settings -> Organization)." }
      - { word: organisation, where: [openapi], names_only: true, after_phase: 1, note: "OpenAPI schema names only; the owner of an object is a Business Unit." }
      - { word: organisation, where: [customer_docs], paths: ['docsv4/core/inventory/networks.md', 'docsv4/core/inventory/interfaces.md', 'docsv4/core/concepts/**'], after_phase: 1, note: "Settings -> Organization is the tenant's own organisation and stays; limited to the inventory, IPAM and sync documentation, where the word would name an object's owner." }
      - { word: tenant group, where: [ui_strings, openapi, customer_docs] }
  - key: contact
    label: Contact
    plural: Contacts
    table: contacts
    go_type: Contact
    ts_type: Contact
    openapi: Contact
    netbox: tenancy/contact
    phase: 2
  - key: contact_role
    label: Contact Role
    plural: Contact Roles
    table: contact_roles
    netbox: tenancy/contact-role
    phase: 2
  - key: contact_assignment
    label: Contact Assignment
    plural: Contact Assignments
    table: contact_assignments
    netbox: tenancy/contact-assignment
    phase: 2

  # ---- organisation -------------------------------------------------------
