      description: Body for POST /infrastructure-assets/bulk — the rows parsed from a spreadsheet.
      required:
      - rows
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/AssetInput'
    NetworkSegmentBulkImportRequest:
      type: object
      description: Body for POST /network-segments/bulk — the rows parsed from a spreadsheet.
      required:
      - rows
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/NetworkSegmentInput'
    BulkRowResult:
      type: object
      description: The outcome of importing a single spreadsheet row.
      required:
      - index
      - status
      properties:
        index:
          type: integer
          description: 0-based position of the row in the submitted batch, so the UI can line each result up against the uploaded file.
        status:
          type: string
          enum: [created, skipped_duplicate, error]
        id:
          type: string
          format: uuid
          description: Present only when status is `created` — the id of the new asset/segment.
        reason:
          type: string
          description: Human-readable explanation for a skipped or errored row.
      additionalProperties: false
    BulkImportResult:
      type: object
      description: Aggregate result of a bulk import. Partial success is normal — one bad row never rolls back the rest of the batch.
      required:
      - created
      - skipped
      - failed
      - results
      properties:
        created:
          type: integer
        skipped:
          type: integer
        failed:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/BulkRowResult'
      additionalProperties: false
    LegacyError:
      type: object
      additionalProperties: true
      description: 'CURRENT error shape returned by inventory-service asset endpoints today: a single human-readable string under `error`. Some 400s carry extra sibling keys (e.g. `message`, `suggestion`), so additionalProperties is permitted here. Unstructured — cannot be branched on safely. Superseded by the ADR-0002 `Error` envelope below as endpoints are hardened.

        '
      required:
      - error
      properties:
        error:
          type: string
    Error:
      type: object
      additionalProperties: false
      description: ADR-0002 error envelope. Clients branch on `error.code`, never on `message`.
      required:
      - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
          - code
          - message
          properties:
            code:
              type: string
              description: Stable, machine-readable enum (e.g. asset_not_found).
            message:
              type: string
              description: Human-readable, safe to surface in UI.
            details:
              type: array
              items:
                $ref: '#/components/schemas/ErrorDetail'
            request_id:
              type: string
              description: For support correlation.
    ErrorDetail:
      type: object
      additionalProperties: false
      required:
      - field
      - issue
      properties:
        field:
          type: string
        issue:
          type: string
    Pagination:
      type: object
      additionalProperties: false
      description: ADR-0002 pagination block for collection envelopes.
      required:
      - total
      - limit
      - offset
      properties:
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        next_offset:
          type:
          - integer
          - 'null'
          description: Offset of the next page, or null when there are no more.
    CryptoImplementation:
      type: object
      additionalProperties: false
      description: 'A crypto configuration row (`crypto_implementations` in storage). Field presence follows models.CryptoImplementation''s json tags: fields without `omitempty` are always present (nullable pointers serialize as null); `omitempty` fields are omitted when zero/empty.

        '
      required:
      - id
      - tenant_id
      - asset_id
      - protocol
      - protocol_version
      - cipher_suite
      - key_exchange_algorithm
      - signature_algorithm
      - symmetric_encryption
      - hash_algorithm
      - key_size
      - certificate_id
      - discovery_method
      - confidence_score
      - source_sensor_id
      - raw_data
      - risk_score
      - compliance_status
      - first_discovered_at
      - last_verified_at
      - created_at
      - updated_at
      - deleted_at
      - risk_level
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        asset_id:
          type: string
          format: uuid
        protocol:
          type: string
        protocol_version:
          type:
          - string
          - 'null'
        cipher_suite:
          type:
          - string
          - 'null'
        key_exchange_algorithm:
          type:
          - string
          - 'null'
        signature_algorithm:
          type:
          - string
          - 'null'
        symmetric_encryption:
          type:
          - string
          - 'null'
        hash_algorithm:
          type:
          - string
          - 'null'
        key_size:
          type:
          - integer
          - 'null'
        certificate_id:
          type:
          - string
          - 'null'
          format: uuid
        discovery_method:
          type: string
        confidence_score:
          type:
          - number
          - 'null'
        source_sensor_id:
          type:
          - string
          - 'null'
          format: uuid
        raw_data:
          type: object
          additionalProperties: true
          description: Arbitrary JSONB payload from discovery. Always present (defaults to {}).
        risk_score:
          type:
          - integer
          - 'null'
        compliance_status:
          type: object
          additionalProperties: true
          description: Arbitrary JSONB compliance status map. Always present (defaults to {}).
        first_discovered_at:
          type: string
          format: date-time
        last_verified_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type:
          - string
          - 'null'
          format: date-time
        risk_level:
          type: string
        risk_factors:
          type: array
          items:
            type: string
        device_id:
          type: string
          format: uuid
        device_type:
          type: string
        device_vendor:
          type: string
        device_model:
          type: string
        device_hostname:
          type: string
        device_ip_address:
          type: string
        asset_hostname:
          type: string
        asset_ip_address:
          type: string
        asset_type:
          type: string
        asset_environment:
          type: string
        asset_business_unit:
          type: string
        keys:
          type: array
          items:
            type: object
            additionalProperties: true
          description: 'Cryptographic keys associated with this configuration. Shape is owned by the keys subsystem and not specced in this slice; treated as opaque objects here.

            '
        libraries:
          type: array
          items:
            type: object
            additionalProperties: true
          description: 'Crypto libraries that provided this configuration. Shape is not specced in this slice; treated as opaque objects here.

            '
    CryptoImplementationListResponse:
      type: object
      additionalProperties: false
      description: 'CURRENT list envelope for GET /crypto-configurations. Pre-ADR-0002: the collection is wrapped under `crypto_implementations` (storage-era key retained even though the v2 path uses the CMDB-aligned resource name) with a sibling legacy `pagination` block. Hardening to the ADR-0002 `{ data, pagination }` envelope is the documented go-forward change.

        '
      required:
      - crypto_implementations
      - pagination
      properties:
        crypto_implementations:
          type: array
          items:
            $ref: '#/components/schemas/CryptoImplementation'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
    CryptoImplementationResponse:
      type: object
      additionalProperties: false
      description: 'CURRENT single-resource envelope for GET /crypto-configurations/{id}. Pre-ADR-0002: the resource is wrapped under the `crypto_implementation` key (storage-era name retained).

        '
      required:
      - crypto_implementation
      properties:
        crypto_implementation:
          $ref: '#/components/schemas/CryptoImplementation'
    CryptoComponentAssessment:
      type: object
      additionalProperties: false
      description: >
        One catalogue-resolved component of a crypto configuration, with the
        assessment that explains the configuration's risk score
        (models.CryptoComponentAssessment).
      required:
      - algorithm_type
      - is_inferred
      - algorithm_id
      - code
      - name
      - category
      - strength
      - deprecation_status
      - risk_score
      - risk_level
      - recommended_alternatives
      - is_pqc
      - sets_score
      properties:
        algorithm_type:
          type: string
          description: The junction role this algorithm plays on the configuration.
          enum: [protocol_version, cipher_suite, key_exchange, signature, symmetric, hash]
        is_inferred:
          type: boolean
          description: '`false` = observed in use; `true` = offered by the server but not negotiated in the observed session (or, for TLS, derived from the suite name).'
        algorithm_id:
          type: string
          format: uuid
          description: The `algorithms` catalogue row this assessment comes from.
        code: { type: string }
        name: { type: string }
        category: { type: string }
        strength:
          type: string
          description: Catalogue strength (weak / acceptable / strong / recommended). Empty string when the catalogue row does not record one.
        deprecation_status:
          type: string
          description: Catalogue deprecation status. Empty string when unrecorded.
        risk_score:
          type: integer
          description: The catalogue row's 0-100 risk score.
        risk_level:
          type: string
          description: The score banded with the canonical ladder (models.RiskBands). Computed server-side — do not re-derive.
          enum: [Critical, High, Medium, Low, Informational]
        migration_guidance:
          type: string
          description: Catalogue migration guidance. Omitted when the row records none.
        recommended_alternatives:
          type: array
          description: Catalogue-recommended replacements. Always present; empty means none recorded (not "unknown").
          items: { type: string }
        is_pqc: { type: boolean }
        sets_score:
          type: boolean
          description: True on the worst component — the one worst-component-wins selected. Exactly one entry per non-empty list.
    CryptoComponentAssessmentListResponse:
      type: object
      additionalProperties: false
      description: 'List envelope for GET /crypto-configurations/{id}/components — `{ "components": [...] }`. An EMPTY array means NOT ASSESSED, never "assessed clean".'
      required:
      - components
      properties:
        components:
          type: array
          items:
            $ref: '#/components/schemas/CryptoComponentAssessment'
    RemediationIssue:
      type: object
      additionalProperties: false
      description: 'A single weakness contributing to the configuration''s overall risk. `type` is the dimension that triggered it (`protocol` / `cipher` / `hash` / `key_size`); `code` is the algorithm or protocol identifier the catalog matched (e.g. `TLS 1.0`, `RC4`).

        '
      required:
      - type
      - code
      - name
      - severity
      - summary
      - impact
      - steps
      - timeline
      - alternatives
      - resources
      properties:
        type:
          type: string
        code:
          type: string
        name:
          type: string
        severity:
          type: string
        summary:
          type: string
        impact:
          type: string
        steps:
          type: array
          items:
            type: string
        timeline:
          type: string
        alternatives:
          type: array
          items:
            type: string
        resources:
          type: array
          items:
            type: string
    RemediationSummary:
      type: object
      additionalProperties: false
      description: 'Aggregated remediation guidance for a single crypto configuration — services.RemediationSummary''s JSON form. All slice/map fields are initialized empty (never null) in the service constructor, so they are required + non-null here.

        '
      required:
      - crypto_implementation_id
      - risk_score
      - issues
      - priority_actions
      - overall_timeline
      - recommended_alternatives
      - compliance_impact
      - resources
      properties:
        crypto_implementation_id:
          type: string
          format: uuid
        risk_score:
          type: integer
        issues:
          type: array
          items:
            $ref: '#/components/schemas/RemediationIssue'
        priority_actions:
          type: array
          items:
            type: string
        overall_timeline:
          type: string
        recommended_alternatives:
          type: array
          items:
            type: string
        compliance_impact:
          type: object
          additionalProperties:
            type: string
          description: Map of framework code → impact summary.
        resources:
          type: array
          items:
            type: string
    RemediationResponse:
      type: object
      additionalProperties: false
      description: 'CURRENT envelope for GET /crypto-configurations/{id}/remediation: a single `remediation` key wrapping the summary.

        '
      required:
      - remediation
      properties:
        remediation:
          $ref: '#/components/schemas/RemediationSummary'
    RemediationByAlgorithmResponse:
      type: object
      additionalProperties: false
      description: 'Envelope for GET /remediation/algorithm/{code}: a single `remediation` key wrapping one issue (the algorithm''s catalog guidance).'
      required:
      - remediation
      properties:
        remediation:
          $ref: '#/components/schemas/RemediationIssue'
    AssetCertificateLink:
      type: object
      additionalProperties: false
      description: 'One asset↔certificate edge derived from a crypto configuration. The same (asset_id, certificate_id) pair may appear more than once when bound through multiple configurations.

        '
      required:
      - asset_id
      - certificate_id
      - crypto_implementation_id
      - protocol
      properties:
        asset_id:
          type: string
          format: uuid
        certificate_id:
          type: string
          format: uuid
        crypto_implementation_id:
          type: string
          format: uuid
        protocol:
          type: string
        risk_score:
          type: integer
          description: Omitted when the source row has no risk score.
    AssetCertificateLinksResponse:
      type: object
      additionalProperties: false
      description: 'CURRENT envelope for GET /asset-certificate-links: the edges are wrapped under the `links` key. When the underlying service returns a nil slice the field serializes as JSON null — the same empty-slice-as-null quirk surfaced by the cbom-service/scopes slice. Captured under x-quirks on the path.

        '
      required:
      - links
      properties:
        links:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/AssetCertificateLink'
    CMDBSyncProfile:
      type: object
      additionalProperties: false
      description: |
        A tenant CMDB sync integration profile (services.CMDBSyncProfile). The
        four `*_config` fields are raw JSON (object / array / null depending on
        the platform) carried through verbatim. `last_sync_at`, `last_sync_status`
        and `sync_error` are omitempty — present only after a sync has run.
      required:
      - id
      - tenant_id
      - name
      - platform_type
      - connection_config
      - field_mapping_config
      - sync_config
      - ci_type_mapping
      - is_enabled
      - created_at
      - updated_at
      properties:
        id:
          type: string
        tenant_id:
          type: string
        name:
          type: string
        platform_type:
          type: string
          description: "servicenow / device42 / etc. (the target CMDB platform)."
        connection_config:
          description: Raw connection settings (endpoint, auth). Opaque JSON; null until set.
        field_mapping_config:
          description: Raw field-mapping rules. Opaque JSON; null until set.
        sync_config:
          description: Raw sync settings (cadence, scope). Opaque JSON; null until set.
        ci_type_mapping:
          description: Raw CI-type mapping. Opaque JSON; null until set.
        is_enabled:
          type: boolean
        last_sync_at:
          type: string
          format: date-time
        last_sync_status:
          type: string
        sync_error:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CMDBSyncProfileInput:
      type: object
      additionalProperties: true
      description: 'Body for POST/PUT /cmdb/profiles. Bound into services.CMDBSyncProfile; server-managed fields (id, timestamps, last_sync_*) are ignored.'
      properties:
        name:
          type: string
        platform_type:
          type: string
        connection_config: {}
        field_mapping_config: {}
        sync_config: {}
        ci_type_mapping: {}
        is_enabled:
          type: boolean
    CMDBSyncJob:
      type: object
      additionalProperties: false
      description: |
        A CMDB sync job run (services.CMDBSyncJob). `started_at` / `completed_at`
        are omitempty — present once the job has started / finished. `error_log`
        and `summary` are raw JSON carried verbatim.
      required:
      - id
      - tenant_id
      - profile_id
      - status
      - trigger_type
      - items_pushed
      - items_reconciled
      - items_failed
      - items_skipped
      - error_log
      - summary
      - created_at
      properties:
        id:
          type: string
        tenant_id:
          type: string
        profile_id:
          type: string
        status:
          type: string
          description: "pending / running / completed / failed."
        trigger_type:
          type: string
          description: "manual / scheduled."
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        items_pushed:
          type: integer
        items_reconciled:
          type: integer
        items_failed:
          type: integer
        items_skipped:
          type: integer
        error_log:
          description: Raw error log. Opaque JSON; null when none.
        summary:
          description: Raw run summary. Opaque JSON; null when none.
        created_at:
          type: string
          format: date-time
    CMDBProfileListResponse:
      type: object
      additionalProperties: false
      description: 'CURRENT envelope for GET /cmdb/profiles — `{ "profiles": [...] }`. Always a non-null array (handler normalizes nil to []).'
      required:
      - profiles
      properties:
        profiles:
