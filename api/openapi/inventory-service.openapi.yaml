  /infrastructure-assets:
    get:
      operationId: listInfrastructureAssets
      tags:
      - infrastructure-assets
      summary: List infrastructure assets for the current tenant
      description: >
        Returns a paginated page of the tenant's infrastructure assets.


        `query` is the supported filter surface. Every per-field parameter below
        is DEPRECATED and is translated into the same query language
        server-side, then AND-ed with whatever `query` the caller sent — so the
        two can never select different things. Each one's description names its
        query equivalent; prefer writing it directly. There is no `class_key`
        parameter: the class filter is `query=class:<key>`, and it matches the
        whole SUBTREE under that key.


        Important: when no `asset_status` is given the service defaults the
        filter to `asset_status = monitoring` — pending_approval, denied and
        archived assets are only returned when requested explicitly (e.g.
        `asset_status=pending_approval` for the approval queue).


        The response echoes the canonical form of the predicate that actually
        ran. `discovery_source` is the one honoured filter it cannot carry (it
        reads pipeline state out of `assets.metadata` rather than a modelled
        field), so a response that honoured it also names it under
        `filters_applied`.
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/Search'
      - { name: query, in: query, required: false, description: 'A query-language predicate over the `asset` target (QUERY_LANGUAGE.md). AND-ed with the deprecated per-field filters below, which are translated into the same language server-side. An invalid query is 400 with the structured diagnostics of QueryError — code, message, span and suggestion, one per problem.', schema: { type: string } }
      - { name: asset_status, in: query, required: false, description: 'Repeatable lifecycle-status filter (gin binds form:"asset_status" into a slice): pending_approval | monitoring | denied | archived …. Omitted ⇒ the default ''monitoring''-only view.', schema: { type: string } }
      - { name: last_seen_before, in: query, required: false, description: 'RFC3339 cutoff — keeps only assets whose last_seen_at is strictly older. Assets with no last_seen_at never match. ANDs with the other filters (the time arm of a staleness cut); a non-RFC3339 value is a 400.', schema: { type: string, format: date-time } }
      - { name: unscanned_only, in: query, required: false, description: 'Active Scan coverage cut (issue #866): when true, keeps only assets that have never been actively scanned (last_scanned_at IS NULL). ANDs with the other filters.', schema: { type: boolean } }
      - { name: asset_ownership, in: query, required: false, deprecated: true, description: 'DEPRECATED. Use `query=ownership in (…)` instead; it is translated into exactly that server-side.', schema: { type: string } }
      - { name: asset_type, in: query, required: false, deprecated: true, description: 'DEPRECATED. Use `query=class in (…)` instead; it is translated into exactly that server-side. Subtree-or, so a parent key selects its whole branch. Name it `class`, not `class_key`.', schema: { type: string } }
      - { name: business_unit, in: query, required: false, deprecated: true, description: 'DEPRECATED. Use `query=business_unit in (…)` instead; it is translated into exactly that server-side.', schema: { type: string } }
      - { name: cert_algorithm, in: query, required: false, deprecated: true, description: 'DEPRECATED. Use `query=cert:(key_algorithm=…)` instead; it is translated into exactly that server-side.', schema: { type: string } }
      - { name: cert_expiring_within, in: query, required: false, deprecated: true, description: 'DEPRECATED. Use `query=cert:(not_after >= now and not_after < now+Nd)` instead; it is translated into exactly that server-side. The lower bound is deliberate: an ALREADY expired certificate is not ''expiring within 30 days''.', schema: { type: string } }
      - { name: cert_key_size_min, in: query, required: false, deprecated: true, description: 'DEPRECATED. Use `query=cert:(key_size >= N)` instead; it is translated into exactly that server-side.', schema: { type: string } }
      - { name: discovery_source, in: query, required: false, description: 'Repeatable filter on the pipeline that produced the asset (assets.metadata->>''discovery_source''). NOT deprecated and NOT expressible in the query language: it is pipeline state rather than a modelled field, so it has no catalogue entry. Consequence a caller must know: the canonical `query` this endpoint echoes back EXCLUDES it, and a response that honoured it names it under `filters_applied` instead.', schema: { type: string } }
      - { name: environment, in: query, required: false, deprecated: true, description: 'DEPRECATED. Use `query=environment in (…)` instead; it is translated into exactly that server-side.', schema: { type: string } }
      - { name: has_certificates, in: query, required: false, deprecated: true, description: 'DEPRECATED. Use `query=exists(cert)` instead; it is translated into exactly that server-side.', schema: { type: string } }
      - { name: hash_algorithm, in: query, required: false, deprecated: true, description: 'DEPRECATED. Use `query=crypto:(hash_algorithm in (…))` instead; it is translated into exactly that server-side.', schema: { type: string } }
      - { name: key_size_min, in: query, required: false, deprecated: true, description: 'DEPRECATED. Use `query=crypto:(key_size >= N)` instead; it is translated into exactly that server-side.', schema: { type: string } }
      - { name: location_building, in: query, required: false, deprecated: true, description: 'DEPRECATED. Use `query=tag.building:…` instead; it is translated into exactly that server-side. There is no `building` column; it was only ever a tag.', schema: { type: string } }
      - { name: location_id, in: query, required: false, deprecated: true, description: 'DEPRECATED. Use `query=location_id in (…)` instead; it is translated into exactly that server-side.', schema: { type: string } }
      - { name: location_region, in: query, required: false, deprecated: true, description: 'DEPRECATED. Use `query=region in (…)` instead; it is translated into exactly that server-side.', schema: { type: string } }
      - { name: location_site, in: query, required: false, deprecated: true, description: 'DEPRECATED. Use `query=site in (…)` instead; it is translated into exactly that server-side.', schema: { type: string } }
      - { name: location_zone, in: query, required: false, deprecated: true, description: 'DEPRECATED. Use `query=zone in (…)` instead; it is translated into exactly that server-side.', schema: { type: string } }
      - { name: network_segment_id, in: query, required: false, deprecated: true, description: 'DEPRECATED. Use `query=segment_id in (…)` instead; it is translated into exactly that server-side.', schema: { type: string } }
      - { name: operating_system, in: query, required: false, deprecated: true, description: 'DEPRECATED. Use `query=attr.operating_system in (…)` instead; it is translated into exactly that server-side. It is a class ATTRIBUTE now, not a column.', schema: { type: string } }
      - { name: owner_email, in: query, required: false, deprecated: true, description: 'DEPRECATED. Use `query=owner_email in (…)` instead; it is translated into exactly that server-side.', schema: { type: string } }
      - { name: protocol, in: query, required: false, deprecated: true, description: 'DEPRECATED. Use `query=crypto:(protocol in (…))` instead; it is translated into exactly that server-side.', schema: { type: string } }
      - { name: protocol_version, in: query, required: false, deprecated: true, description: 'DEPRECATED. Use `query=crypto:(protocol_version in (…))` instead; it is translated into exactly that server-side.', schema: { type: string } }
      - { name: risk_level, in: query, required: false, deprecated: true, description: 'DEPRECATED. Use `query=risk >= high / risk:medium` instead; it is translated into exactly that server-side. `high` means high AND ABOVE, so a Critical asset matches it — the rail''s vocabulary is coarser than the five badge labels.', schema: { type: string } }
      - { name: sort_by, in: query, required: false, description: 'Sort column. Whitelisted server-side; an unrecognised value falls back to the default rather than erroring. Ties are broken by asset id, so paging is stable.', schema: { type: string } }
      - { name: sort_order, in: query, required: false, description: 'asc | desc. Anything else is treated as desc.', schema: { type: string } }
      - { name: uses_deprecated_algorithms, in: query, required: false, deprecated: true, description: 'DEPRECATED. Use `query=crypto:(algorithm.deprecated:true)` instead; it is translated into exactly that server-side.', schema: { type: string } }
      responses:
        '200':
          description: A page of assets with pagination metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetListResponse'
        '400':
          description: >
            Invalid filter parameter, or a `query` that does not parse or
            validate. A query failure carries the structured diagnostics; a
            filter failure is the legacy single-message shape.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/QueryError'
                  - $ref: '#/components/schemas/LegacyError'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '500':
          $ref: '#/components/responses/LegacyServerError'
    post:
      operationId: createInfrastructureAsset
      tags:
