      - id
      - code
      - category
      - name
      - strength
      - deprecation_status
      - risk_score
      - compliance_mappings
      - metadata
      - is_standard
      - is_pqc
      - pqc_standardization_status
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        category:
          type: string
        subcategory:
          type: string
        name:
          type: string
        description:
          type: string
        strength:
          type: string
          description: weak / acceptable / strong / recommended.
        deprecation_status:
          type: string
        deprecation_date:
          type: string
        risk_score:
