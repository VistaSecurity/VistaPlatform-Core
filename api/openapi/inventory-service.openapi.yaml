      - name: asset_id
        in: query
        required: false
        description: Restrict to configurations observed on this asset.
        schema:
          type: string
          format: uuid
      - name: uses_deprecated_algorithms
        in: query
        required: false
        description: Restrict to configurations flagged as using deprecated algorithms.
        schema:
          type: boolean
      - name: sort_by
        in: query
        required: false
        description: Column to sort by (default `last_verified_at`).
        schema:
          type: string
      - name: sort_order
        in: query
        required: false
        description: Sort direction (`asc` or `desc`; default `desc`).
        schema:
          type: string
          enum:
          - asc
          - desc
      responses:
        '200':
          description: A page of crypto configurations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CryptoImplementationListResponse'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '500':
          $ref: '#/components/responses/LegacyServerError'
      x-quirks:
      - Unparseable single-value filters (key_size_min, certificate_id, asset_id, uses_deprecated_algorithms) are silently ignored instead of returning 400.
