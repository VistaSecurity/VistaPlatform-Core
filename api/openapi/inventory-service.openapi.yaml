  /crypto-applications:
    get:
      operationId: listCryptoApplications
      tags:
      - crypto-applications
      summary: List cryptographic application (at-rest) posture rows
      description: |
        Returns the tenant's cryptographic-application posture rows — the at-rest
        encryption state of managed cloud resources — highest-risk first.

        `encrypted` is only meaningful when `encryption_determined` is true. A row
        with `encryption_determined: false` means the posture could NOT be measured
        (AccessDenied on the encryption API, transport failure); it carries
        `risk_score: 0`, which per platform convention means NOT ASSESSED — not
        safe, and not a failure either. Clients must render it as unknown.

        `risk_score` follows the at-rest ladder: 0 not assessed, 10 encrypted under
        a customer-managed key, 40 encrypted under a provider-managed key, 90
        unencrypted. `risk_level` is the CVSS-anchored band of that score.
      parameters:
      - name: encryption_context
        in: query
        required: false
        description: |
          Encryption context to list. Defaults to `at_rest`, the only context with a
          producer today.
        schema:
          type: string
          default: at_rest
          enum:
          - at_rest
          - in_transit
          - in_use
          - key_storage
          - signing
          - hashing
          - authentication
          - other
      - name: resource_type
        in: query
        required: false
        description: Filter to one resource type.
        schema:
          type: string
          enum:
          - disk_volume
          - file
          - database
          - cloud_storage
          - hsm
          - application
          - build_artifact
          - container
          - vm_image
          - backup
          - communication
          - other
      - name: determined
        in: query
        required: false
        description: |
          Tri-state. Omit for no filter; `false` isolates the resources whose posture
          could not be measured.
        schema:
          type: boolean
      - name: risk_at_least
        in: query
        required: false
        description: |
          Risk band label; matches that band and everything above it. Unknown labels
          are ignored rather than matching nothing.
        schema:
          type: string
          enum:
          - Critical
          - High
          - Medium
          - Low
          - Informational
      - name: search
        in: query
        required: false
        description: Case-insensitive substring match on resource name or identifier.
        schema:
          type: string
      - name: limit
        in: query
        required: false
        description: Maximum rows to return (default 100, max 500).
        schema:
          type: integer
          minimum: 1
      - name: offset
        in: query
        required: false
        description: Rows to skip (default 0).
        schema:
          type: integer
          minimum: 0
      responses:
        '200':
          description: The tenant's cryptographic application posture rows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CryptoApplicationsResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '403':
          $ref: '#/components/responses/LegacyForbidden'
        '500':
          $ref: '#/components/responses/LegacyServerError'
