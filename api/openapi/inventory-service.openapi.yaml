          type: object
          additionalProperties: true
    AlgorithmRecommendationsResponse:
      type: object
      additionalProperties: false
      description: |
        Envelope for GET /algorithms/{code}/recommendations —
        `{ "algorithm": {...}, "recommendations": {...} }`. The nested
        `recommendations` object is a compact projection of the algorithm's
        assessment fields (distinct from a batch recommendation item).
      required:
      - algorithm
      - recommendations
      properties:
        algorithm:
          $ref: '#/components/schemas/Algorithm'
        recommendations:
          type: object
          additionalProperties: false
          required:
          - alternatives
          - migration_guidance
          - risk_score
          - strength
          - deprecation_status
          properties:
            alternatives:
              description: |
                Recommended replacement algorithm codes. Serializes as JSON null
                when the algorithm has no recorded alternatives.
              type:
              - array
              - 'null'
              items:
                type: string
            migration_guidance:
              type:
              - string
              - 'null'
            risk_score:
              type: integer
            strength:
              type: string
            deprecation_status:
              type: string
    BatchRecommendationsRequest:
      type: object
      additionalProperties: false
      description: Request body for POST /algorithms/recommendations/batch.
      required:
      - algorithm_codes
      properties:
        algorithm_codes:
          type: array
          items:
            type: string
          description: 1–100 algorithm codes to fetch recommendations for.
    BatchRecommendationItem:
      type: object
      additionalProperties: false
      description: |
        One algorithm's recommendation in the batch response.
        `current_algorithm` is the full assessed algorithm;
        `recommended_alternatives` expands each recommended code to a full
        algorithm object (codes that fail to resolve are dropped, so the array
        may be shorter than the algorithm's recorded alternatives).
      required:
      - algorithm_code
      - current_algorithm
      - recommended_alternatives
      - migration_guidance
      - risk_score
      - strength
      - deprecation_status
      - priority
      - reason
      properties:
        algorithm_code:
          type: string
        current_algorithm:
          $ref: '#/components/schemas/Algorithm'
        recommended_alternatives:
          type: array
          items:
            $ref: '#/components/schemas/Algorithm'
        migration_guidance:
          type:
          - string
          - 'null'
        risk_score:
          type: integer
        strength:
          type: string
        deprecation_status:
          type: string
        priority:
          type: string
          description: high / medium / low (derived from risk_score).
        reason:
          type: string
    BatchRecommendationsResponse:
      type: object
      additionalProperties: false
      description: |
        Envelope for POST /algorithms/recommendations/batch —
        `{ "recommendations": [...] }`, with an optional `failed` array of codes
        that could not be resolved (omitted when empty).
      required:
      - recommendations
      properties:
        recommendations:
