    get:
      operationId: getInfrastructureAsset
      tags:
      - infrastructure-assets
      summary: Get an infrastructure asset by id
      description: 'Returns a single asset, including its crypto configurations and calculated risk. Any retrieval failure (including not-found) currently maps to 404 (a documented quirk — the handler does not distinguish not-found from other query errors).

        '
      responses:
        '200':
