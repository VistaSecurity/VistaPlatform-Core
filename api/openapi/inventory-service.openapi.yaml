      - All GetCryptoImplementationByID errors (DB error, no rows) return 404, not 500.
      - 'The web-ui''s `inventoryApi.getCryptoImplementationById` returns the FULL response body (`{ crypto_implementation: {...} }`) as the result, not the inner object — typed at the call site as `CryptoImplementation`. The shape mismatch is documented in the migration ledger as a UI fix-on-harden.'
  /crypto-configurations/{id}/components:
    parameters:
    - $ref: '#/components/parameters/CryptoConfigurationId'
    get:
      operationId: getCryptoConfigurationComponents
      tags:
      - crypto-configurations
      summary: Explain a crypto configuration's risk score, component by component
      description: >
        Returns the algorithm-catalogue assessment of every component linked to
        this configuration (`crypto_implementation_algorithms` joined to
        `algorithms`), ordered worst-first, wrapped under `components`. Drives
        the "Why this score" panel in the inventory crypto-configuration drawer.


        Computed on read, not stored: the catalogue is meant to be edited by a
        platform admin, so a persisted copy of the reasoning would silently go
        stale against the row it cites.


        Each entry carries `algorithm_type` (the junction role), the catalogue
        assessment (`strength`, `deprecation_status`, `risk_score`,
        `risk_level`, `migration_guidance`, `recommended_alternatives`), and two
        computed markers:


        * `is_inferred` — `false` means the component was OBSERVED in use (for
        SSH, derived per RFC 4253 §7.1 from both KEXINIT name-lists); `true`
        means the server merely OFFERS it and this session did not negotiate it,
        or (for TLS) that it was derived from the suite name. Both raise the
        score, because a reachable weak option is a real weakness — but they are
        different findings and consumers must render them differently.

        * `sets_score` — marks the worst component, the one worst-component-wins
        selected. Exactly one entry carries it when the list is non-empty.


        `risk_level` is banded SERVER-SIDE from `models.RiskBands` so no consumer
        re-derives the ladder.


        **An empty `components` array means NOT ASSESSED** — nothing on this
        configuration resolved against the catalogue. It is not a 404 and not an
        error, and it MUST NOT be presented as a clean bill of health; score 0
        has always meant unassessed and so does an empty list.
      responses:
        '200':
          description: The configuration's catalogue-assessed components, worst first. May be empty (= not assessed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CryptoComponentAssessmentListResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '500':
          $ref: '#/components/responses/LegacyServerError'
      x-quirks:
      - An unknown or other-tenant configuration id returns 200 with an empty `components` array, not 404 — the join is RLS-scoped and simply matches nothing. Consumers cannot distinguish "no such configuration" from "not assessed" here; use GET /crypto-configurations/{id} for existence.
  /crypto-configurations/{id}/remediation:
    parameters:
    - $ref: '#/components/parameters/CryptoConfigurationId'
    get:
      operationId: getCryptoConfigurationRemediation
      tags:
      - crypto-configurations
      summary: Get remediation guidance for a crypto configuration
      description: 'Returns a structured remediation summary aggregated from the configuration''s protocol-version / cipher-suite / hash / key-size weaknesses, plus recommended alternatives, an overall timeline, and compliance impact. Computed on demand by the RemediationService.

        '
      responses:
        '200':
          description: The remediation summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemediationResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '500':
          $ref: '#/components/responses/LegacyServerError'
      x-quirks:
      - On retrieval failure (DB error OR no-rows on the underlying crypto_implementations row) the handler maps to 500 with `{"error":"Failed to get remediation guidance"}`, not 404 — diverges from the GET /crypto-configurations/{id} 404-on-any-error quirk for the sibling handler.
  /remediation/algorithm/{code}:
    parameters:
    - name: code
      in: path
      required: true
      description: Algorithm or protocol code (e.g. `RC4`, `TLS 1.0`).
      schema:
        type: string
    get:
      operationId: getRemediationByAlgorithm
      tags:
      - crypto-configurations
      summary: Get remediation guidance for a specific algorithm
      description: 'Returns the catalog remediation guidance for a single algorithm/protocol code (severity, impact, steps, alternatives, resources), wrapped under `remediation`. Not tenant-scoped — it is reference guidance. UI consumer: `web-ui/src/services/remediation-api.ts` (`getRemediationByAlgorithm`).'
      responses:
        '200':
          description: The algorithm's remediation guidance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemediationByAlgorithmResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '404':
          $ref: '#/components/responses/LegacyNotFound'
        '500':
          $ref: '#/components/responses/LegacyServerError'
      x-quirks:
      - Any lookup error (including an unknown code) maps to 404 `{"error":"Algorithm not found"}`. The route binds `code` as a path segment, so the empty-code 400 branch in the handler is unreachable via routing.
  /asset-certificate-links:
    get:
      operationId: listAssetCertificateLinks
      tags:
      - crypto-configurations
      summary: List asset↔certificate edges scoped to specific assets/certs
      description: 'Returns the asset↔certificate edges derived from crypto configurations, scoped to the `asset_ids` and/or `certificate_ids` passed as comma-separated UUID lists. At least one of the two must be supplied; both may be combined to intersect. The same (asset_id, certificate_id) pair can appear more than once when a cert is bound via multiple configurations (e.g. two protocols).

        '
      parameters:
      - name: asset_ids
        in: query
        required: false
        description: Comma-separated asset UUIDs (max 500).
        schema:
          type: string
      - name: certificate_ids
        in: query
        required: false
        description: Comma-separated certificate UUIDs (max 500).
        schema:
          type: string
      responses:
        '200':
          description: The set of asset↔certificate edges.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetCertificateLinksResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '500':
          $ref: '#/components/responses/LegacyServerError'
      x-quirks:
      - Caller must supply at least one of asset_ids / certificate_ids; the empty-both case returns 400 with an error message rather than an empty list.
      - Each parameter caps at 500 ids — beyond that the handler returns 400 rather than truncating.
      - Not in the migration-ledger seed — the route is reached only through the Infrastructure-lens visualizers (Infrastructure Map cert column, Cert Blast Radius). Tracked as a ledger gap; the spec captures the shape so the contract test pins it now.
