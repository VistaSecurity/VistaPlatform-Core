      summary: Bulk-create infrastructure assets (spreadsheet import)
      description: 'Creates many assets in one request from a parsed CSV/XLSX upload (RBAC-gated `assets.create`). Each row reuses single-asset creation, so validation, ownership classification and segment tagging are identical. Rows are deduped within the batch and against existing inventory. Returns 200 with a per-row result (created / skipped_duplicate / error) — partial success is normal. The whole batch is checked against the subscription asset cap up front: an over-cap batch returns 402 and creates nothing. More than 1000 rows returns 413.'
