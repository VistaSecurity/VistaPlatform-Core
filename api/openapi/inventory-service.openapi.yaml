      properties:
        kinds:
          type: array
          items:
            type: string
        groups:
          type: array
          items:
            $ref: '#/components/schemas/ConnectorCatalogueGroup'
    NetBoxConnectionOptions:
      type: object
      additionalProperties: false
      description: Non-secret per-connection knobs.
      properties:
        default_environment:
          type: string
          description: |
            Stamped on segments imported from prefixes that do not say which
            environment they are. NetBox has no environment concept, so this is
            the tenant DECLARING one rather than the platform inferring it; a
            prefix tagged with an environment name overrides it.
        role_class_overrides:
          type: object
          additionalProperties:
            type: string
          description: NetBox device-role slug to asset class key, extending the shipped mapping.
    NetBoxConnection:
      type: object
      additionalProperties: false
      description: |
        A configured NetBox connection. The API token is NEVER returned —
        `has_token` is what an edit form actually needs to know.
      required:
      - id
      - tenant_id
      - connector_key
      - name
      - base_url
      - has_token
      - options
      - allow_private_endpoint
      - is_enabled
      - schedule
      - created_at
      - updated_at
      properties:
        id:
          type: string
        tenant_id:
          type: string
        connector_key:
          type: string
        name:
          type: string
        base_url:
          type: string
        has_token:
          type: boolean
        options:
          $ref: '#/components/schemas/NetBoxConnectionOptions'
        allow_private_endpoint:
          type: boolean
          description: |
            Whether this connection may target an RFC1918/ULA address. Defaults
            true for this connector kind because a network source of truth is
            on-premises by construction; loopback, link-local and cloud
            metadata stay refused whatever it says.
        is_enabled:
          type: boolean
        schedule:
          type: string
          enum: [manual, hourly, daily, weekly]
        last_run_at:
          type: [string, 'null']
          format: date-time
        last_run_status:
          type: string
        last_error:
          type: string
        last_tested_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    NetBoxConnectionInput:
      type: object
      additionalProperties: false
      description: Body for POST/PUT /connectors/netbox/connections.
      required:
      - name
      - base_url
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        base_url:
          type: string
          description: The NetBox root. HTTPS is required — the API token is a bearer credential.
        api_token:
          type: string
          description: |
            Write-only. Required on create. On update an empty value leaves the
            stored token alone.
        default_environment:
          type: string
        role_class_overrides:
          type: object
          additionalProperties:
            type: string
        allow_private_endpoint:
          type: boolean
        is_enabled:
          type: boolean
        schedule:
          type: string
          enum: [manual, hourly, daily, weekly]
    NetBoxConnectionListResponse:
      type: object
      additionalProperties: false
      description: 'Envelope for GET /connectors/netbox/connections — { "connections": [...] }. Always a non-null array.'
      required:
      - connections
      properties:
        connections:
          type: array
          items:
            $ref: '#/components/schemas/NetBoxConnection'
    ConnectorRunSummary:
      type: object
      additionalProperties: false
      description: |
        The counts one pull produced. Every field is present, zeros included:
        "0 devices" is an answer, and omitting it makes a run that imported
        nothing indistinguishable from one that was never asked to.
      required:
      - sites
      - prefixes
      - vlans
      - device_types
      - devices
      - segments_created
      - segments_matched
      - assets_created
      - assets_matched
      - assets_proposed
      - assets_skipped
      - unmapped_roles
      - vlans_without_prefix
      - errors
      properties:
        sites:
          type: integer
        prefixes:
          type: integer
        vlans:
          type: integer
        device_types:
          type: integer
        devices:
          type: integer
        segments_created:
          type: integer
        segments_matched:
          type: integer
        assets_created:
          type: integer
        assets_matched:
          type: integer
        assets_proposed:
          type: integer
          description: Devices whose identifiers matched more than one existing asset; each left a merge proposal in Approvals.
        assets_skipped:
          type: integer
          description: Devices carrying no identifier at all, which could never be recognised again.
        unmapped_roles:
          type: integer
          description: Devices whose NetBox role mapped to no asset class; each became unknown_host rather than a guess.
        vlans_without_prefix:
          type: integer
          description: VLANs carrying no prefix. They scope no address, so they create no segment.
        errors:
          type: integer
    ConnectorRun:
      type: object
      additionalProperties: false
      required:
      - id
      - connection_id
      - status
      - trigger_type
      - summary
      - errors
      properties:
        id:
          type: string
        connection_id:
          type: string
        status:
          type: string
          enum: [in_progress, success, partial, failed]
        trigger_type:
          type: string
          enum: [manual, scheduled, test]
        started_at:
          type: string
          format: date-time
        completed_at:
          type: [string, 'null']
          format: date-time
        summary:
          $ref: '#/components/schemas/ConnectorRunSummary'
        errors:
          type: array
          items:
            type: string
    ConnectorRunListResponse:
      type: object
      additionalProperties: false
      description: 'Envelope for GET /connectors/netbox/connections/{id}/runs — { "runs": [...] }. Always a non-null array.'
      required:
      - runs
      properties:
        runs:
          type: array
          items:
            $ref: '#/components/schemas/ConnectorRun'
    ConnectorMessageResponse:
      type: object
      additionalProperties: false
      required:
      - message
      properties:
        message:
          type: string
    ConnectorTestResult:
      type: object
      additionalProperties: false
      description: 'Result of POST .../test. success:false is a 200 — the request worked, the thing it checked did not.'
      required:
      - success
      - message
      properties:
        success:
          type: boolean
        message:
          type: string
    NetBoxDriftDevice:
      type: object
      additionalProperties: false
      description: A NetBox device the inventory has no asset for.
      required:
      - netbox_id
      - name
      - url
      properties:
        netbox_id:
          type: integer
        name:
          type: string
        serial:
          type: string
        ip_address:
          type: string
        role:
          type: string
        site:
          type: string
        status:
          type: string
        url:
          type: string
          description: Opens the record in the customer's own NetBox, because the action this view suggests is taken there.
    NetBoxDriftAsset:
      type: object
      additionalProperties: false
      description: An asset the platform holds that NetBox does not list.
      required:
      - asset_id
      - class_key
      - asset_status
      properties:
        asset_id:
          type: string
        display_name:
          type: string
        hostname:
          type: string
        ip_address:
          type: string
        serial:
          type: string
        class_key:
          type: string
        asset_status:
          type: string
        site:
          type: string
    NetBoxDriftReport:
      type: object
      additionalProperties: false
      description: |
        What NetBox and the inventory disagree about. Read-only: the platform
        never writes to NetBox.
      required:
      - netbox_device_count
      - inventory_asset_count
      - missing_in_inventory
      - missing_in_netbox
      - missing_in_inventory_count
      - missing_in_netbox_count
      - truncated
      - note
      properties:
        generated_at:
          type: string
        netbox_device_count:
          type: integer
        inventory_asset_count:
          type: integer
        missing_in_inventory:
          type: array
          items:
            $ref: '#/components/schemas/NetBoxDriftDevice'
        missing_in_netbox:
          type: array
          items:
            $ref: '#/components/schemas/NetBoxDriftAsset'
        missing_in_inventory_count:
          type: integer
        missing_in_netbox_count:
          type: integer
        truncated:
          type: boolean
          description: |
            The lists are capped. `truncated` says so outright rather than
            letting a capped list read as a complete one — an inventory that
            silently under-reports is the failure this initiative is about.
        note:
          type: string
          description: Shown verbatim in the UI. The read-only promise is part of the product surface, not only the docs.
    CreateDiscoveryJobRequest:
      type: object
      additionalProperties: false
      description: |
        Body for POST /discovery/jobs. Mirrors models.CreateDiscoveryJobInput.
        `targets` is required (binding:"required"); 1–1000 entries.
      required:
      - targets
      properties:
        targets:
          type: array
          minItems: 1
          items:
            type: string
          description: IPs, CIDRs, or hostnames to scan (max 1000).
        execution_mode:
          type: string
          description: >-
            How the scan is dispatched: `auto` (platform decides), `cloud`
            (platform sensor), or `sensors` — run from the one tenant sensor
            named in `preferred_sensor_ids`, which must be live; an unknown
            sensor answers 404, the platform's own or an air-gapped one 400,
            an offline one 409, and the job is not created. A `sensors` job
            is never run from the platform instead.
        preferred_sensor_ids:
          type: array
          items:
            type: string
            format: uuid
          description: >-
            With `execution_mode: sensors`, exactly one tenant sensor id. Not
            accepted with any other mode.
        protocols:
          type: array
          items:
            type: string
          description: Protocols to probe (e.g. `TLS`, `SSH`). Empty = service default.
        ports:
          type: array
          items:
            type: integer
          description: Ports to probe (e.g. 443, 22, 8443). Empty = service default.
        retention_cap_mb:
          type:
          - integer
          - 'null'
          description: Per-job capture retention cap in MB (service default 25).
        retention_ttl_hours:
          type:
          - integer
          - 'null'
          description: Per-job capture retention TTL in hours (service default 24).
        options:
          type: object
          additionalProperties: true
          description: Free-form scan options forwarded to cluster-sensor-service.
        tags:
          type: object
          additionalProperties: true
          description: Free-form tags stamped on the job and resulting findings.
        owner:
          type: string
        environment:
          type: string
    DiscoveryJob:
      type: object
      additionalProperties: true
      description: |
        A discovery job. Returned on create and when polling status. Status
        polling proxies cluster-sensor-service, so extra fields may appear.
      required:
      - id
      - status
      properties:
        id:
          type: string
        tenant_id:
          type: string
        created_by:
          type: string
        status:
          type: string
          description: >-
            queued · awaiting_sensor (handed to a tenant sensor, not yet
            reported back) · running · completed · failed · cancelled.
        targets:
          type: array
          items:
            type: string
        execution_mode:
          type: string
        requested_sensor_ids:
          type: array
          items:
            type: string
        executor:
          type: string
          enum: [platform, sensor]
          description: Who runs (or ran) the job.
        assigned_sensor_id:
          type:
          - string
          - 'null'
          description: The tenant sensor a `sensors` job was handed to.
        assigned_sensor_name:
          type: string
        assigned_sensor_last_heartbeat:
          type: string
          format: date-time
          description: When that sensor last checked in — what a "sensor offline" failure shows beside the error.
        dispatched_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the job's command was written for the sensor.
        picked_up_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the sensor collected the command on a heartbeat.
        started_at:
          type:
          - string
          - 'null'
          format: date-time
        completed_at:
          type:
          - string
          - 'null'
          format: date-time
        error_message:
          type:
          - string
          - 'null'
        fanout:
          type: boolean
        retention_cap_mb:
          type: integer
        retention_ttl_hours:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        origin:
          type: string
          description: >-
            `auto_scan` when the #1814 automatic-scan sweep created this job;
            empty for an operator-started run (Active Scan, Discover wizard).
            Drives the "Automatic scan" kind on the unified Jobs page.
    DiscoveryJobsResponse:
      type: object
      additionalProperties: true
      description: 'GET /discovery/jobs — a page of the tenant''s discovery jobs, newest first.'
      required:
      - jobs
      - total
      - page
      - page_size
      properties:
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/DiscoveryJob'
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
        total_pages:
          type: integer
    DiscoveryJobResponse:
      type: object
      additionalProperties: true
      description: 'Create-job envelope — `{ "job": {...} }`.'
      required:
      - job
      properties:
        job:
          $ref: '#/components/schemas/DiscoveryJob'
    DiscoveryFinding:
      type: object
      additionalProperties: true
      description: |
        A single discovered finding. Mirrors services.IngestFinding; results
        proxied from cluster-sensor-service may carry extra fields, hence
        additionalProperties.
      properties:
        hostname:
          type:
          - string
          - 'null'
        ip_address:
          type:
          - string
          - 'null'
        port:
          type:
          - integer
          - 'null'
        class_key:
          type: string
        protocol:
          type: string
        protocol_version:
          type:
          - string
          - 'null'
        cipher_suite:
          type:
          - string
          - 'null'
        key_exchange_algorithm:
          type:
          - string
          - 'null'
        key_size:
          type:
          - integer
          - 'null'
        hash_algorithm:
          type:
          - string
          - 'null'
        source_sensor_id:
          type:
          - string
          - 'null'
        raw_data:
          type: object
          additionalProperties: true
    DiscoveryJobResults:
      type: object
      additionalProperties: true
      description: |
        Findings for a job, proxied verbatim from cluster-sensor-service
        (`{ "findings": [...] }` plus any additive upstream fields).

        `findings` is what the job SAW; `materialization` is what became of it
        once mirrored into the ingestion queue. They answer different questions
        and can legitimately disagree — a third-party endpoint is recorded as a
        connection rather than an asset, and processing is asynchronous — so
        both are reported, separately labelled, rather than as one number.
      properties:
        findings:
          type: array
          items:
            $ref: '#/components/schemas/DiscoveryFinding'
        materialization:
          $ref: '#/components/schemas/DiscoveryMaterialization'
    DiscoveryMaterialization:
      type: object
      additionalProperties: true
      description: |
        What became of a job's findings after they left the job record. Omitted
        entirely when the counts could not be read, so absent means "unknown",
        not "zero".
      properties:
        findings:
          type: integer
          description: Findings recorded by the job itself.
        queued:
          type: integer
          description: |
            Findings mirrored into the ingestion queue. Lower than `findings`
            when a finding had no resolved IP to anchor on.
        auto_approved:
          type: integer
          description: |
            Queue rows an auto-approval rule matched — the asset went straight to
            monitoring. Auto-approval has exactly one gate: the asset is on a
            network segment with auto-approve enabled.
        pending_approval:
          type: integer
          description: |
            Queue rows genuinely awaiting a human — no rule matched, and the
            asset is in Discovery → Approvals. Excludes `observed` (host
            observations, which never await approval) and `suppressed` (the
            matched asset is archived or denied), which are not
            auto-approved either but are not pending anything.
        awaiting_processing:
          type: integer
          description: Queue rows the pipeline has not dispositioned yet.
        suppressed:
          type: integer
          description: |
            Queue rows that matched an asset the tenant has taken off the
            table — archived or denied. Nothing was materialized and no
            approval decision will ever be made about them.
    AutoScanPolicy:
      type: object
      additionalProperties: false
      description: >
        The tenant's automatic active-scanning policy. Stored in
        `tenant_admin_settings.config.discovery_auto_scan`.
      required:
      - enabled
      - scan_on_first_observation
      - rescan_interval_hours
      - protocols
      - ports
      properties:
        enabled:
          type: boolean
          description: >
            The master switch. Off means neither trigger fires and no host is
            scanned unless somebody asks for it. On by default.
        scan_on_first_observation:
          type: boolean
          description: >
            Scan a newly observed internal address as soon as it appears, rather
            than waiting for the next scheduled sweep. Independent of the
            rescan schedule — a tenant can keep the daily rescan and decline to
            be scanned the instant something appears.
        rescan_interval_hours:
          type: integer
          description: >
            How stale an asset's last automatic scan may get before it is
            scanned again. 24 by default.
        protocols:
          type: array
          items:
            type: string
          description: Restricted to the values in `limits.supported_protocols`.
        prefer_observing_sensor:
          type: boolean
          description: >
            Route each automatic scan to the tenant sensor that most recently
            observed the host (or one bound to its network segment) instead of
            the platform sensor, so a host reachable only from inside the
            organization's network is scanned from where it can be reached.
            On by default. Off runs every automatic scan from the platform
            sensor. Optional on PUT: a client that omits it leaves the stored
            value unchanged. Manual scans choose per run via `run_from` and
            are not governed by this.
        ports:
          type: array
          items:
            type: integer
          description: >
            The ports each automatic scan probes. Defaults to the well-known
            TLS and SSH ports — deliberately narrower than the Discover
            wizard's crypto/OT set, because file-sharing (139/445) and
            industrial-control ports (502, 4840, 44818, 47808) are reasonable
            for a scan a person chose once and not for one that repeats against
            every host on every interval. A tenant who wants them adds them.
    AutoScanLimits:
      type: object
      additionalProperties: false
      description: >
        The bounds the server accepts, carried in the response so the page
        validates against the server's numbers. Without them a change to the
        limits would leave a control accepting values the server refuses.
      required:
      - min_rescan_interval_hours
      - max_rescan_interval_hours
      - max_ports
      - supported_protocols
      - default_ports
      properties:
        min_rescan_interval_hours:
          type: integer
        max_rescan_interval_hours:
          type: integer
        max_ports:
          type: integer
          description: The most ports one policy may list.
        supported_protocols:
          type: array
          items:
            type: string
        default_ports:
          type: array
          items:
            type: integer
          description: The curated default port set, so the page can offer "reset to defaults".
    AutoScanRecentJob:
      type: object
      additionalProperties: false
      description: One automatic scan the platform ran.
      required:
      - id
      - status
      - target_count
      - created_at
      - executor
      properties:
        id:
          type: string
        status:
          type: string
        target_count:
          type: integer
          description: How many distinct addresses the job covered.
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        executor:
          type: string
          enum: [platform, sensor]
          description: Who ran (or is running) the scan — the platform sensor, or a tenant sensor.
        executor_name:
          type: string
          description: The tenant sensor's name when `executor` is `sensor`.
        executor_last_heartbeat:
          type: string
          format: date-time
          description: When that sensor last checked in — shown beside a "sensor offline" failure.
        dispatched_at:
          type: string
          format: date-time
          description: When the job's command was written for the sensor.
        picked_up_at:
          type: string
          format: date-time
          description: When the sensor collected the command on a heartbeat.
        error_message:
          type: string
          description: Why the scan failed, when it did.
    AutoScanNotScanned:
      type: object
      additionalProperties: false
      description: >
        One reason the last sweep left hosts out, and how many. The reason is
        the address classification verbatim — `public`, `carrier_grade_nat`
        (RFC 6598, 100.64.0.0/10), `excluded` (the platform's own addresses),
        `link_local`, `loopback`, `multicast`, `unspecified`, `zoned`,
        `unparseable`. The page owns the plain-language label and, for the
        first two, the call to action: register the range as a network
        segment to bring those hosts into scope.
      required:
      - reason
      - count
      properties:
        reason:
          type: string
        count:
          type: integer
    AutoScanSummary:
      type: object
      additionalProperties: false
      description: >
        What automatic scanning has been doing. Read-only — the worker writes
        it, and it lives under its own key so saving the policy cannot rewrite
        the platform's account of its own runs.
      required:
      - last_sweep_jobs
      - last_sweep_assets
      - assets_in_scope
      - recent_jobs
      - not_scanned
      properties:
        not_scanned:
          type: array
          description: >
            Hosts the last sweep looked at and refused, by reason. Empty means
            every eligible host was scanned — which is a different answer from
            "no sweep has run", carried by `last_sweep_at` being absent. This
            exists because a tenant whose estate is in carrier-grade NAT space
            would otherwise see "Automatic scanning: on" over a sweep that
            scans nothing.
          items:
            $ref: '#/components/schemas/AutoScanNotScanned'
        last_sweep_at:
          type: string
          format: date-time
          description: >
            Absent means no sweep has been recorded for this tenant yet — which
            is a different answer from a sweep that found nothing due.
        next_sweep_at:
          type: string
          format: date-time
        last_sweep_jobs:
          type: integer
        last_sweep_assets:
          type: integer
        assets_in_scope:
          type: integer
          description: >
            Every asset automatic scanning COVERS, whether or not it is due
            right now — internal address, not archived or denied, not
            third-party. Computed from the same rule the sweep selects by.
        recent_jobs:
          type: array
          items:
            $ref: '#/components/schemas/AutoScanRecentJob'
    AutoScanResponse:
      type: object
      additionalProperties: false
      description: 'GET/PUT /discovery/auto-scan envelope.'
      required:
      - auto_scan
      - limits
      - summary
      properties:
        auto_scan:
          $ref: '#/components/schemas/AutoScanPolicy'
        limits:
          $ref: '#/components/schemas/AutoScanLimits'
        summary:
          $ref: '#/components/schemas/AutoScanSummary'
    AutoScanUpdateRequest:
      type: object
      additionalProperties: false
      description: PUT /discovery/auto-scan body. Every field is required.
      required:
      - enabled
      - scan_on_first_observation
      - rescan_interval_hours
      - protocols
      - ports
      properties:
        enabled:
          type: boolean
        scan_on_first_observation:
          type: boolean
        rescan_interval_hours:
          type: integer
          minimum: 1
          maximum: 720
        protocols:
          type: array
          items:
            type: string
        ports:
          type: array
          items:
            type: integer
    DiscoveryMessageResponse:
      type: object
      additionalProperties: false
      description: 'Simple message envelope for cancel/rerun — `{ "message": "..." }`.'
      required:
      - message
      properties:
        message:
          type: string
