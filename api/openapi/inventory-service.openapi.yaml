openapi: 3.1.0
info:
  title: Vista Platform — inventory-service API
  version: 0.1.0
  description: "Spec-first contract for inventory-service (ADR-0001). Started as the second\nvertical slice after the cbom-service/scopes pilot, covering the\n**Infrastructure Assets** resource — the CMDB configuration items\n(servers / endpoints / services) discovered and tracked per tenant — and\nextended with the **Certificates** resource (the X.509 certificate\ninventory the UI lists, opens, and visualizes the chain of).\n\n## Scope of this spec\n\nCovers the core endpoints on the **v2 (CMDB-aligned)** path surface\n`/api/v2/inventory-service/...`:\n\nInfrastructure assets:\n\n  - `GET    /infrastructure-assets`          — list (paginated)\n  - `GET    /infrastructure-assets/{id}`     — get one\n  - `PUT    /infrastructure-assets/{id}`     — update\n  - `POST   /infrastructure-assets/approve`  — bulk approve (pending → monitoring)\n  - `POST   /infrastructure-assets/deny`     — bulk deny\n\nCertificates:\n\n  - `GET    /certificates`                       — list (paginated)\n  - `GET    /certificates/expiring`              — expiring + recently-expired list (dashboard shape)\n  - `GET    /certificates/{id}`                  — get one\n  - `GET    /certificates/{id}/chain`            — flat issuer chain\n  - `POST   /certificates/{id}/rebuild-chain`    — rebuild one chain (RBAC-gated)\n  - `POST   /certificates/rebuild-all-chains`    — bulk rebuild all chains (RBAC-gated)\n  - `POST   /certificates`                        — manually add a certificate (RBAC assets.manage)\n  - `POST   /certificates/upload`                 — upload a PEM file (RBAC assets.manage)\n  - `PUT    /certificates/{id}`                   — update a certificate (RBAC assets.update)\n\nStill out of scope: the broader asset surface (search, facets, stats,\nlifecycle, crypto, hard delete, etc.) and the remaining certificate read\nhelpers the UI calls (search / by-issuer / history) — those exist server-side\nbut are not yet specced in this slice (tracked separately).\n\nCrypto configurations:\n\n    ## Shape status (important)\n\nThese paths document the **current, pre-envelope shapes** the service\nreturns today, captured from the real gin handlers (single resources wrapped\nas `{ \"asset\": {...} }`, the list wrapped as `{ \"assets\": [...],\n\"pagination\": {...} }`, approve/deny as `{ \"message\": \"...\", \"count\": N }`,\nerrors mostly as `{ \"error\": \"string\" }`). They are specced as-is per\nADR-0001 step 2, and the Go contract test\n(`services/inventory-service/internal/handlers/asset_contract_test.go`)\nasserts the live handlers match them.\n\nThe **go-forward ADR-0002 envelope** (`Error`, `Pagination`, the `data`\nwrapper) is defined under `components.schemas` as the documented standard\nthat NEW or HARDENED endpoints conform to. The current v2 asset paths do not\nyet use it; they are hardened to it when the frontend-v2 surface first\nconsumes them (ADR-0001 step 5), at which point this file and the contract\ntest move together.\n"
  contact:
    name: Vista Security
servers:
- url: /api/v2/inventory-service
  description: inventory-service v2 (CMDB-aligned), mounted behind the API gateway.
tags:
- name: infrastructure-assets
  description: Infrastructure asset (CMDB configuration item) read + management.
- name: cmdb-integrations
  description: 'Tenant CMDB sync integration profiles (ServiceNow-style) and their
    sync jobs — full CRUD plus connection-test / manual-sync / job-history actions.
    UI consumer: web-ui/src/components/settings/cmdb-integrations-section.tsx via
    web-ui/src/services/cmdb-api.ts. Settings → Integrations.'
- name: discovery
  description: 'Active-discovery jobs — scan targets (IPs/CIDRs/hostnames) for
    crypto assets and poll status/findings.
    Findings reach inventory server-side (cluster-sensor mirrors them into the
    ingestion queue every sensor feeds) — there is no client-side import step,
    and no API accepts an approval status. UI consumer: frontend-v2 Discovery →
    Discover assets wizard.'
- name: certificates
  description: 'X.509 certificate inventory — read, chain rebuild, and the write
    surface. create / upload / update are RBAC-gated (`assets.manage` for
    create/upload, `assets.update` for update) and are specced below (#616). The
    UI''s `certificates-api.ts` also calls search / by-issuer / history routes;
    those exist server-side too but are not yet specced in this slice (tracked
    separately).'
- name: crypto-configurations
  description: 'Cipher / protocol / key-size / hash configurations (the rows of

    `crypto_implementations` in storage) plus the asset↔certificate edges

    they imply and per-configuration remediation guidance. UI consumers

    live in `web-ui/src/services/inventory-api.ts`

    (`getCryptoImplementations`, `getCryptoImplementationById`,

    `getAssetCertificateLinks`) and `web-ui/src/services/remediation-api.ts`

    (`getRemediationForImplementation`). The v1 routes

    (`/api/v1/inventory-service/crypto-implementations/...`) point at the

    same handlers and are not specced here.

    '
- name: algorithms
  description: 'Cryptographic algorithm reference data (the `algorithms` table —
    the authoritative per-algorithm assessment: strength, deprecation, PQC
    status, CycloneDX identity fields). Read-only catalogue powering algorithm
    pickers and PQC views. UI consumer: `web-ui/src/services/algorithms-api.ts`.
    Registered under both v1 and v2; specced here at the v2 server path.'
- name: crypto-risks
  description: 'Derived cryptographic risk findings (weak protocols / algorithms /

    key sizes / certificate issues) across the tenant''s crypto configurations,
    plus an aggregate severity summary. UI consumer:
    `web-ui/src/services/crypto-risks-api.ts` (Risk & Compliance → Crypto Risks).
    Registered under both v1 and v2; specced here at the v2 server path.'
- name: locations
  description: 'Hierarchical physical/logical location tree (the `locations` CMDB
    table) — sites, buildings, rooms, cloud regions — that infrastructure assets
    are placed in. UI consumer: `web-ui/src/services/locations-api.ts`.'
- name: network-segments
  description: 'Tenant network segments (the `network_segments` CMDB table) —
    CIDRs / IP ranges / domains / cloud VPCs, each tied to a location and used to
    classify discovered assets. UI consumer:
    `web-ui/src/services/network-segments-api.ts`.'
- name: operational
  description: 'Operational overview + remediation queue — per-location finding
    rollups and the cross-tenant remediation work queue with severity / type
    breakdowns. UI consumer: `web-ui/src/services/operational-api.ts`.'
- name: external-connections
  description: 'Third-party external connections (the `external_connections` table)
    — deduplicated outbound TLS/crypto observations to public endpoints, with a
    crypto-quality assessment, a change-history trail, and an aggregate summary.
    UI consumer: `web-ui/src/services/inventory-api.ts` (Inventory → Connections
    lens). The POST upsert is an internal sensor/discovery write, not a tenant UI
    action.'
- name: asset-lifecycle
  description: 'Asset lifecycle management (the Inventory → Stale lens + the
    tenant lifecycle policy) — list stale/archived assets, queue rescan /
    revalidation jobs, archive stale assets, and read/update the per-tenant
    staleness policy. UI consumer: `web-ui/src/services/inventory-api.ts`.'
- name: crypto-posture
  description: 'Tenant crypto-posture summary cards — aggregate asset-risk
    counts, PQC readiness, and PQC migration progress that the Dashboard and
    Risk & Compliance views render. UI consumers:
    `web-ui/src/services/inventory-api.ts` (getRiskSummary),
    `algorithms-api.ts` (getPQCReadinessSummary), and `crypto-risks-api.ts`
    (getPQCProgress).'
- name: crypto-materials
  description: 'Crypto materials inventory — the keys, crypto libraries, and
    external asset mappings the Inventory crypto views read. UI consumer:
    `web-ui/src/services/inventory-api.ts` (getKeys / getLibraries / getMappings).
    The attach-key / attach-library / create-library writes share the handler
    but are not part of this read surface.'
- name: crypto-applications
  description: 'At-rest encryption posture (the `crypto_applications` table) — one
    row per managed cloud resource (S3 bucket, RDS instance, storage account, …)
    recording whether it is encrypted, under which algorithm, and whose key holds
    it. The at-rest sibling of crypto-configurations, which covers in-transit.
    UI consumer: frontend-v2 Inventory → Data Protection lens.'
- name: ask
  description: 'The Query seam (ADR-0008 D1): a question in words answered as a
    query-language predicate you can edit, the rows it selected, and a summary
    that cites them. ENTERPRISE — the route is mounted in every edition and
    answers 402 in Core, because the availability question already has one
    deployment-wide answer at `GET /api/v1/auth-service/tenant/ai` and a 404
    would be indistinguishable from a broken route. UI consumer: frontend-v2''s
    command palette (⌘K) in ask mode.'
paths:
  /operational/locations-summary:
    get:
      operationId: getOperationalLocationsSummary
      tags:
      - operational
      summary: Per-location finding rollups for the tenant
      responses:
        '200':
          description: The per-location finding summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationsSummaryResponse'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /operational/remediation-queue:
    get:
      operationId: getRemediationQueue
      tags:
      - operational
      summary: The tenant's remediation work queue
      responses:
        '200':
          description: A page of remediation queue rows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemediationQueueResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /operational/remediation-queue/stats:
    get:
      operationId: getRemediationStats
      tags:
      - operational
      summary: Remediation queue breakdowns (by severity, by finding type)
      responses:
        '200':
          description: The remediation queue stats.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemediationStatsResponse'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /operational/locations/{id}/environments:
    parameters:
    - name: id
      in: path
      required: true
      description: Location UUID.
      schema:
        type: string
        format: uuid
    get:
      operationId: getLocationEnvironments
      tags:
      - operational
      summary: Per-environment rollups for a location
      responses:
        '200':
          description: The location's per-environment summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentsResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /operational/locations/{id}/environments/{env}/assets:
    parameters:
    - name: id
      in: path
      required: true
      description: Location UUID.
      schema:
        type: string
        format: uuid
    - name: env
      in: path
      required: true
      description: Environment name (defaults to production when empty).
      schema:
        type: string
    get:
      operationId: getEnvironmentAssets
      tags:
      - operational
      summary: Assets in a location's environment (paginated)
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: 'The environment''s assets — `{ "assets": [...], "total": N, "page": P, "page_size": S }`. `assets` is null when none match.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentAssetsResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /operational/remediation-templates:
    get:
      operationId: getRemediationTemplates
      tags:
      - operational
      summary: Built-in remediation ticket templates
      description: 'Returns the platform''s built-in remediation templates (static, keyed by finding type + severity). Always a non-null array.'
      responses:
        '200':
          description: The remediation templates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemediationTemplatesResponse'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
  /network-segments:
    get:
      operationId: listNetworkSegments
      tags:
      - network-segments
      summary: List the tenant's network segments
      responses:
        '200':
          description: The tenant's network segments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkSegmentListResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '500':
          $ref: '#/components/responses/LegacyServerError'
    post:
      operationId: createNetworkSegment
      tags:
      - network-segments
      summary: Create a network segment
      description: 'Creates a network segment (RBAC-gated `settings.update`). Returns the created segment. A referenced `location_id` that does not exist is rejected.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NetworkSegmentInput'
      responses:
        '201':
          description: The created network segment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkSegment'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '500':
          $ref: '#/components/responses/LegacyServerError'
      x-quirks:
      - 'An unknown `location_id` returns 400 {"error":"Invalid request"} (the service reports "location not found").'
  /network-segments/bulk:
    post:
      operationId: bulkImportNetworkSegments
      tags:
      - network-segments
      summary: Bulk-create network segments (spreadsheet import)
      description: 'Creates many network segments in one request from a parsed CSV/XLSX upload (RBAC-gated `settings.update`). Each row reuses single-segment creation. Rows are validated for value format (CIDR / IP range / domain), then deduped within the batch and against existing segments. Returns 200 with a per-row result (created / skipped_duplicate / error) — partial success is normal. More than 1000 rows returns 413.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NetworkSegmentBulkImportRequest'
      responses:
        '200':
          description: Per-row import result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkImportResult'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '413':
          description: Too many rows (max 1000 per import).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
  /network-segments/{id}:
    parameters:
    - name: id
      in: path
      required: true
      description: Network segment UUID.
      schema:
        type: string
        format: uuid
    get:
      operationId: getNetworkSegment
      tags:
      - network-segments
      summary: Get a network segment by id
      responses:
        '200':
          description: The network segment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkSegment'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '404':
          $ref: '#/components/responses/LegacyNotFound'
        '500':
          $ref: '#/components/responses/LegacyServerError'
    put:
      operationId: updateNetworkSegment
      tags:
      - network-segments
      summary: Update a network segment
      description: 'Updates a network segment (RBAC-gated `settings.update`).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NetworkSegmentInput'
      responses:
        '200':
          description: The updated network segment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkSegment'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '404':
          $ref: '#/components/responses/LegacyNotFound'
        '500':
          $ref: '#/components/responses/LegacyServerError'
      x-quirks:
      - 'An unknown `location_id` returns 400 {"error":"Invalid request"}; an unknown segment id returns 404 {"error":"Resource not found"}.'
    delete:
      operationId: deleteNetworkSegment
      tags:
      - network-segments
      summary: Delete a network segment
      description: 'Deletes a network segment (RBAC-gated `settings.update`). Returns 204 No Content.'
      responses:
        '204':
          description: Deleted (no body).
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '404':
          $ref: '#/components/responses/LegacyNotFound'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /locations:
    get:
      operationId: listLocations
      tags:
      - locations
      summary: List the tenant's locations
      description: |
        Returns a flat, paginated list of locations with a total count. (Passing
        `?tree=true` instead returns the nested tree without a total — see
        GET /locations/tree for the dedicated tree endpoint.)
      responses:
        '200':
          description: The tenant's locations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationListResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '500':
          $ref: '#/components/responses/LegacyServerError'
      x-quirks:
      - '?tree=true switches the response to the tree shape `{ "locations": [...] }`
        (no `total`); the dedicated /locations/tree endpoint is the typed path.'
    post:
      operationId: createLocation
      tags:
      - locations
      summary: Create a location
      description: 'Creates a location (RBAC-gated `settings.update`). Returns the created location.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationInput'
      responses:
        '201':
          description: The created location.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /locations/tree:
    get:
      operationId: getLocationTree
      tags:
      - locations
      summary: Get the tenant's location hierarchy as a tree
      description: Returns root locations with nested `children`, depth-first.
      responses:
        '200':
          description: The location tree.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationTreeResponse'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /locations/{id}:
    parameters:
    - name: id
      in: path
      required: true
      description: Location UUID.
      schema:
        type: string
        format: uuid
    get:
      operationId: getLocation
      tags:
      - locations
      summary: Get a location by id (with children)
      responses:
        '200':
          description: The location, with its direct children populated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '404':
          $ref: '#/components/responses/LegacyNotFound'
        '500':
          $ref: '#/components/responses/LegacyServerError'
    put:
      operationId: updateLocation
      tags:
      - locations
      summary: Update a location
      description: 'Updates a location (RBAC-gated `settings.update`).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationInput'
      responses:
        '200':
          description: The updated location.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '500':
          $ref: '#/components/responses/LegacyServerError'
      x-quirks:
      - 'A failed update (including a not-found id) returns 500 {"error":"Failed to update location"} — the handler does not distinguish not-found.'
    delete:
      operationId: deleteLocation
      tags:
      - locations
      summary: Delete a location
      description: 'Deletes a location (RBAC-gated `settings.update`). Returns 204 No Content.'
      responses:
        '204':
          description: Deleted (no body).
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '500':
          $ref: '#/components/responses/LegacyServerError'
      x-quirks:
      - 'An invalid id, or any delete failure, returns 400 {"error":"Invalid request"} (the handler maps all delete errors to 400).'
  /locations/{id}/assets:
    parameters:
    - name: id
      in: path
      required: true
      description: Location UUID.
      schema:
        type: string
        format: uuid
    get:
      operationId: getLocationAssets
      tags:
      - locations
      summary: List the assets placed at a location
      responses:
        '200':
          description: The location's assets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationAssetsResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /locations/{id}/summary:
    parameters:
    - name: id
      in: path
      required: true
      description: Location UUID.
      schema:
        type: string
        format: uuid
    get:
      operationId: getLocationSummary
      tags:
      - locations
      summary: Location detail + rollup counts
      description: |
        Returns the location plus aggregate counts (assets, crypto configs,
        certificates, finding severities, expiring/expired certs). Returned bare
        (the full Location shape is embedded). 404 when the location is not found.
      responses:
        '200':
          description: The location summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationSummary'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '404':
          $ref: '#/components/responses/LegacyNotFound'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /admin/algorithms:
    post:
      operationId: createAlgorithm
      tags:
      - algorithms
      summary: Create an algorithm (platform admin)
      description: |
        Gated on the `algorithms.manage` platform permission and audited. Inserts
        a new row into the global crypto rating catalog (the `algorithms` table),
        the platform-wide crypto source of truth (ADR-0003). `code`, `name` and
        `category` are required; a duplicate `code` returns 409. All other
        identity and assessment fields are optional and fall back to the table's
        column defaults. Enum validation mirrors the schema CHECK constraints.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAlgorithmRequest'
      responses:
        '201':
          description: The created algorithm.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlgorithmResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '403':
          $ref: '#/components/responses/LegacyForbidden'
        '409':
          $ref: '#/components/responses/LegacyConflict'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /admin/algorithms/{code}:
    parameters:
    - name: code
      in: path
      required: true
      description: Algorithm code (e.g. AES-256-GCM).
      schema:
        type: string
    put:
      operationId: updateAlgorithm
      tags:
      - algorithms
      summary: Update an algorithm's crypto rating (platform admin)
      description: |
        Platform-admin only and audited. Edits the assessment fields of an
        algorithm in the global crypto rating catalog (the `algorithms` table),
        the platform-wide crypto source of truth (ADR-0003 Phase 1). Only the
        editable assessment fields below may be changed — identity / CycloneDX
        fields (code, primitive, oid, family, …) are immutable through this
        endpoint. Omitted fields are left unchanged; `recommended_alternatives`,
        when supplied, replaces the existing list. The before/after state is
        emitted to the audit log (resource_type `algorithm`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAlgorithmRequest'
      responses:
        '200':
          description: The updated algorithm.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlgorithmResponse'
        '400':
