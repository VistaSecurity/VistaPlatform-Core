      summary: Manually add a certificate
      description: 'Creates a certificate from caller-supplied fields (RBAC-gated `assets.manage`). The body must carry either `fingerprint_sha256`, or both `serial_number` and `issuer_dn`, else 400. `data_source` defaults to "manual" when omitted. Returns the created certificate under `certificate`.

