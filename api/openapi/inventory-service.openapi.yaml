        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '402':
          description: The batch would exceed the tenant's subscription asset cap.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
        '413':
