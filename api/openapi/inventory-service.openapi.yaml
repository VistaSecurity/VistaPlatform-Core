  /certificates:
    get:
      operationId: listCertificates
      tags:
      - certificates
      summary: List certificates for the current tenant
      description: 'Returns a paginated page of the tenant''s X.509 certificates. Filters accepted as query params (expiring window, key-size min, algorithm, issuer DN substring, self-signed flag, search, cert_id). Pagination uses the legacy `page` / `page_size` shape.

        '
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/Search'
      - name: expiring_days
        in: query
        required: false
        description: Include certificates whose not_after falls within this many days from now.
        schema:
          type: integer
          minimum: 0
      - name: key_size_min
        in: query
        required: false
        description: Minimum public-key size in bits.
        schema:
          type: integer
          minimum: 0
      - name: algorithm
        in: query
        required: false
        description: Public-key algorithm filter (e.g. RSA, ECDSA).
        schema:
          type: string
      - name: issuer
        in: query
        required: false
        description: Issuer DN substring filter.
        schema:
          type: string
      - name: self_signed
        in: query
        required: false
        description: Restrict to self-signed (`true`/`1`) or not (`false`/`0`).
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
          - '1'
          - '0'
      - name: ownership
        in: query
        required: false
        description: >
          Restrict to certificates whose owning asset has this ownership
          (#740) — e.g. `third_party` for the vendor-certificates view.
          Unrecognized values are ignored.
        schema:
          type: string
          enum: [internal, third_party, unknown]
      - name: cert_id
        in: query
        required: false
        description: Restrict to a specific certificate id (UUID).
        schema:
          type: string
          format: uuid
      - name: sort_by
        in: query
        required: false
        description: Sort column (default `not_after`).
        schema:
          type: string
      - name: sort_order
        in: query
        required: false
        description: Sort direction (default `asc`).
        schema:
          type: string
          enum:
          - asc
          - desc
      responses:
        '200':
          description: A page of certificates with pagination metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateListResponse'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '500':
          $ref: '#/components/responses/LegacyServerError'
    post:
      operationId: createCertificate
      tags:
      - certificates
      summary: Manually add a certificate
      description: 'Creates a certificate from caller-supplied fields (RBAC-gated `assets.manage`). The body must carry either `fingerprint_sha256`, or both `serial_number` and `issuer_dn`, else 400. `data_source` defaults to "manual" when omitted. Returns the created certificate under `certificate`.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CertificateWriteRequest'
      responses:
        '201':
          description: The created certificate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '500':
          $ref: '#/components/responses/LegacyServerError'
      x-quirks:
      - Requires fingerprint_sha256, or both serial_number and issuer_dn, else 400 with {"error":"certificate requires fingerprint_sha256 or both serial_number and issuer_dn"}.
      - Any service failure returns 500 with {"error":"Failed to create certificate"}.
  /certificates/upload:
    post:
      operationId: uploadCertificate
      tags:
      - certificates
      summary: Upload a certificate file
      description: 'Accepts a multipart/form-data upload (field `certificate_file`) containing one or more PEM CERTIFICATE blocks (RBAC-gated `assets.manage`). The PEM is authoritative — crypto fields are extracted from it via the shared x509 extractor and any extra form metadata does NOT override them. The optional `ownership` field is the one exception: it records the uploader''s declared ownership and is not derivable from the PEM. The leaf (first CERTIFICATE block) is stored with `data_source` = "manual". Returns the created certificate under `certificate`.

        '
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required:
              - certificate_file
              properties:
                certificate_file:
                  type: string
                  format: binary
                  description: PEM file containing the certificate (leaf first; intermediates allowed). Read up to a 1 MiB cap.
                ownership:
                  type: string
                  enum:
                  - internal
                  - third_party
                  description: 'Optional declared ownership for the uploaded cert. Persisted to `cert_ownership`. Unrecognized values are silently ignored (treated as unset).'
      responses:
        '201':
          description: The created certificate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '500':
          $ref: '#/components/responses/LegacyServerError'
      x-quirks:
      - Form field MUST be `certificate_file`; a missing file returns 400 {"error":"certificate_file is required"}.
      - Non-PEM / unparseable input returns 400; only the leaf certificate is persisted (intermediates in the upload are parsed but not stored as separate rows).
  /certificates/expiring:
    get:
      operationId: listExpiringCertificates
      tags:
      - certificates
      summary: List certificates expiring soon (dashboard shape)
      description: 'Returns a flattened list of certificates expiring within `days` days and/or expired within `lookback_days` days, suitable for the dashboard "expiring soon" widget. The response is NOT a full Certificate object — it is a compact dashboard-shaped row (id, asset_id, common_name, issuer, not_after, days_until_expiry). Defaults: days=30, lookback_days=30, limit=100.

        '
      parameters:
      - name: days
        in: query
        required: false
        description: Forward window in days (default 30).
        schema:
          type: integer
          minimum: 0
      - name: lookback_days
        in: query
        required: false
        description: Backward window in days for recently expired (default 30).
        schema:
          type: integer
          minimum: 0
