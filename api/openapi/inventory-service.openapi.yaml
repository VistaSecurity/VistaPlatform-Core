      - managed_database
      - object_storage
      - key_store
      - cloud_load_balancer
      - api_gateway
      - cdn_distribution
      - serverless_function
      - virtual_network
      - subnet
      - application
      - web_application
      - database_instance
      - service_daemon
      - middleware
