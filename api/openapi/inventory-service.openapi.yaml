      tags: [asset-lifecycle]
      summary: Run an Active Scan (on-demand crypto scan) for assets
      description: >
        Active Scan (issue #866). Approves the targeted assets (so the discovery
        pipeline catalogs their crypto rather than deferring it), stamps scan
        freshness, and dispatches an active probe whose results flow back
        through the discovery pipeline. RBAC-gated `assets.update` — the
        permission follows the action, not the executor, so running from a
        tenant sensor needs nothing more than running from the platform.

        `run_from` chooses the executor: `auto` (default) routes each asset to
