  /infrastructure-assets/topology:
    get:
      operationId: getAssetTopology
      tags: [infrastructure-assets]
      summary: The tenant-wide topology tree
      description: >
        The site → segment → class tree with cross-segment connection counts —
        the map's "where is everything" view (ADR-0006 D4).


        Deliberately NOT a graph of every asset. D4 rejects the force-graph
        shape for this question ("unreadable everywhere it is tried"), so the
        answer is a hierarchy of COUNTS plus a small set of aggregated edges,
        and a click on a class node runs the ordinary asset list with a
        `segment_id:… and class:…` query. The tree is an index into the list,
        not a second copy of it.


        ## Nothing is dropped


        An asset with no site appears under the explicit `Unassigned` site and
        one with no segment under the explicit `Unsegmented` segment. On a fresh
        inventory that is MOST of them, and a topology that omitted them would
        draw a tidy picture of the curated minority and read as complete.
        `total_assets` and `unassigned_assets` are counted independently of the
        tree, so a client can check that the tree adds up.


        ## Edges


        Aggregated per DIRECTED segment pair, over ACTIVE `connects_to` and
        `depends_on` relationships only. Pending edges are excluded: an
        aggregate count is the one place a single unconfirmed observation is
        invisible, so drawing it would state it as fact with nothing on screen
        to qualify it. Containment types (`runs_on`, `hosted_on`, …) are
        excluded too — a VM and its hypervisor in two segments is one thing
        described twice, not a connection between those segments.


        Same-segment edges are not returned; "cross-segment" is the question.


        ## Caps


        Bounded at `node_cap` triples and `edge_cap` pairs. Past either, the
        response sets `truncated` and still reports the real `total_nodes` /
        `total_edges` — never silently shortened. No paging: paging a hierarchy
        is how a client renders half a tree without knowing it.


        An empty estate is 200 with empty arrays, not 404.
      responses:
        '200':
          description: The topology.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetTopologyResponse'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '500':
          $ref: '#/components/responses/LegacyServerError'

