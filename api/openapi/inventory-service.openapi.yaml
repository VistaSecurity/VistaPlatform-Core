        classical_security_level:
          type: integer
        nist_quantum_security_level:
          type: integer
        parameter_set_identifier:
          type: string
        curve:
          type: string
        is_standard:
          type: boolean
        strength:
          type: string
          enum:
          - weak
          - acceptable
          - strong
          - recommended
        risk_score:
          type: integer
          minimum: 0
          maximum: 100
        deprecation_status:
          type: string
          enum:
          - current
          - deprecated
          - obsolete
        deprecation_date:
          type: string
