      type: object
      additionalProperties: false
      required:
      - kind
      - connectors
      properties:
        kind:
          type: string
        connectors:
          type: array
          items:
            $ref: '#/components/schemas/ConnectorCatalogueEntry'
    ConnectorCatalogueResponse:
      type: object
      additionalProperties: false
      description: 'Envelope for GET /connectors — the registry grouped by kind, in registry order.'
      required:
