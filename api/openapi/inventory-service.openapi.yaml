        migration_guidance:
          type: string
          description: Free-text migration guidance.
        recommended_alternatives:
          type: array
          items:
            type: string
          description: |
            Algorithm codes recommended as replacements. Replaces the existing
            list wholesale when supplied.
        remediation_guidance:
          type: object
