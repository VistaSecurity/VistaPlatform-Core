            application/json:
              schema:
                $ref: '#/components/schemas/CertificateResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '500':
          $ref: '#/components/responses/LegacyServerError'
      x-quirks:
      - Form field MUST be `certificate_file`; a missing file returns 400 {"error":"certificate_file is required"}.
      - Non-PEM / unparseable input returns 400; only the leaf certificate is persisted (intermediates in the upload are parsed but not stored as separate rows).
