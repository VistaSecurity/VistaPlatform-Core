    # ============================================================
    # Crypto posture summaries (risk / PQC readiness / PQC progress)
    # ============================================================
    RiskSummary:
      type: object
      additionalProperties: false
      description: Aggregate asset-risk counts (models.RiskSummary).
      required: [total_assets, high_risk, medium_risk, low_risk, unknown_risk, total_crypto, critical_findings]
      properties:
        total_assets: { type: integer }
        high_risk: { type: integer }
        medium_risk: { type: integer }
        low_risk: { type: integer }
        unknown_risk: { type: integer }
        total_crypto: { type: integer }
        critical_findings: { type: integer }
    RiskSummaryResponse:
      type: object
      additionalProperties: false
      description: 'Envelope for GET /risk/summary — `{ "risk_summary": {...} }`.'
      required: [risk_summary]
      properties:
        risk_summary:
          $ref: '#/components/schemas/RiskSummary'
    PostureTrendPoint:
      type: object
      additionalProperties: false
      description: One day on the posture trend line (models.PostureTrendPoint).
      required: [date, risk_index, seeded]
      properties:
        date: { type: string, format: date, description: 'UTC day (YYYY-MM-DD).' }
        risk_index: { type: integer, description: '0–100, % of assets at high risk (matches the hero gauge).' }
        seeded:
          type: boolean
          description: >
            true when this day is a synthesized pre-history baseline (a new
            tenant has no snapshot yet, so days before its first real snapshot
            are drawn flat at the current live posture). false for a real
            snapshot, a carried-forward real value, or today's live value.
    PostureTrendResponse:
      type: object
      additionalProperties: false
      description: 'Envelope for GET /risk/posture/trend — `{ "trend": [...] }`.'
      required: [trend]
      properties:
        trend:
          type: array
          items:
            $ref: '#/components/schemas/PostureTrendPoint'
    PQCReadinessSummary:
      type: object
      additionalProperties: false
      description: 'Tenant PQC adoption fraction (models.PQCReadinessSummary). Returned bare by GET /pqc/summary.'
      required: [total_implementations, pqc_implementations, readiness_percent]
      properties:
        total_implementations: { type: integer }
        pqc_implementations: { type: integer }
        readiness_percent: { type: number }
    PQCFamilyStats:
      type: object
      additionalProperties: false
      description: Per-algorithm-family quantum readiness (models.PQCFamilyStats).
      required: [family, count, is_pqc, quantum_safe]
      properties:
        family: { type: string }
        count: { type: integer }
        is_pqc: { type: boolean }
        quantum_safe: { type: boolean }
        migrate_to:
          type: string
          description: Recommended PQC target; omitted when none.
    PQCProgress:
      type: object
      additionalProperties: false
      description: >-
        Quantum readiness across crypto implementations (models.PQCProgress).
        Each implementation is classified exactly once into one of four
        mutually exclusive categories — pqc_ready, symmetric_safe, non_pqc
        (needs migration) and unclassified — so they sum to
        total_implementations and pqc_percentage cannot exceed 100. by_family
        is a different unit: it counts algorithm families as a migration
        worklist, so one implementation appears under several families and
        those counts intentionally sum past the implementation total.
      required: [total_implementations, pqc_ready, symmetric_safe, non_pqc, unclassified, pqc_percentage, by_family]
      properties:
        total_implementations: { type: integer }
        pqc_ready:
          type: integer
          description: Uses post-quantum cryptography and no classical asymmetric algorithm.
        symmetric_safe:
          type: integer
          description: Uses no asymmetric cryptography at all, so needs no migration.
        non_pqc:
          type: integer
          description: >-
            Needs migration — at least one classical asymmetric component
            (NIST IR 8547: RSA, ECDSA, EdDSA, DH, ECDH; deprecated after 2030,
            disallowed after 2035).
        unclassified:
          type: integer
          description: >-
            Could not be judged — no component algorithms resolved against the
            catalogue, or a component with an unknown primitive. Counts against
            readiness rather than being assumed safe.
        pqc_percentage:
          type: number
          description: (pqc_ready + symmetric_safe) / total_implementations, as a percentage.
        by_family:
          type: [array, "null"]
          description: Per-family breakdown; null when the tenant has no crypto.
          items:
            $ref: '#/components/schemas/PQCFamilyStats'
    PQCProgressResponse:
      type: object
      additionalProperties: false
      description: 'Envelope for GET /pqc/progress — `{ "progress": {...} }`.'
      required: [progress]
      properties:
        progress:
          $ref: '#/components/schemas/PQCProgress'

    # ============================================================
