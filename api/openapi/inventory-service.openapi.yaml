        schema:
          type: integer
          minimum: 0
      - name: key_size_min
        in: query
        required: false
        description: Minimum public-key size in bits.
        schema:
          type: integer
          minimum: 0
      - name: algorithm
        in: query
        required: false
        description: Public-key algorithm filter (e.g. RSA, ECDSA).
        schema:
          type: string
