          items:
            $ref: '#/components/schemas/CMDBSyncJob'
    CMDBMessageResponse:
      type: object
      additionalProperties: false
      description: 'Bare acknowledgement envelope for delete — `{ "message": "profile deleted" }`.'
      required:
      - message
      properties:
        message:
          type: string
    CMDBTestConnectionResult:
      type: object
      additionalProperties: false
      description: 'Success envelope for POST /cmdb/profiles/{id}/test — `{ "success": true, "message": "..." }`. The failure case returns 400 with the LegacyError-compatible `{ "success": false, "error": "..." }`.'
      required:
      - success
      - message
      properties:
        success:
          type: boolean
        message:
          type: string
    CreateDiscoveryJobRequest:
      type: object
      additionalProperties: false
      description: |
        Body for POST /discovery/jobs. Mirrors models.CreateDiscoveryJobInput.
        `targets` is required (binding:"required"); 1–1000 entries.
      required:
      - targets
      properties:
        targets:
          type: array
          minItems: 1
          items:
            type: string
          description: IPs, CIDRs, or hostnames to scan (max 1000).
        execution_mode:
          type: string
          description: 'How the scan is dispatched: `auto`, `cloud`, or `sensors`.'
        protocols:
          type: array
          items:
            type: string
          description: Protocols to probe (e.g. `TLS`, `SSH`). Empty = service default.
        ports:
          type: array
          items:
            type: integer
          description: Ports to probe (e.g. 443, 22, 8443). Empty = service default.
        preferred_sensor_ids:
          type: array
          items:
            type: string
          description: Sensor IDs to prefer when execution_mode routes via sensors.
        retention_cap_mb:
          type:
          - integer
          - 'null'
          description: Per-job capture retention cap in MB (service default 25).
        retention_ttl_hours:
          type:
          - integer
          - 'null'
          description: Per-job capture retention TTL in hours (service default 24).
        options:
          type: object
          additionalProperties: true
          description: Free-form scan options forwarded to cluster-sensor-service.
        tags:
          type: object
          additionalProperties: true
          description: Free-form tags stamped on the job and resulting findings.
        owner:
          type: string
        environment:
          type: string
    DiscoveryJob:
      type: object
      additionalProperties: true
      description: |
        A discovery job. Returned on create and when polling status. Status
        polling proxies cluster-sensor-service, so extra fields may appear.
      required:
      - id
      - status
      properties:
        id:
          type: string
        tenant_id:
          type: string
        created_by:
          type: string
        status:
          type: string
          description: e.g. pending, in_progress, completed, failed, cancelled.
        targets:
          type: array
          items:
            type: string
        execution_mode:
          type: string
        requested_sensor_ids:
          type: array
          items:
            type: string
        fanout:
          type: boolean
        retention_cap_mb:
          type: integer
        retention_ttl_hours:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    DiscoveryJobResponse:
      type: object
      additionalProperties: true
      description: 'Create-job envelope — `{ "job": {...} }`.'
      required:
      - job
      properties:
        job:
          $ref: '#/components/schemas/DiscoveryJob'
    DiscoveryFinding:
      type: object
      additionalProperties: true
      description: |
        A single discovered finding. Mirrors services.IngestFinding; results
        proxied from cluster-sensor-service may carry extra fields, hence
        additionalProperties.
      properties:
        hostname:
          type:
          - string
          - 'null'
        ip_address:
          type:
          - string
          - 'null'
        port:
          type:
          - integer
          - 'null'
        asset_type:
          type: string
        protocol:
          type: string
        protocol_version:
          type:
          - string
          - 'null'
        cipher_suite:
          type:
          - string
          - 'null'
        key_exchange_algorithm:
          type:
          - string
          - 'null'
        key_size:
          type:
          - integer
          - 'null'
        hash_algorithm:
          type:
          - string
          - 'null'
        source_sensor_id:
          type:
          - string
          - 'null'
        device_id:
          type:
          - string
          - 'null'
        raw_data:
          type: object
          additionalProperties: true
    DiscoveryJobResults:
      type: object
      additionalProperties: true
      description: |
        Findings for a job, proxied verbatim from cluster-sensor-service
        (`{ "findings": [...] }` plus any additive upstream fields).

        `findings` is what the job SAW; `materialization` is what became of it
        once mirrored into the ingestion queue. They answer different questions
        and can legitimately disagree — a third-party endpoint is recorded as a
        connection rather than an asset, and processing is asynchronous — so
        both are reported, separately labelled, rather than as one number.
      properties:
        findings:
          type: array
          items:
            $ref: '#/components/schemas/DiscoveryFinding'
        materialization:
          $ref: '#/components/schemas/DiscoveryMaterialization'
    DiscoveryMaterialization:
      type: object
      additionalProperties: true
      description: |
        What became of a job's findings after they left the job record. Omitted
        entirely when the counts could not be read, so absent means "unknown",
        not "zero".
      properties:
        findings:
          type: integer
          description: Findings recorded by the job itself.
        queued:
          type: integer
          description: |
            Findings mirrored into the ingestion queue. Lower than `findings`
            when a finding had no resolved IP to anchor on.
        auto_approved:
          type: integer
          description: |
            Queue rows an auto-approval rule matched — the asset went straight to
            monitoring. Auto-approval has exactly one gate: the asset is on a
            network segment with auto-approve enabled.
        pending_approval:
          type: integer
          description: Queue rows no rule matched — the asset is in Discovery → Approvals.
        awaiting_processing:
          type: integer
          description: Queue rows the pipeline has not dispositioned yet.
    DiscoveryCapabilities:
      type: object
      additionalProperties: true
      description: |
        Discovery scanning features available to the tenant. Defaults to all
        enabled; tenant admins can disable individual capabilities.
      properties:
        active_scanning:
          type: boolean
        tls_version_enumeration:
          type: boolean
        ssh_probing:
          type: boolean
    DiscoveryCapabilitiesResponse:
      type: object
      additionalProperties: false
      description: 'GET /discovery/capabilities envelope — `{ "capabilities": {...} }`.'
      required:
      - capabilities
      properties:
        capabilities:
          $ref: '#/components/schemas/DiscoveryCapabilities'
    UpdateDiscoveryCapabilitiesRequest:
      type: object
      additionalProperties: false
      description: PUT /discovery/capabilities body.
      required:
      - capabilities
      properties:
        capabilities:
          $ref: '#/components/schemas/DiscoveryCapabilities'
    UpdateDiscoveryCapabilitiesResponse:
      type: object
      additionalProperties: true
      description: PUT /discovery/capabilities result.
      required:
      - message
      - capabilities
      properties:
        message:
          type: string
        capabilities:
          $ref: '#/components/schemas/DiscoveryCapabilities'
        version:
          type: integer
    DiscoveryMessageResponse:
      type: object
      additionalProperties: false
      description: 'Simple message envelope for cancel/rerun — `{ "message": "..." }`.'
      required:
      - message
      properties:
        message:
          type: string
