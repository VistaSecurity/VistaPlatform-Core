          type: string
    CMDBTestConnectionResult:
      type: object
      additionalProperties: false
      description: 'Success envelope for POST /cmdb/profiles/{id}/test — `{ "success": true, "message": "..." }`. The failure case returns 400 with the LegacyError-compatible `{ "success": false, "error": "..." }`.'
      required:
      - success
      - message
      properties:
        success:
          type: boolean
        message:
          type: string
    ConnectorCatalogueEntry:
      type: object
      additionalProperties: false
      description: |
        One connector from standards/connectors.yaml, annotated for the calling
        tenant. `status` says whether anything DISPATCHES on the key;
        `entitled` says whether this tenant may use it; `addable` is the
        conjunction, computed server-side so a page cannot check one half and
        forget the other.
      required:
      - key
      - label
      - kind
      - direction
      - status
      - description
      - edition
      - entitled
      - addable
      properties:
        key:
          type: string
        label:
          type: string
        kind:
          type: string
          enum: [cloud, cmdb, network_source_of_truth, itsm, siem, notification, edr_mdm, sbom_source, secrets_store]
        direction:
          type: string
          enum: [pull, push, both]
        status:
          type: string
          enum: [live, registered, planned]
          description: |
            live — an implementation dispatches on this key.
            registered — the schema accepts the key but nothing implements it.
            planned — declared in the registry only.
        produces_classes:
          type: array
          items:
            type: string
        description:
          type: string
        feature:
          type: string
          description: Entitlement key gating this connector; absent for a Core connector.
        edition:
          type: string
          enum: [core, enterprise, msp]
          description: Minimum edition that may grant this connector.
        entitled:
          type: boolean
        addable:
          type: boolean
        unavailable_reason:
          type: string
          enum: [upgrade, unavailable]
          description: |
            Why `addable` is false. `upgrade` — your plan or edition does not
            include it. `unavailable` — nobody can use it yet; we have not
            built it. Different sentences, and offering an upgrade for
            something nobody can buy is the worse mistake.
