    AssetIdentifier:
      type: object
      additionalProperties: false
      description: 'One identifier observed for an asset (ADR-0002 D3). An identifier value maps to at most one asset per tenant; a collision is what opens a merge proposal in Approvals.

        '
      required:
      - kind
      - value
      - source_kind
      - confidence
      - first_seen_at
      - last_seen_at
      properties:
        id:
          type: string
          format: uuid
        asset_id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - agent_id
          - cloud_resource_id
          - serial_number
          - cmdb_sys_id
          - ssh_host_key_fingerprint
          - mac_address
          - fqdn
          - hostname
          - ip_address
          - name
        value:
          type: string
        scope:
          type: string
          description: 'The segment for `hostname` and `ip_address`, the class key for `name`, the sync profile for `cmdb_sys_id`. Absent for the six globally unique kinds — a scope on one of those splits the uniqueness key. A `hostname` or `ip_address` in no configured segment carries the literal `tenant`, the tenant-wide default scope: there is always an answer, because an identifier with no scope could never decide a match.

            '
        source_kind:
          type: string
          enum:
          - measured
          - declared
          - imported
          - inferred
        source_ref:
          type: string
        confidence:
          type: number
        first_seen_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
    AssetEndpoint:
      type: object
      additionalProperties: false
      description: 'One network face of an asset: an (address|fqdn, port, transport) it was observed exposing. `port` is absent for an at-rest or declared endpoint — the "AT-REST" port sentinel the port-as-asset model needed is retired.

        '
      required:
      - id
      - tenant_id
      - asset_id
      - transport
      - source_kind
      - status
      - first_seen_at
      - last_seen_at
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        asset_id:
          type: string
          format: uuid
        address:
          type: string
        fqdn:
          type: string
        port:
          type: integer
        transport:
          type: string
          enum:
          - tcp
          - udp
          - none
        protocol:
          type: string
        service_name:
          type: string
        service_version:
          type: string
        service_confidence:
          type: string
        service_identification_method:
          type: string
        bound_local:
          type: boolean
          description: |
            Whether the socket is reachable only from the host itself.

            THREE-VALUED, and ABSENT is the third value: absent means nobody
            established it, which is every endpoint a network scan found — a
            scan cannot establish this even in principle, it only ever sees what
            answers. Only a host's own view of its sockets (the agent's host
            inventory) reports either boolean, and `false` is then a measurement
            that the service IS exposed to the network, not merely "not known to
            be loopback". Do not render an absent value as false.
        source_kind:
          type: string
        source_ref:
          type: string
        status:
          type: string
          enum:
          - active
          - stale
          - closed
        first_seen_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        last_scanned_at:
          type: string
          format: date-time
        last_scan_status:
          type: string
    Asset:
      type: object
      additionalProperties: false
      description: 'An infrastructure asset (CMDB configuration item). Field presence follows models.Asset''s json tags: fields without `omitempty` are always present (nullable pointers serialize as null); `omitempty` fields are omitted when zero/empty.

        '
      required:
      - id
      - tenant_id
      - class_key
      - class_path
      - class_source_kind
      - hostname
      - attributes
      - environment
      - business_unit
      - owner_email
      - description
      - tags
      - metadata
      - asset_ownership
      - asset_status
      - first_discovered_at
      - last_seen_at
      - created_at
      - updated_at
      - deleted_at
      - risk_score
      - risk_assessed_by
      - risk_level
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        class_key:
          type: string
          description: 'The asset''s class, from the registry generated out of standards/asset-classes.yaml (ADR-0002 D2). It replaces the retired four-value `asset_type`: the values do not overlap, so a client matching on the old four gets nothing rather than something wrong.

            '
        class_path:
          type: string
          description: 'Materialised ancestry of the class, e.g. `hardware.computer.server`. Prefix-matching it selects a whole branch, which is what the class facet does.

            '
        class_source_kind:
          type: string
          enum:
          - measured
          - declared
          - imported
          - inferred
          description: How the class was decided.
        class_source_ref:
          type: string
          description: 'Who decided the class (`classifier:<model>`, `user:<id>`, `cmdb:<profile>`). A class proposal that cannot name its producer is not reviewable.

            '
        class_confidence:
          type: number
          description: '0..1. ABSENT means nothing classified it — not "classified with low confidence".

            '
        display_name:
          type: string
        hostname:
          type:
          - string
          - 'null'
        primary_address:
          type: string
          description: 'Convenience for lists. The AUTHORITATIVE addresses are the endpoints; this is the one to show when there is room for one.

            '
        attributes:
          type: object
          additionalProperties: true
          description: 'Class-specific typed attributes, validated against the class''s schema (`operating_system`, `vendor`, `model`, `firmware_version`, …). Always present (defaults to {}).

            '
        support_group:
          type: string
        environment:
          type:
          - string
          - 'null'
        business_unit:
          type:
          - string
          - 'null'
        owner_email:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
        site:
          type: string
        region:
          type: string
        zone:
          type: string
        location_id:
          type: string
          format: uuid
        network_segment_id:
          type: string
          format: uuid
        network_segment_name:
          type: string
        discovery_method:
          type: string
        confidence_score:
          type: integer
        tags:
          type: object
          additionalProperties: true
          description: Arbitrary tag map (JSONB). Always present (defaults to {}).
        metadata:
          type: object
          additionalProperties: true
          description: Arbitrary metadata map (JSONB). Always present (defaults to {}).
        asset_ownership:
          type: string
        asset_status:
          type: string
        stale_status:
          type: string
        merged_into:
          type: string
          format: uuid
          description: >
            The asset this one was merged into — the tombstone pointer. Present
            ONLY on an asset a merge archived; absent on every other asset.

            Accepting a merge archives the observation rather than deleting it,
            so its id keeps resolving: `GET /assets/{merged-away-id}` answers
            200 with `asset_status: archived` and this field naming the
            survivor, rather than a 404 that tells a stale bookmark, ticket or
            dashboard tile nothing. A client holding an id that comes back with
            `merged_into` set should follow it and, where it stores ids, replace
            the one it held — the `inventory.lifecycle.asset.merged` event
            carries the same pair for clients that would rather be told than
            discover it on the next read.
        first_discovered_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type:
          - string
          - 'null'
          format: date-time
        risk_score:
          type: integer
          description: 'Recomputed as the MAX over the asset''s scored crypto configurations (ADR-0005 D4). 0 with an EMPTY `risk_assessed_by` is NOT ASSESSED; 0 with a non-empty one is assessed clean.

            '
        risk_assessed_by:
          type: array
          items:
            type: string
          description: 'The producers that have evaluated this asset. Empty means nothing has, which is not the same as "nothing found".

            '
        risk_level:
          type: string
        identifiers:
          type: array
          description: 'Every identifier observed for the asset (ADR-0002 D3), strongest first. Present on the single-asset read; omitted from list rows.

            '
          items:
            $ref: '#/components/schemas/AssetIdentifier'
        endpoints:
          type: array
          description: 'The asset''s network faces. An asset may have none — an at-rest cloud resource genuinely has nothing to connect to.

            '
          items:
            $ref: '#/components/schemas/AssetEndpoint'
        primary_endpoint:
          $ref: '#/components/schemas/AssetEndpoint'
        crypto_implementations:
          type: array
          items:
            type: object
            additionalProperties: true
          description: 'Crypto configurations found on the asset. Shape is large and not specced in this slice; treated as opaque objects here.

            '
        highest_risk:
          type: integer
        certificate_count:
          type: integer
        crypto_implementation_count:
          type: integer
          description: 'Number of live crypto configurations on the asset. Present on the LIST response so the Inventory row can show an "N cfg" count without a per-row query.

            '
        protocol_summary:
          type: array
          description: 'Per-protocol rollup of the asset''s crypto configurations, one entry per distinct protocol, ordered by count descending. Present on the LIST response so the Infrastructure lens can render protocol badges from one request. `max_risk_score` follows the platform convention that 0 means NOT ASSESSED, not "safe".

            '
          items:
            type: object
            additionalProperties: false
            required:
            - protocol
            - count
            - max_risk_score
            properties:
              protocol:
                type: string
              count:
                type: integer
              max_risk_score:
                type: integer
    PaginationMeta:
      type: object
      additionalProperties: false
      description: 'CURRENT pagination block embedded under the `pagination` key by the list endpoint (shared/api.PaginationMeta). Pre-ADR-0002; distinct from the go-forward `Pagination` schema below.

        '
      required:
      - page
      - page_size
      - total
      - total_pages
      - has_next
      - has_prev
      properties:
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
        has_next:
          type: boolean
        has_prev:
          type: boolean
    AssetListResponse:
      type: object
      additionalProperties: false
      description: 'CURRENT list envelope for GET /infrastructure-assets. Pre-ADR-0002: the collection is wrapped under `assets` with a sibling `pagination` block (and an optional `hints` object when a certificate filter is active). Hardening this to the ADR-0002 collection envelope (`{ data, pagination }`) is the documented go-forward change.

        '
      required:
      - assets
      - pagination
      properties:
        assets:
          type: array
          items:
            $ref: '#/components/schemas/Asset'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
        query:
          type: string
          description: 'The predicate that actually selected these rows, in CANONICAL form — the caller''s `query` AND any deprecated per-field filters translated into the same language. Absent when the predicate was empty. Show this, not the string you sent: they differ whenever a legacy filter was in play or the spelling was non-canonical (ADR-0008 D4.4).'
        hints:
          type: object
          additionalProperties: true
          description: Optional relationship hints; present only when a certificate filter is active.
    AssetResponse:
      type: object
      additionalProperties: false
      description: 'CURRENT single-asset envelope for GET/PUT /infrastructure-assets/{id}. Pre-ADR-0002: the resource is wrapped under the `asset` key.

        '
      required:
      - asset
      properties:
        asset:
          $ref: '#/components/schemas/Asset'
    AssetUpdateResponse:
      type: object
      additionalProperties: false
      description: >
        PUT /infrastructure-assets/{id}. The asset, plus what the update did to
        its identifiers — attached, retired, and KEPT BACK. The third list is
        the one that matters: a collector-minted identifier a person tried to
        delete is still there, and a client that reported the deletion as
        successful would be lying on the next read.
      required:
      - asset
      properties:
        asset:
          $ref: '#/components/schemas/Asset'
        identifiers:
          $ref: '#/components/schemas/IdentifierUpdateReport'
    IdentifierUpdateReport:
      type: object
      additionalProperties: false
      required: [attached, removed, kept]
      properties:
        attached:
          type: array
          items: { $ref: '#/components/schemas/IdentifierChange' }
        removed:
          type: array
          items: { $ref: '#/components/schemas/IdentifierChange' }
        kept:
          type: array
          description: >
            Identifiers the request asked to remove and the server did not.
            `reason` says why — they were not a person's to retire.
          items: { $ref: '#/components/schemas/IdentifierChange' }
    IdentifierChange:
      type: object
      additionalProperties: false
      required: [kind, value]
      properties:
        kind: { type: string }
        value: { type: string }
        scope: { type: string }
        source_kind: { type: string }
        reason:
          type: string
          description: Why this identifier was kept. Set only on `kept`.
    IdentifierConflict:
      type: object
      additionalProperties: false
      required: [error, merge_proposal_id]
      properties:
        error: { type: string }
        message: { type: string }
        kind: { type: string }
        value: { type: string }
        conflicting_asset_id:
          type: string
          format: uuid
          description: The asset that already carries this identifier.
        merge_proposal_id:
          type: string
          format: uuid
          description: >
            The proposal opened so a reviewer can say whether these are the same
            thing. It is committed independently of the refused edit.
    AssetInput:
      type: object
      additionalProperties: false
      description: 'Update/create body (models.AssetInput). `class_key` is required on CREATE and optional on UPDATE, so it is not marked required here — one schema serves both, and requiring it on update would force every owner-email edit to restate the class. There is no `port`: a port is an endpoint.

        '
      properties:
        class_key:
          type: string
          description: The asset's class, from the registry (ADR-0002 D2). Required on create.
        display_name:
          type: string
          description: 'What a person calls this thing. Cosmetic for most classes — the engine derives one from the identifiers — but IDENTITY for the `service` branch, where it is required on create: a service identifies by (tenant, class, name) and has no address or serial to be known by (ADR-0002 D3).

            '
        identifiers:
          type: array
          description: >
            Declared identifiers. A serial typed into the UI or a sys_id from a
            CMDB is as much identity as a measured one; what differs is the
            source, which the identification engine reconciles on.


            On UPDATE this array is the DESIRED set of the asset's declared
            identifiers: one that is present is attached, one that is absent is
            retired — but only if a person declared it. Omit the field entirely
            to leave identifiers alone. `scope` defaults to the network segment
            for `hostname` and `ip_address`, and to the CLASS KEY for `name`
            (two services may share a name only if they are different kinds of
            thing).
          items:
            type: object
            additionalProperties: false
            required:
            - kind
            - value
            properties:
              kind:
                type: string
              value:
                type: string
              scope:
                type: string
        endpoints:
          type: array
          description: Declared endpoints. A manually created asset usually has none.
          items:
            type: object
            additionalProperties: false
            properties:
              address:
                type: string
              fqdn:
                type: string
              port:
                type: integer
              transport:
                type: string
              protocol:
                type: string
        hostname:
          type:
          - string
          - 'null'
        ip_address:
          type:
          - string
          - 'null'
        attributes:
          type: object
          additionalProperties: true
          description: Class-specific typed attributes, validated against the class's schema.
        support_group:
          type:
          - string
          - 'null'
        environment:
          type:
          - string
          - 'null'
        business_unit:
          type:
          - string
          - 'null'
        owner_email:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
        tags:
          type: object
          additionalProperties: true
        metadata:
          type: object
          additionalProperties: true
        asset_ownership:
          type:
          - string
          - 'null'
        asset_status:
          type:
          - string
          - 'null'
          description: >
            REFUSED on both create and update. A new asset's status is evaluated
            server-side from the tenant's network segments, and an update that
            carried it answers 400: approving promotes pending relationships and
            materialises deferred findings, and denying records a suppression —
            so writing the column alone would leave a monitored asset with an
            empty Relationships tab and no findings. Use
            POST /infrastructure-assets/approve, /deny, or /stale/archive.
    AssetIdsRequest:
      type: object
      additionalProperties: false
      description: Bulk approve/deny body. asset_ids is required (binding:"required").
      required:
      - asset_ids
      properties:
        asset_ids:
          type: array
          items:
            type: string
          description: Asset UUIDs as strings. Unparseable entries are silently dropped.
    ApprovalResult:
      type: object
      additionalProperties: false
      description: 'CURRENT response for POST /infrastructure-assets/approve and /deny: a human-readable message plus the count of assets acted on.

        '
      required:
      - message
      - count
      properties:
        message:
          type: string
        count:
          type: integer
    Certificate:
      type: object
      additionalProperties: false
      description: 'An X.509 certificate as returned by inventory-service. Mirrors models.Certificate''s json tags. Most pointer fields carry `omitempty` and are absent when nil; the unconditional fields are required and non-nullable strings/bools.

        '
      required:
      - id
      - tenant_id
      - subject_dn
      - issuer_dn
      - fingerprint_sha256
      - is_self_signed
      - is_ca_certificate
      - certificate_state
      - certificate_format
      - data_completeness
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        serial_number:
          type: string
        subject_dn:
          type: string
        issuer_dn:
          type: string
        common_name:
          type: string
        subject_alternative_names:
          type: array
          items:
            type: string
        signature_algorithm:
          type: string
        public_key_algorithm:
          type: string
        public_key_size:
          type: integer
        not_before:
          type: string
          format: date-time
        not_after:
          type: string
          format: date-time
        fingerprint_sha1:
          type: string
        fingerprint_sha256:
          type: string
        certificate_pem:
          type: string
        is_self_signed:
          type: boolean
        is_ca_certificate:
          type: boolean
        key_usage:
          type: array
          items:
            type: string
        extended_key_usage:
          type: array
          items:
            type: string
        issuer_certificate_id:
          type: string
          format: uuid
        superseded_by_certificate_id:
          type: string
          format: uuid
        certificate_state:
          type: string
          description: CycloneDX 7-state lifecycle (pre-activation, active, suspended, deactivated, revoked, expired, destroyed).
        certificate_state_reason:
          type: string
        revoked_at:
          type: string
          format: date-time
        revocation_discovered_at:
          type: string
          format: date-time
        certificate_format:
          type: string
        activation_date:
          type: string
          format: date-time
        deactivation_date:
          type: string
          format: date-time
        destruction_date:
          type: string
          format: date-time
        signature_algorithm_oid:
          type: string
        public_key_algorithm_oid:
          type: string
        data_completeness:
          type: string
        data_source:
          type: string
        last_data_update:
          type: string
          format: date-time
        has_sct:
          type: boolean
        sct_source:
          type: string
          enum: [embedded, tls_extension, ocsp, none]
          description: >
            Which RFC 6962 delivery route carried the Signed Certificate
            Timestamp, or "none" when a live handshake checked all three
            routes and found none. Absent when the route wasn't observable.
        known_bad_ca:
          type: string
        is_ev:
          type: boolean
        ocsp_status:
          type: string
        ocsp_detail:
          type: string
        cert_ownership:
          type: string
          enum:
          - internal
          - third_party
          description: 'Ownership explicitly declared for manually-uploaded certs (internal | third_party). Absent (NULL) when unset; for sensor-discovered certs ownership is derived from the linked asset rather than this column.'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        related_assets:
          type: array
          items:
            $ref: '#/components/schemas/Asset'
          description: Populated by GetCertificateByID; absent from list rows.
        deployment_count:
          type: integer
          description: Count of distinct assets using this certificate via crypto_implementations, INCLUDING assets deployed on a certificate this one issued (walking issuer_certificate_id) — so a CA/intermediate cert is credited with the deployments of every leaf it issued, not just certs that are themselves a config's direct leaf certificate_id.
        ownership:
          type: string
          enum:
          - internal
          - third_party
          - unknown
          description: 'The EFFECTIVE ownership bucket the `?ownership=` list filter partitions on: the linked asset''s asset_ownership when the cert is deployed, else the declared cert_ownership (manual uploads), else "unknown". Always populated on list rows (never null) — unlike cert_ownership, which is null unless explicitly declared at upload time. Absent from GetCertificateByID (list rows only).'
    CertificateListResponse:
