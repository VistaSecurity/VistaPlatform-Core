          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '404':
          $ref: '#/components/responses/LegacyNotFound'
      x-quirks:
      - All GetAssetByID errors (DB error, no rows) return 404, not 500.
    put:
      operationId: updateInfrastructureAsset
      tags:
      - infrastructure-assets
      summary: Update an infrastructure asset
      description: >
        Partially updates an asset. Every field is optional — including
        `class_key`, which is required only on create.


        `identifiers` is HONOURED, and is the only way to change what the asset
        can be recognised by. Identifiers a person adds are attached through the
        identification engine, which is the only writer that respects the
        uniqueness invariant: an identifier value maps to at most one asset in a
        tenant.


        `hostname` and `ip_address` are identifier aliases. Setting either
        attaches the matching identifier (an `fqdn` when the hostname is dotted,
        a scoped `hostname` when it is a single label) — it does NOT retire the
        old one, because the old name was true. Remove it by leaving it out of
        an `identifiers` array.


        REMOVAL happens only when the request actually carries an `identifiers`
        array, and only for identifiers whose `source_kind` is `declared`.
        Collector-minted identifiers — `agent_id`, `cloud_resource_id`, and
        anything a sensor or an import produced — are KEPT, and the response's
        `identifiers.kept` says which and why. An edit may never leave an asset
        with no identifiers at all (400): it could never be matched again.


        An identifier that already belongs to ANOTHER asset is answered 409 with
        `merge_proposal_id`; the proposal is committed and waiting in Approvals
        even though the edit was refused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetInput'
      responses:
        '200':
          description: The updated asset, and what the update did to its identifiers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetUpdateResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '409':
          description: >
            An identifier in the request already belongs to another asset. The
            edit was refused and a merge proposal was opened.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentifierConflict'
      x-quirks:
      - A failed update (including not-found) returns 400 with {"error":"Failed to update asset"}, not 404/500.
    delete:
      operationId: deleteInfrastructureAsset
      tags:
      - infrastructure-assets
      summary: Soft-delete an infrastructure asset
      description: 'Soft-deletes the asset (RBAC-gated `assets.delete`). Returns 204 No Content on success; an invalid id returns 400.'
      responses:
        '204':
          description: Deleted (no body).
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '500':
          $ref: '#/components/responses/LegacyServerError'
