        protocol: { type: string }
        protocol_version: { type: string }
    KeyImplementationListResponse:
      type: object
      additionalProperties: false
      description: 'List envelope for GET /keys/{id}/implementations — `{ "implementations": [...] }`.'
      required: [implementations]
      properties:
        implementations:
          type: [array, "null"]
          items:
            $ref: '#/components/schemas/KeyImplementation'
    CryptoLibrary:
      type: object
