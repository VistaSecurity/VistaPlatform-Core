        its network segment, else the platform sensor; `platform` runs
        everything from the platform sensor; `sensor` runs everything from the
        one tenant sensor named by `sensor_id`. A named sensor that is not the
        tenant's answers 404, the platform's own sensor or an air-gapped one
        400, and one that is offline 409 — nothing is scanned in those cases.
