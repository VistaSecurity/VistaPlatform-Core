        subcategory:
          type: string
        description:
          type: string
        algorithm_family:
          type: string
        primitive:
          type: string
        mode:
          type: string
        padding:
          type: string
        oid:
          type: string
        crypto_functions:
          type: array
          items:
            type: string
        classical_security_level:
          type: integer
        nist_quantum_security_level:
          type: integer
        parameter_set_identifier:
          type: string
        curve:
          type: string
        is_standard:
          type: boolean
        strength:
          type: string
          enum:
          - weak
          - acceptable
          - strong
          - recommended
        risk_score:
          type: integer
          minimum: 0
          maximum: 100
          description: Explicit catalogue risk assessment. Zero is a valid assessed score.
        deprecation_status:
          type: string
          enum:
          - current
          - deprecated
          - obsolete
        deprecation_date:
          type: string
        is_pqc:
          type: boolean
        pqc_standardization_status:
          type: string
          enum:
          - none
          - standardized
          - candidate
          - alternative
        migration_guidance:
          type: string
        recommended_alternatives:
          type: array
          items:
            type: string
        remediation_guidance:
          type: object
          additionalProperties: true
        compliance_mappings:
          type: object
          additionalProperties: true
    AlgorithmRecommendationsResponse:
