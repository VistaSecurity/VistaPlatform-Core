      required:
        - id
        - tenant_id
        - source_ip
        - dest_ip
        - dest_port
        - protocol
        - crypto_strength
        - is_pqc_resistant
        - cert_is_expired
        - first_seen_at
        - last_seen_at
        - observation_count
        - created_at
        - updated_at
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        source_ip: { type: string }
        source_hostname: { type: string }
        source_asset_id: { type: string, format: uuid }
        dest_ip: { type: string }
        dest_hostname: { type: string }
        dest_port: { type: integer }
        protocol: { type: string }
        protocol_version: { type: string }
        cipher_suite: { type: string }
        key_exchange_algorithm: { type: string }
        key_size: { type: integer }
        supported_tls_versions:
          type: array
          items: { type: string }
        crypto_strength:
          type: string
          enum: [good, weak, unknown]
        is_pqc_resistant: { type: boolean }
        weak_reasons:
          type: array
          items: { type: string }
        cert_subject: { type: string }
        cert_issuer: { type: string }
        cert_san:
          type: array
          items: { type: string }
        cert_not_before: { type: string, format: date-time }
        cert_not_after: { type: string, format: date-time }
        cert_fingerprint_sha256: { type: string }
        cert_public_key_algorithm: { type: string }
        cert_public_key_size: { type: integer }
        cert_signature_algorithm: { type: string }
        cert_is_expired: { type: boolean }
        cert_validation_status: { type: string }
        cert_pem: { type: string }
        service_name: { type: string }
        service_version: { type: string }
        service_confidence: { type: string }
        service_identification_method: { type: string }
        first_seen_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        observation_count: { type: integer }
        sensor_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
