      properties:
        policy:
          $ref: '#/components/schemas/AssetLifecyclePolicy'

    # ============================================================
    # External connections (third-party connection inventory)
    # ============================================================
    ExternalConnection:
      type: object
      additionalProperties: false
      description: >
        A deduplicated third-party connection row (models.ExternalConnection) —
