        - name: status
          in: query
          description: Filter to one install status. Omit for all three.
          schema:
            type: string
            enum: [active, stale, removed]
        - name: sort
          in: query
          description: >
            Ordering. `version` sorts on the normalised `version_sort` key, never
            on the raw version string — as text, 1.10 sorts below 1.9
            (QUERY_LANGUAGE §5.5). Products whose version has no numeric
            component have a NULL key and sort last.
          schema:
            type: string
            enum: [name, version, vendor, last_seen, first_seen]
            default: name
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: The asset's software installs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoftwareInstallListResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '500':
          $ref: '#/components/responses/LegacyServerError'

  /infrastructure-assets/{id}/sbom:
    parameters:
      - $ref: '#/components/parameters/AssetId'
    post:
      operationId: uploadAssetSbom
      tags: [infrastructure-assets]
      summary: Upload a bill of materials against an asset
      description: >
        Ingests a CycloneDX (JSON 1.4–1.7) or SPDX (JSON 2.2, 2.3) document and
        writes its components into the tenant software catalogue
        (`software_products`) and this asset's installs (`software_installs`),
        with `source_kind: imported` — a document is a build system's claim, not
        something the platform measured.


        The FORMAT is detected from the document's own declaration
        (`bomFormat`/`specVersion`, `spdxVersion`), never from the filename or
        the Content-Type: both of those are supplied by whoever is uploading and
        neither is evidence.


        AN UPLOAD REPLACES THE IMPORTED SOFTWARE PICTURE FOR THIS ASSET. Installs
        that the new document does not list are marked `status: removed` — never
        deleted, so `first_seen_at` survives and a later document that lists them
        again makes them `active`. Measured installs are untouched. To combine two
        documents, merge them before uploading: there is no stable document
        lineage to scope the sweep by, because CycloneDX mints a fresh
        `serialNumber` on every export.


        Component-to-component `dependencies` are NOT stored. They are edges
        between components, and `asset_relationships` is an asset-to-asset table;
        there is no home for them in the data model today. They are counted in
        `dependency_edges_ignored` rather than silently dropped.


        A parse with warnings is a SUCCESS. `warnings` names everything skipped
        (cryptographic components, which belong to the CBOM path; SPDX files;
        unparseable identifiers), which is what makes "412 of your 480 components
        were ingested" a sentence the response can support.
      requestBody:
        required: true
        description: >
          Either a multipart form with a `file` part, or the raw document as the
          request body. Both are accepted because both are what people have: a
          browser posts a file input, a build pipeline posts
          `--data-binary @sbom.json`.
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: The CycloneDX or SPDX document itself.
      responses:
        '201':
          description: The document was ingested. The counts say what it did.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SbomIngestResult'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '403':
          $ref: '#/components/responses/LegacyForbidden'
        '404':
          $ref: '#/components/responses/LegacyNotFound'
        '413':
          description: 'The document exceeds the 32 MiB cap. It is REFUSED rather than truncated: a half-ingested bill of materials shows a software list that looks complete.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
        '422':
          description: 'The document was read and cannot be ingested — more components than the cap allows, or (on POST /sbom) a subject no asset can be created from. The message names the remedy.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
        '500':
          $ref: '#/components/responses/LegacyServerError'

  /sbom:
    post:
      operationId: uploadSbom
      tags: [infrastructure-assets]
      summary: Upload a bill of materials and create an asset from its subject
      description: >
        As POST /infrastructure-assets/{id}/sbom, except that the target asset
        comes from the document's own SUBJECT — CycloneDX `metadata.component`,
        or the package an SPDX `DESCRIBES` relationship names — resolved through
        the identification engine, so a second upload of the same artefact
        MATCHES the asset the first one created instead of minting another.


        The asset is identified by a declared `name` identifier whose value is
        the subject's software identity (purl, else CPE, else `name@version`),
        scoped by the class key. It carries no host: a document says what an
        artefact IS and nothing about where it runs, and inventing a parent would
        be a fabricated identity. The consequence is stated rather than hidden —
        an application created from a document and the same application later
        measured on a host are two assets until a person merges them.


        Only an `application` subject can become an asset. `name` appears in the
        identifier precedence of the application and service branches alone
        (standards/asset-classes.yaml), so any other class would get an
        identifier it is not allowed to identify by — the first upload would
        create the asset and every upload after it would open a merge proposal
        against the asset it already was. A `library` subject is refused as a
        category error, a `container` subject because the `container` class is a
        RUNNING container identified by agent, cloud resource id or hostname and
        an image bill of materials carries none of those. An absent or
        unrecognised type is treated as `application`. Every refusal is a 422
        naming the remedy.


        THE ASSET LANDS IN `pending_approval`, with `class_source_kind:
        declared` and a `class_source_ref` of `sbom:<upload id>`. Declared is not
        approved: an asset a person creates in the UI is approved because a human
        decided in front of the inventory, and an API upload is a file arriving at
        an endpoint. It appears in Discovery → Approvals labelled "declared from
        SBOM upload".
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: The CycloneDX or SPDX document itself.
      responses:
        '201':
          description: The document was ingested against a created or matched asset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SbomIngestResult'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '403':
          $ref: '#/components/responses/LegacyForbidden'
        '413':
          description: The document exceeds the 32 MiB cap.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
        '422':
          description: The document was read and its subject is not something an asset can be created from, or it exceeds the component cap. The message names the remedy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
        '500':
          $ref: '#/components/responses/LegacyServerError'

  /software/products:
    get:
      operationId: listSoftwareProducts
      tags: [infrastructure-assets]
      summary: The tenant software catalogue
      description: >
        Every `software_products` row for the tenant with how many assets carry
        it — the Inventory `software` lens.


        The catalogue is deduplicated on
        `coalesce(purl, cpe, name || '@' || coalesce(version, ''))`: a purl names
        an artefact, a CPE names a product line, and a name is what is left, so a
        product is keyed on the strongest identifier any document supplied.


        `install_count` and `asset_count` count ACTIVE installs only. A product
        whose every install was marked removed reports 0 and is still listed:
        "we used to run this" is a question the catalogue should be able to
        answer.
      parameters:
        - name: q
          in: query
          description: Case-insensitive substring over name, vendor, purl and CPE.
          schema: { type: string }
        - name: sort
          in: query
          description: >
            `eol_checked` orders by when the lifecycle catalogue was last
            consulted for the product, LEAST RECENTLY FIRST, with products no
            completed pass has ever recorded an answer for ahead of the rest.
            Never-checked sorts before long-ago-checked deliberately: both are
            "we do not know how current this is", and the one nobody has looked
            at is the more urgent of the two.
          schema:
            type: string
            enum: [name, version, vendor, installs, eol_checked]
            default: name
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: The tenant software catalogue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoftwareProductListResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '500':
          $ref: '#/components/responses/LegacyServerError'

  /infrastructure-assets/{id}/identifiers:
    parameters:
      - $ref: '#/components/parameters/AssetId'
    get:
      operationId: getAssetIdentifiers
      tags: [infrastructure-assets]
      summary: List an asset's identifiers
      description: >
        What the asset is known by, with the provenance and confidence of each
        (ADR-0002 D3), in the default precedence order so the strongest
        evidence reads first.
      responses:
        '200':
          description: The asset's identifiers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetIdentifierListResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '500':
          $ref: '#/components/responses/LegacyServerError'

  /asset-classes:
    get:
      operationId: listAssetClasses
      tags: [asset-classes]
      summary: The class taxonomy
      description: >
        The platform class hierarchy (ADR-0002 D2) plus this tenant's own leaf
        subclasses, parents always before children so a client can build the
        tree in one pass.


        The platform half comes from the GENERATED registry rather than the
        database, so the picker and the identification engine cannot answer
        differently about what a class is; `is_fixed` says which half a node
        came from.
      responses:
        '200':
          description: The taxonomy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetClassListResponse'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '500':
          $ref: '#/components/responses/LegacyServerError'

  /ask:
    post:
      operationId: askInventory
      tags: [ask]
      summary: Ask a question in words; get back a query you can edit and the rows it selected
      description: >
        The Query seam (ADR-0008 D1) on the tenant plane. A question becomes ONE
        line of the query language, that line is parsed and validated against the
        production catalogue BEFORE anything runs, the validated query selects
        rows under the caller's own tenant scope, and the rows are summarised
        with a `[row:<asset id>]` citation on every sentence.


        Read the response in order of authority: `query` first, then `rows`,
        then `text`. That order is the design (ADR-0006 D2 with ADR-0008 D4.4) -
        the thing between a question and its answer is a checkable artefact the
        user can edit and save as a view, so a client that renders nothing but
        `query` and `rows` has the whole answer and `text` is the convenience.


        `query` is the CANONICAL predicate that ran, not the string the model
        wrote: the platform AND-s its own default scope in (normally
        `status:monitoring`), so the two differ. It is what "Open in Inventory"
        deep-links to.


        ENTERPRISE. The route is mounted in every edition and a Core build
        answers 402 - the availability question is answered deployment-wide by
        `GET /api/v1/auth-service/tenant/ai`, and a 404 here would be
        indistinguishable from a broken route. A Core deployment searches the
        same inventory with the query language, the facet rail and saved views.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskRequest'
      responses:
        '200':
          description: The query that ran, the rows it selected, and a cited summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AskResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '402':
          $ref: '#/components/responses/EditionUnavailable'
        '403':
          description: >
            Four different things answer 403 here - a role without
            `assets.read`, a scope-narrowed API token, a missing CSRF token, a
            session that must change its password - and exactly ONE of them,
            "this organization has turned the AI assistant off in Settings ->
            AI assistant", is an availability answer a client should stop
            retrying. That one, and only that one, carries
            `reason: assistant_disabled` beside its `error`. Branch on the key,
            never on the sentence: the others are ordinary authorization
            failures whose wording is not a contract.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
        '422':
          description: >
            A provider answered and what it wrote did not validate, after the
            repair turn. The validator's diagnostics come back verbatim, in the
            same shape a hand-typed query's 400 uses - they are the one thing a
            reader can act on, and collapsing them into "no answer" would show
            them a shrug.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AskRefusal'
        '500':
          $ref: '#/components/responses/LegacyServerError'
        '503':
          description: >
            This build has the seam but no model provider is reachable.
            Deliberately not 402 - an operator can fix this one, and the two
            must not read the same.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'

  /saved-views:
    get:
      operationId: listSavedViews
      tags: [saved-views]
      summary: List the saved views visible to the caller
      description: >
        The caller's own views plus every view shared with the tenant. Filter
        to one collection with `target`.
      parameters:
        - { name: target, in: query, required: false, description: 'Collection filter — asset, endpoint, certificate, crypto_configuration, finding, software_install, relationship.', schema: { type: string } }
      responses:
        '200':
          description: The visible saved views.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedViewListResponse'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '500':
          $ref: '#/components/responses/LegacyServerError'
    post:
      operationId: createSavedView
      tags: [saved-views]
      summary: Save a named query
      description: >
        RBAC-gated `assets.update`. The query is VALIDATED here and stored in
        canonical form, so a view cannot be saved that fails when somebody
        opens it. An invalid query is 400 with the full diagnostic list.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavedViewInput'
      responses:
        '201':
          description: The created view.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedViewResponse'
        '400':
          description: The query does not validate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryError'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '409':
          description: The caller already has a view with that name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'

  /saved-views/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getSavedView
      tags: [saved-views]
      summary: Get one saved view
      responses:
        '200':
          description: The view.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedViewResponse'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '404':
          description: >
            No such view, or it belongs to somebody else and is not shared. One
            answer for both, so probing ids cannot tell them apart.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
    put:
      operationId: updateSavedView
      tags: [saved-views]
      summary: Update a saved view
      description: >
        RBAC-gated `assets.update`. Only the OWNER may edit: sharing is
        publishing, not handing over.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavedViewInput'
      responses:
        '200':
          description: The updated view.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedViewResponse'
        '400':
          description: The query does not validate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryError'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '404':
          description: No such view owned by the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
    delete:
      operationId: deleteSavedView
      tags: [saved-views]
      summary: Delete a saved view
      description: RBAC-gated `assets.update`. Only the owner may delete.
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '404':
          description: No such view owned by the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'

  /approvals/merge-proposals:
    get:
      operationId: listMergeProposals
      tags: [approvals]
      summary: The pending merge proposals
      description: >
        ADR-0002 D3's third outcome: identifiers that resolved to more than one
        asset. Each proposal carries the observation, the candidates it could
        be, and the identifiers that matched each one — the evidence, without
        which a proposal can only be rubber-stamped.


        Nothing is ever merged automatically. Even an `auto_accepted` proposal
        (a matcher scored the top candidate above the tenant's threshold) still
        leaves the remaining candidates for a human.
      parameters:
        - name: limit
          in: query
          required: false
          description: >
            Page size. Defaults to 50 and is CAPPED at 200; a value outside
            that range falls back to the default rather than erroring. The
            response echoes the limit actually applied.
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          required: false
          description: Rows to skip, for paging through `total`.
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: >
            One page of pending proposals, plus `total` — the number of pending
            proposals the page was cut from. A caller must read counts off
            `total`, never off the length of `merge_proposals`, which stops at
            the page size.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MergeProposalListResponse'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '500':
          $ref: '#/components/responses/LegacyServerError'

  /approvals/merge-proposals/auto-accepted:
    get:
      operationId: listAutoAcceptedMerges
      tags: [approvals]
      summary: Merges the matcher made without asking
      description: >
        What the learned matcher merged on the tenant's behalf in the last 30
        days, newest first, each with the score and the model's reasons.


        It is not a queue: nothing here needs deciding and everything here
        already happened. It exists because a tenant who sets
        `auto_accept_threshold` above zero has granted the platform permission
        to merge two of their assets unasked, and a capability that acts with no
        human in the loop has to be visible to a human afterwards.


        A tenant on the default threshold of zero always gets an empty list,
        because nothing can have been auto-accepted.
      parameters:
        - name: limit
          in: query
          required: false
          description: Page size. Defaults to 50, capped at 200.
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: The auto-accepted merges, and the window they were counted over.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoAcceptedMergeListResponse'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '500':
          $ref: '#/components/responses/LegacyServerError'

  /settings/identification:
    get:
      operationId: getIdentificationSettings
      tags: [settings]
      summary: The tenant's identification settings
      description: >
        Today, one setting: the learned matcher's auto-accept threshold. A
        tenant who has never set one gets 0 — never auto-accept — which is
        ADR-0002 D3's default and the behaviour every install has had until now.
      responses:
        '200':
          description: The settings, with the model that would do the scoring.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentificationSettingsResponse'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '500':
          $ref: '#/components/responses/LegacyServerError'
    put:
      operationId: updateIdentificationSettings
      tags: [settings]
      summary: Set the auto-accept threshold
      description: >
        Grants — or withdraws — the platform's permission to accept a merge
        proposal without asking. A value outside 0..1 is REFUSED rather than
        clamped: "we rounded your number" is not an acceptable answer on the one
        setting that decides whether two of a tenant's assets may be merged
        unasked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentificationSettingsUpdateRequest'
      responses:
        '200':
          description: The settings as saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentificationSettingsResponse'
        '400':
          description: The threshold is outside 0..1, or was not supplied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '500':
          $ref: '#/components/responses/LegacyServerError'

  /settings/drift:
    get:
      operationId: getDriftSettings
      tags: [settings]
      summary: The tenant's drift baseline window
      description: >
        How far back the drift producer's baseline reaches. Everything first
        observed inside the window is a candidate for a drift finding;
        everything older is the baseline it is compared against. A tenant who
        has never set one gets 30 days.
      responses:
        '200':
          description: The window, with the bounds it may be set between.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriftSettingsResponse'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '500':
          $ref: '#/components/responses/LegacyServerError'
    put:
      operationId: updateDriftSettings
      tags: [settings]
      summary: Set the drift baseline window
      description: >
        RBAC-gated `settings.update`. A value outside the bounds is REFUSED
        rather than clamped. The bounds are real limits: below a week, a
        fortnightly scan makes every scan look like drift because the previous
        sighting of the same thing has already left the baseline; beyond a year
        the baseline stops describing anything current.


        Changing the window changes which findings are open — something that
        aged out under 30 days is drift again under 90 — so the next pass
        recomputes the whole picture rather than migrating existing rows.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriftSettingsUpdateRequest'
      responses:
        '200':
          description: The window as saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriftSettingsResponse'
        '400':
          description: The window is outside its bounds, or was not supplied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '500':
          $ref: '#/components/responses/LegacyServerError'

  /approvals/merge-proposals/{id}/accept:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: acceptMergeProposal
      tags: [approvals]
      summary: Merge the proposal into a chosen survivor
      description: >
        RBAC-gated `assets.update`. `survivor_asset_id` is REQUIRED and must be
        one of the proposal's own candidates: merging is destructive, so the
        server never picks.


        Endpoints, identifiers, crypto configurations and history move to the
        survivor; the observation asset is ARCHIVED, not deleted, so a stale
        reference resolves to a tombstone pointing at the survivor rather than
        404ing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MergeProposalAcceptRequest'
      responses:
        '200':
          description: The resolved proposal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MergeProposalResponse'
        '400':
          description: The survivor is not a candidate of this proposal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '404':
          description: No such proposal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
        '409':
          description: >
            The proposal has already been decided, or the chosen survivor has
            since been archived (most often merged away by an earlier proposal).
            Merging into a tombstone would bury the observation behind a pointer
            to somewhere else.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'

  /approvals/merge-proposals/{id}/keep-separate:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: keepMergeProposalSeparate
      tags: [approvals]
      summary: Record that these are different things
      description: >
        RBAC-gated `assets.update`. Resolves the PROPOSAL and nothing else: the
        observation asset stays pending ordinary approval, because the reviewer
        answered "this is not that", not "this belongs in inventory".
      responses:
        '200':
          description: The resolved proposal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MergeProposalResponse'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '404':
          description: No such proposal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
        '409':
          description: The proposal has already been decided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'

  /infrastructure-assets/{id}/relationships:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listAssetRelationships
      tags: [relationships]
      summary: The asset's typed relationships, both directions
      description: >
        ADR-0003's edges. An edge is stored ONCE in its canonical direction and
        the reverse label is derived, never stored — so the same row reads
        `runs_on` from the from-asset and `runs` from the to-asset. `direction`
        and `label` on each item are therefore relative to the asset in the
        path, not properties of the row.


        An asset with no edges answers `[]` and 200, not 404: most of inventory
        is a leaf, and "nothing is attached to this" is a real answer.


        With no `status` filter, `rejected` edges are excluded — a rejection is
        a decision somebody recorded, and re-showing it would invite the same
        reviewer to reject it again on every visit. Ask for `status=rejected`
        explicitly to see them.
      parameters:
        - name: direction
          in: query
          required: false
          description: >
            `out` selects edges where this asset is the from end, `in` where it
            is the to end, `both` (the default) selects either.
          schema: { type: string, enum: [out, in, both], default: both }
        - name: type
          in: query
          required: false
          description: One of the ten relationship types (ADR-0003 D2).
          schema:
            type: string
            enum: [connects_to, contains, depends_on, hosted_on, impacts, manages, member_of, runs_on, sends_data_to, virtualized_by]
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [pending, active, rejected, stale] }
        - name: limit
          in: query
          required: false
          description: >
            Page size. Defaults to 50 and is capped at 200; a value outside that
            range falls back to the default rather than erroring.
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: >
            One page of edges plus `total`, the number the page was cut from.
            Read counts off `total`, never off the array's length.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelationshipListResponse'
        '400':
          description: An unknown direction, type or status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '500':
          $ref: '#/components/responses/LegacyServerError'
    post:
      operationId: createAssetRelationship
      tags: [relationships]
      summary: Declare a relationship
      description: >
        RBAC-gated `assets.update`. The edge enters with `source_kind:
        declared`, and is `active` immediately when BOTH ends are `monitoring` —
        ADR-0003 D3: "A user with `assets.update` asserting an edge is the same
        as editing an attribute." It enters `pending` when either end is still
        awaiting approval, and resolves with that asset.


        `direction` decides which end the asset in the path is. `out` (the
        default) makes it the from end; `in` makes it the to end, so a user can
        declare "that VM is hosted on this hypervisor" from the hypervisor's own
        page instead of navigating away to say the same thing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelationshipCreateRequest'
      responses:
        '201':
          description: The edge that was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelationshipResponse'
        '400':
          description: >
            An unknown type, a malformed peer id, or a self-edge — meaningless
            in all ten types and usually a sign one host was matched twice under
            two identifiers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '404':
          description: The peer names no asset of this tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
        '409':
          description: >
            The pair already carries an edge of this type. A pair may carry
            several types, but only one of each.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'

  /infrastructure-assets/{id}/relationships/{edgeId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: edgeId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: deleteAssetRelationship
      tags: [relationships]
      summary: Delete a declared relationship
      description: >
        RBAC-gated `assets.update`. Only `declared` provenance can be deleted.


        A measured edge is an OBSERVATION: deleting one asserts that a collector
        did not see what it says it saw, and the next run would re-create it —
        so the delete would appear to work and then silently undo itself. Those
        are retired by their collector ceasing to observe them (they go `stale`
        and are archived by the lifecycle policy), or rejected as a proposal.
      responses:
        '200':
          description: The edge was deleted.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [message]
                properties:
                  message: { type: string }
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '404':
          description: No such edge on this asset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
        '409':
          description: >
            The edge is not `declared`. The body's `detail` names the provenance
            it actually has.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'

  /infrastructure-assets/{id}/neighbourhood:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getAssetNeighbourhood
      tags: [relationships]
      summary: The asset's neighbourhood as nodes and edges
      description: >
        The graph shape the Relationships tab and the map (ADR-0006 D4) draw: a
        breadth-first walk to `depth` hops, returning the nodes reached and the
        edges BETWEEN those nodes. Each node carries its shortest depth from the
        root, so a node reachable by several routes is placed once, at the
        distance a person would say it is.


        Caps are a refusal to guess, not tuning. Past 500 nodes or 2000 edges
        the response sets `truncated: true` and still reports `total_nodes` /
        `total_edges` — the real sizes — so a caller can see how much it is NOT
        being shown. A map that quietly drops the node somebody was looking for
        is worse than one that says it could not draw everything.


        Active edges only by default. A pending edge is something nobody has
        agreed is true, and drawing it like the rest states it as fact.
      parameters:
        - name: depth
          in: query
          required: false
          description: >
            Hops from the root, 1 to 3. Out of range is REFUSED with 400 rather
            than clamped, at BOTH ends: a caller given three hops when it asked
            for five would draw a map missing two layers and present it as
            complete, and a caller given the default two when it asked for zero
            would be handed a graph it never asked for.
          schema: { type: integer, minimum: 1, maximum: 3, default: 2 }
        - name: include_pending
          in: query
          required: false
          description: Include `pending` edges and the nodes only they reach.
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: The neighbourhood graph.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NeighbourhoodResponse'
        '400':
          description: Depth out of range.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '500':
          $ref: '#/components/responses/LegacyServerError'

  /infrastructure-assets/{id}/impact:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getAssetImpact
      tags: [relationships]
      summary: What breaks if this asset changes
      description: >
        ADR-0003 D5's depth-capped closure, cycle-safe, over the NINE
        impact-bearing types. `connects_to` is the one exclusion: an observed
        flow is not a dependency, and it is by far the highest-volume measured
        type, so including it would make the closure of almost any node the
        whole tenant, which is the same as no answer.


        The vocabulary actually walked is echoed as `types`, because "what
        depends on this" over nine types and over ten are different questions
        and a consumer that cannot see which was asked will quote one as the
        other.


        DIRECTION IS PER TYPE (D5 as amended 2026-09-12), because the vocabulary
        is not uniformly oriented. Six types point from the dependent to the
        thing it rests on — `runs_on`, `hosted_on`, `virtualized_by`,
        `depends_on`, `member_of`, `sends_data_to` — and `downstream` follows
        those BACKWARDS: an application `runs_on` a server, so "what breaks if
        the SERVER dies" walks that edge from its to-end to its from-end. Two
        types point the other way — `contains` (network to subnet) and `manages`
        (controller to access point) — and `downstream` follows those FORWARDS.
        A single uniform reverse walk inverted them, so asking what breaks when
        a controller or a virtual network dies returned nothing. `upstream` is
        the exact mirror of whichever direction each type is walked in.


        `impacts` is walked too, as the LAST hop of a downstream answer: a user
        may declare that an asset impacts a business service, and that assertion
        belongs in the blast radius. It is crossed once and not continued
        through, because a business service is where the sentence ends.
        Upstream, the mirror of "last hop" is "first hop", so `upstream` from a
        business service reaches the assets that impact it and then carries on
        through what THEY rest on.


        Active edges only: a belief nobody has agreed to must not appear in a
        blast-radius answer somebody plans a change around. The root is excluded
        from its own closure, which also stops a cycle reporting it as a
        consequence of itself.
      parameters:
        - name: direction
          in: query
          required: false
          schema: { type: string, enum: [downstream, upstream], default: downstream }
        - name: depth
          in: query
          required: false
          description: >
            Hops, 1 to 10. Defaults to 6 (ADR-0003 D5). Out of range is refused
            with 400 at both ends rather than clamped.
          schema: { type: integer, minimum: 1, maximum: 10, default: 6 }
      responses:
        '200':
          description: The impact closure with a per-depth breakdown.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImpactResponse'
        '400':
          description: An unknown direction, or a depth out of range.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '500':
          $ref: '#/components/responses/LegacyServerError'

  /approvals/relationships:
    get:
      operationId: listRelationshipProposals
      tags: [approvals, relationships]
      summary: The pending relationship proposals
      description: >
        ADR-0006 D6's third row kind, on the same queue as merge proposals — "no
        second queue anywhere".


        The predicate is "pending, and BOTH ends are monitored", which is not
        the same as "pending". A pending edge with a pending END is not a
        relationship question: it is waiting on that asset's approval, and
        accepting the asset activates it. Listing it here would ask a reviewer
        the same question twice and let them answer it two ways. A pending edge
        whose ends are both monitored is stuck — nothing will ever promote it —
        and is either an `inferred` edge, which ADR-0003 D3 says enters as a
        proposal by design, or one that arrived pending from an import.


        Both ends are decorated, unlike the per-asset list: the reviewer is on
        Approvals with no asset page around them, and "something depends on
        something" is not a reviewable sentence.
      parameters:
        - name: status
          in: query
          required: false
          description: >
            Only `pending` is served. Decided relationships are on the asset's
            Relationships tab and in its History; answering 200 with pending
            rows for any other value would be the API agreeing to a question it
            did not answer.
          schema: { type: string, enum: [pending] }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: >
            One page of proposals plus `total` — the count to display. The array
            stops at the page size.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelationshipProposalListResponse'
        '400':
          description: A status other than `pending`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '500':
          $ref: '#/components/responses/LegacyServerError'

  /approvals/relationships/{edgeId}/accept:
    parameters:
      - { name: edgeId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: acceptRelationshipProposal
      tags: [approvals, relationships]
      summary: Accept a relationship proposal
      description: >
        RBAC-gated `assets.update`, the same permission approving an asset
        takes. The edge becomes `active`, `approved_by` and `approved_at` are
        stamped, and an `edge_accepted` entry is written to the FROM asset's
        history — the edge is stored once in the canonical direction, so that is
        the end the decision is unambiguously attributable to.


        BOTH ends must be `monitoring`. ADR-0003 D1: "an edge whose either
        endpoint is pending is itself pending", so accepting one against an
        unapproved asset would confirm a relationship to something nobody has
        admitted — which the impact closure would then walk. The proposal queue
        never lists such an edge, but the asset page's Relationships tab shows
        it from the pending asset's own side; that case answers 409 with the
        asset to approve named in `detail`.
      responses:
        '200':
          description: The decided edge.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelationshipResponse'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '404':
          description: No such relationship.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
        '409':
          description: >
            Either already decided — somebody else answered this proposal since
            the page was loaded — or an end of the relationship is still
            awaiting its own approval, in which case `detail` names the asset to
            approve.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'

  /approvals/relationships/{edgeId}/reject:
    parameters:
      - { name: edgeId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: rejectRelationshipProposal
      tags: [approvals, relationships]
      summary: Reject a relationship proposal
      description: >
        RBAC-gated `assets.update`. The edge becomes `rejected` and the ROW
        SURVIVES: a rejection is a decision somebody made, and deleting it would
        let the same inference be proposed again tomorrow with nothing recording
        that it was already answered. An `edge_rejected` entry is written to the
        from asset's history.


        Unlike accept, this does not require both ends to be approved. "This
        claim is wrong" is answerable whatever the endpoints are doing, and
        refusing it would leave the edge with no way out of the queue.
      responses:
        '200':
          description: The decided edge.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelationshipResponse'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '404':
          description: No such relationship.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
        '409':
          description: Already decided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'

  /approvals/classes:
    get:
      operationId: listClassProposals
      tags: [approvals]
      summary: The pending class proposals
      description: >
        ADR-0006 D6's fourth row kind, on the same queue as merge and
        relationship proposals — "no second queue anywhere".


        A class proposal is raised when the curated classification rules
        (ADR-0004 D6) argue a class for an asset that ALREADY has one, or when
        two rules contradict each other. It is never raised for a newly
        discovered asset: that asset is created WITH the rule-derived class,
        `class_source_kind: rule` and a `class_source_ref` naming the rule row,
        and it lands in `pending_approval` like any other discovery — approving
        the asset approves the class with it. Raising a proposal as well would
        ask one question twice and let a reviewer answer it two ways.


        A class whose `class_source_kind` is `declared` is never proposed
        against. A person said what that asset is, and a rule does not reopen it
        at any confidence.


        The rows are `asset_history` entries with `action = 'class_proposed'`,
        not a table of their own: the proposal, the decision and the class
        change it caused belong in one timeline.
      parameters:
        - name: status
          in: query
          required: false
          description: >
            Only `pending` is served. Decided class proposals are in the asset's
            History; answering 200 with pending rows for any other value would
            be the API agreeing to a question it did not answer.
          schema: { type: string, enum: [pending] }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: >
            One page of proposals plus `total` — the count to display. The array
            stops at the page size.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassProposalListResponse'
        '400':
          description: A status other than `pending`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '500':
          $ref: '#/components/responses/LegacyServerError'

  /approvals/classes/{id}/accept:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: acceptClassProposal
      tags: [approvals]
      summary: Accept a class proposal
      description: >
        RBAC-gated `assets.update`, the same permission approving an asset
        takes. The asset's `class_key` and `class_path` move to the accepted
        class, `class_source_kind` becomes `rule` and `class_source_ref` names
        the rule that argued it, and a `class_accepted` entry is written to the
        asset's history with the reviewer as actor.


        The RULE decided what the class is; a person decided to take it. The two
        are recorded separately on purpose — collapsing them would lose which
        rule to go and fix if the class turns out wrong.


        `class_key` in the body is REQUIRED when the proposal has no single
        proposed class (the rules conflicted and it offers a choice) and
        optional otherwise. When given it must be one the proposal offers:
        accepting an arbitrary class would let the approval path reclassify an
        asset as something no rule argued for, which is the fabricated fact the
        rule table exists to prevent arriving through a different door.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassProposalDecisionRequest'
      responses:
        '200':
          description: The decided proposal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassProposalResponse'
        '400':
          description: >
            No class was named for a proposal that offers a choice, or the named
            class is not one it offers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '404':
          description: No such class proposal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
        '409':
          description: >
            Already decided — somebody else answered this proposal since the
            page was loaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'

  /approvals/classes/{id}/reject:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: rejectClassProposal
      tags: [approvals]
      summary: Reject a class proposal
      description: >
        RBAC-gated `assets.update`. The asset is left exactly as it was and a
        `class_rejected` entry is written to its history.


        That entry is load-bearing rather than decorative: intake reads it before
        proposing the same class for the same asset again. Without it a printer
        that advertises `_ipp._tcp` on every coalescing window would refill the
        queue with a question already answered.
      responses:
        '200':
          description: The decided proposal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassProposalResponse'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '404':
          description: No such class proposal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
        '409':
          description: Already decided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'

  /discovery/auto-scan:
    get:
      operationId: getAutoScanPolicy
      tags:
      - discovery
      summary: The tenant's automatic active-scanning policy, and what it has been doing
      description: >
        Automatic active scanning probes a newly observed INTERNAL host as soon
        as it appears in the inventory, and probes every internal host again once
        the tenant's rescan interval has elapsed. Nobody presses a button.


        The response carries three things the Settings → Discovery → Active
        Scanning page needs: the policy, the bounds the server will accept for it
        (so the page validates against the server's numbers rather than its own
        copy of them), and a read-only summary of what the sweep has done —
        because a capability that acts unasked and reports nowhere is
        indistinguishable from a bug.


        Requires the `settings.read` permission.
      responses:
        '200':
          description: The policy, its bounds, and the sweep summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoScanResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '500':
          $ref: '#/components/responses/LegacyServerError'
    put:
      operationId: updateAutoScanPolicy
      tags:
      - discovery
      summary: Set the automatic active-scanning policy
      description: >
        Requires the `settings.update` permission: this decides whether the
        platform probes the tenant's own network without being asked.


        Every field is required. A partial update would be a trap here — the
        difference between "leave the ports alone" and "scan no ports" is one
        absent key, and the tenant would have no way to tell which they had
        asked for.


        Values outside the bounds are REFUSED rather than clamped, and the
        refusal names the bound that was broken. Protocols are restricted to
        `TLS` and `SSH`: the OT/ICS probes are gated by the `ot_active_probing`
        entitlement through a discovery job's separate field, and accepting one
        here would be a way to probe a PLC unattended, on a schedule, past that
        gate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutoScanUpdateRequest'
      responses:
        '200':
          description: The policy as saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoScanResponse'
        '400':
          description: A field is missing, or a value is outside its bounds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '403':
          $ref: '#/components/responses/LegacyForbidden'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /discovery/jobs:
    get:
      operationId: listDiscoveryJobs
      tags:
      - discovery
      summary: List the tenant's discovery jobs
      description: |
        The tenant's discovery jobs (Active Scans, the #1814 automatic-scan
        sweep, Discover wizard runs), newest first, with each job's executor
        and — for a job handed to a tenant sensor — its dispatch timeline.
        Proxied from cluster-sensor-service. This is what the unified
        Discovery → Discovery Jobs page merges with device-interrogation
        jobs (`GET /jobs` on device-interrogation-service).
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
      - name: page_size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
      - name: status
        in: query
        schema:
          type: string
      - name: kind
        in: query
        description: >-
          `automatic` (the #1814 sweep) or `manual` (Active Scan / Discover
          wizard / any operator-started run). Omit for both.
        schema:
          type: string
          enum: [automatic, manual]
      responses:
        '200':
          description: A page of discovery jobs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryJobsResponse'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '403':
          $ref: '#/components/responses/LegacyForbidden'
        '502':
          description: cluster-sensor-service could not be reached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
    post:
      operationId: createDiscoveryJob
      tags:
      - discovery
      summary: Start a discovery job (scan targets for crypto assets)
      description: |
        Queues an active-discovery job against the supplied targets (IPs, CIDRs,
        or hostnames) and forwards it to cluster-sensor-service for execution.
        `targets` is required (1–1000 entries). Gated by the `discovery.create`
        permission. Returns 202 with the created job (`{ "job": {...} }`); poll
        `GET /discovery/jobs/{id}` for status and `GET /discovery/jobs/{id}/results`
        for findings and their materialization split. Findings flow into
        inventory server-side; there is nothing for the client to import.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDiscoveryJobRequest'
      responses:
        '202':
          description: The created discovery job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryJobResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /discovery/jobs/{id}:
    get:
      operationId: getDiscoveryJob
      tags:
      - discovery
      summary: Get a discovery job's status
      description: |
        Proxies the job record from cluster-sensor-service. The shape is
        forwarded verbatim, so additional fields beyond those documented here
        may be present.
      parameters:
      - name: id
        in: path
        required: true
        description: Discovery job UUID.
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The discovery job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryJob'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '404':
          $ref: '#/components/responses/LegacyNotFound'
        '502':
          description: cluster-sensor-service unreachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
  /discovery/jobs/{id}/rerun:
    post:
      operationId: rerunDiscoveryJob
      tags:
      - discovery
      summary: Re-run a discovery job
      description: |
        Re-queues the job with the same targets/options. Gated by the
        `discovery.create` permission.
      parameters:
      - name: id
        in: path
        required: true
        description: Discovery job UUID.
        schema:
          type: string
          format: uuid
      responses:
        '202':
          description: Re-run initiated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryMessageResponse'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
  /discovery/jobs/{id}/results:
    get:
      operationId: getDiscoveryJobResults
      tags:
      - discovery
      summary: Get a discovery job's findings
      description: |
        Proxies the job's findings from cluster-sensor-service. The shape is
        forwarded verbatim (`{ "findings": [...] }` plus any extra fields the
        upstream service includes), so treat unknown fields as additive.
      parameters:
      - name: id
        in: path
        required: true
        description: Discovery job UUID.
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The job's findings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryJobResults'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '404':
          $ref: '#/components/responses/LegacyNotFound'
        '502':
          description: cluster-sensor-service unreachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
  /discovery/jobs/{id}/cancel:
    post:
      operationId: cancelDiscoveryJob
      tags:
      - discovery
      summary: Cancel a discovery job
      description: |
        Marks the job cancelled. Gated by the `discovery.update` permission.
      parameters:
      - name: id
        in: path
        required: true
        description: Discovery job UUID.
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Job cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryMessageResponse'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
components:
  parameters:
    AssetId:
      name: id
      in: path
      required: true
      description: Asset UUID.
      schema:
        type: string
        format: uuid
    ExternalConnectionId:
      name: id
      in: path
      required: true
      description: External connection UUID.
      schema:
        type: string
        format: uuid
    CertificateId:
      name: id
      in: path
      required: true
      description: Certificate UUID.
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      required: false
      description: 1-based page number (default 1).
      schema:
        type: integer
        minimum: 1
    PageSize:
      name: page_size
      in: query
      required: false
      description: Page size (default 20, max 100).
      schema:
        type: integer
        minimum: 1
        maximum: 100
    Search:
      name: search
      in: query
      required: false
      description: Free-text search across asset fields.
      schema:
        type: string
    CryptoConfigurationId:
      name: id
      in: path
      required: true
      description: Crypto configuration UUID (`crypto_implementations.id` in storage).
      schema:
        type: string
        format: uuid
  responses:
    EditionUnavailable:
      description: |
        The capability is not in this build or this subscription. A Core build
        answers this from a stub at the same path, and an Enterprise build
        answers it from RequireFeature — so a client handles both with one
        branch instead of telling 404-the-route-is-absent apart from
        402-you-have-not-bought-it.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyError'
    LegacyBadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyError'
    LegacyUnauthorized:
      description: Missing or invalid tenant/auth context.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyError'
    LegacyNotFound:
      description: Asset not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyError'
    LegacyForbidden:
      description: 'Caller lacks the required permission. The body carries the standard `error` string plus a `required_permission` hint (LegacyError permits the extra key).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyError'
    LegacyConflict:
      description: The resource already exists (e.g. duplicate algorithm code).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyError'
    LegacyServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyError'
  schemas:
