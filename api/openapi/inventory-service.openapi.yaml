  /certificates:
    get:
      operationId: listCertificates
      tags:
      - certificates
      summary: List certificates for the current tenant
      description: 'Returns a paginated page of the tenant''s X.509 certificates. Filters accepted as query params (expiring window, key-size min, algorithm, issuer DN substring, self-signed flag, search, cert_id). Pagination uses the legacy `page` / `page_size` shape.

