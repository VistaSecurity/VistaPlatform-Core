        schema:
          type: array
          items:
            type: string
      - name: hash_algorithm
        in: query
        required: false
        description: Hash algorithm filter (repeatable).
        schema:
          type: array
          items:
            type: string
      - name: risk_level
        in: query
        required: false
        description: Risk-level filter (repeatable, e.g. `High`, `Medium`).
