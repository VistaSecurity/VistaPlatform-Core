        recommended_alternatives:
          type: array
          items:
            type: string
        migration_guidance:
          type: string
        remediation_guidance:
          type: object
          additionalProperties: true
        compliance_mappings:
          type:
          - object
          - 'null'
          additionalProperties: true
        metadata:
          type:
          - object
          - 'null'
          additionalProperties: true
        is_standard:
          type: boolean
        is_pqc:
          type: boolean
        pqc_standardization_status:
          type: string
        created_at:
          type: string
        updated_at:
          type: string
        algorithm_family:
          type: string
        primitive:
          type: string
        mode:
          type: string
        padding:
          type: string
        oid:
          type: string
        crypto_functions:
          type: array
          items:
            type: string
        classical_security_level:
          type: integer
        nist_quantum_security_level:
          type: integer
        parameter_set_identifier:
          type: string
        curve:
          type: string
    AlgorithmListResponse:
