    RecentAssetsCountResponse:
      type: object
      additionalProperties: false
      description: 'Result of GET /infrastructure-assets/recent-count — `{ count, days }` plus an optional `filters_applied` summary (present only when filter query params were supplied).'
      required: [count, days]
      properties:
        count:
          type: integer
        days:
          type: integer
        filters_applied:
          type: object
          additionalProperties: true

    # ============================================================
    # Asset reads: search / facets / stats / history / crypto-detail
    # ============================================================
    AssetSearchResponse:
      type: object
      additionalProperties: false
      description: 'Envelope for GET /infrastructure-assets/search — `{ query, assets, total, showing }`.'
      required: [query, assets, total, showing]
      properties:
        query:
          type: string
        assets:
          type: [array, "null"]
          items:
            $ref: '#/components/schemas/Asset'
        total:
          type: integer
        showing:
          type: integer
    AskRequest:
      type: object
      additionalProperties: false
      description: >
        One question, and nothing else. No filters, no scope, no row limit:
        anything a caller could add here is something the query language already
        says, and a second way of saying it is how a client learns the wrong one
        (the same reasoning that deleted the per-field filter arguments from the
        MCP tools, ADR-0007 D2.4).
      required: [question]
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 4096
          description: >
            A question about this tenant's inventory, in words. Longer than the
            cap is REFUSED with a 400 naming it, rather than truncated - half a
            question translated confidently is worse than no answer, because
            nothing downstream can tell it was half. The length is measured
            after trimming surrounding whitespace, and a blank question is the
            same 400.
    AskResponse:
      type: object
      additionalProperties: false
      required: [query, rows, text, citations, tools, provenance]
      properties:
        query:
          type: string
          description: >
            The canonical predicate that ACTUALLY ran, including the default
            scope the platform AND-ed in. Show this, not the question. It is
            valid query-language text, so it can be pasted into the query editor,
            saved as a view, or put in an `/inventory?query=` link unchanged.
            Empty only when the tool result could not be read, which a client
            renders as "a summary with no evidence" rather than as an empty
            inventory.
        rows:
          type: array
          description: >
            The assets the query selected, in the list endpoint's own row shape,
            so a client renders them with the code it already has. The rows are
            the answer; the prose is a reading of them.
          items:
            $ref: '#/components/schemas/Asset'
        text:
          type: string
          description: >
            The summary, with `[row:<asset id>]` markers left IN. They are the
            checkable part - a sentence stripped of its citation is a sentence
            nobody can audit - and a client resolves each marker against `rows`
            to link it. Every sentence that did not cite a returned row was
            dropped before this was written, so a short summary over many rows is
            a real outcome, not a truncation. When nothing matched, this is a
            fixed sentence the platform writes itself rather than a model's
            description of an absence it was not shown.
        citations:
          type: array
          description: >
            Derived FROM `text` rather than accumulated beside it, so the prose
            cannot cite a row the list omits or list one it never mentions.
          items:
            $ref: '#/components/schemas/AskCitation'
        tools:
          type: array
          description: >
            Every read the answer was composed from, in order. The first is
            always the asset query; the rest are follow-ups the model asked for
            from a fixed allowlist. Results are not echoed - the rows are the
            evidence and they are already here in full.
          items:
            $ref: '#/components/schemas/AskToolCall'
        provenance:
          $ref: '#/components/schemas/AskProvenance'
    AskCitation:
      type: object
      additionalProperties: false
      required: [kind, ref]
      properties:
        kind:
          type: string
          description: Always `row` here; the ref names a row in `rows`.
        ref:
          type: string
          description: The asset id the citing sentence rests on.
        text:
          type: string
          description: >
            Absent for row citations: the caller already holds the row. Present
            only where a citation points into something the caller supplied.
    AskToolCall:
      type: object
      additionalProperties: false
      required: [tool]
      properties:
        tool:
          type: string
          description: >
            The tool name, spelled as the MCP server declares it -
            `vistaplatform_query_assets`, `vistaplatform_get_asset`,
            `vistaplatform_list_asset_classes`, `vistaplatform_asset_facets`.
        args:
          type: object
          additionalProperties: true
          description: >
            The arguments it ran with, AFTER the seam's per-tool allowlist. A
            dropped argument is reported under `_dropped_arguments` rather than
            removed silently, because a dropped argument changes what the result
            means.
    AskProvenance:
      type: object
      additionalProperties: false
      description: >
        ADR-0008 D4.1 on the wire: a generated answer says so, and says what
        produced it. `confidence` is 0 by design - we do not ask a model to score
        itself and it has no calibrated way to answer if we did, so any number
        here would be invented. The citations are the evidence instead.
      required: [source_kind, source_ref, confidence]
      properties:
        source_kind:
          type: string
          description: Always `inferred`. A seam cannot produce a measured fact.
        source_ref:
          type: string
          description: Names the producer, e.g. `query:model`.
        confidence:
          type: number
        model_id:
          type: string
          description: >
            What produced the answer. Never empty on a 200 - an answer that could
            not be attributed is refused rather than returned unattributed.
    AskRefusal:
      type: object
      additionalProperties: false
      description: >
        A provider answered and what it wrote did not validate. Deliberately NOT
        the same shape as "no model available": a provider DID answer, twice, and
        the validator said exactly why.
      required: [error, errors, attempts]
      properties:
        error:
          type: string
        query:
          type: string
          description: >
            The model's last attempt, absent when it produced none. NOT the
            canonical query - it never reached the formatter - so treat it as a
            starting point for the editor rather than as something that ran.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/QueryDiagnostic'
        attempts:
          type: integer
          description: >
            Translation turns spent, so "failed twice" is distinguishable from
            "refused before asking".
    QueryError:
      type: object
      additionalProperties: false
      description: >
        The structured diagnostics of QUERY_LANGUAGE.md §10, returned with 400
        whenever a query does not parse or validate.


        One entry PER problem, each with a byte span into the submitted text, so
        an editor can underline the offending characters rather than saying
        "invalid query". The caller is a person with a caret in a text box;
        flattening these into one string is what "invalid query" looks like from
        the inside.
      required: [error, query, errors]
      properties:
        error:
          type: string
        query:
          type: string
          description: The text the spans index into, echoed back.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/QueryDiagnostic'
    QueryDiagnostic:
      type: object
      additionalProperties: false
      required: [code, message, span]
      properties:
        code:
          type: string
          description: >
            Stable, machine-readable: syntax_error, unknown_field,
            operator_not_allowed, type_mismatch, unknown_value, depth_exceeded,
            regex_invalid, query_too_long, too_many_clauses, untranslatable.
        message:
          type: string
        span:
          type: object
          additionalProperties: false
          description: >
            Offsets into the submitted query text, in UTF-8 BYTES — not
            characters and not UTF-16 code units. A query containing any
            non-ASCII character (an IDN hostname, a tag value in another script)
            therefore has spans that do NOT index a JavaScript string directly:
            decode the query to bytes, slice, and decode back, or convert the
            offsets once before rendering a caret.
          required: [start, end]
          properties:
            start: { type: integer }
            end: { type: integer }
        suggestion:
          type: string
          description: The fix, when there is an obvious one ("did you mean hostname?").
    AssetEndpointListResponse:
      type: object
      additionalProperties: false
      description: 'Envelope for GET /infrastructure-assets/{id}/endpoints — `{ "endpoints": [...] }`. An empty array is a real answer.'
      required: [endpoints]
      properties:
        endpoints:
          type: array
          items:
            $ref: '#/components/schemas/AssetEndpoint'
    AssetIdentifierListResponse:
      type: object
      additionalProperties: false
      description: 'Envelope for GET /infrastructure-assets/{id}/identifiers — `{ "identifiers": [...] }`.'
      required: [identifiers]
      properties:
        identifiers:
          type: array
          items:
            $ref: '#/components/schemas/AssetIdentifier'
    AssetClass:
      type: object
      additionalProperties: false
      description: One node of the class taxonomy (ADR-0002 D2).
      required: [key, path, label, identifier_precedence, is_fixed]
      properties:
        key:
          type: string
        parent:
          type: string
          description: Empty for a top-level class.
        path:
          type: string
          description: >
            The materialised dot-separated ancestry ending in `key`. This is
            what `class:` matches a prefix of, so it is the value a facet bucket
            carries.
        label:
          type: string
        description:
          type: string
        icon:
          type: string
        cmdb_ci_type:
          type: string
        cyclonedx_type:
          type: string
        identifier_precedence:
          type: array
          items: { type: string }
          description: >
            The ordered identifier kinds the identification engine may match
            this class on. EMPTY means the class has no independent identity and
            is matched by dependent identity instead — not that anything goes.
        attribute_schema:
          type: object
          additionalProperties: true
          description: JSON Schema for the class's `attributes` object.
        is_fixed:
          type: boolean
          description: >
            True for a platform class (from the generated registry, not
            editable), false for a tenant leaf subclass.
    AssetClassListResponse:
      type: object
      additionalProperties: false
      description: 'Envelope for GET /asset-classes — `{ "classes": [...] }`, parents before children.'
      required: [classes]
      properties:
        classes:
          type: array
          items:
            $ref: '#/components/schemas/AssetClass'
    SavedView:
      type: object
      additionalProperties: false
      description: A named query string (ADR-0006 D2).
      required: [id, tenant_id, name, target, query, owner_user_id, is_shared, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        target:
          type: string
          description: The collection the query is a predicate over, carried out of band.
        query:
          type: string
          description: The query in CANONICAL form — two spellings of one predicate would be two rows a diff cannot match.
        owner_user_id: { type: string, format: uuid }
        owner_name:
          type: string
          description: >
            Who to credit in the list — the owner's name, or their email when
            they have no name. Empty when the user row is gone; a shared view
            still lists, without a fabricated owner. The one question a person
            asks about a shared view they did not make is whose it is.
        is_shared:
          type: boolean
          description: >
            Visible to the whole tenant, and still editable only by its owner.


            A shared view's name is unique tenant-wide (case-insensitively): it
            is a name everyone reads off one list, and two "Production"s from
            two owners are indistinguishable there. A PRIVATE view's name is
            unique only to its owner — two people may each keep one called
            "Mine".
        created_at: { type: string }
        updated_at: { type: string }
    SavedViewInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        description: { type: [string, "null"] }
        target:
          type: string
          description: Defaults to `asset`. The table-less targets (`observation`, `measurement`) are refused — they name no rows a view could open.
        query:
          type: string
          description: Empty matches everything the tenant may see.
        is_shared: { type: [boolean, "null"] }
    SavedViewResponse:
      type: object
      additionalProperties: false
      required: [saved_view]
      properties:
        saved_view:
          $ref: '#/components/schemas/SavedView'
    SavedViewListResponse:
      type: object
      additionalProperties: false
      required: [saved_views]
      properties:
        saved_views:
          type: array
          items:
            $ref: '#/components/schemas/SavedView'
    MergeCandidate:
      type: object
      additionalProperties: false
      description: One asset a proposal could merge into, with the evidence for it.
      required: [asset_id, deleted, matched_identifiers, score]
      properties:
        asset_id: { type: string, format: uuid }
        display_name: { type: string }
        hostname: { type: [string, "null"] }
        class_key: { type: string }
        class_label: { type: string }
        asset_status: { type: string }
        deleted:
          type: boolean
          description: >
            The candidate can no longer be merged into — soft-deleted, or merged
            away by an earlier proposal. Shown rather than dropped: a proposal
            that silently loses a candidate reads as if it only ever had one.
        matched_identifiers:
          type: array
          items:
            type: object
            additionalProperties: true
          description: The observation's identifiers that resolved to this asset.
        score:
          type: number
          description: The matcher's score, 0..1. ZERO means unscored, not "certainly wrong".
        reason: { type: string }
        explanation:
          type: array
          description: >
            The score's working — the signals that moved it, largest absolute
            contribution first. Absent when the candidate is unscored, or when
            the configured matcher cannot explain itself.


            A factor names a COMPARISON, never a value: "a one-per-asset
            identifier matches" is the evidence, and the identifier itself is on
            `matched_identifiers`, where the reviewer is already looking at it.
          items:
            $ref: '#/components/schemas/MergeScoreFactor'
    MergeScoreFactor:
      type: object
      additionalProperties: false
      description: One signal behind a candidate's score.
      required: [feature, label, value, weight, contribution]
      properties:
        feature:
          type: string
          description: The matcher's stable name for the signal.
        label:
          type: string
          description: The phrase to show a reviewer.
        value:
          type: number
          description: What was measured, 0..1.
        weight:
          type: number
          description: The model's signed weight for the signal.
        contribution:
          type: number
          description: >
            value x weight — how much this signal moved THIS score, which is not
            how much the model cares about the signal in general. A large weight
            on a signal that measured zero contributed nothing.
    MergeProposal:
      type: object
      additionalProperties: false
      required: [id, tenant_id, status, source, proposed_at, candidates]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        status:
          type: string
          enum: [pending, merged, kept_separate]
        reason: { type: string }
        source: { type: string }
        source_kind: { type: string }
        proposed_at: { type: string, format: date-time }
        observation_asset_id: { type: string, format: uuid }
        observation:
          $ref: '#/components/schemas/MergeCandidate'
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/MergeCandidate'
        auto_accepted:
          type: boolean
          description: >
            A matcher scored the top candidate above the tenant's threshold and
            the engine wrote the observation into it. The proposal is still
            opened — the remaining candidates are still a human's decision.
        accepted_asset_id: { type: string, format: uuid }
        accepted_score: { type: number }
        accepted_model_id: { type: string }
        accepted_source_ref: { type: string }
        model_id:
          type: string
          description: >
            The matcher that RANKED the candidates, whether or not it accepted
            anything. Absent when nothing scored them. Distinct from
            `accepted_model_id`, which records the matcher behind an auto-accept
            specifically: "a model ordered these for you" and "a model decided
            this" are different claims.
        source_ref:
          type: string
          description: The seam and implementation that produced the scores.
        resolved_at:
          type: string
          format: date-time
          description: >
            When a person decided the proposal. Absent while it is pending —
            including on an auto-accepted proposal whose remaining candidates
            nobody has settled yet.
        resolved_by:
          type: string
          format: uuid
          description: The user who decided it.
    AutoAcceptedMergeListResponse:
      type: object
      additionalProperties: false
      required: [merges, window_days]
      properties:
        merges:
          type: array
          items:
            $ref: '#/components/schemas/MergeProposal'
        window_days:
          type: integer
          description: >
            How many days back the list covers, echoed so the heading and the
            query cannot disagree.
    IdentificationSettings:
      type: object
      additionalProperties: false
      required: [auto_accept_threshold]
      properties:
        auto_accept_threshold:
          type: number
          minimum: 0
          maximum: 1
          description: >
            The matcher score at or above which the platform may accept a merge
            proposal on the tenant's behalf. ZERO — the default — means NEVER,
            and is not a low bar: no score bypasses it.


            Auto-accepted merges are not reversible from the UI today, and a
            singleton identifier that disagrees (serial, cloud id, agent id,
            CMDB sys_id) is never auto-accepted whatever the score.
        matcher_model_id:
          type: string
          description: >
            The model that does the scoring. Absent when no matcher is
            configured, in which case nothing is ever scored and the threshold
            cannot fire whatever it is set to.
        version:
          type: integer
          description: The settings row's version after a write.
    IdentificationSettingsResponse:
      type: object
      additionalProperties: false
      required: [identification]
      properties:
        identification:
          $ref: '#/components/schemas/IdentificationSettings'
    IdentificationSettingsUpdateRequest:
      type: object
      additionalProperties: false
      required: [auto_accept_threshold]
      properties:
        auto_accept_threshold:
          type: number
          minimum: 0
          maximum: 1
    DriftSettings:
      type: object
      additionalProperties: false
      required: [baseline_days, min_days, max_days]
      properties:
        baseline_days:
          type: integer
          description: >
            How many days of history the drift baseline covers. Read fresh on
            every pass, so a change takes effect on the next one.
        min_days:
          type: integer
          description: The smallest window the server accepts.
        max_days:
          type: integer
          description: The largest window the server accepts.
    DriftSettingsResponse:
      type: object
      additionalProperties: false
      required: [drift]
      properties:
        drift:
          $ref: '#/components/schemas/DriftSettings'
    DriftSettingsUpdateRequest:
      type: object
      additionalProperties: false
      required: [baseline_days]
      properties:
        baseline_days:
          type: integer
          minimum: 7
          maximum: 365
    MergeProposalListResponse:
      type: object
      additionalProperties: false
      required: [merge_proposals, total, limit, offset]
      properties:
        merge_proposals:
          type: array
          items:
            $ref: '#/components/schemas/MergeProposal'
        total:
          type: integer
          description: >
            How many pending merge proposals this tenant has in total, counted
            over the same predicate in the same transaction as the page. This
            is the count to display; `merge_proposals.length` is the page.
        limit:
          type: integer
          description: The page size actually applied (the request's, clamped).
        offset:
          type: integer
          description: The offset actually applied.
    MergeProposalResponse:
      type: object
      additionalProperties: false
      required: [merge_proposal]
      properties:
        merge_proposal:
          $ref: '#/components/schemas/MergeProposal'
    MergeProposalAcceptRequest:
      type: object
      additionalProperties: false
      required: [survivor_asset_id]
      properties:
        survivor_asset_id:
          type: string
          format: uuid
          description: Must be one of the proposal's candidates.
    RelationshipPeer:
      type: object
      additionalProperties: false
      description: >
        One end of an edge, decorated enough to render a row and follow a link
        without a second read.
      required: [asset_id, deleted]
      properties:
        asset_id: { type: string, format: uuid }
        display_name:
          type: string
          description: >
            The asset's display name, falling back to its hostname. A peer
            rendered as a bare uuid is a peer nobody can decide anything about.
        class_key: { type: string }
        asset_status: { type: string }
        primary_identifier:
          type: string
          description: >
            The strongest identifier the peer carries, as `kind:value` — what a
            reviewer recognises when `display_name` is empty, which it is for
            most freshly discovered assets.
        risk_score: { type: integer }
        deleted:
          type: boolean
          description: >
            The peer was soft-deleted or merged away. Reported rather than
            dropped: an edge whose peer silently vanishes reads as a corrupt
            row, and "that thing is gone" is the actual answer.
    Relationship:
      type: object
      additionalProperties: false
      description: One typed, directional edge (ADR-0003 D1).
      required:
        - id
        - tenant_id
        - from_asset_id
        - to_asset_id
        - type
        - source_kind
        - confidence
        - status
        - first_seen_at
        - last_seen_at
        - observation_count
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        from_asset_id: { type: string, format: uuid }
        to_asset_id: { type: string, format: uuid }
        type:
          type: string
          enum: [connects_to, contains, depends_on, hosted_on, impacts, manages, member_of, runs_on, sends_data_to, virtualized_by]
        direction:
          type: string
          enum: [out, in]
          description: >
            Relative to the asset the read was about — `out` when that asset is
            the from end. NOT a property of the row: the same row is `out` from
            one side and `in` from the other. Absent on the neighbourhood's
            edges, where no end is privileged.
        label:
          type: string
          description: >
            How the edge reads from the asset's own side: the type itself
            outbound, the vocabulary's reverse label inbound (`runs_on` /
            `runs`). Derived from the type, never stored.
        source_kind:
          type: string
          enum: [measured, declared, imported, inferred]
          description: >
            Provenance, and what decides trust (ADR-0003 D3). `inferred` is the
            one that always needs a human.
        source_ref:
          type: string
          description: The producer — `sensor:<id>`, `user:<id>`, `cloud:<integration>`, `matcher`.
        confidence: { type: number }
        status:
          type: string
          enum: [pending, active, rejected, stale]
        attributes:
          type: object
          additionalProperties: true
          description: >
            Type-specific detail: protocol and ports for `connects_to`, the
            local and remote port names for an LLDP `member_of`, the process or
            container id for `runs_on`.
        first_seen_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        observation_count: { type: integer }
        created_by: { type: string, format: uuid }
        approved_by: { type: string, format: uuid }
        approved_at: { type: string, format: date-time }
        peer:
          $ref: '#/components/schemas/RelationshipPeer'
        from:
          $ref: '#/components/schemas/RelationshipPeer'
        to:
          $ref: '#/components/schemas/RelationshipPeer'
    RelationshipListResponse:
      type: object
      additionalProperties: false
      required: [relationships, total, limit, offset]
      properties:
        relationships:
          type: array
          items:
            $ref: '#/components/schemas/Relationship'
        total:
          type: integer
          description: >
            Every edge matching the filter, counted over the same predicate in
            the same transaction as the page. This is the count to display;
            `relationships.length` is the page.
        limit: { type: integer }
        offset: { type: integer }
    RelationshipResponse:
      type: object
      additionalProperties: false
      required: [relationship]
      properties:
        relationship:
          $ref: '#/components/schemas/Relationship'
    RelationshipProposalListResponse:
      type: object
      additionalProperties: false
      required: [relationship_proposals, total, limit, offset]
      properties:
        relationship_proposals:
          type: array
          items:
            $ref: '#/components/schemas/Relationship'
        total:
          type: integer
          description: Every pending proposal in the tenant, not the page length.
        limit: { type: integer }
        offset: { type: integer }
    ClassProposalListResponse:
      type: object
      additionalProperties: false
      required: [class_proposals, total, limit, offset]
      properties:
        class_proposals:
          type: array
          items:
            $ref: '#/components/schemas/ClassProposal'
        total:
          type: integer
          description: Every pending proposal in the tenant, not the page length.
        limit: { type: integer }
        offset: { type: integer }
    ClassProposalResponse:
      type: object
      additionalProperties: false
      required: [class_proposal]
      properties:
        class_proposal:
          $ref: '#/components/schemas/ClassProposal'
    ClassProposalDecisionRequest:
      type: object
      additionalProperties: false
      properties:
        class_key:
          type: string
          description: >
            Which class to take. Required when the proposal has no single
            proposed class — the rules conflicted — and optional otherwise. Must
            be one the proposal offers.
    ClassProposal:
      type: object
      additionalProperties: false
      required: [id, tenant_id, asset_id, status, source, proposed_class_key, proposed_at]
      description: >
        One class the curated rules argued for an asset that already has a
        different one, with the whole argument attached.
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        asset_id: { type: string, format: uuid }
        status:
          type: string
          enum: [pending, accepted, rejected]
        source:
          type: string
          description: What raised it. `classifier:rules` for the rule engine.
        proposed_class_key:
          type: string
          description: >
            The class the rules decided, or EMPTY when they contradicted each
            other. Empty is a complete answer, not a missing value: it means the
            reviewer is being shown a disagreement and asked to settle it, and
            `conflicting_classes` names the candidates.
        proposed_class_label: { type: string }
        current_class_key:
          type: string
          description: What the asset is classed as now. A proposal is a comparison.
        current_class_label: { type: string }
        current_class_source_kind:
          type: string
          enum: [measured, declared, imported, inferred, rule]
          description: >
            How the CURRENT class was decided. `rule` is the fifth value and it
            is not a synonym for any of the other four — a class argued from a
            curated rule is not measured (the MAC was; the mapping was not) and
            not inferred (that is a model's proposal).
        conflicting_classes:
          type: array
          description: >
            The classes that tied. Two rules disagreeing about one device is a
            curation bug, and this is what names it so it can be fixed rather
            than guessed at.
          items:
            $ref: '#/components/schemas/ClassOption'
        matched_rules:
          type: array
          description: >
            The argument: every rule that matched, highest confidence first, as
            it stood when the proposal was raised. A proposal a reviewer cannot
            audit is one they can only rubber-stamp.
          items:
            $ref: '#/components/schemas/ClassificationRuleRef'
        rule_ids:
          type: array
          items: { type: string }
        confidence:
          type: number
          description: >
            What the proposal asserts. For a rule-derived class that is the
            winning rule's own 0.50–0.95 assertion; for a model-derived one it
            is `model_probability`. Absent for a conflict the rules could not
            settle.
        proposed_class_source_kind:
          type: string
          enum: [measured, declared, imported, inferred, rule]
          description: >
            The provenance ACCEPTING this proposal will stamp onto the asset.
            `rule` for a class the curated table argued; `inferred` for one the
            learned classifier proposed. The two are not interchangeable —
            ADR-0008 D4.2 defines `inferred` as "something a model proposed" —
            and this is the field that says which kind of claim the row is.
            Absent on rows raised before the learned classifier shipped, which
            are all rule-derived.
        model_id:
          type: string
          description: >
            The weights that proposed this class, when a MODEL did — the
            learned classifier speaks only where the rules decided nothing or
            decided two. Empty for a rule-derived proposal.
        model_probability:
          type: number
          description: >
            The model's calibrated probability for the proposed class, 0–1. A
            proposal is only raised at or above the model's floor (0.80);
            below it nothing is proposed and the asset stays `unknown_host`.
        model_reasons:
          type: array
          description: >
            The model's argument: its top feature contributions, largest first.
            Each names a FEATURE and the evidence that set it — a vendor, an
            open port, a banner token, an advertised service. Never a hostname
            or an address: the classifier's whole input carries neither.
          items:
            $ref: '#/components/schemas/ClassModelReason'
        proposed_at: { type: string, format: date-time }
        asset_display_name: { type: string }
        asset_hostname: { type: string }
        asset_primary_address: { type: string }
        asset_status: { type: string }
        accepted_class_key:
          type: string
          description: >
            Which class a reviewer took, which is not always
            `proposed_class_key`: a conflict proposal offers a choice.
    ClassOption:
      type: object
      additionalProperties: false
      required: [key]
      properties:
        key: { type: string }
        label: { type: string }
    ClassModelReason:
      type: object
      additionalProperties: false
      required: [feature, label, contribution]
      description: >
        One feature's signed contribution to a learned class proposal. The score
        IS the sum of these through a softmax, so the list is the model's actual
        arithmetic rather than a post-hoc guess at its reasoning.
      properties:
        feature:
          type: string
          description: The stable machine name of the feature — `port/9100`, `oui/214`.
        label:
          type: string
          description: >
            The phrase a reviewer reads, built from this input's own evidence:
            "port 9100 is open", "the MAC prefix is registered to Brother".
        contribution:
          type: number
          description: >
            Value × weight, in log-odds. Signed: a negative contribution is
            evidence AGAINST the proposed class that the rest outweighed.
    ClassificationRuleRef:
      type: object
      additionalProperties: false
      required: [kind, pattern, confidence]
      description: >
        One classification rule that matched, copied into the proposal rather
        than referenced: somebody asking "why does this say switch" six months
        later needs the pattern and the citation that were in force at the time,
        not whatever the rule says now.
      properties:
        id: { type: string }
        kind:
          type: string
          enum: [oui, sysobjectid, enip, cloud_type, banner, port_profile, model, platform, cdp_capabilities, lldp_capability, mdns_service]
        pattern: { type: string }
        class: { type: string }
        vendor: { type: string }
        model: { type: string }
        confidence: { type: number }
        source_url: { type: string }
    RelationshipCreateRequest:
      type: object
      additionalProperties: false
      required: [type, peer_asset_id]
      properties:
        type:
          type: string
          enum: [connects_to, contains, depends_on, hosted_on, impacts, manages, member_of, runs_on, sends_data_to, virtualized_by]
        peer_asset_id:
          type: string
          format: uuid
          description: The other end. Must be an asset of this tenant, and not the asset in the path.
        direction:
          type: string
          enum: [out, in]
          default: out
          description: >
            Which end the asset in the path is. `out` makes it the from end.
            There is no `both`: an edge has one canonical direction, and a
            declaration that will not say which way it points is not one.
        attributes:
          type: object
          additionalProperties: true
        confidence:
          type: number
          minimum: 0
          maximum: 1
    GraphNode:
      type: object
      additionalProperties: false
      description: One asset as a node of the neighbourhood or the impact closure.
      required: [asset_id, depth]
      properties:
        asset_id: { type: string, format: uuid }
        display_name: { type: string }
        class_key: { type: string }
        asset_status: { type: string }
        risk_score: { type: integer }
        depth:
          type: integer
          description: >
            The SHORTEST hop count from the root, so a node reachable by several
            routes is placed once, at the distance a person would say it is.
        is_root:
          type: boolean
          description: Present on the neighbourhood; the impact closure excludes its own root.
    Neighbourhood:
      type: object
      additionalProperties: false
      required:
        - root_asset_id
        - depth
        - include_pending
        - nodes
        - edges
        - truncated
        - total_nodes
        - total_edges
        - node_cap
        - edge_cap
      properties:
        root_asset_id: { type: string, format: uuid }
        depth: { type: integer }
        include_pending: { type: boolean }
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/GraphNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/Relationship'
          description: >
            Only edges with BOTH ends in `nodes`. An edge to a node the cap
            removed would draw as a line into empty space.
        truncated:
          type: boolean
          description: >
            A cap bit. The graph is a PREFIX of the real one and must be
            labelled as such wherever it is drawn.
        total_nodes:
          type: integer
          description: What the traversal actually found, which is what `nodes` would be without the cap.
        total_edges: { type: integer }
        node_cap: { type: integer }
        edge_cap: { type: integer }
    NeighbourhoodResponse:
      type: object
      additionalProperties: false
      required: [neighbourhood]
      properties:
        neighbourhood:
          $ref: '#/components/schemas/Neighbourhood'
    ImpactDepthCount:
      type: object
      additionalProperties: false
      required: [depth, count]
      properties:
        depth: { type: integer }
        count: { type: integer }
    Impact:
      type: object
      additionalProperties: false
      required:
        - root_asset_id
        - direction
        - depth
        - types
        - nodes
        - counts_by_depth
        - total
        - truncated
        - node_cap
      properties:
        root_asset_id: { type: string, format: uuid }
        direction:
          type: string
          enum: [downstream, upstream]
        depth:
          type: integer
          description: The cap actually applied.
        types:
          type: array
          items: { type: string }
          description: >
            The impact-bearing vocabulary the closure walked, echoed so a
            consumer can see which question was answered.
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/GraphNode'
        counts_by_depth:
          type: array
          items:
            $ref: '#/components/schemas/ImpactDepthCount'
          description: >
            Counts over the RETURNED nodes. When `truncated` is true they are a
            floor, which is what the flag is there to say.
        total: { type: integer }
        truncated: { type: boolean }
        node_cap: { type: integer }
    ImpactResponse:
      type: object
      additionalProperties: false
      required: [impact]
      properties:
        impact:
          $ref: '#/components/schemas/Impact'
    AssetFacetBucket:
      type: object
      additionalProperties: false
      description: >
        One facet bucket (models.AssetFacetBucket — the key is serialized under
        `value`).


        `value` is what a QUERY TERM matches on, which for the class facet is
        the class PATH, since that is what `class:` compares a prefix of.
        `label` is what the rail shows a person, and is omitted when the two are
        the same.
      required: [value, count]
      properties:
        value:
          type: string
        count:
          type: integer
        label:
          type: string
    AssetFacetsResponse:
      type: object
      additionalProperties: false
      description: 'Envelope for GET /infrastructure-assets/facets — `{ level, buckets }`.'
      required: [level, buckets]
      properties:
        level:
          type: string
        buckets:
          type: [array, "null"]
          items:
            $ref: '#/components/schemas/AssetFacetBucket'
        query:
          type: string
          description: The canonical predicate these counts were taken over — the same echo the list envelope carries, so a rail can prove its numbers describe the list beside it. Absent when the predicate was empty.
    AssetTopologyClass:
      type: object
      additionalProperties: false
      description: One class node — a leaf of the topology tree.
      required: [class_key, class_path, asset_count]
      properties:
        class_key:
          type: string
          description: 'The class. This is what the drill-through query uses: `class:` matches a SUBTREE, so the key names this node exactly.'
        class_path:
          type: string
          description: 'The materialised ancestry (`hardware.computer.server`), for labelling and for showing where the node sits.'
        asset_count: { type: integer }
    AssetTopologySegment:
      type: object
      additionalProperties: false
      description: One segment node, with the classes present in it.
      required: [segment_name, asset_count, classes]
      properties:
        segment_id:
          type: [string, "null"]
          format: uuid
          description: >
            NULL for the `Unsegmented` bucket. Branch on THIS, never on the
            name: a tenant may legitimately name a segment "Unsegmented", and
            the drill-through differs — `segment_id:<id>` for a real segment,
            `not exists(segment_id)` for the bucket (the query language has no
            null literal; absence is spelled with `exists`).
        segment_name: { type: string }
        asset_count: { type: integer }
        classes:
          type: [array, "null"]
          items:
            $ref: '#/components/schemas/AssetTopologyClass'
    AssetTopologySite:
      type: object
      additionalProperties: false
      description: One site node, with its segments.
      required: [site, asset_count, segments]
      properties:
        site:
          type: string
          description: '`Unassigned` when the asset records no site. Read from the `site` column, falling back to `tags.location.site` and `tags.site` — the same expression the `site` facet uses, so the tree and the rail cannot name a site differently.'
        asset_count: { type: integer }
        segments:
          type: [array, "null"]
          items:
            $ref: '#/components/schemas/AssetTopologySegment'
    AssetTopologyEdge:
      type: object
      additionalProperties: false
      description: >
        Every ACTIVE `connects_to` / `depends_on` relationship crossing from one
        segment into another, aggregated. Directed: `depends_on` is not
        symmetric, and folding the directions together would lose which side is
        the dependant.
      required: [from_segment_name, to_segment_name, count, by_type]
      properties:
        from_segment_id: { type: [string, "null"], format: uuid }
        from_segment_name: { type: string }
        to_segment_id: { type: [string, "null"], format: uuid }
        to_segment_name: { type: string }
        count: { type: integer, description: Every counted edge between the pair. }
        by_type:
          type: object
          additionalProperties: { type: integer }
          description: 'Per relationship type. `connects_to` is observed traffic and `depends_on` is a declared dependency — different claims, so one number would hide which a line represents.'
    AssetTopology:
      type: object
      additionalProperties: false
      required: [sites, edges, total_assets, unassigned_assets, total_nodes, total_edges, truncated, node_cap, edge_cap]
      properties:
        sites:
          type: [array, "null"]
          items:
            $ref: '#/components/schemas/AssetTopologySite'
        edges:
          type: [array, "null"]
          items:
            $ref: '#/components/schemas/AssetTopologyEdge'
        total_assets:
          type: integer
          description: Counted INDEPENDENTLY of the tree, so a client can assert the tree adds up to it. A tree that silently lost a branch is what this number makes visible.
        unassigned_assets:
          type: integer
          description: How many have no site — the number that says whether the diagram is the estate or a curated corner of it.
        total_nodes: { type: integer, description: '(site, segment, class) triples before the cap.' }
        total_edges: { type: integer, description: Segment pairs before the cap. }
        truncated: { type: boolean, description: True when either cap was reached. The totals above stay real. }
        node_cap: { type: integer }
        edge_cap: { type: integer }
    AssetTopologyResponse:
      type: object
      additionalProperties: false
      description: 'Envelope for GET /infrastructure-assets/topology — `{ topology }`.'
      required: [topology]
      properties:
        topology:
          $ref: '#/components/schemas/AssetTopology'
    AssetStats:
      type: object
      additionalProperties: false
      description: Asset count + trend over a period (models.AssetStats). Returned bare by GET /infrastructure-assets/stats.
      required: [current, previous, change, change_percent, period]
      properties:
        current: { type: integer }
        previous: { type: integer }
        change: { type: integer }
        change_percent: { type: number }
        period: { type: string }
    AssetHistory:
      type: object
      additionalProperties: false
      description: One asset change-history row (models.AssetHistory).
      required: [id, asset_id, tenant_id, source, action, changes, created_at]
      properties:
        id: { type: string, format: uuid }
        asset_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        actor_user_id: { type: string, format: uuid }
        source: { type: string }
        action: { type: string }
        changes:
          type: [object, "null"]
          additionalProperties: true
        created_at: { type: string, format: date-time }
    AssetHistoryListResponse:
      type: object
      additionalProperties: false
      description: 'Envelope for GET /infrastructure-assets/{id}/history — `{ "history": [...] }`.'
      required: [history]
      properties:
        history:
          type: [array, "null"]
          items:
            $ref: '#/components/schemas/AssetHistory'
    AssetClassChange:
      type: object
      additionalProperties: false
      description: One `asset_class_history` row — a class transition and its argument.
      required: [id, asset_id, tenant_id, to_class_key, source, evidence, created_at]
      properties:
        id: { type: string, format: uuid }
        asset_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        from_class_key:
          type: string
          description: 'The class the asset held. ABSENT on the row its creation wrote — there was none.'
        from_class_label: { type: string, description: Display label for from_class_key. }
        to_class_key: { type: string, description: The class it moved to. }
        to_class_label: { type: string, description: Display label for to_class_key. }
        source:
          type: string
          enum: [proposal, manual, import, classifier]
          description: 'The mechanism that moved it. A closed set; consumers branch on it.'
        actor_user_id:
          type: string
          format: uuid
          description: 'The person who caused it. Absent when a machine did — absent means no person, not unknown.'
        evidence:
          type: [object, "null"]
          additionalProperties: true
          description: >
            The argument as IDENTIFIERS — rule ids, a model id and its
            probability, the proposal id, the recorded class provenance. Never a
            hostname, an address, key material or a command transcript.
        created_at: { type: string, format: date-time }
    AssetClassHistoryListResponse:
      type: object
      additionalProperties: false
      description: 'Envelope for GET /infrastructure-assets/{id}/class-history — `{ "class_history": [...] }`.'
      required: [class_history]
      properties:
        class_history:
          type: array
          items:
            $ref: '#/components/schemas/AssetClassChange'
    SoftwareInstall:
      type: object
      additionalProperties: false
      description: >
        One `software_installs` row joined to its `software_products` catalogue
        entry: a product present on an asset, with the provenance of the claim.
      required: [install_id, product_id, name, source_kind, status, first_seen_at, last_seen_at, eol_state, vulnerability_state, vulnerability_count]
      properties:
        install_id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        name: { type: string, description: 'Product name. NOT NULL — a component with no name cannot be written and is dropped by the parser with a warning.' }
        vendor: { type: [string, "null"], description: 'The publishing organisation, where the source named one. NULL, never "", when it did not.' }
        version: { type: [string, "null"], description: The version exactly as the source wrote it, kept raw for display. Never used for ordering. }
        version_sort:
          type: [string, "null"]
          description: >
            The normalised component-wise sort key (QUERY_LANGUAGE §5.5). NULL
            when the version carries no numeric component, which makes every
            version comparison against this product evaluate UNKNOWN — the
            intended behaviour, not a gap: a lexical fallback puts 1.10 below 1.9.
        purl: { type: [string, "null"], description: 'Package URL in canonical form. The strongest of the three identity forms.' }
        cpe: { type: [string, "null"], description: 'CPE 2.3 formatted string, stored lowercase (CPE 2.3 §5.3.2 makes attribute values case-insensitive and NVD publishes lowercase).' }
        license_id:
          type: [string, "null"]
          description: >
            An SPDX licence identifier, or an SPDX licence EXPRESSION verbatim
            ("MIT OR Apache-2.0") when the document gave one. A consumer that
            needs a single id must be ready for an expression: collapsing one to
            "the first id" would assert a choice the document never made.
        install_path: { type: [string, "null"], description: 'Filesystem location, where the source knows one. An SBOM component has none.' }
        source_kind:
          type: string
          enum: [measured, declared, imported, inferred]
          description: 'ADR-0005 provenance. An SBOM upload is `imported`: the document is a build system''s claim, not something the platform measured.'
        source_ref: { type: [string, "null"], description: 'What produced this observation — `sbom:<upload id>` for an upload.' }
        status:
          type: string
          enum: [active, stale, removed]
          description: >
            `removed` means a later document for this asset did not list the
            product. The row is kept rather than deleted, so `first_seen_at`
            survives and a document that lists it again makes it `active`.
        first_seen_at: { type: string, format: date-time, description: Never updated. That is the point of having it beside last_seen_at. }
        last_seen_at: { type: string, format: date-time }
        updated_at: { type: [string, "null"], format: date-time }
        eol_state:
          type: string
          enum: [end_of_life, supported, no_date, not_in_catalogue, not_assessed]
          description: >
            Read off the `eol` producer's open `software_end_of_life` finding
            for this install and, when there is none, off the producer's own
            per-install record of what the lifecycle catalogue resolved. It
            rides on the list so a fifty-row Software tab is one request rather
            than fifty. Nothing re-runs the resolution.


            `end_of_life` — an open finding: the date is inside the warning
            window or past. `supported` — the catalogue resolved this version
            to a cycle whose end-of-life date is beyond the warning window;
            `eol_date` carries it. `no_date` — the catalogue has the version
            and publishes no date, so neither "supported" nor "end of life"
            can be claimed. `not_in_catalogue` — the catalogue has no entry for
            the product; the gap is recorded for its curators.
            `not_assessed` — no completed pass has recorded an answer for this
            install: the check has not run since it was seen, the install is
            not `active` and was skipped, or its finding was closed by a
            person. `not_assessed` is NOT "supported", and a client must not
            render it as one.
        eol_date:
          type: [string, "null"]
          description: 'The catalogue''s end-of-life date for the matched cycle (`YYYY-MM-DD`): the finding''s evidence when `eol_state` is `end_of_life`, the producer''s record when it is `supported`. Absent in every other state.'
        eol_days_remaining:
          type: [integer, "null"]
          description: Negative once the date has passed. Null when the producer wrote none.
        eol_severity:
          type: [string, "null"]
          enum: [low, medium, high, null]
          description: 'The finding''s ladder rung — `low` approaching, `medium` past, `high` past by more than a year.'
        eol_finding_id:
          type: [string, "null"]
          format: uuid
          description: The finding behind the state, for a link straight to it.
        eol_assessed_at:
          type: [string, "null"]
          format: date-time
          description: When the `eol` producer last recorded this install's lifecycle answer. Absent when no completed pass has.
        vulnerability_state:
          type: string
          enum: [vulnerable, none_known, not_assessed]
          description: >
            Read off the `vulnerability` producer's open `known_vulnerability`
            finding for this install.


            `none_known` and `not_assessed` are deliberately distinct, and a
            client that renders both as "0" undoes the distinction. The producer
            matches on CPE and PURL only: a product carrying NEITHER is skipped
            and counted as unidentifiable, so "no known vulnerabilities" and
            "could not be checked" are different answers and only one is
            reassuring.
        vulnerability_count:
          type: integer
          description: >
            How many CVEs the finding carries. The producer writes ONE finding
            per install with every match in its evidence, because the unit of
            remediation is "upgrade this package". 0 in every state but
            `vulnerable`.
        worst_cvss:
          type: [number, "null"]
          description: >
            The worst matching CVE's CVSS base score, 0–10. NULL — never 0.0 —
            when the catalogue scored none of them: the producer states that
            with `worst_cvss_scored: false`, and 0.0 reads as harmless for
            something nobody has graded.
        vulnerability_severity:
          type: [string, "null"]
          enum: [info, low, medium, high, critical, null]
        vulnerability_finding_id:
          type: [string, "null"]
          format: uuid
    SoftwareInstallListResponse:
      type: object
      additionalProperties: false
      description: 'Envelope for GET /infrastructure-assets/{id}/software. An empty `software` array is a real answer.'
      required: [software, total, limit, offset]
      properties:
        software:
          type: [array, "null"]
          items:
            $ref: '#/components/schemas/SoftwareInstall'
        total: { type: integer, description: Rows matching the filter, before paging. }
        limit: { type: integer }
        offset: { type: integer }
    SoftwareProduct:
      type: object
      additionalProperties: false
      description: One `software_products` row — a tenant catalogue entry — with how many assets carry it.
      required: [product_id, name, source_kind, install_count, asset_count, eol_state, eol_install_count, vulnerability_state, vulnerable_install_count, vulnerability_count]
      properties:
        product_id: { type: string, format: uuid }
        name: { type: string }
        vendor: { type: [string, "null"] }
        version: { type: [string, "null"] }
        version_sort: { type: [string, "null"] }
        purl: { type: [string, "null"] }
        cpe: { type: [string, "null"] }
        license_id: { type: [string, "null"] }
        source_kind:
          type: string
          enum: [measured, declared, imported, inferred]
        install_count:
          type: integer
          description: 'ACTIVE installs only. 0 with the product still listed means every install of it was marked removed — "we used to run this".'
        asset_count: { type: integer, description: Distinct assets with an active install. }
        eol_state:
          type: string
          enum: [end_of_life, supported, no_date, not_in_catalogue, not_assessed]
          description: >
            The product's lifecycle state, derived over its ACTIVE installs
            worst-then-most-informative: an open end-of-life finding on any of
            them, else any install the producer recorded as `supported`, else
            `no_date`, else `not_in_catalogue`, else `not_assessed`. A catalogue
            row is an identity — name, version, purl/cpe — so every install of
            it resolves identically; `eol_install_count` is what makes the
            end-of-life claim checkable rather than asserted, and a mixed set
            only arises across pass boundaries.


            `not_assessed` carries the same warning as on an install: it is not
            "supported".
        eol_install_count: { type: integer, description: Active installs of this product with an open end-of-life finding. }
        eol_date: { type: [string, "null"], description: 'The catalogue''s end-of-life date (`YYYY-MM-DD`): from the findings when `eol_state` is `end_of_life`, the soonest recorded date across supported installs when it is `supported`. Absent otherwise.' }
        eol_severity:
          type: [string, "null"]
          enum: [low, medium, high, null]
        eol_assessed_at:
          type: [string, "null"]
          format: date-time
          description: The most recent lifecycle record across the product's active installs. Absent when none has one.
        vulnerability_state:
          type: string
          enum: [vulnerable, none_known, not_assessed]
          description: >
            The product's vulnerability state. `not_assessed` means the product
            carries neither a PURL nor a CPE, so the producer had nothing to
            match on and skipped every install of it — which is not the same
            answer as `none_known`.
        vulnerable_install_count: { type: integer, description: Active installs with an open vulnerability finding. }
        vulnerability_count: { type: integer, description: 'CVEs on the worst such finding. 0 in every state but `vulnerable`.' }
        worst_cvss: { type: [number, "null"], description: 'Worst matching CVE''s CVSS base score. NULL, never 0.0, when the catalogue scored none.' }
        vulnerability_severity:
          type: [string, "null"]
          enum: [info, low, medium, high, critical, null]
    SoftwareProductListResponse:
      type: object
      additionalProperties: false
      description: 'Envelope for GET /software/products.'
      required: [products, total, limit, offset]
      properties:
        products:
          type: [array, "null"]
          items:
            $ref: '#/components/schemas/SoftwareProduct'
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    SbomIngestResult:
      type: object
      additionalProperties: false
      description: >
        What one upload did, in numbers a person can reconcile with their own
        document. Every count is reported separately rather than rolled into a
        single "ingested N": "480 components, 412 products, 12 excluded, 3
        dependency edges ignored" is a sentence a user can check, and "412
        ingested" is not.
      required:
        - upload_id
        - format
        - spec_version
        - asset_id
        - asset_created
        - asset_status
        - component_count
        - products_created
        - products_matched
        - installs_created
        - installs_updated
        - installs_removed
        - components_excluded
        - dependency_edges_ignored
      properties:
        upload_id:
          type: string
          format: uuid
          description: 'This upload. Written to every `software_installs.source_ref` it touches, which is how the absent-install sweep knows which rows the document did not list.'
        filename: { type: string }
        format:
          type: string
          enum: [cyclonedx, spdx]
          description: Detected from the document's own declaration, never from the filename or Content-Type.
        spec_version: { type: string, description: 'The version the document declared, verbatim: "1.6", "SPDX-2.3".' }
        document_serial:
          type: string
          description: >
            CycloneDX `serialNumber` or SPDX `documentNamespace`. Reported so a
            support question has an answer. NOT used for deduplication:
            CycloneDX mints a fresh serialNumber on every export, so two builds
            of one artefact carry two serials.
        asset_id: { type: string, format: uuid }
        asset_name: { type: string }
        asset_created: { type: boolean, description: 'True when POST /sbom created the asset; false when it matched one that already existed.' }
        asset_status:
          type: string
          description: 'An asset created from a document lands in `pending_approval`. Declared is not approved.'
        component_count: { type: integer, description: Components the parser returned, nested ones included. }
        products_created: { type: integer }
        products_matched: { type: integer, description: Products that were already in the catalogue. }
        installs_created: { type: integer }
        installs_updated: { type: integer }
        installs_removed:
          type: integer
          description: 'Installs this asset had that the new document does not list, marked `removed`. Not deleted.'
        components_excluded:
          type: integer
          description: 'Components the document marked `scope: excluded`, which says they are NOT in the artefact. Ingesting one as an install would be a false positive.'
        dependency_edges_ignored:
          type: integer
          description: >
            `dependsOn` / `DEPENDS_ON` edges the document carried and this ingest
            did not store. They are component-to-component edges and
            `asset_relationships` is asset-to-asset; there is no home for them in
            the data model today. Counted rather than silent, because a user who
            exported a dependency graph deserves to be told it was not kept.
        warnings:
          type: [array, "null"]
          items: { type: string }
          description: >
            Everything the parse skipped, dropped or assumed. A document that
            parsed with warnings is a SUCCESSFUL parse; the warnings are what let
            the page say "412 of your 480 components were ingested" instead of
            saying nothing.
    AssetCryptoResponse:
      type: object
      additionalProperties: false
      description: 'Envelope for GET /infrastructure-assets/{id}/crypto — `{ "crypto_implementations": [...] }`.'
      required: [crypto_implementations]
      properties:
        crypto_implementations:
          type: [array, "null"]
          items:
            $ref: '#/components/schemas/CryptoImplementation'

    # ============================================================
    # Crypto materials (keys / libraries / external mappings)
    # ============================================================
    Key:
      type: object
      additionalProperties: false
      description: >
        Cryptographic key metadata, no private material (models.Key, aligned with
        CycloneDX relatedCryptoMaterialProperties). `key_usage` and `metadata`
        are present-but-nullable (non-omitempty); the rest of the pointer fields
        are omitted when unset.
      required: [id, tenant_id, key_type, key_usage, metadata, material_type, state]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        key_type: { type: string }
        key_usage:
          type: [array, "null"]
          items: { type: string }
        public_fingerprint: { type: string }
        jwk_thumbprint: { type: string }
        size_bits: { type: integer }
        curve: { type: string }
        created_at: { type: string, format: date-time }
        rotated_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        provenance: { type: string }
        metadata:
          type: [object, "null"]
          additionalProperties: true
        material_type: { type: string }
        state: { type: string }
        state_reason: { type: string }
        format: { type: string }
        algorithm_ref: { type: string }
        secured_by: { type: string }
        activation_date: { type: string, format: date-time }
        deactivation_date: { type: string, format: date-time }
        destruction_date: { type: string, format: date-time }
        deployment_count:
          type: integer
          description: Count of distinct assets using this key via implementation_keys → crypto_implementations. Populated by list and single-key reads; absent when not computed.
    KeyResponse:
      type: object
      additionalProperties: false
      description: 'Single-key envelope for GET /keys/{id} — `{ "key": {...} }`.'
      required: [key]
      properties:
        key:
          $ref: '#/components/schemas/Key'
    KeyImplementation:
      type: object
      additionalProperties: false
      description: >
        A crypto configuration that references a key, flattened with the asset
        context the Keys-lens drawer needs (models.KeyImplementation). Returned
        by GET /keys/{id}/implementations.
      required: [implementation_id, asset_id]
      properties:
        implementation_id: { type: string, format: uuid }
        asset_id: { type: string, format: uuid }
        asset_hostname: { type: string }
        protocol: { type: string }
        protocol_version: { type: string }
    KeyImplementationListResponse:
      type: object
      additionalProperties: false
      description: 'List envelope for GET /keys/{id}/implementations — `{ "implementations": [...] }`.'
      required: [implementations]
      properties:
        implementations:
          type: [array, "null"]
          items:
            $ref: '#/components/schemas/KeyImplementation'
    CryptoLibrary:
      type: object
      additionalProperties: false
      description: >
        A crypto library + version present on an implementation (models.CryptoLibrary,
        CycloneDX-enhanced). `build_metadata` and `known_vulnerabilities` are
        present-but-nullable (non-omitempty).
      required: [id, tenant_id, name, version, build_metadata, known_vulnerabilities, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        name: { type: string }
        version: { type: string }
        vendor: { type: string }
        cpe: { type: string }
        build_metadata:
          type: [object, "null"]
          additionalProperties: true
        known_vulnerabilities:
          type: [array, "null"]
          items:
            type: object
            additionalProperties: true
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        purl: { type: string }
        certification_level:
          type: array
          items: { type: string }
    ExternalAssetMapping:
      type: object
      additionalProperties: false
      description: Maps a local entity to an external system (models.ExternalAssetMapping).
      required: [id, tenant_id, local_type, local_id, external_system, external_id, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        local_type: { type: string }
        local_id: { type: string, format: uuid }
        external_system: { type: string }
        external_id: { type: string }
        sync_status: { type: string }
        last_synced_at: { type: string, format: date-time }
        last_sync_error: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    KeyListResponse:
      type: object
      additionalProperties: false
      description: 'List envelope for GET /keys — `{ "keys": [...] }`.'
      required: [keys]
      properties:
        keys:
          type: [array, "null"]
          items:
            $ref: '#/components/schemas/Key'
    CryptoLibraryListResponse:
      type: object
      additionalProperties: false
      description: 'List envelope for GET /libraries — `{ "libraries": [...] }`.'
      required: [libraries]
      properties:
        libraries:
          type: [array, "null"]
          items:
            $ref: '#/components/schemas/CryptoLibrary'
    ExternalAssetMappingListResponse:
      type: object
      additionalProperties: false
      description: 'List envelope for GET /mappings — `{ "mappings": [...] }`.'
      required: [mappings]
      properties:
        mappings:
          type: [array, "null"]
          items:
            $ref: '#/components/schemas/ExternalAssetMapping'

    # ============================================================
    # Crypto posture summaries (risk / PQC readiness / PQC progress)
    # ============================================================
    RiskSummary:
      type: object
      additionalProperties: false
      description: >
        Aggregate asset-risk counts (models.RiskSummary), over `monitoring`
        assets.


        `informational` and `unknown_risk` are DIFFERENT answers and the bands
        are mutually exclusive: informational is score 0 with a producer in
        `risk_assessed_by` (somebody looked and found nothing), unknown_risk is
        score 0 with none (NOBODY HAS LOOKED). They used to be one number, so a
        tenant that had never been scanned read as clean.
      required: [total_assets, high_risk, medium_risk, low_risk, informational, unknown_risk, total_crypto, critical_findings]
      properties:
        total_assets: { type: integer }
        high_risk: { type: integer }
        medium_risk: { type: integer }
        low_risk: { type: integer }
        informational:
          type: integer
          description: Scored 0 by at least one producer — assessed, and clean.
        unknown_risk:
          type: integer
          description: NOT ASSESSED — no producer has scored this asset at all.
        total_crypto: { type: integer }
        critical_findings: { type: integer }
    RiskSummaryResponse:
      type: object
      additionalProperties: false
      description: 'Envelope for GET /risk/summary — `{ "risk_summary": {...} }`.'
      required: [risk_summary]
      properties:
        risk_summary:
          $ref: '#/components/schemas/RiskSummary'
    PostureTrendPoint:
      type: object
      additionalProperties: false
      description: One day on the posture trend line (models.PostureTrendPoint).
      required: [date, risk_index, seeded]
      properties:
        date: { type: string, format: date, description: 'UTC day (YYYY-MM-DD).' }
        risk_index: { type: integer, description: '0–100, % of assets at high risk (matches the hero gauge).' }
        seeded:
          type: boolean
          description: >
            true when this day is a synthesized pre-history baseline (a new
            tenant has no snapshot yet, so days before its first real snapshot
            are drawn flat at the current live posture). false for a real
            snapshot, a carried-forward real value, or today's live value.
    PostureTrendResponse:
      type: object
      additionalProperties: false
      description: 'Envelope for GET /risk/posture/trend — `{ "trend": [...] }`.'
      required: [trend]
      properties:
        trend:
          type: array
          items:
            $ref: '#/components/schemas/PostureTrendPoint'
    PQCReadinessSummary:
      type: object
      additionalProperties: false
      description: 'Tenant PQC adoption fraction (models.PQCReadinessSummary). Returned bare by GET /pqc/summary.'
      required: [total_implementations, pqc_implementations, readiness_percent]
      properties:
        total_implementations: { type: integer }
        pqc_implementations: { type: integer }
        readiness_percent: { type: number }
    PQCFamilyStats:
      type: object
      additionalProperties: false
      description: Per-algorithm-family quantum readiness (models.PQCFamilyStats).
      required: [family, count, is_pqc, quantum_safe]
      properties:
        family: { type: string }
        count: { type: integer }
        is_pqc: { type: boolean }
        quantum_safe: { type: boolean }
        migrate_to:
          type: string
          description: Recommended PQC target; omitted when none.
    PQCProgress:
      type: object
      additionalProperties: false
      description: >-
        Quantum readiness across crypto implementations (models.PQCProgress).
        Each implementation is classified exactly once into one of four
        mutually exclusive categories — pqc_ready, symmetric_safe, non_pqc
        (needs migration) and unclassified — so they sum to
        total_implementations and pqc_percentage cannot exceed 100. by_family
        is a different unit: it counts algorithm families as a migration
        worklist, so one implementation appears under several families and
        those counts intentionally sum past the implementation total.
      required: [total_implementations, pqc_ready, symmetric_safe, non_pqc, unclassified, pqc_percentage, by_family]
      properties:
        total_implementations: { type: integer }
        pqc_ready:
          type: integer
          description: Uses post-quantum cryptography and no classical asymmetric algorithm.
        symmetric_safe:
          type: integer
          description: Uses no asymmetric cryptography at all, so needs no migration.
        non_pqc:
          type: integer
          description: >-
            Needs migration — at least one classical asymmetric component
            (NIST IR 8547: RSA, ECDSA, EdDSA, DH, ECDH; deprecated after 2030,
            disallowed after 2035).
        unclassified:
          type: integer
          description: >-
            Could not be judged — no component algorithms resolved against the
            catalogue, or a component with an unknown primitive. Counts against
            readiness rather than being assumed safe.
        pqc_percentage:
          type: number
          description: (pqc_ready + symmetric_safe) / total_implementations, as a percentage.
        by_family:
          type: [array, "null"]
          description: Per-family breakdown; null when the tenant has no crypto.
          items:
            $ref: '#/components/schemas/PQCFamilyStats'
    PQCProgressResponse:
      type: object
      additionalProperties: false
      description: 'Envelope for GET /pqc/progress — `{ "progress": {...} }`.'
      required: [progress]
      properties:
        progress:
          $ref: '#/components/schemas/PQCProgress'

    # ============================================================
    # Asset lifecycle (stale lens + policy)
    # ============================================================
    StaleAsset:
      type: object
      additionalProperties: true
      description: >
        A stale/archived asset (models.StaleAsset). Embeds the full Asset shape
        (pinned by the `Asset` schema and the assets contract slice — hence
        additionalProperties:true here) plus two stale-specific fields. Both
        extra fields are always present; `stale_status` is null when unset.
      required:
        - stale_status
        - days_since_last_seen
      properties:
        stale_status:
          type: [string, "null"]
          description: 'warning | archived; null when not yet classified.'
        days_since_last_seen:
          type: integer
    StaleAssetListResponse:
      type: object
      additionalProperties: false
      description: 'List envelope for GET /infrastructure-assets/stale — `{ "assets": [...], "pagination": {...} }`.'
      required: [assets, pagination]
      properties:
        assets:
          type: array
          items:
            $ref: '#/components/schemas/StaleAsset'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
    ActiveScanRequest:
      type: object
      additionalProperties: false
      description: Body for POST /infrastructure-assets/scan.
      required:
      - asset_ids
      properties:
        asset_ids:
          type: array
          items:
            type: string
          description: Asset UUIDs as strings. Unparseable entries are silently dropped.
        run_from:
          type: string
          enum: [auto, platform, sensor]
          description: Which executor scans the assets. Defaults to `auto`.
        sensor_id:
          type: string
          format: uuid
          description: The tenant sensor to run from. Required when `run_from` is `sensor`; ignored otherwise.
    ActiveScanJob:
      type: object
      additionalProperties: false
      description: One discovery job an Active Scan dispatched.
      required:
      - job_id
      - executor
      - count
      properties:
        job_id:
          type: string
        executor:
          type: string
          enum: [platform, sensor]
        sensor_id:
          type: string
          format: uuid
        sensor_name:
          type: string
        count:
          type: integer
          description: Assets this job scans.
    ActiveScanSkip:
      type: object
      additionalProperties: false
      description: An asset the scan could not dispatch anywhere, and why.
      required:
      - asset_id
      - reason
      properties:
        asset_id:
          type: string
        reason:
          type: string
    ActiveScanResponse:
      type: object
      additionalProperties: false
      description: >
        Result of an Active Scan. `job_id` and `count` keep the original shape
        (the first job and every asset scanned); `jobs` lists each dispatched
        job with its executor; `skipped` lists assets left unscanned because
        their observing sensor is offline.
      required: [message, job_id, count, jobs, skipped]
      properties:
        message:
          type: string
        job_id:
          type: string
        count:
          type: integer
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/ActiveScanJob'
        skipped:
          type: array
          items:
            $ref: '#/components/schemas/ActiveScanSkip'
    RevalidationJobResponse:
      type: object
      additionalProperties: false
      description: 'Result of a rescan / revalidate action — `{ "message": "...", "job_id": "...", "count": N }`.'
      required: [message, job_id, count]
      properties:
        message:
          type: string
        job_id:
          type: string
        count:
          type: integer
    ArchiveAssetsResponse:
      type: object
      additionalProperties: false
      description: 'Result of an archive action — `{ "message": "...", "count": N }`.'
      required: [message, count]
      properties:
        message:
          type: string
        count:
          type: integer
    AssetLifecyclePolicy:
      type: object
      additionalProperties: false
      description: Per-tenant asset lifecycle policy (models.AssetLifecyclePolicy).
      required:
        - id
        - tenant_id
        - stale_warning_days
        - stale_archived_days
        - auto_archive_enabled
        - notifications_enabled
        - revalidation_schedule
        - created_at
        - updated_at
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        stale_warning_days: { type: integer }
        stale_archived_days: { type: integer }
        auto_archive_enabled: { type: boolean }
        notifications_enabled: { type: boolean }
        revalidation_schedule:
          type: [object, "null"]
          additionalProperties: true
          description: Free-form schedule config; null when unset.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AssetLifecyclePolicyInput:
      type: object
      additionalProperties: false
      description: Request body for PUT /lifecycle/policy. All fields optional; only supplied ones change.
      properties:
        stale_warning_days: { type: integer }
        stale_archived_days: { type: integer }
        auto_archive_enabled: { type: boolean }
        notifications_enabled: { type: boolean }
        revalidation_schedule:
          type: object
          additionalProperties: true
    AssetLifecyclePolicyResponse:
      type: object
      additionalProperties: false
      description: 'Envelope for GET/PUT /lifecycle/policy — `{ "policy": {...} }`.'
      required: [policy]
      properties:
        policy:
          $ref: '#/components/schemas/AssetLifecyclePolicy'

    # ============================================================
    # External connections (third-party connection inventory)
    # ============================================================
    ExternalConnection:
      type: object
      additionalProperties: false
      description: >
        A deduplicated third-party connection row (models.ExternalConnection) —
        one per (tenant, source_ip, dest_ip, dest_port, protocol) tuple. The
        many optional fields are omitempty pointers/slices, omitted when unset.
      required:
        - id
        - tenant_id
        - source_ip
        - dest_ip
        - dest_port
        - protocol
        - strength
        - is_pqc_resistant
        - cert_is_expired
        - first_seen_at
        - last_seen_at
        - observation_count
        - created_at
        - updated_at
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        source_ip: { type: string }
        source_hostname: { type: string }
        source_asset_id: { type: string, format: uuid }
        dest_ip: { type: string }
        dest_hostname: { type: string }
        dest_port: { type: integer }
        protocol: { type: string }
        protocol_version: { type: string }
        cipher_suite: { type: string }
        key_exchange_algorithm: { type: string }
        key_size: { type: integer }
        supported_tls_versions:
          type: array
          items: { type: string }
        strength:
          type: [string, "null"]
          enum: [weak, acceptable, strong, recommended, null]
        is_pqc_resistant: { type: boolean }
        weak_reasons:
          type: array
          items: { type: string }
          description: >
            Reasons strength is "weak" — protocol version, cipher
            suite, key exchange, key size, signature algorithm ONLY. Never
            certificate-hygiene observations; see cert_hygiene_flags.
        cert_hygiene_flags:
          type: array
          items: { type: string }
          description: >
            Certificate-hygiene observations (missing SCT, an untrusted or
            pinned CA, an incomplete chain, a missing Subject DN) that affect
            confidence in the chain but say nothing about cryptographic
            strength. Never influences strength/weak_reasons — see
            CLAUDE.md "Certificate quality flags".
        cert_subject: { type: string }
        cert_issuer: { type: string }
        cert_san:
          type: array
          items: { type: string }
        cert_not_before: { type: string, format: date-time }
        cert_not_after: { type: string, format: date-time }
        cert_fingerprint_sha256: { type: string }
        cert_public_key_algorithm: { type: string }
        cert_public_key_size: { type: integer }
        cert_signature_algorithm: { type: string }
        cert_is_expired: { type: boolean }
        cert_validation_status: { type: string }
        cert_sct_source:
          type: string
          enum: [embedded, tls_extension, ocsp, none]
          description: >
            Which RFC 6962 delivery route carried the Signed Certificate
            Timestamp, or "none" when a live handshake checked all three
            routes and found none. Absent when the route wasn't observable
            (e.g. a passive-capture-only observation) — never a false "none".
        cert_pem: { type: string }
        service_name: { type: string }
        service_version: { type: string }
        service_confidence: { type: string }
        service_identification_method: { type: string }
        first_seen_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        observation_count: { type: integer }
        sensor_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        elevated_asset_id:
          type: string
          format: uuid
          description: >
            Non-null once this connection has been elevated to a managed asset
            (#740); the id of that network_asset. Drives the "Elevated" badge.
    ExternalConnectionHistory:
      type: object
      additionalProperties: false
      description: A crypto-state change row for a connection (models.ExternalConnectionHistory).
      required:
        - id
        - external_connection_id
        - tenant_id
        - change_type
        - previous_strength
        - new_strength
        - strength_vocabulary_version
        - created_at
      properties:
        id: { type: string, format: uuid }
        external_connection_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        change_type: { type: string }
        previous_protocol_version: { type: string }
        previous_cipher_suite: { type: string }
        strength_vocabulary_version: { type: integer, enum: [1, 2] }
        previous_strength_legacy: { type: string, description: Original historical vocabulary; never inferred into a current grade. }
        new_strength_legacy: { type: string, description: Original historical vocabulary; never inferred into a current grade. }
        previous_strength: { type: [string, "null"], enum: [weak, acceptable, strong, recommended, null] }
        previous_is_pqc_resistant: { type: boolean }
        previous_cert_fingerprint_sha256: { type: string }
        previous_cert_not_after: { type: string, format: date-time }
        new_protocol_version: { type: string }
        new_cipher_suite: { type: string }
        new_strength: { type: [string, "null"], enum: [weak, acceptable, strong, recommended, null] }
        new_is_pqc_resistant: { type: boolean }
        new_cert_fingerprint_sha256: { type: string }
        new_cert_not_after: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    ExternalConnectionsSummary:
      type: object
      additionalProperties: false
      description: Aggregate counts for the connections summary card (models.ExternalConnectionsSummary).
      required: [total, weak_crypto, reassessment_required, pqc_resistant, expired_certs, legacy_tls, source_hosts]
      properties:
        total: { type: integer }
        weak_crypto: { type: integer }
        reassessment_required: { type: integer, description: Connections with unresolved historical evidence, including known weak connections. Overlaps weak_crypto. }
        pqc_resistant: { type: integer }
        expired_certs: { type: integer }
        legacy_tls: { type: integer }
        source_hosts: { type: integer, description: Distinct internal hosts (by source_ip) observed making outbound connections. }
    ExternalConnectionListResponse:
      type: object
      additionalProperties: false
      description: 'List envelope for GET /external-connections — `{ "connections": [...], "pagination": {...} }`.'
      required: [connections, pagination]
      properties:
        connections:
          type: array
          items:
            $ref: '#/components/schemas/ExternalConnection'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
    ExternalConnectionHistoryListResponse:
      type: object
      additionalProperties: false
      description: 'List envelope for GET /external-connections/{id}/history — `{ "history": [...], "pagination": {...} }`.'
      required: [history, pagination]
      properties:
        history:
          type: array
          items:
            $ref: '#/components/schemas/ExternalConnectionHistory'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'

    AssetBulkImportRequest:
      type: object
      description: Body for POST /infrastructure-assets/bulk — the rows parsed from a spreadsheet.
      required:
      - rows
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/AssetInput'
    NetworkSegmentBulkImportRequest:
      type: object
      description: Body for POST /network-segments/bulk — the rows parsed from a spreadsheet.
      required:
      - rows
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/NetworkSegmentInput'
    BulkRowResult:
      type: object
      description: The outcome of importing a single spreadsheet row.
      required:
      - index
      - status
      properties:
        index:
          type: integer
          description: 0-based position of the row in the submitted batch, so the UI can line each result up against the uploaded file.
        status:
          type: string
          enum: [created, skipped_duplicate, error]
        id:
          type: string
          format: uuid
          description: Present only when status is `created` — the id of the new asset/segment.
        reason:
          type: string
          description: Human-readable explanation for a skipped or errored row.
      additionalProperties: false
    BulkImportResult:
      type: object
      description: Aggregate result of a bulk import. Partial success is normal — one bad row never rolls back the rest of the batch.
      required:
      - created
      - skipped
      - failed
      - results
      properties:
        created:
          type: integer
        skipped:
          type: integer
        failed:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/BulkRowResult'
      additionalProperties: false
    LegacyError:
      type: object
      additionalProperties: true
      description: 'CURRENT error shape returned by inventory-service asset endpoints today: a single human-readable string under `error`. Some 400s carry extra sibling keys (e.g. `message`, `suggestion`), so additionalProperties is permitted here. Unstructured — cannot be branched on safely. Superseded by the ADR-0002 `Error` envelope below as endpoints are hardened.

        '
      required:
      - error
      properties:
        error:
          type: string
    Error:
      type: object
      additionalProperties: false
      description: ADR-0002 error envelope. Clients branch on `error.code`, never on `message`.
      required:
      - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
          - code
          - message
          properties:
            code:
              type: string
              description: Stable, machine-readable enum (e.g. asset_not_found).
            message:
              type: string
              description: Human-readable, safe to surface in UI.
            details:
              type: array
              items:
                $ref: '#/components/schemas/ErrorDetail'
            request_id:
              type: string
              description: For support correlation.
    ErrorDetail:
      type: object
      additionalProperties: false
      required:
      - field
      - issue
      properties:
        field:
          type: string
        issue:
          type: string
    Pagination:
      type: object
      additionalProperties: false
      description: ADR-0002 pagination block for collection envelopes.
      required:
      - total
      - limit
      - offset
      properties:
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        next_offset:
          type:
          - integer
          - 'null'
          description: Offset of the next page, or null when there are no more.
    CryptoImplementation:
      type: object
      additionalProperties: false
      description: 'A crypto configuration row (`crypto_implementations` in storage). Field presence follows models.CryptoImplementation''s json tags: fields without `omitempty` are always present (nullable pointers serialize as null); `omitempty` fields are omitted when zero/empty.

        '
      required:
      - id
      - tenant_id
      - asset_id
      - protocol
      - protocol_version
      - cipher_suite
      - key_exchange_algorithm
      - signature_algorithm
      - symmetric_encryption
      - hash_algorithm
      - key_size
      - certificate_id
      - discovery_method
      - discovery_methods
      - confidence_score
      - source_sensor_id
      - raw_data
      - risk_score
      - risk_score_assessed
      - compliance_status
      - first_discovered_at
      - last_verified_at
      - created_at
      - updated_at
      - deleted_at
      - risk_level
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        asset_id:
          type: string
          format: uuid
        protocol:
          type: string
        protocol_version:
          type:
          - string
          - 'null'
        cipher_suite:
          type:
          - string
          - 'null'
        key_exchange_algorithm:
          type:
          - string
          - 'null'
        signature_algorithm:
          type:
          - string
          - 'null'
        symmetric_encryption:
          type:
          - string
          - 'null'
        hash_algorithm:
          type:
          - string
          - 'null'
        key_size:
          type:
          - integer
          - 'null'
        certificate_id:
          type:
          - string
          - 'null'
          format: uuid
        discovery_method:
          type: string
          description: >-
            The method that FIRST observed this configuration. Kept as the
            primary attribution; the full provenance is `discovery_methods`.
        discovery_methods:
          type: array
          items:
            type: string
          description: >-
            Every discovery method that has contributed an observation to this
            configuration, `discovery_method` first. A configuration a passive
            sensor glimpsed and an active probe then measured in full is ONE
            row carrying both — the partial observation is absorbed into the
            complete one rather than kept as a second row. Always present;
            empty only for a row written before provenance was recorded and
            not yet backfilled.
        confidence_score:
          type:
          - number
          - 'null'
        source_sensor_id:
          type:
          - string
          - 'null'
          format: uuid
        raw_data:
          type: object
          additionalProperties: true
          description: Arbitrary JSONB payload from discovery. Always present (defaults to {}).
        risk_score:
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 100
          description: Numeric risk score when risk_score_assessed is true; null when no numeric scorer contributed.
        risk_score_assessed:
          type: boolean
          description: True for an existing positive stored score, or when a stored zero is corroborated by a worst linked numeric catalogue contribution of zero. A non-zero catalogue contribution cannot certify a stored zero. Stored null and qualitative-only evidence do not make this true.
        compliance_status:
          type: object
          additionalProperties: true
          description: Arbitrary JSONB compliance status map. Always present (defaults to {}).
        first_discovered_at:
          type: string
          format: date-time
        last_verified_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type:
          - string
          - 'null'
          format: date-time
        risk_level:
          type: string
        risk_factors:
          type: array
          items:
            type: string
        asset_hostname:
          type: string
        asset_ip_address:
          type: string
        asset_class_key:
          type: string
        asset_environment:
          type: string
        asset_business_unit:
          type: string
        keys:
          type: array
          items:
            type: object
            additionalProperties: true
          description: 'Cryptographic keys associated with this configuration. Shape is owned by the keys subsystem and not specced in this slice; treated as opaque objects here.

            '
        libraries:
          type: array
          items:
            type: object
            additionalProperties: true
          description: 'Crypto libraries that provided this configuration. Shape is not specced in this slice; treated as opaque objects here.

            '
    CryptoImplementationListResponse:
      type: object
      additionalProperties: false
      description: 'CURRENT list envelope for GET /crypto-configurations. Pre-ADR-0002: the collection is wrapped under `crypto_implementations` (storage-era key retained even though the v2 path uses the CMDB-aligned resource name) with a sibling legacy `pagination` block. Hardening to the ADR-0002 `{ data, pagination }` envelope is the documented go-forward change.

        '
      required:
      - crypto_implementations
      - pagination
      properties:
        crypto_implementations:
          type: array
          items:
            $ref: '#/components/schemas/CryptoImplementation'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
    CryptoImplementationResponse:
      type: object
      additionalProperties: false
      description: 'CURRENT single-resource envelope for GET /crypto-configurations/{id}. Pre-ADR-0002: the resource is wrapped under the `crypto_implementation` key (storage-era name retained).

        '
      required:
      - crypto_implementation
      properties:
        crypto_implementation:
          $ref: '#/components/schemas/CryptoImplementation'
    CryptoComponentAssessment:
      type: object
      additionalProperties: false
      description: >
        One catalogue-resolved component of a crypto configuration, with the
        assessment that explains the configuration's risk score
        (models.CryptoComponentAssessment).
      required:
      - algorithm_type
      - is_inferred
      - algorithm_id
      - code
      - name
      - category
      - strength
      - deprecation_status
      - risk_score
      - risk_level
      - recommended_alternatives
      - is_pqc
      - sets_score
      properties:
        algorithm_type:
          type: string
          description: The junction role this algorithm plays on the configuration.
          enum: [protocol_version, cipher_suite, key_exchange, signature, symmetric, hash]
        is_inferred:
          type: boolean
          description: '`false` = observed in use; `true` = offered by the server but not negotiated in the observed session (or, for TLS, derived from the suite name).'
        algorithm_id:
          type: string
          format: uuid
          description: The `algorithms` catalogue row this assessment comes from.
        code: { type: string }
        name: { type: string }
        category: { type: string }
        strength:
          type: string
          description: Catalogue strength (weak / acceptable / strong / recommended). Empty string when the catalogue row does not record one.
        deprecation_status:
          type: string
          description: Catalogue deprecation status. Empty string when unrecorded.
        risk_score:
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 100
          description: The catalogue row's explicit 0-100 risk score, or null when the row records only a qualitative assessment.
        risk_level:
          type:
          - string
          - 'null'
          description: The score banded with the canonical ladder (models.RiskBands), or null when risk_score is null. Computed server-side — do not re-derive.
          enum: [Critical, High, Medium, Low, Informational, null]
        migration_guidance:
          type: string
          description: Catalogue migration guidance. Omitted when the row records none.
        recommended_alternatives:
          type: array
          description: Catalogue-recommended replacements. Always present; empty means none recorded (not "unknown").
          items: { type: string }
        is_pqc: { type: boolean }
        sets_score:
          type: boolean
          description: True on the worst numerically scored component. False for every component when the resolved catalogue rows have no numeric score.
    CryptoComponentAssessmentListResponse:
      type: object
      additionalProperties: false
      description: 'List envelope for GET /crypto-configurations/{id}/components — `{ "components": [...] }`. An EMPTY array means NOT ASSESSED, never "assessed clean".'
      required:
      - components
      properties:
        components:
          type: array
          items:
            $ref: '#/components/schemas/CryptoComponentAssessment'
    RemediationIssue:
      type: object
      additionalProperties: false
      description: 'A single weakness contributing to the configuration''s overall risk. `type` is the dimension that triggered it (`protocol` / `cipher` / `hash` / `key_size`); `code` is the algorithm or protocol identifier the catalog matched (e.g. `TLS 1.0`, `RC4`).

        '
      required:
      - type
      - code
      - name
      - severity
      - summary
      - impact
      - steps
      - timeline
      - alternatives
      - resources
      properties:
        type:
          type: string
        code:
          type: string
        name:
          type: string
        severity:
          type: string
        summary:
          type: string
        impact:
          type: string
        steps:
          type: array
          items:
            type: string
        timeline:
          type: string
        alternatives:
          type: array
          items:
            type: string
        resources:
          type: array
          items:
            type: string
    RemediationSummary:
      type: object
      additionalProperties: false
      description: 'Aggregated remediation guidance for a single crypto configuration — services.RemediationSummary''s JSON form. All slice/map fields are initialized empty (never null) in the service constructor, so they are required + non-null here.

