  /tenant/notifications/{id}/read:
    put:
      operationId: markTenantNotificationRead
      summary: Mark one in-app notification read
      description: 'Stamps read_at on a single tenant in-app notification. Idempotent — already-read rows keep their original read_at. Not behind the settings.update write gate: any member manages their own bell.'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Marked read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadStatusResponse'
        '400':
