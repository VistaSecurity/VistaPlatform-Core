      responses:
        '201':
          description: The created rule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantNotificationRule'
        '400':
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
  /tenant/rules/{id}:
    get:
      operationId: getTenantRule
      summary: Get one rule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The rule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantNotificationRule'
        '400':
          description: Invalid rule ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
        '404':
          description: Rule not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
    put:
      operationId: updateTenantRule
      summary: Update a rule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRuleRequest'
      responses:
        '200':
          description: The updated rule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantNotificationRule'
        '400':
          description: Invalid rule ID or request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
    delete:
      operationId: deleteTenantRule
      summary: Delete a rule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 'Deleted — `{ "status": "deleted" }`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '400':
          description: Invalid rule ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
  /tenant/delivery-status:
    get:
      operationId: getTenantDeliveryStatus
      summary: Whether operator-configured delivery transports can deliver
      description: >
        Requires `settings.read`. Today this reports email only: with no SMTP
        host configured (tenant override, platform email settings, or SMTP_HOST)
        every email channel is inert, and the Settings card says so.
      responses:
        '200':
          description: Per-transport delivery availability.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantDeliveryStatus'
        '403':
          description: The caller lacks `settings.read`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
  /tenant/history:
    get:
      operationId: getTenantHistory
      summary: List the tenant's sent-notification history
      description: 'Returns the tenant''s notification history (most recent first). Always a non-null array — empty when there is none.'
      parameters:
        - name: limit
          in: query
          required: false
          description: Max rows to return (1–100, default 50).
          schema:
            type: integer
      responses:
        '200':
          description: The notification history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantHistoryListResponse'
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
  /tenant/notifications:
    get:
      operationId: getTenantInAppNotifications
      summary: List the tenant's in-app notifications
      description: 'Returns up to 100 in-app notifications (most recent first), wrapped under `notifications` (always a non-null array).'
      responses:
        '200':
          description: The tenant's in-app notifications.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InAppNotificationListResponse'
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
  /tenant/notifications/{id}/read:
    put:
      operationId: markTenantNotificationRead
      summary: Mark one in-app notification read
      description: 'Stamps read_at on a single tenant in-app notification. Idempotent — already-read rows keep their original read_at. Not behind the settings.update write gate: any member manages their own bell.'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Marked read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadStatusResponse'
        '400':
          description: Invalid notification ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
  /tenant/notifications/read-all:
    put:
      operationId: markAllTenantNotificationsRead
      summary: Mark all in-app notifications read
      description: 'Stamps read_at on every unread tenant in-app notification.'
      responses:
        '200':
          description: Marked read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadStatusResponse'
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
  /platform/notifications:
    get:
      operationId: getPlatformInAppNotifications
      summary: List the platform operator in-app inbox
      description: 'The admin-ui bell feed (platform_in_app_notifications — platform-scoped alerts, no tenant). Up to 100 rows, most recent first, wrapped under `notifications`. Gated by ANY platform permission (the bell is for every platform staffer), not platform.notifications.manage.'
      responses:
        '200':
          description: The platform in-app notifications.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformInAppNotificationListResponse'
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
  /platform/notifications/{id}/read:
    put:
      operationId: markPlatformNotificationRead
      summary: Mark one platform in-app notification read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Marked read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadStatusResponse'
        '400':
          description: Invalid notification ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
  /platform/notifications/read-all:
    put:
      operationId: markAllPlatformNotificationsRead
      summary: Mark all platform in-app notifications read
      responses:
        '200':
          description: Marked read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadStatusResponse'
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
  /platform/history:
    get:
      operationId: getPlatformHistory
      summary: List the platform-wide sent-notification history
      description: 'Platform/admin (admin-ui) twin of GET /tenant/history — the platform-wide notification history (rows with tenant_id IS NULL), most recent first. Always a non-null array; empty when there is none. (Previously this handler queried then discarded the rows and always returned empty — fixed in #299.)'
      parameters:
        - name: limit
          in: query
          required: false
          description: Max rows to return (1–100, default 50).
          schema:
            type: integer
      responses:
        '200':
          description: The platform notification history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformHistoryListResponse'
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'

  # ===========================================================================
  # Platform notification channels + rules (admin-ui). Behind platform-admin auth.
  # UI consumers: admin-ui platform-notification-channels-page / -rules-page (inline
  # api() calls, not a service-layer client).
  # ===========================================================================
  /platform/channels:
    get:
      operationId: listPlatformChannels
      tags: [platform-notifications]
      summary: List platform notification channels
      description: 'Returns a bare array; null when none exist.'
      responses:
        '200':
          description: The platform channels.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformChannelList'
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
    post:
      operationId: createPlatformChannel
      tags: [platform-notifications]
      summary: Create a platform notification channel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChannelRequest'
      responses:
        '201':
          description: The created channel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformNotificationChannel'
        '400':
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
