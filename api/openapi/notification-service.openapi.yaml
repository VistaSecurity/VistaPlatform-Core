  /tenant/history:
    get:
      operationId: getTenantHistory
      summary: List the tenant's sent-notification history
      description: 'Returns the tenant''s notification history (most recent first). Always a non-null array — empty when there is none.'
      parameters:
        - name: limit
          in: query
          required: false
          description: Max rows to return (1–100, default 50).
          schema:
            type: integer
      responses:
