    get:
      operationId: getPlatformHistory
      summary: List the platform-wide sent-notification history
      description: 'Platform/admin (admin-ui) twin of GET /tenant/history — the platform-wide notification history (rows with tenant_id IS NULL), most recent first. Always a non-null array; empty when there is none. (Previously this handler queried then discarded the rows and always returned empty — fixed in #299.)'
