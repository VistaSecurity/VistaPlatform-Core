openapi: 3.1.0
info:
  title: Vista Platform — notification-service API
  version: 0.1.0
  description: |
    Spec-first contract for notification-service (ADR-0001). First slice for this
    service, covering the **tenant notification settings** surface — the two
    Settings → Organization pages a Tenant Admin uses to manage delivery
    channels and the rules that route alerts to them. UI consumers:
    `web-ui/src/pages/notification-channels-page.tsx` and
    `web-ui/src/pages/notification-rules-page.tsx`.

    ## Testability note

    The HTTP handlers are methods on `*Server` that delegate to two concrete
    service objects (`*services.ChannelManager`, `*services.RuleEngine`). This
    slice landed a behaviour-preserving field→interface refactor first: those
    two `Server` fields are now narrow interfaces (`channelManagerIface` /
    `ruleEngineIface`) the concrete services still satisfy
    (`services/notification-service/internal/api/server.go`), which makes the
    real gin handlers contract-testable against in-memory stubs — no database.
    See the Go contract test
    (`services/notification-service/internal/api/notifications_contract_test.go`).

    ## Scope of this spec

    The Tenant Admin endpoints on `/api/v1/notification-service/tenant/...`:

      - `GET/POST           /tenant/channels`           — list / create a channel
      - `GET/PUT/DELETE     /tenant/channels/{id}`      — get / update / delete
      - `POST               /tenant/channels/{id}/test` — send a test notification
      - `GET/POST           /tenant/rules`              — list / create a rule
      - `GET/PUT/DELETE     /tenant/rules/{id}`         — get / update / delete

    Out of scope (this slice): the platform channels/rules (`/platform/*`,
    admin-ui), the `/tenant/history` + `/tenant/notifications` read endpoints
    (those query `*sqlx.DB` inline — a separate repo extraction), and the
    internal service-to-service `/internal/send` endpoint.

    ## Shape status

    These document the current pre-envelope shapes — lists are returned as bare
    JSON arrays, single objects bare, delete/test as `{ "status": "..." }`,
    errors as a single string under `error`. They predate the ADR-0002 response
    envelope and are pinned here as-is so drift is caught.
servers:
  - url: /api/v1/notification-service
    description: Via the API gateway (cookie auth + CSRF), tenant-admin scoped.
paths:
  /tenant/channels:
    get:
      operationId: listTenantChannels
      summary: List the tenant's notification channels
      description: >
        Requires `settings.read`. Credentials in each channel's `config` are
        masked in the response — see `TenantNotificationChannel.config`.
      responses:
        '200':
          description: The tenant's channels (bare array; null when none exist).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantChannelListResponse'
        '403':
          description: The caller lacks `settings.read`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
    post:
      operationId: createTenantChannel
      summary: Create a notification channel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChannelRequest'
      responses:
        '201':
          description: The created channel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantNotificationChannel'
        '400':
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
  /tenant/channels/{id}:
    get:
      operationId: getTenantChannel
      summary: Get one channel
      description: >
        Requires `settings.read`. Credentials in `config` are masked in the
        response — see `TenantNotificationChannel.config`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The channel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantNotificationChannel'
        '403':
          description: The caller lacks `settings.read`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
        '400':
          description: Invalid channel ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
        '404':
          description: Channel not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
    put:
      operationId: updateTenantChannel
      summary: Update a channel
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateChannelRequest'
      responses:
        '200':
          description: The updated channel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantNotificationChannel'
        '400':
          description: Invalid channel ID or request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
    delete:
      operationId: deleteTenantChannel
      summary: Delete a channel
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 'Deleted — `{ "status": "deleted" }`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '400':
          description: Invalid channel ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
  /tenant/channels/{id}/test:
    post:
      operationId: testTenantChannel
      summary: Send a test notification through a channel
      description: >
        Delivers a test notification through the channel and reports the real
        outcome. A channel that did not deliver answers 422 with a sanitized
        `reason` (see `ChannelTestFailure`). A PagerDuty test triggers and
        immediately resolves a throwaway incident, so it leaves nothing open.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 'Test dispatched — `{ "status": "test_sent" }`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '400':
          description: Invalid channel ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
        '404':
          description: Channel not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
        '422':
          description: The channel did not deliver the test. `reason` says why.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelTestFailure'
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
