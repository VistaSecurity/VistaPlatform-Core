  /platform/maintenance-windows:
    get:
      operationId: listMaintenanceWindows
      tags: [platform-notifications]
      summary: List maintenance windows
      description: >
        Returns recent and upcoming maintenance windows (from 7 days ago
        onward), newest first. While a window is active, notification-service
        suppresses delivery of all notifications (storm control §10.3).
      responses:
        '200':
          description: The maintenance windows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceWindowListResponse'
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
    post:
      operationId: createMaintenanceWindow
      tags: [platform-notifications]
      summary: Create a maintenance window
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMaintenanceWindowRequest'
      responses:
        '201':
          description: The created maintenance window.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceWindow'
        '400':
          description: Invalid body, or `ends_at` is not after `starts_at`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
  /platform/maintenance-windows/{id}:
    delete:
      operationId: deleteMaintenanceWindow
      tags: [platform-notifications]
      summary: Delete a maintenance window
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Deletion confirmation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '400':
          description: Invalid window ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
        '404':
          description: Maintenance window not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
components:
  schemas:
    TenantNotificationChannel:
      type: object
      additionalProperties: false
      description: |
        A tenant delivery channel (models.TenantNotificationChannel). `config` is
        always present but null when unset; `test_status`, `last_test_at`,
        `last_used_at`, `description` and `created_by` are omitempty — present
        only when set.
      required:
        - id
        - tenant_id
        - channel_name
        - channel_type
        - config
        - enabled
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        channel_name:
          type: string
        channel_type:
          type: string
          description: "email / slack / webhook / pagerduty / teams (delivery transport)."
        config:
          type: [object, 'null']
          additionalProperties: true
          description: >
            Delivery configuration with every credential MASKED: a URL keeps
            only its scheme and host (`https://hooks.example.test/••••`), any
            other secret keeps only its last four characters (`••••wxyz`, or
            just `••••` when short). Credentials are the `webhook_url`, `url`,
            `integration_key`, token/password-style keys, every value under
            `headers`, and `auth.token` / `auth.username` / `auth.password`.
            Recipients, `channel` and `auth.type` are returned as-is. The real
            values are never returned by this API.
        enabled:
          type: boolean
        test_status:
          type: string
        last_test_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
        description:
          type: string
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        signing_secret:
          type: string
          description: >
            Present ONLY on the response to creating a generic webhook channel
            that has no signing secret of its own: the server-generated HMAC
            secret, shown once. It is write-only afterwards (masked like every
            other credential in `config.webhook_secret`); rotate it by sending a
            new `config.webhook_secret`.
    TenantNotificationRule:
      type: object
      additionalProperties: false
      description: |
        A tenant alert-routing rule (models.TenantNotificationRule). `channel_ids`
        is always present but null when unset; `alert_type`, `severity_filter`,
        `category_filter` and `digest_window` are omitempty.
      required:
        - id
        - tenant_id
        - rule_name
        - alert_source
        - channel_ids
        - frequency
        - enabled
        - priority
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        rule_name:
          type: string
        alert_source:
          type: string
        alert_type:
          type: string
        channel_ids:
          type: [array, 'null']
          items:
            type: string
            format: uuid
        severity_filter:
          type: array
          items:
            type: string
        category_filter:
          type: array
          items:
            type: string
        frequency:
          type: string
          description: "immediate / digest (delivery cadence)."
        digest_window:
          type: integer
          description: Digest window in minutes.
        enabled:
          type: boolean
        priority:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TenantChannelListResponse:
      type: [array, 'null']
      description: 'CURRENT shape for GET /tenant/channels — a bare array, null when none exist.'
      items:
        $ref: '#/components/schemas/TenantNotificationChannel'
    TenantRuleListResponse:
      type: [array, 'null']
      description: 'CURRENT shape for GET /tenant/rules — a bare array, null when none exist.'
      items:
        $ref: '#/components/schemas/TenantNotificationRule'
    CreateChannelRequest:
      type: object
      additionalProperties: false
      description: Body for POST /tenant/channels.
      required:
        - channel_name
        - channel_type
        - config
      properties:
        channel_name:
          type: string
        channel_type:
          type: string
        config:
          type: object
          additionalProperties: true
        enabled:
          type: boolean
        description:
          type: string
    UpdateChannelRequest:
      type: object
      additionalProperties: false
      description: Body for PUT /tenant/channels/{id}. All fields optional.
      properties:
        channel_name:
          type: string
        config:
          type: object
          additionalProperties: true
          description: >
            Replaces the channel's config. A credential that is omitted, empty,
            or equal to the masked form returned by GET keeps its stored value,
            so a client can echo a GET body back (or leave a secret field
            blank) without destroying the credential; only a new value replaces
            it. Omitting a whole nested object (`auth`, `headers`) removes it,
            and an omitted header is a removed header.
        enabled:
          type: boolean
        description:
          type: string
    CreateRuleRequest:
      type: object
      additionalProperties: false
      description: Body for POST /tenant/rules.
      required:
        - rule_name
        - alert_source
        - channel_ids
      properties:
        rule_name:
          type: string
        alert_source:
          type: string
        alert_type:
          type: string
        channel_ids:
          type: array
          items:
            type: string
            format: uuid
        severity_filter:
          type: array
          items:
            type: string
        category_filter:
          type: array
          items:
            type: string
        frequency:
          type: string
        digest_window:
          type: integer
        enabled:
          type: boolean
        priority:
          type: integer
    UpdateRuleRequest:
      type: object
      additionalProperties: false
      description: Body for PUT /tenant/rules/{id}. All fields optional.
      properties:
        rule_name:
          type: string
        alert_type:
          type: string
        channel_ids:
          type: array
          items:
            type: string
            format: uuid
        severity_filter:
          type: array
          items:
            type: string
        category_filter:
          type: array
          items:
            type: string
        frequency:
          type: string
        digest_window:
          type: integer
        enabled:
          type: boolean
        priority:
          type: integer
    StatusResponse:
      type: object
      additionalProperties: false
      description: 'Bare status envelope for delete / test — e.g. `{ "status": "deleted" }`.'
      required:
        - status
      properties:
        status:
          type: string
    ChannelTestFailure:
      type: object
      additionalProperties: false
      description: >
        A channel Test that did not deliver. `reason` is a sanitized sentence from
        a fixed vocabulary — it never contains the channel's URL, query string,
        headers, tokens or the remote's response body — so it is safe to show.
      required:
        - status
        - error
        - reason
      properties:
        status:
          type: string
          enum: [test_failed]
        error:
          type: string
          description: Legacy generic message, kept for clients that only read `error`.
        reason:
          type: string
          description: Why the channel did not deliver, e.g. "Email delivery isn't configured by the platform operator."
        permanent:
          type: boolean
          description: True when retrying cannot help (misconfiguration, rejected address), false when it may be transient.
    TenantDeliveryStatus:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: object
          additionalProperties: false
          required:
            - configured
          properties:
            configured:
              type: boolean
              description: >
                False when no SMTP host is configured anywhere — every email
                channel then fails with "not configured" instead of retrying.
    MaintenanceWindow:
      type: object
      additionalProperties: false
      description: >
        A platform-scoped delivery-suppression window (models.MaintenanceWindow;
        storm control §10.3). While one is active, notification-service
        suppresses delivery of all notifications. `created_by` is omitted when
        unset (the Go model tags it `omitempty`).
      required:
        - id
        - starts_at
        - ends_at
        - reason
        - created_at
      properties:
        id:
          type: string
          format: uuid
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        reason:
          type: string
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
    MaintenanceWindowListResponse:
      type: object
      additionalProperties: false
      description: 'Envelope for GET /platform/maintenance-windows — `{ "windows": [...] }`.'
      required:
        - windows
      properties:
        windows:
          type: array
          items:
            $ref: '#/components/schemas/MaintenanceWindow'
    CreateMaintenanceWindowRequest:
      type: object
      additionalProperties: false
      description: Body for POST /platform/maintenance-windows. `ends_at` must be after `starts_at`.
      required:
        - starts_at
        - ends_at
      properties:
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        reason:
          type: string
    PlatformNotificationChannel:
      type: object
      additionalProperties: false
      description: |
        A platform-scoped notification channel (models.PlatformNotificationChannel).
        Mirrors TenantNotificationChannel without tenant_id. `config` is always
        present (null when unset); `test_status`/`last_test_at`/`last_used_at`/
        `description`/`created_by`/`updated_by` are omitempty.
      required:
        - id
        - channel_name
        - channel_type
        - config
        - enabled
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        channel_name:
          type: string
        channel_type:
          type: string
        config:
          type: [object, 'null']
          additionalProperties: true
          description: >
            Delivery configuration with every credential MASKED, exactly as for
            tenant channels (see `TenantNotificationChannel.config`). On update a
            credential that is omitted, blank or still in its masked form keeps
            its stored value.
        enabled:
          type: boolean
        test_status:
          type: string
        last_test_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
        description:
          type: string
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        updated_by:
          type: string
          format: uuid
    PlatformNotificationRule:
      type: object
      additionalProperties: false
      description: |
        A platform-scoped notification rule (models.PlatformNotificationRule).
        Mirrors TenantNotificationRule without tenant_id. `channel_ids` is always
        present (null when unset); `alert_type`/`severity_filter`/`category_filter`/
        `digest_window` are omitempty.
      required:
        - id
        - rule_name
        - alert_source
        - channel_ids
        - frequency
        - enabled
        - priority
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        rule_name:
          type: string
        alert_source:
          type: string
        alert_type:
          type: string
        channel_ids:
          type: [array, 'null']
          items:
            type: string
            format: uuid
        severity_filter:
          type: array
          items:
            type: string
        category_filter:
          type: array
          items:
            type: string
        frequency:
          type: string
        digest_window:
          type: integer
        enabled:
          type: boolean
        priority:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PlatformChannelList:
      type: [array, 'null']
      description: 'Bare array of platform channels (null when none exist).'
      items:
        $ref: '#/components/schemas/PlatformNotificationChannel'
    PlatformRuleList:
      type: [array, 'null']
      description: 'Bare array of platform rules (null when none exist).'
      items:
        $ref: '#/components/schemas/PlatformNotificationRule'
    LegacyError:
      type: object
      additionalProperties: true
      description: CURRENT error shape — a single human-readable string under `error`. Superseded by the ADR-0002 Error envelope as endpoints are hardened.
      required:
        - error
      properties:
        error:
          type: string
    NotificationHistory:
      type: object
      additionalProperties: false
      description: |
        A sent-notification history row (models.NotificationHistory). `tenant_id`
        is omitempty; `metadata` is always present but null when unset.
      required:
        - id
        - notification_type
        - alert_source
        - alert_type
        - severity
        - message
        - channels_used
        - status
        - metadata
        - created_at
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        notification_type:
          type: string
        alert_source:
          type: string
        alert_type:
          type: string
        severity:
          type: string
          description: "critical / high / medium / low / info."
        message:
          type: string
        channels_used:
          type: [array, 'null']
          items:
            type: string
        status:
          type: string
          description: >
            `sent` — every attempted channel delivered. `partial` — at least one
            delivered and at least one did not (failed channels that are still
            queued for retry count as not delivered). `failed` — none delivered.
            `pending` — only queued for a digest. The delivery retry worker
            updates this row when a queued retry succeeds or is abandoned.
        metadata:
          type: [object, 'null']
          additionalProperties: true
          description: >
            The notification's own metadata plus delivery bookkeeping.
            `channel_results` is an array with one entry per attempted channel —
            `{ channel_id, channel_type, status: sent | retrying | failed,
            retries_exhausted? }` — and `last_retry_at` is set once the retry
            worker has touched the row. Delivery error text is deliberately not
            included.
        created_at:
          type: string
          format: date-time
    InAppNotification:
      type: object
      additionalProperties: false
      description: |
        A tenant in-app notification (models.InAppNotification). `job_id`,
        `finding_id` and `read_at` are omitempty — present only when set.
      required:
        - id
        - tenant_id
        - type
        - title
        - message
        - created_at
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        type:
          type: string
          description: "alert / discovery / compliance / system / billing / security / other."
        title:
          type: string
        message:
          type: string
        job_id:
          type: string
          format: uuid
        finding_id:
          type: string
          format: uuid
        read_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    TenantHistoryListResponse:
      type: array
      description: 'CURRENT shape for GET /tenant/history — a bare array (non-null; empty when none).'
      items:
        $ref: '#/components/schemas/NotificationHistory'
    PlatformHistoryListResponse:
      type: array
      description: 'CURRENT shape for GET /platform/history — a bare array of platform-wide history rows (non-null; empty when none). Same NotificationHistory shape as the tenant history.'
      items:
        $ref: '#/components/schemas/NotificationHistory'
    InAppNotificationListResponse:
      type: object
      additionalProperties: false
      description: 'CURRENT envelope for GET /tenant/notifications — `{ "notifications": [...] }` (non-null array).'
      required:
        - notifications
      properties:
        notifications:
          type: array
          items:
            $ref: '#/components/schemas/InAppNotification'
    PlatformInAppNotification:
      type: object
      description: 'A platform-scoped in-app notification (operator inbox row). No tenant column.'
      required:
        - id
        - type
        - title
        - message
        - created_at
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
        title:
          type: string
        message:
          type: string
        read_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    PlatformInAppNotificationListResponse:
      type: object
      additionalProperties: false
      description: 'Envelope for GET /platform/notifications — `{ "notifications": [...] }` (non-null array).'
      required:
        - notifications
      properties:
        notifications:
          type: array
          items:
            $ref: '#/components/schemas/PlatformInAppNotification'
    ReadStatusResponse:
      type: object
      additionalProperties: false
      description: 'Ack envelope for the mark-read endpoints — `{ "status": "read" }`.'
      required:
        - status
      properties:
        status:
          type: string
          enum: [read]
