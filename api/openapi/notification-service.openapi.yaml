        '400':
          description: Invalid channel ID or body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
    delete:
      operationId: deletePlatformChannel
      tags: [platform-notifications]
      summary: Delete a platform notification channel
      responses:
        '200':
          description: Deletion confirmation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '400':
          description: Invalid channel ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
  /platform/channels/{id}/test:
    post:
      operationId: testPlatformChannel
      tags: [platform-notifications]
      summary: Send a test notification through a platform channel
      parameters:
        - name: id
          in: path
          required: true
