        - is_active
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        policy_name:
          type: string
        event_type:
          type: string
        compliance_framework:
          type: string
        hot_storage_days:
          type: integer
        cold_storage_days:
          type: integer
        total_retention_days:
          type: integer
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    RetentionPolicyResponse:
      type: object
      additionalProperties: false
      description: 'Envelope `{ "policy": ... }` for single-policy endpoints.'
      required:
        - policy
