        - type
        - enabled
        - config
        - filters
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
          description: "splunk / datadog / elastic / generic_webhook."
        enabled:
          type: boolean
        config:
          type: object
          additionalProperties: true
        filters:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SIEMIntegrationResponse:
      type: object
      additionalProperties: false
      description: 'Envelope `{ "integration": ... }`.'
      required:
        - integration
      properties:
        integration:
          $ref: '#/components/schemas/SIEMIntegration'
    SIEMIntegrationListResponse:
      type: object
      additionalProperties: false
      description: 'Envelope `{ "integrations": [...] }`. `integrations` is null when none are configured.'
      required:
        - integrations
      properties:
        integrations:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/SIEMIntegration'
    SIEMTypesResponse:
      type: object
      additionalProperties: false
      description: 'Envelope `{ "types": [...] }` — static catalog of supported integration types with their config fields.'
      required:
        - types
      properties:
        types:
          type: array
          items:
            type: object
            additionalProperties: true
    SIEMIntegrationInput:
      type: object
      additionalProperties: true
      description: 'Body for POST/PUT/test SIEM integration (services.SIEMIntegration). Read-only fields are ignored.'
      properties:
        name:
          type: string
        type:
          type: string
        enabled:
          type: boolean
        config:
          type: object
          additionalProperties: true
        filters:
          type: object
          additionalProperties: true
    ComplianceSummaryResponse:
      type: object
      additionalProperties: false
      description: 'Envelope `{ "summary": {...} }` for /compliance-reports/summary. `summary` is a loosely-typed blob.'
      required:
        - summary
      properties:
        summary:
          type: object
          additionalProperties: true
    ComplianceTemplatesResponse:
      type: object
      additionalProperties: false
      description: 'Envelope `{ "templates": [...] }` — static catalog of compliance report templates.'
      required:
        - templates
      properties:
        templates:
          type: array
          items:
            type: object
            additionalProperties: true
    ComplianceReportResponse:
      type: object
      additionalProperties: false
      description: 'Envelope `{ "report": {...} }` for /compliance-reports/generate. `report` is a loosely-typed report blob (services.ComplianceReport).'
      required:
        - report
      properties:
        report:
          type: object
          additionalProperties: true
    GenerateComplianceReportRequest:
      type: object
      additionalProperties: true
      description: 'Body for POST /compliance-reports/generate.'
      required:
        - framework
        - start_date
        - end_date
      properties:
        framework:
          type: string
          description: "soc2 / iso27001 / gdpr / hipaa / pci_dss."
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
        tenant_id:
          type: [string, 'null']
          format: uuid
        format:
          type: string
          description: "json / pdf / excel (defaults to json)."
    LegacyError:
      type: object
      additionalProperties: true
      description: |
        CURRENT error shape returned by audit-service endpoints today: a single
        human-readable string under `error`. Unstructured — cannot be branched
        on safely. Superseded by the ADR-0002 `Error` envelope below as
        endpoints are hardened.
      required:
      - error
      properties:
        error:
          type: string
    Error:
      type: object
      additionalProperties: false
      description: ADR-0002 error envelope. Clients branch on `error.code`, never on `message`.
      required:
      - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
          - code
          - message
          properties:
            code:
              type: string
              description: Stable, machine-readable enum (e.g. activity_log_not_found).
            message:
              type: string
              description: Human-readable, safe to surface in UI.
            details:
              type: array
              items:
                $ref: '#/components/schemas/ErrorDetail'
            request_id:
              type: string
              description: For support correlation.
    ErrorDetail:
      type: object
      additionalProperties: false
      required:
      - field
      - issue
      properties:
        field:
          type: string
        issue:
          type: string
    Pagination:
      type: object
      additionalProperties: false
      description: ADR-0002 pagination block for collection envelopes.
      required:
      - total
      - limit
      - offset
      properties:
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        next_offset:
          type:
          - integer
          - 'null'
          description: Offset of the next page, or null when there are no more.
