        policy:
          $ref: '#/components/schemas/RetentionPolicy'
    RetentionPolicyListResponse:
      type: object
      additionalProperties: false
      description: 'Envelope `{ "policies": [...] }`. `policies` is null when none exist.'
      required:
        - policies
      properties:
        policies:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/RetentionPolicy'
    RetentionPolicyInput:
      type: object
      additionalProperties: true
      description: 'Body for POST/PUT /retention-policies (services.RetentionPolicy). Read-only fields are ignored.'
      properties:
        policy_name:
          type: string
        event_type:
          type: [string, 'null']
        compliance_framework:
          type: [string, 'null']
        hot_storage_days:
          type: integer
        cold_storage_days:
          type: [integer, 'null']
        total_retention_days:
          type: integer
        is_active:
          type: boolean
    Alert:
      type: object
      additionalProperties: false
      description: |
        A triggered alert (services.Alert). `sample_events`, `acknowledged_at`,
        `acknowledged_by`, `resolved_at` are omitempty.
      required:
        - id
        - rule_id
        - rule_name
        - severity
        - message
        - event_count
        - triggered_at
        - status
      properties:
        id:
          type: string
          format: uuid
        rule_id:
          type: string
          format: uuid
        rule_name:
          type: string
        severity:
          type: string
        message:
          type: string
        event_count:
          type: integer
        sample_events:
          type: array
          items:
            type: object
            additionalProperties: true
        triggered_at:
          type: string
          format: date-time
        acknowledged_at:
          type: string
          format: date-time
        acknowledged_by:
          type: string
          format: uuid
        resolved_at:
          type: string
          format: date-time
        status:
          type: string
          description: "open / acknowledged / resolved."
    AlertListResponse:
      type: object
      additionalProperties: false
      description: 'Envelope `{ "alerts": [...] }`. `alerts` is null when none match.'
      required:
        - alerts
      properties:
        alerts:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/Alert'
    AnalyticsSummaryResponse:
      type: object
      additionalProperties: false
      description: 'Envelope `{ "summary": {...} }` for /analytics/user-activity. `summary` is a loosely-typed analytics blob.'
      required:
        - summary
      properties:
        summary:
          type: object
          additionalProperties: true
    AnalyticsAnalysisResponse:
      type: object
      additionalProperties: false
      description: 'Envelope `{ "analysis": {...} }` for /analytics/access-patterns + /analytics/compliance-gaps. `analysis` is a loosely-typed blob.'
      required:
        - analysis
      properties:
        analysis:
          type: object
          additionalProperties: true
    AnalyticsDashboardResponse:
      type: object
      additionalProperties: false
      description: 'Envelope `{ "metrics": {...} }` for /analytics/dashboard. `metrics` is a loosely-typed blob.'
      required:
        - metrics
      properties:
        metrics:
          type: object
          additionalProperties: true
    SIEMIntegration:
