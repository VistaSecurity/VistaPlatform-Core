          format: uuid
        sensor_id:
          type: string
          format: uuid
        uptime_seconds:
          type: integer
        memory_usage_bytes:
          type: integer
        cpu_usage_percent:
          type: number
        packets_captured:
          type: integer
        discoveries_made:
          type: integer
        errors_count:
          type: integer
        recorded_at:
          type: string
          format: date-time
    PendingSensor:
      type: object
      additionalProperties: true
      description: |
        A pending sensor registration (models.PendingSensorRegistration). The
        handler may emit additional legacy fields; the stable fields the UI reads
        are pinned here.
      required:
      - id
      - tenant_id
      - registration_key
      - name
      - ip_address
      - profile
      - network_interfaces
      - tags
      - description
      - metadata
      - status
      - expires_at
      - used_at
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        registration_key:
          type: string
        name:
          type: string
        ip_address:
          type: string
        profile:
          type: string
          description: "'datacenter_host' | 'cloud_instance' | 'end_user_machine' | 'air_gapped' | 'device_interrogation'."
        network_interfaces:
          type:
          - array
          - 'null'
          items:
            type: string
        tags:
          type:
          - array
          - 'null'
          items:
            type: string
        description:
          type:
          - string
          - 'null'
        metadata:
          type:
          - object
          - 'null'
          additionalProperties: true
        status:
          type: string
          description: "'pending' | 'used' | 'expired' | 'cancelled'."
        expires_at:
          type: string
          format: date-time
        used_at:
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PendingSensorListResponse:
      type: object
      additionalProperties: false
      description: 'CURRENT envelope for GET /sensors/pending — `{ "pending_sensors": [...] }`.'
      required:
      - pending_sensors
      properties:
        pending_sensors:
          type: array
          items:
            $ref: '#/components/schemas/PendingSensor'
    PlatformCAResponse:
      type: object
      additionalProperties: false
      description: |
        Identity of the CA behind this platform's edge certificate, for an
        operator to compare against what an enrolling agent displays.
      required:
      - available
      - trusted_by_default
      properties:
        available:
          type: boolean
          description: Whether the platform's certificate could be inspected at all.
        reason:
          type: string
          description: |
            Why no fingerprint is shown — either because it could not be
            determined, or because the certificate is publicly trusted and no
            approval step exists.
        trusted_by_default:
          type: boolean
          description: |
            The edge certificate verifies against the public trust store. Agents
            enroll with no trust prompt, so there is nothing to compare.
        public_url:
          type: string
          description: The public origin that was inspected.
        fingerprint_sha256:
          type: string
          description: Lowercase unseparated hex SHA-256 of the CA certificate's DER bytes.
        fingerprint_display:
          type: string
          description: The same fingerprint, colon-grouped for a human to read against a terminal.
        subject:
          type: string
        issuer:
          type: string
        not_after:
          type: string
          format: date-time
        self_signed:
          type: boolean
          description: |
            False means the platform did not present its root and this is the
            issuer-most intermediate it did present.
    CreatePendingSensorRequest:
      type: object
      additionalProperties: true
      description: Request body for POST /sensors/pending.
      required:
      - name
      - ip_address
      - profile
      properties:
        name:
          type: string
        ip_address:
          type: string
        profile:
          type: string
        network_interfaces:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            type: string
        description:
          type: string
    CreatePendingSensorResponse:
      type: object
      additionalProperties: false
      description: CURRENT envelope for POST /sensors/pending success.
      required:
      - pending_sensor
      - installation_command
      properties:
        pending_sensor:
          $ref: '#/components/schemas/PendingSensor'
        installation_command:
          type: string
    LegacyError:
      type: object
      additionalProperties: true
      description: |
        CURRENT error shape returned by sensor-manager endpoints today: a single
        human-readable string under `error`. Some 400s carry extra sibling keys,
        so additionalProperties is permitted. Unstructured — cannot be branched
        on safely. Superseded by the ADR-0002 `Error` envelope below as
        endpoints are hardened.
      required:
      - error
      properties:
        error:
          type: string
    Error:
      type: object
      additionalProperties: false
      description: ADR-0002 error envelope. Clients branch on `error.code`, never on `message`.
      required:
      - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
          - code
          - message
          properties:
            code:
              type: string
              description: Stable, machine-readable enum (e.g. sensor_not_found).
            message:
              type: string
              description: Human-readable, safe to surface in UI.
            details:
              type: array
              items:
                $ref: '#/components/schemas/ErrorDetail'
            request_id:
              type: string
              description: For support correlation.
    ErrorDetail:
      type: object
      additionalProperties: false
      required:
      - field
      - issue
      properties:
        field:
          type: string
        issue:
          type: string
    Pagination:
      type: object
      additionalProperties: false
      description: ADR-0002 pagination block for collection envelopes.
      required:
      - total
      - limit
      - offset
      properties:
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        next_offset:
          type:
          - integer
          - 'null'
          description: Offset of the next page, or null when there are no more.
