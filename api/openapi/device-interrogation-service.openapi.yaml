        job_id:
          type: string
    InterrogateDeviceRequest:
      type: object
      additionalProperties: false
      description: |
        Optional body for POST /devices/{id}/interrogate. Every field is
        optional; an absent body means a plain device interrogation.
      properties:
        job_type:
          type: string
          enum: [device_interrogation, host_inventory]
          description: >
            What to run. Defaults to device_interrogation. cloud_discovery is
            not queued against a device — use /cloud/discover.
        mode:
          type: string
          enum: [remote]
          description: >
            host_inventory only, and it must be "remote". Local collection is
            agent-originated: the agent posts its own host's inventory on its own
            schedule, so a queued local job would never be claimed.
        transport:
          type: string
          enum: [ssh]
          default: ssh
          description: >
            host_inventory only. "ssh" reaches Linux, macOS and
            Windows-with-OpenSSH. "winrm" is recognised and refused — its Go
            client pulls MPL-2.0 dependencies outside this product's
            MIT/Apache/BSD dependency policy.
        agent_id:
          type: string
          format: uuid
          description: >
            Required for host_inventory: the collection runs FROM an agent that
            can reach the target host, and device_jobs' valid_job_assignment
            constraint requires the column for this job type.
        collect_connections:
          type: boolean
          default: false
          description: >
            host_inventory only. Explicit privacy opt-in for collecting the
            target's bounded remote-peer snapshot. Omitted or false leaves
            connection collection disabled.
    DeviceActionAccepted:
      type: object
      additionalProperties: true
      description: >
        Open envelope for the device action endpoints (interrogate /
        test-connection / bulk-interrogate). The concrete shape (queued-job id or
        live connectivity result) depends on live device I/O and is integration-
        tested, not contract-pinned — hence additionalProperties:true with no
        required fields.
    MessageResponse:
      type: object
      additionalProperties: false
      description: Bare acknowledgement envelope (e.g. delete).
      required:
      - message
      properties:
        message:
          type: string
    Device:
      type: object
      additionalProperties: false
      description: |
        An asset with management configured (models.Device, ADR-0002 D5).

        The `devices` table it used to mirror was removed in phase 1: a device
        is an asset of a hardware or cloud class that additionally has an
        `asset_management` row, and the Discovery -> Devices page is the filter
        "assets with management configured". `id` is therefore the ASSET id, and
        `asset_id` carries the same value spelled so a client does not have to
        infer it. `class` is what the device IS (the asset class); `device_type`
        names which vendor interrogator drives it, which is a different question
        — an F5 BIG-IP is class `load_balancer` with device_type `f5`.

        Field presence follows the json tags: the nullable pointer / JSONB
        fields are required-but-nullable (serialize as null when unset);
        credential_id / username / password are `omitempty` and appear only when
        set. password is masked server-side; the stored value is ciphertext.
      required:
      - id
      - asset_id
      - tenant_id
      - device_type
      - vendor
      - model
      - hostname
      - ip_address
      - management_url
      - serial_number
      - firmware_version
      - discovery_method
      - tls_insecure_skip_verify
      - connection_status
      - last_interrogated_at
      - interrogation_error
      - metadata
      - tags
      - created_at
      - updated_at
      - deleted_at
      properties:
        id:
          type: string
          format: uuid
          description: The asset id. Identical to asset_id.
        asset_id:
          type: string
          format: uuid
          description: |
            The asset this device is. Same value as `id`; both are present
            because there is no separate device id any more.
        tenant_id:
          type: string
          format: uuid
        class:
          type: string
          description: |
            Asset class key (shared/assetclass) — what the device IS:
            `load_balancer`, `firewall`, `switch`, `wireless_controller`,
            `object_storage`, ... Absent when nothing classified it.
        device_type:
          type: string
          description: |
            Which vendor interrogator drives this device — unifi / cisco /
            fortinet / palo_alto / f5, or a cloud resource kind such as
            `aws_s3_bucket`. NOT the asset class; see `class`.
        vendor:
          type: [string, 'null']
        model:
          type: [string, 'null']
        hostname:
          type: [string, 'null']
        ip_address:
          type: [string, 'null']
        management_url:
          type: [string, 'null']
        serial_number:
          type: [string, 'null']
        firmware_version:
          type: [string, 'null']
        discovery_method:
          type: string
        credential_id:
          type: string
          format: uuid
        username:
          type: string
        password:
          type: string
        tls_insecure_skip_verify:
          type: boolean
        connection_status:
          type: string
          description: connected / disconnected / error / unknown / testing.
        last_interrogated_at:
          type: [string, 'null']
          format: date-time
        interrogation_error:
          type: [string, 'null']
        metadata:
          type: [object, 'null']
          additionalProperties: true
        tags:
          type: [object, 'null']
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: [string, 'null']
          format: date-time
        ssh_host_key_fingerprint:
          type: string
          description: |
            The SSH host key pinned to this device on first contact, as
            `SHA256:...`. `omitempty` — absent means nothing is pinned yet, which
            is the enrolment state. Once present, an interrogation that meets a
            different key is refused during key exchange and no credential is
            sent; clear the pin (DELETE /devices/{id}/ssh-host-key) to accept a
            new one after a legitimate replacement or key rotation.
        ssh_host_key_type:
          type: string
          description: Algorithm of the pinned host key (e.g. ssh-ed25519). Absent when nothing is pinned.
        ssh_host_key_pinned_at:
          type: string
          format: date-time
          description: When the host key was pinned. Absent when nothing is pinned.
    Agent:
      type: object
      additionalProperties: false
      description: |
        A tenant's enrolled device interrogation agent (models.Agent). Telemetry
        mirrors the device_agents columns; the secret registration_key is omitted.
        `name` and `profile` are nullable (DB NULLs surface as JSON null) — they
        are carried from the pending registration at bootstrap time.
      required:
      - id
      - tenant_id
      - name
      - platform
      - profile
      - version
      - status
      - ip_address
      - last_heartbeat
      - created_at
      - updated_at
      - description
      - addresses
      - job_count
      - last_job_at
      - last_host_inventory_at
      - host_inventory_packages
      - host_inventory_listeners
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
          description: Operator-assigned agent name (carried from the pending registration); null when unset.
        platform:
          type: string
          description: Agent host platform (e.g. linux/amd64).
        profile:
          type: string
          nullable: true
          description: Registration profile (device_interrogation); null when unset.
        version:
          type: string
          description: Agent binary version.
        status:
          type: string
          description: 'Agent status: active, inactive, or error.'
        ip_address:
          type: string
          nullable: true
          description: |
            The agent host's primary address, self-reported on each heartbeat —
            the source address its kernel uses to reach the platform. Null until
            an agent new enough to report one checks in. The platform cannot
            derive this: NAT and ingress rewrite the connection source.
        last_heartbeat:
          type: string
          format: date-time
          nullable: true
          description: Last heartbeat timestamp; null if the agent has never checked in.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        description:
          type: string
          nullable: true
          description: |
            The operator's free-text note from the pending registration. Null when
            the registration carried none.
        addresses:
          type: array
          description: |
            Every address bound on the agent host, as reported by its own
            heartbeat, primary first. A discovery agent is routinely multi-homed,
            so `ip_address` alone (the single address it reaches the platform
            from) does not describe what it can reach. Empty for agents older than
            address reporting, or that have not yet checked in.
          items:
            $ref: '#/components/schemas/AgentAddress'
        job_count:
          type: integer
          description: All-time count of interrogation jobs assigned to this agent.
        last_job_at:
          type: string
          format: date-time
          nullable: true
          description: |
            When this agent's most recent job last moved (completed, else started,
            else created). Null if the agent has never been assigned one — which,
            with job_count, distinguishes "enrolled but unused" from "went quiet".
        last_host_inventory_at:
          type: string
          format: date-time
          nullable: true
          description: |
            When this agent last reported a HOST INVENTORY that reached the
            inventory — what it found out about the machine it is installed on,
            rather than what it was told to interrogate.

            A separate line from last_job_at because it answers a different
            question: a host inventory is not work an operator queued, so a busy
            agent that has never reported its own host looks identical on
            job_count alone. Null means it never has, which is usually
            HOST_INVENTORY_ENABLED being unset.
        host_inventory_packages:
          type: integer
          nullable: true
          description: |
            Software installs recorded from that collection — the number an
            inventory query would return, not the number the collector
            enumerated. Null when the agent has never reported, and also when the
            package step FAILED on the last run: a host whose package database
            could not be read and a host with no packages are different answers.
        host_inventory_listeners:
          type: integer
          nullable: true
          description: |
            Listening sockets recorded from that collection, each an endpoint on
            the host's asset. Null when the agent has never reported one.
    AgentAddress:
      type: object
      additionalProperties: false
      description: One address bound on an agent host (a public.agent_addresses row).
      required:
      - interface_name
      - address
      - prefix_length
      - is_primary
      properties:
        interface_name:
          type: string
          description: The interface the address is bound to (e.g. Ethernet, eth0).
        address:
          type: string
          description: |
            The bare address, without a prefix — rendered with SQL `host()` rather
            than a text cast, which would append "/24" and break any comparison
            against a bare IP.
        prefix_length:
          type: integer
          nullable: true
          description: Prefix length of the address's network; null when the agent reported a bare address.
        is_primary:
          type: boolean
          description: True for the address the agent reaches the platform from. At most one per agent.
    AgentListResponse:
      type: object
      additionalProperties: false
      description: 'Envelope for GET /agents — `{ "agents": [...], "count": N }`. On an empty/nil result `agents` can serialize as JSON null, so it is typed as a nullable array.'
      required:
      - agents
      - count
      properties:
        agents:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/Agent'
        count:
          type: integer
    DeviceListResponse:
      type: object
      additionalProperties: false
      description: 'CURRENT envelope for GET /devices — `{ "devices": [...] }`. On an empty/nil result `devices` can serialize as JSON null, so it is typed as a nullable array.'
      required:
      - devices
      properties:
        devices:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/Device'
    InterrogationJob:
      type: object
      additionalProperties: false
      description: |
        An interrogation job (handlers.InterrogationJob — the API response shape).
        The listed required fields are always present; every other field is
        `omitempty` and appears only when set.
      required:
      - id
      - tenant_id
      - job_type
      - status
      - created_at
      - updated_at
      - executor
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        job_type:
          type: string
        status:
          type: string
        asset_id:
          type: string
          format: uuid
          description: The asset the job targets (device_jobs.asset_id).
        device_id:
          type: string
          format: uuid
          description: |
            Deprecated alias of `asset_id`, carrying the same value for one
            release. Use `asset_id`.
        device_name:
          type: string
        device_type:
          type: string
        integration_id:
          type: string
          format: uuid
        integration_name:
          type: string
        cloud_provider:
          type: string
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        error_message:
          type: string
        progress:
          type: integer
        assets_discovered:
          type: integer
        identity:
          $ref: '#/components/schemas/CloudIdentitySummary'
        enumeration:
          $ref: '#/components/schemas/CloudEnumerationCounts'
        host_inventory:
          $ref: '#/components/schemas/HostInventoryCounts'
        duration_seconds:
          type: integer
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        agent_id:
          type: string
          format: uuid
          description: |
            device_jobs.agent_id. Absent means the in-cluster platform agent
            executed the job rather than a named device agent.
        executor:
          type: string
          description: |
            Human-readable resolution of agent_id: "Platform Agent" when no
            device agent was assigned, otherwise the executing device agent's
            name (or "Device Agent" if it has none).
    CloudIdentitySummary:
      type: object
      required: [assets_created, assets_matched, approval_pending, observations_retained, conflicts, rejected_inputs]
      properties:
        assets_created:
          type: integer
        assets_matched:
          type: integer
        approval_pending:
          type: integer
        observations_retained:
          type: integer
        conflicts:
          type: integer
        rejected_inputs:
          type: integer
    CloudEnumerationCounts:
      type: object
      additionalProperties: false
      description: |
        What a cloud discovery run's enumeration half found: compute instances,
        virtual networks, subnets and the distinct security groups it saw
        membership of (handlers.CloudEnumerationCounts).

        ABSENT on a job means enumeration did not run — the integration has
        `enumerate_compute` off, or the job is not a cloud discovery. Four
        zeros mean it ran and the account was empty. The two are different
        answers and are not flattened.

        Security groups are counted but are NOT assets: a security group is a
        policy object, recorded as the `cloud.security_groups` membership fact
        on the resources that are in it.
      required:
      - instances
      - networks
      - subnets
      - security_groups
      properties:
        instances:
          type: integer
        networks:
          type: integer
        subnets:
          type: integer
        security_groups:
          type: integer
    HostInventoryCounts:
      type: object
      additionalProperties: false
      description: |
        What a host-inventory run put into the inventory
        (handlers.HostInventoryCounts, asset-inventory workstream 2.11b): the
        asset the collection landed on, its facts, its listening sockets as
        endpoints, and its software installs.

        ABSENT on a job means it is not a host inventory, or the run never
        reached the consumer. Zeros mean one ran and landed nothing. The two are
        different answers and are not flattened.
      required:
      - facts
      - endpoints
      - installs_created
      - installs_removed
      properties:
        asset_id:
          type: string
          format: uuid
          description: |
            The asset this collection landed on. Absent when the identity was
            contested and the engine created nothing — see `contested`.
        observation_id:
          type: string
          format: uuid
          description: Durable identity evidence retained by the admission transaction.
        identity_outcome:
          type: string
          enum: [created, matched, conflict, unresolved]
          description: Identity resolution outcome, independently of monitoring approval.
        facts:
          type: integer
        endpoints:
          type: integer
          description: Listening sockets recorded as endpoints on the host's asset.
        packages:
          type: integer
          description: |
            Active measured software installs after the run — the number an
            inventory query would return, not the number the collector
            enumerated. ABSENT when the package step FAILED, which is not the
            same as zero: a host whose package database could not be read has
            not been enumerated at all, and no absent-install sweep ran for it.
        installs_created:
          type: integer
        installs_removed:
          type: integer
          description: |
            Installs the run marked `removed` because they were absent from it.
            Never a delete — the row keeps its first_seen_at, so "this was here
            in March and is gone now" stays answerable. A version UPGRADE shows
            here too: a new version is a different catalogue row, so the old
            one's install is removed and the new one created.
        contested:
          type: boolean
          description: |
            A merge proposal is waiting because the identity could not be
            settled — typically an agent id that matches one asset while the
            hardware serial says a different machine. Neither a failure nor a
            success: a person has to say which host this is.
        failed:
          type: string
          description: |
            The consumer's fatal error when the collection reached it and was
            NOT materialised. The report is on the job row and nothing was
            lost, but nothing below landed either: the counts are what the
            consumer had assembled when it failed. ABSENT on a run that
            materialised. Present, it changes what every other field means,
            and a log line must lead with it.
    Last24hStats:
      type: object
      additionalProperties: false
      required:
      - completed
      - failed
      properties:
        completed:
          type: integer
        failed:
          type: integer
    JobStats:
      type: object
      additionalProperties: false
      description: Aggregate interrogation-job statistics (handlers.JobStats).
      required:
      - total
      - pending
      - in_progress
      - completed
      - failed
      - last_24h
      properties:
        total:
          type: integer
        pending:
          type: integer
        in_progress:
          type: integer
        completed:
          type: integer
        failed:
          type: integer
        last_24h:
          $ref: '#/components/schemas/Last24hStats'
        average_duration_seconds:
          type: number
    PlatformHealthSummary:
      type: object
      additionalProperties: false
      description: |
        Aggregate health metrics across all tenants
        (services.PlatformHealthSummary), returned bare by GET /admin/metrics.
        Every field has a non-omitempty json tag, so all are always present;
        the two maps are constructed non-nil server-side (never JSON null).
      required:
      - total_devices
      - connected_devices
      - disconnected_devices
      - total_integrations
      - active_integrations
      - error_integrations
      - jobs_last_24h
      - successful_jobs_last_24h
      - failed_jobs_last_24h
      - success_rate
      - average_job_duration_ms
      - devices_by_type
      - integrations_by_provider
      properties:
        total_devices:
          type: integer
        connected_devices:
          type: integer
        disconnected_devices:
          type: integer
        total_integrations:
          type: integer
        active_integrations:
          type: integer
        error_integrations:
          type: integer
        jobs_last_24h:
          type: integer
        successful_jobs_last_24h:
          type: integer
        failed_jobs_last_24h:
          type: integer
        success_rate:
          type: number
        average_job_duration_ms:
          type: integer
        devices_by_type:
          type: object
          additionalProperties:
            type: integer
          description: Map of device_type → count (non-nil; empty object when no devices).
        integrations_by_provider:
          type: object
          additionalProperties:
            type: integer
          description: Map of provider → count (non-nil; empty object when no integrations).
    AdminAgent:
      type: object
      additionalProperties: false
      description: |
        A device interrogation agent enriched with tenant identity, for the
        platform-admin Fleet view (models.AdminAgent). Telemetry fields mirror
        the device_agents columns; the secret registration_key is omitted.
        `name`, `profile`, and `last_heartbeat` are nullable (DB NULLs surface
        as JSON null).
      required:
      - id
      - tenant_id
      - tenant_name
      - tenant_slug
      - name
      - platform
      - profile
      - version
      - status
      - effective_status
      - ip_address
      - last_heartbeat
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        tenant_name:
          type: string
          description: Tenant display name (from the tenants join; empty string if the tenant row is missing).
        tenant_slug:
          type: string
          description: Tenant slug (from the tenants join; empty string if the tenant row is missing).
        name:
          type: string
          nullable: true
          description: Operator-assigned agent name; null when unset.
        platform:
          type: string
          description: Agent host platform (e.g. linux/amd64).
        profile:
          type: string
          nullable: true
          description: Registration profile (e.g. device_interrogation); null when unset.
        version:
          type: string
          description: Agent binary version.
        status:
          type: string
          description: 'Agent status as stored: active, inactive, or error. Written active at enrollment and never updated by heartbeats — show effective_status instead.'
        effective_status:
          type: string
          enum: [active, offline, inactive, error]
          description: |
            What the Fleet view shows: `status`, except that an `active` agent
            whose last heartbeat is 15 minutes old or more (or that has never
            heartbeated) is `offline` — the same window the web-ui and the
            discovery_agent_offline alert use.
        ip_address:
          type: string
          nullable: true
          description: |
            The agent host's primary address, self-reported on each heartbeat —
            the source address its kernel uses to reach the platform. Null until
            an agent new enough to report one checks in. The platform cannot
            derive this: NAT and ingress rewrite the connection source.
        last_heartbeat:
          type: string
          format: date-time
          nullable: true
          description: Last heartbeat timestamp; null if the agent has never checked in.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AdminAgentListResponse:
      type: object
      additionalProperties: false
      description: 'Envelope for GET /admin/agents — `{ "agents": [...], "count": N }`. `agents` is a non-nil array.'
      required:
