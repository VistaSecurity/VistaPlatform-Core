          - id
          - status
          properties:
            id:
              type: string
              format: uuid
            status:
              type: string
    CloudIntegration:
      type: object
      additionalProperties: false
      description: |
        A cloud integration (handlers.CloudIntegration — the API response shape).
        `config` is the credential map with sensitive fields MASKED (never the
        plaintext or ciphertext). The listed required fields are always present;
        the rest are `omitempty`.
      required:
      - id
      - tenant_id
      - integration_type
      - integration_name
      - provider
      - config
      - is_enabled
      - status
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        integration_type:
          type: string
          description: aws / azure / gcp / ...
        integration_name:
          type: string
        provider:
          type: string
        config:
          type: [object, 'null']
          additionalProperties: true
          description: |
            Credential map with sensitive values masked. Untyped because the
            keys are provider-specific.
            AWS: `auth_mode` selects the credential shape — "access_key"
            (the default when the key is absent or empty) requires
            access_key_id + secret_access_key, with an optional session_token
            for temporary STS credentials; "assume_role" requires
            assume_role_arn and optionally external_id and role_session_name
            (default "vistaplatform-discovery"), with access_key_id /
            secret_access_key optional — when present the sts:AssumeRole call
            is signed with them, when absent the platform's ambient AWS
            credential chain is used.
            Masked keys (never returned in plaintext): access_key_id,
            secret_access_key, session_token, external_id, client_id,
            client_secret, service_account_json, api_key, password.
            assume_role_arn and role_session_name are NOT secret and are
            returned as stored.
            `enumerate_compute` (boolean, default TRUE when absent) decides
            whether a cloud discovery run for this integration also enumerates
            compute instances, virtual networks and subnets. It is not secret
            and is returned as stored.
        account_id:
          type: string
        region:
          type: string
        environment:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        is_enabled:
          type: boolean
        is_shared:
          type: boolean
        status:
          type: string
          description: pending / configured / connected / error.
        status_message:
          type: string
        last_tested_at:
          type: string
          format: date-time
        last_test_error:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateIntegrationRequest:
      type: object
      additionalProperties: false
      description: Request body for POST /integrations.
      required:
      - integration_type
      - integration_name
      - provider
      - config
      properties:
        integration_type:
          type: string
        integration_name:
          type: string
        provider:
          type: string
        config:
          type: object
          additionalProperties: true
          description: |
            Provider-specific credential map; see CloudIntegration.config for
            the AWS auth_mode contract and the list of keys stored encrypted.
            An AWS config is rejected unless it satisfies the resolved
            auth_mode: access_key needs access_key_id + secret_access_key,
            assume_role needs assume_role_arn.
        account_id:
          type: string
        region:
          type: string
        environment:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        is_enabled:
          type: boolean
    UpdateIntegrationRequest:
      type: object
      additionalProperties: false
      description: Request body for PUT /integrations/{id}. All fields optional.
      properties:
        integration_name:
          type: string
        config:
          type: object
          additionalProperties: true
          description: |
            Merged into the stored decrypted config, so omitted keys keep their
            existing values and secrets can be left untouched. See
            CloudIntegration.config for the AWS auth_mode contract.
        account_id:
          type: string
        region:
          type: string
        environment:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        is_enabled:
          type: boolean
    IntegrationListResponse:
      type: object
