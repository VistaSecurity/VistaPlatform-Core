      required:
      - jobs
      - total
      - page
      - page_size
      properties:
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/AdminInterrogationJob'
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
    QueueConsumer:
      type: object
      additionalProperties: false
      description: |
        Per-consumer backlog telemetry from JetStream ConsumerInfo
        (handlers.QueueConsumer). `depth` is num_pending (undelivered backlog),
        `in_flight` is num_ack_pending (delivered, awaiting ack), `num_waiting` is
        parked pull requests (idle workers). No rate/p95 — JetStream does not
        expose them.
      required:
      - name
      - depth
      - in_flight
      - num_waiting
      - num_redelivered
      properties:
        name:
          type: string
        depth:
          type: integer
          description: JetStream num_pending — undelivered backlog for this consumer.
        in_flight:
          type: integer
          description: JetStream num_ack_pending — delivered but not yet acked.
        num_waiting:
          type: integer
          description: Outstanding pull requests parked by idle workers.
        num_redelivered:
          type: integer
        last_delivered:
          type: string
          format: date-time
    AdminQueue:
      type: object
      additionalProperties: false
      description: |
        One JetStream stream and its per-consumer backlog breakdown
        (handlers.AdminQueue). Stream-level `messages`/`bytes` are total retained
        (subject to MaxAge), not a live depth — the meaningful depth is each
        consumer's `depth`.
      required:
      - name
      - subjects
      - messages
      - bytes
      - consumer_count
      - consumers
      properties:
        name:
          type: string
        subjects:
          type: array
          items:
            type: string
        messages:
          type: integer
          description: Stream State.Msgs — total messages retained in the stream.
        bytes:
          type: integer
          description: Stream State.Bytes.
        consumer_count:
          type: integer
        last_message_at:
          type: string
          format: date-time
        consumers:
          type: array
          items:
            $ref: '#/components/schemas/QueueConsumer'
    AdminQueueListResponse:
      type: object
      additionalProperties: false
      description: |
        Envelope for GET /admin/queues — `{ "queues": [...], "count": N,
        "metrics_note": "..." }`. `queues` is a non-nil array. `metrics_note`
        documents that per-queue rate/p95 are intentionally absent (JetStream
        does not expose them).
      required:
      - queues
      - count
      - metrics_note
      properties:
        queues:
          type: array
          items:
            $ref: '#/components/schemas/AdminQueue'
        count:
          type: integer
        metrics_note:
          type: string
    JobResponse:
      type: object
      additionalProperties: false
      description: 'CURRENT envelope for GET /jobs/{id} — `{ "job": {...} }`.'
      required:
      - job
      properties:
        job:
          $ref: '#/components/schemas/InterrogationJob'
    JobStatsResponse:
      type: object
      additionalProperties: false
      description: 'CURRENT envelope for GET /jobs/stats — `{ "stats": {...} }`.'
      required:
      - stats
      properties:
        stats:
          $ref: '#/components/schemas/JobStats'
    ActiveJobsResponse:
      type: object
      additionalProperties: false
      description: 'CURRENT envelope for GET /jobs/active — `{ "jobs": [...] }` (non-nil array).'
      required:
      - jobs
      properties:
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/InterrogationJob'
    JobResultsResponse:
      type: object
      additionalProperties: false
      description: |
        An interrogation job's discovered assets and what happened to them.

        This is a PROJECTION of the stored agent payload, never a passthrough:
        only the fields enumerated here are served, and the open-ended
        `metadata` map is additionally scrubbed of secret-looking fields. Vendor
        APIs return key material (mesh PSKs, device auth keys, SMTP passwords)
        alongside the crypto posture we want, and none of it may reach a client.
      required:
      - job_id
      - status
      - assets
      - summary
      properties:
        job_id:
          type: string
        status:
          type: string
        success:
          type: boolean
          description: The agent's own verdict on the interrogation run.
        assets:
          type: array
          items:
            $ref: '#/components/schemas/JobResultAsset'
        summary:
          $ref: '#/components/schemas/JobResultsSummary'
        processing:
          type: object
          additionalProperties: true
          description: |
            Post-processing verdict written by the result processor: per-asset
            outcomes (`steps`), de-duplicated `errors`, and counts for each
            pipeline stage. Absent on jobs that produced no assets or that ran
            before this was recorded.
        resource_types:
          type: array
          description: |
            A cloud discovery's per-resource-type outcome: what was asked for,
            what answered, and what could not be looked at.

            Absent for job kinds that do not collect by resource type, and for
            cloud providers that do not record outcomes yet. **Absent means
            "not reported", not "everything succeeded."**
          items:
            $ref: '#/components/schemas/JobResultResourceType'
        outcome:
          type: string
          enum: [complete, partial, failed]
          description: |
            The run verdict the per-type outcomes add up to. `complete` means
            every resource type that was attempted was collected without error
            — and it is the only verdict for which `success` is true.
        enumeration_skipped:
          type: string
          description: |
            Why account-wide compute/network enumeration did not run — switched
            off for the integration, or the failure that stopped it.
    JobResultResourceType:
      type: object
      additionalProperties: false
      description: |
        One requested cloud resource type's outcome. `succeeded` with `found: 0`
        means the account genuinely has none; `failed` means nothing is known
        about that type. Collapsing the two is the bug this exists to prevent.
      required:
      - resource_type
      - status
      - found
      - scopes_succeeded
      - scopes_attempted
      properties:
        resource_type:
          type: string
          description: As requested, e.g. `kms`, `s3`, `rds`, `alb`.
        status:
          type: string
          enum: [succeeded, partial, failed, not_attempted]
          description: |
            `succeeded` — every scope answered. `partial` — some scopes answered
            and some failed. `failed` — every scope attempted failed.
            `not_attempted` — requested, but this provider has no collector for
            it, so nothing looked.
        found:
          type: integer
          description: Resources this type produced. Meaningful only for succeeded/partial.
        scopes_succeeded:
          type: integer
          description: Regions (or `global`) that answered.
        scopes_attempted:
          type: integer
          description: Regions (or `global`) attempted. Zero for not_attempted.
        failures:
          type: array
          items:
            $ref: '#/components/schemas/JobResultCollectorFailure'
    JobResultCollectorFailure:
      type: object
      additionalProperties: false
      description: |
        One scope's collection failure, projected onto actionable fields. The
        provider's own error code survives verbatim — an AccessDenied is a
        different user action from a throttle — while the message is redacted
        of secret-shaped runs and length-capped before it is stored or served.
      properties:
        scope:
          type: string
          description: The region this failed in, or `global` for a non-regional API.
        reason:
          type: string
          enum: [access_denied, credentials, throttled, region_unavailable, timeout, network, unknown]
          description: Our classification of what the provider said.
        code:
          type: string
          description: The provider's own error code, e.g. `AccessDeniedException`.
        message:
          type: string
          description: The provider's message, sanitized and bounded.
    JobResultsSummary:
      type: object
      additionalProperties: false
      required:
      - total_assets
      - with_crypto
      - with_certificates
      properties:
        total_assets:
          type: integer
        with_crypto:
          type: integer
          description: Assets whose TLS posture was genuinely observed, as opposed to listed by a management API.
        with_certificates:
          type: integer
        materialized:
          type: integer
          description: |
            How many assets became a discovery finding. Sourced from the
            processing log rather than the asset count, so a pipeline failure
            shows as "12 discovered / 0 materialized" instead of hiding behind
            the total.
    JobResultAsset:
      type: object
      additionalProperties: false
      required:
      - crypto_observed
      properties:
        hostname:
          type: string
        ip_address:
          type: string
        port:
          type: integer
        protocol:
          type: string
        asset_type:
          type: string
        protocol_version:
          type: string
        cipher_suite:
          type: string
        key_exchange_algorithm:
          type: string
        hash_algorithm:
          type: string
        key_size:
          type: integer
        tls_versions:
          type: array
          items:
            type: string
        supported_ciphers:
          type: array
          items:
            type: string
        cert_validation_status:
          type: string
        cert_validation_error:
          type: string
        certificates:
          type: array
          items:
            $ref: '#/components/schemas/JobResultCertificate'
        service_name:
          type: string
        crypto_observed:
          type: boolean
          description: |
            True when a handshake was actually measured (a cipher suite or
            negotiated version is present). False means the asset was listed by
            a management API and never probed — which is why its crypto fields
            are empty. Without this flag "not measured" reads as "nothing found".
        metadata:
          type: object
          additionalProperties: true
          description: Vendor inventory fields, scrubbed of secret-looking keys.
    JobResultCertificate:
      type: object
      additionalProperties: false
      properties:
        subject_dn:
          type: string
        issuer_dn:
          type: string
        serial_number:
          type: string
        fingerprint_sha256:
          type: string
        not_before:
          type: string
        not_after:
          type: string
        key_algorithm:
          type: string
        key_size:
          type: integer
        signature_alg:
          type: string
        subject_alternative_names:
          type: array
          items:
            type: string
        self_signed:
          type: boolean
    LegacyError:
      type: object
      additionalProperties: true
      description: CURRENT error shape — a single human-readable string under `error`. Superseded by the ADR-0002 Error envelope as endpoints are hardened.
      required:
      - error
      properties:
        error:
          type: string
    Error:
      type: object
      additionalProperties: false
      description: ADR-0002 error envelope. Clients branch on `error.code`, never on `message`.
      required:
      - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
          - code
          - message
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                $ref: '#/components/schemas/ErrorDetail'
            request_id:
              type: string
    ErrorDetail:
      type: object
      additionalProperties: false
      required:
      - field
      - issue
      properties:
        field:
          type: string
        issue:
          type: string
    Pagination:
      type: object
      additionalProperties: false
      description: ADR-0002 pagination block for collection envelopes.
      required:
      - total
      - limit
      - offset
      properties:
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        next_offset:
          type:
          - integer
          - 'null'
