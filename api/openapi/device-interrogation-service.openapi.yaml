openapi: 3.1.0
info:
  title: Vista Platform — device-interrogation-service API
  version: 0.1.0
  description: |
    Spec-first contract for device-interrogation-service (ADR-0001). First slice
    for this service, covering the **interrogation jobs** read surface — the job
    list / detail / stats / active / results views the Operations area shows for
    device + cloud discovery runs. UI consumer:
    `web-ui/src/services/interrogation-jobs-api.ts`.

    ## Testability note

    Unlike the earlier slices, this service's job handlers queried `*sql.DB`
    inline. This slice landed a behaviour-preserving refactor first: the SQL was
    relocated verbatim into a `jobRepository` behind a `jobStore` interface that
    `JobHandlers` now depends on (`services/device-interrogation-service/internal/handlers/jobs_repository.go`),
    which is what makes the handlers contract-testable with an in-memory stub —
    no database. See the Go contract test
    (`services/device-interrogation-service/internal/handlers/jobs_contract_test.go`).

    ## Scope of this spec

    The jobs read endpoints on `/api/v1/device-interrogation-service/...`:

      - `GET /jobs`            — list (paginated, filtered)
      - `GET /jobs/stats`      — aggregate job statistics
      - `GET /jobs/active`     — currently pending/in-progress jobs
      - `GET /jobs/{id}`       — get one
      - `GET /jobs/{id}/results` — a job's results (placeholder shape today)

    Out of scope (this slice): the job mutations (`POST /jobs/{id}/retry`,
    `/cancel`), and the integrations / devices / cloud / schedules / agents /
    downloads / experimental surfaces on this service (each needs the same
    repo-interface refactor first).

    ## Shape status

    These document the current pre-envelope shapes (lists wrapped under `jobs`
    with `total`/`page`/`page_size`, single under `{ "job": {...} }`, stats under
    `{ "stats": {...} }`, errors as `{ "error": "string" }`). The go-forward
    ADR-0002 envelope is defined under components.schemas for future hardening.
  contact:
    name: Vista Security
servers:
- url: /api/v1/device-interrogation-service
  description: device-interrogation-service v1, mounted behind the API gateway.
tags:
- name: interrogation-jobs
  description: Device + cloud interrogation jobs — list, detail, stats, active, results.
- name: devices
  description: 'Network devices registered for cryptographic interrogation
    (F5, Palo Alto, Cisco, Fortinet, UniFi). Read surface. UI consumer:
    `web-ui/src/services/devices-api.ts`.'
- name: schedules
  description: 'Recurring interrogation schedules (cron-driven device / cloud
    discovery) — full CRUD plus trigger / enable / disable / run-history. UI
    consumer: `web-ui/src/services/schedules-api.ts`.'
- name: integrations
  description: 'Cloud integrations (AWS / Azure / GCP) used for cloud discovery —
    full CRUD plus a connection test. Credentials are encrypted at rest and
    masked in responses. UI consumer:
    `web-ui/src/services/cloud-integrations-api.ts` (Inventory → Connections lens).'
- name: admin
  description: |
    Platform-admin oversight surface (admin-ui only). Every route needs a
    platform token whose ROLE holds a named platform permission, resolved
    through platform_user_has_permission() — the role name on the token is
    not consulted: reads need `platform.health`, job retry/cancel need
    `tenants.manage`. A tenant JWT, or a role without the permission, gets
    403. Consumer:
    `admin-ui/src/services/platform-devices-api.ts`.

    Reality note: `GET /admin/metrics` and `GET /admin/agents` (the Fleet
    roster) are implemented in the Go router today. The admin-ui client also
    calls `/admin/tenants`, `/admin/errors`, and `/admin/jobs/stats`, but those
    routes are NOT registered server-side — the client wraps each in try/catch
    and falls back to empty data, so they are intentionally absent from this
    spec. See the handoff report for the Go-vs-TS gap details.

paths:
  /integrations:
    get:
      operationId: listIntegrations
      tags:
      - integrations
      summary: List the tenant's cloud integrations
      description: Includes shared (platform-wide) integrations. Optional `?provider=` filters by integration type.
      parameters:
      - name: provider
        in: query
        required: false
        description: Filter by integration_type (e.g. aws).
        schema:
          type: string
      responses:
        '200':
          description: The tenant's integrations (credentials masked).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationListResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '500':
          $ref: '#/components/responses/LegacyServerError'
    post:
      operationId: createIntegration
      tags:
      - integrations
      summary: Create a cloud integration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIntegrationRequest'
      responses:
        '201':
          description: The created integration (credentials masked).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /integrations/{id}:
    parameters:
    - $ref: '#/components/parameters/IntegrationId'
    get:
      operationId: getIntegration
      tags:
      - integrations
      summary: Get a cloud integration by id
      responses:
        '200':
          description: The integration (credentials masked).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '404':
          $ref: '#/components/responses/LegacyNotFound'
        '500':
          $ref: '#/components/responses/LegacyServerError'
    put:
      operationId: updateIntegration
      tags:
      - integrations
      summary: Update a cloud integration
      description: Partial update; `config` is merged into the existing (decrypted) config, re-validated, and re-encrypted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateIntegrationRequest'
      responses:
        '200':
          description: Update acknowledged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '404':
          $ref: '#/components/responses/LegacyNotFound'
        '500':
          $ref: '#/components/responses/LegacyServerError'
    delete:
      operationId: deleteIntegration
      tags:
      - integrations
      summary: Delete a cloud integration (soft delete)
      responses:
        '200':
          description: Deletion acknowledged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '404':
          $ref: '#/components/responses/LegacyNotFound'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /integrations/{id}/test:
    parameters:
    - $ref: '#/components/parameters/IntegrationId'
    post:
      operationId: testIntegrationConnection
      tags:
      - integrations
      summary: Test a cloud integration's connection
      description: Decrypts the stored credentials and probes the provider; records last_tested_at + status. Always 200 with a success flag (auth failures are reported in the body, not the HTTP status).
      responses:
        '200':
          description: The connection test result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestConnectionResult'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '404':
          $ref: '#/components/responses/LegacyNotFound'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /schedules:
    get:
      operationId: listSchedules
      tags:
      - schedules
      summary: List the tenant's interrogation schedules
      responses:
        '200':
          description: The tenant's schedules.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleListResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '500':
          $ref: '#/components/responses/LegacyServerError'
    post:
      operationId: createSchedule
      tags:
      - schedules
      summary: Create an interrogation schedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScheduleRequest'
      responses:
        '201':
          description: The created schedule (bare object).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterrogationSchedule'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /schedules/{id}:
    parameters:
    - $ref: '#/components/parameters/ScheduleId'
    get:
      operationId: getSchedule
      tags:
      - schedules
      summary: Get a schedule by id
      description: Bare object. Tenant isolation — a schedule owned by another tenant returns 404.
      responses:
        '200':
          description: The schedule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterrogationSchedule'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '404':
          $ref: '#/components/responses/LegacyNotFound'
    put:
      operationId: updateSchedule
      tags:
      - schedules
      summary: Update a schedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateScheduleRequest'
      responses:
        '200':
          description: The updated schedule (bare object).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterrogationSchedule'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '404':
          $ref: '#/components/responses/LegacyNotFound'
        '500':
          $ref: '#/components/responses/LegacyServerError'
    delete:
      operationId: deleteSchedule
      tags:
      - schedules
      summary: Delete a schedule
      responses:
        '200':
          description: Deletion acknowledged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '404':
          $ref: '#/components/responses/LegacyNotFound'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /schedules/{id}/trigger:
    parameters:
    - $ref: '#/components/parameters/ScheduleId'
    post:
      operationId: triggerSchedule
      tags:
      - schedules
      summary: Trigger a schedule to run now
      responses:
        '202':
          description: The schedule run was queued; returns the created job id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriggerScheduleResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '404':
          $ref: '#/components/responses/LegacyNotFound'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /schedules/{id}/enable:
    parameters:
    - $ref: '#/components/parameters/ScheduleId'
    post:
      operationId: enableSchedule
      tags:
      - schedules
      summary: Enable a schedule
      responses:
        '200':
          description: The updated schedule (is_enabled=true).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterrogationSchedule'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '404':
          $ref: '#/components/responses/LegacyNotFound'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /schedules/{id}/disable:
    parameters:
    - $ref: '#/components/parameters/ScheduleId'
    post:
      operationId: disableSchedule
      tags:
      - schedules
      summary: Disable a schedule
      responses:
        '200':
          description: The updated schedule (is_enabled=false).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterrogationSchedule'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '404':
          $ref: '#/components/responses/LegacyNotFound'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /schedules/{id}/history:
    parameters:
    - $ref: '#/components/parameters/ScheduleId'
    get:
      operationId: getScheduleHistory
      tags:
      - schedules
      summary: Get a schedule's recent run history
      responses:
        '200':
          description: The schedule's run history (up to 50 most recent).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleHistoryResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '404':
          $ref: '#/components/responses/LegacyNotFound'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /agents:
    get:
      operationId: listAgents
      tags:
      - agents
      summary: List the tenant's device interrogation agents
      description: |
        Read-only roster of the tenant's enrolled device interrogation agents
        (the downloadable device-agent binary), for the web-ui Discovery →
        Sensors & Agents fleet list. Tenant-scoped (DiscoveryRead) and
        RLS-isolated on `device_agents`. Enveloped under `agents` (nullable
        array on an empty result) plus a `count`. Each row exposes only
        device_agents telemetry; the secret `registration_key` is intentionally
        NOT included.
      responses:
        '200':
          description: The tenant's device interrogation agents.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentListResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /agents/{id}:
    delete:
      operationId: deleteAgent
      tags:
      - agents
      summary: Remove one of the tenant's device interrogation agents
      description: |
        Soft-deletes the agent (`device_agents.deleted_at`) and settles everything
        that pointed at it, in one transaction: the agent's PENDING jobs are
        released back to the unassigned pool (`agent_id = NULL`) so the in-cluster
        worker or another agent picks them up; its IN-PROGRESS jobs are failed,
        because a deleted agent will never report a result and re-queueing could
        double-execute an interrogation; and its certificates are revoked.

        Gated at DiscoveryManage — the same permission as the other destructive
        routes in this service. RLS-isolated on `device_agents`: another tenant's
        agent id is answered 404, identically to an unknown id.

        This does NOT uninstall the agent binary, which keeps running on the
        operator's host. It fails closed regardless: every agent-outbound path
        resolves the agent with `deleted_at IS NULL`, so a deleted agent's polls
        are rejected and it receives no jobs and no credentials.
      parameters:
      - name: id
        in: path
        required: true
        description: The agent's UUID.
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The agent was removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '404':
          $ref: '#/components/responses/LegacyNotFound'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /agents/config/defaults:
    get:
      operationId: getAgentFleetDefaults
      tags:
      - agents
      summary: The tenant's fleet-wide default settings for discovery agents
      description: |
        Every settable agent setting with the value that applies fleet-wide, and
        an `origin` saying whether the tenant has set it (`fleet`) or is
        inheriting the agent binary's own default (`built_in`). Resolved rather
        than raw, so the page never has to invent the settings the tenant has
        not touched. Gated at SensorsRead.
      responses:
        '200':
          description: The fleet defaults.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentConfigDefaultsResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '500':
          $ref: '#/components/responses/LegacyServerError'
    put:
      operationId: putAgentFleetDefaults
      tags:
      - agents
      summary: Replace the tenant's fleet-wide default settings for discovery agents
      description: |
        Replaces the whole set: a key left out is cleared, because a partial
        write cannot express "remove this one". Every agent without its own
        override converges on the new values at its next check-in, with nothing
        having to notify them individually — the desired revision is a content
        hash, so a changed default makes every inheriting agent disagree.

        Gated at SensorsManage. Values are validated against the registry in
        `shared/agentconfig`; a value below a setting's floor is RAISED rather
        than rejected, and the response says so in `adjusted`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentConfigWriteRequest'
      responses:
        '200':
          description: The defaults were saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentConfigWriteResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '409':
          description: A setting in this change needs explicit confirmation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentConfigConfirmationRequired'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /agents/{id}/restart:
    post:
      operationId: requestAgentRestart
      tags:
      - agents
      summary: Ask one agent to restart at its next check-in
      description: |
        Records the moment an operator asked. The agent is sent how long AGO
        that was and compares it with its own uptime — two durations, never two
        clocks, because an agent whose clock disagrees with the platform's would
        otherwise restart on every check-in for ever. It is idempotent by
        construction: an agent that has already restarted has been running for
        less time than the request is old, so it does not restart again. There is nothing to
        acknowledge and nothing to expire, a missed check-in costs nothing, and
        ten clicks are one restart rather than ten.

        A restart is NOT a setting: it is deliberately outside the desired
        revision, or every agent ever restarted would disagree with its own
        configuration for ever.

        **The agent exits and something else starts it again.** Installed as a
        service that is automatic; on a host where one was launched by hand,
        this stops it. The response says so.

        Gated at SensorsManage, and audited with the acting user: a restart is
        an action taken on somebody's host.
      parameters:
      - name: id
        in: path
        required: true
        description: The agent's UUID.
        schema:
          type: string
          format: uuid
      responses:
        '202':
          description: The request was recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestartRequestAccepted'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '404':
          $ref: '#/components/responses/LegacyNotFound'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /agents/{id}/config/history:
    get:
      operationId: getAgentConfigHistory
      tags:
      - agents
      summary: Who changed this agent's configuration, when, and what moved
      description: |
        The recorded change history, newest first, covering this agent's own
        overrides AND the tenant's fleet defaults for its runtime — an operator
        asking "why is this on" is not served by a history that can only answer
        half the time.

        Gated at SensorsRead rather than behind update or manage: reading who
        changed something is a read, and the person most likely to ask is the
        one who cannot change it.
      parameters:
      - name: id
        in: path
        required: true
        description: The agent's UUID.
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The change history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentConfigHistory'
        '404':
          $ref: '#/components/responses/LegacyNotFound'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /agents/{id}/config:
    get:
      operationId: getAgentConfig
      tags:
      - agents
      summary: One agent's effective settings and how far it has converged
      description: |
        The effective value of every agent setting, each with the `origin` it
        came from (`built_in`, `fleet` or `device`), plus a `status` block
        reconciling what the platform wants against what the agent last
        reported.

        The status distinguishes five outcomes, and the distinctions are
        load-bearing: `never_reported` (the agent has not checked in),
        `not_reporting` (it checked in but names no revision — a build older
        than desired state, which will never converge), `pending`, 
        `awaiting_restart` (accepted, adopted on restart) and `applied`.
        A `failed` state carries the agent's own reason per setting.

        Gated at SensorsRead. Another tenant's agent id is answered 404,
        identically to an unknown id.
      parameters:
      - name: id
        in: path
        required: true
        description: The agent's UUID.
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The agent's configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentConfigResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '404':
          $ref: '#/components/responses/LegacyNotFound'
        '500':
          $ref: '#/components/responses/LegacyServerError'
    put:
      operationId: putAgentConfig
      tags:
      - agents
      summary: Replace one agent's settings override
      description: |
        Sets what THIS agent should be, over and above the fleet defaults. An
        explicit `false` is an override and beats a fleet default of `true`; an
        omitted key inherits. Send `{"values": {}}` to clear the override
        entirely and return the agent to the fleet defaults.

        Gated at SensorsManage. The agent adopts the change at its next
        heartbeat; settings marked `apply: restart` are listed in
        `needs_restart` and are adopted when the agent restarts.
      parameters:
      - name: id
        in: path
        required: true
        description: The agent's UUID.
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentConfigWriteRequest'
      responses:
        '200':
          description: The override was saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentConfigWriteResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '404':
          $ref: '#/components/responses/LegacyNotFound'
        '409':
          description: A setting in this change needs explicit confirmation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentConfigConfirmationRequired'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /cloud/interrogate:
    post:
      operationId: interrogateCloudResource
      tags: [devices]
      summary: Collect provider evidence for a cloud resource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [integration_id, resource_type]
              properties:
                integration_id:
                  type: string
                  format: uuid
                cloud_provider:
                  type: string
                  enum: [aws, azure, gcp]
                resource_type:
                  type: string
                resource_arn:
                  type: string
                resource_id:
                  type: string
      responses:
        '200':
          description: Resolved cloud resource and collected context.
          content:
            application/json:
              schema:
                type: object
                required: [device, resource_type]
                properties:
                  resource_arn:
                    type: string
                  resource_id:
                    type: string
                  resource_type:
                    type: string
                  device:
                    $ref: '#/components/schemas/Device'
        '202':
          description: Provider evidence retained for identity resolution; no asset ID is fabricated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetainedDeviceObservation'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '404':
          description: The provider did not return the requested resource.
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /devices:
    get:
      operationId: listDevices
      tags:
      - devices
      summary: List the tenant's interrogation devices
      responses:
        '200':
          description: The tenant's devices.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceListResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '500':
          $ref: '#/components/responses/LegacyServerError'
    post:
      operationId: createDevice
      tags:
      - devices
      summary: Register a device for interrogation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeviceRequest'
      responses:
        '201':
          description: The created device (bare object).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '202':
          description: Identity evidence and encrypted management configuration retained for resolution.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetainedDeviceObservation'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /devices/{id}:
    parameters:
    - name: id
      in: path
      required: true
      description: Device UUID.
      schema:
        type: string
        format: uuid
    get:
      operationId: getDevice
      tags:
      - devices
      summary: Get a device by id
      description: Returns the device (bare object). Tenant isolation — a device owned by another tenant returns 404.
      responses:
        '200':
          description: The device (bare object).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '404':
          $ref: '#/components/responses/LegacyNotFound'
      x-quirks:
      - 'Any retrieval failure and any cross-tenant device both return 404 (not 403/500).'
    put:
      operationId: updateDevice
      tags:
      - devices
      summary: Update a device
      description: Partial update. Tenant-isolated — a device owned by another tenant returns 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDeviceRequest'
      responses:
        '200':
          description: The updated device (bare object).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '404':
          $ref: '#/components/responses/LegacyNotFound'
        '500':
          $ref: '#/components/responses/LegacyServerError'
    delete:
      operationId: deleteDevice
      tags:
      - devices
      summary: Stop managing a device
      description: |
        Removes the device's management configuration (`asset_management`) and
        its stored credentials (`asset_credentials`). **The asset itself stays**,
        with its endpoints, certificates, crypto configurations, findings and
        history — it simply leaves the Devices page, which is the filter "assets
        with management configured" (ADR-0002 D5). Deleting the asset would be an
        inventory-wide deletion triggered from a button that says "remove
        device". The unmanage is recorded in `asset_history`.

        Tenant-isolated — a device owned by another tenant returns 404.
      responses:
        '200':
          description: Unmanage acknowledged; the asset remains in Inventory.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '404':
          $ref: '#/components/responses/LegacyNotFound'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /devices/{id}/interrogate:
    parameters:
    - name: id
      in: path
      required: true
      description: Device UUID.
      schema:
        type: string
        format: uuid
    post:
      operationId: interrogateDevice
      tags:
      - devices
      summary: Interrogate a device
      description: |
        Kicks off interrogation of the device. The success path performs live
        device I/O (HTTP to the target), so it is integration-tested; the contract
        test pins the request-validation paths (400 bad id / 404 device not found).

        The body is OPTIONAL and the endpoint predates it: a request with no body
        queues a `device_interrogation`, exactly as it always did.

        Sending `job_type: host_inventory` queues a general host inventory
        instead — OS, hardware identity, installed packages, listening sockets
        and trust stores (asset-inventory ADR-0004 D3). It requires
        `mode: "remote"` and an `agent_id`: a LOCAL collection is
        agent-originated (the agent describes its own host on its own schedule
        and posts the result to the agent-authenticated intake route), so there
        is nothing here to queue and a local-mode job would never be claimed.

        `transport` defaults to `ssh`, which reaches Linux, macOS and
        Windows-with-OpenSSH. `winrm` is REFUSED with an explanation: its Go
        client pulls MPL-2.0 dependencies that are outside this product's
        MIT/Apache/BSD policy.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InterrogateDeviceRequest'
      responses:
        '202':
          description: Interrogation accepted (async). Body is the queued-job info (not contract-pinned).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceActionAccepted'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '404':
          $ref: '#/components/responses/LegacyNotFound'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /devices/{id}/test-connection:
    parameters:
    - name: id
      in: path
      required: true
      description: Device UUID.
      schema:
        type: string
        format: uuid
    post:
      operationId: testDeviceConnection
      tags:
      - devices
      summary: Test connectivity to a device
      description: |
        Tests connectivity to the device. The success path performs live device
        I/O, so it is integration-tested; the contract test pins the
        request-validation paths (400 bad id / 404 device not found).
      responses:
        '200':
          description: Connectivity result (live; not contract-pinned).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceActionAccepted'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '404':
          $ref: '#/components/responses/LegacyNotFound'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /devices/{id}/ssh-host-key:
    parameters:
    - name: id
      in: path
      required: true
      description: Device UUID.
      schema:
        type: string
        format: uuid
    delete:
      operationId: resetDeviceSshHostKeyPin
      tags:
      - devices
      summary: Clear the pinned SSH host key for a device
      description: |
        Unpins the device's SSH host key so the next interrogation records and
        pins the key the device presents.

        The deliberate re-pin path for a device that was legitimately replaced or
        rekeyed. Interrogation fails closed against an unrecognised key and sends
        no credential, so without this route an operator's only way forward would
        be to turn host-key checking off — which is how a fail-closed control
        becomes a fail-open one. It takes no fingerprint: the platform pins what
        it actually observes on the next contact, so no value nobody measured can
        be pinned.
      responses:
        '200':
          description: The pin was cleared; the next interrogation enrols the key the device presents.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '404':
          $ref: '#/components/responses/LegacyNotFound'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /devices/bulk-interrogate:
    post:
      operationId: bulkInterrogateDevices
      tags:
      - devices
      summary: Interrogate multiple devices
      description: |
        Kicks off interrogation of multiple devices. Live device I/O on success
        (integration-tested); the contract test pins the bad-body 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '202':
          description: Bulk interrogation accepted (async; not contract-pinned).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceActionAccepted'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /devices/discover-and-create:
    post:
      operationId: discoverAndCreateDevice
      tags:
      - devices
      summary: Discover a device and create it
      description: |
        Probes the target (live device I/O), then creates the device record.
        Integration-tested on success; the contract test pins the bad-body 400.
        Returns the created Device on success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscoverAndCreateDeviceRequest'
      responses:
        '201':
          description: The created device.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '202':
          description: Identity evidence and encrypted management configuration retained for resolution.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetainedDeviceObservation'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '422':
          description: The target was disallowed, rejected authentication, or did not expose a supported discovery API.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceDiscoveryError'
        '502':
          description: The management endpoint could not be reached securely.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceDiscoveryError'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /jobs:
    get:
      operationId: listInterrogationJobs
      tags:
      - interrogation-jobs
      summary: List interrogation jobs for the current tenant
      description: |
        Returns a paginated page of jobs. Filters (status[], job_type, asset_id,
        integration_id) are accepted as query params; page / page_size paginate.
        `device_id` is still accepted as a deprecated alias of `asset_id`.
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
      responses:
        '200':
          description: A page of interrogation jobs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobListResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /jobs/stats:
    get:
      operationId: getInterrogationJobStats
      tags:
      - interrogation-jobs
      summary: Aggregate interrogation-job statistics
      responses:
        '200':
          description: Job statistics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatsResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
      x-quirks:
      - On a stats query error the handler returns 200 with an all-zero stats object, not 500.
  /jobs/active:
    get:
      operationId: getActiveInterrogationJobs
      tags:
      - interrogation-jobs
      summary: List currently active (pending / in-progress) jobs
      responses:
        '200':
          description: The active jobs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveJobsResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
      x-quirks:
      - 'On a query error the handler returns 200 with `{"jobs": []}`, not 500.'
  /jobs/{id}:
    parameters:
    - name: id
      in: path
      required: true
      description: Job UUID.
      schema:
        type: string
        format: uuid
    get:
      operationId: getInterrogationJob
      tags:
      - interrogation-jobs
      summary: Get an interrogation job by id
      responses:
        '200':
          description: The job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '404':
          $ref: '#/components/responses/LegacyNotFound'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /jobs/{id}/results:
    parameters:
    - name: id
      in: path
      required: true
      description: Job UUID.
      schema:
        type: string
        format: uuid
    get:
      operationId: getInterrogationJobResults
      tags:
      - interrogation-jobs
      summary: Get an interrogation job's results
      description: Returns the job's discovered assets (crypto posture + certificates), a summary, and the post-processing verdict. Projected and scrubbed — see JobResultsResponse.
      responses:
        '200':
          description: The job results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResultsResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '404':
          $ref: '#/components/responses/LegacyNotFound'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /jobs/{id}/retry:
    parameters:
    - name: id
      in: path
      required: true
      description: Job UUID.
      schema:
        type: string
        format: uuid
    post:
      operationId: retryInterrogationJob
      tags:
      - interrogation-jobs
      summary: Retry a failed or cancelled job
      description: Resets the job to pending. Only failed/cancelled jobs may be retried (else 400).
      responses:
        '200':
          description: The job was queued for retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetryJobResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '404':
          $ref: '#/components/responses/LegacyNotFound'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /jobs/{id}/cancel:
    parameters:
    - name: id
      in: path
      required: true
      description: Job UUID.
      schema:
        type: string
        format: uuid
    post:
      operationId: cancelInterrogationJob
      tags:
      - interrogation-jobs
      summary: Cancel a pending or in-progress job
      description: Only pending / assigned / in-progress jobs may be cancelled (else 400).
      responses:
        '200':
          description: The job was cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '404':
          $ref: '#/components/responses/LegacyNotFound'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /cloud/discover:
    post:
      operationId: discoverCloudResources
      tags:
      - cloud
      summary: Start an ad-hoc cloud discovery job
      description: |
        Triggers an immediate cloud discovery run for one integration. The job is
        created and started asynchronously; the response returns the job_id so the
        caller can poll /jobs/{id} for status. Requires discovery.manage permission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudDiscoverRequest'
      responses:
        '202':
          description: Discovery job accepted and started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudDiscoverResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /admin/metrics:
    get:
      operationId: getAdminMetrics
      tags:
      - admin
      summary: Platform-wide device/integration/job health summary
      description: |
        Aggregate health metrics across ALL tenants for the admin-ui platform
        oversight dashboard. Requires a platform token whose role holds `platform.health`
        (platform_user_has_permission — the role name is not consulted); a
        tenant token or a role without it gets 403. Returns the bare
        `PlatformHealthSummary` object (NOT enveloped under a key).

        Shape note: the admin-ui's `getMetrics()` (`platform-devices-api.ts`)
        expects a different, nested `PlatformMetrics` shape
        (`{ devices, jobs, tenants, recent_errors }`). The Go handler actually
        returns this FLAT `PlatformHealthSummary`. The client try/catches and
        falls back to zeros, masking the mismatch. This spec documents the
        real Go response.
      responses:
        '200':
          description: The platform-wide health summary (bare object).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformHealthSummary'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /admin/agents:
    get:
      operationId: listAdminAgents
      tags:
      - admin
      summary: Platform-wide interrogation-agent roster (Fleet view)
      description: |
        Read-only roll-up of every device interrogation agent across ALL
        tenants, for the VISTA Operations "Fleet" view in admin-ui.
        Requires a platform token whose role holds `platform.health`
        (platform_user_has_permission — the role name is not consulted); a
        tenant token or a role without it gets 403. Unlike the tenant-scoped `GET /agents` this
        deliberately omits the tenant_id filter and joins `tenants` so each row
        carries tenant identity (`tenant_id` + `tenant_name` + `tenant_slug`).

        An optional `tenant_id` narrows the roll-up to a single tenant
        server-side (the operator "scope" selector) so the client is never
        shipped other tenants' rows; omit it for the full cross-tenant view.

        Returned enveloped under `agents` (always a non-nil array) plus a
        `count`. Each row exposes only telemetry that exists on the
        `device_agents` table; the secret `registration_key` is intentionally
        NOT included.
      parameters:
      - name: tenant_id
        in: query
        required: false
        description: Narrow the cross-tenant roll-up to a single tenant (operator scope).
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The platform-wide agent roster.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAgentListResponse'
        '403':
          $ref: '#/components/responses/LegacyForbidden'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /admin/jobs:
    get:
      operationId: listAdminJobs
      tags:
      - admin
      summary: Platform-wide interrogation jobs (Jobs & Queues view)
      description: |
        Read-only roll-up of interrogation jobs across ALL tenants, for the VISTA
        Operations "Jobs & Queues" view in admin-ui. Requires a platform token whose role holds `platform.health`
        (platform_user_has_permission — the role name is not consulted); a
        tenant token or a role without it gets 403. Unlike the
        tenant-scoped `GET /jobs` this deliberately omits the tenant_id filter and
        joins `tenants` so each row carries tenant identity (`tenant_id` +
        `tenant_name` + `tenant_slug`), plus the assigned `worker` (the executing
        agent id, from `device_jobs.agent_id`).

        Same optional filters (status[], job_type, asset_id, integration_id) and
        page / page_size pagination as `GET /jobs`. An optional `tenant_id` narrows
        the roll-up to a single tenant server-side (the operator "scope" selector) so
        the client is never shipped other tenants' rows; omit it for the full
        cross-tenant view. The Support cockpit's Job Repair action adds cross-tenant
        `POST /admin/jobs/{id}/retry` and `/cancel` (both platform-admin gated) so
        operators can recover a stuck customer job directly.
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      - name: tenant_id
        in: query
        required: false
        description: Narrow the cross-tenant roll-up to a single tenant (operator scope).
        schema:
          type: string
          format: uuid
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
      - name: status
        in: query
        required: false
        description: Repeatable; filters by job status (status=pending&status=failed).
        schema:
          type: array
          items:
            type: string
      - name: job_type
        in: query
        required: false
        schema:
          type: string
      - name: asset_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: device_id
        in: query
        required: false
        description: Deprecated alias of `asset_id`.
        schema:
          type: string
          format: uuid
      - name: integration_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: A page of platform-wide interrogation jobs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminJobListResponse'
        '403':
          $ref: '#/components/responses/LegacyForbidden'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /admin/jobs/{id}/retry:
    parameters:
    - name: id
      in: path
      required: true
      description: Job UUID.
      schema:
        type: string
        format: uuid
    post:
      operationId: retryAdminInterrogationJob
      tags:
      - admin
      summary: Retry a failed or cancelled job across any tenant (platform-admin)
      description: |
        Cross-tenant retry for the Support cockpit's Job Repair action. Looks the
        job up by id alone (no tenant scope) and resets it to pending. Only
        failed/cancelled jobs may be retried (else 400). Requires a platform
        token whose role holds `tenants.manage` (it changes a customer's job);
        a tenant token or a role without it gets 403.
      responses:
        '200':
          description: The job was queued for retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetryJobResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '403':
          $ref: '#/components/responses/LegacyForbidden'
        '404':
          $ref: '#/components/responses/LegacyNotFound'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /admin/jobs/{id}/cancel:
    parameters:
    - name: id
      in: path
      required: true
      description: Job UUID.
      schema:
        type: string
        format: uuid
    post:
      operationId: cancelAdminInterrogationJob
      tags:
      - admin
      summary: Cancel a pending or in-progress job across any tenant (platform-admin)
      description: |
        Cross-tenant cancel for the Support cockpit's Job Repair action. Looks the
        job up by id alone (no tenant scope). Only pending / assigned / in-progress
        jobs may be cancelled (else 400). Requires a platform token whose role
        holds `tenants.manage` (it changes a customer's job); a tenant token or
        a role without it gets 403.
      responses:
        '200':
          description: The job was cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '403':
          $ref: '#/components/responses/LegacyForbidden'
        '404':
          $ref: '#/components/responses/LegacyNotFound'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /admin/queues:
    get:
      operationId: listAdminQueues
      tags:
      - admin
      summary: Platform-wide JetStream queue (stream/consumer) telemetry
      description: |
        Read-only per-queue backlog telemetry for the VISTA Operations "Queues"
        panel, sourced live from NATS JetStream stream + durable-consumer info.
        Requires a platform token whose role holds `platform.health`
        (platform_user_has_permission — the role name is not consulted); a
        tenant token or a role without it gets 403.

        Each queue is one JetStream stream (the platform's DefaultStreams). The
        meaningful per-queue depth is each consumer's `depth` (JetStream
        `num_pending` — undelivered backlog); `in_flight` is delivered-but-unacked
        (`num_ack_pending`); `num_waiting` is parked pull requests (idle workers).
        Stream-level `messages`/`bytes` are total retained (subject to MaxAge),
        not a live depth.

        Metrics honesty: JetStream does NOT expose per-queue throughput rate or
        p95 latency, so those are intentionally absent — they are not fabricated.
        Streams that do not yet exist (no producer has run) are skipped.

        Returns 503 when NATS/JetStream is unavailable (e.g. dev compose without
        NATS) rather than inventing metrics.
      responses:
        '200':
          description: Per-queue live JetStream telemetry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminQueueListResponse'
        '403':
          $ref: '#/components/responses/LegacyForbidden'
        '500':
          $ref: '#/components/responses/LegacyServerError'
        '503':
          description: NATS/JetStream unavailable; queue metrics cannot be read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'

components:
  parameters:
    ScheduleId:
      name: id
      in: path
      required: true
      description: Schedule UUID.
      schema:
        type: string
        format: uuid
    IntegrationId:
      name: id
      in: path
      required: true
      description: Integration UUID.
      schema:
        type: string
        format: uuid
  responses:
    LegacyBadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyError'
    LegacyNotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyError'
    LegacyServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyError'
    LegacyForbidden:
      description: Caller is not a platform admin.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyError'
  schemas:
    RestartRequestAccepted:
      type: object
      required:
      - restart_requested_at
      - note
      properties:
        restart_requested_at:
          type: string
          format: date-time
          description: |
            When the request was recorded, on the platform's clock. Display
            material — "requested 5 minutes ago". A device must NOT compare it
            with its own clock: the two disagreeing is a restart loop, so the
            device is told the request's AGE and compares that with its own
            uptime.
        note:
          type: string
          description: |
            States plainly that the device exits and something else must start
            it — the one way this can disappoint, so it is in the response
            rather than only in the documentation.
    AgentConfigChange:
      type: object
      description: |
        One recorded configuration change. Both the device's own overrides and
        the tenant's fleet defaults appear, because a device's effective
        configuration moves when either does.
      required:
      - changed_at
      - changed_by
      - scope
      - keys
      - values_before
      - values_after
      properties:
        changed_at:
          type: string
          format: date-time
        changed_by:
          type: string
          description: The account that made the change. Empty when it was not made by a user.
        scope:
          type: string
          enum: [device, fleet]
        keys:
          type: array
          description: The setting keys whose value actually moved, derived server-side so no client re-implements the comparison.
          items:
            type: string
        values_before:
          type: object
          additionalProperties: true
        values_after:
          type: object
          additionalProperties: true
    AgentConfigHistory:
      type: object
      required:
      - changes
      properties:
        changes:
          type: array
          description: Newest first. Always present, never null — a device nobody has configured has an empty history, not an unknown one.
          items:
            $ref: '#/components/schemas/AgentConfigChange'
    AgentConfigVersion:
      type: object
      description: |
        What the device runs, what this platform release ships, and whether they
        differ. The expected version is the release the PLATFORM is running,
        because the device binaries ship from the same tag — so the platform can
        only report a device as behind once it has itself been upgraded, and it
        never queries an external service to find out.
      required:
      - device
      - expected
      - state
      properties:
        device:
          type: string
          description: What the device last reported. Empty when it has never reported one.
        expected:
          type: string
          description: The version shipping with this platform release. Empty when the platform does not know its own.
        state:
          type: string
          enum: [unknown, current, behind, ahead]
          description: |
            `unknown` when the comparison could not be made — either side
            missing or unparseable. Deliberately distinct from `current`: a
            comparison that was not made must never render as up to date.
            `ahead` is a device newer than the platform, which happens mid-
            rollout and also when the wrong binary was installed.
    AgentConfigSetting:
      type: object
      description: |
        One setting: its effective value, where that value came from, and enough
        of its registry entry for a client to render a control for it without
        hard-coding a second copy of the rules.
      required:
      - key
      - value
      - origin
      - kind
      - apply
      - description
      properties:
        key:
          type: string
          description: The setting's name, spelled as the device's own config file spells it.
          example: host_inventory_enabled
        value:
          description: The effective value — a boolean, a whole number or a string.
          oneOf:
          - type: boolean
          - type: integer
            format: int64
          - type: string
        origin:
          type: string
          enum: [built_in, fleet, device]
          description: |
            Where the effective value came from. `built_in` is the device's own
            default (nobody has set it), `fleet` the tenant default, `device` an
            override on this device. Without this the console cannot offer
            "revert to fleet default", or say whether a value is deliberate.
        kind:
          type: string
          enum: [bool, int, enum]
        apply:
          type: string
          enum: [immediate, restart]
          description: |
            When the device adopts a change. `restart` settings sit at
            `awaiting_restart` until the process restarts; showing them as
            applied on the next check-in would be false.
        description:
          type: string
          description: Operator-facing explanation of what the setting does.
        confirm:
          type: string
          description: |
            Present when turning this setting ON requires explicit
            confirmation, and states what begins to be collected. Only settings
            that start a new kind of collection carry one.
        min:
          type: integer
          format: int64
        max:
          type: integer
          format: int64
        allowed:
          type: array
          items:
            type: string
    AgentConfigStatus:
      type: object
      description: How far the device has converged on the desired settings.
      required:
      - state
      - desired_revision
      properties:
        state:
          type: string
          enum: [never_reported, not_reporting, pending, awaiting_restart, applied, failed]
        desired_revision:
          type: string
          description: |
            Content hash of the effective settings. The device reports the
            revision it has adopted; equality is what "applied" means. A hash
            rather than a counter, so a changed fleet default moves every
            inheriting device with nothing having to notify them.
        reported_at:
          type: string
          format: date-time
          description: When the device last reported. Absent if it never has.
        failures:
          type: object
          additionalProperties:
            type: string
          description: The device's own reason, per setting it could not apply.
        pending_restart:
          type: array
          items:
            type: string
          description: Settings accepted but not adopted until the device restarts.
    AgentConfigResponse:
      type: object
      required:
      - runtime
      - settings
      - status
      - version
      properties:
        runtime:
          type: string
          enum: [agent]
        settings:
          type: array
          items:
            $ref: '#/components/schemas/AgentConfigSetting'
        status:
          $ref: '#/components/schemas/AgentConfigStatus'
        version:
          $ref: '#/components/schemas/AgentConfigVersion'
    AgentConfigDefaultsResponse:
      type: object
      required:
      - runtime
      - settings
      properties:
        runtime:
          type: string
          enum: [agent]
        settings:
          type: array
          items:
            $ref: '#/components/schemas/AgentConfigSetting'
    AgentConfigWriteRequest:
      type: object
      required:
      - values
      properties:
        values:
          type: object
          description: |
            The settings to store, keyed by setting name. The whole set is
            replaced: a key left out is cleared. A null value clears that one
            key. An explicit `false` is a value, not an absence.
          additionalProperties:
            oneOf:
            - type: boolean
            - type: integer
              format: int64
            - type: string
            - type: 'null'
          example:
            host_inventory_enabled: true
            host_inventory_interval_seconds: 21600
        confirmed:
          type: boolean
          description: |
            Acknowledges any setting whose registry entry demands confirmation.
            The server decides whether one is needed; omitting the flag cannot
            waive it.
    AgentConfigWriteResponse:
      type: object
      required:
      - changed
      - adjusted
      - needs_restart
      properties:
        changed:
          type: array
          items:
            type: string
          description: One line per setting that actually changed, rendered as key, then the old and new values.
          example: ["host_inventory_enabled: false → true"]
        adjusted:
          type: array
          items:
            type: string
          description: |
            Values silently raised to a setting's floor. The device does this on
            its own today and logs it locally, so whoever typed the value never
            learns it was changed; saying so here is the point.
          example: ["host_inventory_interval_seconds: raised 300 to the minimum of 3600"]
        needs_restart:
          type: array
          items:
            type: string
          description: |
            Changed settings the device can only adopt on restart. An operator
            who is not told will read the resulting `awaiting_restart` as a
            failure.
    AgentConfigConfirmationRequired:
      type: object
      required:
      - error
      - needs_confirming
      properties:
        error:
          type: string
        needs_confirming:
          type: array
          items:
            type: object
            required:
            - key
            - confirm
            properties:
              key:
                type: string
              confirm:
                type: string
                description: What begins to be collected if this is turned on.
    CloudDiscoverRequest:
      type: object
      description: Request body for POST /cloud/discover — triggers an ad-hoc cloud discovery run.
      required:
      - integration_id
      - resource_types
      properties:
        integration_id:
          type: string
          format: uuid
          description: The cloud integration to run discovery against.
        cloud_provider:
          type: string
          description: 'Provider hint (aws / azure / gcp). Auto-detected from the integration when omitted.'
          enum:
          - aws
          - azure
          - gcp
        resource_types:
          type: array
          items:
            type: string
          description: |
            Provider-specific resource types to discover.
            AWS (8): alb, elb, nlb, api_gateway, cloudfront, kms, s3, rds.
            Azure: application_gateway, load_balancer, key_vault, storage_account, sql_database.
            GCP: load_balancer, ssl_proxy, kms, storage, cloudsql.
            Unknown values are ignored rather than rejected, so a run naming
            only unknown types succeeds with zero results.
        regions:
          type: array
          items:
            type: string
          description: |
            AWS regions to scan (e.g. us-east-1), commercial partition only —
            GovCloud (aws-us-gov) and China (aws-cn) are not supported. Applies
            only to the REGIONAL AWS resource types (alb, elb, nlb,
            api_gateway, kms, rds); each is scanned once per region,
            sequentially. s3 and cloudfront are enumerated account-wide and
            IGNORE this field entirely. When omitted, the integration's default
            region is used. Ignored for Azure and GCP.
        resource_groups:
          type: array
          items:
            type: string
          description: Azure resource groups to filter by. Ignored for AWS and GCP.
    CloudDiscoverResponse:
      type: object
      description: Response for POST /cloud/discover.
      properties:
        message:
          type: string
        job_id:
