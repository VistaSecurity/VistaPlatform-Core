      - management_url
      - serial_number
      - firmware_version
      - discovery_method
      - tls_insecure_skip_verify
      - connection_status
      - last_interrogated_at
      - interrogation_error
      - metadata
      - tags
      - created_at
      - updated_at
      - deleted_at
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        device_type:
          type: string
          description: unifi / cisco / fortinet / palo_alto / f5.
        vendor:
          type: [string, 'null']
        model:
          type: [string, 'null']
        hostname:
          type: [string, 'null']
        ip_address:
          type: [string, 'null']
        management_url:
          type: [string, 'null']
        serial_number:
          type: [string, 'null']
        firmware_version:
          type: [string, 'null']
        discovery_method:
          type: string
        credential_id:
          type: string
          format: uuid
        username:
          type: string
        password:
          type: string
        tls_insecure_skip_verify:
          type: boolean
        connection_status:
          type: string
          description: connected / disconnected / error / unknown / testing.
        last_interrogated_at:
          type: [string, 'null']
          format: date-time
        interrogation_error:
          type: [string, 'null']
        metadata:
          type: [object, 'null']
          additionalProperties: true
        tags:
          type: [object, 'null']
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: [string, 'null']
          format: date-time
    Agent:
      type: object
      additionalProperties: false
      description: |
        A tenant's enrolled device interrogation agent (models.Agent). Telemetry
        mirrors the device_agents columns; the secret registration_key is omitted.
        `name` and `profile` are nullable (DB NULLs surface as JSON null) — they
        are carried from the pending registration at bootstrap time.
      required:
      - id
      - tenant_id
      - name
      - platform
      - profile
      - version
      - status
      - ip_address
      - last_heartbeat
      - created_at
      - updated_at
      - description
      - addresses
      - job_count
      - last_job_at
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
          description: Operator-assigned agent name (carried from the pending registration); null when unset.
        platform:
          type: string
          description: Agent host platform (e.g. linux/amd64).
        profile:
          type: string
          nullable: true
          description: Registration profile (device_interrogation); null when unset.
        version:
          type: string
          description: Agent binary version.
        status:
          type: string
          description: 'Agent status: active, inactive, or error.'
        ip_address:
          type: string
          nullable: true
          description: |
            The agent host's primary address, self-reported on each heartbeat —
            the source address its kernel uses to reach the platform. Null until
            an agent new enough to report one checks in. The platform cannot
            derive this: NAT and ingress rewrite the connection source.
        last_heartbeat:
          type: string
          format: date-time
          nullable: true
          description: Last heartbeat timestamp; null if the agent has never checked in.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        description:
          type: string
          nullable: true
          description: |
            The operator's free-text note from the pending registration. Null when
            the registration carried none.
        addresses:
          type: array
          description: |
            Every address bound on the agent host, as reported by its own
            heartbeat, primary first. A discovery agent is routinely multi-homed,
            so `ip_address` alone (the single address it reaches the platform
            from) does not describe what it can reach. Empty for agents older than
            address reporting, or that have not yet checked in.
          items:
            $ref: '#/components/schemas/AgentAddress'
        job_count:
          type: integer
          description: All-time count of interrogation jobs assigned to this agent.
        last_job_at:
          type: string
          format: date-time
          nullable: true
          description: |
            When this agent's most recent job last moved (completed, else started,
            else created). Null if the agent has never been assigned one — which,
            with job_count, distinguishes "enrolled but unused" from "went quiet".
    AgentAddress:
      type: object
      additionalProperties: false
      description: One address bound on an agent host (a public.agent_addresses row).
      required:
      - interface_name
      - address
      - prefix_length
      - is_primary
      properties:
        interface_name:
          type: string
          description: The interface the address is bound to (e.g. Ethernet, eth0).
        address:
          type: string
          description: |
            The bare address, without a prefix — rendered with SQL `host()` rather
            than a text cast, which would append "/24" and break any comparison
            against a bare IP.
        prefix_length:
          type: integer
          nullable: true
          description: Prefix length of the address's network; null when the agent reported a bare address.
        is_primary:
          type: boolean
          description: True for the address the agent reaches the platform from. At most one per agent.
    AgentListResponse:
      type: object
      additionalProperties: false
      description: 'Envelope for GET /agents — `{ "agents": [...], "count": N }`. On an empty/nil result `agents` can serialize as JSON null, so it is typed as a nullable array.'
      required:
      - agents
      - count
      properties:
        agents:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/Agent'
        count:
          type: integer
    DeviceListResponse:
      type: object
      additionalProperties: false
      description: 'CURRENT envelope for GET /devices — `{ "devices": [...] }`. On an empty/nil result `devices` can serialize as JSON null, so it is typed as a nullable array.'
      required:
      - devices
      properties:
        devices:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/Device'
    InterrogationJob:
      type: object
      additionalProperties: false
      description: |
        An interrogation job (handlers.InterrogationJob — the API response shape).
        The listed required fields are always present; every other field is
        `omitempty` and appears only when set.
      required:
      - id
      - tenant_id
      - job_type
      - status
      - created_at
      - updated_at
      - executor
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        job_type:
          type: string
        status:
          type: string
        device_id:
          type: string
          format: uuid
        device_name:
          type: string
        device_type:
          type: string
        integration_id:
          type: string
          format: uuid
        integration_name:
          type: string
        cloud_provider:
          type: string
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        error_message:
          type: string
        progress:
          type: integer
        assets_discovered:
          type: integer
        duration_seconds:
          type: integer
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        agent_id:
          type: string
          format: uuid
          description: |
            device_jobs.agent_id. Absent means the in-cluster platform agent
            executed the job rather than a named device agent.
        executor:
          type: string
          description: |
            Human-readable resolution of agent_id: "Platform Agent" when no
            device agent was assigned, otherwise the executing device agent's
            name (or "Device Agent" if it has none).
    Last24hStats:
      type: object
      additionalProperties: false
      required:
      - completed
      - failed
      properties:
        completed:
          type: integer
        failed:
          type: integer
    JobStats:
      type: object
      additionalProperties: false
      description: Aggregate interrogation-job statistics (handlers.JobStats).
      required:
      - total
      - pending
      - in_progress
      - completed
      - failed
      - last_24h
      properties:
        total:
          type: integer
        pending:
          type: integer
        in_progress:
          type: integer
        completed:
          type: integer
        failed:
          type: integer
        last_24h:
          $ref: '#/components/schemas/Last24hStats'
        average_duration_seconds:
          type: number
    PlatformHealthSummary:
      type: object
      additionalProperties: false
      description: |
        Aggregate health metrics across all tenants
        (services.PlatformHealthSummary), returned bare by GET /admin/metrics.
        Every field has a non-omitempty json tag, so all are always present;
        the two maps are constructed non-nil server-side (never JSON null).
      required:
      - total_devices
      - connected_devices
      - disconnected_devices
      - total_integrations
      - active_integrations
      - error_integrations
      - jobs_last_24h
      - successful_jobs_last_24h
      - failed_jobs_last_24h
      - success_rate
      - average_job_duration_ms
      - devices_by_type
      - integrations_by_provider
      properties:
        total_devices:
          type: integer
        connected_devices:
          type: integer
        disconnected_devices:
          type: integer
        total_integrations:
          type: integer
        active_integrations:
          type: integer
        error_integrations:
          type: integer
        jobs_last_24h:
          type: integer
        successful_jobs_last_24h:
          type: integer
        failed_jobs_last_24h:
          type: integer
        success_rate:
          type: number
        average_job_duration_ms:
          type: integer
        devices_by_type:
          type: object
          additionalProperties:
            type: integer
          description: Map of device_type → count (non-nil; empty object when no devices).
        integrations_by_provider:
          type: object
          additionalProperties:
            type: integer
          description: Map of provider → count (non-nil; empty object when no integrations).
    AdminAgent:
      type: object
      additionalProperties: false
      description: |
        A device interrogation agent enriched with tenant identity, for the
        platform-admin Fleet view (models.AdminAgent). Telemetry fields mirror
        the device_agents columns; the secret registration_key is omitted.
        `name`, `profile`, and `last_heartbeat` are nullable (DB NULLs surface
        as JSON null).
      required:
      - id
      - tenant_id
      - tenant_name
      - tenant_slug
      - name
      - platform
      - profile
      - version
      - status
      - ip_address
      - last_heartbeat
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        tenant_name:
          type: string
          description: Tenant display name (from the tenants join; empty string if the tenant row is missing).
        tenant_slug:
          type: string
          description: Tenant slug (from the tenants join; empty string if the tenant row is missing).
        name:
          type: string
          nullable: true
          description: Operator-assigned agent name; null when unset.
        platform:
          type: string
          description: Agent host platform (e.g. linux/amd64).
        profile:
          type: string
          nullable: true
          description: Registration profile (e.g. device_interrogation); null when unset.
        version:
          type: string
          description: Agent binary version.
        status:
          type: string
          description: 'Agent status: active, inactive, or error.'
        ip_address:
          type: string
          nullable: true
          description: |
            The agent host's primary address, self-reported on each heartbeat —
            the source address its kernel uses to reach the platform. Null until
            an agent new enough to report one checks in. The platform cannot
            derive this: NAT and ingress rewrite the connection source.
        last_heartbeat:
          type: string
          format: date-time
          nullable: true
          description: Last heartbeat timestamp; null if the agent has never checked in.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AdminAgentListResponse:
      type: object
      additionalProperties: false
      description: 'Envelope for GET /admin/agents — `{ "agents": [...], "count": N }`. `agents` is a non-nil array.'
      required:
      - agents
      - count
      properties:
        agents:
          type: array
          items:
            $ref: '#/components/schemas/AdminAgent'
        count:
          type: integer
    JobListResponse:
      type: object
      additionalProperties: false
      description: 'CURRENT envelope for GET /jobs — `{ "jobs": [...], "total": N, "page": P, "page_size": S }`. `jobs` is always a non-nil array.'
      required:
      - jobs
      - total
      - page
      - page_size
      properties:
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/InterrogationJob'
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
    AdminInterrogationJob:
      type: object
      additionalProperties: false
      description: |
        Cross-tenant interrogation job for the platform-admin Jobs & Queues view
        (handlers.AdminInterrogationJob). Same telemetry as InterrogationJob plus
        per-row tenant identity (tenant_name/tenant_slug) and the assigned
        `worker` (device_jobs.agent_id). The listed required fields are always
        present; every other field is omitempty and appears only when set. Note
        there is no `progress`/`metadata` field here — device_jobs has no progress
        column and admin rows do not project metadata.
      required:
      - id
      - tenant_id
      - tenant_name
      - tenant_slug
      - job_type
      - status
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        tenant_name:
          type: string
        tenant_slug:
          type: string
        job_type:
          type: string
        status:
          type: string
        device_id:
          type: string
          format: uuid
        device_name:
          type: string
        device_type:
          type: string
        integration_id:
          type: string
          format: uuid
        integration_name:
          type: string
        cloud_provider:
          type: string
        worker:
          type: string
          format: uuid
          description: device_jobs.agent_id — the agent executing the job (null for unassigned/cloud jobs).
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        error_message:
          type: string
        assets_discovered:
          type: integer
        duration_seconds:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AdminJobListResponse:
      type: object
      additionalProperties: false
      description: 'Envelope for GET /admin/jobs — `{ "jobs": [...], "total": N, "page": P, "page_size": S }`. `jobs` is always a non-nil array.'
      required:
      - jobs
      - total
      - page
      - page_size
      properties:
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/AdminInterrogationJob'
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
    QueueConsumer:
      type: object
      additionalProperties: false
      description: |
        Per-consumer backlog telemetry from JetStream ConsumerInfo
        (handlers.QueueConsumer). `depth` is num_pending (undelivered backlog),
        `in_flight` is num_ack_pending (delivered, awaiting ack), `num_waiting` is
        parked pull requests (idle workers). No rate/p95 — JetStream does not
        expose them.
      required:
      - name
      - depth
      - in_flight
      - num_waiting
      - num_redelivered
      properties:
        name:
          type: string
        depth:
          type: integer
          description: JetStream num_pending — undelivered backlog for this consumer.
        in_flight:
          type: integer
          description: JetStream num_ack_pending — delivered but not yet acked.
        num_waiting:
          type: integer
          description: Outstanding pull requests parked by idle workers.
        num_redelivered:
          type: integer
        last_delivered:
          type: string
          format: date-time
    AdminQueue:
      type: object
      additionalProperties: false
      description: |
        One JetStream stream and its per-consumer backlog breakdown
        (handlers.AdminQueue). Stream-level `messages`/`bytes` are total retained
        (subject to MaxAge), not a live depth — the meaningful depth is each
        consumer's `depth`.
      required:
      - name
      - subjects
      - messages
      - bytes
      - consumer_count
      - consumers
      properties:
        name:
          type: string
        subjects:
          type: array
          items:
            type: string
        messages:
          type: integer
          description: Stream State.Msgs — total messages retained in the stream.
        bytes:
          type: integer
          description: Stream State.Bytes.
        consumer_count:
          type: integer
        last_message_at:
          type: string
          format: date-time
        consumers:
          type: array
          items:
            $ref: '#/components/schemas/QueueConsumer'
    AdminQueueListResponse:
      type: object
      additionalProperties: false
      description: |
        Envelope for GET /admin/queues — `{ "queues": [...], "count": N,
        "metrics_note": "..." }`. `queues` is a non-nil array. `metrics_note`
        documents that per-queue rate/p95 are intentionally absent (JetStream
        does not expose them).
      required:
      - queues
      - count
      - metrics_note
      properties:
        queues:
          type: array
          items:
            $ref: '#/components/schemas/AdminQueue'
        count:
          type: integer
        metrics_note:
          type: string
    JobResponse:
      type: object
      additionalProperties: false
      description: 'CURRENT envelope for GET /jobs/{id} — `{ "job": {...} }`.'
      required:
      - job
      properties:
        job:
          $ref: '#/components/schemas/InterrogationJob'
    JobStatsResponse:
      type: object
      additionalProperties: false
      description: 'CURRENT envelope for GET /jobs/stats — `{ "stats": {...} }`.'
      required:
      - stats
      properties:
        stats:
          $ref: '#/components/schemas/JobStats'
    ActiveJobsResponse:
      type: object
      additionalProperties: false
      description: 'CURRENT envelope for GET /jobs/active — `{ "jobs": [...] }` (non-nil array).'
      required:
      - jobs
      properties:
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/InterrogationJob'
    JobResultsResponse:
      type: object
      additionalProperties: false
      description: |
        An interrogation job's discovered assets and what happened to them.

        This is a PROJECTION of the stored agent payload, never a passthrough:
        only the fields enumerated here are served, and the open-ended
        `metadata` map is additionally scrubbed of secret-looking fields. Vendor
        APIs return key material (mesh PSKs, device auth keys, SMTP passwords)
        alongside the crypto posture we want, and none of it may reach a client.
      required:
      - job_id
      - status
      - assets
      - summary
      properties:
        job_id:
          type: string
        status:
          type: string
        success:
          type: boolean
          description: The agent's own verdict on the interrogation run.
        assets:
          type: array
          items:
            $ref: '#/components/schemas/JobResultAsset'
        summary:
          $ref: '#/components/schemas/JobResultsSummary'
        processing:
          type: object
          additionalProperties: true
          description: |
            Post-processing verdict written by the result processor: per-asset
            outcomes (`steps`), de-duplicated `errors`, and counts for each
            pipeline stage. Absent on jobs that produced no assets or that ran
            before this was recorded.
    JobResultsSummary:
      type: object
      additionalProperties: false
      required:
      - total_assets
      - with_crypto
      - with_certificates
      properties:
        total_assets:
          type: integer
        with_crypto:
          type: integer
          description: Assets whose TLS posture was genuinely observed, as opposed to listed by a management API.
        with_certificates:
          type: integer
        materialized:
          type: integer
          description: |
            How many assets became a discovery finding. Sourced from the
            processing log rather than the asset count, so a pipeline failure
            shows as "12 discovered / 0 materialized" instead of hiding behind
            the total.
    JobResultAsset:
      type: object
      additionalProperties: false
      required:
      - crypto_observed
      properties:
        hostname:
          type: string
        ip_address:
          type: string
        port:
          type: integer
        protocol:
          type: string
        asset_type:
          type: string
        protocol_version:
          type: string
        cipher_suite:
          type: string
        key_exchange_algorithm:
          type: string
        hash_algorithm:
          type: string
        key_size:
          type: integer
        tls_versions:
          type: array
          items:
            type: string
        supported_ciphers:
          type: array
          items:
            type: string
        cert_validation_status:
          type: string
        cert_validation_error:
          type: string
        certificates:
          type: array
          items:
            $ref: '#/components/schemas/JobResultCertificate'
        service_name:
          type: string
        crypto_observed:
          type: boolean
          description: |
            True when a handshake was actually measured (a cipher suite or
            negotiated version is present). False means the asset was listed by
            a management API and never probed — which is why its crypto fields
            are empty. Without this flag "not measured" reads as "nothing found".
        metadata:
          type: object
          additionalProperties: true
          description: Vendor inventory fields, scrubbed of secret-looking keys.
    JobResultCertificate:
      type: object
      additionalProperties: false
      properties:
        subject_dn:
          type: string
        issuer_dn:
          type: string
        serial_number:
          type: string
        fingerprint_sha256:
          type: string
        not_before:
          type: string
        not_after:
          type: string
        key_algorithm:
          type: string
        key_size:
          type: integer
        signature_alg:
          type: string
        subject_alternative_names:
          type: array
          items:
            type: string
        self_signed:
          type: boolean
    LegacyError:
      type: object
      additionalProperties: true
      description: CURRENT error shape — a single human-readable string under `error`. Superseded by the ADR-0002 Error envelope as endpoints are hardened.
      required:
      - error
      properties:
        error:
          type: string
    Error:
      type: object
      additionalProperties: false
      description: ADR-0002 error envelope. Clients branch on `error.code`, never on `message`.
      required:
      - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
          - code
          - message
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                $ref: '#/components/schemas/ErrorDetail'
            request_id:
              type: string
    ErrorDetail:
      type: object
      additionalProperties: false
      required:
      - field
      - issue
      properties:
        field:
          type: string
        issue:
          type: string
    Pagination:
      type: object
      additionalProperties: false
      description: ADR-0002 pagination block for collection envelopes.
      required:
      - total
      - limit
      - offset
      properties:
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        next_offset:
          type:
          - integer
          - 'null'
