openapi: 3.1.0
info:
  title: VistaPlatform — device-interrogation-service API
  version: 0.1.0
  description: |
    Spec-first contract for device-interrogation-service (ADR-0001). First slice
    for this service, covering the **interrogation jobs** read surface — the job
    list / detail / stats / active / results views the Operations area shows for
    device + cloud discovery runs. UI consumer:
    `web-ui/src/services/interrogation-jobs-api.ts`.

    ## Testability note

    Unlike the earlier slices, this service's job handlers queried `*sql.DB`
    inline. This slice landed a behaviour-preserving refactor first: the SQL was
    relocated verbatim into a `jobRepository` behind a `jobStore` interface that
    `JobHandlers` now depends on (`services/device-interrogation-service/internal/handlers/jobs_repository.go`),
    which is what makes the handlers contract-testable with an in-memory stub —
    no database. See the Go contract test
    (`services/device-interrogation-service/internal/handlers/jobs_contract_test.go`).

    ## Scope of this spec

    The jobs read endpoints on `/api/v1/device-interrogation-service/...`:

      - `GET /jobs`            — list (paginated, filtered)
      - `GET /jobs/stats`      — aggregate job statistics
      - `GET /jobs/active`     — currently pending/in-progress jobs
      - `GET /jobs/{id}`       — get one
      - `GET /jobs/{id}/results` — a job's results (placeholder shape today)

    Out of scope (this slice): the job mutations (`POST /jobs/{id}/retry`,
    `/cancel`), and the integrations / devices / cloud / schedules / agents /
    downloads / experimental surfaces on this service (each needs the same
    repo-interface refactor first).

    ## Shape status

    These document the current pre-envelope shapes (lists wrapped under `jobs`
    with `total`/`page`/`page_size`, single under `{ "job": {...} }`, stats under
    `{ "stats": {...} }`, errors as `{ "error": "string" }`). The go-forward
    ADR-0002 envelope is defined under components.schemas for future hardening.
  contact:
    name: VistaPlatform Platform
servers:
- url: /api/v1/device-interrogation-service
  description: device-interrogation-service v1, mounted behind the API gateway.
tags:
- name: interrogation-jobs
  description: Device + cloud interrogation jobs — list, detail, stats, active, results.
- name: devices
  description: 'Network devices registered for cryptographic interrogation
    (F5, Palo Alto, Cisco, Fortinet, UniFi). Read surface. UI consumer:
    `web-ui/src/services/devices-api.ts`.'
- name: schedules
  description: 'Recurring interrogation schedules (cron-driven device / cloud
    discovery) — full CRUD plus trigger / enable / disable / run-history. UI
    consumer: `web-ui/src/services/schedules-api.ts`.'
- name: integrations
  description: 'Cloud integrations (AWS / Azure / GCP) used for cloud discovery —
    full CRUD plus a connection test. Credentials are encrypted at rest and
    masked in responses. UI consumer:
    `web-ui/src/services/cloud-integrations-api.ts` (Inventory → Connections lens).'
- name: admin
  description: |
    Platform-admin oversight surface (admin-ui only). Gated by
    `RequirePlatformAdmin()` — a tenant JWT is rejected. Consumer:
    `admin-ui/src/services/platform-devices-api.ts`.

    Reality note: `GET /admin/metrics` and `GET /admin/agents` (the Fleet
    roster) are implemented in the Go router today. The admin-ui client also
    calls `/admin/tenants`, `/admin/errors`, and `/admin/jobs/stats`, but those
    routes are NOT registered server-side — the client wraps each in try/catch
    and falls back to empty data, so they are intentionally absent from this
    spec. See the handoff report for the Go-vs-TS gap details.

paths:
  /integrations:
    get:
      operationId: listIntegrations
      tags:
      - integrations
      summary: List the tenant's cloud integrations
      description: Includes shared (platform-wide) integrations. Optional `?provider=` filters by integration type.
      parameters:
      - name: provider
        in: query
        required: false
        description: Filter by integration_type (e.g. aws).
        schema:
          type: string
      responses:
        '200':
          description: The tenant's integrations (credentials masked).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationListResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '500':
          $ref: '#/components/responses/LegacyServerError'
    post:
      operationId: createIntegration
      tags:
      - integrations
      summary: Create a cloud integration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIntegrationRequest'
      responses:
        '201':
          description: The created integration (credentials masked).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /integrations/{id}:
    parameters:
    - $ref: '#/components/parameters/IntegrationId'
    get:
      operationId: getIntegration
      tags:
      - integrations
      summary: Get a cloud integration by id
      responses:
        '200':
          description: The integration (credentials masked).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '404':
          $ref: '#/components/responses/LegacyNotFound'
        '500':
          $ref: '#/components/responses/LegacyServerError'
    put:
      operationId: updateIntegration
      tags:
      - integrations
      summary: Update a cloud integration
      description: Partial update; `config` is merged into the existing (decrypted) config, re-validated, and re-encrypted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateIntegrationRequest'
      responses:
        '200':
          description: Update acknowledged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '404':
          $ref: '#/components/responses/LegacyNotFound'
        '500':
          $ref: '#/components/responses/LegacyServerError'
    delete:
      operationId: deleteIntegration
      tags:
      - integrations
      summary: Delete a cloud integration (soft delete)
      responses:
        '200':
          description: Deletion acknowledged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '404':
          $ref: '#/components/responses/LegacyNotFound'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /integrations/{id}/test:
    parameters:
    - $ref: '#/components/parameters/IntegrationId'
    post:
      operationId: testIntegrationConnection
      tags:
      - integrations
      summary: Test a cloud integration's connection
      description: Decrypts the stored credentials and probes the provider; records last_tested_at + status. Always 200 with a success flag (auth failures are reported in the body, not the HTTP status).
      responses:
        '200':
          description: The connection test result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestConnectionResult'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '404':
          $ref: '#/components/responses/LegacyNotFound'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /schedules:
    get:
      operationId: listSchedules
      tags:
      - schedules
      summary: List the tenant's interrogation schedules
      responses:
        '200':
          description: The tenant's schedules.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleListResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '500':
          $ref: '#/components/responses/LegacyServerError'
    post:
      operationId: createSchedule
      tags:
      - schedules
      summary: Create an interrogation schedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScheduleRequest'
      responses:
        '201':
          description: The created schedule (bare object).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterrogationSchedule'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /schedules/{id}:
    parameters:
    - $ref: '#/components/parameters/ScheduleId'
    get:
      operationId: getSchedule
      tags:
      - schedules
      summary: Get a schedule by id
      description: Bare object. Tenant isolation — a schedule owned by another tenant returns 404.
      responses:
        '200':
          description: The schedule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterrogationSchedule'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '404':
          $ref: '#/components/responses/LegacyNotFound'
    put:
      operationId: updateSchedule
      tags:
      - schedules
      summary: Update a schedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateScheduleRequest'
      responses:
        '200':
          description: The updated schedule (bare object).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterrogationSchedule'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '404':
          $ref: '#/components/responses/LegacyNotFound'
        '500':
          $ref: '#/components/responses/LegacyServerError'
    delete:
      operationId: deleteSchedule
      tags:
      - schedules
      summary: Delete a schedule
      responses:
        '200':
          description: Deletion acknowledged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '404':
          $ref: '#/components/responses/LegacyNotFound'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /schedules/{id}/trigger:
    parameters:
    - $ref: '#/components/parameters/ScheduleId'
    post:
      operationId: triggerSchedule
      tags:
      - schedules
      summary: Trigger a schedule to run now
      responses:
        '202':
          description: The schedule run was queued; returns the created job id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriggerScheduleResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '404':
          $ref: '#/components/responses/LegacyNotFound'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /schedules/{id}/enable:
    parameters:
    - $ref: '#/components/parameters/ScheduleId'
    post:
      operationId: enableSchedule
      tags:
      - schedules
      summary: Enable a schedule
      responses:
        '200':
          description: The updated schedule (is_enabled=true).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterrogationSchedule'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '404':
          $ref: '#/components/responses/LegacyNotFound'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /schedules/{id}/disable:
    parameters:
    - $ref: '#/components/parameters/ScheduleId'
    post:
      operationId: disableSchedule
      tags:
      - schedules
      summary: Disable a schedule
      responses:
        '200':
          description: The updated schedule (is_enabled=false).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterrogationSchedule'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '404':
          $ref: '#/components/responses/LegacyNotFound'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /schedules/{id}/history:
    parameters:
    - $ref: '#/components/parameters/ScheduleId'
    get:
      operationId: getScheduleHistory
      tags:
      - schedules
      summary: Get a schedule's recent run history
      responses:
        '200':
          description: The schedule's run history (up to 50 most recent).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleHistoryResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '404':
          $ref: '#/components/responses/LegacyNotFound'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /agents:
    get:
      operationId: listAgents
      tags:
      - agents
      summary: List the tenant's device interrogation agents
      description: |
        Read-only roster of the tenant's enrolled device interrogation agents
        (the downloadable device-agent binary), for the web-ui Discovery →
        Sensors & Agents fleet list. Tenant-scoped (DiscoveryRead) and
        RLS-isolated on `device_agents`. Enveloped under `agents` (nullable
        array on an empty result) plus a `count`. Each row exposes only
        device_agents telemetry; the secret `registration_key` is intentionally
        NOT included.
      responses:
        '200':
          description: The tenant's device interrogation agents.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentListResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /agents/{id}:
    delete:
      operationId: deleteAgent
      tags:
      - agents
      summary: Remove one of the tenant's device interrogation agents
      description: |
        Soft-deletes the agent (`device_agents.deleted_at`) and settles everything
        that pointed at it, in one transaction: the agent's PENDING jobs are
        released back to the unassigned pool (`agent_id = NULL`) so the in-cluster
        worker or another agent picks them up; its IN-PROGRESS jobs are failed,
        because a deleted agent will never report a result and re-queueing could
        double-execute an interrogation; and its certificates are revoked.

        Gated at DiscoveryManage — the same permission as the other destructive
        routes in this service. RLS-isolated on `device_agents`: another tenant's
        agent id is answered 404, identically to an unknown id.

        The in-cluster platform agent's per-tenant row (`platform = 'platform'`)
        is refused with 403: it is the tenant's handle to a service shared by all
        tenants, not an agent they deployed.

        This does NOT uninstall the agent binary, which keeps running on the
        operator's host. It fails closed regardless: every agent-outbound path
        resolves the agent with `deleted_at IS NULL`, so a deleted agent's polls
        are rejected and it receives no jobs and no credentials.
      parameters:
      - name: id
        in: path
        required: true
        description: The agent's UUID.
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The agent was removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '403':
          $ref: '#/components/responses/LegacyForbidden'
        '404':
          $ref: '#/components/responses/LegacyNotFound'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /devices:
    get:
      operationId: listDevices
      tags:
      - devices
      summary: List the tenant's interrogation devices
      responses:
        '200':
          description: The tenant's devices.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceListResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '500':
          $ref: '#/components/responses/LegacyServerError'
    post:
      operationId: createDevice
      tags:
      - devices
      summary: Register a device for interrogation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeviceRequest'
      responses:
        '201':
          description: The created device (bare object).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /devices/{id}:
    parameters:
    - name: id
      in: path
      required: true
      description: Device UUID.
      schema:
        type: string
        format: uuid
    get:
      operationId: getDevice
      tags:
      - devices
      summary: Get a device by id
      description: Returns the device (bare object). Tenant isolation — a device owned by another tenant returns 404.
      responses:
        '200':
          description: The device (bare object).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '404':
          $ref: '#/components/responses/LegacyNotFound'
      x-quirks:
      - 'Any retrieval failure and any cross-tenant device both return 404 (not 403/500).'
    put:
      operationId: updateDevice
      tags:
      - devices
      summary: Update a device
      description: Partial update. Tenant-isolated — a device owned by another tenant returns 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDeviceRequest'
      responses:
        '200':
          description: The updated device (bare object).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '404':
          $ref: '#/components/responses/LegacyNotFound'
        '500':
          $ref: '#/components/responses/LegacyServerError'
    delete:
      operationId: deleteDevice
      tags:
      - devices
      summary: Delete a device
      description: Tenant-isolated — a device owned by another tenant returns 404.
      responses:
        '200':
          description: Deletion acknowledged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '404':
          $ref: '#/components/responses/LegacyNotFound'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /devices/{id}/interrogate:
    parameters:
    - name: id
      in: path
      required: true
      description: Device UUID.
      schema:
        type: string
        format: uuid
    post:
      operationId: interrogateDevice
      tags:
      - devices
      summary: Interrogate a device
      description: |
        Kicks off interrogation of the device. The success path performs live
        device I/O (HTTP to the target), so it is integration-tested; the contract
        test pins the request-validation paths (400 bad id / 404 device not found).
      responses:
        '202':
          description: Interrogation accepted (async). Body is the queued-job info (not contract-pinned).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceActionAccepted'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '404':
          $ref: '#/components/responses/LegacyNotFound'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /devices/{id}/test-connection:
    parameters:
    - name: id
      in: path
      required: true
      description: Device UUID.
      schema:
        type: string
        format: uuid
    post:
      operationId: testDeviceConnection
      tags:
      - devices
      summary: Test connectivity to a device
      description: |
        Tests connectivity to the device. The success path performs live device
        I/O, so it is integration-tested; the contract test pins the
        request-validation paths (400 bad id / 404 device not found).
      responses:
        '200':
          description: Connectivity result (live; not contract-pinned).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceActionAccepted'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '404':
          $ref: '#/components/responses/LegacyNotFound'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /devices/bulk-interrogate:
    post:
      operationId: bulkInterrogateDevices
      tags:
      - devices
      summary: Interrogate multiple devices
      description: |
        Kicks off interrogation of multiple devices. Live device I/O on success
        (integration-tested); the contract test pins the bad-body 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '202':
          description: Bulk interrogation accepted (async; not contract-pinned).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceActionAccepted'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /devices/discover-and-create:
    post:
      operationId: discoverAndCreateDevice
      tags:
      - devices
      summary: Discover a device and create it
      description: |
        Probes the target (live device I/O), then creates the device record.
        Integration-tested on success; the contract test pins the bad-body 400.
        Returns the created Device on success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: The created device.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /jobs:
    get:
      operationId: listInterrogationJobs
      tags:
      - interrogation-jobs
      summary: List interrogation jobs for the current tenant
      description: |
        Returns a paginated page of jobs. Filters (status[], job_type, device_id,
        integration_id) are accepted as query params; page / page_size paginate.
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
      responses:
        '200':
          description: A page of interrogation jobs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobListResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /jobs/stats:
    get:
      operationId: getInterrogationJobStats
      tags:
      - interrogation-jobs
      summary: Aggregate interrogation-job statistics
      responses:
        '200':
          description: Job statistics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatsResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
      x-quirks:
      - On a stats query error the handler returns 200 with an all-zero stats object, not 500.
  /jobs/active:
    get:
      operationId: getActiveInterrogationJobs
      tags:
      - interrogation-jobs
      summary: List currently active (pending / in-progress) jobs
      responses:
        '200':
          description: The active jobs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveJobsResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
      x-quirks:
      - 'On a query error the handler returns 200 with `{"jobs": []}`, not 500.'
  /jobs/{id}:
    parameters:
    - name: id
      in: path
      required: true
      description: Job UUID.
      schema:
        type: string
        format: uuid
    get:
      operationId: getInterrogationJob
      tags:
      - interrogation-jobs
      summary: Get an interrogation job by id
      responses:
        '200':
          description: The job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '404':
          $ref: '#/components/responses/LegacyNotFound'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /jobs/{id}/results:
    parameters:
    - name: id
      in: path
      required: true
      description: Job UUID.
      schema:
        type: string
        format: uuid
    get:
      operationId: getInterrogationJobResults
      tags:
      - interrogation-jobs
      summary: Get an interrogation job's results
      description: Returns the job's discovered assets (crypto posture + certificates), a summary, and the post-processing verdict. Projected and scrubbed — see JobResultsResponse.
      responses:
        '200':
          description: The job results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResultsResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '404':
          $ref: '#/components/responses/LegacyNotFound'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /jobs/{id}/retry:
    parameters:
    - name: id
      in: path
      required: true
      description: Job UUID.
      schema:
        type: string
        format: uuid
    post:
      operationId: retryInterrogationJob
      tags:
      - interrogation-jobs
      summary: Retry a failed or cancelled job
      description: Resets the job to pending. Only failed/cancelled jobs may be retried (else 400).
      responses:
        '200':
          description: The job was queued for retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetryJobResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '404':
          $ref: '#/components/responses/LegacyNotFound'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /jobs/{id}/cancel:
    parameters:
    - name: id
      in: path
      required: true
      description: Job UUID.
      schema:
        type: string
        format: uuid
    post:
      operationId: cancelInterrogationJob
      tags:
      - interrogation-jobs
      summary: Cancel a pending or in-progress job
      description: Only pending / assigned / in-progress jobs may be cancelled (else 400).
      responses:
        '200':
          description: The job was cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '404':
          $ref: '#/components/responses/LegacyNotFound'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /cloud/discover:
    post:
      operationId: discoverCloudResources
      tags:
      - cloud
      summary: Start an ad-hoc cloud discovery job
      description: |
        Triggers an immediate cloud discovery run for one integration. The job is
        created and started asynchronously; the response returns the job_id so the
        caller can poll /jobs/{id} for status. Requires discovery.manage permission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudDiscoverRequest'
      responses:
        '202':
          description: Discovery job accepted and started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudDiscoverResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /admin/metrics:
    get:
      operationId: getAdminMetrics
      tags:
      - admin
      summary: Platform-wide device/integration/job health summary
      description: |
        Aggregate health metrics across ALL tenants for the admin-ui platform
        oversight dashboard. Platform-admin only (`RequirePlatformAdmin()` — a
        tenant JWT is rejected with 401/403). Returns the bare
        `PlatformHealthSummary` object (NOT enveloped under a key).

        Shape note: the admin-ui's `getMetrics()` (`platform-devices-api.ts`)
        expects a different, nested `PlatformMetrics` shape
        (`{ devices, jobs, tenants, recent_errors }`). The Go handler actually
        returns this FLAT `PlatformHealthSummary`. The client try/catches and
        falls back to zeros, masking the mismatch. This spec documents the
        real Go response.
      responses:
        '200':
          description: The platform-wide health summary (bare object).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformHealthSummary'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /admin/agents:
    get:
      operationId: listAdminAgents
      tags:
      - admin
      summary: Platform-wide interrogation-agent roster (Fleet view)
      description: |
        Read-only roll-up of every device interrogation agent across ALL
        tenants, for the VISTA Operations "Fleet" view in admin-ui.
        Platform-admin only (`RequirePlatformAdmin()` — a tenant JWT is
        rejected with 403). Unlike the tenant-scoped `GET /agents` this
        deliberately omits the tenant_id filter and joins `tenants` so each row
        carries tenant identity (`tenant_id` + `tenant_name` + `tenant_slug`).

        An optional `tenant_id` narrows the roll-up to a single tenant
        server-side (the operator "scope" selector) so the client is never
        shipped other tenants' rows; omit it for the full cross-tenant view.

        Returned enveloped under `agents` (always a non-nil array) plus a
        `count`. Each row exposes only telemetry that exists on the
        `device_agents` table; the secret `registration_key` is intentionally
        NOT included.
      parameters:
      - name: tenant_id
        in: query
        required: false
        description: Narrow the cross-tenant roll-up to a single tenant (operator scope).
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The platform-wide agent roster.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAgentListResponse'
        '403':
          $ref: '#/components/responses/LegacyForbidden'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /admin/jobs:
    get:
      operationId: listAdminJobs
      tags:
      - admin
      summary: Platform-wide interrogation jobs (Jobs & Queues view)
      description: |
        Read-only roll-up of interrogation jobs across ALL tenants, for the VISTA
        Operations "Jobs & Queues" view in admin-ui. Platform-admin only
        (`RequirePlatformAdmin()` — a tenant JWT is rejected with 403). Unlike the
        tenant-scoped `GET /jobs` this deliberately omits the tenant_id filter and
        joins `tenants` so each row carries tenant identity (`tenant_id` +
        `tenant_name` + `tenant_slug`), plus the assigned `worker` (the executing
        agent id, from `device_jobs.agent_id`).

        Same optional filters (status[], job_type, device_id, integration_id) and
        page / page_size pagination as `GET /jobs`. An optional `tenant_id` narrows
        the roll-up to a single tenant server-side (the operator "scope" selector) so
        the client is never shipped other tenants' rows; omit it for the full
        cross-tenant view. The Support cockpit's Job Repair action adds cross-tenant
        `POST /admin/jobs/{id}/retry` and `/cancel` (both platform-admin gated) so
        operators can recover a stuck customer job directly.
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      - name: tenant_id
        in: query
        required: false
        description: Narrow the cross-tenant roll-up to a single tenant (operator scope).
        schema:
          type: string
          format: uuid
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
      - name: status
        in: query
        required: false
        description: Repeatable; filters by job status (status=pending&status=failed).
        schema:
          type: array
          items:
            type: string
      - name: job_type
        in: query
        required: false
        schema:
          type: string
      - name: device_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: integration_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: A page of platform-wide interrogation jobs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminJobListResponse'
        '403':
          $ref: '#/components/responses/LegacyForbidden'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /admin/jobs/{id}/retry:
    parameters:
    - name: id
      in: path
      required: true
      description: Job UUID.
      schema:
        type: string
        format: uuid
    post:
      operationId: retryAdminInterrogationJob
      tags:
      - admin
      summary: Retry a failed or cancelled job across any tenant (platform-admin)
      description: |
        Cross-tenant retry for the Support cockpit's Job Repair action. Looks the
        job up by id alone (no tenant scope) and resets it to pending. Only
        failed/cancelled jobs may be retried (else 400). Platform-admin only
        (`RequirePlatformAdmin()` — a tenant JWT is rejected with 403).
      responses:
        '200':
          description: The job was queued for retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetryJobResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '403':
          $ref: '#/components/responses/LegacyForbidden'
        '404':
          $ref: '#/components/responses/LegacyNotFound'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /admin/jobs/{id}/cancel:
    parameters:
    - name: id
      in: path
      required: true
      description: Job UUID.
      schema:
        type: string
        format: uuid
    post:
      operationId: cancelAdminInterrogationJob
      tags:
      - admin
      summary: Cancel a pending or in-progress job across any tenant (platform-admin)
      description: |
        Cross-tenant cancel for the Support cockpit's Job Repair action. Looks the
        job up by id alone (no tenant scope). Only pending / assigned / in-progress
        jobs may be cancelled (else 400). Platform-admin only
        (`RequirePlatformAdmin()` — a tenant JWT is rejected with 403).
      responses:
        '200':
          description: The job was cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '403':
          $ref: '#/components/responses/LegacyForbidden'
        '404':
          $ref: '#/components/responses/LegacyNotFound'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /admin/queues:
    get:
      operationId: listAdminQueues
      tags:
      - admin
      summary: Platform-wide JetStream queue (stream/consumer) telemetry
      description: |
        Read-only per-queue backlog telemetry for the VISTA Operations "Queues"
        panel, sourced live from NATS JetStream stream + durable-consumer info.
        Platform-admin only (`RequirePlatformAdmin()` — a tenant JWT is rejected
        with 403).

        Each queue is one JetStream stream (the platform's DefaultStreams). The
        meaningful per-queue depth is each consumer's `depth` (JetStream
        `num_pending` — undelivered backlog); `in_flight` is delivered-but-unacked
        (`num_ack_pending`); `num_waiting` is parked pull requests (idle workers).
        Stream-level `messages`/`bytes` are total retained (subject to MaxAge),
        not a live depth.

        Metrics honesty: JetStream does NOT expose per-queue throughput rate or
        p95 latency, so those are intentionally absent — they are not fabricated.
        Streams that do not yet exist (no producer has run) are skipped.

        Returns 503 when NATS/JetStream is unavailable (e.g. dev compose without
        NATS) rather than inventing metrics.
      responses:
        '200':
          description: Per-queue live JetStream telemetry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminQueueListResponse'
        '403':
          $ref: '#/components/responses/LegacyForbidden'
        '500':
          $ref: '#/components/responses/LegacyServerError'
        '503':
          description: NATS/JetStream unavailable; queue metrics cannot be read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'

components:
  parameters:
    ScheduleId:
      name: id
      in: path
      required: true
      description: Schedule UUID.
      schema:
        type: string
        format: uuid
    IntegrationId:
      name: id
      in: path
      required: true
      description: Integration UUID.
      schema:
        type: string
        format: uuid
  responses:
    LegacyBadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyError'
    LegacyNotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyError'
    LegacyServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyError'
    LegacyForbidden:
      description: Caller is not a platform admin.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyError'
  schemas:
    CloudDiscoverRequest:
      type: object
      description: Request body for POST /cloud/discover — triggers an ad-hoc cloud discovery run.
      required:
      - integration_id
      - resource_types
      properties:
        integration_id:
          type: string
          format: uuid
          description: The cloud integration to run discovery against.
        cloud_provider:
          type: string
          description: 'Provider hint (aws / azure / gcp). Auto-detected from the integration when omitted.'
          enum:
          - aws
          - azure
          - gcp
        resource_types:
          type: array
          items:
            type: string
          description: 'Provider-specific resource types to discover (e.g. alb, api_gateway, cloudfront for AWS).'
        regions:
          type: array
          items:
            type: string
          description: 'AWS regions to scan (e.g. us-east-1). Ignored for GCP.'
        resource_groups:
          type: array
          items:
            type: string
          description: Azure resource groups to filter by. Ignored for AWS and GCP.
    CloudDiscoverResponse:
      type: object
      description: Response for POST /cloud/discover.
      properties:
        message:
          type: string
        job_id:
          type: string
          format: uuid
    CreateDeviceRequest:
      type: object
      additionalProperties: false
      description: Request body for POST /devices. `password` is encrypted at rest.
      required:
      - device_type
      properties:
        device_type:
          type: string
        vendor:
          type: string
        model:
          type: string
        hostname:
          type: string
        ip_address:
          type: string
        management_url:
          type: string
        serial_number:
          type: string
        firmware_version:
          type: string
        discovery_method:
          type: string
        credential_id:
          type: string
          format: uuid
        username:
          type: string
        password:
          type: string
        tls_insecure_skip_verify:
          type: boolean
        metadata:
          type: object
          additionalProperties: true
        tags:
          type: object
          additionalProperties: true
    UpdateDeviceRequest:
      type: object
      additionalProperties: false
      description: Request body for PUT /devices/{id}. All fields optional.
      properties:
        vendor:
          type: string
        model:
          type: string
        hostname:
          type: string
        ip_address:
          type: string
        management_url:
          type: string
        serial_number:
          type: string
        firmware_version:
          type: string
        credential_id:
          type: string
          format: uuid
        username:
          type: string
        password:
          type: string
        tls_insecure_skip_verify:
          type: boolean
        connection_status:
          type: string
        metadata:
          type: object
          additionalProperties: true
        tags:
          type: object
          additionalProperties: true
    RetryJobResponse:
      type: object
      additionalProperties: false
      description: 'CURRENT envelope for POST /jobs/{id}/retry — `{ "message": "...", "job": { "id": ..., "status": "pending" } }`.'
      required:
      - message
      - job
      properties:
        message:
          type: string
        job:
          type: object
          additionalProperties: false
          required:
          - id
          - status
          properties:
            id:
              type: string
              format: uuid
            status:
              type: string
    CloudIntegration:
      type: object
      additionalProperties: false
      description: |
        A cloud integration (handlers.CloudIntegration — the API response shape).
        `config` is the credential map with sensitive fields MASKED (never the
        plaintext or ciphertext). The listed required fields are always present;
        the rest are `omitempty`.
      required:
      - id
      - tenant_id
      - integration_type
      - integration_name
      - provider
      - config
      - is_enabled
      - status
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        integration_type:
          type: string
          description: aws / azure / gcp / ...
        integration_name:
          type: string
        provider:
          type: string
        config:
          type: [object, 'null']
          additionalProperties: true
          description: Credential map with sensitive values masked.
        account_id:
          type: string
        region:
          type: string
        environment:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        is_enabled:
          type: boolean
        is_shared:
          type: boolean
        status:
          type: string
          description: pending / configured / connected / error.
        status_message:
          type: string
        last_tested_at:
          type: string
          format: date-time
        last_test_error:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateIntegrationRequest:
      type: object
      additionalProperties: false
      description: Request body for POST /integrations.
      required:
      - integration_type
      - integration_name
      - provider
      - config
      properties:
        integration_type:
          type: string
        integration_name:
          type: string
        provider:
          type: string
        config:
          type: object
          additionalProperties: true
        account_id:
          type: string
        region:
          type: string
        environment:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        is_enabled:
          type: boolean
    UpdateIntegrationRequest:
      type: object
      additionalProperties: false
      description: Request body for PUT /integrations/{id}. All fields optional.
      properties:
        integration_name:
          type: string
        config:
          type: object
          additionalProperties: true
        account_id:
          type: string
        region:
          type: string
        environment:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        is_enabled:
          type: boolean
    IntegrationListResponse:
      type: object
      additionalProperties: false
      description: 'CURRENT envelope for GET /integrations — `{ "integrations": [...], "count": N }`. `integrations` is always a non-nil array.'
      required:
