      tags: [auth]
      summary: List available sign-in methods for an email
      description: >
        Public, pre-session lookup the shared login page uses to discover how a
        given email can sign in. Resolves the user by email and returns the
        tenant's enabled SSO providers (plus the always-present password method),
        so the login page can render "Continue with <provider>" and build the
        SSO authorize URL without a second round-trip.


        The flow: the page POSTs the email here, then for an `sso` method
        navigates the browser to
        `/api/v1/auth-service/auth/sso/{provider_name}/authorize?tenant_id={tenant_id}`
        using the returned `tenant_id` + the method's `provider_name`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
