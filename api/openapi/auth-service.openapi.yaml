  # ===========================================================================
  # API tokens (PATs) — bearer credentials for programmatic access. The v1
  # consumer is mcp-service (Settings → API Tokens mints a token; an MCP
  # client presents it as `Authorization: Bearer qvpat_...`). Tokens are
  # user-owned: every route operates on the caller's own tokens only, no
  # cross-user administration in v1. The plaintext token appears exactly once,
  # in the 201 create response. The HMAC-guarded internal exchange endpoint
  # (/internal/api-tokens/exchange) is deliberately NOT in this spec — it is
  # service-to-service only, never client-facing.
  # Handlers: services/auth-service/internal/apitokens/handlers.go.
  # ===========================================================================
  /api-tokens:
    get:
      operationId: listApiTokens
      tags: [api-tokens]
      summary: List the caller's API tokens
      description: >
        Returns every API token the calling user has minted in the current
        tenant, newest first — revoked and expired tokens included (the row is
        the audit record of the credential). Plaintext token values are never
        returned here.
      responses:
        "200":
          description: The caller's tokens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APITokenListResponse"
        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
        "500":
          $ref: "#/components/responses/LegacyServerError"
    post:
      operationId: createApiToken
      tags: [api-tokens]
      summary: Mint a new API token
      description: >
        Creates a token owned by the calling user. `permissions` must be a
        subset of the allowed read-only set (`assets.read`, `compliance.read`,
        `reports.read`, `discovery.read`, `sensors.read`, `settings.read`);
        omitted means the default set (`assets.read`, `compliance.read`,
        `reports.read`). `expires_in_days` defaults to 90, max 365. The
        response's `plaintext_token` is shown exactly once and never
        retrievable again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/APITokenCreateRequest"
      responses:
        "201":
          description: Token created; plaintext included this one time.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APITokenCreateResponse"
        "400":
          $ref: "#/components/responses/LegacyBadRequest"
        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
        "409":
          description: Active-token limit reached (25 per user).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyError"
        "500":
          $ref: "#/components/responses/LegacyServerError"
  /api-tokens/{id}:
    delete:
      operationId: revokeApiToken
      tags: [api-tokens]
      summary: Revoke an API token
      description: >
        Marks the token revoked (rows are never deleted). Owner-only: a token
        belonging to another user reads as 404. Revoking an already-revoked
        token returns 409.
      parameters:
        - name: id
          in: path
          required: true
          description: Token UUID.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Token revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APITokenRevokeResponse"
        "400":
          $ref: "#/components/responses/LegacyBadRequest"
        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
        "404":
          $ref: "#/components/responses/LegacyNotFound"
        "409":
          description: Token already revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyError"
        "500":
          $ref: "#/components/responses/LegacyServerError"

components:
  parameters:
    TenantId:
      name: tenantId
      in: path
      required: true
      description: Tenant UUID.
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      description: User UUID.
      schema:
        type: string
        format: uuid
  responses:
    LegacyBadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LegacyError"
    LegacyUnauthorized:
      description: Missing or invalid auth / tenant context.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LegacyError"
    LegacyNotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LegacyError"
    LegacyForbidden:
      description: Caller lacks the required role/permission.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LegacyError"
    LegacyServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LegacyError"

  schemas:
    # --- Public sign-in helpers (login page) --------------------------------
    AuthMethodsRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    AuthMethod:
      type: object
      description: >
        One available sign-in method. `password` is always present for a known
        user; `sso` entries carry the provider identity needed to start the
        authorize flow. A `platform_sso` type may also appear.
      required: [type, enabled]
      properties:
        type:
          type: string
          enum: [password, sso, platform_sso]
        enabled: { type: boolean }
        provider:
          type: string
          description: "Provider type (e.g. google, microsoft). Present for sso / platform_sso."
        provider_id:
          type: string
          format: uuid
          description: "sso_providers row id. Present for tenant sso methods."
        provider_name:
          type: string
          description: "Tenant-chosen provider name; the URL segment for the authorize endpoint. Present for tenant sso methods."
    AuthMethodsResponse:
      type: object
      required: [email, methods]
      properties:
        email: { type: string, format: email }
        tenant_id:
          type: string
          description: "The resolved user's tenant id, or empty string when the email matches no active user. Used to build the SSO authorize URL."
        methods:
          type: array
          items: { $ref: "#/components/schemas/AuthMethod" }
    # --- Member invitations ------------------------------------------
    InvitationLookupResponse:
      type: object
      required: [email, allow_password]
      properties:
        email: { type: string, format: email }
        tenant_name: { type: string }
        allow_password:
          type: boolean
          description: "False when the tenant's policy is sso_only."
        sso_providers:
          type: array
          items:
            type: object
            required: [provider, provider_name]
            properties:
              provider: { type: string, description: "Provider type (google, microsoft, azure)." }
              provider_name: { type: string, description: "The authorize URL segment for this provider." }
    AcceptInvitationRequest:
      type: object
      required: [token, password]
      properties:
        token: { type: string }
        password: { type: string }
    PendingInvitation:
      type: object
      required: [id, email, role, status, created_at, expires_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { type: string }
        status: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    PendingInvitationsResponse:
      type: object
      required: [invitations]
      properties:
        invitations:
          type: array
          items: { $ref: "#/components/schemas/PendingInvitation" }
    InvitationResendResponse:
      type: object
      required: [message]
      properties:
        message: { type: string }
        accept_url: { type: string }
    # --- Platform social signup --------------------------------------
    PlatformSsoProvider:
      type: object
      required: [id, provider_type, provider_name]
      properties:
        id: { type: string, format: uuid }
        provider_type: { type: string, enum: [google, microsoft] }
        provider_name: { type: string }
    PlatformSsoProvidersResponse:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          items: { $ref: '#/components/schemas/PlatformSsoProvider' }
    PlatformSsoRegisterCompleteRequest:
      type: object
      required: [sso_token, tenant_name]
      properties:
        sso_token: { type: string }
        tenant_name: { type: string, minLength: 2 }
        accepted_legal:
          type: boolean
          description: >
            Whether the social signup accepted the current Terms of Service and
            Privacy Policy. Server-enforced when legal documents are published.
    PlatformSsoRegisterCompleteResponse:
      type: object
      required: [message]
      properties:
        message: { type: string }
        tenant_id: { type: string, format: uuid }
        user: { type: object, additionalProperties: true }
        requires_verification:
          type: boolean
          description: "True for Microsoft signups (Entra omits email_verified): the account is created but the user must click a verification email before signing in. No session is set."
        email: { type: string }
    # --- API tokens (PATs) --------------------------------------------------
    APIToken:
      type: object
      description: >
        A personal access token record. `token_prefix` is the only fragment of
        the credential ever stored or returned ("qvpat_" + 4 chars) — enough
        to recognize a token in a list, useless for authentication.
        `expires_at` / `last_used_at` / `revoked_at` are OMITTED (not
        present-but-null) when unset; they are omitempty pointers server-side.
      required: [id, tenant_id, user_id, name, token_prefix, permissions, created_at]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        name: { type: string, maxLength: 255 }
        token_prefix: { type: string, maxLength: 16 }
        permissions:
          type: array
          items: { type: string }
        expires_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    APITokenCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Human label, e.g. "Claude Code on my laptop".
        permissions:
          type: array
          items:
            type: string
            enum: [assets.read, compliance.read, reports.read, discovery.read, sensors.read, settings.read]
          description: Subset of the allowed read-only set; omitted = default set.
        expires_in_days:
          type: integer
          minimum: 1
          maximum: 365
          description: Lifetime in days; omitted = 90.
    APITokenCreateResponse:
      type: object
      required: [token, plaintext_token]
      properties:
        token:
          $ref: "#/components/schemas/APIToken"
        plaintext_token:
          type: string
          description: The full token (qvpat_...). Shown exactly once; store it now.
    APITokenListResponse:
      type: object
      required: [tokens]
      properties:
        tokens:
          type: array
          items:
            $ref: "#/components/schemas/APIToken"
    APITokenRevokeResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: revoked
    # ============================================================
    # rbac (roles / permissions)
    # ============================================================
    Role:
      type: object
      additionalProperties: false
      description: >
        A tenant role (rbac.Role). `permissions` is an embedded map and is
        required but nullable (it serializes as null when the role carries no
        permissions map).
      required:
        - id
        - name
        - description
        - permissions
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        permissions:
          type: [object, "null"]
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Permission:
      type: object
      additionalProperties: false
      description: A permission catalogue entry (rbac.Permission).
      required:
        - id
        - name
        - description
        - resource
        - action
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        resource:
          type: string
        action:
          type: string
    RoleListResponse:
      type: object
      additionalProperties: false
      description: >
        CURRENT envelope for GET /tenant/{tenantId}/roles and
        /tenant/{tenantId}/users/{userId}/roles — `{ "roles": [...] }`. On an
        empty/nil result `roles` can serialize as JSON null, so it is typed as a
        nullable array.
      required:
        - roles
      properties:
        roles:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/Role"
    PermissionListResponse:
      type: object
      additionalProperties: false
      description: >
        CURRENT envelope for GET /permissions — `{ "permissions": [...] }`. On
        an empty/nil result `permissions` can serialize as JSON null, so it is
        typed as a nullable array.
      required:
        - permissions
      properties:
        permissions:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/Permission"
    # ============================================================
    # /auth/me
    # ============================================================
    MeResponse:
      type: object
      additionalProperties: false
      description: >
        CURRENT response shape for `GET /auth/me`. `user` is always present;
        `tenant` is present on the happy path and **omitted** when the tenant
        lookup fails (see endpoint x-quirks). Hardening to ADR-0002 would wrap
        this as `{ data: { user, tenant }, ... }` and make tenant explicitly
        nullable.
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"
        tenant:
          $ref: "#/components/schemas/Tenant"

    User:
      type: object
      additionalProperties: false
      description: >
        Authenticated user. `password_hash` is stripped before serialization
        and never present in the response body. `role` is populated from a
        secondary RBAC lookup (primary role for the user under the tenant);
        defaults to the literal `"viewer"` when no `user_tenant_roles` assignment exists.
      required:
        - id
        - tenant_id
        - email
        - first_name
        - last_name
        - role
        - is_active
        - email_verified
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        email:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        role:
          type: string
          description: Primary role name from RBAC; defaults to `"viewer"` when no `user_tenant_roles` assignment exists.
        is_active:
          type: boolean
        email_verified:
          type: boolean
        last_login_at:
          type: [string, "null"]
          format: date-time
        avatar_url:
          type: [string, "null"]
        timezone:
          type: [string, "null"]
        preferences:
          type: [object, "null"]
          additionalProperties: true
          description: Free-form per-user preferences map; `null` when never set.
        password_changed_at:
          type: [string, "null"]
          format: date-time
        locked_until:
          type: [string, "null"]
          format: date-time
        eula_accepted_at:
          type: [string, "null"]
          format: date-time
        eula_version:
          type: [string, "null"]
        onboarding_completed_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: [string, "null"]
          format: date-time

    Tenant:
      type: object
      additionalProperties: false
      description: >
        Tenant organization for the current user. `domain` is `omitempty` in
        Go and may be absent from the body; other optional time fields
        (`trial_ends_at`, `deleted_at`) serialize as `null` when unset.
      required:
        - id
        - name
        - slug
        - subscription_tier_id
        - billing_email
        - payment_status
        - settings
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        domain:
          type: [string, "null"]
          description: Optional; omitted when absent (Go `omitempty`).
        subscription_tier_id:
          type: string
          format: uuid
          description: >
            Zero-uuid string during onboarding (tenant with no tier yet).
        trial_ends_at:
          type: [string, "null"]
          format: date-time
        billing_email:
          type: string
        payment_status:
          type: string
        settings:
          type: [object, "null"]
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: [string, "null"]
          format: date-time

    # ============================================================
    # /user/permissions
    # ============================================================
    PermissionsResponse:
      type: object
      additionalProperties: false
      description: >
        CURRENT response shape for `GET /user/permissions`. A flat string
        array under the `permissions` key. Hardening to ADR-0002 would wrap
        as `{ data: [...], pagination: {...} }`.
      required: [permissions]
      properties:
        permissions:
          type: array
          items:
            type: string
          description: Permission names (e.g. `compliance.manage`, `users.read`).

    # ============================================================
    # /tenant/features
    # ============================================================
    FeaturesResponse:
      type: object
      additionalProperties: false
      description: >
        CURRENT response shape for `GET /tenant/features`. `features` is the
        closed-shape map of every flag in the platform's canonical
        `knownFeatures` list; `limits` is a sparse map (a key is OMITTED when
        the underlying usage lookup failed).
      required: [features, limits]
      properties:
        features:
          $ref: "#/components/schemas/FeatureFlags"
        limits:
          $ref: "#/components/schemas/UsageLimits"

    FeatureFlags:
      type: object
      additionalProperties: false
      description: >
        Closed-shape feature-flag map. Every flag in the platform's
        `knownFeatures` list is present; values are booleans. Adding a new
        flag is a coordinated server + client + spec change.
      required:
        - custom_policies
        - threshold_overrides
        - ot_active_probing
        - ot_primary_lens
        - cbom_signing
        - sso_saml
        - custom_branding
        - cmdb_sync
        - siem_export
        - billing_portal
      properties:
        custom_policies:
          type: boolean
          description: Tenant may author custom (non-platform) compliance frameworks.
        threshold_overrides:
          type: boolean
          description: Tenant may customize measurement predicates on licensed framework controls.
        ot_active_probing:
          type: boolean
          description: Discovery jobs may opt into active OT/ICS probing (Modbus, OPC UA, etc.).
        ot_primary_lens:
          type: boolean
          description: Promote the "OT" inventory lens out of the overflow dropdown to a primary tab.
        cbom_signing:
          type: boolean
          description: >
            CBOM artifacts may be signed and carry compliance-attestation
            layers, and artifact comparison/drift is available. Generation and
            CycloneDX export are unconditional.
        sso_saml:
          type: boolean
          description: >
            Federated sign-in (tenant OIDC/SAML, social signup, staff SSO).
            Local users, invitations, and RBAC are unconditional.
        custom_branding:
          type: boolean
          description: >
            White-label the UI with the tenant's own marks (logo, favicon,
            custom CSS). The palette/theme selector is unconditional.
        cmdb_sync:
          type: boolean
          description: Tenant may sync inventory to an external CMDB/ITSM (ServiceNow, Device42, SolarWinds).
        siem_export:
          type: boolean
          description: Tenant may forward audit events to an external SIEM (Splunk, Datadog, Elastic, webhook).
        billing_portal:
          type: boolean
          description: >
            Tenant-facing self-service billing — subscription, invoices, plan
            change and the payment portal (admin-service `/my-billing/**`).
            Core mounts none of it; usage-against-limits stays unconditional.

    UsageLimits:
      type: object
      additionalProperties: false
      description: >
        Sparse map — a key is OMITTED (not present-but-null) when the
        underlying usage lookup errored. Currently only `compliance_frameworks`
        is published.
      properties:
        compliance_frameworks:
          $ref: "#/components/schemas/UsageLimit"

    UsageLimit:
      type: object
      additionalProperties: false
      required: [current, limit]
      properties:
        current:
          type: integer
          description: Current usage count.
        limit:
          type: [integer, "null"]
          description: Effective cap; `null` means unlimited.

    # ============================================================
    # Platform admin impersonation
    # ============================================================
    AdminImpersonationRequest:
      type: object
      additionalProperties: true
      description: Body for POST /admin/impersonations.
      required: [tenant_id, user_id, reason]
      properties:
        tenant_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        reason:
          type: string
          description: 5–500 chars.
        ttl_seconds:
          type: integer
          description: Optional; 60–3600. Clamped server-side to [1m, 30m]; defaults to 15m.
    ImpersonationResponse:
      type: object
      additionalProperties: false
      description: The minted impersonation token plus actor/target identity.
      required: [access_token, expires_at, token_type, jti, target_user, actor]
      properties:
        access_token:
          type: string
        expires_at:
          type: string
          format: date-time
        token_type:
          type: string
        jti:
          type: string
        target_user:
          type: object
          additionalProperties: false
          required: [id, email]
          properties:
            id:
              type: string
            email:
              type: string
        actor:
          type: object
          additionalProperties: false
          required: [id, email]
          properties:
            id:
              type: string
            email:
              type: string
    StopImpersonationRequest:
      type: object
      additionalProperties: true
      description: Body for POST /admin/impersonations/stop.
      required: [jti]
      properties:
        jti:
          type: string
    ImpersonationEvent:
      type: object
      additionalProperties: false
      description: One impersonation audit entry (auth.ImpersonationEvent). `event_data` is the audit JSONB serialized as a string.
      required: [occurred_at, event_type, event_status, ip_address, user_agent, event_data]
      properties:
        occurred_at:
          type: string
          format: date-time
        event_type:
          type: string
        event_status:
          type: string
        ip_address:
          type: string
        user_agent:
          type: string
        event_data:
          type: string
    ImpersonationAuditResponse:
      type: object
      additionalProperties: false
      description: 'Envelope `{ "events": [...] }`. `events` is null when there are none.'
      required: [events]
      properties:
        events:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/ImpersonationEvent"

    # ============================================================
    # Tenant branding
    # ============================================================
    Branding:
      type: object
      additionalProperties: false
      description: >
        Tenant branding (api.Branding). The three color fields are always
        present in responses (defaults applied); the URL / company-name / CSS
        fields are omitempty and appear only when set. PUT requests may send any
        subset (partial merge).
      required:
        - primary_color
        - secondary_color
        - accent_color
      properties:
        logo_url:
          type: string
        favicon_url:
          type: string
        company_name:
          type: string
        primary_color:
          type: string
        secondary_color:
          type: string
        accent_color:
          type: string
        custom_css:
          type: string
    BrandingResponse:
      type: object
      additionalProperties: false
      description: 'GET /tenant/branding — `{ "branding": {...} }`.'
      required:
        - branding
      properties:
        branding:
          $ref: "#/components/schemas/Branding"
    UpdateBrandingResponse:
      type: object
      additionalProperties: false
      description: 'PUT /tenant/branding — `{ "message", "branding" }`.'
      required:
        - message
        - branding
      properties:
        message:
          type: string
        branding:
          $ref: "#/components/schemas/Branding"
    UploadBrandingResponse:
      type: object
      additionalProperties: false
      description: 'POST /tenant/branding/upload — `{ "message", "url" }`.'
      required:
        - message
        - url
      properties:
        message:
          type: string
        url:
          type: string

    # ============================================================
    # Tenant / platform UI config
    # ============================================================
    UIConfig:
      type: object
      additionalProperties: false
      description: >
        Resolved UI configuration (api.UIConfig). Color/theme/palette/layout
        fields are always present (defaults applied; accent_color may be an
        empty string). enhancements + features serialize as JSON null when unset
        (nil map). custom_css is omitempty. PUT requests may send any subset.
      required:
        - theme
        - primary_color
        - secondary_color
        - accent_color
        - palette
        - enhancements
        - layout
        - features
      properties:
        theme:
          type: string
        primary_color:
          type: string
        secondary_color:
          type: string
        accent_color:
          type: string
        palette:
          type: string
        enhancements:
          type: [object, "null"]
          additionalProperties:
            type: boolean
        layout:
          type: string
        features:
          type: [object, "null"]
        custom_css:
          type: string
    UIConfigResponse:
      type: object
      additionalProperties: false
      description: 'GET /tenant/ui-config and /platform/ui-config — `{ "config": {...} }`.'
      required:
        - config
      properties:
        config:
          $ref: "#/components/schemas/UIConfig"
    UpdateUIConfigResponse:
      type: object
      additionalProperties: false
      description: 'PUT /tenant/ui-config — `{ "message", "config" }`.'
      required:
        - message
        - config
      properties:
        message:
          type: string
        config:
          $ref: "#/components/schemas/UIConfig"

    # ============================================================
    # Tenant users
    # ============================================================
    TenantUser:
      type: object
      additionalProperties: false
      description: "A tenant member (api.TenantUser) with primary role, all roles, and detected auth methods. last_login_at is omitempty."
      required:
        - id
        - tenant_id
        - email
        - first_name
        - last_name
        - role
        - roles
        - is_active
        - email_verified
        - created_at
        - updated_at
        - auth_methods
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        email:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        role:
          type: string
        roles:
          type: array
          items:
            type: string
        is_active:
          type: boolean
        email_verified:
          type: boolean
        last_login_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        auth_methods:
          type: array
          items:
            type: string
    TenantUsersResponse:
      type: object
      additionalProperties: false
      description: 'GET /tenant/{tenantId}/users — `{ "users": [...] }`. `users` is null when the tenant has no members.'
      required:
        - users
      properties:
        users:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/TenantUser"
    InviteTenantUserRequest:
      type: object
      additionalProperties: false
      description: "Request body for POST /tenant/{tenantId}/users/invite."
      required:
        - email
        - role
      properties:
        email:
          type: string
          format: email
        role:
          type: string
    InviteTenantUserResponse:
      type: object
      additionalProperties: false
      description: 'POST /tenant/{tenantId}/users/invite (201) — `{ "invitation_id", "message" }`.'
      required:
        - invitation_id
        - message
      properties:
        invitation_id:
          type: string
        message:
          type: string

    # ============================================================
    # Tenant SSO
    # ============================================================
    GroupRoleMapping:
      type: object
      additionalProperties: false
      description: "Maps an external IdP group to a tenant role (api.GroupRoleMapping)."
      required:
        - external_group_name
        - role_id
      properties:
        id:
          type: string
        sso_provider_id:
          type: string
        external_group_name:
          type: string
        role_id:
          type: string
        role_name:
          type: string
    SSOProvider:
      type: object
      additionalProperties: false
      description: >
        An SSO provider (api.SSOProvider). The base fields are always present;
        the OAuth/OIDC + SAML config fields and group mappings are omitempty and
        appear only in the admin (full-config) view. Client secrets are never
        returned. attribute_mapping serializes as JSON null when unset.
      required:
        - id
        - tenant_id
        - provider_type
        - provider_name
        - is_enabled
        - is_default
        - auto_provision_users
        - attribute_mapping
        - created_at
        - updated_at
      properties:
        id:
          type: string
        tenant_id:
          type: string
        provider_type:
          type: string
        provider_name:
          type: string
        is_enabled:
          type: boolean
        is_default:
          type: boolean
        auto_provision_users:
          type: boolean
        attribute_mapping:
          type: [object, "null"]
        default_role_id:
          type: string
        allowed_domains:
          type: array
          items:
            type: string
        groups_claim_name:
          type: string
        group_role_mappings:
          type: array
          items:
            $ref: "#/components/schemas/GroupRoleMapping"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        client_id:
          type: string
        auth_url:
          type: string
        token_url:
          type: string
        userinfo_url:
          type: string
        scopes:
          type: string
        saml_entity_id:
          type: string
        saml_sso_url:
          type: string
    SSOProvidersResponse:
      type: object
      additionalProperties: false
      description: 'GET /tenant/sso/providers — `{ "providers": [...] }`.'
      required:
        - providers
      properties:
        providers:
          type: array
          items:
            $ref: "#/components/schemas/SSOProvider"
    SSOProviderResponse:
      type: object
      additionalProperties: false
      description: 'POST /tenant/sso/providers (201) — `{ "provider": {...} }`.'
      required:
        - provider
      properties:
        provider:
          $ref: "#/components/schemas/SSOProvider"
    CreateSSOProviderRequest:
      type: object
      additionalProperties: false
      description: >
        Request body for POST /tenant/sso/providers (api.CreateSSOProviderRequest).
        provider_type + provider_name are required; the rest depend on the type
        (OAuth2 vs SAML). client_secret / saml_private_key are write-only and are
        encrypted at rest.
      required:
        - provider_type
        - provider_name
      properties:
        provider_type:
          type: string
        provider_name:
          type: string
        is_enabled:
          type: boolean
        is_default:
          type: boolean
        auto_provision_users:
          type: boolean
        attribute_mapping:
          type: object
        default_role_id:
          type: string
        allowed_domains:
          type: array
          items:
            type: string
        groups_claim_name:
          type: string
        group_role_mappings:
          type: array
          items:
            $ref: "#/components/schemas/GroupRoleMapping"
        client_id:
          type: string
        client_secret:
          type: string
        auth_url:
          type: string
        token_url:
          type: string
        userinfo_url:
          type: string
        scopes:
          type: string
        saml_entity_id:
          type: string
        saml_sso_url:
          type: string
        saml_certificate:
          type: string
        saml_private_key:
          type: string
    UpdateSSOProviderRequest:
      type: object
      additionalProperties: false
      description: >
        Request body for PUT /tenant/sso/providers/{id}
        (api.UpdateSSOProviderRequest). All fields optional — only provided fields
        are updated. At least one field (or group_role_mappings) must be present.
        client_secret / saml_private_key are write-only and re-encrypted at rest.
      properties:
        provider_name:
          type: string
        is_enabled:
          type: boolean
        is_default:
          type: boolean
        auto_provision_users:
          type: boolean
        attribute_mapping:
          type: object
        default_role_id:
          type: string
        allowed_domains:
          type: array
          items:
            type: string
        groups_claim_name:
          type: string
        group_role_mappings:
          type: array
          items:
            $ref: "#/components/schemas/GroupRoleMapping"
        client_id:
          type: string
        client_secret:
          type: string
        auth_url:
          type: string
        token_url:
          type: string
        userinfo_url:
          type: string
        scopes:
          type: string
        saml_entity_id:
          type: string
        saml_sso_url:
          type: string
        saml_certificate:
          type: string
        saml_private_key:
          type: string
    SSOTestResult:
      type: object
      additionalProperties: true
      description: >
        POST /tenant/sso/providers/{id}/test — config-validation result. status is
        "success" or "error"; message explains. (Open object — additional
        diagnostic keys may be added.)
      required:
        - provider_id
        - provider_type
        - status
        - message
      properties:
        provider_id:
          type: string
        provider_type:
          type: string
        status:
          type: string
        message:
          type: string
    AuthPolicyResponse:
      type: object
      additionalProperties: false
      description: 'GET /tenant/sso/authentication-policy — `{ "authentication_policy", "sso_enabled" }`.'
      required:
        - authentication_policy
        - sso_enabled
      properties:
        authentication_policy:
          type: string
        sso_enabled:
          type: boolean
    UpdateAuthPolicyRequest:
      type: object
      additionalProperties: false
      description: "Request body for PUT /tenant/sso/authentication-policy."
      required:
        - authentication_policy
      properties:
        authentication_policy:
          type: string
          enum: [password_only, prefer_sso, enforce_sso, sso_only]

    # ============================================================
    # Onboarding
    # ============================================================
    OnboardingStatusResponse:
      type: object
      additionalProperties: false
      description: 'GET /onboarding/status — `{ required, completed, dismissed, show_banner }`. show_banner = required (tenant setting) AND NOT completed AND NOT dismissed.'
      required:
        - required
        - completed
        - dismissed
        - show_banner
      properties:
        required:
          type: boolean
        completed:
          type: boolean
        dismissed:
          type: boolean
        show_banner:
          type: boolean
    OnboardingSettingsRequest:
      type: object
      additionalProperties: false
      description: 'PUT /onboarding/settings body — org-wide onboarding toggle.'
      required:
        - enabled
      properties:
        enabled:
          type: boolean
    OnboardingSettingsResponse:
      type: object
      additionalProperties: false
      description: 'PUT /onboarding/settings — the resolved tenant setting.'
      required:
        - enabled
      properties:
        enabled:
          type: boolean
    OnboardingDismissResponse:
      type: object
      additionalProperties: false
      description: 'POST /onboarding/dismiss — `{ message, dismissed }`.'
      required:
        - message
        - dismissed
      properties:
        message:
          type: string
        dismissed:
          type: boolean
    OnboardingStep:
      type: object
      additionalProperties: false
      description: "A workflow step annotated with the current user's status."
      required:
        - id
        - title
        - description
        - order
        - required
        - status
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        order:
          type: integer
        required:
          type: boolean
        status:
          type: string
          description: pending / completed / skipped.
        completed_at:
          type: string
          format: date-time
        skipped_at:
          type: string
          format: date-time
    OnboardingWorkflow:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - steps
      properties:
        id:
          type: string
        name:
          type: string
        steps:
          type: array
          items:
            $ref: "#/components/schemas/OnboardingStep"
    OnboardingWorkflowResponse:
      type: object
      additionalProperties: false
      description: 'GET /onboarding/workflow — `{ "workflow": {...} }`.'
      required:
        - workflow
      properties:
        workflow:
          $ref: "#/components/schemas/OnboardingWorkflow"
    ProgressInfo:
      type: object
      additionalProperties: false
      required:
        - completed_steps
        - total_steps
        - required_completed
        - required_total
        - percentage
      properties:
        completed_steps:
          type: integer
        total_steps:
          type: integer
        required_completed:
          type: integer
        required_total:
          type: integer
        percentage:
          type: number
    OnboardingProgress:
      type: object
      additionalProperties: false
      description: 'GET /onboarding/progress — progress stats + per-step status (bare object).'
      required:
        - user_id
        - tenant_id
        - onboarding_completed
        - progress
        - steps
      properties:
        user_id:
          type: string
        tenant_id:
          type: string
        onboarding_completed:
          type: boolean
        onboarding_completed_at:
          type: string
          format: date-time
        progress:
          $ref: "#/components/schemas/ProgressInfo"
        steps:
          type: array
          items:
            $ref: "#/components/schemas/OnboardingStep"

    # ============================================================
    # Onboarding step writes
    # ============================================================
    CompleteStepRequest:
      type: object
      additionalProperties: true
      description: "Optional step data for POST /onboarding/steps/{id}/complete."
      properties:
        data:
          type: object
    StepResponse:
      type: object
      additionalProperties: false
      description: 'POST /onboarding/steps/{id}/complete — `{ message, step, progress, onboarding_complete }`.'
      required:
        - message
        - step
        - progress
        - onboarding_complete
      properties:
        message:
          type: string
        step:
          $ref: "#/components/schemas/OnboardingStep"
        progress:
          $ref: "#/components/schemas/ProgressInfo"
        onboarding_complete:
          type: boolean
    SkipStepResponse:
      type: object
      additionalProperties: false
      description: 'POST /onboarding/steps/{id}/skip — `{ message, step }`.'
      required:
        - message
        - step
      properties:
        message:
          type: string
        step:
          $ref: "#/components/schemas/OnboardingStep"

    # ============================================================
    # Billing usage
    # ============================================================
    UsageMetrics:
      type: object
      additionalProperties: false
      required:
        - api_requests
        - storage_bytes
        - assets_count
        - sensors_count
        - users_count
      properties:
        api_requests:
          type: integer
        storage_bytes:
          type: integer
        assets_count:
          type: integer
        sensors_count:
          type: integer
        users_count:
          type: integer
    UsagePeriod:
      type: object
      additionalProperties: false
      required:
        - start
        - end
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
    UsageInfo:
      type: object
      additionalProperties: false
      description: 'GET /billing/usage/current — usage + limits + percentages + period.'
      required:
        - usage
        - limits
        - percentages
        - period
      properties:
        usage:
          $ref: "#/components/schemas/UsageMetrics"
        limits:
          $ref: "#/components/schemas/UsageMetrics"
        percentages:
          type: object
          additionalProperties:
            type: number
        period:
          $ref: "#/components/schemas/UsagePeriod"

    # ============================================================
    # Tenant billing + public tiers
    # ============================================================
    SubscriptionInfo:
      type: object
      additionalProperties: false
      description: "api.SubscriptionInfo. Period timestamps are the zero time when no active subscription period exists."
      required:
        - tier_id
        - tier_name
        - status
        - current_period_start
        - current_period_end
        - cancel_at_period_end
      properties:
        tier_id:
          type: string
        tier_name:
          type: string
        status:
          type: string
        current_period_start:
          type: string
          format: date-time
        current_period_end:
          type: string
          format: date-time
        cancel_at_period_end:
          type: boolean
    TenantBillingResponse:
      type: object
      additionalProperties: false
      description: 'GET /tenant/billing — `{ subscription, billing_portal_url, tier? }`. `tier` is present only when the tenant has a subscription tier.'
      required:
        - subscription
        - billing_portal_url
      properties:
        subscription:
          $ref: "#/components/schemas/SubscriptionInfo"
        billing_portal_url:
          type: string
        tier:
          type: object
          additionalProperties: true
          description: "Tier detail (id/name/display_name + optional price/interval/features/limits). Loose — built dynamically."
    PublicTier:
      type: object
      additionalProperties: false
      description: "A subscription tier in the public list. Base fields always present; max_*/retention/features/limits are conditional."
      required:
        - id
        - name
        - display_name
        - billing_interval
        - price_cents
        - annual_price_cents
        - is_active
      properties:
        id:
          type: string
        name:
          type: string
        display_name:
          type: string
        billing_interval:
          type: string
        price_cents:
          type: integer
        annual_price_cents:
          type: integer
        is_active:
          type: boolean
        max_sensors:
          type: integer
        max_assets:
          type: integer
        max_users:
          type: integer
        retention_days:
          type: integer
        features:
          type: object
        limits:
          type: object
    PublicTiersResponse:
      type: object
      additionalProperties: false
      description: 'GET /tiers — `{ "tiers": [...] }`.'
      required:
        - tiers
      properties:
        tiers:
          type: array
          items:
            $ref: "#/components/schemas/PublicTier"

    # ============================================================
    # Legacy error envelope (current shape for every error response above)
    # ============================================================
    LegacyError:
      type: object
      additionalProperties: true
      description: >
        CURRENT error shape returned by these endpoints today: a single
        human-readable string under `error`. Some 400s carry extra sibling keys
        (e.g. `details`, `required_permission`), so additionalProperties is
        permitted here. Unstructured — cannot be branched on safely. Superseded
        by the ADR-0002 `Error` envelope below as endpoints are hardened.
      required: [error]
      properties:
        error:
          type: string

    NotificationPreferencesResponse:
      type: object
      additionalProperties: false
      description: 'Envelope for GET /auth/me/preferences/notifications — `{ "preferences": {...} }`. The preferences object is free-form and nullable when none are stored.'
      required: [preferences]
      properties:
        preferences:
          type: [object, "null"]
          additionalProperties: true

    RegisterRequest:
      type: object
      additionalProperties: false
      description: 'Signup body. email, password (min 8), first_name and last_name are required; tenant_name and accepted_legal are optional.'
      required: [email, password, first_name, last_name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        first_name:
          type: string
        last_name:
          type: string
        tenant_name:
          type: string
        accepted_legal:
          type: boolean
          description: >
            Whether the signup affirmatively accepted the current Terms of
            Service and Privacy Policy. Required (server-enforced) only when
            legal documents are currently published; the acceptance is recorded
            as an audit row against the tenant founder.

    CompleteRegistrationRequest:
      type: object
      additionalProperties: false
      description: >
        register/complete body — the RegisterRequest fields plus an optional
        `subscription_tier_id`. (The handler embeds models.RegisterRequest and
        adds the tier id, so the fields are flat, not nested.)
      required: [email, password, first_name, last_name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        first_name:
          type: string
        last_name:
          type: string
        tenant_name:
          type: string
        subscription_tier_id:
          type: string
          format: uuid
          description: Optional tier chosen during signup; applied best-effort.
        accepted_legal:
          type: boolean
          description: >
            Whether the signup affirmatively accepted the current Terms of
            Service and Privacy Policy. Required (server-enforced) only when
            legal documents are currently published; the acceptance is recorded
            as an audit row against the tenant founder.

    LegalDocument:
      type: object
      additionalProperties: false
      description: A published, versioned legal document (Terms of Service or Privacy Policy).
      required: [id, doc_type, version, title, body, content_hash, effective_date]
      properties:
        id: { type: string, format: uuid }
        doc_type:
          type: string
          enum: [terms_of_service, privacy_policy]
        version: { type: integer }
        title: { type: string }
        body: { type: string }
        content_hash:
          type: string
          description: Hex SHA-256 of the document body; pins each acceptance to exact text.
        effective_date: { type: string, format: date-time }

    LegalDocumentList:
      type: object
      additionalProperties: false
      required: [documents]
      properties:
        documents:
          type: array
          items:
            $ref: "#/components/schemas/LegalDocument"

    LegalAcceptRequest:
      type: object
      additionalProperties: false
      description: Optional body for POST /auth/legal/accept. Absent body is treated as accept-all.
      properties:
        accepted:
          type: boolean

    LegalAcceptResponse:
      type: object
      additionalProperties: false
      required: [message, accepted_count]
      properties:
        message: { type: string }
        accepted_count:
          type: integer
          description: Number of current documents the user is now on record as accepting.

    ResetPasswordRequest:
      type: object
      additionalProperties: false
      description: 'Password-reset body (models.ResetPasswordRequest). token, password and new_password are all required (the two password fields are min 8).'
      required: [token, password, new_password]
      properties:
        token:
          type: string
        password:
          type: string
          minLength: 8
        new_password:
          type: string
          minLength: 8

    ResendVerificationRequest:
      type: object
      additionalProperties: false
      description: 'Body for POST /auth/resend-verification — the email to resend verification to.'
      required: [email]
      properties:
        email:
          type: string
          format: email

    RegisterResponse:
      type: object
      additionalProperties: false
      description: 'Response for /auth/register and /auth/register/complete: a message plus the created user (password_hash stripped).'
      required: [message, user]
      properties:
        message:
          type: string
        user:
          $ref: "#/components/schemas/User"

    MessageResponse:
      type: object
      additionalProperties: false
      description: Generic mutation acknowledgement (a single human-readable string under `message`).
      required: [message]
      properties:
        message:
          type: string

    UpdateTenantRequest:
      type: object
      additionalProperties: false
      description: >
        Partial current-tenant update — every field optional; only present
        fields are written. The handler applies no per-field validation beyond
        JSON binding (billing_email is a plain string, not format-checked), so
        the spec types match the handler, not an aspiration. The three JSONB
        blobs (custom_branding / ui_config / settings) are replaced wholesale
        when present, not merged — prefer the dedicated
        /tenant/branding and /tenant/ui-config endpoints for those.
      properties:
        name:
          type: string
          description: Organization display name.
        domain:
          type: string
          description: Primary domain (SSO / invite matching).
        billing_email:
          type: string
          description: Billing contact email. Not format-validated server-side.
        custom_branding:
          type: object
          additionalProperties: true
          description: Replaces the stored custom_branding JSONB wholesale.
        ui_config:
          type: object
          additionalProperties: true
          description: Replaces the stored ui_config JSONB wholesale.
        settings:
          type: object
          additionalProperties: true
          description: Replaces the stored settings JSONB wholesale.

    UpdateMeRequest:
      type: object
      additionalProperties: false
      properties:
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        avatar_url:
          type: [string, "null"]
        timezone:
          type: string

    UpdateMeResponse:
      type: object
      additionalProperties: false
      required: [message, user]
      properties:
        message:
          type: string
        user:
          $ref: "#/components/schemas/User"

    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
        new_password:
          type: string
          minLength: 8

    UploadAvatarResponse:
      type: object
      additionalProperties: false
      required: [message, avatar_url]
      properties:
        message:
          type: string
        avatar_url:
          type: string

    Session:
      type: object
      additionalProperties: false
      description: >
        An active refresh-token session (models.Session). token_hash is
        `json:"-"` and never serialized. Nullable fields are present-but-null
        (the struct tags are not omitempty).
      required: [id, user_id, family_id, expires_at, last_used_at, is_revoked, created_from_ip, user_agent, created_at, revoked_at]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        family_id: { type: string, format: uuid }
        expires_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
        is_revoked: { type: boolean }
        created_from_ip:
          type: [string, "null"]
          description: Source IP captured when the session was created; null when unknown.
        user_agent:
          type: [string, "null"]
          description: User-Agent captured at session creation; null when unknown.
        created_at: { type: string, format: date-time }
        revoked_at:
          type: [string, "null"]
          format: date-time

    SessionsResponse:
      type: object
      additionalProperties: false
      description: ListSessions envelope — the user's sessions under `sessions` (null when the user has none).
      required: [sessions]
      properties:
        sessions:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/Session"

    Connection:
      type: object
      additionalProperties: false
      description: >
        A linked authentication method (models.Connection) — either the local
        password (`auth_type: password`) or an SSO provider link. Nullable fields
        are present-but-null (struct tags are not omitempty).
      required: [id, user_id, auth_type, sso_provider_id, external_user_id, external_email, is_primary, last_used_at, metadata, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        auth_type: { type: string }
        sso_provider_id:
          type: [string, "null"]
          format: uuid
        external_user_id:
          type: [string, "null"]
        external_email:
          type: [string, "null"]
        is_primary: { type: boolean }
        last_used_at:
          type: [string, "null"]
          format: date-time
        metadata:
          type: [object, "null"]
          additionalProperties: true
          description: Free-form provider metadata; null when unset.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ConnectionsResponse:
      type: object
      additionalProperties: false
      description: ListConnections envelope — the user's auth connections under `connections` (null when the user has none).
      required: [connections]
      properties:
        connections:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/Connection"

    SSOUnlinkRequest:
      type: object
      additionalProperties: false
      description: DELETE /auth/sso/unlink body. `provider_id` is required (binding:"required").
      required: [provider_id]
      properties:
        provider_id:
          type: string
          format: uuid

    PlatformConfig:
      type: object
      additionalProperties: false
      description: >
        Public platform branding (api.PlatformConfig). Returned bare (not
        wrapped). `platform_name` is always present (defaults to "VistaPlatform");
        the logo/favicon URLs are present only when configured (omitempty pointers).
        `signup_enabled` mirrors platform_settings.registration_enabled (default
        true) so the /signup page knows whether to render the form.
      required: [platform_name, signup_enabled]
      properties:
        platform_name:
          type: string
        platform_logo_url:
          type: string
          description: Optional branding logo URL; omitted when unset.
        platform_login_logo_url:
          type: string
          description: Optional login-screen logo URL; omitted when unset.
        platform_favicon_url:
          type: string
          description: Optional favicon URL; omitted when unset.
        signup_enabled:
          type: boolean
          description: Whether self-service sign-up is open (#941).

    TrialStatusResponse:
      type: object
      additionalProperties: false
      description: >
        Resolved tenant trial phase (api.trialStatusResponse). Returned bare
        (not wrapped). `phase` and `days_remaining` are always present; the
        remaining fields are omitted (not null) when unset.
      required: [phase, days_remaining]
      properties:
        phase:
          type: string
          enum: [none, full, soft_prompt, locked, converted]
          description: Canonical trial state the UI gates everything off of.
        days_remaining:
          type: integer
          description: Floored days until the next transition; 0 in none/locked/converted.
        trial_start:
          type: string
          format: date-time
          description: Trial start (from billing_trial_tracking); omitted for paid tenants.
        trial_end:
          type: string
          format: date-time
          description: Computed/extended trial end; omitted for paid tenants.
        trial_days_full:
          type: integer
          description: Tier's full-access trial-day count; omitted when no trial tier.
        trial_days_soft:
          type: integer
          description: Tier's soft-prompt trial-day count; omitted when no trial tier.

    RoleAssignmentRequest:
      type: object
      additionalProperties: true
      description: Body for POST /tenant/{tenantId}/users/{userId}/roles.
      required: [role_id]
      properties:
        role_id:
          type: string
          format: uuid
    RoleAssignmentResponse:
      type: object
      additionalProperties: false
      description: 'Envelope for role assign / remove — `{ "user_id": ..., "role_id": ..., "message": "..." }`.'
      required: [user_id, role_id, message]
      properties:
        user_id:
          type: string
          format: uuid
        role_id:
          type: string
          format: uuid
        message:
          type: string
    UpdateRolePermissionsRequest:
      type: object
      additionalProperties: true
      description: Body for PUT /tenant/{tenantId}/roles/{roleId}/permissions.
      properties:
        permission_ids:
          type: array
          items:
            type: string
            format: uuid
    UpdateRolePermissionsResponse:
      type: object
      additionalProperties: false
      description: 'Envelope for PUT role permissions — `{ "role_id": ..., "updated": N }`.'
      required: [role_id, updated]
      properties:
        role_id:
          type: string
          format: uuid
        updated:
          type: integer
    PermissionMatrixResponse:
      type: object
      additionalProperties: true
      description: 'Opaque permission matrix for a role — passed through verbatim from the RBAC service (shape not constrained here).'

    # ============================================================
    # /auth login flow (login / logout / refresh)
    # ============================================================
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          description: Min 8 chars (server `binding:"required,min=8"`).

    RefreshRequest:
      type: object
      additionalProperties: false
      description: >
        Optional body. When omitted (or `refresh_token` empty), the server reads
        the refresh token from the httpOnly `refresh_token` cookie.
      properties:
        refresh_token:
          type: string

    AuthResponse:
      type: object
      additionalProperties: false
      description: >
        Login/refresh success body. The raw tokens are echoed for backward-compat
        but cookie auth is authoritative — clients must not persist them.
      required: [user, access_token, refresh_token, expires_in]
      properties:
        user:
          $ref: "#/components/schemas/User"
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
          format: int64
          description: Access-token lifetime in seconds.

    MessageResult:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string

    # ============================================================
    # ADR-0002 go-forward envelope (the documented standard).
    # NOT yet applied to the v1 cross-cutter paths above. New and hardened
    # endpoints conform to these. The generated client carries these types
    # ahead of the backend so the frontend-v2 surface can target them.
    # ============================================================
    Error:
      type: object
      additionalProperties: false
      description: ADR-0002 error envelope. Clients branch on `error.code`, never on `message`.
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable, machine-readable enum (e.g. unauthorized).
            message:
              type: string
              description: Human-readable, safe to surface in UI.
            details:
              type: array
              items:
                $ref: "#/components/schemas/ErrorDetail"
            request_id:
              type: string
              description: For support correlation.

    ErrorDetail:
      type: object
      additionalProperties: false
      required: [field, issue]
      properties:
        field:
          type: string
        issue:
          type: string

    Pagination:
      type: object
      additionalProperties: false
      description: ADR-0002 pagination block for collection envelopes.
      required: [total, limit, offset]
      properties:
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        next_offset:
          type: [integer, "null"]
          description: Offset of the next page, or null when there are no more.
