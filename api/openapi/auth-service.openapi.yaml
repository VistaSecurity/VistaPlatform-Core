openapi: 3.1.0
info:
  title: VistaPlatform — auth-service API
  version: "0.1.0"
  description: |
    Spec-first contract for auth-service (ADR-0001). Eighth (and final
    pre-spec) vertical slice for the queue: covers the three **cross-cutter**
    endpoints every page in any future surface calls on load.

    ## Scope of this slice

    Three endpoints on the v1 path prefix `/api/v1/auth-service`:

      - `GET /auth/me`           — current user + tenant context (web-ui `auth-context.tsx` on every login + bootstrap)
      - `GET /user/permissions`  — string-array of effective permissions for RBAC gating (web-ui `PermissionGate` / `usePermissions()`)
      - `GET /tenant/features`   — resolved feature-flag map plus usage limits (web-ui `useFeatures()` / `useFeature()`)

    Out of scope for this slice (each is a larger surface that needs its own
    slice with the design track's input):

      - Login / logout / register / refresh / forgot-password / reset-password
      - SSO authorize / callback / link / unlink (both tenant and platform)
      - `/auth/me` writes (PUT, change-password), preferences, EULA, onboarding
      - Sessions, connections, avatar uploads
      - Users-admin CRUD, RBAC role + permission management, permission-check POST
      - Billing, tier selection, subscription tier reads
      - Tenant read/update, branding, UI config
      - Platform-admin and impersonation surfaces

    Later slices have since extended this file beyond those three cross-cutters
    (rbac reads, notification preferences, tenant-RBAC management, and now the
    **public platform config** + **tenant trial-status** reads the app shell
    fetches on load). The intro above is kept as the original framing.

    ## Shape status (important)

    These paths document the **current, pre-envelope shapes** the service
    returns today, captured from the real gin handlers
    (`services/auth-service/internal/api/handlers.go` GetMe,
    `services/auth-service/internal/rbac/handlers.go` GetCurrentUserPermissions,
    `services/auth-service/internal/api/features.go` getTenantFeaturesHandler).
    `/auth/me` wraps as `{ "user": {...}, "tenant": {...} }`,
    `/user/permissions` wraps as `{ "permissions": ["..."] }`,
    `/tenant/features` wraps as `{ "features": {...}, "limits": {...} }`,
    errors as `{ "error": "string" }`. They are specced as-is per ADR-0001
    step 2, and the Go contract test
    (`services/auth-service/internal/api/cross_cutter_contract_test.go`)
    asserts the live handlers match them.

    The **go-forward ADR-0002 envelope** (`Error`, `Pagination`, the `data`
    wrapper) is defined under `components.schemas` as the documented standard
    that NEW or HARDENED endpoints conform to. The current cross-cutter paths
    do not yet use it; they are hardened to it when the frontend-v2 surface
    first consumes them (ADR-0001 step 5), at which point this file and the
    contract test move together.
  contact:
    name: VistaPlatform Platform
servers:
  - url: /api/v1/auth-service
    description: auth-service, mounted behind the API gateway.

tags:
  - name: me
    description: Current-user + tenant context (cross-cutter).
  - name: auth
    description: >
      Public, unauthenticated sign-in helpers the shared login page calls
      before a session exists. UI consumer: frontend-v2 login-page.tsx
      (email-first SSO discovery → "Continue with <provider>").
  - name: profile
    description: Self-service My Profile — active sessions/devices and linked SSO connections.
  - name: permissions
    description: Effective per-user permission list (cross-cutter).
  - name: features
    description: Resolved tenant feature flags + usage limits (cross-cutter).
  - name: rbac
    description: >
      Tenant role-based access control reads — roles, the tenant permission
      catalogue, and a user's assigned roles. UI consumer:
      web-ui/src/services/rbac-api.ts (Settings → Roles & Permissions,
      Tenant Admin only).
  - name: platform-config
    description: >
      Public, unauthenticated platform branding config (name + logos) the
      web-ui app shell fetches before login. UI consumer:
      web-ui/src/contexts/platform-config-context.tsx.
  - name: trial
    description: >
      Per-tenant trial phase the web-ui trial banner + hard-lock route guards
      read on load. UI consumer: web-ui/src/hooks/useTrialStatus.ts.
  - name: tenant-org
    description: >
      Current-tenant organization details — self-service partial update of the
      tenant row (name / domain / billing email / config blobs). UI consumer:
      frontend-v2 Settings → Organization → Overview (Tenant Admin).
  - name: tenant-branding
    description: >
      Tenant branding (logo / favicon / colors / company name / custom CSS) +
      logo/favicon asset upload. UI consumer: web-ui Settings → Organization
      branding (Tenant Admin).
  - name: tenant-ui-config
    description: >
      Resolved tenant UI configuration (theme / palette / layout / feature
      toggles) + the public platform UI defaults the login screen reads. UI
      consumer: web-ui/src/services/api.ts (app shell + Settings).
  - name: tenant-users
    description: >
      Tenant membership — list users (with roles + auth methods) and invite new
      members. UI consumer: web-ui Settings → Users (Tenant Admin).
  - name: tenant-sso
    description: >
      Tenant SSO configuration — list/delete providers and the authentication
      policy. UI consumer: web-ui Settings → SSO (Tenant Admin). Provider
      create/update/test (secret-encryption coupled) are a separate slice.
  - name: onboarding
    description: >
      First-run onboarding workflow — status, the per-step workflow, the current
      user's progress, and step complete/skip. UI consumer: web-ui onboarding
      wizard + banner.
  - name: billing
    description: >
      Tenant billing reads the web-ui surfaces — current-period usage + limits.
      UI consumer: web-ui Settings → Billing / usage widgets.

paths:
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [me]
      summary: Get current user + tenant context
      description: >
        The bootstrap call every web-ui page makes after login. Returns the
        authenticated user and, on a best-effort basis, the user's tenant. The
        password hash is always stripped before serialization.
      responses:
        "200":
          description: >
            Current user, optionally with tenant context. Tenant is **omitted
            entirely** (not null) when the tenant lookup fails — see x-quirks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
        "404":
          $ref: "#/components/responses/LegacyNotFound"
        "500":
          $ref: "#/components/responses/LegacyServerError"
      x-quirks:
        - "200 with no tenant: when GetTenantByID errors, the handler still returns 200 with just `{ \"user\": ... }` — the `tenant` key is OMITTED from the JSON body (not present-but-null). Clients must treat missing `tenant` and explicitly-null `tenant` as equivalent (the auth-context.tsx already does)."
        - "user.role is populated from a secondary RBAC lookup (`getUserPrimaryRole`). When no `user_tenant_roles` row exists for the user/tenant pair, the handler returns the literal string `\"viewer\"` as a default (per the explicit comment in `auth/service.go:getUserPrimaryRole`) — NOT an empty string or null. The spec types role as `string` so any value validates, but clients must not branch on `role === \"\"` to detect 'no role'."
        - "user.password_hash is stripped (`json:\"-\"` on the model and an explicit empty-string assignment) — it is never present in the response body."
        - "Several optional time/string fields on `user` (last_login_at, avatar_url, timezone, preferences, password_changed_at, locked_until, eula_accepted_at, eula_version, onboarding_completed_at, deleted_at) are typed as `*T` in Go and serialize as either the value or `null`. The schema accepts both nullable forms."
        - "tenant.domain is `omitempty` in Go and may be absent from the body when null; the schema makes it optional. Other tenant time fields (trial_ends_at, deleted_at) keep their `null` shape because the struct tag is not `omitempty`."
        - "tenant.subscription_tier_id is a uuid.UUID and serializes as the zero-uuid string when the tenant has no tier (onboarding); schema documents this as a uuid-format string but does NOT enforce non-zero."
    put:
      operationId: updateMe
      tags: [me]
      summary: Update the current user's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: Updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateMeResponse"
        "400":
          $ref: "#/components/responses/LegacyBadRequest"
        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
        "404":
          $ref: "#/components/responses/LegacyNotFound"
        "409":
          description: Email already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyError"
        "500":
          $ref: "#/components/responses/LegacyServerError"

  /auth/change-password:
    post:
      operationId: changePassword
      tags: [me]
      summary: Change the current user's password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/LegacyBadRequest"
        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
        "500":
          $ref: "#/components/responses/LegacyServerError"

  /auth/upload-avatar:
    post:
      operationId: uploadAvatar
      tags: [me]
      summary: Upload a new avatar image for the current user
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar:
                  type: string
                  format: binary
      responses:
        "200":
          description: Avatar uploaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadAvatarResponse"
        "400":
          $ref: "#/components/responses/LegacyBadRequest"
        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
        "500":
          $ref: "#/components/responses/LegacyServerError"

  /user/permissions:
    get:
      operationId: getCurrentUserPermissions
      tags: [permissions]
      summary: Get the current user's effective permission names
      description: >
        Returns a flat string array of permission names (e.g. `compliance.manage`,
        `users.read`) that the authenticated user has been granted via their
        role assignments under the current tenant. Used by the web-ui
        PermissionGate / PermissionRoute components.
      responses:
        "200":
          description: The user's effective permission names.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionsResponse"
        "400":
          $ref: "#/components/responses/LegacyBadRequest"
        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
        "500":
          $ref: "#/components/responses/LegacyServerError"
      x-quirks:
        - "200 with empty permissions: when a user has no role assignments (e.g. a fresh tenant or a not-yet-provisioned admin), the handler returns `{ \"permissions\": [] }`. The web-ui's hasPermission()/hasAnyPermission()/hasAllPermissions() helpers all treat the empty array as the safe (deny-all) default."
        - "Permissions are returned as plain strings (not the rich Permission objects with id/description/resource/action). For the resource/action breakdown, callers must use a different endpoint (e.g. `/permissions` with tenant-admin role)."

  /tenant/features:
    get:
      operationId: getTenantFeatures
      tags: [features]
      summary: Get the resolved feature flags + usage limits for the current tenant
      description: >
        Returns the union of (tier features) and (active per-tenant overrides),
        plus any usage-bound limits the frontend needs to make UI gating
        decisions (e.g. disabling Subscribe at cap). The response always
        includes every entry in the platform's canonical feature list
        (`knownFeatures` in `features.go`) so the frontend can rely on a
        stable shape.
      responses:
        "200":
          description: The tenant's resolved feature flags + usage limits.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeaturesResponse"
        "400":
          $ref: "#/components/responses/LegacyBadRequest"
        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
        "500":
          $ref: "#/components/responses/LegacyServerError"
      x-quirks:
        - "features map is closed-shape but unenforced: the handler iterates the server-side `knownFeatures` list and the spec freezes it as the four flags the web-ui's `FeatureName` union already declares (`custom_policies`, `threshold_overrides`, `ot_active_probing`, `ot_primary_lens`). Adding a flag is a server+client+spec change; until then, unknown keys are forbidden in this slice's schema (`additionalProperties: false`)."
        - "limits is degraded-shape: when GetComplianceFrameworkUsage errors, the `compliance_frameworks` key is OMITTED rather than present-but-null. The handler logs and continues so the UI degrades to 'always enabled' (matching the pre-limits behavior)."
        - "limits.compliance_frameworks.limit is `null` (not absent) when the tier is unlimited."
        - "Per-feature failure is silent: if `CheckFeatureAccess(feature)` returns an error, that one feature is set to `false` (the safe default) and the call still succeeds with the other features populated."

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user (and tenant)
      description: >
        Unauthenticated signup. Creates the tenant and its first user, then
        returns the created user (password_hash stripped). Does NOT log the user
        in — no cookies are set; the client logs in separately afterwards.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: The created user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          $ref: "#/components/responses/LegacyBadRequest"
        "409":
          description: A user with this email already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyError"
        "500":
          $ref: "#/components/responses/LegacyServerError"
      x-quirks:
        - "400 covers BOTH a malformed body and a personal-email rejection, distinguished only by the `error` string (\"Personal email addresses are not allowed...\")."
        - "When legal documents are published, `accepted_legal` must be true or the request 400s before any tenant/user is created."
        - "Unlike /auth/login, no auth cookies are set on success."

  /auth/register/complete:
    post:
      operationId: completeRegistration
      tags: [auth]
      summary: Complete registration with an optional tier selection
      description: >
        The signup/invite-accept variant the onboarding flow posts to: a
        RegisterRequest body PLUS an optional `subscription_tier_id`. Same result
        as /auth/register (creates tenant + user) and additionally applies the
        chosen subscription tier and bootstraps a trial row when applicable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteRegistrationRequest"
      responses:
        "201":
          description: The created user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          $ref: "#/components/responses/LegacyBadRequest"
        "409":
          description: A user with this email already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyError"
        "500":
          $ref: "#/components/responses/LegacyServerError"
      x-quirks:
        - "`subscription_tier_id` is best-effort: if the tier UPDATE fails, signup still succeeds (the tenant keeps the default tier) and the trial bootstrap is skipped — the response is unchanged."
        - "400 also covers the personal-email rejection (see /auth/register)."
        - "When legal documents are published, `accepted_legal` must be true or the request 400s before any tenant/user is created."

  /auth/legal/current:
    get:
      operationId: getCurrentLegalDocuments
      tags: [auth]
      summary: List current legal documents (public)
      description: >
        Unauthenticated. Returns the current published version of every legal
        document (Terms of Service, Privacy Policy) for display on the signup
        page. Empty list when nothing is published.
      responses:
        "200":
          description: Current legal documents.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalDocumentList"
        "500":
          $ref: "#/components/responses/LegacyServerError"

  /auth/legal/documents/{docType}:
    get:
      operationId: getLegalDocumentByType
      tags: [auth]
      summary: Get one current legal document by type (public)
      description: >
        Unauthenticated. Returns the current published version of a single
        document type — backs the standalone /legal/terms and /legal/privacy
        pages.
      parameters:
        - name: docType
          in: path
          required: true
          schema:
            type: string
            enum: [terms_of_service, privacy_policy]
      responses:
        "200":
          description: The current document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalDocument"
        "400":
          $ref: "#/components/responses/LegacyBadRequest"
        "404":
          $ref: "#/components/responses/LegacyNotFound"
        "500":
          $ref: "#/components/responses/LegacyServerError"

  /auth/legal/pending:
    get:
      operationId: getPendingLegalAcceptances
      tags: [auth]
      summary: List legal documents the current user must still accept
      description: >
        Authenticated. Returns the current legal documents the signed-in user
        has not yet accepted (never accepted, or accepted an older version).
        The frontend shows a blocking re-acceptance modal when non-empty.
      responses:
        "200":
          description: Documents pending acceptance (possibly empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalDocumentList"
        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
        "500":
          $ref: "#/components/responses/LegacyServerError"

  /auth/legal/accept:
    post:
      operationId: acceptLegalDocuments
      tags: [auth]
      summary: Record the current user's acceptance of all current legal documents
      description: >
        Authenticated. Writes an append-only acceptance row (server-observed IP
        and user agent) for every current legal document. Idempotent.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LegalAcceptRequest"
      responses:
        "200":
          description: Acceptance recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalAcceptResponse"
        "400":
          $ref: "#/components/responses/LegacyBadRequest"
        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
        "500":
          $ref: "#/components/responses/LegacyServerError"

  /auth/verify-email:
    post:
      operationId: verifyEmail
      tags: [auth]
      summary: Verify an email address with a token
      description: >
        Unauthenticated. Consumes the email-verification token (from the link in
        the verification email) passed as the `token` query parameter and marks
        the user's email verified. 400 covers a missing, invalid/unknown, OR
        expired token — distinguished only by the `error` string.
      parameters:
        - name: token
          in: query
          required: true
          description: The email-verification token from the verification email link.
          schema:
            type: string
      responses:
        "200":
          description: Email verified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/LegacyBadRequest"
        "500":
          $ref: "#/components/responses/LegacyServerError"
  /auth/resend-verification:
    post:
      operationId: resendEmailVerification
      tags: [auth]
      summary: Resend the email-verification email
      description: >
        Unauthenticated. Sends a fresh verification email for the given address
        if it exists and is unverified. Always returns 200 with the same message
        regardless of whether the user exists or is already verified — deliberate
        anti-enumeration behavior.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendVerificationRequest"
      responses:
        "200":
          description: Acknowledged (same response whether or not the email exists).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/LegacyBadRequest"
        "500":
          $ref: "#/components/responses/LegacyServerError"

  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Reset a password using a reset token
      description: >
        Unauthenticated. Consumes a password-reset token (from the
        forgot-password email) and sets the new password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password reset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/LegacyBadRequest"
        "500":
          $ref: "#/components/responses/LegacyServerError"
      x-quirks:
        - "400 covers a malformed body, an invalid/unknown token, AND an expired token — distinguished only by the `error` string."

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Authenticate with email + password
      description: >
        Verifies credentials and, on success, sets httpOnly `access_token` and
        `refresh_token` cookies plus a JS-readable `csrf_token` cookie. The body
        also echoes the raw tokens for backward-compat, but cookie auth is the
        real mechanism — clients must NOT persist the body tokens (the web-ui
        `tokenManager.setToken` is a deliberate no-op).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated. Sets httpOnly auth cookies + csrf_token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/LegacyBadRequest"
        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
        "403":
          $ref: "#/components/responses/LegacyForbidden"
        "500":
          $ref: "#/components/responses/LegacyServerError"
      x-quirks:
        - "Sets httpOnly `access_token` + `refresh_token` cookies and a JS-readable `csrf_token` cookie; the body ALSO contains the raw tokens for backward-compat. Cookie auth is authoritative — do not store the body tokens."
        - "403 covers both inactive account and unverified email (distinguished only by the `error` string). A 429 (not enumerated) is returned for per-email rate-limit / account-lockout with a `Retry-After` header and a `retry_after` seconds field."
        - "Bare error shape `{ \"error\": \"...\" }` (pre-ADR-0002), matching the Legacy* responses."

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out the current session
      description: >
        Revokes the current session server-side and clears the auth cookies.
        Requires authentication.
      responses:
        "200":
          description: Logged out; auth cookies cleared.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResult"
        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
        "500":
          $ref: "#/components/responses/LegacyServerError"

  /auth/refresh:
    post:
      operationId: refreshSession
      tags: [auth]
      summary: Rotate the session using the refresh-token cookie
      description: >
        Exchanges the httpOnly `refresh_token` cookie (or a body token) for a
        fresh access/refresh pair, rotating all auth cookies. The body is
        optional — when omitted, the refresh token is read from the cookie.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Rotated. Sets fresh httpOnly auth cookies + csrf_token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/LegacyBadRequest"
        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
        "500":
          $ref: "#/components/responses/LegacyServerError"
      x-quirks:
        - "Refresh token travels as the httpOnly `refresh_token` cookie; the body `refresh_token` is an optional fallback. 401 covers invalid/expired token AND token-reuse-detected (which also revokes all sessions)."

  /tenant/{tenantId}/roles:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    get:
      operationId: getTenantRoles
      tags: [rbac]
      summary: List the tenant's roles
      description: >
        Returns the roles defined for the tenant, each with its embedded
        permissions map. tenantId comes from the path.
      responses:
        "200":
          description: The tenant's roles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleListResponse"
        "400":
          $ref: "#/components/responses/LegacyBadRequest"
        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
        "500":
          $ref: "#/components/responses/LegacyServerError"

  /permissions:
    get:
      operationId: getTenantPermissions
      tags: [rbac]
      summary: List the tenant's permission catalogue
      description: >
        Returns the full permission catalogue (rich Permission objects with
        resource/action) for the current tenant. The tenant is taken from the
        auth context, not the path.
      responses:
        "200":
          description: The tenant's permissions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionListResponse"
        "400":
          $ref: "#/components/responses/LegacyBadRequest"
        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
