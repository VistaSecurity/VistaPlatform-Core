          $ref: "#/components/responses/LegacyBadRequest"
        "500":
          $ref: "#/components/responses/LegacyServerError"
      x-quirks:
        - "Unauthenticated/public. A missing or non-email `email` returns 400 {\"error\":\"Invalid request format\"}."
        - "`tenant_id` is empty when the email matches no active user. SSO methods are only included for a known user whose tenant has enabled providers."
        - "A `platform_sso` method type can also appear (user signed up via Google/Microsoft at the platform level on a password_only tenant); the login page may ignore it."
