        "400":
          $ref: "#/components/responses/LegacyBadRequest"
        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
        "500":
          $ref: "#/components/responses/LegacyServerError"
      x-quirks:
        - "Service errors (already subscribed, framework not published, tier limit reached, DB error) all return 400 with the raw service error string in `error`. No 409 for duplicate subscription, no 402/403 for tier-limit denial."

