        CURRENT envelope for GET /frameworks/published/{id}. Single object with
        the framework (controls + measurements included for published
        frameworks, regardless of license) and an informational `licensed` flag.
        `message` is optional and no longer implies stripped controls.
      required: [framework, licensed]
      properties:
        framework:
