  # ============================================================
  # Tickets (unified ticketing system; CLAUDE.md "Ticketing System")
  # ============================================================
  /tickets:
    get:
      operationId: listTickets
      tags: [tickets]
      summary: List the tenant's tickets
      description: >
        Returns a page of tickets for the tenant, filtered by any combination
        of the query parameters. Page defaults to 1 and page_size to 20 (capped
        at 100 in the service layer; values outside 1..100 collapse to 20).
      parameters:
        - $ref: "#/components/parameters/TicketCategoryFilter"
        - $ref: "#/components/parameters/TicketStatusFilter"
        - $ref: "#/components/parameters/TicketPriorityFilter"
        - $ref: "#/components/parameters/TicketSeverityFilter"
        - $ref: "#/components/parameters/TicketAssignedToFilter"
        - $ref: "#/components/parameters/TicketAssetIdFilter"
        - $ref: "#/components/parameters/TicketCertificateIdFilter"
        - $ref: "#/components/parameters/TicketFindingIdFilter"
        - $ref: "#/components/parameters/TicketSourceFilter"
        - $ref: "#/components/parameters/TicketSearchFilter"
        - $ref: "#/components/parameters/TicketOverdueFilter"
        - $ref: "#/components/parameters/TicketPageParam"
        - $ref: "#/components/parameters/TicketPageSizeParam"
      responses:
        "200":
          description: A page of tickets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketListResponse"
        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
        "500":
          $ref: "#/components/responses/LegacyServerError"
      x-quirks:
        - "UUID-shaped filters (assigned_to, asset_id, certificate_id, finding_id) are silently dropped when the value fails uuid.Parse — the request still returns 200 with the filter ignored, not 400."
        - "page_size outside the 1..100 range silently collapses to the default 20 — no warning, no error."
        - "overdue is a boolean toggle: the service treats only the exact string `true` as on; any other value (including `1`, `True`, `yes`) is off."
        - "The response carries `total` and echoes the requested `page` + `page_size` at the top level, not under a `pagination` envelope — this is a pre-ADR-0002 shape."
    post:
      operationId: createTicket
      tags: [tickets]
      summary: Create a ticket
      description: >
        Creates a new ticket in the unified `tickets` table. `category` defaults
        to `general`, `priority` to `medium`, `source` to `manual`, `status` to
        `open`, `external_sync_status` to `none`. Inventory-link UUID fields
        (finding_id, asset_id, etc.) are silently dropped when malformed, same
        as the list filters.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTicketRequest"
      responses:
        "201":
          description: The ticket was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketCreatedResponse"
        "400":
          $ref: "#/components/responses/LegacyBadRequest"
        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
        "500":
          $ref: "#/components/responses/LegacyServerError"
      x-quirks:
        - "Title is required twice: by `binding:\"required\"` on the Go struct AND by an explicit `input.Title == \"\"` check. The struct binding catches a missing field; the explicit check catches an empty string slipping past JSON binding. Both fail with 400 + the same `error: \"Invalid request format\"` or `\"Title is required\"` shape, but the message differs."
        - "Inventory-link UUID fields (finding_id, control_id, asset_id, certificate_id, crypto_implementation_id, assigned_to) are silently dropped when malformed — handler still returns 201 with the ticket created without the link."
        - "Malformed due_date returns 500 (not 400), because the service-layer time.Parse error is collapsed to the generic `Failed to create ticket` 500. Clients should validate RFC3339 client-side."

  /tickets/stats:
    get:
      operationId: getTicketStats
      tags: [tickets]
      summary: Aggregate ticket statistics
      description: >
        Returns counts grouped by status, by category, plus the overdue count
        and total. Used by dashboards and the Risk & Compliance → Remediation
        progress view alongside `/tickets/progress`.
      responses:
        "200":
          description: Aggregate counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketStatsResponse"
        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
        "500":
          $ref: "#/components/responses/LegacyServerError"

  /tickets/progress:
    get:
      operationId: getTicketProgress
      tags: [tickets]
      summary: Time-series remediation progress
      description: >
        Returns ticket activity over the requested window (default 30 days):
        opened/resolved per day, the status summary, the average resolution
        time in hours within the window, and a category × status breakdown.
        When `category` is omitted, all categories are included.
      parameters:
        - name: days
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: Trailing window size in days. Defaults to 30 when absent or non-positive.
        - name: category
          in: query
          required: false
          schema:
            type: string
          description: Optional category filter (compliance, certificate, remediation, vulnerability, operational, general).
      responses:
        "200":
          description: Time-series remediation progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketProgressResponse"
        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
        "500":
          $ref: "#/components/responses/LegacyServerError"
      x-quirks:
        - "`days` is parsed permissively: non-numeric values fall back to 30, and zero/negative values also fall back to 30 (a second sanitization in the service layer)."
        - "`summary` always includes an `overdue` key even though it's computed by a separate query — clients should not assume keys correspond 1:1 to ticket `status` enums."
        - "`trend` is empty (not omitted) when no tickets fall in the window; serialized as `[]`. `avg_resolution_hours` is 0 when no tickets resolved in the window."

  /tickets/{id}:
    parameters:
      - $ref: "#/components/parameters/TicketId"
    get:
      operationId: getTicket
      tags: [tickets]
      summary: Fetch a single ticket
      responses:
        "200":
          description: The ticket.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketResponse"
        "400":
          $ref: "#/components/responses/LegacyBadRequest"
        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
        "404":
          $ref: "#/components/responses/LegacyNotFound"
        "500":
          $ref: "#/components/responses/LegacyServerError"
    put:
      operationId: updateTicket
      tags: [tickets]
      summary: Partial update of a ticket
      description: >
        All fields on the request body are optional; only present fields are
        applied. Setting `status` to `resolved` or `closed` stamps
        `resolved_at` server-side. An empty-string `due_date` clears the field;
        a non-empty value must be RFC3339.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTicketRequest"
      responses:
        "200":
          description: The ticket was updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketUpdatedResponse"
        "400":
          $ref: "#/components/responses/LegacyBadRequest"
        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
        "404":
          $ref: "#/components/responses/LegacyNotFound"
        "500":
          $ref: "#/components/responses/LegacyServerError"
      x-quirks:
        - "Not-found is detected by `err.Error() == \"ticket not found\"` string matching — any service-layer rewording would silently degrade the 404 to a 500."
        - "Invalid `due_date` (non-RFC3339, non-empty) returns 500 — the parse error is wrapped and bubbles up as a generic update failure. Same handling asymmetry as create."
    delete:
      operationId: deleteTicket
      tags: [tickets]
      summary: Delete a ticket (comments cascade)
      responses:
        "200":
          description: The ticket was deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/LegacyBadRequest"
        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
        "404":
          $ref: "#/components/responses/LegacyNotFound"
        "500":
          $ref: "#/components/responses/LegacyServerError"
      x-quirks:
        - "Not-found is detected by `err.Error() == \"ticket not found\"` string matching, same as update."

  /tickets/{id}/comments:
