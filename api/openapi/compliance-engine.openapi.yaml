openapi: 3.1.0
info:
  title: VistaPlatform — compliance-engine API
  version: "0.1.0"
  description: |
    Spec-first contract for compliance-engine (ADR-0001). Sixth vertical slice
    overall; second slice for the compliance-engine service after the
    frameworks slice that introduced this file.

    ## Scope of this file

    Covers the tenant-facing surface on the v1 path prefix
    `/api/v1/compliance-engine`. Two resource groups so far:

    **Frameworks** (first compliance-engine slice):

      - `GET    /frameworks/published`           — list published platform frameworks (with per-tenant license flag)
      - `GET    /frameworks/published/{id}`      — view one published platform framework (controls hidden when unlicensed)
      - `GET    /frameworks/licenses`            — list the tenant's framework subscriptions
      - `GET    /frameworks/available`           — list published frameworks tagged with license + platform-default flags
      - `GET    /frameworks/default`             — get the tenant's current default framework
      - `POST   /frameworks/subscribe`           — self-service subscribe to a platform framework
      - `DELETE /frameworks/subscribe/{frameworkId}` — cancel a framework subscription
      - `PUT    /frameworks/default`             — set the tenant's default framework

    **Tickets** (this slice — the unified ticketing system; see CLAUDE.md
    "Ticketing System (compliance-engine)"):

      - `GET    /tickets`                        — list/filter the tenant's tickets (paginated)
      - `POST   /tickets`                        — create a ticket (any category)
      - `GET    /tickets/stats`                  — aggregate counts (by status, by category, overdue, total)
      - `GET    /tickets/progress`               — time-series remediation progress over the requested window
      - `GET    /tickets/{id}`                   — fetch a single ticket
      - `PUT    /tickets/{id}`                   — partial update (status, priority, assignment, etc.)
      - `DELETE /tickets/{id}`                   — delete a ticket (comments cascade)
      - `GET    /tickets/{id}/comments`          — list a ticket's comments
      - `POST   /tickets/{id}/comments`          — add a comment to a ticket

    Out of scope for these slices:

      - Tenant-authored framework CRUD (`/frameworks/tenant/*`) — Enterprise-tier
        custom-policies surface.
      - Control / measurement editing — same custom-policies surface.
      - Threshold overrides (`/threshold-overrides/*`) — premium add-on.
      - User-level framework preference (`/frameworks/user-preference`) — per-user
        view setting, orthogonal to subscription identity.
      - Workspace status (`/frameworks/status`) — owned by workspace_handlers,
        separate handler package.
      - Platform-admin framework authoring (admin-ui surface).
      - Legacy batch `POST /frameworks/licenses` + `PUT /frameworks/licenses/unlock`
        — superseded by the subscribe/cancel/default trio above and flagged
        deprecated in the web-ui client.

    ## Shape status (important)

    These paths document the **current, pre-envelope shapes** the service
    returns today, captured from the real gin handlers
    (`services/compliance-engine/internal/handlers/{tenant_framework_handlers,framework_license_handlers}.go`):
    list endpoints wrap a top-level key like `frameworks` / `licenses` /
    `default_framework`, single GETs wrap as `{ "framework": {...}, "licensed":
    bool }`, mutations return `{ "message": "..." }`, errors as `{ "error":
    "string" }` (some 400s also carry a free-form `details` field). They are
    specced as-is per ADR-0001 step 2, and the Go contract test
    (`services/compliance-engine/internal/handlers/framework_contract_test.go`)
    asserts the live handlers match them.

    The **go-forward ADR-0002 envelope** (`Error`, `Pagination`, the `data`
    wrapper) is defined under `components.schemas` as the documented standard
    that NEW or HARDENED endpoints conform to. The current v1 framework paths
    do not yet use it; they are hardened to it when the frontend-v2 surface
    first consumes them (ADR-0001 step 5), at which point this file and the
    contract test move together.
  contact:
    name: VistaPlatform Platform
servers:
  - url: /api/v1/compliance-engine
    description: compliance-engine, mounted behind the API gateway.

tags:
  - name: frameworks
    description: Tenant-facing framework reads + subscription operations.
  - name: tickets
    description: Unified ticket CRUD, comments, stats, and progress trend.
  - name: findings
    description: >
      Compliance findings reads — per-asset findings, a finding's change
      history, and aggregate statistics. UI consumer:
      web-ui/src/services/compliance-api.ts (Risk & Compliance workspace).
  - name: scenarios
    description: >
      Compliance what-if scenarios — named, saved filter sets evaluated against
      a framework. Reads only in this slice.
  - name: overrides
    description: >
      Compliance control overrides (severity / applicability adjustments) on a
      framework's controls. Reads only in this slice.
  - name: remediation-plans
    description: >
      Remediation plans — grouped sets of findings worked as a unit, with
      progress rollups. Reads only in this slice. UI consumer:
      web-ui/src/services/compliance-api.ts.
  - name: custom-policies
    description: >
      Tenant-authored frameworks (custom policies) — full CRUD over a tenant's
      own frameworks, controls, and control-measurement mappings. Mutations are
      gated by the `custom_policies` Enterprise feature flag. UI consumer:
      web-ui/src/services/frameworks-api.ts.
  - name: evaluation
    description: >
      Framework evaluation reads — aggregate compliance score, per-framework
      status, the consolidated framework-context payload, and multi/batch
      framework evaluation. UI consumers: web-ui/src/services/compliance-api.ts
      and frameworks-api.ts (Risk & Compliance workspace).
  - name: alerts
    description: >
      Stateful alert engine (#943) — tenant-facing reads (list, stats, one alert
      with its evidence chain) and the lifecycle mutations (acknowledge, snooze,
      unsnooze, resolve, create-ticket-from-alert). Reads are open to any member;
      mutations are gated by the `alerts.manage` permission. One open alert
      exists per (tenant, alert_type, subject); repeated raises escalate it. UI
      consumer: web-ui remediation surface.
  - name: alert-catalog
    description: >
      Tenant alert catalog (Settings → Alert Rules) — registry alert types
      overlaid with tenant enable/preference state and, for ladder types
      (currently certificate_expiring), the effective escalation ladder
      including rungs projected from activated compliance policies. Reads
      open to any member; the update is gated by `alerts.manage`. UI
      consumer: web-ui Settings → Alert Rules.
  - name: admin-alerts
    description: >
      Platform-track stateful alerts (service_down, tenant_health_degraded, …)
      raised under the sentinel platform tenant. Platform-admin only, read-only
      here. UI consumer: admin-ui-v2 System Health → Alerts.

paths:
  /plans:
    get:
      operationId: listPlans
      tags: [remediation-plans]
      summary: List the tenant's remediation plans
      responses:
        "200":
          description: A page of remediation plans.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemediationPlanListResponse"
        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
        "500":
          $ref: "#/components/responses/LegacyServerError"
    post:
      operationId: createPlan
      tags: [remediation-plans]
      summary: Create a remediation plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlanRequest"
      responses:
        "201":
          description: The created plan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanMutationResponse"
        "400":
          $ref: "#/components/responses/LegacyBadRequest"
        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
        "500":
          $ref: "#/components/responses/LegacyServerError"
  /plans/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Plan UUID.
        schema:
          type: string
          format: uuid
    get:
      operationId: getPlan
      tags: [remediation-plans]
      summary: Get a remediation plan by id
      responses:
        "200":
          description: The remediation plan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemediationPlanResponse"
        "400":
          $ref: "#/components/responses/LegacyBadRequest"
        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
        "404":
          $ref: "#/components/responses/LegacyNotFound"
        "500":
          $ref: "#/components/responses/LegacyServerError"
    put:
      operationId: updatePlan
      tags: [remediation-plans]
      summary: Update a remediation plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePlanRequest"
      responses:
        "200":
          description: The updated plan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanMutationResponse"
        "400":
          $ref: "#/components/responses/LegacyBadRequest"
        "404":
          $ref: "#/components/responses/LegacyNotFound"
        "500":
          $ref: "#/components/responses/LegacyServerError"
    delete:
      operationId: deletePlan
      tags: [remediation-plans]
      summary: Delete a remediation plan
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/LegacyBadRequest"
        "404":
          $ref: "#/components/responses/LegacyNotFound"
        "500":
          $ref: "#/components/responses/LegacyServerError"
  /plans/{id}/progress:
    parameters:
      - name: id
        in: path
        required: true
        description: Plan UUID.
        schema:
          type: string
          format: uuid
    get:
      operationId: getPlanProgress
      tags: [remediation-plans]
      summary: Get a remediation plan's progress rollup
      responses:
        "200":
          description: The plan progress rollup.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanProgress"
        "400":
          $ref: "#/components/responses/LegacyBadRequest"
        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
        "404":
          $ref: "#/components/responses/LegacyNotFound"
        "500":
          $ref: "#/components/responses/LegacyServerError"
  /plans/{id}/items:
    parameters:
      - name: id
        in: path
        required: true
        description: Plan UUID.
        schema:
          type: string
          format: uuid
    get:
      operationId: listPlanItems
      tags: [remediation-plans]
      summary: List a remediation plan's items (findings, with joined detail)
      responses:
        "200":
          description: The plan's items.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanItemsResponse"
        "400":
          $ref: "#/components/responses/LegacyBadRequest"
        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
        "404":
          $ref: "#/components/responses/LegacyNotFound"
        "500":
          $ref: "#/components/responses/LegacyServerError"
    post:
      operationId: addPlanItem
      tags: [remediation-plans]
      summary: Add a finding to a remediation plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddPlanItemRequest"
      responses:
        "201":
          description: The added item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanItemMutationResponse"
        "400":
          $ref: "#/components/responses/LegacyBadRequest"
        "404":
          $ref: "#/components/responses/LegacyNotFound"
        "409":
          description: Finding already in the plan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyError"
        "500":
          $ref: "#/components/responses/LegacyServerError"
  /plans/{id}/items/bulk:
    parameters:
      - name: id
        in: path
        required: true
        description: Plan UUID.
        schema:
          type: string
          format: uuid
    post:
      operationId: addPlanItemsBulk
      tags: [remediation-plans]
      summary: Add multiple findings to a remediation plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddPlanItemsBulkRequest"
      responses:
        "201":
          description: 'Items added — `{ "message": "...", "added": N }`.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanItemsBulkResponse"
        "400":
          $ref: "#/components/responses/LegacyBadRequest"
        "404":
          $ref: "#/components/responses/LegacyNotFound"
        "500":
          $ref: "#/components/responses/LegacyServerError"
  /plans/{id}/items/{itemId}:
    parameters:
      - name: id
        in: path
        required: true
        description: Plan UUID.
        schema:
          type: string
          format: uuid
      - name: itemId
        in: path
        required: true
        description: Plan item UUID.
        schema:
          type: string
          format: uuid
    delete:
      operationId: removePlanItem
      tags: [remediation-plans]
      summary: Remove a finding from a remediation plan
      responses:
        "200":
          description: Removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/LegacyBadRequest"
        "404":
          $ref: "#/components/responses/LegacyNotFound"
        "500":
          $ref: "#/components/responses/LegacyServerError"
  /plans/{id}/items/{itemId}/ticket:
    parameters:
      - name: id
        in: path
        required: true
        description: Plan UUID.
        schema:
          type: string
          format: uuid
      - name: itemId
        in: path
        required: true
        description: Plan item UUID.
        schema:
          type: string
          format: uuid
    put:
      operationId: linkTicketToPlanItem
      tags: [remediation-plans]
      summary: Link a ticket to a remediation plan item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkTicketRequest"
      responses:
        "200":
          description: Linked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/LegacyBadRequest"
        "500":
          $ref: "#/components/responses/LegacyServerError"
  /scenarios:
    get:
      operationId: listScenarios
      tags: [scenarios]
      summary: List the tenant's compliance scenarios
      responses:
        "200":
          description: The tenant's scenarios.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioListResponse"
        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
        "500":
          $ref: "#/components/responses/LegacyServerError"
    post:
      operationId: createScenario
      tags: [scenarios]
      summary: Create a compliance scenario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateScenarioRequest"
      responses:
        "201":
          description: The created scenario.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioMutationResponse"
        "400":
          $ref: "#/components/responses/LegacyBadRequest"
        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
        "409":
          description: A scenario with that name already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyError"
        "500":
          $ref: "#/components/responses/LegacyServerError"
  /scenarios/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Scenario UUID.
        schema:
          type: string
          format: uuid
    get:
      operationId: getScenario
      tags: [scenarios]
      summary: Get a compliance scenario by id
      responses:
        "200":
          description: The scenario.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioResponse"
        "400":
          $ref: "#/components/responses/LegacyBadRequest"
        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
        "404":
          $ref: "#/components/responses/LegacyNotFound"
        "500":
          $ref: "#/components/responses/LegacyServerError"
    put:
      operationId: updateScenario
      tags: [scenarios]
      summary: Update a compliance scenario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateScenarioRequest"
      responses:
        "200":
          description: The updated scenario.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioMutationResponse"
        "400":
          $ref: "#/components/responses/LegacyBadRequest"
        "500":
          $ref: "#/components/responses/LegacyServerError"
    delete:
      operationId: deleteScenario
      tags: [scenarios]
      summary: Delete a compliance scenario
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/LegacyBadRequest"
        "500":
          $ref: "#/components/responses/LegacyServerError"
  /overrides:
    get:
      operationId: listOverrides
      tags: [overrides]
      summary: List the tenant's compliance control overrides
      description: Optionally filtered by scenario_id; returns global overrides when unset.
      responses:
        "200":
          description: The tenant's overrides.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverrideListResponse"
        "400":
          $ref: "#/components/responses/LegacyBadRequest"
        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
        "500":
          $ref: "#/components/responses/LegacyServerError"
    post:
      operationId: createOverride
      tags: [overrides]
      summary: Create a compliance control override
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOverrideRequest"
      responses:
        "201":
          description: The created override.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverrideMutationResponse"
        "400":
          $ref: "#/components/responses/LegacyBadRequest"
        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
        "500":
          $ref: "#/components/responses/LegacyServerError"
  /overrides/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Override UUID.
        schema:
          type: string
          format: uuid
    delete:
      operationId: deleteOverride
      tags: [overrides]
      summary: Delete a compliance control override
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/LegacyBadRequest"
        "500":
          $ref: "#/components/responses/LegacyServerError"
  /findings:
    get:
      operationId: listFindings
      tags: [findings]
      summary: List the tenant's compliance findings
      description: >
        Returns a paginated page of the tenant's ACTIVE compliance findings,
        newest-seen first, with the owning asset joined onto each finding for
        display (no per-asset N+1). Unlike the per-asset list, suppressed
        findings are included so a triage surface can show and un-suppress
        them — narrow with `workflow_status` when they aren't wanted.
        Added for the frontend-v2 Findings workflow surface (issue #500).
      parameters:
        - name: page
          in: query
          description: 1-based page number (default 1).
          schema:
            type: integer
            minimum: 1
        - name: page_size
          in: query
          description: Page size (default 50, max 200).
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - name: workflow_status
          in: query
          description: Case-insensitive filter — NEW / NOTIFIED / RESOLVED / SUPPRESSED.
          schema:
            type: string
        - name: severity
          in: query
          description: Case-insensitive filter — Low / Med / High / Critical ("medium" is accepted for Med).
          schema:
            type: string
        - name: assigned_to
          in: query
          description: Findings assigned to this user. Takes precedence over `unassigned`.
          schema:
            type: string
            format: uuid
        - name: unassigned
          in: query
          description: When `true`, only findings with no assignee.
          schema:
            type: boolean
        - name: control_id
          in: query
          description: Findings on one framework control.
          schema:
            type: string
            format: uuid
        - name: framework_id
          in: query
          description: Findings on any control of this platform or tenant framework.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: A page of findings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindingListResponse"
        "400":
          $ref: "#/components/responses/LegacyBadRequest"
        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
        "500":
          $ref: "#/components/responses/LegacyServerError"
  /findings/statistics:
    get:
      operationId: getFindingStatistics
      tags: [findings]
      summary: Aggregate finding statistics for the current tenant
      description: Returns counts of findings by detection state and workflow status.
      responses:
        "200":
          description: The finding statistics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindingStatistics"
        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
        "500":
          $ref: "#/components/responses/LegacyServerError"
  /findings/by-control:
    get:
      operationId: getFindingsByControl
      tags: [findings]
      summary: Active findings grouped by framework control (top exposures)
      description: >
        Returns active findings aggregated per framework control — worst
        severity, finding count, affected-asset count, and a per-severity
        breakdown — ranked worst-severity → count → affected-assets. Backs the
        Posture "highest-priority exposures" list. Read off the materialized
        compliance_findings table, so it agrees with the Findings page.
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 5, minimum: 1, maximum: 50 }
          description: Maximum number of control groups to return (default 5).
      responses:
        "200":
          description: The control groups, ranked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindingsByControlResponse"
        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
        "500":
          $ref: "#/components/responses/LegacyServerError"
  /findings/{id}/assign:
    parameters:
      - name: id
        in: path
        required: true
        description: Finding UUID.
        schema:
          type: string
          format: uuid
    post:
      operationId: assignFindingOwner
      tags: [findings]
      summary: Assign an owner to a finding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignFindingRequest"
      responses:
        "200":
          description: Assigned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/LegacyBadRequest"
        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
        "500":
          $ref: "#/components/responses/LegacyServerError"
    delete:
      operationId: unassignFindingOwner
      tags: [findings]
      summary: Remove a finding's owner assignment
      responses:
        "200":
          description: Unassigned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/LegacyBadRequest"
        "500":
          $ref: "#/components/responses/LegacyServerError"
  /findings/{id}/evidence-id:
    parameters:
      - name: id
        in: path
        required: true
        description: Finding UUID.
        schema:
          type: string
          format: uuid
    get:
      operationId: getFindingEvidenceId
      tags: [findings]
      summary: Get a finding's copyable evidence id / reference
      responses:
        "200":
          description: 'The evidence id — `{ "evidence_id": ..., "evidence_ref": ..., "copyable": true }`.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceIdResponse"
        "400":
          $ref: "#/components/responses/LegacyBadRequest"
        "404":
          $ref: "#/components/responses/LegacyNotFound"
        "500":
          $ref: "#/components/responses/LegacyServerError"
  /findings/{id}/workflow-status:
    parameters:
      - name: id
        in: path
        required: true
        description: Finding UUID.
        schema:
          type: string
          format: uuid
    put:
      operationId: updateFindingWorkflowStatus
      tags: [findings]
      summary: Update a finding's workflow status (acknowledge / resolve / suppress)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWorkflowStatusRequest"
      responses:
        "200":
          description: 'The updated finding — `{ "finding": {...} }`.'
          content:
            application/json:
              schema:
