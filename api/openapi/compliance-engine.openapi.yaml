      description: >
        Lists the stateful alerts raised under the sentinel platform tenant
        (service_down, tenant_health_degraded, …). Platform-admin only — no
        tenant context is used; the handler always scopes to the reserved
        platform tenant. Filter with the same query params as the tenant
        `/alerts` read.
      parameters:
        - $ref: "#/components/parameters/AlertStatusFilter"
