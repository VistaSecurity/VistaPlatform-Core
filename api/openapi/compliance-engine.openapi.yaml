  /frameworks/published:
    get:
      operationId: listPublishedFrameworks
      tags: [frameworks]
      summary: List published platform frameworks
      description: >
        Returns every platform framework whose status is `published`. When a
        tenant context is present the handler returns each framework decorated
        with `is_licensed` (the with-license shape); without a tenant context it
        falls back to the bare PublishedFramework list. The frontend always
        calls this from an authenticated tenant context, so the with-license
        shape is the practical surface.
      responses:
        "200":
          description: The list of published platform frameworks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishedFrameworkListResponse"
        "500":
          $ref: "#/components/responses/LegacyServerError"
      x-quirks:
        - "Without a tenant context the response omits is_licensed on each framework (the handler picks a different service method). In practice the gateway always supplies tenant context, but the schema declares is_licensed as optional to capture both shapes."

  /frameworks/published/{id}:
    parameters:
      - $ref: "#/components/parameters/FrameworkId"
    get:
      operationId: getPublishedFramework
      tags: [frameworks]
      summary: View a published platform framework
      description: >
        Returns one published platform framework with its full control +
        measurement detail. Control detail is visible to ALL tenants for
        transparency — a tenant must be able to read what each control measures
        so a posture score is explainable. The `licensed` flag is informational
        only (true when the tenant has an active subscription, false otherwise);
        it no longer gates `controls`. Per-framework billing was retired in
        ADR-0014.
      responses:
        "200":
          description: The framework, including its controls + measurements.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishedFrameworkViewResponse"
