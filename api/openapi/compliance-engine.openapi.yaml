                $ref: "#/components/schemas/AlertMutationResponse"
        "400":
          $ref: "#/components/responses/LegacyBadRequest"
        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
        "404":
          $ref: "#/components/responses/LegacyNotFound"
        "409":
          $ref: "#/components/responses/LegacyConflict"
        "500":
          $ref: "#/components/responses/LegacyServerError"
      x-quirks:
        - "`until` is required (RFC3339); a missing or malformed value returns 400 with `error: \"until (RFC3339) is required\"`."

  /alerts/{id}/unsnooze:
    parameters:
      - $ref: "#/components/parameters/AlertId"
    post:
      operationId: unsnoozeAlert
      tags: [alerts]
      summary: Return a snoozed alert to active
      description: Wakes a snoozed alert. Gated by `alerts.manage`.
      responses:
        "200":
          description: The updated alert.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertMutationResponse"
        "400":
          $ref: "#/components/responses/LegacyBadRequest"
        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
        "404":
          $ref: "#/components/responses/LegacyNotFound"
        "409":
          $ref: "#/components/responses/LegacyConflict"
        "500":
          $ref: "#/components/responses/LegacyServerError"

  /alerts/{id}/resolve:
    parameters:
      - $ref: "#/components/parameters/AlertId"
    post:
      operationId: resolveAlert
      tags: [alerts]
      summary: Manually resolve an alert
      description: >
        Resolves the alert with an optional free-text note. The request body is
        optional. Gated by `alerts.manage`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveAlertRequest"
      responses:
        "200":
          description: The updated alert.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertMutationResponse"
        "400":
          $ref: "#/components/responses/LegacyBadRequest"
        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
        "404":
          $ref: "#/components/responses/LegacyNotFound"
        "409":
          $ref: "#/components/responses/LegacyConflict"
        "500":
          $ref: "#/components/responses/LegacyServerError"

  /alerts/{id}/ticket:
    parameters:
      - $ref: "#/components/parameters/AlertId"
    post:
      operationId: createTicketFromAlert
      tags: [alerts]
      summary: Create a linked ticket carrying the alert's evidence timeline
      description: >
        Creates a unified ticket (category `operational`) linked to the alert,
        carrying its evidence timeline. Gated by `alerts.manage`.
      responses:
        "201":
          description: The created ticket.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertTicketResponse"
        "400":
          $ref: "#/components/responses/LegacyBadRequest"
        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
        "404":
          $ref: "#/components/responses/LegacyNotFound"
        "409":
          $ref: "#/components/responses/LegacyConflict"
        "500":
          $ref: "#/components/responses/LegacyServerError"

  /alert-catalog:
    get:
      operationId: getAlertCatalog
      tags: [alert-catalog]
      summary: Tenant alert catalog (Settings → Alert Rules)
      description: >
        Returns the registry-defined alert types overlaid with the tenant's
        enable/preference state and, for ladder types, the effective
        escalation ladder (baseline rung + tenant preference rung + rungs
        projected from the tenant's activated compliance policies). Reads are
        open to any member.
      responses:
        "200":
          description: The tenant-track alert catalog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertCatalogListResponse"
        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
        "500":
          $ref: "#/components/responses/LegacyServerError"
      x-quirks:
        - "Only registry entries whose `track` is `tenant` are returned — platform-track entries (service_down, tenant_health_degraded, …) never appear here."
        - "`catalog` is always an array, never null — the handler initializes it to `[]CatalogEntry{}` before appending."
        - "`ladder` is only populated for `severity_model: ladder` entries with a positive `baseline_days`; fixed-severity entries omit it."

  /alert-catalog/{type}:
    parameters:
      - $ref: "#/components/parameters/AlertCatalogTypeParam"
    put:
      operationId: updateAlertCatalogEntry
      tags: [alert-catalog]
      summary: Update the tenant's enable/preference state for one alert type
      description: >
        Upserts the tenant's enable flag and optional preference rung for one
        registry alert type. Gated by `alerts.manage`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAlertCatalogEntryRequest"
      responses:
        "200":
          description: The setting was upserted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertCatalogUpdateResponse"
        "400":
          $ref: "#/components/responses/LegacyBadRequest"
        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
        "500":
          $ref: "#/components/responses/LegacyServerError"
      x-quirks:
        - "`enabled` is required; a missing value returns 400 with `error: \"enabled is required\"`."
        - "`{type}` naming an alert type not in the registry returns 400 (not 404) with `error: \"unknown alert type: <type>\"`."
        - "`preference_rung.days` outside 1..3650 returns 400 with `error: \"preference rung days must be 1–3650\"`."
        - "Omitting `preference_rung` (or sending it as `null`/`{}`) clears the tenant's preference rung, falling the ladder back to the registry baseline."
        - "Success returns `{ \"status\": \"updated\" }`, not the updated catalog entry — callers refetch `GET /alert-catalog` to see the new effective ladder."

components:
  parameters:
    AlertId:
      name: id
      in: path
      required: true
      description: Alert UUID.
      schema:
        type: string
        format: uuid
    AlertStatusFilter:
      name: status
      in: query
      required: false
      description: Filter by lifecycle status (active, acknowledged, snoozed, resolved).
      schema:
        type: string
    AlertSeverityFilter:
      name: severity
      in: query
      required: false
      description: Filter by severity (critical, high, medium, low).
      schema:
        type: string
    AlertTypeFilter:
      name: type
      in: query
      required: false
      description: Filter by alert type (e.g. service_down, tenant_health_degraded, certificate_expiring).
      schema:
        type: string
    AlertLimitParam:
      name: limit
      in: query
      required: false
      description: Maximum alerts to return. Defaults to 200; a non-numeric value is silently ignored.
      schema:
        type: integer
        minimum: 1
    AlertCatalogTypeParam:
      name: type
      in: path
      required: true
      description: >
        Registry alert-type id (e.g. certificate_expiring, sensor_offline,
        control_noncompliant) — not a UUID.
      schema:
        type: string
    FrameworkId:
      name: id
      in: path
      required: true
      description: Platform framework UUID.
      schema:
        type: string
        format: uuid
    FrameworkIdQuery:
      name: frameworkId
      in: path
      required: true
      description: Platform framework UUID (subscribe path uses `frameworkId` as the param name).
      schema:
        type: string
        format: uuid
    ControlId:
      name: controlId
      in: path
      required: true
      description: Tenant-framework control UUID.
      schema:
        type: string
        format: uuid
    ControlIdAsId:
      name: id
      in: path
      required: true
      description: Tenant-framework control UUID (the measurement routes bind the control id to the `id` param).
      schema:
        type: string
        format: uuid
    MeasurementId:
      name: measurementId
      in: path
      required: true
      description: Control-measurement mapping UUID.
      schema:
        type: string
        format: uuid

    # --- Tickets ---
    TicketId:
      name: id
      in: path
      required: true
      description: Ticket UUID.
      schema:
        type: string
        format: uuid
    TicketCategoryFilter:
      name: category
      in: query
      required: false
      schema:
        type: string
        enum: [compliance, certificate, remediation, vulnerability, operational, general]
    TicketStatusFilter:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum: [open, in_progress, resolved, closed]
    TicketPriorityFilter:
      name: priority
      in: query
      required: false
      schema:
        type: string
        enum: [low, medium, high, critical]
    TicketSeverityFilter:
      name: severity
      in: query
      required: false
      schema:
        type: string
    TicketAssignedToFilter:
      name: assigned_to
      in: query
      required: false
      schema:
        type: string
        format: uuid
    TicketAssetIdFilter:
      name: asset_id
      in: query
      required: false
      schema:
        type: string
        format: uuid
    TicketCertificateIdFilter:
      name: certificate_id
      in: query
      required: false
      schema:
        type: string
        format: uuid
    TicketFindingIdFilter:
      name: finding_id
      in: query
      required: false
      schema:
        type: string
        format: uuid
    TicketSourceFilter:
      name: source
      in: query
      required: false
      schema:
        type: string
    TicketSearchFilter:
      name: search
      in: query
      required: false
      description: ILIKE substring match against `title` and `description`.
      schema:
        type: string
    TicketOverdueFilter:
      name: overdue
      in: query
      required: false
      description: When set to the literal string `true`, only overdue tickets are returned.
      schema:
        type: string
        enum: ["true"]
    TicketPageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
    TicketPageSizeParam:
      name: page_size
      in: query
      required: false
      description: 1..100; values outside this range silently fall back to the default 20.
      schema:
        type: integer
        minimum: 1
        maximum: 100

  responses:
    # --- Current ("legacy") error envelope: { "error": "string" } ---
    LegacyBadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LegacyError"
    LegacyUnauthorized:
      description: Missing or invalid tenant/auth context.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LegacyError"
    LegacyNotFound:
      description: Framework not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LegacyError"
    LegacyNotFoundWithDetails:
      description: Resource not found, with an extra `details` string on the error envelope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LegacyErrorWithDetails"
    LegacyBadRequestWithDetails:
      description: Invalid request, possibly with an extra `details` string on the error envelope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LegacyErrorWithDetails"
    LegacyForbidden:
      description: The tenant is not entitled to this action (e.g. custom_policies feature flag off).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LegacyError"
    LegacyConflict:
      description: The requested state transition is not valid for the resource's current state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LegacyError"
    LegacyServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LegacyError"
    LegacyServerErrorWithDetails:
      description: Unexpected server error, possibly with an extra `details` string on the error envelope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LegacyErrorWithDetails"

  schemas:
    # ============================================================
    # Remediation-plans domain
    # ============================================================
    RemediationPlan:
      type: object
      additionalProperties: false
      description: >
        A remediation plan (models.RemediationPlan). The listed required fields
        are always present (including the computed item_count / resolved_count /
        progress rollups); the rest are `omitempty` and appear only when set.
      required:
        - id
        - tenant_id
        - title
        - plan_type
        - status
        - priority
        - created_by
        - created_at
        - updated_at
        - item_count
        - resolved_count
        - progress
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        plan_type:
          type: string
        status:
          type: string
        priority:
          type: string
        owner_id:
          type: string
          format: uuid
        target_date:
          type: string
          format: date-time
        framework_id:
          type: string
          format: uuid
        completed_at:
          type: string
          format: date-time
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        item_count:
          type: integer
        resolved_count:
          type: integer
        progress:
          type: integer
    PlanProgress:
      type: object
      additionalProperties: false
      description: >
        A remediation plan's progress rollup (models.PlanProgress). Returned bare
        by GET /plans/{id}/progress. The by_* breakdown maps are required but
        nullable (they serialize as null when empty).
      required:
        - total_items
        - by_workflow_status
        - by_ticket_status
        - by_severity
        - percent_resolved
        - all_resolved
      properties:
        total_items:
          type: integer
        by_workflow_status:
          type: [object, "null"]
          additionalProperties:
            type: integer
        by_ticket_status:
          type: [object, "null"]
          additionalProperties:
            type: integer
        by_severity:
          type: [object, "null"]
          additionalProperties:
            type: integer
        percent_resolved:
          type: integer
        all_resolved:
          type: boolean
    RemediationPlanListResponse:
      type: object
      additionalProperties: false
      description: 'CURRENT envelope for GET /plans — `{ "plans": [...], "total": N, "page": P, "page_size": S }`. On an empty/nil result `plans` can serialize as JSON null, so it is typed as a nullable array.'
      required:
        - plans
        - total
        - page
        - page_size
      properties:
        plans:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/RemediationPlan"
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
    RemediationPlanResponse:
      type: object
      additionalProperties: false
      description: 'CURRENT envelope for GET /plans/{id} — `{ "plan": {...} }`.'
      required:
        - plan
      properties:
        plan:
          $ref: "#/components/schemas/RemediationPlan"
    RemediationPlanItem:
      type: object
      additionalProperties: false
      description: >
        A remediation plan item — a finding attached to a plan, with optional
        joined finding/ticket detail (models.RemediationPlanItem). The listed
        required fields are always present; the rest are `omitempty` and appear
        only when the join populates them.
      required:
        - id
        - plan_id
        - finding_id
        - added_at
        - added_by
      properties:
        id:
          type: string
          format: uuid
        plan_id:
          type: string
          format: uuid
        finding_id:
          type: string
          format: uuid
        ticket_id:
          type: string
          format: uuid
        notes:
          type: string
        added_at:
          type: string
          format: date-time
        added_by:
          type: string
          format: uuid
        finding_severity:
          type: string
        finding_summary:
          type: string
        finding_workflow_status:
          type: string
        finding_asset_type:
          type: string
        finding_asset_id:
          type: string
          format: uuid
        ticket_status:
          type: string
        ticket_title:
          type: string
    PlanItemsResponse:
      type: object
      additionalProperties: false
      description: 'CURRENT envelope for GET /plans/{id}/items — `{ "items": [...] }`. On an empty/nil result `items` can serialize as JSON null, so it is typed as a nullable array.'
      required:
        - items
      properties:
        items:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/RemediationPlanItem"
    # ============================================================
    # Scenarios + overrides domain
    # ============================================================
    Scenario:
      type: object
      additionalProperties: false
      description: >
        A compliance what-if scenario (models.Scenario). `filters` is the saved
        ScenarioFilters object, left permissive here. `framework` is an optional
        joined object.
      required:
        - id
        - tenant_id
        - name
        - framework_id
        - framework_version
        - filters
        - created_by
        - updated_by
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        name:
          type: string
        framework_id:
          type: string
          format: uuid
        framework_version:
          type: string
        filters:
          type: object
          additionalProperties: true
        created_by:
          type: string
          format: uuid
        updated_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        framework:
          type: object
          additionalProperties: true
    Override:
      type: object
      additionalProperties: false
      description: >
        A compliance control override (models.Override). `scenario_id`,
        `severity_from`, and `severity_to` are required but nullable (global
        overrides and applicability-type overrides leave them null). `control`
        and `scenario` are optional joined objects.
      required:
        - id
        - tenant_id
        - scenario_id
        - control_id
        - override_type
        - severity_from
        - severity_to
        - rationale
        - framework_type
        - created_by
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        scenario_id:
          type: [string, "null"]
          format: uuid
        control_id:
          type: string
          format: uuid
        override_type:
          type: string
        severity_from:
          type: [string, "null"]
        severity_to:
          type: [string, "null"]
        rationale:
          type: string
        framework_type:
          type: string
          description: '"platform" or "tenant".'
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        control:
          type: object
          additionalProperties: true
        scenario:
          type: object
          additionalProperties: true
    ScenarioListResponse:
      type: object
      additionalProperties: false
      description: 'CURRENT envelope for GET /scenarios — `{ "scenarios": [...] }`. On an empty/nil result `scenarios` can serialize as JSON null, so it is typed as a nullable array.'
      required:
        - scenarios
      properties:
        scenarios:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/Scenario"
    ScenarioResponse:
      type: object
      additionalProperties: false
      description: 'CURRENT envelope for GET /scenarios/{id} — `{ "scenario": {...} }`.'
      required:
        - scenario
      properties:
        scenario:
          $ref: "#/components/schemas/Scenario"
    OverrideListResponse:
      type: object
      additionalProperties: false
      description: 'CURRENT envelope for GET /overrides — `{ "overrides": [...] }`. On an empty/nil result `overrides` can serialize as JSON null, so it is typed as a nullable array.'
      required:
        - overrides
      properties:
        overrides:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/Override"
    # ============================================================
    # Findings domain
    # ============================================================
    ComplianceFinding:
      type: object
      additionalProperties: false
      description: >
        A compliance finding (models.ComplianceFinding). The listed required
        fields are always present; `evidence` is required but nullable (the
        backing map serializes as null when empty). Every other field is
        `omitempty` and appears only when set. `control` and `asset` are
        optional joined objects, left unpinned in this slice.
      required:
        - id
        - tenant_id
        - control_id
        - asset_id
        - asset_type
        - severity
        - summary
        - evidence
        - first_seen
        - last_seen
        - detection_state
        - workflow_status
        - occurrence_count
        - is_stale
        - evaluation_version
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        control_id:
          type: string
          format: uuid
        asset_id:
          type: string
          format: uuid
        asset_type:
          type: string
        severity:
          type: string
        summary:
          type: string
        evidence:
          type: [object, "null"]
          additionalProperties: true
        first_seen:
          type: string
          format: date-time
        last_seen:
          type: string
          format: date-time
        assigned_to:
          type: string
          format: uuid
        assigned_at:
          type: string
          format: date-time
        assigned_by:
          type: string
          format: uuid
        remediation_notes:
          type: string
        detection_state:
          type: string
        workflow_status:
          type: string
        occurrence_count:
          type: integer
        resurfaced_at:
          type: string
          format: date-time
        suppressed_until:
          type: string
          format: date-time
        suppression_reason:
          type: string
        is_stale:
          type: boolean
        last_evaluated_at:
          type: string
          format: date-time
        evaluation_version:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        ticket_count:
          type: integer
        control:
          type: object
          additionalProperties: true
        asset:
          type: object
          additionalProperties: true
    ComplianceFindingHistory:
      type: object
      additionalProperties: false
      description: A single change-history entry for a finding (models.ComplianceFindingHistory).
      required:
        - id
        - finding_id
        - changed_at
        - field_name
      properties:
        id:
          type: string
          format: uuid
        finding_id:
          type: string
          format: uuid
        changed_by:
          type: string
          format: uuid
        changed_at:
          type: string
          format: date-time
        field_name:
          type: string
        old_value:
          type: string
        new_value:
          type: string
        change_reason:
          type: string
    SeverityCounts:
      type: object
      additionalProperties: false
      description: Per-severity finding tally within a control group (services.SeverityCounts).
      required: [critical, high, med, low]
      properties:
        critical: { type: integer }
        high: { type: integer }
        med: { type: integer }
        low: { type: integer }
    FindingsByControlGroup:
      type: object
      additionalProperties: false
      description: Active findings aggregated for one framework control (services.FindingsByControlGroup).
      required:
        - control_id
        - control_name
        - framework_id
        - framework_name
        - worst_severity
        - finding_count
        - affected_assets
        - severity_counts
      properties:
        control_id: { type: string, format: uuid }
        control_name: { type: string }
        framework_id: { type: string, format: uuid }
        framework_name: { type: string }
        worst_severity:
          type: string
          enum: [Critical, High, Med, Low]
          description: Worst severity present in the group.
        finding_count: { type: integer }
        affected_assets: { type: integer, description: COUNT(DISTINCT asset_id) in the group. }
        severity_counts:
          $ref: "#/components/schemas/SeverityCounts"
    FindingsByControlResponse:
      type: object
      additionalProperties: false
      description: 'Envelope for GET /findings/by-control — `{ "groups": [...] }`, ranked.'
      required: [groups]
      properties:
        groups:
          type: array
          items:
            $ref: "#/components/schemas/FindingsByControlGroup"
    FindingStatistics:
      type: object
      additionalProperties: false
      description: 'Aggregate finding counts (services.FindingStatistics). Returned bare by GET /findings/statistics.'
      required:
        - total_findings
        - active_findings
        - inactive_findings
        - archived_findings
        - new_findings
        - notified_findings
        - resolved_findings
        - suppressed_findings
        - resurfaced_findings
      properties:
        total_findings:
          type: integer
        active_findings:
          type: integer
        inactive_findings:
          type: integer
        archived_findings:
          type: integer
        new_findings:
          type: integer
        notified_findings:
          type: integer
        resolved_findings:
          type: integer
        suppressed_findings:
          type: integer
        resurfaced_findings:
          type: integer
    FindingListResponse:
      type: object
      additionalProperties: false
      description: 'CURRENT list envelope for GET /findings — `{ "findings": [...], "total": N, "page": P, "page_size": S }`. `total` is the unpaginated count. On an empty/nil result `findings` can serialize as JSON null, so it is typed as a nullable array. Each finding carries the joined `asset` object when the owning asset exists and is not deleted.'
      required:
        - findings
        - total
        - page
        - page_size
      properties:
        findings:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/ComplianceFinding"
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
    FindingsByAssetResponse:
      type: object
      additionalProperties: false
      description: 'CURRENT envelope for GET /assets/{assetId}/findings — `{ "findings": [...] }`. On an empty/nil result `findings` can serialize as JSON null, so it is typed as a nullable array.'
      required:
        - findings
      properties:
        findings:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/ComplianceFinding"
    FindingHistoryResponse:
      type: object
      additionalProperties: false
      description: 'CURRENT envelope for GET /findings/{id}/history — `{ "history": [...] }`. On an empty/nil result `history` can serialize as JSON null, so it is typed as a nullable array.'
      required:
        - history
      properties:
        history:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/ComplianceFindingHistory"
    # ============================================================
    # Framework domain (current shapes — what the service returns today)
    # ============================================================
    PublishedFramework:
      type: object
      additionalProperties: false
      description: A platform framework whose status is `published` (tenant-visible).
      required:
        - id
        - code
        - name
        - version
        - description
        - organization
        - status
        - is_platform_default
        - created_by
        - created_at
        - updated_at
        - controls_count
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        version:
          type: string
        description:
          type: string
        organization:
          type: string
        status:
          type: string
          enum: [draft, published, archived]
        is_platform_default:
          type: boolean
        published_at:
          type: [string, "null"]
          format: date-time
        published_by:
          type: [string, "null"]
          format: uuid
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        controls_count:
          type: integer
        controls:
          description: >
            The framework's controls (each with its measurements). Returned for
            published frameworks to all tenants regardless of license; absent
            only on list endpoints that don't load control detail.
          type: array
          items:
            $ref: "#/components/schemas/PublishedFrameworkControl"
        is_licensed:
          type: boolean
          description: Set when the handler resolves the with-license variant (tenant context present).

    PublishedFrameworkControl:
      type: object
      additionalProperties: false
      required:
        - id
        - framework_id
        - control_id
        - title
        - description
        - baseline_severity
        - crypto_relevant
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        framework_id:
          type: string
          format: uuid
        family_id:
          type: [string, "null"]
          format: uuid
        control_id:
          type: string
        title:
          type: string
        description:
          type: string
        baseline_severity:
          type: string
          enum: [Low, Med, High, Critical]
        crypto_relevant:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        family:
          $ref: "#/components/schemas/Family"
        measurements:
          type: array
          items:
            $ref: "#/components/schemas/ControlMeasurement"

    Family:
      type: object
      additionalProperties: true
      description: Control family grouping (shape is currently free-form; not pinned in this slice).

    ControlMeasurement:
      type: object
      additionalProperties: false
      description: A measurement rule mapped to a control. Predicate shape varies by rule_type.
      required: [id, control_id, framework_type, measurement_type_id, rule_type, predicate, weight, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        control_id:
          type: string
          format: uuid
        framework_type:
          type: string
        measurement_type_id:
          type: string
          format: uuid
        rule_type:
          type: string
          enum: [threshold, presence, pattern, range]
        predicate:
          type: object
          additionalProperties: true
        severity_override:
          type: string
        weight:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        measurement_type:
          $ref: "#/components/schemas/MeasurementType"

    # ============================================================
    # Tenant frameworks (custom policies)
    # ============================================================
    TenantFramework:
      type: object
      additionalProperties: false
      description: A tenant-authored compliance framework (models.TenantFramework).
      required:
        - id
        - tenant_id
        - name
        - version
        - description
        - created_by
        - created_at
        - updated_at
        - controls_count
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        name:
          type: string
        version:
          type: string
        description:
          type: string
        source_framework_id:
          type: string
          format: uuid
          description: Set only when copied from a platform framework; omitted otherwise.
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        controls_count:
          type: integer
        controls:
          description: Joined controls; omitted unless populated.
          type: array
          items:
            $ref: "#/components/schemas/TenantFrameworkControl"

    TenantFrameworkControl:
      type: object
      additionalProperties: false
      description: A control within a tenant framework (models.TenantFrameworkControl).
      required:
        - id
        - framework_id
        - control_id
        - title
        - description
        - baseline_severity
        - crypto_relevant
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        framework_id:
          type: string
          format: uuid
        family_id:
          type: [string, "null"]
          format: uuid
        control_id:
          type: string
        title:
          type: string
        description:
          type: string
        baseline_severity:
          type: string
          enum: [Low, Med, High, Critical]
        crypto_relevant:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        family:
          $ref: "#/components/schemas/Family"
        measurements:
          type: array
          items:
            $ref: "#/components/schemas/TenantControlMeasurement"

    TenantControlMeasurement:
      type: object
      additionalProperties: false
      description: >
        A control→measurement-type rule mapping (models.ControlMeasurement) as
        returned by the tenant custom-policies endpoints.
      required:
        - id
        - control_id
        - framework_type
        - measurement_type_id
        - rule_type
        - predicate
        - weight
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        control_id:
          type: string
          format: uuid
        framework_type:
          type: string
          enum: [platform, tenant]
        measurement_type_id:
          type: string
          format: uuid
        rule_type:
          type: string
          enum: [threshold, presence, pattern, range]
        predicate:
          type: object
          additionalProperties: true
          description: Rule-logic JSON.
        severity_override:
          type: string
          enum: [Low, Med, High, Critical]
          description: Optional per-mapping severity override; omitted when unset.
        weight:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        measurement_type:
          type: object
          additionalProperties: true
          description: Optional joined measurement-type detail; omitted unless populated.

    TenantFrameworkInput:
      type: object
      additionalProperties: false
      description: Request body for create/update of a tenant framework.
      required: [name, version]
      properties:
        name:
          type: string
        version:
          type: string
        description:
          type: string

    TenantFrameworkControlInput:
      type: object
      additionalProperties: false
      description: Request body for create/update of a tenant-framework control.
      required: [control_id, title, baseline_severity]
      properties:
        family_id:
          type: [string, "null"]
          format: uuid
        control_id:
          type: string
        title:
          type: string
        description:
          type: string
        baseline_severity:
          type: string
          enum: [Low, Med, High, Critical]
        crypto_relevant:
          type: boolean

    ControlMeasurementInput:
      type: object
      additionalProperties: false
      description: Request body for create/update of a control-measurement mapping.
      required: [measurement_type_id, rule_type, predicate]
      properties:
        measurement_type_id:
          type: string
          format: uuid
        rule_type:
          type: string
          enum: [threshold, presence, pattern, range]
        predicate:
          type: object
          additionalProperties: true
        severity_override:
          type: string
          enum: [Low, Med, High, Critical]
        weight:
          type: integer
          minimum: 1
          maximum: 10

    TenantFrameworkListResponse:
      type: object
      additionalProperties: false
      description: 'Envelope for GET /frameworks/tenant — `{ "frameworks": [...] }`.'
      required: [frameworks]
      properties:
        frameworks:
          type: array
          items:
            $ref: "#/components/schemas/TenantFramework"

    TenantFrameworkResponse:
      type: object
      additionalProperties: false
      description: >
        Envelope for GET/POST/PUT of a single tenant framework. `framework` is
        always present; create/update also include a `message`.
      required: [framework]
      properties:
        message:
          type: string
        framework:
          $ref: "#/components/schemas/TenantFramework"

    TenantFrameworkControlResponse:
      type: object
      additionalProperties: false
      description: >
        Envelope for control create/update — `control` is always present;
        responses also include a `message`.
      required: [control]
      properties:
        message:
          type: string
        control:
          $ref: "#/components/schemas/TenantFrameworkControl"

    TenantControlMeasurementResponse:
      type: object
      additionalProperties: false
      description: >
        Envelope for measurement create/update — `measurement` is always present;
        responses also include a `message`.
      required: [measurement]
      properties:
        message:
          type: string
        measurement:
          $ref: "#/components/schemas/TenantControlMeasurement"

    # ============================================================
    # Framework evaluation (score / status / context / multi-evaluate)
    # ============================================================
    FrameworkScoreDetail:
      type: object
      additionalProperties: false
      required: [id, name, code, version, score, type]
      properties:
        id:
          type: string
        name:
          type: string
        code:
          type: string
        version:
          type: string
        score:
          type: integer
        type:
          type: string
          enum: [platform, tenant]
    ComplianceScoreResponse:
      type: object
      additionalProperties: false
      description: Aggregate compliance score (services.ComplianceScoreResponse), returned bare by GET /compliance/score.
      required: [score, framework_count, frameworks]
      properties:
        score:
          type: number
        framework_count:
          type: integer
        frameworks:
          type: array
          items:
            $ref: "#/components/schemas/FrameworkScoreDetail"

    FrameworkStatusDetail:
      type: object
      additionalProperties: false
      required: [id, name, code, version, compliance_percent, type, is_selected]
      properties:
        id:
          type: string
        name:
          type: string
        code:
          type: string
        version:
          type: string
        compliance_percent:
          type: integer
        type:
          type: string
          enum: [platform, tenant]
        is_selected:
          type: boolean
    FrameworkStatusResponse:
      type: object
      additionalProperties: false
      description: Per-framework compliance status (services.FrameworkStatusResponse), returned bare by GET /frameworks/status.
      required: [frameworks, overall_score]
      properties:
        frameworks:
          type: array
          items:
            $ref: "#/components/schemas/FrameworkStatusDetail"
        overall_score:
          type: number
        selected_framework:
          description: The selected framework's status; omitted when none is selected.
          $ref: "#/components/schemas/FrameworkStatusDetail"

    FrameworkStatusItem:
      type: object
      additionalProperties: false
      required: [id, name, code, version, compliance_percent, controls_total, controls_passing, controls_failing, is_default]
      properties:
        id:
          type: string
        name:
          type: string
        code:
          type: string
        version:
          type: string
        compliance_percent:
          type: integer
        controls_total:
          type: integer
        controls_passing:
          type: integer
        controls_failing:
          type: integer
        is_default:
          type: boolean
    FrameworkContextStatus:
      type: object
      additionalProperties: false
      required: [frameworks, overall_score]
      properties:
        frameworks:
          type: array
          items:
            $ref: "#/components/schemas/FrameworkStatusItem"
        overall_score:
          type: number
    FrameworkSubscriptionInfo:
      type: object
      additionalProperties: false
      required: [tier, framework_limit, frameworks_used, can_add_more]
      properties:
        tier:
          type: string
        framework_limit:
          type: integer
        frameworks_used:
          type: integer
        can_add_more:
          type: boolean
    FrameworkContextResponse:
      type: object
      additionalProperties: false
      description: >
        Consolidated framework data for a tenant in one call
        (services.FrameworkContextResponse), returned bare by GET
        /frameworks/context. `default_framework_id`, `status`, and `subscription`
        are present but nullable (non-omitempty pointers).
      required: [licensed, default_framework_id, status, subscription, last_updated]
      properties:
        licensed:
          type: array
          items:
            $ref: "#/components/schemas/LicensedFramework"
        default_framework_id:
          type: [string, "null"]
        status:
          anyOf:
            - $ref: "#/components/schemas/FrameworkContextStatus"
            - type: "null"
        subscription:
          anyOf:
            - $ref: "#/components/schemas/FrameworkSubscriptionInfo"
            - type: "null"
        user_preference:
          type: string
          description: The user's framework preference; omitted when unset.
        last_updated:
          type: string

    MultiFrameworkEvaluationResult:
      type: object
      additionalProperties: false
      description: Evaluation result for one framework (services.MultiFrameworkEvaluationResult).
      required: [framework_id, framework_name, framework_version, framework_type, score, summary, affected_entities, controls, last_evaluated]
      properties:
        framework_id:
          type: string
        framework_name:
          type: string
        framework_code:
          type: string
          description: Omitted when empty.
        framework_version:
          type: string
        framework_type:
          type: string
          enum: [platform, tenant]
        score:
          type: integer
        summary:
          description: Per-framework summary; the deep summary tree is not pinned in this slice.
          type: ["object", "null"]
          additionalProperties: true
        affected_entities:
          type: object
          description: entity_type -> list of entity IDs.
          additionalProperties:
            type: array
            items:
              type: string
        controls:
          type: object
          additionalProperties: false
          required: [total, passing, failing]
          properties:
            total:
              type: integer
            passing:
              type: integer
            failing:
              type: integer
        last_evaluated:
          type: string
    EvaluateMultipleResponse:
      type: object
      additionalProperties: false
      description: 'Envelope for POST /evaluate/multiple — `{ "results": [...], "count": N }`.'
      required: [results, count]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/MultiFrameworkEvaluationResult"
        count:
          type: integer
    EvaluateMultipleRequest:
      type: object
      additionalProperties: true
      description: Request body for POST /evaluate/multiple.
      required: [framework_ids]
      properties:
        framework_ids:
          type: array
          items:
            type: string
        framework_versions:
          type: object
          additionalProperties:
            type: string
        filters:
          type: object
          additionalProperties: true
          description: Scenario filter set; shape not pinned in this slice.
        entity_type:
          type: string

    BatchFindingSummary:
      type: object
      additionalProperties: false
      required: [id, control_id, asset_id, severity, summary]
      properties:
        id:
          type: string
        control_id:
          type: string
        asset_id:
          type: string
        severity:
          type: string
        summary:
          type: string
    BatchControlStatus:
      type: object
      additionalProperties: false
      required: [id, name, status, severity, findings]
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
        severity:
          type: string
        findings:
          type: integer
    BatchEvaluateResult:
      type: object
      additionalProperties: false
      description: Batch evaluation result for one framework (services.BatchEvaluateResult).
      required: [framework_id, framework_name, framework_code, framework_version, score, controls_total, controls_passing, controls_failing, affected_assets]
      properties:
        framework_id:
          type: string
        framework_name:
          type: string
        framework_code:
          type: string
        framework_version:
          type: string
        score:
          type: integer
        controls_total:
          type: integer
        controls_passing:
          type: integer
        controls_failing:
          type: integer
        affected_assets:
          type: integer
        findings:
          type: array
          description: Omitted unless include_details=true.
          items:
            $ref: "#/components/schemas/BatchFindingSummary"
        control_breakdown:
          type: array
          description: Omitted unless include_details=true.
          items:
            $ref: "#/components/schemas/BatchControlStatus"
    BatchEvaluateResponse:
      type: object
      additionalProperties: false
      description: Response for POST /frameworks/batch-evaluate (services.BatchEvaluateResponse), returned bare.
      required: [results, last_updated]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/BatchEvaluateResult"
        last_updated:
          type: string
    BatchEvaluateRequest:
      type: object
      additionalProperties: true
      description: Request body for POST /frameworks/batch-evaluate.
      required: [framework_ids]
      properties:
        framework_ids:
          type: array
          items:
            type: string
        filters:
          type: object
          additionalProperties: true
          description: Scenario filter set; shape not pinned in this slice.

    LicensedFramework:
      type: object
      additionalProperties: false
      description: A tenant_framework_licenses row, joined with its platform framework.
      required:
        - id
        - tenant_id
        - platform_framework_id
        - is_default
        - subscription_status
        - provisioned_by
        - purchased_at
        - created_at
        - updated_at
      properties:
        id:
          type: string
        tenant_id:
          type: string
        platform_framework_id:
          type: string
        is_default:
          type: boolean
        subscription_status:
          type: string
          enum: [active, expired, cancelled]
        subscription_started_at:
          type: string
          description: Optional. RFC3339 timestamp when the subscription started.
        subscription_expires_at:
          type: string
          description: Optional. RFC3339 timestamp when the subscription expires (absent means perpetual).
        provisioned_by:
          type: string
          enum: [admin, self_service, auto]
        purchased_at:
          type: string
        purchase_price_cents:
          type: integer
        created_at:
          type: string
        updated_at:
          type: string
        platform_framework:
          $ref: "#/components/schemas/PublishedFramework"

    # ---- Platform-admin framework authoring (admin/* endpoints) ----
    PlatformFrameworkInput:
      type: object
      additionalProperties: false
      description: Create/update body for a platform framework.
      required: [code, name, version]
      properties:
        code:
          type: string
        name:
          type: string
        version:
          type: string
        description:
          type: string
        organization:
          type: string
        is_platform_default:
          type: boolean

    PublishFrameworkInput:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [published, archived]

    AdminFrameworkResponse:
      type: object
      additionalProperties: false
      description: Single-framework mutation/get envelope for the admin endpoints.
      required: [framework]
      properties:
        message:
          type: string
        framework:
          $ref: "#/components/schemas/PublishedFramework"

    AdminFrameworkListResponse:
      type: object
      additionalProperties: false
      required: [frameworks]
      properties:
        frameworks:
          type: array
          items:
            $ref: "#/components/schemas/PublishedFramework"

    PlatformFrameworkControlInput:
      type: object
      additionalProperties: false
      description: Create/update body for a platform framework control.
      required: [control_id, title, baseline_severity]
      properties:
        family_id:
          type: [string, "null"]
          format: uuid
        control_id:
          type: string
          description: Human control identifier, e.g. "PCI 3.6".
        title:
          type: string
        description:
          type: string
        baseline_severity:
          type: string
          enum: [Low, Med, High, Critical]
        crypto_relevant:
          type: boolean

    AdminControlResponse:
      type: object
      additionalProperties: false
      description: Single-control mutation envelope for the admin control endpoints.
      required: [control]
      properties:
        message:
          type: string
        control:
          $ref: "#/components/schemas/PublishedFrameworkControl"

    MeasurementType:
      type: object
      additionalProperties: false
      description: A measurement a control rule can target (the rule-builder catalog).
      required: [id, code, name, data_type, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        description:
          type: string
        data_type:
          type: string
          enum: [integer, string, enum, date, boolean]
        extraction_query:
          type: string
        units:
          type: string
        valid_range:
          type: object
          additionalProperties: true
        allowed_rule_types:
          type: array
          items:
            type: string
        enum_values:
          type: array
          items: {}
        valid_operators:
          type: array
          items:
            type: string
        predicate_schema:
          type: object
          additionalProperties: true
        category:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AdminMeasurementResponse:
      type: object
      additionalProperties: false
      required: [measurement]
      properties:
        message:
          type: string
        measurement:
          $ref: "#/components/schemas/ControlMeasurement"

    MeasurementListResponse:
      type: object
      additionalProperties: false
      required: [measurements]
      properties:
        measurements:
          type: array
          items:
            $ref: "#/components/schemas/ControlMeasurement"

    MeasurementTypeListResponse:
      type: object
      additionalProperties: false
      required: [measurement_types]
      properties:
        measurement_types:
          type: array
          items:
            $ref: "#/components/schemas/MeasurementType"

    AvailableFramework:
      type: object
      additionalProperties: false
      required: [platform_framework, is_licensed, is_platform_default]
      properties:
        platform_framework:
          $ref: "#/components/schemas/PublishedFramework"
        is_licensed:
          type: boolean
        is_platform_default:
          type: boolean
        preview_score:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
          description: >
            Materialized compliance score (0–100) for this framework against the
            tenant's current inventory (ADR-0014 evaluation engine). Present for
            every published framework — activated or not — so a card can show a
            preview before the tenant activates. Absent/null until the engine has
            produced a rollup for this tenant+framework.
        controls_passing:
          type: integer
          nullable: true
          description: Passing control count behind preview_score (null until scored).
        controls_failing:
          type: integer
          nullable: true
          description: Failing control count behind preview_score (null until scored).

    DefaultFrameworkDescriptor:
      type: object
      additionalProperties: false
      required: [framework_id, framework_type]
      properties:
        framework_id:
          type: string
          format: uuid
        framework_type:
          type: string
          enum: [licensed, platform_default]
        framework:
