        "400":
          $ref: "#/components/responses/LegacyBadRequest"
        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
        "500":
          $ref: "#/components/responses/LegacyServerError"
      x-quirks:
        - "Missing-or-nil tenant context returns 400 (not 401) with `{\"error\":\"Tenant ID is required\"}`. The 401 path only fires when the context key itself is absent."

  # ============================================================
  # Platform-admin framework authoring (/api/v1/compliance-engine/admin/*).
