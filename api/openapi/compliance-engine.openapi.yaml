            application/json:
              schema:
                $ref: "#/components/schemas/AlertListResponse"
        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
        "500":
          $ref: "#/components/responses/LegacyServerError"

  /admin/frameworks:
    get:
      operationId: adminListFrameworks
      tags: [admin-frameworks]
      summary: List all platform frameworks (platform admin)
      description: >
        Lists every platform framework — draft, published, and archived — with
        controls loaded. Platform-admin only. Optional `status` filter.
