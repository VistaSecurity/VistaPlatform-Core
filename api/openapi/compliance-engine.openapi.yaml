          additionalProperties: true
    UpdateScenarioRequest:
      type: object
      additionalProperties: true
      description: Body for PUT /scenarios/{id}.
      required: [name]
      properties:
        name:
          type: string
        filters:
          type: object
          additionalProperties: true
    CreateOverrideRequest:
      type: object
      additionalProperties: true
      description: Body for POST /overrides.
      required: [control_id, override_type, rationale]
      properties:
        scenario_id:
          type: string
          format: uuid
        control_id:
          type: string
          format: uuid
        override_type:
          type: string
        severity_from:
          type: string
        severity_to:
