        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
        "404":
          $ref: "#/components/responses/LegacyNotFound"
        "500":
          $ref: "#/components/responses/LegacyServerError"

  /admin/frameworks/{id}/publish:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: adminPublishFramework
      tags: [admin-frameworks]
      summary: Publish or archive a platform framework
      description: >
        Sets the framework's lifecycle status. `published` makes it
        tenant-visible and activatable (and triggers the ADR-0014 reconcile
        fan-out); `archived` retires it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishFrameworkInput"
