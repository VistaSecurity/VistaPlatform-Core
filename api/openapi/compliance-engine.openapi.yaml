        message:
          type: string
        override:
          $ref: "#/components/schemas/Override"
    PlanMutationResponse:
      type: object
      additionalProperties: false
      description: 'Envelope for plan create/update — `{ "message": "...", "plan": {...} }`.'
      required: [message, plan]
