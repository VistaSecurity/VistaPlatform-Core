  /frameworks/subscribe:
    post:
      operationId: subscribeFramework
      tags: [frameworks]
      summary: Self-service subscribe to a platform framework
      description: >
        Creates an active tenant_framework_licenses row for the current tenant.
        `provisioned_by` is forced to `self_service` and `expires_at` to null —
        the request body's `framework_id` and `set_as_default` are the only
