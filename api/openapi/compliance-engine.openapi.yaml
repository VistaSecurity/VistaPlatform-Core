    CreatePlanRequest:
      type: object
      additionalProperties: true
      description: Body for POST /plans.
      required: [title]
      properties:
        title:
          type: string
        description:
          type: string
        plan_type:
          type: string
        priority:
          type: string
    UpdatePlanRequest:
      type: object
      additionalProperties: true
      description: Body for PUT /plans/{id} (fields optional).
    AddPlanItemRequest:
      type: object
      additionalProperties: true
      description: Body for POST /plans/{id}/items.
      required: [finding_id]
      properties:
        finding_id:
          type: string
          format: uuid
        notes:
          type: string
    AddPlanItemsBulkRequest:
      type: object
      additionalProperties: true
      description: Body for POST /plans/{id}/items/bulk.
      required: [finding_ids]
      properties:
        finding_ids:
          type: array
          items:
            type: string
            format: uuid
    LinkTicketRequest:
      type: object
      additionalProperties: true
      description: Body for PUT /plans/{id}/items/{itemId}/ticket (models.LinkTicketInput).
    EvidenceIdResponse:
      type: object
      additionalProperties: false
      description: 'Envelope for GET /findings/{id}/evidence-id.'
      required: [evidence_id, evidence_ref, copyable]
      properties:
        evidence_id:
          type: string
        evidence_ref:
          type: string
        copyable:
          type: boolean
    FindingResponse:
      type: object
      additionalProperties: false
      description: 'Envelope for PUT /findings/{id}/workflow-status — `{ "finding": {...} }`.'
      required: [finding]
      properties:
        finding:
          $ref: "#/components/schemas/ComplianceFinding"
    AssignFindingRequest:
      type: object
      additionalProperties: true
      description: Body for POST /findings/{id}/assign.
      required: [assigned_to]
      properties:
        assigned_to:
          type: string
          format: uuid
        notes:
          type: string
    UpdateWorkflowStatusRequest:
      type: object
      additionalProperties: true
      description: Body for PUT /findings/{id}/workflow-status.
      required: [workflow_status]
      properties:
        workflow_status:
          type: string
        suppression_reason:
          type: string
        suppressed_until:
          type: string
          format: date-time

    # ============================================================
    # Tickets domain (current shapes — what the service returns today)
    # ============================================================
    # ============================================================
    # Stateful alerts domain
    # ============================================================
    Alert:
      type: object
      additionalProperties: false
      description: >
        A stateful alert (models.Alert) — a condition demanding attention with a
        severity and a lifecycle (active → acknowledged → snoozed → resolved).
        One open alert exists per (tenant, alert_type, subject); repeated raises
        escalate it. The optional fields are omitted (not null) when unset,
        because the Go model tags them `omitempty`.
      required:
        - id
        - tenant_id
        - alert_type
        - source
        - severity
        - status
        - title
        - first_raised_at
        - last_event_at
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        alert_type:
          type: string
          description: e.g. service_down, tenant_health_degraded, certificate_expiring, sensor_offline.
        source:
          type: string
          description: Which detector/subsystem raised the alert.
        subject_type:
          type: string
          description: The kind of subject the alert is about (e.g. sensor, service, certificate).
        subject_id:
          type: string
          format: uuid
        subject_label:
          type: string
          description: Human-readable label for the subject (shown in the UI).
        severity:
          type: string
          description: critical / high / medium / low. Not pinned as an enum — legacy rows may carry other strings.
        status:
          type: string
          description: active / acknowledged / snoozed / resolved. Not pinned as an enum for the same reason.
        title:
          type: string
        message:
          type: string
        metadata:
          type: object
          additionalProperties: true
          description: Free-form detector context (JSONB).
        acknowledged_by:
          type: string
          format: uuid
        acknowledged_at:
          type: string
          format: date-time
        snoozed_by:
          type: string
          format: uuid
        snoozed_until:
          type: string
          format: date-time
        snooze_reason:
          type: string
        resolved_at:
          type: string
          format: date-time
        resolved_by:
          type: string
          format: uuid
        resolution:
          type: string
          description: How the alert resolved (e.g. auto, manual).
        resolution_note:
          type: string
        resolution_observation:
          type: object
          additionalProperties: true
          description: Free-form observation captured at resolution (JSONB).
        ticket_id:
          type: string
          format: uuid
          description: Set when a ticket has been created from this alert.
        first_raised_at:
          type: string
          format: date-time
        last_event_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AlertEvent:
      type: object
      additionalProperties: false
      description: >
        One append-only entry in an alert's evidence chain (models.AlertEvent).
        Rows are never updated or deleted — that is what makes the chain audit
        evidence rather than workflow state.
      required:
        - id
        - alert_id
        - tenant_id
        - event_type
        - actor_type
        - created_at
      properties:
        id:
          type: string
          format: uuid
        alert_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        event_type:
          type: string
        actor_type:
          type: string
          description: system / user.
        actor_id:
          type: string
          format: uuid
        details:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time

    AlertStats:
      type: object
      additionalProperties: false
      description: >
        Alert summary counts for the Alerts page cards (models.AlertStats). The
        GET /alerts/stats body is this object directly, not wrapped.
      required: [active, acknowledged, snoozed, resolved, critical, high]
      properties:
        active:
          type: integer
        acknowledged:
          type: integer
        snoozed:
          type: integer
        resolved:
          type: integer
        critical:
          type: integer
        high:
          type: integer

    AlertListResponse:
      type: object
      additionalProperties: false
      description: 'Envelope for GET /alerts and GET /admin/alerts — `{ "alerts": [...] }`.'
      required: [alerts]
      properties:
        alerts:
          type: array
          items:
            $ref: "#/components/schemas/Alert"

    AlertDetailResponse:
      type: object
      additionalProperties: false
      description: Envelope for GET /alerts/{id} — the alert plus its evidence chain.
      required: [alert, events]
      properties:
        alert:
          $ref: "#/components/schemas/Alert"
        events:
          type: array
          items:
            $ref: "#/components/schemas/AlertEvent"

    AlertMutationResponse:
      type: object
      additionalProperties: false
      description: 'Envelope for the lifecycle mutations (acknowledge/snooze/unsnooze/resolve) — `{ "alert": {...} }`.'
      required: [alert]
      properties:
        alert:
          $ref: "#/components/schemas/Alert"

    AlertTicketResponse:
      type: object
      additionalProperties: false
      description: Envelope for POST /alerts/{id}/ticket (201) — the ticket created from the alert.
      required: [ticket]
      properties:
        ticket:
          $ref: "#/components/schemas/Ticket"

    SnoozeAlertRequest:
      type: object
      additionalProperties: false
      description: Body for POST /alerts/{id}/snooze.
      required: [until]
      properties:
        until:
          type: string
          format: date-time
          description: RFC3339 timestamp to snooze the alert until. Required.
        reason:
          type: string

    ResolveAlertRequest:
      type: object
      additionalProperties: false
      description: Body for POST /alerts/{id}/resolve. Optional — an empty body resolves with no note.
      properties:
        note:
          type: string

    AlertCatalogRung:
      type: object
      additionalProperties: false
      description: >
        One trigger point on an escalating alert ladder (alertcatalog.Rung).
        For the certificate-expiry ladder, `days` is "days remaining at which
        this rung is crossed".
      required: [days, severity, source]
      properties:
        days:
          type: integer
        severity:
          type: string
          description: critical / high / medium / low.
        source:
          type: string
          description: >
            Where the rung came from: `baseline` (product default),
            `preference` (the tenant's replacement of the baseline), or
            `policy:<framework name>` (projected from an activated compliance
            policy's threshold measurement).

    AlertCatalogPreferenceRung:
      type: object
      description: >
        The tenant's replacement for a ladder type's baseline rung
        (alertcatalog map[string]int on the wire — only the `days` key is
        read; unrecognized keys are ignored, not rejected).
      properties:
        days:
          type: integer
          minimum: 1
          maximum: 3650
          description: A PUT with days outside 1..3650 is rejected with 400.
      additionalProperties:
        type: integer

    AlertCatalogEntry:
      type: object
      additionalProperties: false
      description: >
        One row of the tenant alert catalog (services.CatalogEntry) — a
        registry entry (alertcatalog.Entry) overlaid with the tenant's
        enable/preference state and, for ladder types, the effective rung
        ladder (baseline/preference + policy rungs projected from the
        tenant's activated compliance frameworks). Fields tagged `omitempty`
        on the Go struct are omitted (not null) when unset.
      required:
        - id
        - track
        - kind
        - status
        - source
        - subject_type
        - severity_model
        - enabled_by_default
        - description
        - enabled
      properties:
        id:
          type: string
          description: Registry alert-type id (e.g. certificate_expiring, sensor_offline).
        track:
          type: string
          description: >
            tenant / platform. GET /alert-catalog only ever returns entries
            whose track is `tenant`.
        kind:
          type: string
          description: policy / operational.
        status:
          type: string
          description: live / planned.
        source:
          type: string
          description: Which service raises this alert type.
        subject_type:
          type: string
        severity_model:
          type: string
          description: ladder / fixed.
        default_severity:
          type: string
          description: Set for fixed-severity-model entries.
        baseline_days:
          type: integer
          description: Set for ladder-severity-model entries with a baseline rung.
        baseline_percent:
          type: integer
        baseline_severity:
          type: string
          description: Set for ladder-severity-model entries with a baseline rung.
        auto_resolve:
          type: string
          description: Free-form note on the condition that auto-resolves an open alert of this type, when one exists.
        enabled_by_default:
          type: boolean
        description:
          type: string
        enabled:
          type: boolean
          description: Effective tenant state — the registry default overlaid with the tenant's saved setting.
        preference_rung:
          $ref: "#/components/schemas/AlertCatalogPreferenceRung"
        ladder:
          type: array
          description: >
            Only present for ladder-severity-model entries with a positive
            baseline_days; the effective ladder after applying the tenant's
            preference rung and any policy rungs.
          items:
            $ref: "#/components/schemas/AlertCatalogRung"

    AlertCatalogListResponse:
      type: object
      additionalProperties: false
      description: 'Envelope for GET /alert-catalog — `{ "catalog": [...] }`. `catalog` is always an array, never null.'
      required: [catalog]
      properties:
        catalog:
          type: array
          items:
            $ref: "#/components/schemas/AlertCatalogEntry"

    UpdateAlertCatalogEntryRequest:
      type: object
      additionalProperties: false
      description: Body for PUT /alert-catalog/{type}.
      required: [enabled]
      properties:
        enabled:
          type: boolean
        preference_rung:
          description: Omit, or send null/`{}`, to clear the tenant's preference rung (the ladder falls back to the registry baseline).
          anyOf:
            - $ref: "#/components/schemas/AlertCatalogPreferenceRung"
            - type: "null"

    AlertCatalogUpdateResponse:
      type: object
      additionalProperties: false
      description: 'Envelope for a successful PUT /alert-catalog/{type} — `{ "status": "updated" }`. Does not echo the updated entry; refetch GET /alert-catalog for the new effective ladder.'
      required: [status]
      properties:
        status:
          type: string

    Ticket:
      type: object
      additionalProperties: false
      description: >
        A row in the unified `tickets` table. `category` partitions tickets
        into the six product surfaces (compliance, certificate, remediation,
        vulnerability, operational, general); the inventory-link UUID fields
        are populated when the ticket attaches to an asset / certificate /
        crypto config / finding / framework control.
      required:
        - id
        - tenant_id
        - category
        - title
        - status
        - priority
        - external_sync_status
        - source
        - created_by
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        category:
          type: string
          description: >
            Stored free-form on the row; the product surface uses six values
            (compliance, certificate, remediation, vulnerability, operational,
            general). Not pinned as an enum here because legacy rows may carry
            other strings.
        title:
          type: string
        description:
          type: [string, "null"]
        status:
          type: string
          description: open / in_progress / resolved / closed; not pinned as an enum because legacy values may exist.
        priority:
          type: string
          description: low / medium / high / critical; not pinned as an enum for the same reason.
        severity:
          type: [string, "null"]
        due_date:
          type: [string, "null"]
          format: date-time
        finding_id:
          type: [string, "null"]
          format: uuid
        control_id:
          type: [string, "null"]
          format: uuid
        asset_id:
          type: [string, "null"]
          format: uuid
        certificate_id:
          type: [string, "null"]
          format: uuid
        crypto_implementation_id:
          type: [string, "null"]
          format: uuid
        external_ticket_system:
          type: [string, "null"]
          description: e.g. jira / servicenow / github / pagerduty when the ticket is mirrored externally.
        external_ticket_id:
          type: [string, "null"]
        external_ticket_url:
          type: [string, "null"]
        external_sync_status:
          type: string
          description: Defaults to `none`; phase 2 will populate sync state.
        source:
          type: string
          description: How the ticket was created (defaults to `manual`).
        tags:
          type: [array, "null"]
          items:
            type: string
        assigned_to:
          type: [string, "null"]
          format: uuid
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        resolved_at:
          type: [string, "null"]
          format: date-time
        resolution_notes:
          type: [string, "null"]
        alert_id:
          description: 'Set when the ticket was created from an alert (#943) — links back to the alert whose evidence timeline seeded this ticket.'
          type: string
          format: uuid
        comment_count:
          type: integer
          description: Computed/joined; absent (omitempty) when zero.

    TicketComment:
      type: object
      additionalProperties: false
      required: [id, ticket_id, content, created_at]
      properties:
        id:
          type: string
          format: uuid
        ticket_id:
          type: string
          format: uuid
        author_id:
          description: 'Absent/null for system-authored comments (alert-event echoes, #943) — render as "System".'
          type: string
          format: uuid
        content:
          type: string
        created_at:
          type: string
          format: date-time

    TicketStats:
      type: object
      additionalProperties: false
      required: [by_status, by_category, overdue, total]
      properties:
        by_status:
          type: object
          additionalProperties:
            type: integer
        by_category:
          type: object
          additionalProperties:
            type: integer
        overdue:
          type: integer
        total:
          type: integer

    TicketTrendPoint:
      type: object
      additionalProperties: false
      required: [date, opened, resolved]
      properties:
        date:
          type: string
          description: ISO date (YYYY-MM-DD).
        opened:
          type: integer
        resolved:
          type: integer

    TicketProgress:
      type: object
      additionalProperties: false
      required: [period_days, summary, avg_resolution_hours, trend, by_category]
      properties:
        period_days:
          type: integer
        summary:
          type: object
          description: Status counts plus a synthetic `overdue` key.
          additionalProperties:
            type: integer
        avg_resolution_hours:
          type: number
          description: Mean resolution time within the period, in hours. 0 when no tickets resolved.
        trend:
          type: array
          items:
            $ref: "#/components/schemas/TicketTrendPoint"
        by_category:
          type: object
          description: category → (status → count) breakdown.
          additionalProperties:
            type: object
            additionalProperties:
              type: integer

    # ============================================================
    # Ticket request / response wrappers (current shapes)
    # ============================================================
    CreateTicketRequest:
      type: object
      additionalProperties: false
      description: >
        Payload for POST /tickets. Only `title` is required. Defaults are
        applied server-side: category=general, priority=medium, status=open,
        source=manual, external_sync_status=none.
      required: [title]
      properties:
        category:
          type: string
        title:
          type: string
        description:
          type: [string, "null"]
        priority:
          type: string
        severity:
          type: [string, "null"]
        due_date:
          type: [string, "null"]
          description: RFC3339 timestamp; malformed values fail at the service layer with a 500.
        finding_id:
          type: [string, "null"]
        control_id:
          type: [string, "null"]
        asset_id:
          type: [string, "null"]
        certificate_id:
          type: [string, "null"]
        crypto_implementation_id:
          type: [string, "null"]
        external_ticket_system:
          type: [string, "null"]
        external_ticket_id:
          type: [string, "null"]
        external_ticket_url:
          type: [string, "null"]
        source:
          type: [string, "null"]
        tags:
          type: [array, "null"]
          items:
            type: string
        assigned_to:
          type: [string, "null"]

    UpdateTicketRequest:
      type: object
      additionalProperties: false
      description: >
        Partial update of a ticket. Every field is optional and only present
        fields are applied. An empty-string `due_date` or `assigned_to`
        clears that column; a non-empty `due_date` must be RFC3339.
      properties:
        status:
          type: [string, "null"]
        priority:
          type: [string, "null"]
        severity:
          type: [string, "null"]
        category:
          type: [string, "null"]
        description:
          type: [string, "null"]
        due_date:
          type: [string, "null"]
        assigned_to:
          type: [string, "null"]
        resolution_notes:
          type: [string, "null"]
        tags:
          type: [array, "null"]
          items:
            type: string
        external_ticket_system:
          type: [string, "null"]
        external_ticket_id:
          type: [string, "null"]
        external_ticket_url:
          type: [string, "null"]
        external_sync_status:
          type: [string, "null"]

    AddTicketCommentRequest:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content:
          type: string

    TicketListResponse:
      type: object
      additionalProperties: false
      description: >
        CURRENT list envelope for GET /tickets. `total` is the unpaginated
        count; `page` and `page_size` echo the resolved values. Not yet the
        ADR-0002 `data` + `pagination` shape.
      required: [tickets, total, page, page_size]
      properties:
        tickets:
          type: array
          items:
            $ref: "#/components/schemas/Ticket"
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer

    TicketResponse:
      type: object
      additionalProperties: false
      description: CURRENT envelope for GET /tickets/{id}.
      required: [ticket]
      properties:
        ticket:
          $ref: "#/components/schemas/Ticket"

    TicketCreatedResponse:
      type: object
      additionalProperties: false
      description: CURRENT envelope for POST /tickets (201).
      required: [message, ticket]
      properties:
        message:
          type: string
        ticket:
          $ref: "#/components/schemas/Ticket"

    TicketUpdatedResponse:
      type: object
      additionalProperties: false
      description: CURRENT envelope for PUT /tickets/{id} (200).
      required: [message, ticket]
      properties:
        message:
          type: string
        ticket:
          $ref: "#/components/schemas/Ticket"

    TicketStatsResponse:
      type: object
      additionalProperties: false
      description: CURRENT envelope for GET /tickets/stats.
      required: [stats]
      properties:
        stats:
          $ref: "#/components/schemas/TicketStats"

    TicketProgressResponse:
      type: object
      additionalProperties: false
      description: CURRENT envelope for GET /tickets/progress.
      required: [progress]
      properties:
        progress:
          $ref: "#/components/schemas/TicketProgress"

    TicketCommentListResponse:
      type: object
      additionalProperties: false
      description: CURRENT envelope for GET /tickets/{id}/comments.
      required: [comments]
      properties:
        comments:
          type: array
          items:
            $ref: "#/components/schemas/TicketComment"

    TicketCommentCreatedResponse:
      type: object
      additionalProperties: false
      description: CURRENT envelope for POST /tickets/{id}/comments (201).
      required: [message, comment]
      properties:
        message:
          type: string
        comment:
          $ref: "#/components/schemas/TicketComment"

    SubscribeFrameworkRequest:
      type: object
      additionalProperties: true
      description: >
        Request body for POST /frameworks/subscribe. Maps to
        models.ProvisionFrameworkInput; the handler overrides `provisioned_by`
        and `expires_at` before persisting, so additional client-supplied keys
        are silently dropped (additionalProperties is left open to mirror the
        Go struct's binding-by-tag behavior).
      required: [framework_id]
      properties:
        framework_id:
          type: string
          format: uuid
        set_as_default:
          type: boolean

    SetDefaultFrameworkRequest:
      type: object
      additionalProperties: false
      required: [framework_id]
      properties:
        framework_id:
          type: string
          format: uuid

    LegacyError:
      type: object
      additionalProperties: false
      description: >
        CURRENT error shape returned by most compliance-engine endpoints: a
        single human-readable string under `error`. Unstructured — cannot be
        branched on safely. Superseded by the ADR-0002 `Error` envelope below
        as endpoints are hardened.
      required: [error]
      properties:
        error:
          type: string

    LegacyErrorWithDetails:
      type: object
      additionalProperties: false
      description: >
        Variant returned by `GET /frameworks/default` when the tenant row is
        missing. Carries an extra free-form `details` string alongside the
        canonical `error` key. Documented separately to keep
        additionalProperties:false honest.
      required: [error]
      properties:
        error:
          type: string
        details:
          type: string

    # ============================================================
    # ADR-0002 go-forward envelope (the documented standard).
    # NOT yet applied to the v1 framework paths above. New and hardened
    # endpoints conform to these. The generated client carries these types
    # ahead of the backend so the frontend-v2 surface can target them.
    # ============================================================
    Error:
      type: object
      additionalProperties: false
      description: ADR-0002 error envelope. Clients branch on `error.code`, never on `message`.
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable, machine-readable enum (e.g. framework_not_licensed).
            message:
              type: string
              description: Human-readable, safe to surface in UI.
            details:
              type: array
              items:
                $ref: "#/components/schemas/ErrorDetail"
            request_id:
              type: string
              description: For support correlation.

    ErrorDetail:
      type: object
      additionalProperties: false
      required: [field, issue]
      properties:
        field:
          type: string
        issue:
          type: string

    Pagination:
      type: object
      additionalProperties: false
      description: ADR-0002 pagination block for collection envelopes.
      required: [total, limit, offset]
      properties:
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        next_offset:
          type: [integer, "null"]
          description: Offset of the next page, or null when there are no more.
