      tags: [frameworks]
      summary: List published frameworks with license + platform-default flags
      description: >
        Returns every published platform framework tagged with `is_licensed`
        (does this tenant already subscribe?) and `is_platform_default`. Used
        by the framework selection UI to render subscribe/unsubscribe affordances.
      responses:
        "200":
          description: Published frameworks with per-tenant flags.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailableFrameworkListResponse"
        "400":
          $ref: "#/components/responses/LegacyBadRequest"
        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
        "500":
          $ref: "#/components/responses/LegacyServerError"
      x-quirks:
        - "Same nil-tenant 400 quirk as /frameworks/licenses."

  /frameworks/default:
    get:
      operationId: getDefaultFramework
      tags: [frameworks]
      summary: Get the tenant's default framework
      description: >
        Returns the tenant's default framework — their licensed default if one
        is set, otherwise the platform default. The wrapper key carries the
        result; `framework_type` distinguishes `licensed` vs `platform_default`.
      responses:
        "200":
          description: The default framework descriptor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DefaultFrameworkResponse"
        "400":
