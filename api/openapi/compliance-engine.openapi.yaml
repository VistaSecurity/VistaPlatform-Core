              schema:
                $ref: "#/components/schemas/AdminFrameworkListResponse"
        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
        "500":
          $ref: "#/components/responses/LegacyServerError"
    post:
      operationId: adminCreateFramework
      tags: [admin-frameworks]
      summary: Create a platform framework (draft)
      description: Creates a new platform framework in draft status. Platform-admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformFrameworkInput"
      responses:
        "201":
          description: Framework created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminFrameworkResponse"
        "400":
          $ref: "#/components/responses/LegacyBadRequest"
        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
        "500":
          $ref: "#/components/responses/LegacyServerError"

  /admin/frameworks/{id}:
    parameters:
      - in: path
