        "200":
          description: Framework status changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminFrameworkResponse"
        "400":
          $ref: "#/components/responses/LegacyBadRequest"
        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
        "500":
          $ref: "#/components/responses/LegacyServerError"

  /admin/tenants/{tenantId}/reevaluate:
    parameters:
      - in: path
        name: tenantId
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: adminReevaluateTenant
      tags: [admin-frameworks]
      summary: Re-evaluate a tenant's inventory against all frameworks
      description: >
        Platform-admin action (ADR-0015). Enqueues a bounded, asynchronous full
        re-evaluation of the tenant's inventory against every published framework's
        controls. Findings reconcile idempotently, so it is safe to re-run; it is an
        explicit, extraordinary action (suspected drift, an engine fix, a bulk
        import) — there is no scheduled re-evaluation. Returns 202 once enqueued.
      responses:
        "202":
          description: Re-evaluation enqueued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/LegacyBadRequest"
        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
        "500":
          $ref: "#/components/responses/LegacyServerError"

