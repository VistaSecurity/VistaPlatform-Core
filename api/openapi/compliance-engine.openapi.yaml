      required: [message]
      properties:
        message:
          type: string
    ScenarioMutationResponse:
      type: object
      additionalProperties: false
      description: 'Envelope for scenario create/update — `{ "message": "...", "scenario": {...} }`.'
      required: [message, scenario]
