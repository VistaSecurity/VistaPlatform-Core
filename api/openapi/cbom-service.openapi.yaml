openapi: 3.1.0
info:
  title: Vista Platform — cbom-service API
  version: "0.2.0"
  description: |
    Spec-first contract for cbom-service (ADR-0001). Covers the cbom-service
    product surface: **Scopes** (tenant-owned query-language boundaries),
    **CBOM Artifacts** (Phase 2 — immutable, dated, content-hashed snapshots
    of a scope), and **Comparison** (Phase 3 — diff two artifacts).

    ## Shape status (important)

    All paths below document the **current, pre-envelope shapes** the service
    returns today — single resources returned bare, collections wrapped under
    a domain key (`{ "scopes": [...] }`, `{ "artifacts": [...] }`), errors
    as `{ "error": "string" }`. They are specced as-is per ADR-0001 step 2
    ("seed the spec from the real shape"), and the Go contract tests assert
    the live handlers match.

    The **go-forward ADR-0002 envelope** (`Error`, `Pagination`, the `data`
    wrapper) is defined under `components.schemas` as the documented standard
    that NEW or HARDENED endpoints conform to. The current v1 paths do not
    yet use it; they are hardened to it when the frontend-v2 surface first
    consumes them (ADR-0001 step 5), at which point this file and the contract
    tests move together.
  contact:
    name: Vista Security
servers:
  - url: /api/v1/cbom-service
    description: cbom-service, mounted behind the API gateway.

tags:
  - name: scopes
    description: Scope CRUD (Phase 1).
  - name: cbom-artifacts
    description: CBOM artifact lifecycle (Phase 2 + Phase 4).
  - name: cbom-comparison
    description: Diff two CBOM artifacts (Phase 3).

paths:
  /scopes:
    get:
      operationId: listScopes
      tags: [scopes]
      summary: List scopes for the current tenant
      description: >
        Returns all non-deleted scopes for the tenant. Lazily seeds the three
        system defaults (All / Production / Non-Dev-Test) on the first call for
        a tenant.
      responses:
        "200":
          description: The tenant's scopes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScopeListResponse"
        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
        "500":
          $ref: "#/components/responses/LegacyServerError"
    post:
      operationId: createScope
      tags: [scopes]
      summary: Create a scope
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateScopeRequest"
      responses:
        "201":
          description: The created scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scope"
        "400":
          $ref: "#/components/responses/LegacyBadRequest"
        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
        "500":
          $ref: "#/components/responses/LegacyServerError"

  /scopes/{id}:
    parameters:
      - $ref: "#/components/parameters/ScopeId"
    get:
      operationId: getScope
      tags: [scopes]
      summary: Get a scope by id
      responses:
        "200":
          description: The scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scope"
        "400":
          $ref: "#/components/responses/LegacyBadRequest"
        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
        "404":
          $ref: "#/components/responses/LegacyNotFound"
        "500":
          $ref: "#/components/responses/LegacyServerError"
    put:
      operationId: updateScope
      tags: [scopes]
      summary: Update a scope
      description: >
        Overwrites name/description/query. Version is bumped (and an audit
        row written) only when name or query actually changed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateScopeRequest"
      responses:
        "200":
          description: The updated scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scope"
        "400":
          $ref: "#/components/responses/LegacyBadRequest"
        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
        "404":
          $ref: "#/components/responses/LegacyNotFound"
        "500":
          $ref: "#/components/responses/LegacyServerError"
    delete:
      operationId: deleteScope
      tags: [scopes]
      summary: Soft-delete a scope
      description: >
        Soft-deletes a non-system scope. System scopes (All / Production /
        Non-Dev-Test) cannot be deleted and return 409.
      responses:
        "204":
          description: Deleted. No body.
        "400":
          $ref: "#/components/responses/LegacyBadRequest"
        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
        "404":
          $ref: "#/components/responses/LegacyNotFound"
        "409":
          $ref: "#/components/responses/LegacyConflict"
        "500":
          $ref: "#/components/responses/LegacyServerError"

  /scopes/{id}/preview:
    parameters:
      - $ref: "#/components/parameters/ScopeId"
    post:
      operationId: previewScope
      tags: [scopes]
      summary: Preview the assets a scope matches
      description: >
        Echoes the scope's query in canonical form, with a not_implemented
        preview count. Running the same query on
        `GET /api/v1/inventory-service/assets?query=` returns the count today;
        resolving it here against inventory-service returns a
        matched asset count.
      responses:
        "200":
          description: The preview result (Phase 1 stub).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreviewResult"
        "400":
          $ref: "#/components/responses/LegacyBadRequest"
        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
        "404":
          $ref: "#/components/responses/LegacyNotFound"
        "500":
          $ref: "#/components/responses/LegacyServerError"

  # ============================================================
  # CBOM Artifact lifecycle (Phase 2 + Phase 4)
  # ============================================================
  /cbom/generate:
    post:
      operationId: generateCBOMArtifact
      tags: [cbom-artifacts]
      summary: Generate a new CBOM artifact from a scope
      description: |
        Snapshots inventory matching `scope_id` as of now and writes one
        immutable, hashed (and optionally HMAC-signed + compliance-attested)
        artifact row.

        Phase 2 generation is **synchronous-but-quick** despite the 202
        response code: by the time the call returns the artifact row is
        committed and `GET /cbom/artifacts/{id}` will return it. The 202 +
        `status: "ready"` shape is preserved so consumers don't need to
        change if generation moves to a queue in the future.
      x-quirks:
        - "The status code is **202 Accepted** but generation is currently synchronous. `GET /cbom/artifacts/{artifact_id}` is safe to call immediately after this returns."
        - "`include_attestation` and `sign` default to `true` only when the tenant has `cbom_signing`; Core/unentitled tenants generate unsigned, unattested CycloneDX artifacts unless they explicitly request paid evidence, which returns 402."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateCBOMRequest"
      responses:
        "202":
          description: Artifact generated. Body carries the new artifact's id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateCBOMResponse"
        "400":
          $ref: "#/components/responses/LegacyBadRequest"
        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
        "402":
          description: The request explicitly asked for CBOM signing or compliance attestation, but the tenant lacks `cbom_signing`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyError"
        "404":
          description: Scope not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyError"
        "422":
          description: >
            The scope's stored query no longer validates, so the artifact this
            would produce is not the one the scope describes.
            Generation is refused rather than producing an artifact whose
            contents are wider than the boundary it names.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidScopeQueryError"
        "500":
          $ref: "#/components/responses/LegacyServerError"
        "501":
          description: >
            The requested `kind` is one this build recognises but this
            deployment has no assembler wired for. Distinct from 400 (unknown
            kind): the request was correct, the wiring is incomplete.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyError"

  /cbom/artifacts:
    get:
      operationId: listCBOMArtifacts
      tags: [cbom-artifacts]
      summary: List CBOM artifacts for the current tenant
      description: |
        Returns non-deleted artifacts ordered by `generated_at` DESC.

        `limit` defaults to 50 and is clamped to 200. Values below 1 or
        non-numeric are rejected with 400. `scope_id` filters server-side.
      x-quirks:
        - "List envelope is `{ \"artifacts\": [...] }` with no pagination block. Hardening to the ADR-0002 collection envelope is the documented go-forward change."
      parameters:
        - name: scope_id
          in: query
          required: false
          description: Filter to artifacts generated from this scope.
          schema:
            type: string
            format: uuid
        - name: kind
          in: query
          required: false
          description: >
            Filter to one artifact kind. **Omitted means every kind, not
            `cbom`** — this is one list of the tenant's artifacts, and
            defaulting the filter would hide an SBOM someone just generated
            behind a filter they never set. An unrecognised value is 400, not
            an empty list.
          schema:
            $ref: "#/components/schemas/ArtifactKind"
        - name: limit
          in: query
          required: false
          description: >
            Maximum number of artifacts to return. Defaults to 50; values above
            200 are clamped to 200.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: The tenant's artifacts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CBOMArtifactListResponse"
        "400":
          $ref: "#/components/responses/LegacyBadRequest"
        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
        "500":
          $ref: "#/components/responses/LegacyServerError"

  /cbom/artifacts/{id}:
    parameters:
      - $ref: "#/components/parameters/ArtifactId"
    get:
      operationId: getCBOMArtifact
      tags: [cbom-artifacts]
      summary: Get a CBOM artifact by id
      responses:
        "200":
          description: The artifact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CBOMArtifact"
        "400":
          $ref: "#/components/responses/LegacyBadRequest"
        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
        "404":
          $ref: "#/components/responses/LegacyNotFound"
        "500":
          $ref: "#/components/responses/LegacyServerError"
    delete:
      operationId: softDeleteCBOMArtifact
      tags: [cbom-artifacts]
      summary: Soft-delete a CBOM artifact
      description: >
        Soft delete only. The row is retained so dangling references from
        comparison runs surface as "deleted by X" rather than 404.
      responses:
        "204":
          description: Deleted. No body.
        "400":
          $ref: "#/components/responses/LegacyBadRequest"
        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
        "404":
          $ref: "#/components/responses/LegacyNotFound"
        "500":
          $ref: "#/components/responses/LegacyServerError"

  /cbom/artifacts/{id}/download:
    parameters:
      - $ref: "#/components/parameters/ArtifactId"
    get:
      operationId: downloadCBOMArtifact
      tags: [cbom-artifacts]
      summary: Download the artifact bytes in a chosen format
      description: |
        Returns the artifact rendered in the requested wire format.

        - `cyclonedx` (default) → the artifact's canonical CycloneDX JSON, byte-stable
          against `content_hash`. Inline-stored artifacts stream the bytes
          directly with `Content-Type: application/vnd.cyclonedx+json`;
          object-stored artifacts return a 302 redirect to a presigned URL.
        - `spdx` → SPDX 2.3 JSON projection (re-rendered from canonical bytes).
          **Enterprise edition only.**
        - `pdf` → PDF rendering for human review (re-rendered from canonical
          bytes). **Enterprise edition only.**
        - `ocsf` → OCSF **1.9.0** event stream as JSON Lines
          (`application/x-ndjson`): one `Device Inventory Info` (class_uid
          5001) per asset, one `Vulnerability Finding` (class_uid 2002) per
          vulnerability the artifact records. **Core**, and defined **only for
          `inventory` artifacts** — any other kind returns 400. Projected from
          the stored canonical bytes, so what a SIEM ingests is exactly what
          `content_hash` covers.

        Format ↔ kind compatibility, checked after the edition gate so the two
        answers stay distinguishable (402 = "this deployment/subscription
        cannot render that format at all"; 400 = "that format is not defined
        for this kind of artifact"):

        | format | defined for |
        |---|---|
        | `cyclonedx` | every kind |
        | `ocsf` | `inventory` only |
        | `spdx`, `pdf` | `cbom` only |

        SPDX and PDF re-render server-side and therefore need the raw bytes
        to be loadable. Inline-stored artifacts read from
        `cbom_artifacts.inline_content` directly; object-stored artifacts stream
        the bytes via `shared/storage.Stream()` (wired through
        `cbom/storage_read.go::ReadStoredBytes`). The handler returns 500 only
        when storage is mis-wired or the underlying bytes can't be fetched.

        Edition and entitlement boundary: `cyclonedx` is served by every
        edition — it is the CBOM standard and the form `content_hash` refers
        to. `spdx` and `pdf` need both the Enterprise renderer and the
        tenant's `cbom_signing` entitlement; otherwise the handler returns
        **402**. The `format` enum is edition-independent on purpose, so
        clients can tell "valid format, wrong edition/subscription" (402)
        from "unknown format" (400).
      x-quirks:
        - "`cyclonedx` for inline-stored artifacts returns the bytes directly with status 200. `cyclonedx` for object-stored artifacts returns **302 Found** with a presigned URL in `Location`."
        - "SPDX and PDF re-render from canonical bytes for both inline and object-stored artifacts — `shared/storage.Stream()` is wired. A 500 indicates a storage misconfiguration, not a contract gap."
        - "Successful responses for SPDX/PDF/inline-CycloneDX are binary bodies, not JSON; they are not schema-validated by the contract test."
        - "`format=spdx|pdf` returns **402 Payment Required** on a Core (open-source) deployment or for a tenant without `cbom_signing`. The 402 is checked *before* the artifact is loaded, so an unknown id with an Enterprise-only format returns 402, not 404. Clients should surface it as an upgrade prompt, never as a retryable error."
      parameters:
        - name: format
          in: query
          required: false
          description: Wire format. Defaults to `cyclonedx`.
          schema:
            type: string
            enum: [cyclonedx, spdx, pdf, ocsf]
            default: cyclonedx
      responses:
        "200":
          description: The artifact bytes in the requested format.
          content:
            application/vnd.cyclonedx+json:
              schema:
                type: string
                format: binary
            application/spdx+json:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
            application/x-ndjson:
              schema:
                type: string
                format: binary
        "302":
          description: >
            Object-stored CycloneDX downloads return a presigned URL in
            `Location`.
          headers:
            Location:
              schema:
                type: string
                format: uri
        "400":
          $ref: "#/components/responses/LegacyBadRequest"
        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
        "402":
          description: >
            The requested format (`spdx` or `pdf`) requires an Enterprise
            renderer and the tenant's `cbom_signing` entitlement.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyError"
        "404":
          $ref: "#/components/responses/LegacyNotFound"
        "500":
          $ref: "#/components/responses/LegacyServerError"
        "501":
          description: >
            `format=ocsf` was requested but this deployment has no OCSF
            renderer wired. A wiring fault, not a missing subscription — the
            format is Core.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyError"

  /cbom/artifacts/{id}/verify:
    parameters:
      - $ref: "#/components/parameters/ArtifactId"
    post:
      operationId: verifyCBOMArtifact
      tags: [cbom-artifacts]
      summary: Recompute hash and (if signed) signature for an artifact
      description: |
        Loads the artifact's canonical bytes (from inline content or storage),
        re-hashes them, and compares to the row's `content_hash`. When the
        artifact was signed and a signer is configured **and** the hash check
        passed, also re-derives the HMAC and compares.

        When bytes can't be loaded (no inline content and no storage wired)
        the call still returns 200 with `hash_valid` and `signature_checked`
        false — the UI greys the result rather than erroring.
      x-quirks:
        - "The signer is **only consulted when the hash check passed** — re-signing a body whose hash already drifted would be misleading and is treated as tamper-suspicious."
        - "`signature_checked: false` covers three distinct cases: artifact unsigned, no verifier wired, or hash check failed. The UI must treat the result as `not asserted` rather than `asserted invalid`."
      responses:
        "200":
          description: Verify result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyResponse"
        "400":
          $ref: "#/components/responses/LegacyBadRequest"
        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
        "404":
          $ref: "#/components/responses/LegacyNotFound"
        "500":
          $ref: "#/components/responses/LegacyServerError"

  # ============================================================
  # CBOM Comparison (Phase 3)
  # ============================================================
  /cbom/compare:
    post:
      operationId: compareCBOMArtifacts
      tags: [cbom-comparison]
      summary: Diff two CBOM artifacts (request-body form)
      description: |
        Computes a structured diff between two artifacts of the same tenant.
        Artifacts are immutable, so the result is deterministic for any
        (base_id, head_id) pair; Phase 3 recomputes on demand (no cache).

        Component-level matching aligns on purl / OID / fingerprint /
        type+name; each change is categorized `improvement` / `regression` /
        `drift` / `neutral` with a one-phrase reason.

        **Same kind only.** Base and head must have the same `artifact_kind`;
        a cross-kind request is 400. The match keys of two kinds are drawn
        from disjoint identity spaces (a certificate fingerprint against an
        asset id), so nothing would align and the result would be every
        component of the base "removed" and every component of the head
        "added" — precise, confident and entirely wrong.

        Requires the tenant's `cbom_signing` entitlement.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompareRequest"
      responses:
        "200":
          description: The diff result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiffResult"
        "400":
          $ref: "#/components/responses/LegacyBadRequest"
        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
        "402":
          description: Artifact comparison requires the tenant's `cbom_signing` entitlement.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyError"
        "404":
          $ref: "#/components/responses/LegacyNotFound"
        "500":
          $ref: "#/components/responses/LegacyServerError"

  /cbom/compare/{base}/{head}:
    parameters:
      - name: base
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: head
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: compareCBOMArtifactsByURL
      tags: [cbom-comparison]
      summary: Diff two CBOM artifacts (URL form)
      description: >
        Same semantics as `POST /cbom/compare`, with the artifact ids in the
        URL so a diff can be shared as a deep link. Same-kind only (400
        otherwise). Requires the tenant's `cbom_signing` entitlement.
      responses:
        "200":
          description: The diff result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiffResult"
        "400":
          $ref: "#/components/responses/LegacyBadRequest"
        "401":
          $ref: "#/components/responses/LegacyUnauthorized"
        "402":
          description: Artifact comparison requires the tenant's `cbom_signing` entitlement.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyError"
        "404":
          $ref: "#/components/responses/LegacyNotFound"
        "500":
          $ref: "#/components/responses/LegacyServerError"

components:
  parameters:
    ScopeId:
      name: id
      in: path
      required: true
      description: Scope UUID.
      schema:
        type: string
        format: uuid
    ArtifactId:
      name: id
      in: path
      required: true
      description: CBOM artifact UUID.
      schema:
        type: string
        format: uuid

  responses:
    # --- Current ("legacy") error envelope: { "error": "string" } ---
    LegacyBadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LegacyError"
    LegacyUnauthorized:
      description: Missing or invalid tenant/auth context.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LegacyError"
    LegacyNotFound:
      description: Scope not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LegacyError"
    LegacyConflict:
      description: Operation not permitted (e.g. deleting a system scope).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LegacyError"
    LegacyServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LegacyError"

  schemas:
    # ============================================================
    # Scopes domain (current shapes — what the service returns today)
    # ============================================================
    Scope:
      type: object
      additionalProperties: false
      required:
        - id
        - tenant_id
        - name
        - query
        - version
        - is_default
        - is_system
        - created_by
        - updated_by
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          description: Optional; omitted when empty.
        query:
          $ref: "#/components/schemas/ScopeQuery"
        version:
          type: integer
        is_default:
          type: boolean
        is_system:
          type: boolean
          description: >
            System scopes are editable but not deletable (deleting one would
            orphan CBOM artifacts that reference it by id).
        deleted_at:
          type: [string, "null"]
          format: date-time
          description: Soft-delete timestamp; omitted/null for live scopes.
        created_by:
          type: string
          format: uuid
        updated_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ScopeQuery:
      type: string
      description: >
        The scope's boundary, as a query-language string over the `asset`
        target. An EMPTY string matches every asset visible to the tenant under
        RLS, which is what the seeded `All` scope is.


        It replaced a JSONB include/exclude predicate. The language is
        documented at
        docsv4/internal/developer/design/asset-inventory/QUERY_LANGUAGE.md and
        is the same string `GET /api/v1/inventory-service/assets?query=` takes,
        so a scope can be previewed by running it on the inventory list.


        Validated on write and stored in canonical form: a CBOM artifact
        captures scope_id + scope_version, and two spellings of one predicate
        would be two versions a diff could not match.
      example: "environment:production and not tag:(dev or test)"

    ScopeListResponse:
      type: object
      additionalProperties: false
      description: >
        CURRENT list envelope for GET /scopes. Pre-ADR-0002; a collection wrapped
        under the `scopes` key with no pagination. Hardening this to the
        ADR-0002 collection envelope (`{ data, pagination }`) is the documented
        go-forward change.
      required: [scopes]
      properties:
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/Scope"

    CreateScopeRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
        query:
          $ref: "#/components/schemas/ScopeQuery"

    UpdateScopeRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
        query:
          $ref: "#/components/schemas/ScopeQuery"

    PreviewResult:
      type: object
      additionalProperties: false
      required: [scope_id, name, query, preview]
      properties:
        scope_id:
          type: string
          format: uuid
        name:
          type: string
        query:
          $ref: "#/components/schemas/ScopeQuery"
        preview:
          type: object
          additionalProperties: false
          description: >
            How many assets the scope currently matches. The count is answered
            by inventory-service, compiling the SAME query string a CBOM
            generation sends it — so the number a customer tunes a scope against
            is the number of assets the artifact will cover, rather than a
            second opinion computed here.
          required: [status, matched_count]
          properties:
            status:
              type: string
              enum: [ok, unavailable]
              description: >
                `ok` — `matched_count` is the live count.
                `unavailable` — inventory-service could not be reached, and
                `matched_count` is null. A count that cannot be obtained is
                NEVER reported as zero: "your scope matches nothing" is the
                worst possible wrong answer for an attestation boundary.
            matched_count:
              type: [integer, "null"]
              description: Null iff status is `unavailable`.
            note:
              type: string
              description: Present when status is `unavailable`, saying why.

    # ============================================================
    # CBOM Artifact domain (Phase 2 + Phase 4 — current shapes)
    # ============================================================
    ArtifactKind:
      type: string
      enum: [cbom, sbom, hbom, inventory]
      default: cbom
      description: |
        Which bill of materials an artifact is (ADR-0005 D6). One pipeline,
        four products — same scope, same content hash, same signature, same
        comparison; only the assembled components differ.

        - `cbom` — cryptographic: certificates, algorithms, protocols, keys,
          crypto libraries. The default, and what this API produced before
          kinds existed.
        - `sbom` — software: one `library` component per distinct software
          product installed on the scope's assets, with the assets it was
          found on as `evidence.occurrences`. No `dependencies` graph — an
          install record says a product is present, not that anything depends
          on it.
        - `hbom` — hardware: one `device` component per hardware-class asset,
          carrying its `hw.*` facts and its identifiers.
        - `inventory` — everything: every asset as a component typed by its
          class, endpoints as `services`, `asset_relationships` as the
          `dependencies` graph, facts/identifiers/tags as `properties`, and
          **only** the `vulnerability` producer's findings as
          `vulnerabilities`. Other producers' findings are findings, not CVEs,
          and are deliberately absent from that array.

    CBOMArtifact:
      type: object
      additionalProperties: false
      description: >
        An immutable, dated, content-hashed snapshot of every cryptographic
        component matching a Scope at the moment of generation. Storage is
        dual-path: exactly one of `storage_key` (S3) or inline content (dev,
        gated by `has_inline_content`).
      required:
        - id
        - tenant_id
        - scope_id
        - scope_version
        - scope_name_snapshot
        - artifact_kind
        - has_inline_content
        - content_hash
        - size_bytes
        - component_count
        - cyclonedx_spec_version
        - input_data_freshness_at
        - generated_at
        - generated_by
        - provenance
        - layers
        - created_at
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        scope_id:
          type: string
          format: uuid
        scope_version:
          type: integer
          description: Version of the scope predicate that was in force.
        scope_name_snapshot:
          type: string
          description: Scope name as of generation. Stored so renames don't rewrite history.
        name:
          type: string
          description: Optional human-meaningful name; omitted when empty.
        artifact_kind:
          $ref: "#/components/schemas/ArtifactKind"
        storage_key:
          type: string
          description: >
            Object-storage key when the canonical bytes live in S3. Omitted
            when the artifact is stored inline.
        has_inline_content:
          type: boolean
          description: True when the canonical bytes live in Postgres (dev / no-S3).
        content_hash:
          type: string
          description: Hex SHA-256 over the canonical CycloneDX bytes.
        size_bytes:
          type: integer
        component_count:
          type: integer
        cyclonedx_spec_version:
          type: string
          description: >
            The CycloneDX specification version the stored bytes declare.
            Artifacts generated from v0.2.0 onward say "1.7"; earlier ones say
            "1.6" and keep their bytes — artifacts are immutable evidence and
            are never re-rendered.
        storage_degraded:
          type: string
          description: >
            Generation-time only, echoed from POST /cbom/generate. Never
            returned by GET — it is not a stored column.
        attestation_error:
          type: string
          description: >
            Generation-time only, echoed from POST /cbom/generate. Never
            returned by GET — it is not a stored column.
        input_data_freshness_at:
          type: string
          format: date-time
          description: How recent the inventory was when generation ran.
        generated_at:
          type: string
          format: date-time
        generated_by:
          type: string
          format: uuid
        signature_hmac:
          type: string
          description: >
            Phase 4. Hex HMAC-SHA256 over `content_hash`. Empty when
            unsigned.
        signature_kid:
          type: string
          description: Phase 4. Key id used to sign. Empty when unsigned.
        provenance:
          $ref: "#/components/schemas/Provenance"
        layers:
          type: [array, "null"]
          description: >
            Optional attestation/annotation layers (e.g. compliance_attestation).
            Emitted as `null` when generation ran with `include_attestation: false`,
            when the attestation builder is unwired, or when the build produced
            no attestable findings — `Layers []Layer` in Go lacks `omitempty`,
            so a nil slice serializes as `null` rather than `[]`. Consumers must
            tolerate both.
          items:
            $ref: "#/components/schemas/Layer"
        deleted_at:
          type: [string, "null"]
          format: date-time
          description: Soft-delete timestamp; omitted/null for live artifacts.
        created_at:
          type: string
          format: date-time

    Provenance:
      type: object
      additionalProperties: false
      description: Non-canonical context about how the artifact was generated.
      properties:
        generator_service:
          type: string
        generator_version:
          type: string
        request_id:
          type: string

    Layer:
      type: object
      additionalProperties: false
      description: >
        Optional annotation attached to an artifact. Each layer carries its
        own type+version so the schema can evolve without breaking older
        artifacts.
      required: [type]
      properties:
        type:
          type: string
          description: e.g. "compliance_attestation".
        version:
          type: string
        data:
          type: object
          description: Layer-specific payload; opaque to the generic schema.
          additionalProperties: true

    CBOMArtifactListResponse:
      type: object
      additionalProperties: false
      description: >
        CURRENT list envelope for GET /cbom/artifacts. Pre-ADR-0002 — a
        collection wrapped under the `artifacts` key with no pagination.
        Hardening this to the ADR-0002 collection envelope (`{ data,
        pagination }`) is the documented go-forward change.
      required: [artifacts]
      properties:
        artifacts:
          type: array
          items:
            $ref: "#/components/schemas/CBOMArtifact"

    GenerateCBOMRequest:
      type: object
      additionalProperties: false
      required: [scope_id]
      properties:
        scope_id:
          type: string
          format: uuid
        kind:
          allOf:
            - $ref: "#/components/schemas/ArtifactKind"
          description: >
            Which bill of materials to assemble. Omitted means `cbom` — exactly
            what this endpoint produced before kinds existed, so an older
            client's request is unchanged in meaning as well as in shape. An
            unrecognised value is rejected with 400 rather than defaulted.
        name:
          type: string
          description: Optional human-meaningful name.
        include_attestation:
          type: boolean
          description: >
            Phase 4. Attach a compliance_attestation layer summarizing open
            findings for the scope's asset set. Server defaults to true when
            omitted — audit-ready by default.
        sign:
          type: boolean
          description: >
            Phase 4. HMAC-sign the artifact. Server defaults to true when
            omitted (requires INTERNAL_AUTH_SECRET on the server side).

    InvalidScopeQueryError:
      type: object
      additionalProperties: false
      required: [error, query]
      properties:
        error:
          type: string
        query:
          type: string
          description: The stored scope query that no longer validates.

    GenerateCBOMResponse:
      type: object
      additionalProperties: false
      required: [artifact_id, status]
      properties:
        artifact_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [ready, queued]
          description: >
            Phase 2 returns "ready" — generation is synchronous-but-quick,
            the row is already committed when this response is sent. The
            "queued" value is reserved for a future async path so the wire
            shape doesn't change when that lands.
        storage_degraded:
          type: string
          description: >
            Present when the artifact was produced but not stored the way the
            deployment is configured to store it — an object-store upload
            failed and the bytes went to the database instead. The artifact is
            complete and valid; regenerating once storage is healthy will place
            the object in the bucket.
        attestation_error:
          type: string
          description: >
            Present when a compliance-attestation layer was requested and could
            not be built. Absent means either not requested or built
            successfully — the artifact's `layers` distinguishes the two.

    VerifyResponse:
      type: object
      additionalProperties: false
      required:
        - artifact_id
        - hash_valid
        - hash_stored
        - signature_valid
        - signature_checked
      properties:
        artifact_id:
          type: string
          format: uuid
        hash_valid:
          type: boolean
          description: True when the recomputed hash matched the stored hash.
        hash_recomputed:
          type: string
          description: >
            Hex SHA-256 we just computed. Omitted when the bytes were not
            loadable; the UI can render "expected X, got Y" when both
            recomputed and stored are present.
        hash_stored:
          type: string
          description: The content_hash recorded on the row.
        signature_valid:
          type: boolean
          description: >
            True when the stored HMAC matched a recomputed HMAC against the
            platform's current signing key. Only meaningful when
            `signature_checked` is true.
        signature_checked:
          type: boolean
          description: >
            False covers three cases: artifact unsigned, no verifier wired,
            or the hash check failed (in which case re-signing would be
            misleading). Treat false as "not asserted," not "asserted invalid."
        signature_kid:
          type: string
          description: Key id stored on the artifact; empty for unsigned.

    # ============================================================
    # CBOM Comparison (Phase 3 — current shapes)
    # ============================================================
    CompareRequest:
      type: object
      additionalProperties: false
      required: [base_id, head_id]
      properties:
        base_id:
          type: string
          format: uuid
        head_id:
          type: string
          format: uuid

    ChangeKind:
      type: string
      enum: [added, removed, modified]

    ChangeCategory:
      type: string
      enum: [improvement, regression, drift, neutral]

    DiffChange:
      type: object
      additionalProperties: false
      required: [row_id, kind, category, match_key, component_type, name, reason]
      properties:
        row_id:
          type: string
          description: >
            Citation target for this row — `r1`, `r2`, … assigned in the
            order `changes` is returned in, which is stable for a given pair
            of (immutable) artifacts. The narrative cites rows by this id;
            the UI anchors each row at `diff-row-<row_id>`. Not a durable
            identifier — `match_key` is the component identity.
        kind:
          $ref: "#/components/schemas/ChangeKind"
        category:
          $ref: "#/components/schemas/ChangeCategory"
        match_key:
          type: string
          description: Stable identity used to align the two components.
        component_type:
          type: string
          description: e.g. algorithm / certificate / protocol / key / library.
        name:
          type: string
        reason:
          type: string
          description: Short human-readable phrase explaining the category.
        base:
          type: object
          additionalProperties: true
          description: >
            Original component object from the base artifact. nil/omitted
            for `added` changes (no base). Shape passed through verbatim
            from CycloneDX — kept open so the diff UI doesn't couple to the
            full component schema.
        head:
          type: object
          additionalProperties: true
          description: >
            Component object from the head artifact. nil/omitted for
            `removed` changes (no head). See `base` for shape note.

    DiffResult:
      type: object
      additionalProperties: false
      required:
        - base_artifact_id
        - head_artifact_id
        - count_by_category
        - count_by_kind
        - narrative
      properties:
        base_artifact_id:
          type: string
          format: uuid
        head_artifact_id:
          type: string
          format: uuid
        count_by_category:
          type: object
          additionalProperties:
            type: integer
          description: >
            Map keyed by category enum value to count. Keys are open because
            Go's `map[Category]int` marshals only categories with non-zero
            counts; absent keys mean zero.
        count_by_kind:
          type: object
          additionalProperties:
            type: integer
          description: >
            Map keyed by kind enum value to count. See `count_by_category`
            for the absent-means-zero convention.
        changes:
          type: [array, "null"]
          description: >
            The change list. Currently serializes as `null` when there are
            no changes (Go nil slice) instead of `[]` — a known quirk
            mirroring the scopes `null`-on-empty finding, to be addressed in
            the same hardening pass.
          items:
            $ref: "#/components/schemas/DiffChange"
        narrative:
          type: string
          description: >
            Prose summarising the net change, with the citation markers
            stripped. Unchanged in shape from before citations existed, so a
            client that only wants a sentence can keep reading this field.
        narrative_detail:
          $ref: "#/components/schemas/NarrativeDetail"

    Citation:
      type: object
      additionalProperties: false
      required: [kind, ref]
      description: >
        One row a narrative sentence draws on (ADR-0008 D4.4, "cite or
        refuse"). Rendered by the UI as a link to the cited diff row.
      properties:
        kind:
          type: string
          enum: [diff_row]
          description: What `ref` names. Only diff rows today.
        ref:
          type: string
          description: The `row_id` of a change in this diff.

    NarrativeDetail:
      type: object
      additionalProperties: false
      required: [available, source, source_kind, source_ref, confidence, model_id]
      description: >
        The comparison narrative with its citations and provenance intact.
        The prose in `text` carries inline `[row:<row_id>]` markers; `citations`
        is the same set, derived from the text, in order of first appearance.
      properties:
        available:
          type: boolean
          description: >
            False means there is no narrative to show — render nothing, not an
            empty panel. In practice always true here: the deterministic
            narrator can summarise any set of rows, including the empty one.
        source:
          type: string
          enum: [rules, model]
          description: >
            Which narrator wrote it. `rules` is the deterministic narrator and
            is what every deployment without a configured AI provider gets, and
            what a configured one degrades to on any failure. `model` means a
            model wrote it and every sentence cited rows that resolved.
        text:
          type: string
          description: The prose, with `[row:<row_id>]` citation markers inline.
        citations:
          type: array
          items:
            $ref: "#/components/schemas/Citation"
          description: >
            Each distinct row cited by `text`, in order of first appearance.
            Absent when the narrative cites nothing, which for the rule
            narrator means the comparison found no changes.
        source_kind:
          type: string
          description: >
            Always `inferred` (ADR-0008 D4.1). A narrative is prose derived
            from rows, never a measured fact, and it is never persisted as one.
        source_ref:
          type: string
          description: The producer — `narrator:rules` or `narrator:model`.
        confidence:
          type: number
          description: >
            The producer's own estimate, 0..1. The rule narrator reports 1 —
            it asserts only arithmetic over the rows it cites. The model
            narrator reports 0, meaning no estimate was made: we do not ask a
            model to score itself, and a number we invented would read as a
            measurement.
        model_id:
          type: string
          description: >
            What produced it, as the provider reported it. Empty for the rule
            narrator — no model was involved, and "" is not a model named
            unknown.

    LegacyError:
      type: object
      additionalProperties: false
      description: >
        CURRENT error shape returned by every cbom-service endpoint today: a
        single human-readable string under `error`. Unstructured — cannot be
        branched on safely. Superseded by the ADR-0002 `Error` envelope below
        as endpoints are hardened.
      required: [error]
      properties:
        error:
          type: string

    # ============================================================
    # ADR-0002 go-forward envelope (the documented standard).
    # NOT yet applied to the v1 Scopes paths above. New and hardened
    # endpoints conform to these. The generated client carries these types
    # ahead of the backend so the frontend-v2 surface can target them.
    # ============================================================
    Error:
      type: object
      additionalProperties: false
      description: ADR-0002 error envelope. Clients branch on `error.code`, never on `message`.
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable, machine-readable enum (e.g. scope_not_found).
            message:
              type: string
              description: Human-readable, safe to surface in UI.
            details:
              type: array
              items:
                $ref: "#/components/schemas/ErrorDetail"
            request_id:
              type: string
              description: For support correlation.

    ErrorDetail:
      type: object
      additionalProperties: false
      required: [field, issue]
      properties:
        field:
          type: string
        issue:
          type: string

    Pagination:
      type: object
      additionalProperties: false
      description: ADR-0002 pagination block for collection envelopes.
      required: [total, limit, offset]
      properties:
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        next_offset:
          type: [integer, "null"]
          description: Offset of the next page, or null when there are no more.
