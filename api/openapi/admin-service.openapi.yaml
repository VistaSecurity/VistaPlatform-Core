      description: |
        Multipart upload (form fields `type` ∈ {logo, login_logo, favicon} and `file`).
        PNG/JPEG/ICO only (SVG rejected — stored-XSS risk), max 5MB; content is
        magic-byte-sniffed, not trusted from Content-Type. Stored to S3 with a
