components:
  responses:
    LegacyBadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyError'
    LegacyUnauthorized:
      description: Missing or invalid tenant/auth context.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyError'
    LegacyForbidden:
      description: Authenticated but lacking the required platform permission.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyError'
    LegacyNotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyError'
    LegacyServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyError'
    LegacyConflict:
      description: Conflicting state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyError'
  schemas:
    # --- Legal documents (Terms of Service / Privacy Policy) ----------------
    AdminLegalDocument:
      type: object
      additionalProperties: false
      required: [id, doc_type, version, title, body, content_hash, is_current, effective_date, published_at, placeholders]
      properties:
        id: { type: string, format: uuid }
        doc_type:
          type: string
          enum: [terms_of_service, privacy_policy]
        version: { type: integer }
        title: { type: string }
        body: { type: string }
        content_hash: { type: string }
        is_current: { type: boolean }
        effective_date: { type: string, format: date-time }
        published_at: { type: string, format: date-time }
        published_by: { type: string, format: uuid, nullable: true }
        placeholders:
          type: array
          description: >-
            Unedited-template markers found in this version's body, e.g.
            "[YOUR LEGAL ENTITY]". Always present; empty means the document has
            been filled in. Computed server-side so the console never re-derives
            what counts as a placeholder. Capped at 10 entries.
          items: { type: string }
    AdminLegalVersion:
      type: object
      additionalProperties: false
      required: [doc_type, version, title, is_current, published_at]
      properties:
        doc_type:
          type: string
          enum: [terms_of_service, privacy_policy]
        version: { type: integer }
        title: { type: string }
        is_current: { type: boolean }
        published_at: { type: string, format: date-time }
    AdminLegalDocumentsResponse:
      type: object
      additionalProperties: false
      required: [documents, history]
      properties:
        documents:
          type: array
          items:
            $ref: '#/components/schemas/AdminLegalDocument'
        history:
          type: array
          items:
            $ref: '#/components/schemas/AdminLegalVersion'
    PublishLegalDocumentRequest:
      type: object
      additionalProperties: false
      required: [doc_type, title, body]
      properties:
        doc_type:
          type: string
          enum: [terms_of_service, privacy_policy]
        title: { type: string }
        body: { type: string }
        acknowledge_placeholders:
          type: boolean
          default: false
          description: >-
            Publish a body that still contains "[BRACKETED]" template markers.
            Without it such a body is rejected with 422. The console sets it
            only after an explicit confirmation naming what was found.
    LegalPlaceholderRejection:
      type: object
      additionalProperties: false
      required: [error, placeholders]
      properties:
        error: { type: string }
        placeholders:
          type: array
          description: The distinct markers found, capped at 10.
          items: { type: string }
    LegalAcceptanceRow:
      type: object
      additionalProperties: false
      required: [tenant_id, tenant_name, user_id, user_email, doc_type, version, accepted_at]
      properties:
        tenant_id: { type: string, format: uuid }
        tenant_name: { type: string }
        user_id: { type: string, format: uuid }
        user_email: { type: string }
        doc_type: { type: string }
        version: { type: integer }
        accepted_at: { type: string, format: date-time }
        accepted_ip: { type: string, nullable: true }
    LegalAcceptanceListResponse:
      type: object
      additionalProperties: false
      required: [acceptances]
      properties:
        acceptances:
          type: array
          items:
            $ref: '#/components/schemas/LegalAcceptanceRow'

    # --- Platform identity providers ---------------------------------
    PlatformIdentityProvider:
      type: object
      required: [id, provider_type, provider_name, purpose, client_id, has_secret, auth_url, token_url, scopes, is_enabled]
      properties:
        id: { type: string, format: uuid }
        provider_type: { type: string, enum: [google, microsoft] }
        provider_name: { type: string }
        purpose:
          type: string
          enum: [signup, admin_login]
          description: "signup = Vista's app for tenant founders (#895); admin_login = staff sign-in to admin-ui (#899)."
        client_id: { type: string }
        has_secret: { type: boolean, description: "Whether a client secret is stored. The secret itself is never returned." }
        auth_url: { type: string }
        token_url: { type: string }
        userinfo_url: { type: string }
        scopes: { type: string }
        is_enabled: { type: boolean }
    PlatformIdentityProviderListResponse:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          items: { $ref: '#/components/schemas/PlatformIdentityProvider' }
    PlatformIdentityProviderInput:
      type: object
      required: [provider_type, client_id]
      properties:
        provider_type: { type: string, enum: [google, microsoft], description: "Immutable on update." }
        provider_name: { type: string }
        purpose: { type: string, enum: [signup, admin_login], description: "Defaults to signup; immutable on update." }
        client_id: { type: string }
        client_secret: { type: string, description: "Write-only; blank on update keeps the stored secret." }
        auth_url: { type: string }
        token_url: { type: string }
        userinfo_url: { type: string }
        scopes: { type: string }
        is_enabled: { type: boolean }
