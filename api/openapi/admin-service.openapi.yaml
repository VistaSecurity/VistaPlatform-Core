        null when there are no active AWS integrations.
      required: [config, available_integrations, available_artifact_types]
      properties:
        config:
          type: [object, 'null']
          additionalProperties: true
        available_integrations:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/IntegrationSummary'
        available_artifact_types:
          type: array
