  # ===========================================================================
  # Platform-admin auth session surface. Consumed by the admin console
  # (@vistasecurity/primitives platform-auth — frontend-v2 ADR-0004 /
  # admin-ui-v2 ADR-0002). Distinct from tenant auth-service: separate
  # platform_users/platform_roles model and platform_* httpOnly cookies
  # (platform_access_token / platform_refresh_token + JS-readable
  # platform_csrf_token). Unauthenticated: /auth/{login,refresh,forgot-password,
  # reset-password}. Authenticated (JWT): /admin/auth/{me,logout,change-password}.
  # ===========================================================================
  /auth/login:
    post:
      operationId: platformLogin
      tags:
      - platform-auth
      summary: Platform admin login
      description: 'Authenticates a platform user. On success sets the platform_* cookies and returns the user + tokens. `user.role` is the joined role object (shared/models.PlatformUser).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformLoginRequest'
      responses:
        '200':
          description: Authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformLoginResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /auth/refresh:
    post:
      operationId: platformRefreshToken
      tags:
      - platform-auth
      summary: Refresh the platform session
      description: 'Rotates the platform session. The refresh token is read from the platform_refresh_token httpOnly cookie; the body is optional and normally empty. Re-sets the platform_* cookies and returns the same shape as login.'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformRefreshRequest'
      responses:
        '200':
          description: Refreshed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformLoginResponse'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /auth/forgot-password:
    post:
      operationId: platformForgotPassword
      tags:
      - platform-auth
      summary: Request a password-reset email
      description: 'Self-service: emails a time-limited reset link to the address if it maps to an active platform user. Always returns 200 with a generic acknowledgement (no account enumeration).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformForgotPasswordRequest'
      responses:
        '200':
          description: Acknowledged (whether or not the address matched).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /auth/reset-password:
    post:
      operationId: platformResetPassword
      tags:
      - platform-auth
      summary: Set a new password from a reset/invite token
      description: 'Unauthenticated: validates a time-limited token (from a reset or invite email) and sets a new password.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformResetPasswordRequest'
      responses:
        '200':
          description: Password set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /admin/auth/me:
    get:
      operationId: getCurrentPlatformUser
      tags:
      - platform-users
      summary: Current platform user profile
      description: 'The authenticated platform user. NOTE: unlike the list/get endpoints, `role` here is the role *name* string (not the role object).'
      responses:
        '200':
          description: The current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentPlatformUserResponse'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /admin/platform/edition:
    get:
      operationId: getPlatformEdition
      tags:
      - platform-edition
      summary: Which optional admin-service surfaces this build mounted
      description: |
        The edition read-out the admin console gates its navigation on.

        admin-service is carved into Core and Enterprise/MSP. A Core build does
        not 403 the Enterprise routes — it never mounts them, so they 404. This
        endpoint lets the console know that BEFORE it renders a Tenants tab
        whose backend does not exist.

        Served by Core code and answerable by a build with no `ee/` tree.
        Authenticated (platform-admin group) but not permission-gated: every
        operator's navigation depends on it, exactly like `/admin/auth/me`.

        `capabilities` is the field to gate on — it is derived from hook
        presence, the same fact that decides whether the routes exist.
        `edition` is coarse on purpose: one `ee` binary serves both the
        Enterprise and MSP editions, so it cannot honestly distinguish them.

        This service speaks only for its own routes. Capabilities carved out of
        other binaries (SIEM export in audit-service, CMDB sync in
        inventory-service) keep their own response probes.
      responses:
        '200':
          description: The running build's edition read-out.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformEditionResponse'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
  /admin/auth/logout:
    post:
      operationId: platformLogout
      tags:
      - platform-auth
      summary: Log out (revoke refresh tokens, clear cookies)
      description: 'Authenticated: revokes the platform refresh tokens server-side and clears the platform_* cookies.'
      responses:
        '200':
          description: Logged out.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /admin/auth/change-password:
    post:
      operationId: platformChangePassword
      tags:
      - platform-auth
      summary: Change own password
      description: 'Authenticated: the platform user changes their own password. On success the force_password_change flag is cleared.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformChangePasswordRequest'
      responses:
        '200':
          description: Password changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '500':
          $ref: '#/components/responses/LegacyServerError'

  # ===========================================================================
  # Platform settings, stats, monitoring, dashboard (admin-ui leftovers).
  # UI consumers: platform-api.ts, status-api.ts, dashboard-api.ts.
  # The dashboard/* + monitoring/metrics handlers proxy a dashboard service that
  # aggregates monitoring-service + resource-tracker-service; data blobs are
  # loosely typed (only the {data,meta} envelope is pinned).
  # ===========================================================================
  /admin/legal/documents:
    get:
      operationId: listLegalDocuments
      tags:
      - platform-settings
      summary: List current legal documents and version history
      description: Returns the current published version of each legal document (with body for editing) plus the version history metadata.
      responses:
        '200':
          description: Current documents and history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLegalDocumentsResponse'
        '500':
          $ref: '#/components/responses/LegacyServerError'
    post:
      operationId: publishLegalDocument
      tags:
      - platform-settings
      summary: Publish a new version of a legal document
      description: Publishes a NEW immutable version — the previously current version is demoted, never mutated, so prior acceptances stay pinned to the exact accepted text.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishLegalDocumentRequest'
      responses:
        '200':
