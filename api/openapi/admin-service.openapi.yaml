  # ===========================================================================
  # Tier entitlements composition (admin-ui tier-composer — inline api() calls).
  # ===========================================================================
  /admin/tiers/{id}/entitlements:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getTierEntitlements
      tags:
      - tiers
      summary: Get a tier's entitlement composition
      responses:
        '200':
          description: The tier's entitlements.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TierEntitlementsResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '500':
          $ref: '#/components/responses/LegacyServerError'
    put:
      operationId: updateTierEntitlements
      tags:
      - tiers
      summary: Bulk-replace a tier's entitlement composition
      description: 'The body is the complete desired composition (atomic replace). Every `included_value` is validated against its item''s `kind` before anything is written — `{"enabled": bool}` for boolean, `{"quantity": N>=0}` or `{"quantity": null}` (unlimited) for numeric_cap/numeric_metered, `{"value": "..."}` for enum_choice; an omitted or empty value is rejected, not defaulted. 400 with `item_key` on an unknown or duplicated item key; 400 with `kind` and `detail` on a malformed value. Nothing is written on any 400.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTierEntitlementsRequest'
      responses:
        '200':
          description: The updated entitlements (entitlements omitted if the post-write readback fails).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TierEntitlementsResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '500':
          $ref: '#/components/responses/LegacyServerError'

