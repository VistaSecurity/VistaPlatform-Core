          $ref: '#/components/responses/LegacyServerError'
  /admin/license/reports:
    get:
      operationId: listLicenseUsageReports
      x-edition: enterprise
      tags:
      - license
      summary: List stored usage reports, newest first
      description: >-
        Every usage report this install has generated — the scheduled monthly
        reports and any on-demand ones, including month-to-date previews
        (complete=false, never billed). Requires platform.settings. On an
        install that is not under an active MSP licence this answers 200 with
        no reports, available=false and reason not_msp, so a console that asks
        anyway renders an explanation rather than an error.
      parameters:
      - name: limit
        in: query
        required: false
        description: Page size (1–500, default 100).
        schema:
          type: integer
          minimum: 1
          maximum: 500
      responses:
        '200':
          description: The stored reports.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicenseUsageReportList'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '403':
          $ref: '#/components/responses/LegacyForbidden'
        '500':
          $ref: '#/components/responses/LegacyServerError'
    post:
      operationId: generateLicenseUsageReport
      x-edition: enterprise
      tags:
      - license
      summary: Generate a signed usage report for a month
      description: >-
        Builds, signs (ES256, install key) and stores the usage report for one
        UTC calendar month (format: LICENSE_USAGE_REPORT_V1). A closed month
        defaults to complete=true, and a complete report exists at most once
        per month — asking again answers 200 with the stored report and
        created=false. Around an MSP licence lapse a month has two complete
        reports: the final report up to the lapse, and (once licensed again)
        the rest of the month from the lapse on; asking for the month then
        generates the missing rest, or returns the latest part. The current
        month can only be a month-to-date preview
        (complete=false, 400 otherwise); previews are never billed and may be
        generated repeatedly. Future months and months before metering existed
        are refused with 400. A complete report for a month in which no daily
        snapshot was taken (before the MSP licence, or the platform down all
        month) is refused with 409 and reason no_snapshots; a preview of it is
        allowed. Requires platform.settings; audited as
        license.usage_report.generated. 404 with reason not_msp unless the
        install runs under an active MSP licence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateLicenseUsageReportRequest'
      responses:
        '200':
          description: The complete report for that month already existed; it is returned unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateLicenseUsageReportResponse'
        '201':
          description: A new report was generated and stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateLicenseUsageReportResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '403':
          $ref: '#/components/responses/LegacyForbidden'
        '404':
          $ref: '#/components/responses/LicenseNotMSP'
        '409':
          $ref: '#/components/responses/LegacyConflict'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /admin/license/reports/{id}/download:
    get:
      operationId: downloadLicenseUsageReport
      x-edition: enterprise
      tags:
      - license
      summary: Download a stored usage report
      description: >-
        The stored report document exactly as it was signed — the same bytes
        the transmitter sends and that are written to the reports volume as
        <report_id>.json — served as an attachment. Verify it with
        shared/licensing/ee/usagereport.Verify. Requires platform.settings;
        audited as license.usage_report.downloaded. 404 with reason not_msp
        unless the install runs under an active MSP licence, or a plain 404
        when no report has that id.
      parameters:
      - name: id
        in: path
        required: true
        description: The report id (UUID).
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The signed report envelope.
          headers:
            Content-Disposition:
              description: attachment; filename="<report_id>.json"
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicenseUsageReportEnvelope'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '403':
          $ref: '#/components/responses/LegacyForbidden'
        '404':
          $ref: '#/components/responses/LicenseNotMSP'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /admin/license/reports/{id}/retry:
    post:
      operationId: retryLicenseUsageReportDelivery
      x-edition: enterprise
      tags:
      - license
      summary: Retry a failed usage report delivery
      description: >-
        Re-queues the delivery of a complete report whose transmission failed
        — including one the receiver rejected (422), which is otherwise never
        retried: it goes back to pending, its backoff restarts, and the
        transmitter is asked for a pass. The last error stays on the report
        until the next attempt replaces it. 409 with reason not_configured when
        licensing.reporting.endpoint is empty, or not_failed when the report is
        a preview (never sent), pending (already retried automatically) or
        delivered. Requires platform.settings; audited as
        license.usage_report.delivery_retry_requested. 404 with reason not_msp
        unless the install runs under an active MSP licence, or a plain 404
        when no report has that id.
      parameters:
      - name: id
        in: path
        required: true
        description: The report id (UUID).
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The report, re-queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetryLicenseUsageReportResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '403':
          $ref: '#/components/responses/LegacyForbidden'
        '404':
          $ref: '#/components/responses/LicenseNotMSP'
        '409':
          $ref: '#/components/responses/LegacyConflict'
        '500':
          $ref: '#/components/responses/LegacyServerError'
components:
  responses:
    LegacyBadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyError'
    LegacyUnauthorized:
      description: Missing or invalid tenant/auth context.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyError'
    LegacyForbidden:
      description: Authenticated but lacking the required platform permission.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyError'
    PlatformPermissionDenied:
      description: 'Refused by platform authorization: the route permission (`required_permission`), platform_roles.assign for a role write (`required_permission`), a role or target that holds permissions the caller lacks (`missing_permissions`), or an act on the caller''s own account/role (`error` only).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PlatformPermissionDenied'
    BillingNotMSP:
      description: >-
        Billing is part of Vista Platform MSP: the install is not under an
        active MSP licence (reason not_msp; the route exists on every ee build,
        but only an MSP licence may use it). On a route that looks something
        up, also: that resource was not found.
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/LicenseNotMSPError'
            - $ref: '#/components/schemas/LegacyError'
    LicenseNotMSP:
      description: The install is not under an active MSP licence (usage reporting is an MSP licence obligation), or no report has that id.
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/LicenseNotMSPError'
            - $ref: '#/components/schemas/LegacyError'
    LegacyNotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyError'
    LegacyServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyError'
    LegacyConflict:
      description: Conflicting state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyError'
    CompositionConflict:
      description: 'The tier''s entitlement composition changed since the caller read it; nothing was written. `current_version` is the version now in force.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CompositionConflictError'
    CompositionVersionRequired:
      description: 'A multi-item composition write carried no version; nothing was written. Read the tier''s entitlements and send their `version`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyError'
  schemas:
    # --- Legal documents (Terms of Service / Privacy Policy) ----------------
    AdminLegalDocument:
      type: object
      additionalProperties: false
      required: [id, doc_type, version, title, body, content_hash, is_current, effective_date, published_at, placeholders]
      properties:
        id: { type: string, format: uuid }
        doc_type:
          type: string
          enum: [terms_of_service, privacy_policy]
        version: { type: integer }
        title: { type: string }
        body: { type: string }
        content_hash: { type: string }
        is_current: { type: boolean }
        effective_date: { type: string, format: date-time }
        published_at: { type: string, format: date-time }
        published_by: { type: string, format: uuid, nullable: true }
        placeholders:
          type: array
          description: >-
            Unedited-template markers found in this version's body, e.g.
            "[YOUR LEGAL ENTITY]". Always present; empty means the document has
            been filled in. Computed server-side so the console never re-derives
            what counts as a placeholder. Capped at 10 entries.
          items: { type: string }
    AdminLegalVersion:
      type: object
      additionalProperties: false
      required: [doc_type, version, title, is_current, published_at]
      properties:
        doc_type:
          type: string
          enum: [terms_of_service, privacy_policy]
        version: { type: integer }
        title: { type: string }
        is_current: { type: boolean }
        published_at: { type: string, format: date-time }
    AdminLegalDocumentsResponse:
      type: object
      additionalProperties: false
      required: [documents, history]
      properties:
        documents:
          type: array
          items:
            $ref: '#/components/schemas/AdminLegalDocument'
        history:
          type: array
          items:
            $ref: '#/components/schemas/AdminLegalVersion'
    PublishLegalDocumentRequest:
      type: object
      additionalProperties: false
      required: [doc_type, title, body]
      properties:
        doc_type:
          type: string
          enum: [terms_of_service, privacy_policy]
        title: { type: string }
        body: { type: string }
        acknowledge_placeholders:
          type: boolean
          default: false
          description: >-
            Publish a body that still contains "[BRACKETED]" template markers.
            Without it such a body is rejected with 422. The console sets it
            only after an explicit confirmation naming what was found.
    LegalPlaceholderRejection:
      type: object
      additionalProperties: false
      required: [error, placeholders]
      properties:
        error: { type: string }
        placeholders:
          type: array
          description: The distinct markers found, capped at 10.
          items: { type: string }
    LegalAcceptanceRow:
      type: object
      additionalProperties: false
      required: [tenant_id, tenant_name, user_id, user_email, doc_type, version, accepted_at]
      properties:
        tenant_id: { type: string, format: uuid }
        tenant_name: { type: string }
        user_id: { type: string, format: uuid }
        user_email: { type: string }
        doc_type: { type: string }
        version: { type: integer }
        accepted_at: { type: string, format: date-time }
        accepted_ip: { type: string, nullable: true }
    LegalAcceptanceListResponse:
      type: object
      additionalProperties: false
      required: [acceptances]
      properties:
        acceptances:
          type: array
          items:
            $ref: '#/components/schemas/LegalAcceptanceRow'

    # --- Platform identity providers ---------------------------------
    PlatformIdentityProvider:
      type: object
      required: [id, provider_type, provider_name, purpose, client_id, has_secret, auth_url, token_url, scopes, is_enabled, allowed_email_domains]
      properties:
        id: { type: string, format: uuid }
        provider_type: { type: string, enum: [google, microsoft] }
        provider_name: { type: string }
        purpose:
          type: string
          enum: [signup, admin_login]
          description: "signup = Vista's app for tenant founders (#895); admin_login = staff sign-in to admin-ui (#899)."
        client_id: { type: string }
        has_secret: { type: boolean, description: "Whether a client secret is stored. The secret itself is never returned." }
        auth_url: { type: string }
        token_url: { type: string }
        userinfo_url: { type: string }
        scopes: { type: string }
        is_enabled: { type: boolean }
        allowed_email_domains:
          type: array
          items: { type: string }
          description: "Admin-login Microsoft providers only. Microsoft Entra omits email_verified from userinfo; a staff sign-in whose email domain exactly matches an entry (ASCII, case-insensitive, no subdomains) is accepted as organisation-verified, but only while auth_url and token_url name a single Entra directory (not common, organizations, consumers or the personal-account directory 9188040d-6c67-4c5b-b112-36a304b66dad). Empty = the IdP must assert email_verified. Always an array."
    PlatformIdentityProviderListResponse:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          items: { $ref: '#/components/schemas/PlatformIdentityProvider' }
    PlatformIdentityProviderInput:
      type: object
      required: [provider_type, client_id]
      properties:
        provider_type: { type: string, enum: [google, microsoft], description: "Immutable on update." }
        provider_name: { type: string }
        purpose: { type: string, enum: [signup, admin_login], description: "Defaults to signup; immutable on update." }
        client_id: { type: string }
        client_secret: { type: string, description: "Write-only; blank on update keeps the stored secret." }
        auth_url: { type: string }
        token_url: { type: string }
        userinfo_url: { type: string }
        scopes: { type: string }
        is_enabled: { type: boolean }
        allowed_email_domains:
          type: array
          maxItems: 50
          items: { type: string }
          description: "Exact email domains (e.g. example.com; punycode for internationalised domains). Trimmed, lower-cased and de-duplicated on save. Refused (400) for wildcards, email addresses, trailing dots, non-ASCII, a Google or sign-up provider, or a Microsoft provider whose auth_url/token_url use a multi-tenant authority (common, organizations, consumers). Omitted on update keeps the stored list; [] clears it."
    StaffSsoProvider:
      type: object
      required: [provider_type, provider_name]
      properties:
        provider_type: { type: string, enum: [google, microsoft] }
        provider_name: { type: string }
    StaffSsoProvidersResponse:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          items: { $ref: '#/components/schemas/StaffSsoProvider' }
    CreatedIdResponse:
      type: object
      required: [id]
      properties:
        id: { type: string, format: uuid }
        message: { type: string }
    Invoice:
      type: object
      additionalProperties: false
      description: 'A tenant invoice row. The five timestamp fields and pdf_url are always present but null when unset (the handler seeds them to null, then fills RFC3339 strings when the DB value is valid).'
      required:
      - id
      - invoice_number
      - external_invoice_id
      - amount_cents
      - currency
      - status
      - issued_at
      - due_at
      - paid_at
      - period_start
      - period_end
      - pdf_url
      properties:
        id:
          type: string
        invoice_number:
          type: string
        external_invoice_id:
          type: string
        amount_cents:
          type: integer
        currency:
          type: string
        status:
          type: string
        issued_at:
          type: [string, 'null']
          format: date-time
        due_at:
          type: [string, 'null']
          format: date-time
        paid_at:
          type: [string, 'null']
          format: date-time
        period_start:
          type: [string, 'null']
          format: date-time
        period_end:
          type: [string, 'null']
          format: date-time
        pdf_url:
          type: [string, 'null']
    InvoiceListResponse:
      type: object
      additionalProperties: false
      description: 'CURRENT envelope for GET /my-billing/invoices. `invoices` is null when there are no rows (the handler returns a nil slice).'
      required:
      - invoices
