openapi: 3.1.0
info:
  title: Vista Platform — admin-service API
  version: 0.1.0
  description: |
    Spec-first contract for admin-service (ADR-0001). First slice for this
    service, covering the **tenant self-service billing** surface (`/my-billing`)
    — the Settings → Billing page a Tenant Admin uses to view invoices and their
    subscription, change/cancel/reactivate plan, manage the payment method, see
    an active discount, and open the Stripe-hosted billing portal. UI consumer:
    `web-ui/src/services/billing-api.ts`.

    ## Testability note

    These handlers were free functions taking `*sql.DB` and running SQL inline.
    This slice landed a behaviour-preserving repo extraction first: every query
    moved verbatim into a `tenantBillingStore` interface + `tenantBillingRepository`
    (`services/admin-service/internal/handlers/tenant_billing_repository.go`),
    and the handlers now depend on that interface plus the existing
    `billing.TenantBillingStripe` interface. So the real gin handlers run over
    httptest with in-memory stubs — no database, no live Stripe. See the Go
    contract test
    (`services/admin-service/internal/handlers/tenant_billing_contract_test.go`).

    The one exception is `POST /payment-method/setup`: it never queries the DB
    directly, only hands `*sql.DB` to `stripeProvider.CreateSetupIntent`, so it
    keeps a `*sql.DB` parameter and is still stub-tested with a nil db + a stub
    Stripe provider.

    ## Shape status

    These document the current pre-envelope shapes — bare `gin.H` maps, lists
    wrapped under their resource key (and nullable when the underlying slice is
    nil), errors as a single string under `error`. They predate the ADR-0002
    response envelope and are pinned here as-is so drift is caught.
servers:
  - url: /api/v1/admin-service
    description: Via the API gateway (JWT auth, tenant from token), tenant-scoped.
paths:
  /my-billing/invoices:
    get:
      operationId: listTenantInvoices
      x-edition: enterprise
      tags:
      - my-billing
      summary: List the tenant's invoices
      parameters:
      - name: limit
        in: query
        required: false
        description: Page size (1–100, default 20).
        schema:
          type: integer
      - name: offset
        in: query
        required: false
        description: Row offset (default 0).
        schema:
          type: integer
      - name: status
        in: query
        required: false
        description: Filter by invoice status (e.g. paid).
        schema:
          type: string
      responses:
        '200':
          description: The tenant's invoices.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceListResponse'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '404':
          $ref: '#/components/responses/BillingNotMSP'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /my-billing/invoices/{invoice_id}/download:
    get:
      operationId: downloadTenantInvoice
      x-edition: enterprise
      tags:
      - my-billing
      summary: Redirect to an invoice PDF
      parameters:
      - name: invoice_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '302':
          description: Redirect to the invoice PDF URL (no body).
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '404':
          $ref: '#/components/responses/BillingNotMSP'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /billing/setup-intent:
    post:
      operationId: createBillingSetupIntent
      x-edition: enterprise
      tags:
      - billing-onboarding
      summary: Create a Stripe SetupIntent to collect a payment method
      description: 'First step of tenant checkout (#1001): creates (or reuses) the tenant''s Stripe customer and returns a SetupIntent client_secret for PaymentElement, plus the publishable key. Tenant-authenticated (billing.update); the body tenant_id must match the authenticated tenant (403 otherwise).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSetupIntentRequest'
      responses:
        '200':
          description: SetupIntent created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupIntentResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '403':
          $ref: '#/components/responses/LegacyForbidden'
        '404':
          $ref: '#/components/responses/BillingNotMSP'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /billing/subscriptions:
    post:
      operationId: createBillingSubscription
      x-edition: enterprise
      tags:
      - billing-onboarding
      summary: Create the Stripe subscription after payment-method confirmation
      description: 'Second step of tenant checkout (#1001): creates the Stripe subscription on the tier''s monthly or annual Price (PaymentBehavior=default_incomplete), persists it locally with a fresh 12-month contract term, and updates the tenant''s tier. When the response carries requires_action=true, the client must confirm the returned client_secret (3DS/SCA) to activate. 400 when the tier has no Stripe Price for the requested interval or the coupon code is invalid/expired/exhausted; 403 when tenant_id doesn''t match the authenticated tenant.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubscriptionRequest'
      responses:
        '200':
          description: Subscription created (may require client-side payment confirmation).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSubscriptionResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '403':
          $ref: '#/components/responses/LegacyForbidden'
        '404':
          $ref: '#/components/responses/BillingNotMSP'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /billing/subscriptions/{subscription_id}:
    get:
      operationId: getBillingSubscriptionStatus
      x-edition: enterprise
      tags:
      - billing-onboarding
      summary: Get the status of the authenticated tenant's subscription by external id
      description: 'Checkout status poll. Scoped to the authenticated tenant — another tenant''s subscription id returns 404.'
      parameters:
      - name: subscription_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Subscription status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingSubscriptionStatus'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '404':
          $ref: '#/components/responses/BillingNotMSP'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /my-billing/subscription:
    get:
      operationId: getTenantSubscription
      x-edition: enterprise
      tags:
      - my-billing
      summary: Get the tenant's subscription, tier, next payment and discount
      responses:
        '200':
          description: Subscription + tier details (with optional next_payment and nullable discount).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '404':
          $ref: '#/components/responses/BillingNotMSP'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /my-billing/subscription/change-plan:
    post:
      operationId: changeTenantPlan
      x-edition: enterprise
      tags:
      - my-billing
      summary: Change the subscription tier / billing interval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePlanRequest'
      responses:
        '200':
          description: The updated subscription summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangePlanResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '404':
          $ref: '#/components/responses/BillingNotMSP'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /my-billing/subscription/cancel:
    post:
      operationId: cancelTenantSubscription
      x-edition: enterprise
      tags:
      - my-billing
      summary: Cancel the subscription at period end
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelSubscriptionRequest'
      responses:
        '200':
          description: 'Scheduled to cancel at period end — `{ "cancel_at": ..., "message": "..." }`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '404':
          $ref: '#/components/responses/BillingNotMSP'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /my-billing/subscription/reactivate:
    post:
      operationId: reactivateTenantSubscription
      x-edition: enterprise
      tags:
      - my-billing
      summary: Clear a pending cancellation
      responses:
        '200':
          description: 'Reactivated — `{ "status": "active", "message": "..." }`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReactivateResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '404':
          $ref: '#/components/responses/BillingNotMSP'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /my-billing/payment-method/setup:
    post:
      operationId: setupTenantPaymentMethod
      x-edition: enterprise
      tags:
      - my-billing
      summary: Create a Stripe SetupIntent for adding a payment method
      responses:
        '200':
          description: The SetupIntent client secret + publishable key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupIntentResponse'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '404':
          $ref: '#/components/responses/BillingNotMSP'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /my-billing/payment-method/confirm:
    post:
      operationId: confirmTenantPaymentMethod
      x-edition: enterprise
      tags:
      - my-billing
      summary: Set a confirmed payment method as the subscription default
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmPaymentMethodRequest'
      responses:
        '200':
          description: 'Set — `{ "success": true, ...card details when available }`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmPaymentMethodResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '404':
          $ref: '#/components/responses/BillingNotMSP'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /my-billing/payment-methods:
    get:
      operationId: listTenantPaymentMethods
      x-edition: enterprise
      tags:
      - my-billing
      summary: List the tenant's saved payment methods
      responses:
        '200':
          description: The tenant's payment methods (empty array when no Stripe customer; null when none returned).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethodListResponse'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '404':
          $ref: '#/components/responses/BillingNotMSP'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /my-billing/active-discount:
    get:
      operationId: getTenantActiveDiscount
      x-edition: enterprise
      tags:
      - my-billing
      summary: Get the tenant's active discount (if any)
      responses:
        '200':
          description: 'The active discount, or `{ "discount": null }` when none.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveDiscountResponse'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '404':
          $ref: '#/components/responses/BillingNotMSP'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /my-billing/portal-session:
    post:
      operationId: createTenantPortalSession
      x-edition: enterprise
      tags:
      - my-billing
      summary: Open a Stripe-hosted billing portal session
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortalSessionRequest'
      responses:
        '200':
          description: 'The portal redirect URL — `{ "url": "..." }`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalSessionResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '404':
          $ref: '#/components/responses/BillingNotMSP'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /admin/roles:
    get:
      operationId: listPlatformRoles
      tags:
      - platform-rbac
      summary: List platform roles
      description: 'Platform RBAC management (admin-ui Roles page). Each role carries its permission names and a user count. `roles` is null when there are no roles (the handler returns a nil slice).'
      responses:
        '200':
          description: The platform roles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleListResponse'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '500':
          $ref: '#/components/responses/LegacyServerError'
    post:
      operationId: createPlatformRole
      tags:
      - platform-rbac
      summary: Create a platform role
      description: 'Creates an empty custom role — a new role never carries permissions; they are set with PUT /admin/roles/{id}/permissions, which enforces that the caller holds every permission granted.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleRequest'
      responses:
        '201':
          description: 'The created role id — `{ "message": "...", "role_id": "..." }`. The handler returns only the id, not a full role object; admin-ui''s rolesApi.createRole type matches this shape and the create flow refetches the roles list on success.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateRoleResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /admin/roles/{id}:
    get:
      operationId: getPlatformRole
      tags:
      - platform-rbac
      summary: Get a platform role
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The platform role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleDetailResponse'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '404':
          $ref: '#/components/responses/LegacyNotFound'
        '500':
          $ref: '#/components/responses/LegacyServerError'
    put:
      operationId: updatePlatformRole
      tags:
      - platform-rbac
      summary: Update a platform role
      description: 'Partial update of display_name and/or description. Returns 400 when neither field is supplied or the id is not a UUID; 404 for an unknown role. The caller must hold every permission the role grants (403 with `missing_permissions`), and only a super_admin may change a system role''s display_name (403; re-sending the current name is not a change).'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoleRequest'
      responses:
        '200':
          description: 'Update acknowledged — `{ "message": "..." }`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '403':
          $ref: '#/components/responses/PlatformPermissionDenied'
        '404':
          $ref: '#/components/responses/LegacyNotFound'
        '500':
          $ref: '#/components/responses/LegacyServerError'
    delete:
      operationId: deletePlatformRole
      tags:
      - platform-rbac
      summary: Delete a platform role
      description: 'System roles cannot be deleted (400); a non-UUID id is also 400. A missing role surfaces as 404 (the system-role check fails to find it). The caller must hold every permission the role grants (403 with `missing_permissions`).'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 'Delete acknowledged — `{ "message": "..." }`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '403':
          $ref: '#/components/responses/PlatformPermissionDenied'
        '404':
          $ref: '#/components/responses/LegacyNotFound'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /admin/roles/{id}/permissions:
    put:
      operationId: setPlatformRolePermissions
      tags:
      - platform-rbac
      summary: Set a platform role's permissions
      description: 'Replaces the role''s permission set with the supplied permission ids (an empty array clears all). System roles are immutable — modifying one returns 403. A missing role returns 404. The role id and every permission id must be a UUID (400 otherwise); ids are compared and written in canonical form and duplicates collapse. Otherwise the caller may not edit their own role (403), may not edit a role whose current permissions include one they lack (403 with `missing_permissions`), and may not set permissions they lack (403 with `missing_permissions`).'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetRolePermissionsRequest'
      responses:
        '200':
          description: 'The role''s resulting permission ids — `{ "permission_ids": [...] }`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetRolePermissionsResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '403':
          $ref: '#/components/responses/PlatformPermissionDenied'
        '404':
          $ref: '#/components/responses/LegacyNotFound'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /admin/permissions:
    get:
      operationId: listPlatformPermissions
      tags:
      - platform-rbac
      summary: List platform permissions
      description: 'The full platform permission catalog. `permissions` is null when there are none (nil slice). `updated_at` is always present but is the zero time when the row''s value is not selected.'
      responses:
        '200':
          description: The platform permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionListResponse'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /admin/permissions/{id}:
    get:
      operationId: getPlatformPermission
      tags:
      - platform-rbac
      summary: Get a platform permission
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The platform permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionDetailResponse'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '404':
          $ref: '#/components/responses/LegacyNotFound'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /admin/user/permissions:
    get:
      operationId: getCurrentUserPermissions
      tags:
      - platform-rbac
      summary: List the authenticated platform user's permissions
      description: 'The effective permissions of the current platform admin (resolved from their role). Same `{ "permissions": [...] }` shape as the catalog list. The user id comes from the auth context; a missing/invalid context yields 401.'
      responses:
        '200':
          description: The current user's permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionListResponse'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /admin/billing/trials:
    get:
      operationId: listTrials
      x-edition: enterprise
      tags:
      - trials
      summary: List live trials (Billing → Trials)
      description: 'Every unconverted billing_trial_tracking row — the one trial store — on a plan the MSP marked is_trial, for an undeleted tenant, soonest to end first. A trial row left on any other plan is not a trial and is not listed. `phase`, `days_remaining` and `ends_at` come from shared/trials, the computation the trial lock and the tenant trial banner use.'
      responses:
        '200':
          description: The live trials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrialListResponse'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '404':
          $ref: '#/components/responses/BillingNotMSP'
        '500':
          $ref: '#/components/responses/LegacyServerError'
    post:
      operationId: startTrial
      x-edition: enterprise
      tags:
      - trials
      summary: Start a trial (Billing → Trials → Start trial)
      description: 'Writes the billing_trial_tracking row for a tenant already on a plan the MSP marked is_trial; payment_status ''trial'' follows it. Refused with 409 when the tenant''s plan is not a trial plan or the tenant already has a trial row, and with 400 when `duration` is shorter than the plan''s full + soft trial days. Recorded in the platform audit log (billing.trial_created).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartTrialRequest'
      responses:
        '200':
          description: The trial was started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrialActionResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '404':
          $ref: '#/components/responses/BillingNotMSP'
        '409':
          $ref: '#/components/responses/LegacyConflict'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /admin/billing/trials/end-landing:
    get:
      operationId: getTrialEndLanding
      x-edition: enterprise
      tags:
      - trials
      summary: Where an ended trial lands (Billing → Trials → End trial dialog)
      description: 'What ending a trial does right now — the same query End trial and the expiry sweep run, so the dialog states what will happen. A trial that ends moves the tenant to the MSP''s Free plan: an active, public, card-billed plan called Free (name or display name) that costs nothing monthly or annually and is not a trial, custom, private or deprecated plan; with several, the one named `free`, then the lowest display order, then name. With none defined the tenant is suspended (`suspended: true`). A failed lookup is a 500, never a guess.'
      responses:
        '200':
          description: The landing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrialEndLanding'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '404':
          $ref: '#/components/responses/BillingNotMSP'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /admin/billing/trials/tenants/{tenant_id}/extend:
    post:
      operationId: extendTrial
      x-edition: enterprise
      tags:
      - trials
      summary: Extend a live trial (Billing → Trials → Extend)
      description: 'Moves the date the trial locks (`ends_at` in the list — the later of start + the plan''s full and soft days and trial_end) `additional_days` later, counted from that date, or from now when the trial has already locked. A Stripe trialing subscription gets the same trial end. 404 when the tenant has no unconverted trial on a trial plan. Recorded in the platform audit log (billing.trial_extended).'
      parameters:
      - name: tenant_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtendTrialRequest'
      responses:
        '200':
          description: The trial was extended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrialActionResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
