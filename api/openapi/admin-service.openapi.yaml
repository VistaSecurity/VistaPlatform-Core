    put:
      operationId: updatePlatformSettings
      tags:
      - platform-settings
      summary: Update platform-wide settings
      description: |
        Partial update: only the provided fields are persisted. The route needs
        platform.settings. Writing any of the keys that shape how staff
        authenticate or where their password-reset and invitation email goes —
