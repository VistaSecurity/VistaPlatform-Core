    PlatformEditionCapabilities:
      type: object
      additionalProperties: false
      required:
      - msp
      - billing
      properties:
        msp:
          type: boolean
          description: |
            True when the multi-tenant management plane is mounted:
            /admin/tenants/**, /admin/stats/**, /admin/dashboard/**,
            /admin/costs/**, /admin/announcements,
            /admin/support-tickets, /admin/legal/acceptances.
        billing:
          type: boolean
          description: |
            True when the Enterprise billing surface is mounted:
            /admin/billing/** and /admin/tenants/{id}/billing.
    TenantPlan:
      type: object
      additionalProperties: false
      description: |
        The resolved plan block (shared/entitlements.PlanFor). Core: "Vista
        Platform Core". Enterprise: "Vista Platform Enterprise" with the
        licensee and licence expiry — never a tier name, never a trial. MSP:
        the tier's display name (the MSP's own plan) and, when that plan is a
        trial with an end date, `trial`. No trial is the ABSENT key, not null.
      required:
      - edition
      - display_name
      - licensee
      - expires_at
      properties:
        edition:
          type: string
          enum: [core, enterprise, msp]
        display_name:
          type: string
        licensee:
          type: [string, 'null']
        expires_at:
          type: [string, 'null']
          format: date-time
          description: The licence expiry; null on Core.
        trial:
          type: object
          additionalProperties: false
          required: [ends_at]
          properties:
            ends_at:
              type: string
              format: date-time
    LicenseInfo:
      type: object
      additionalProperties: false
      description: GET /admin/license. Never carries the token or its hash.
      required:
      - edition
      - display_name
      - status
      - licensed_edition
      - licensee
      - subject
      - issued_at
      - expires_at
      - days_left
      - max_tenants
      - grace_days
      - verified_at
      - install_id
      - bound_install_id
      properties:
        edition:
          type: string
          enum: [core, enterprise, msp]
          description: What the install runs as now (an expired licence is core).
        display_name:
          type: string
        status:
          type: string
          enum: [none, active, expired]
        licensed_edition:
          type: [string, 'null']
          description: The edition the recorded licence names, even when expired.
        licensee:
          type: [string, 'null']
        subject:
          type: [string, 'null']
        issued_at:
          type: [string, 'null']
          format: date-time
        expires_at:
          type: [string, 'null']
          format: date-time
        days_left:
          type: [integer, 'null']
          minimum: 0
          description: Whole days until expiry, rounded up.
        max_tenants:
          type: [integer, 'null']
          description: MSP soft cap on tenants; null = not set by the licence.
        grace_days:
          type: [integer, 'null']
        verified_at:
          type: [string, 'null']
          format: date-time
        install_id:
          type: [string, 'null']
          description: This installation's id (platform_install).
        bound_install_id:
          type: [string, 'null']
          description: The install id the licence carries, if any.
    RetentionSetting:
      type: object
      additionalProperties: false
      required: [max_days, applies]
      properties:
        max_days:
          type: [integer, 'null']
          minimum: 1
          maximum: 36500
          description: The cap in days; null = unlimited.
        applies:
          type: boolean
          description: True only on an active Enterprise licence.
    RetentionSettingInput:
      type: object
      additionalProperties: false
      required: [max_days]
      properties:
        max_days:
          type: [integer, 'null']
          minimum: 1
          maximum: 36500
    TenantFeatures:
      type: object
      additionalProperties: false
      required: [tenant_id, edition, switchable, features]
      properties:
        tenant_id:
          type: string
          format: uuid
        edition:
          type: string
          enum: [core, enterprise, msp]
        switchable:
          type: boolean
          description: Whether per-tenant switches are accepted (Enterprise only).
        features:
          type: array
          items:
            $ref: '#/components/schemas/TenantFeature'
    TenantFeature:
      type: object
      additionalProperties: false
      required: [key, display_name, description, enabled, source, switched_off, reason]
      properties:
        key:
          type: string
        display_name:
          type: string
        description:
          type: [string, 'null']
        enabled:
          type: boolean
          description: What the resolver answers for this tenant.
        source:
          type: string
          enum: [edition, override, tier, default]
        switched_off:
          type: boolean
          description: A platform admin switched this off for this tenant.
        reason:
          type: [string, 'null']
          description: The switch's reason, without the "operator:" prefix.
    TenantFeatureSwitch:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled:
          type: boolean
        reason:
          type: string
          maxLength: 500
          description: Required when switching off.
    PlatformEditionResponse:
      type: object
      additionalProperties: false
      required:
      - edition
      - capabilities
      - license_edition
      properties:
        edition:
          type: string
          enum: [core, enterprise]
          description: Coarse build edition. Gate on `capabilities`, not on this.
        capabilities:
          $ref: '#/components/schemas/PlatformEditionCapabilities'
        license_edition:
          type: [string, 'null']
          enum: [core, enterprise, msp, null]
          description: |
            What the install is LICENSED as now (platform_license; an expired
            licence is core). The build cannot tell Enterprise from MSP — one
            ee binary serves both — so the console hides Plans & Pricing on
            Enterprise and Billing unless MSP on this. Null when the licence
            could not be read; treat as unknown and fail open.
    # --- platform-auth session surface (admin-ui-v2 ADR-0002) ---
