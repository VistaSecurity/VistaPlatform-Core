  /admin/catalogs/classification-rules/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getClassificationRule
      tags:
      - catalogs
      summary: Get one classification rule
      description: 'Returns the rule directly (not wrapped). Gated by `catalogs.manage`.'
      responses:
        '200':
          description: The rule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassificationRule'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '403':
          $ref: '#/components/responses/LegacyForbidden'
        '404':
          $ref: '#/components/responses/LegacyNotFound'
        '500':
          $ref: '#/components/responses/LegacyServerError'
    put:
      operationId: updateClassificationRule
      tags:
      - catalogs
      summary: Replace a classification rule
      description: |
        Replaces the rule. Every field is restated: this is a PUT, so omitting an
        optional field CLEARS it. That is deliberate — clearing a class is how an
        admin turns a rule that guessed into a rule that only names a vendor, and
        a partial update could not express it.

        Validated exactly as create is. 409 means the new `(rule_kind, pattern)`
        pair belongs to a different rule.

        Editing a SHIPPED rule sticks (decision 4, RC-12): the rule becomes the
        admin's (`admin_modified`), upgrades no longer restate it, and a later
        shipped change to it arrives as an offer (`update_available`,
        `offered_update`) accepted with `POST .../{id}/accept-update`. Rules you
        ADD are never touched by a seed run.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassificationRuleInput'
      responses:
        '200':
          description: The updated rule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassificationRule'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '403':
          $ref: '#/components/responses/LegacyForbidden'
        '404':
          $ref: '#/components/responses/LegacyNotFound'
        '409':
          $ref: '#/components/responses/LegacyConflict'
        '500':
          $ref: '#/components/responses/LegacyServerError'
    delete:
      operationId: deleteClassificationRule
      tags:
      - catalogs
      summary: Delete a classification rule
      description: |
        Removes the rule. A hard delete: a classification rule is a lookup row,
        not a record of something that happened, and a soft-deleted one would
        have to be filtered out of the classifier's load — one more place for a
        rule to be silently absent.

        Class proposals already made from it are unaffected. A proposal carries a
        COPY of the rules that matched, precisely so a reviewer can still see the
        argument after the rule is gone.

        Deleting a SHIPPED rule sticks: the deletion is remembered, and upgrades
        do not put the rule back (decision 4, RC-12). Gated by `catalogs.manage`.
      responses:
        '200':
          description: The rule was deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '403':
          $ref: '#/components/responses/LegacyForbidden'
        '404':
          $ref: '#/components/responses/LegacyNotFound'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /admin/catalogs/classification-rules/{id}/accept-update:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: acceptClassificationRuleUpdate
      tags:
      - catalogs
      summary: Accept the shipped update offered for a classification rule
      description: |
        Upgrades keep a platform admin's edits to the rules the platform ships,
        and store a new shipped value for an edited rule as an offer instead of
        writing it (decision 4, RC-12). This applies the offer
        (`offered_update`) and clears it. The rule stays the admin's, so a later
        shipped change is offered again rather than applied. Audited
        (`classification_rule.update_accepted`, with the values before and
        after). Gated by `catalogs.manage`. 400 when `id` is not a UUID.
      responses:
        '200':
          description: The rule as it now stands.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassificationRule'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '403':
          $ref: '#/components/responses/LegacyForbidden'
        '404':
          $ref: '#/components/responses/LegacyNotFound'
        '409':
          $ref: '#/components/responses/LegacyConflict'
        '500':
          $ref: '#/components/responses/LegacyServerError'
