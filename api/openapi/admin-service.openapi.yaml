components:
  responses:
    LegacyBadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyError'
    LegacyUnauthorized:
      description: Missing or invalid tenant/auth context.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyError'
    LegacyForbidden:
      description: Authenticated but lacking the required platform permission.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyError'
    LegacyNotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyError'
    LegacyServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyError'
    LegacyConflict:
      description: Conflicting state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyError'
  schemas:
    # --- Legal documents (Terms of Service / Privacy Policy) ----------------
    AdminLegalDocument:
      type: object
      additionalProperties: false
      required: [id, doc_type, version, title, body, content_hash, is_current, effective_date, published_at]
      properties:
        id: { type: string, format: uuid }
        doc_type:
          type: string
          enum: [terms_of_service, privacy_policy]
        version: { type: integer }
        title: { type: string }
        body: { type: string }
        content_hash: { type: string }
        is_current: { type: boolean }
        effective_date: { type: string, format: date-time }
        published_at: { type: string, format: date-time }
        published_by: { type: string, format: uuid, nullable: true }
    AdminLegalVersion:
      type: object
      additionalProperties: false
      required: [doc_type, version, title, is_current, published_at]
      properties:
        doc_type:
          type: string
          enum: [terms_of_service, privacy_policy]
        version: { type: integer }
        title: { type: string }
        is_current: { type: boolean }
        published_at: { type: string, format: date-time }
    AdminLegalDocumentsResponse:
      type: object
      additionalProperties: false
      required: [documents, history]
      properties:
        documents:
          type: array
          items:
            $ref: '#/components/schemas/AdminLegalDocument'
        history:
          type: array
          items:
            $ref: '#/components/schemas/AdminLegalVersion'
    PublishLegalDocumentRequest:
      type: object
      additionalProperties: false
      required: [doc_type, title, body]
      properties:
        doc_type:
          type: string
          enum: [terms_of_service, privacy_policy]
        title: { type: string }
        body: { type: string }
    LegalAcceptanceRow:
      type: object
      additionalProperties: false
      required: [tenant_id, tenant_name, user_id, user_email, doc_type, version, accepted_at]
      properties:
        tenant_id: { type: string, format: uuid }
        tenant_name: { type: string }
        user_id: { type: string, format: uuid }
        user_email: { type: string }
        doc_type: { type: string }
        version: { type: integer }
        accepted_at: { type: string, format: date-time }
        accepted_ip: { type: string, nullable: true }
    LegalAcceptanceListResponse:
      type: object
      additionalProperties: false
      required: [acceptances]
      properties:
        acceptances:
          type: array
          items:
            $ref: '#/components/schemas/LegalAcceptanceRow'

    # --- Platform identity providers ---------------------------------
    PlatformIdentityProvider:
      type: object
      required: [id, provider_type, provider_name, purpose, client_id, has_secret, auth_url, token_url, scopes, is_enabled]
      properties:
        id: { type: string, format: uuid }
        provider_type: { type: string, enum: [google, microsoft] }
        provider_name: { type: string }
        purpose:
          type: string
          enum: [signup, admin_login]
          description: "signup = Vista's app for tenant founders (#895); admin_login = staff sign-in to admin-ui (#899)."
        client_id: { type: string }
        has_secret: { type: boolean, description: "Whether a client secret is stored. The secret itself is never returned." }
        auth_url: { type: string }
        token_url: { type: string }
        userinfo_url: { type: string }
        scopes: { type: string }
        is_enabled: { type: boolean }
    PlatformIdentityProviderListResponse:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          items: { $ref: '#/components/schemas/PlatformIdentityProvider' }
    PlatformIdentityProviderInput:
      type: object
      required: [provider_type, client_id]
      properties:
        provider_type: { type: string, enum: [google, microsoft], description: "Immutable on update." }
        provider_name: { type: string }
        purpose: { type: string, enum: [signup, admin_login], description: "Defaults to signup; immutable on update." }
        client_id: { type: string }
        client_secret: { type: string, description: "Write-only; blank on update keeps the stored secret." }
        auth_url: { type: string }
        token_url: { type: string }
        userinfo_url: { type: string }
        scopes: { type: string }
        is_enabled: { type: boolean }
    StaffSsoProvider:
      type: object
      required: [provider_type, provider_name]
      properties:
        provider_type: { type: string, enum: [google, microsoft] }
        provider_name: { type: string }
    StaffSsoProvidersResponse:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          items: { $ref: '#/components/schemas/StaffSsoProvider' }
    CreatedIdResponse:
      type: object
      required: [id]
      properties:
        id: { type: string, format: uuid }
        message: { type: string }
    Invoice:
      type: object
      additionalProperties: false
      description: 'A tenant invoice row. The five timestamp fields and pdf_url are always present but null when unset (the handler seeds them to null, then fills RFC3339 strings when the DB value is valid).'
      required:
      - id
      - invoice_number
      - external_invoice_id
      - amount_cents
      - currency
      - status
      - issued_at
      - due_at
      - paid_at
      - period_start
      - period_end
      - pdf_url
      properties:
        id:
          type: string
        invoice_number:
          type: string
        external_invoice_id:
          type: string
        amount_cents:
          type: integer
        currency:
          type: string
        status:
          type: string
        issued_at:
          type: [string, 'null']
          format: date-time
        due_at:
          type: [string, 'null']
          format: date-time
        paid_at:
          type: [string, 'null']
          format: date-time
        period_start:
          type: [string, 'null']
          format: date-time
        period_end:
          type: [string, 'null']
          format: date-time
        pdf_url:
          type: [string, 'null']
    InvoiceListResponse:
      type: object
      additionalProperties: false
      description: 'CURRENT envelope for GET /my-billing/invoices. `invoices` is null when there are no rows (the handler returns a nil slice).'
      required:
      - invoices
      - total
      - limit
      - offset
      properties:
        invoices:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/Invoice'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
    SubscriptionInfo:
      type: object
      additionalProperties: false
      required:
      - external_id
      - status
      - current_period_start
      - current_period_end
      - cancel_at_period_end
      - billing_interval
      - contract_start
      - contract_end
      properties:
        external_id:
          type: string
        status:
          type: string
        current_period_start:
          type: [string, 'null']
          format: date-time
        current_period_end:
          type: [string, 'null']
          format: date-time
        cancel_at_period_end:
          type: boolean
        billing_interval:
          type: string
        contract_start:
          type: [string, 'null']
          format: date-time
          description: 'Start of the current 12-month agreement (#1002). Null on subscriptions predating the contract model until their next renewal seeds a term.'
        contract_end:
          type: [string, 'null']
          format: date-time
          description: 'End of the current 12-month agreement. Cancellation keeps billing/service through this date; the term auto-renews at rollover.'
    TierInfo:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - display_name
      - price_cents
      - annual_price_cents
      - features
      - limits
      properties:
        id:
          type: string
        name:
          type: string
        display_name:
          type: string
        price_cents:
          type: integer
        annual_price_cents:
          type: [integer, 'null']
        features:
          type: object
          additionalProperties: true
        limits:
          type: object
          additionalProperties: true
    NextPayment:
      type: object
      additionalProperties: false
      description: 'Present only when the subscription is active, not cancelling, and has a period end + tier price. `payment_method_last4` appears only when a default PM is on file.'
      required:
      - amount_cents
      - date
      properties:
        amount_cents:
          type: integer
        date:
          type: string
          format: date-time
        payment_method_last4:
          type: string
    Discount:
      type: object
      additionalProperties: false
      description: 'An applied coupon. `expires_at` appears when the redemption has an expiry; `remaining_months` only for repeating-duration coupons.'
      required:
      - coupon_code
      - coupon_name
      - discount_type
      - discount_value
      - duration
      - applied_at
      properties:
        coupon_code:
          type: string
        coupon_name:
          type: string
        discount_type:
          type: string
        discount_value:
          type: integer
        duration:
          type: string
        applied_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        remaining_months:
          type: integer
    SubscriptionResponse:
      type: object
      additionalProperties: false
      description: 'CURRENT envelope for GET /my-billing/subscription. `discount` is always present but null when none; `next_payment` is omitted unless billable.'
      required:
      - subscription
      - tier
      - discount
      properties:
        subscription:
          $ref: '#/components/schemas/SubscriptionInfo'
        tier:
          $ref: '#/components/schemas/TierInfo'
        next_payment:
          $ref: '#/components/schemas/NextPayment'
        discount:
          oneOf:
          - $ref: '#/components/schemas/Discount'
          - type: 'null'
    CreateSetupIntentRequest:
      type: object
      additionalProperties: false
      required:
      - tenant_id
      properties:
        tenant_id:
          type: string
          format: uuid
          description: 'Must equal the authenticated tenant (403 otherwise).'
        tier_id:
          type: string
          format: uuid
          description: 'Optional — the tier the tenant intends to subscribe to (informational).'
    CreateSubscriptionRequest:
      type: object
      additionalProperties: false
      required:
