          type: string
        limit_name:
          type: string
        value:
          description: 'Freeform JSON value.'
        is_permanent:
          type: boolean
        expires_at:
          type: [string, 'null']
          format: date-time
        reason:
          type: string
    TierEntitlementInput:
      type: object
      additionalProperties: true
      description: 'One desired entitlement (services.TierEntitlementInput).'
      required:
        - item_key
        - included_value
