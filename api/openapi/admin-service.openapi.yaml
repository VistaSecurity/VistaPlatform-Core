          additionalProperties: true
        meta:
          type: object
          additionalProperties: true
    TierEntitlement:
      type: object
      additionalProperties: false
      description: |
        One catalog-enriched entitlement row of a tier's composition
        (services.TierEntitlement). `item_unit`/`overage_price_cents`/
        `overage_unit_size` are omitempty; `included_value` is free-form JSON.
      required:
        - item_id
        - item_key
        - item_display_name
        - item_category
        - item_kind
        - included_value
      properties:
        item_id:
          type: string
          format: uuid
        item_key:
          type: string
        item_display_name:
          type: string
        item_category:
          type: string
        item_kind:
          type: string
        item_unit:
          type: string
        included_value: {}
        overage_price_cents:
          type: integer
        overage_unit_size:
          type: integer
    TierEntitlementsResponse:
      type: object
      additionalProperties: false
      description: |
        Envelope for the tier-entitlements endpoints. `entitlements` is null when
        the tier has none, and OMITTED on the PUT path when the post-write
        readback fails (the write still succeeded).
      required:
        - tier_id
      properties:
        tier_id:
          type: string
          format: uuid
        entitlements:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/TierEntitlement'
    TenantEntitlement:
      type: object
      additionalProperties: false
      description: |
        A per-tenant entitlement override ("Plan Exception", ADR-0004) — a single
        billable_item value granted to one tenant, with catalog metadata embedded.
        Plan Exceptions are non-billing: an override is a pure entitlement grant.
      required:
      - id
      - tenant_id
      - item_id
      - item_key
      - item_display_name
      - item_kind
      - override_value
      - effective_from
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        item_id:
          type: string
          format: uuid
        item_key:
          type: string
        item_display_name:
          type: string
        item_kind:
          type: string
        item_unit:
          type: string
        override_value:
          description: 'Freeform JSON keyed by the item kind ({enabled} / {quantity} / {value}).'
        reason:
          type: string
        effective_from:
          type: string
        expires_at:
          type: string
        created_by:
          type: string
          format: uuid
    TenantEntitlementInput:
      type: object
      additionalProperties: true
      description: 'Create/update body for a tenant entitlement override (Plan Exception). Non-billing — reason recommended; expiry optional.'
      required:
      - item_key
      - override_value
      properties:
        item_key:
          type: string
        override_value:
          description: 'Freeform JSON keyed by the item kind.'
        reason:
          type: string
        effective_from:
          type: string
        expires_at:
          type: string
    TenantEntitlementListResponse:
