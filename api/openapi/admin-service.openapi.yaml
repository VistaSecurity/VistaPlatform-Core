        config:
          type: object
          additionalProperties: true
    StorageTestResponse:
      type: object
      additionalProperties: true
      description: >-
        Result of POST /admin/storage/test. The check resolves the AWS integration's
        stored credentials and issues an S3 HeadBucket against the configured bucket,
        so `success` is false (still 200) when the integration is not in a connected
