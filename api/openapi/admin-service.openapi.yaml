        coupon_code:
          type: string
        coupon_name:
          type: string
        discount_type:
          type: string
        discount_value:
          type: integer
        duration:
          type: string
        applied_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        remaining_months:
          type: integer
    SubscriptionResponse:
      type: object
      additionalProperties: false
      description: 'CURRENT envelope for GET /my-billing/subscription. `discount` is always present but null when none; `next_payment` is omitted unless billable.'
