      properties:
        integration_id:
          type: [string, 'null']
        bucket:
          type: string
        region:
          type: string
        enabled:
          type: boolean
    EmailConfig:
      type: object
      additionalProperties: false
      description: 'SMTP delivery settings for outbound platform email. smtp_password is write-only — always empty on read; use smtp_password_set to detect whether one is stored.'
      properties:
        smtp_host:
          type: string
        smtp_port:
          type: string
        smtp_username:
          type: string
        smtp_password:
          type: string
          description: Write-only. Send an empty string to preserve the existing password.
        smtp_password_set:
          type: boolean
          description: Read-only. True when a password is stored.
        from_email:
          type: string
          format: email
        from_name:
          type: string
    PlatformSettings:
      type: object
      additionalProperties: false
      description: |
        Platform-wide configuration (handlers.PlatformSettings). Nullable pointer
        fields are always present (value or null); `platform_logo_url`,
        `platform_login_logo_url`, `platform_favicon_url`, `ui_config`,
        `log_storage_config`, `email_config` are omitempty (present only when set).
      required:
        - platform_name
        - platform_domain
        - admin_ui_base_url
        - support_email
        - max_tenants
        - default_trial_days
        - maintenance_mode
        - registration_enabled
        - block_personal_email_domains
        - email_verification_required
        - admin_email_verification_required
        - password_min_length
        - session_timeout_minutes
        - max_login_attempts
        - lockout_duration_minutes
        - backup_retention_days
        - log_retention_days
        - monitoring_enabled
        - alerting_enabled
        - sso_enabled
        - api_rate_limit
        - file_upload_limit_mb
        - pcap_max_upload_size_mb
        - notification_channels
      properties:
        platform_name:
          type: string
        platform_logo_url:
          type: string
        platform_login_logo_url:
          type: string
        platform_favicon_url:
          type: string
        platform_domain:
          type: string
        admin_ui_base_url:
          type: string
        support_email:
          type: string
        max_tenants:
          type: [integer, 'null']
        default_trial_days:
          type: [integer, 'null']
        maintenance_mode:
          type: [boolean, 'null']
        registration_enabled:
          type: [boolean, 'null']
        block_personal_email_domains:
          type: [boolean, 'null']
          description: |
            When true, signup rejects consumer email domains (gmail, outlook, …).
            Default false so self-hosted Core operators can register with a personal
            address. Hosted SaaS offerings should set this true.
        email_verification_required:
          type: [boolean, 'null']
        admin_email_verification_required:
          type: [boolean, 'null']
        password_min_length:
          type: [integer, 'null']
        session_timeout_minutes:
          type: [integer, 'null']
        max_login_attempts:
          type: [integer, 'null']
        lockout_duration_minutes:
          type: [integer, 'null']
        backup_retention_days:
          type: [integer, 'null']
        log_retention_days:
          type: [integer, 'null']
        monitoring_enabled:
          type: [boolean, 'null']
        alerting_enabled:
          type: [boolean, 'null']
        sso_enabled:
          type: [boolean, 'null']
        api_rate_limit:
          type: [integer, 'null']
        file_upload_limit_mb:
          type: [integer, 'null']
        pcap_max_upload_size_mb:
          type: [integer, 'null']
        notification_channels:
          type: [array, 'null']
          items:
            type: string
        ui_config:
          $ref: '#/components/schemas/UIConfig'
        log_storage_config:
          $ref: '#/components/schemas/LogStorageConfig'
        email_config:
          $ref: '#/components/schemas/EmailConfig'
    PlatformSettingsInput:
      type: object
      additionalProperties: true
      description: 'Body for PUT /admin/settings (handlers.PlatformSettings). All fields optional; only provided ones are persisted.'
    UpdatePlatformSettingsResponse:
      type: object
      additionalProperties: false
      description: 'Response for PUT /admin/settings — confirmation message + the merged settings.'
      required:
        - message
        - settings
      properties:
        message:
          type: string
        settings:
          $ref: '#/components/schemas/PlatformSettings'
    UploadPlatformBrandingResponse:
      type: object
      additionalProperties: false
      description: 'Response for POST /admin/branding/upload — the stored asset URL + echoed type.'
      required:
        - url
        - type
        - message
      properties:
        url:
          type: string
          description: The persisted asset URL (S3 or /uploads/platform-branding/*).
        type:
          type: string
          enum: [logo, login_logo, favicon]
        message:
          type: string
    TenantsStatsResponse:
      type: object
      additionalProperties: false
      description: 'Envelope `{ "tenants_stats": [...] }`. Null when there are no tenants.'
      required:
        - tenants_stats
      properties:
        tenants_stats:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/TenantStats'
    SystemLogsResponse:
      type: object
