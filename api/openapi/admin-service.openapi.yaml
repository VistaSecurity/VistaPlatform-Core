        backup_retention_days:
          type: [integer, 'null']
        log_retention_days:
          type: [integer, 'null']
        monitoring_enabled:
          type: [boolean, 'null']
        alerting_enabled:
          type: [boolean, 'null']
        sso_enabled:
          type: [boolean, 'null']
        api_rate_limit:
          type: [integer, 'null']
        file_upload_limit_mb:
          type: [integer, 'null']
