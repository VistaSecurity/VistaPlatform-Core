          format: date-time
          description: 'Start of the current 12-month agreement (#1002). Null on subscriptions predating the contract model until their next renewal seeds a term.'
        contract_end:
          type: [string, 'null']
          format: date-time
          description: 'End of the current 12-month agreement. Cancellation keeps billing/service through this date; the term auto-renews at rollover.'
