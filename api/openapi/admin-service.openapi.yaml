        item_display_name:
          type: string
        item_category:
          type: string
        item_kind:
          type: string
        item_unit:
          type: string
        included_value: {}
        overage_price_cents:
          type: integer
        overage_unit_size:
          type: integer
    TierEntitlementsResponse:
      type: object
      additionalProperties: false
