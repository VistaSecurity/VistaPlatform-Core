    post:
      operationId: publishLegalDocument
      tags:
      - platform-settings
      summary: Publish a new version of a legal document
      description: Publishes a NEW immutable version — the previously current version is demoted, never mutated, so prior acceptances stay pinned to the exact accepted text.
