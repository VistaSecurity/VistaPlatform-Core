    # --- Platform catalogues: end-of-life + vulnerability (ADR-0005 D3) -----
    EolLookupRequest:
      type: object
      additionalProperties: false
      description: 'A vendor/product/version to resolve against the platform catalogues.'
      required:
      - product
      properties:
        product_kind:
          type: string
          enum: [os, software, hardware]
          description: >-
            Narrows the search. Omit it and every kind is searched, with the
            fact key derived from the kind of the row that MATCHED — which is
            wider and more honest than placing the subject before looking.
        vendor:
          type: string
          description: >-
            Optional. A vendor named here must agree with a vendor named on the
            catalogue row; a vendor named on neither side cannot contradict one,
            because NULL on a catalogue row means unknown and not "none".
        product: { type: string }
        version:
          type: string
          description: >-
            Optional. The cycle is chosen from this version's numeric
            components, most specific first (22.04.3 → "22.04.3", then "22.04",
            then "22"). An empty version resolves only where the product has
            exactly one row, because then there is nothing to choose between.
    EolFact:
      type: object
      additionalProperties: false
      description: >-
        One resolved fact and its ADR-0008 D4.1 provenance. All four provenance
        fields are on the wire: the claim this feature makes is that an answer
        says where it came from, and a response missing source_ref would show a
        date with no way back to the row that stated it.
      required:
      - key
      - value
      - source_url
      - source_kind
      - source_ref
      - confidence
      properties:
        key:
          type: string
          description: 'The fact key — eol.os.date, eol.sw.date, eol.hw.date, or sw.cpe.'
        value: {}
        source_url:
          type: string
          description: 'The citation. Never empty: an uncited fact is commentary and is not returned.'
        source_kind:
          type: string
          enum: [measured, imported, declared, inferred]
          description: >-
            "imported" for a catalogue lookup — the value was READ out of a row
            a mirror imported, and calling it inferred would understate its
            provenance as badly as the reverse overstates.
        source_ref:
          type: string
          description: 'What said it — "catalog:eol:<row id>" or "catalog:vulnerability_match:<cve id>".'
        confidence:
          type: number
          description: '0 for a catalogue lookup: it made no estimate.'
        model_id:
          type: string
          description: 'Empty for a catalogue lookup — no model was involved, and "" is not a model called unknown.'
    EolLookupResponse:
      type: object
      additionalProperties: false
      description: 'What the catalogues can say. `facts` is always present (empty, never null).'
      required:
      - facts
      - matched
      - miss_recorded
      - message
      properties:
        facts:
          type: array
          items: { $ref: '#/components/schemas/EolFact' }
        matched:
          type: boolean
          description: >-
            Whether a catalogue ROW resolved for this subject — regardless of
            whether it yielded a fact. It is deliberately NOT `facts.length > 0`:
            a row whose `eol_date` is null, or which carries no `source_url`,
            matches and states nothing. "The catalogue has never heard of this
            product" and "the catalogue has it and the upstream source publishes
            no date" are different answers with different fixes, and only the
            first is a gap.
        miss_recorded:
          type: boolean
          description: >-
            Whether this lookup was counted on the gap list — true only when
            nothing matched AND the write succeeded. Separate from `!matched`
            because the console tells an operator their product went on the gap
            list, and saying so when the write failed asserts something that did
            not happen.
        message: { type: string }
    EolProposal:
      type: object
      additionalProperties: false
      description: >-
        One proposed eol_catalogue row awaiting review. The subject_* fields are
        what was ASKED about; the proposed_* fields are what came back.
      required:
      - id
      - product_kind
      - subject_vendor
      - subject_product
      - subject_version
      - proposed_cycle
      - proposed_release_date
      - proposed_eol_date
      - proposed_extended_support_date
      - source_url
      - model_id
      - source_kind
      - confidence
      - status
      - reviewer_id
      - reviewer_email
      - reviewed_at
      - created_at
      - updated_at
      properties:
        id: { type: string, format: uuid }
        product_kind:
          type: string
          enum: [os, software, hardware]
        subject_vendor:
          type: [string, 'null']
          description: 'Null means the gap carried no vendor, not that the product has none.'
        subject_product: { type: string }
        subject_version: { type: [string, 'null'] }
        proposed_cycle:
          type: string
          description: 'Never empty: a proposal is a catalogue row and a row names a cycle.'
        proposed_release_date: { type: [string, 'null'], format: date-time }
        proposed_eol_date:
          type: [string, 'null']
          format: date-time
          description: >-
            Null when the model named a cycle but not its end-of-life date. That
            is the model obeying "never guess a date" and is a legitimate
            proposal, not a defective one.
        proposed_extended_support_date: { type: [string, 'null'], format: date-time }
        source_url:
          type: string
          description: 'The cited page. Never null — an uncited proposal was dropped before storage (D4.4).'
        model_id:
          type: string
          description: 'Never null — an unattributable proposal was dropped before storage (D4.1).'
        source_kind:
          type: string
          enum: [inferred]
          description: 'Always "inferred", as a stored field rather than an assumption about the table name.'
        confidence:
          type: number
          description: '0 on everything written today: we do not ask a model to score itself.'
        status:
          type: string
          enum: [pending, accepted, rejected]
        reviewer_id: { type: [string, 'null'], format: uuid }
        reviewer_email: { type: [string, 'null'] }
        reviewed_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    EolProposalListResponse:
      type: object
      additionalProperties: false
      description: 'One page of the proposal queue. `proposals` is always present (empty, never null).'
      required:
      - proposals
      - total
      - page
      - page_size
      properties:
        proposals:
          type: array
          items: { $ref: '#/components/schemas/EolProposal' }
        total:
          type: integer
          description: Unpaginated row count for the same filter.
        page: { type: integer }
        page_size: { type: integer }
    EolProposalReviewResponse:
      type: object
      additionalProperties: false
      description: 'The reviewed proposal, so the console renders the row it changed rather than the row it hoped for.'
      required:
      - proposal
      - message
      properties:
        proposal: { $ref: '#/components/schemas/EolProposal' }
        eol_entry_id:
          type: string
          format: uuid
          description: >-
            On accept, the eol_catalogue row that was written or updated. Absent
            on reject, where nothing was written.
        message: { type: string }
    CatalogMiss:
      type: object
      additionalProperties: false
      description: >-
        One gap: a subject the catalogues could not answer for, and how often it
        has been asked about. The subject is stored verbatim while the
        uniqueness folds case, so a reviewer sees what was actually asked — a
        vendor-name mismatch is one of the commonest causes of a miss and a
        normalised display would hide it.
      required:
      - id
      - product_kind
      - vendor
      - product
      - version
      - miss_count
      - first_seen_at
      - last_seen_at
      - last_proposed_at
      properties:
        id: { type: string, format: uuid }
        product_kind:
          type: string
          enum: [os, software, hardware]
        vendor: { type: [string, 'null'] }
        product: { type: string }
        version: { type: [string, 'null'] }
        miss_count:
          type: integer
          description: 'How many lookups this gap has swallowed. The list is ordered by it.'
        first_seen_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        last_proposed_at:
          type: [string, 'null']
          format: date-time
          description: >-
            When a proposal run last asked about this gap, whether or not the ask
            produced anything. Null means never asked.
    CatalogMissListResponse:
      type: object
      additionalProperties: false
      description: 'One page of the gap list. `misses` is always present (empty, never null).'
      required:
      - misses
      - total
      - page
      - page_size
      properties:
        misses:
          type: array
          items: { $ref: '#/components/schemas/CatalogMiss' }
        total: { type: integer }
        page: { type: integer }
        page_size: { type: integer }
    CatalogEnrichRunResponse:
      type: object
      additionalProperties: false
      description: 'Acknowledgement that a proposal run was STARTED (202). The outcome arrives in the proposal queue.'
      required:
      - status
      - message
      properties:
        status: { type: string }
        message: { type: string }
    CatalogEnrichAvailability:
      type: object
      additionalProperties: false
      description: >-
        Whether "Propose with AI" is offered on this deployment. Three fields
        rather than a bool because the two "no" answers have different fixes.
      required:
      - available
      properties:
        available:
          type: boolean
          description: 'Whether a proposal run could succeed right now.'
        reason:
          type: string
          enum: [edition, no_provider]
          description: >-
            "edition" — this build has no generative enricher (Core). The lookup
            enricher, the gap list and the review queue are all still present.
            "no_provider" — the build has one, but AI_PROVIDER names nothing
            reachable; the operator configures a provider. Empty when available.
        provider:
          type: string
          description: 'The configured provider name ("none", "anthropic", "openai-compatible").'
    EolCatalogueEntry:
      type: object
      additionalProperties: false
      description: 'One release cycle of one product. Identity is (product_kind, vendor, product, cycle).'
      required:
      - id
      - product_kind
      - vendor
      - product
      - cycle
      - release_date
      - eol_date
      - extended_support_date
      - source_url
      - source_kind
      properties:
        id: { type: string, format: uuid }
        product_kind:
          type: string
          enum: [os, software, hardware]
        vendor:
          type: [string, 'null']
          description: >-
            Null means UNKNOWN, not "none". The mirror leaves it null rather than
            writing "Unknown", which would make the identity index treat two
            different products as one row the day the real vendor is filled in.
        product: { type: string }
        cycle:
          type: string
          description: 'The release train, e.g. "22.04", "3.11", "17".'
        release_date: { type: [string, 'null'], format: date-time }
        eol_date:
          type: [string, 'null']
          format: date-time
          description: >-
            Null when the source has not announced a date — including when it
            says support has ended but gives no date. A fabricated date would
            give the EOL producer a precise-looking days-past-EOL number derived
            from nothing.
        extended_support_date: { type: [string, 'null'], format: date-time }
        source_url: { type: [string, 'null'] }
        source_kind:
          type: string
          enum: [measured, declared, imported, inferred]
        updated_at: { type: string, format: date-time }
    EolCatalogueListResponse:
      type: object
      additionalProperties: false
      description: 'One page of the end-of-life catalogue. `entries` is always present (empty, never null).'
      required:
      - entries
      - total
      - page
      - page_size
      properties:
        entries:
          type: array
          items: { $ref: '#/components/schemas/EolCatalogueEntry' }
        total:
          type: integer
          description: Unpaginated row count for the same filters.
        page: { type: integer }
        page_size: { type: integer }
    ClassificationRuleKind:
      type: string
      description: |
        How a rule's `pattern` is matched (asset-inventory ADR-0004 D6). Mirrors
        the `rule_kind` CHECK on `classification_rules` and the matcher set in
        `shared/classify`; adding a value is a change in all three at once — and
        in this enum, which is the one in a different language and therefore the
        one that gets left behind. `TestClassificationRuleKind_SpecMatchesTheEngine`
        compares the two and fails either way round.

        * `oui` — the 24-bit IEEE assignment at the front of a MAC, as 6
          uppercase hex digits with no separators.
        * `sysobjectid` — an OID prefix under the IANA private-enterprise arc
          `1.3.6.1.4.1`, matched on arc boundaries; longest prefix wins.
        * `enip` — an ODVA vendor id in decimal, from an EtherNet/IP List
          Identity response.
        * `cloud_type` — a provider resource type as the cloud collectors spell
          it (`aws_s3_bucket`).
        * `banner` — a Go RE2 regexp matched against every captured banner. The
          pattern carries its own anchoring.
        * `port_profile` — an ascending comma-separated port list, matching only
          when EVERY listed port is open.
        * `model` — a case-insensitive prefix of the model or product id the
          device stated; longest prefix wins, and a rule that names a vendor
          fires only for that vendor.
        * `platform` — the collector path's own identity for the device: the
          management API it answered (`panos`), or the profile it was registered
          under (`cisco_asa`).
        * `cdp_capabilities` — an ascending comma-separated SET of Cisco CDP
          capability names (`router,switch`), spelled as the decoder in
          `shared/hostobs` spells them. Matches only when EVERY name is
          advertised, and only the matching rules naming the MOST capabilities
          are returned, so a combination refines rather than argues with the
          single-capability rules under it.
        * `lldp_capability` — the same matching over IEEE 802.1AB system
          capabilities. Two kinds and not one because the vocabularies use
          different words for overlapping ideas: CDP's `switch` says the device
          switches, while 802.1AB's `bridge` is the bridging FUNCTION, which an
          access point and a desk phone also perform.
        * `mdns_service` — one DNS-SD service type in its registry spelling,
          lowercase (`_ipp._tcp`). Exact, case-insensitive.
        * `os_name` — an RE2 regexp matched against the operating system the
          host named when asked (the `os.name` fact). The pattern carries its
          own anchoring, as a banner's does. The only kind whose evidence comes
          from inside the host, and the only one a general-purpose computer can
          match at all.
      enum:
      - oui
      - sysobjectid
      - enip
      - cloud_type
      - banner
      - port_profile
      - model
      - platform
      - cdp_capabilities
      - lldp_capability
      - mdns_service
      - os_name
    ClassificationRule:
      type: object
      additionalProperties: false
      description: |
        One curated rule. Identity is `(rule_kind, pattern)`.

        `class_key` is NULLABLE and usually null on an OUI rule, which is the
        table's whole posture: a manufacturer that sells servers, switches and
        printers under one assignment gets a VENDOR and no class, because a
        wrong class is worse than none — an absent class shows as unclassified
        and invites someone to look, a wrong one shows as a fact.
      required:
      - id
      - rule_kind
      - pattern
      - class_key
      - vendor
      - model
      - confidence
      - source_url
      - created_at
      - updated_at
      properties:
        id: { type: string, format: uuid }
        rule_kind:
          $ref: '#/components/schemas/ClassificationRuleKind'
        pattern:
          type: string
          description: The thing matched, in the kind's own syntax.
        class_key:
          type: [string, 'null']
          description: >-
            Asset class key from the platform taxonomy, or null. Null means the
            rule deliberately proposes NO class — not "unknown class", and not
            an empty string.
        vendor:
          type: [string, 'null']
          description: >-
            The manufacturer this pattern identifies. On a `model` rule it is
            also a guard: the rule fires only when the observed vendor agrees or
            is absent.
        model:
          type: [string, 'null']
          description: 'The specific model, where the pattern pins one. Rarely set.'
        confidence:
          type: number
          format: double
          minimum: 0.5
          maximum: 0.95
          description: >-
            What the rule ASSERTS, 0.50–0.95 — not how sure we are that the
            pattern matched, which is exact. A vendor-only rule carries the
            confidence of its vendor claim, so it sits HIGHER than the
            class-bearing rules beside it: it asserts less. 1.0 is refused
            because nothing here is a measurement.
        source_url:
          type: [string, 'null']
          description: 'Where the mapping comes from. A rule that cannot cite anything is somebody''s memory.'
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ClassificationRuleInput:
      type: object
      additionalProperties: false
      description: |
        A rule to create, or the full replacement for an existing one. On PUT
        every field is restated and an omitted optional field is CLEARED —
        clearing a class is how an admin turns a rule that guessed into a rule
        that only names a vendor.

        At least one of `class_key`, `vendor` or `model` must be populated: a
        rule that asserts nothing can only waste a reviewer's time, and the
        database refuses it too.
      required:
      - rule_kind
      - pattern
      - confidence
      properties:
        rule_kind:
          $ref: '#/components/schemas/ClassificationRuleKind'
        pattern: { type: string }
        class_key: { type: [string, 'null'] }
        vendor: { type: [string, 'null'] }
        model: { type: [string, 'null'] }
        confidence:
          type: number
          format: double
          minimum: 0.5
          maximum: 0.95
        source_url: { type: [string, 'null'] }
    ClassificationRuleListResponse:
      type: object
      additionalProperties: false
      description: 'One page of the classification rules. `rules` is always present (empty, never null).'
      required:
      - rules
      - total
      - page
      - page_size
      - kinds
      properties:
        rules:
          type: array
          items: { $ref: '#/components/schemas/ClassificationRule' }
        total:
          type: integer
          description: Unpaginated row count for the same filters.
        page: { type: integer }
        page_size: { type: integer }
        kinds:
          type: array
          description: >-
            The rule-kind vocabulary, served with the list so a client's filter
            and form cannot keep their own copy and drift from what the engine
            matches.
          items:
            $ref: '#/components/schemas/ClassificationRuleKind'
    VulnerabilityCatalogueEntry:
      type: object
      additionalProperties: false
      description: 'One CVE. `cve_id` is the identity — there is no surrogate key.'
      required:
      - cve_id
      - cvss_version
      - cvss_score
      - cvss_vector
      - severity
      - published_at
      - modified_at
      - description
      - source_kind
      properties:
        cve_id: { type: string }
        cvss_version:
          type: [string, 'null']
          description: 'Which CVSS ladder the score came from ("4.0", "3.1", "2.0"). Recorded so a reader never has to guess.'
        cvss_score:
          type: [number, 'null']
          minimum: 0
          maximum: 10
        cvss_vector: { type: [string, 'null'] }
        severity:
          type: [string, 'null']
          enum: [none, low, medium, high, critical, null]
          description: 'The CVSS qualitative band. Derived from the score when the feed omits the word, so a 9.8 never renders as "—".'
        published_at: { type: [string, 'null'], format: date-time }
        modified_at: { type: [string, 'null'], format: date-time }
        description: { type: [string, 'null'] }
        source_kind:
          type: string
          enum: [measured, declared, imported, inferred]
    VulnerabilityCatalogueListResponse:
      type: object
      additionalProperties: false
      description: 'One page of the vulnerability catalogue. `vulnerabilities` is always present (empty, never null).'
      required:
      - vulnerabilities
      - total
      - page
      - page_size
      properties:
        vulnerabilities:
          type: array
          items: { $ref: '#/components/schemas/VulnerabilityCatalogueEntry' }
        total:
          type: integer
          description: Unpaginated row count for the same filters.
        page: { type: integer }
        page_size: { type: integer }
    CatalogFeedStatus:
      type: object
      additionalProperties: false
      description: 'Where one mirror feed got to and how it went.'
      required:
      - feed
      - cursor
      - last_run_at
      - last_status
      - last_error
      - row_count
      properties:
        feed:
          type: string
          enum: [eol, nvd, osv]
        cursor:
          type: [string, 'null']
          description: >-
            Opaque and per-feed: NVD stores the end of the last modification
            window it consumed, OSV a JSON map of per-ecosystem watermarks, and
            the EOL feed the date it last completed a full pass. Advanced only
            on success, so a failed run retries its window rather than skipping
            it.
        last_run_at: { type: [string, 'null'], format: date-time }
        last_status:
          type: string
          enum: [never, running, ok, error]
          description: '`never` is a real answer — the feed has not run — as distinct from a run whose outcome was lost.'
        last_error: { type: [string, 'null'] }
        row_count:
          type: integer
          description: Catalogue rows written by the last successful run.
        updated_at: { type: [string, 'null'], format: date-time }
    CatalogFeedListResponse:
      type: object
      additionalProperties: false
      description: 'Status of every catalogue feed, plus the deployment-level switches the console renders.'
      required:
      - feeds
      - enabled
      - interval_seconds
      properties:
        feeds:
          type: array
          items: { $ref: '#/components/schemas/CatalogFeedStatus' }
        enabled:
          type: boolean
          description: 'The CATALOG_FEEDS_ENABLED kill switch. False ⇒ nothing scheduled and manual sync refused with 409.'
        interval_seconds:
          type: integer
          description: Scheduled cadence between passes.
    CatalogFeedSyncResponse:
      type: object
      additionalProperties: false
      description: 'Acknowledgement that a feed run was STARTED (202). The outcome arrives via GET /admin/catalogs/feeds.'
      required:
      - feed
      - status
      - message
      properties:
        feed:
          type: string
          enum: [eol, nvd, osv]
        status:
          type: string
          enum: [running]
        message: { type: string }
    CatalogBundleFile:
      type: object
      additionalProperties: false
      description: 'One verified file from an offline bundle''s manifest.'
      required:
      - name
      - sha256
      - rows
      - bytes
      properties:
        name: { type: string }
        sha256: { type: string }
        rows: { type: integer }
        bytes: { type: integer }
    CatalogBundleImportResponse:
      type: object
      additionalProperties: false
      description: 'What an offline-bundle import applied, after every file passed its SHA-256 and row-count check.'
      required:
      - files
      - eol_rows
      - vulnerability_rows
      - match_rows
      - message
      properties:
        files:
          type: array
          items: { $ref: '#/components/schemas/CatalogBundleFile' }
        eol_rows:
          type: integer
          description: >-
            End-of-life rows the database affected. The upsert is ON CONFLICT DO
            UPDATE, so re-importing the same bundle reports the same number
            again — it answers "how much of the bundle was applied", not "how
            much changed".
        vulnerability_rows:
          type: integer
          description: CVE rows the database affected. Same DO UPDATE semantics as eol_rows.
        match_rows:
          type: integer
          description: >-
            Match rules the database actually WROTE. These are INSERT ... DO
            NOTHING, so re-importing a bundle the catalogue already holds
            reports 0 — not the count of rules in the file, which would claim
            tens of thousands of writes that did not happen.
        generated_at:
          type: string
          format: date-time
          description: When the bundle was built on the connected install.
        message: { type: string }
