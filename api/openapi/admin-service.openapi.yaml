  /admin/license/cap:
    get:
      operationId: getLicenseCap
      tags:
      - license
      summary: The licensed tenant limit (MSP soft cap) and its grace state
      description: |
        What the admin console's banner shows. Only an active MSP licence with
        `max_tenants` caps anything; every other install answers
        `state: uncapped`, so this is a Core route every build mounts.

        `current` counts live tenants that are not the operator's own
        (`tenants.is_operator`); `operator` counts those. When a tenant creation
        takes `current` over `licensed`, a grace period of `grace_days` starts
        (`grace_started_at`); while it lasts (`state: grace`) new tenants are
        still allowed, and once it ends (`state: blocked`) every
        tenant-creation path answers 409 for a creation that would take
        `current` over `licensed`. Existing tenants are never affected.
        `state` describes what the next creation would meet.

        The grace period is granted once per licence: dropping back to
        `licensed` or below does not clear or restart it, so an install back
        at `licensed` after it has ended reads `blocked`. Only a new licence
        starts a new one. Over the licence with no grace period recorded yet,
        `grace_started_at` is null and `grace_ends_at` is `grace_days` from
        now. This route is read-only: reading it never starts or changes the
        grace period.
      responses:
        '200':
          description: The cap's current state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicenseCapResponse'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '403':
          $ref: '#/components/responses/LegacyForbidden'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /admin/platform/edition:
    get:
      operationId: getPlatformEdition
      tags:
      - platform-edition
      summary: Which optional admin-service surfaces this build mounted
      description: |
        The edition read-out the admin console gates its navigation on.

        admin-service is carved into Core and Enterprise/MSP. A Core build does
        not 403 the Enterprise routes — it never mounts them, so they 404. This
        endpoint lets the console know that BEFORE it renders a Tenants tab
        whose backend does not exist.

        Served by Core code and answerable by a build with no `ee/` tree.
        Authenticated (platform-admin group) but not permission-gated: every
        operator's navigation depends on it, exactly like `/admin/auth/me`.

        `capabilities` is the field to gate on — it is derived from hook
        presence, the same fact that decides whether the routes exist.
        `edition` is coarse on purpose: one `ee` binary serves both the
        Enterprise and MSP editions, so it cannot honestly distinguish them.

        This service speaks only for its own routes. Capabilities carved out of
        other binaries (SIEM export in audit-service, CMDB sync in
        inventory-service) keep their own response probes.
      responses:
        '200':
          description: The running build's edition read-out.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformEditionResponse'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
  /admin/auth/logout:
    post:
      operationId: platformLogout
      tags:
      - platform-auth
      summary: Log out (revoke refresh tokens, clear cookies)
      description: 'Authenticated: revokes the platform refresh tokens server-side and clears the platform_* cookies.'
      responses:
        '200':
          description: Logged out.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /admin/auth/change-password:
    post:
      operationId: platformChangePassword
      tags:
      - platform-auth
      summary: Change own password
      description: 'Authenticated: the platform user changes their own password. On success the force_password_change flag is cleared.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformChangePasswordRequest'
      responses:
        '200':
          description: Password changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '500':
          $ref: '#/components/responses/LegacyServerError'

  # ===========================================================================
  # Platform settings, stats, monitoring, dashboard (admin-ui leftovers).
  # UI consumers: platform-api.ts, status-api.ts, dashboard-api.ts.
  # The dashboard/* + monitoring/metrics handlers proxy a dashboard service that
  # aggregates monitoring-service + resource-tracker-service; data blobs are
  # loosely typed (only the {data,meta} envelope is pinned).
  # ===========================================================================
  /admin/legal/documents:
    get:
      operationId: listLegalDocuments
      tags:
      - platform-settings
      summary: List current legal documents and version history
      description: Returns the current published version of each legal document (with body for editing) plus the version history metadata.
      responses:
        '200':
          description: Current documents and history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLegalDocumentsResponse'
        '500':
          $ref: '#/components/responses/LegacyServerError'
    post:
      operationId: publishLegalDocument
      tags:
      - platform-settings
      summary: Publish a new version of a legal document
      description: Publishes a NEW immutable version — the previously current version is demoted, never mutated, so prior acceptances stay pinned to the exact accepted text.
      requestBody:
        required: true
        content:
          application/json:
            schema:
