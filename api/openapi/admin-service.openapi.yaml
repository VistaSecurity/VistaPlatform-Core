          type: string
        description:
          type: string
        is_default:
          type: boolean
        is_system_role:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        permissions:
          type: [array, 'null']
          items:
            type: string
        user_count:
          type: integer
