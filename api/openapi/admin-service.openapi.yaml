      description: 'Envelope for GET /admin/tenants/{id}/users. `users` is null when the tenant has no users.'
      required:
      - users
      properties:
        users:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/TenantUser'
    TenantStatsResponse:
      type: object
      additionalProperties: false
      required:
      - stats
      properties:
        stats:
          $ref: '#/components/schemas/TenantStats'
    UpdateTenantRequest:
      type: object
      additionalProperties: true
      description: 'Partial update — all fields optional. Empty body returns 400. subscription_tier is accepted but ignored.'
      properties:
        name:
          type: string
        domain:
          type: string
        subscription_tier:
          type: string
        billing_email:
          type: string
        payment_status:
          type: string
    PlatformRole:
      type: object
      additionalProperties: false
      description: 'A platform role (shared/models.PlatformRole). When embedded in a user the handler sets only id/name/display_name; the rest marshal at their zero value.'
      required:
      - id
      - name
      - display_name
      - description
      - is_default
      - is_system_role
      - created_at
      - updated_at
      properties:
        id:
          type: string
        name:
          type: string
        display_name:
          type: string
        description:
          type: string
        is_default:
          type: boolean
        is_system_role:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PlatformUser:
      type: object
      additionalProperties: false
      description: 'A platform-admin user (shared/models.PlatformUser) as returned by list/get. `role` is the joined role object, null when the join misses. `password_changed_at`, `invited_by`, and `invitation_accepted_at` are omitted entirely when unset (json omitempty), so they are not required.'
      required:
      - id
      - email
      - first_name
      - last_name
      - is_active
      - role_id
      - email_verified
      - force_password_change
      - last_login_at
      - role
      - created_at
      - updated_at
      properties:
        id:
          type: string
        email:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        is_active:
          type: boolean
        role_id:
          type: string
        email_verified:
          type: boolean
        force_password_change:
          type: boolean
        last_login_at:
          type: [string, 'null']
          format: date-time
        role:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/PlatformRole'
        password_changed_at:
          type: string
          format: date-time
        invited_by:
          type: string
        invitation_accepted_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CurrentPlatformUser:
      type: object
      additionalProperties: false
      description: 'The authenticated platform user (GET /auth/me) — a hand-built object. `role` is the role *name* string (not the object).'
      required:
      - id
      - email
      - first_name
      - last_name
      - role
      - is_active
      - email_verified
      - force_password_change
      - last_login_at
      - created_at
      - updated_at
      properties:
        id:
          type: string
        email:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        role:
          type: string
        is_active:
          type: boolean
        email_verified:
          type: boolean
        force_password_change:
          type: boolean
        last_login_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PlatformUsersPagination:
      type: object
      additionalProperties: false
      required:
      - page
      - page_size
      - total
      - total_pages
      - has_next
      - has_prev
      properties:
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
        has_next:
          type: boolean
        has_prev:
          type: boolean
    PlatformUserListResponse:
      type: object
      additionalProperties: false
      description: 'Envelope for GET /admin/users. `users` is null when no rows match.'
      required:
      - users
      - pagination
      properties:
        users:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/PlatformUser'
        pagination:
          $ref: '#/components/schemas/PlatformUsersPagination'
    GetPlatformUserResponse:
      type: object
      additionalProperties: false
      required:
      - user
      properties:
        user:
          $ref: '#/components/schemas/PlatformUser'
    CurrentPlatformUserResponse:
      type: object
      additionalProperties: false
      required:
      - user
      properties:
        user:
          $ref: '#/components/schemas/CurrentPlatformUser'
    # --- edition read-out (open-core carve) ---
    PlatformEditionCapabilities:
      type: object
      additionalProperties: false
      required:
      - msp
      - billing
      properties:
        msp:
          type: boolean
          description: |
            True when the multi-tenant management plane is mounted:
            /admin/tenants/**, /admin/stats/**, /admin/dashboard/**,
            /admin/costs/**, /admin/announcements, /admin/maintenance-windows,
            /admin/support-tickets, /admin/legal/acceptances.
        billing:
          type: boolean
          description: |
            True when the Enterprise billing surface is mounted:
            /admin/billing/** and /admin/tenants/{id}/billing.
    PlatformEditionResponse:
      type: object
      additionalProperties: false
      required:
      - edition
      - capabilities
      properties:
        edition:
          type: string
          enum: [core, enterprise]
          description: Coarse build edition. Gate on `capabilities`, not on this.
        capabilities:
          $ref: '#/components/schemas/PlatformEditionCapabilities'
    # --- platform-auth session surface (admin-ui-v2 ADR-0002) ---
    PlatformLoginRequest:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
    PlatformLoginResponse:
      type: object
      additionalProperties: false
      description: 'Login/refresh result (handlers.LoginResponse). `user` is the full shared/models.PlatformUser (role as object); tokens are also delivered as platform_* httpOnly cookies.'
      required:
      - user
      - access_token
      - refresh_token
      - expires_in
      - force_password_change
      properties:
        user:
          $ref: '#/components/schemas/PlatformUser'
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
        force_password_change:
          type: boolean
    PlatformRefreshRequest:
      type: object
      additionalProperties: false
      description: 'Optional body — the refresh token is normally read from the platform_refresh_token httpOnly cookie. Present only for non-browser callers.'
      properties:
        refresh_token:
          type: string
    PlatformForgotPasswordRequest:
      type: object
      additionalProperties: false
      required:
      - email
      properties:
        email:
          type: string
          format: email
    PlatformResetPasswordRequest:
      type: object
      additionalProperties: false
      required:
      - token
      - new_password
      - confirm_password
      properties:
        token:
          type: string
        new_password:
          type: string
          minLength: 8
        confirm_password:
          type: string
    PlatformChangePasswordRequest:
      type: object
      additionalProperties: false
      required:
      - current_password
      - new_password
      - confirm_password
      properties:
        current_password:
          type: string
        new_password:
          type: string
          minLength: 8
        confirm_password:
          type: string
    CreatePlatformUserResponse:
      type: object
      additionalProperties: false
      required:
      - message
      - user_id
      - created_at
      properties:
        message:
          type: string
        user_id:
          type: string
        created_at:
          type: string
          format: date-time
    CreatePlatformUserRequest:
      type: object
      additionalProperties: true
      required:
      - email
      - password
      - first_name
      - last_name
      - role_id
      properties:
        email:
          type: string
        password:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        role_id:
          type: string
        force_password_change:
          type: boolean
    UpdatePlatformUserRequest:
      type: object
      additionalProperties: true
      description: 'Partial update — all fields optional. Empty body returns 400.'
      properties:
        first_name:
          type: string
        last_name:
          type: string
        role_id:
          type: string
        is_active:
          type: boolean
        force_password_change:
          type: boolean
    AdminSetPasswordRequest:
      type: object
      additionalProperties: true
      required:
      - new_password
      properties:
        new_password:
          type: string
          description: "Minimum 8 characters."
        force_password_change:
          type: boolean
    InvitePlatformUserRequest:
      type: object
      additionalProperties: true
      required:
      - email
      - first_name
      - last_name
      - role_id
      properties:
        email:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        role_id:
          type: string
    InvitePlatformUserResponse:
      type: object
      additionalProperties: false
      description: 'Result of POST /admin/users/invite. `invite_link` is present ONLY on the email-not-configured / send-failed variants (the user is created either way); it is absent when the invite email was sent successfully.'
      required:
      - message
      - user_id
      - created_at
      properties:
        message:
          type: string
        user_id:
          type: string
        invite_link:
          type: string
          description: "The one-time password-set link, returned only when email delivery was skipped or failed."
        created_at:
          type: string
          format: date-time
    AdminSendPasswordResetResponse:
      type: object
      additionalProperties: false
      description: 'Result of POST /admin/users/{id}/send-password-reset. `reset_link` is present ONLY on the email-not-configured / send-failed variants (the token is stored either way); it is absent when the reset email was sent successfully.'
      required:
      - message
      properties:
        message:
          type: string
        reset_link:
          type: string
          description: "The one-time reset link, returned only when email delivery was skipped or failed."
