          type: string
    TenantsStatsResponse:
      type: object
      additionalProperties: false
      description: 'Envelope `{ "tenants_stats": [...] }`. Null when there are no tenants.'
      required:
        - tenants_stats
      properties:
        tenants_stats:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/TenantStats'
    SystemLogsResponse:
      type: object
      additionalProperties: false
      description: 'Placeholder response for GET /admin/monitoring/logs.'
      required:
        - logs
        - message
      properties:
        logs:
          type: array
          items:
            type: object
            additionalProperties: true
        message:
          type: string
    MonitoringMetricsResponse:
      type: object
      additionalProperties: false
      description: 'Envelope `{ "data": {...} }` for GET /admin/monitoring/metrics. `data` is a loosely-typed metrics blob.'
      required:
        - data
      properties:
        data:
          type: object
          additionalProperties: true
    DashboardDataResponse:
      type: object
      additionalProperties: false
      description: 'Envelope `{ "data": {...}, "meta": {...} }` for the dashboard endpoints. Both are loosely-typed blobs.'
      required:
        - data
        - meta
      properties:
        data:
          type: object
          additionalProperties: true
        meta:
          type: object
          additionalProperties: true
    TierEntitlement:
      type: object
      additionalProperties: false
      description: |
        One catalog-enriched entitlement row of a tier's composition
        (services.TierEntitlement). `item_unit`/`overage_price_cents`/
        `overage_unit_size` are omitempty; `included_value` is free-form JSON.
      required:
        - item_id
        - item_key
        - item_display_name
        - item_category
        - item_kind
        - included_value
      properties:
        item_id:
          type: string
          format: uuid
        item_key:
          type: string
        item_display_name:
          type: string
        item_category:
          type: string
        item_kind:
          type: string
        item_unit:
          type: string
        included_value: {}
        overage_price_cents:
          type: integer
        overage_unit_size:
          type: integer
        clear_overage_price_cents:
          type: boolean
          description: 'Set overage_price_cents back to null. Mutually exclusive with overage_price_cents.'
        clear_overage_unit_size:
          type: boolean
          description: 'Set overage_unit_size back to null. Mutually exclusive with overage_unit_size.'
    TierEntitlementsResponse:
      type: object
      additionalProperties: false
      description: |
        Envelope for the tier-entitlements endpoints. `entitlements` is null when
        the tier has none. Writes answer with the composition read inside the
        write's own transaction, so it is always the state they committed.
      required:
        - tier_id
      properties:
        tier_id:
          type: string
          format: uuid
        entitlements:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/TierEntitlement'
        version:
          type: string
          description: 'A content hash of the composition. Send it back on PUT /admin/tiers/{id}/entitlements (`version`) or PUT /admin/tiers/{id} (`entitlements_version`).'
    TenantEntitlement:
      type: object
      additionalProperties: false
      description: |
        A per-tenant entitlement override ("Plan Exception", ADR-0004) — a single
        billable_item value granted to one tenant, with catalog metadata embedded.
        Plan Exceptions are non-billing: an override is a pure entitlement grant.
      required:
      - id
      - tenant_id
      - item_id
      - item_key
      - item_display_name
      - item_kind
      - override_value
      - effective_from
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        item_id:
          type: string
          format: uuid
        item_key:
          type: string
        item_display_name:
          type: string
        item_kind:
          type: string
        item_unit:
          type: string
        override_value:
          description: 'Freeform JSON keyed by the item kind ({enabled} / {quantity} / {value}).'
        reason:
          type: string
        effective_from:
          type: string
        expires_at:
          type: string
        created_by:
          type: string
          format: uuid
    TenantEntitlementInput:
      type: object
      additionalProperties: true
      description: 'Create/update body for a tenant entitlement override (Plan Exception). Non-billing — reason recommended; expiry optional.'
      required:
      - item_key
      - override_value
      properties:
        item_key:
          type: string
        override_value:
          description: 'Freeform JSON keyed by the item kind.'
        reason:
          type: string
        effective_from:
          type: string
        expires_at:
          type: string
    TenantEntitlementListResponse:
      type: object
      additionalProperties: false
      description: 'Envelope for GET /admin/tenants/{id}/entitlements.'
      required:
      - tenant_id
      - entitlements
      properties:
        tenant_id:
          type: string
          format: uuid
        entitlements:
          type: array
          items:
            $ref: '#/components/schemas/TenantEntitlement'
    TenantSettings:
      type: object
      additionalProperties: false
      description: |
        A tenant's platform-admin overrides. Every property is optional and
        THREE-valued: absent means "no override — follow the platform default",
        true and false are explicit overrides. Absent is NOT the same as false.
      properties:
        email_verification_required:
          type: boolean
          description: 'Override whether this tenant''s new users must verify their email before they can sign in. Absent = follow the platform default (Settings ▸ Access, key email_verification_required); if that is unset too, auth-service falls back to whether the deployment can actually send mail.'
        onboarding_required:
          type: boolean
          description: 'Override whether this tenant''s users are shown the onboarding walkthrough. Absent = follow the platform default, which is "required". The tenant''s own admins can also set this for themselves from the tenant UI; both write the same key, last write wins.'
    TenantSettingsResponse:
      type: object
      additionalProperties: false
      description: 'Envelope for GET /admin/tenants/{id}/settings.'
      required:
      - settings
      - version
      properties:
        settings:
          $ref: '#/components/schemas/TenantSettings'
        version:
          type: integer
          description: 'Optimistic-locking version of the tenant''s settings document. 0 when the tenant has no settings row yet. Echo this back as `version` on PUT.'
    UpdateTenantSettingsRequest:
      type: object
      additionalProperties: false
      description: 'Body for PUT /admin/tenants/{id}/settings.'
      required:
      - settings
      properties:
        settings:
          $ref: '#/components/schemas/TenantSettings'
        version:
          type: integer
          description: 'The version from the preceding GET. When supplied, the write is rejected with 409 if the stored version has moved on. Omit to write unconditionally.'
    UpdateTenantSettingsResponse:
      type: object
      additionalProperties: false
      description: 'Envelope for PUT /admin/tenants/{id}/settings. `settings` echoes the overrides as supplied in the request, not the merged document — re-read with GET for the full resolved set.'
      required:
      - message
      - settings
      - version
      properties:
        message:
          type: string
        settings:
          $ref: '#/components/schemas/TenantSettings'
        version:
          type: integer
          description: 'The settings document version AFTER the merge.'
    EffectiveLimits:
      type: object
      additionalProperties: false
      description: |
        A tenant's effective limits — what the entitlement resolver answers
        (override > tier > default, then the licence step), the same path
        enforcement uses; ADR-0004 / #810. `tier_name` is omitted on an
        Enterprise install, which has no plans.
      required:
      - tenant_id
      - tier_id
      - retention_days
      - has_overrides
      properties:
        tenant_id:
          type: string
          format: uuid
        tier_id:
          type: string
          format: uuid
        tier_name:
          type: string
        plan:
          $ref: '#/components/schemas/TenantPlan'
        max_sensors:
          type: [integer, 'null']
        max_assets:
          type: [integer, 'null']
        max_users:
          type: [integer, 'null']
        retention_days:
          type: [integer, 'null']
          description: Days of data retained; null = unlimited.
        compliance_frameworks:
          type: [integer, 'null']
        max_integrations:
          type: [integer, 'null']
        features:
          type: object
          additionalProperties: true
        has_overrides:
          type: boolean
        overrides:
          type: array
          items:
            $ref: '#/components/schemas/EffectiveLimitOverride'
    EffectiveLimitOverride:
      type: object
      additionalProperties: false
      description: 'A single resolved limit override inside EffectiveLimits.'
      required:
      - id
      - override_type
      - limit_name
      - value
      - is_permanent
      properties:
        id:
          type: string
          format: uuid
        override_type:
          type: string
        limit_name:
          type: string
        value:
          description: 'Freeform JSON value.'
        is_permanent:
          type: boolean
        expires_at:
          type: [string, 'null']
          format: date-time
        reason:
          type: string
    TierEntitlementInput:
      type: object
      additionalProperties: true
      description: 'One desired entitlement (services.TierEntitlementInput).'
      required:
        - item_key
        - included_value
      properties:
        item_key:
          type: string
        included_value: {}
        overage_price_cents:
          type: integer
        overage_unit_size:
          type: integer
        clear_overage_price_cents:
          type: boolean
          description: 'Set overage_price_cents back to null. Mutually exclusive with overage_price_cents.'
        clear_overage_unit_size:
          type: boolean
          description: 'Set overage_unit_size back to null. Mutually exclusive with overage_unit_size.'
    UpdateTierEntitlementsRequest:
      type: object
      additionalProperties: true
      description: 'Body for PUT /admin/tiers/{id}/entitlements. Upserts `entitlements`, deletes `remove`; anything named in neither is untouched.'
      required:
        - version
      properties:
        entitlements:
          type: array
          items:
            $ref: '#/components/schemas/TierEntitlementInput'
        remove:
          type: array
          description: Item keys to take off the tier (it then inherits the catalogue default).
          items:
            type: string
        version:
          type: string
          description: The composition version GET returned.
    UpsertTierEntitlementRequest:
      type: object
      additionalProperties: true
      description: 'Body for PUT /admin/tiers/{id}/entitlements/{key}.'
      required:
        - included_value
      properties:
        included_value: {}
        overage_price_cents:
          type: integer
        overage_unit_size:
          type: integer
    CompositionConflictError:
      type: object
      additionalProperties: true
