  # ===========================================================================
  # Platform-admin auth session surface. Consumed by the admin console
  # (@vistasecurity/primitives platform-auth — frontend-v2 ADR-0004 /
  # admin-ui-v2 ADR-0002). Distinct from tenant auth-service: separate
  # platform_users/platform_roles model and platform_* httpOnly cookies
  # (platform_access_token / platform_refresh_token + JS-readable
  # platform_csrf_token). Unauthenticated: /auth/{login,refresh,forgot-password,
  # reset-password}. Authenticated (JWT): /admin/auth/{me,logout,change-password}.
  # ===========================================================================
  /auth/login:
    post:
      operationId: platformLogin
      tags:
      - platform-auth
      summary: Platform admin login
      description: 'Authenticates a platform user. On success sets the platform_* cookies and returns the user + tokens. `user.role` is the joined role object (shared/models.PlatformUser).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformLoginRequest'
      responses:
        '200':
          description: Authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformLoginResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /auth/refresh:
    post:
      operationId: platformRefreshToken
      tags:
      - platform-auth
      summary: Refresh the platform session
      description: 'Rotates the platform session. The refresh token is read from the platform_refresh_token httpOnly cookie; the body is optional and normally empty. Re-sets the platform_* cookies and returns the same shape as login.'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformRefreshRequest'
      responses:
        '200':
          description: Refreshed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformLoginResponse'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /auth/forgot-password:
    post:
      operationId: platformForgotPassword
      tags:
      - platform-auth
      summary: Request a password-reset email
      description: 'Self-service: emails a time-limited reset link to the address if it maps to an active platform user. Always returns 200 with a generic acknowledgement (no account enumeration).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformForgotPasswordRequest'
      responses:
        '200':
          description: Acknowledged (whether or not the address matched).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '500':
          $ref: '#/components/responses/LegacyServerError'
  /auth/reset-password:
    post:
      operationId: platformResetPassword
      tags:
      - platform-auth
      summary: Set a new password from a reset/invite token
      description: 'Unauthenticated: validates a time-limited token (from a reset or invite email) and sets a new password.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformResetPasswordRequest'
      responses:
        '200':
          description: Password set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '401':
          $ref: '#/components/responses/LegacyUnauthorized'
        '500':
          $ref: '#/components/responses/LegacyServerError'
