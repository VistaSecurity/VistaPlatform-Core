      - external_id
      - status
      - current_period_start
      - current_period_end
      - cancel_at_period_end
      - billing_interval
      - contract_start
      - contract_end
      properties:
        external_id:
          type: string
        status:
          type: string
        current_period_start:
          type: [string, 'null']
          format: date-time
        current_period_end:
          type: [string, 'null']
          format: date-time
        cancel_at_period_end:
          type: boolean
        billing_interval:
          type: string
        contract_start:
