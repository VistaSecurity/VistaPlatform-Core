      properties:
        logs:
          type: array
          items:
            type: object
            additionalProperties: true
        message:
          type: string
    MonitoringMetricsResponse:
      type: object
      additionalProperties: false
      description: 'Envelope `{ "data": {...} }` for GET /admin/monitoring/metrics. `data` is a loosely-typed metrics blob.'
      required:
        - data
      properties:
        data:
          type: object
          additionalProperties: true
    DashboardDataResponse:
      type: object
      additionalProperties: false
