          format: uuid
        item_id:
          type: string
          format: uuid
        item_key:
          type: string
        item_display_name:
          type: string
        item_kind:
          type: string
        item_unit:
          type: string
        override_value:
          description: 'Freeform JSON keyed by the item kind ({enabled} / {quantity} / {value}).'
        reason:
          type: string
        effective_from:
          type: string
        expires_at:
          type: string
        created_by:
          type: string
          format: uuid
