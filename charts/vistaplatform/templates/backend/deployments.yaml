{{- /* Decided once per render: it costs two API lookups (_jwt-signing.tpl). */}}
{{- $legacyHmac := fromJson (include "vistaplatform.jwtLegacyHmac" .) }}
{{- range $name, $svc := .Values.backends }}
---
{{ include "vistaplatform.backend" (dict "ctx" $ "name" $name "svc" $svc "legacyHmac" $legacyHmac.accept) }}
{{- end }}
