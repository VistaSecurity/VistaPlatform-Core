{{/*
Customer-supplied Stripe billing Secret (created only if
billing.stripe.existingSecretName is unset AND all three inline values are
provided). Holds:

  stripe-secret-key       — STRIPE_SECRET_KEY
  stripe-publishable-key  — STRIPE_PUBLISHABLE_KEY
  stripe-webhook-secret   — STRIPE_WEBHOOK_SECRET

Three delivery modes:

  1. Pre-applied / ESO-synced Secret — production. Set
     billing.stripe.existingSecretName to the Secret name; the chart never
     templates the credentials. This is the recommended EKS path (the Secret
     is synced from AWS Secrets Manager via External Secrets Operator).

  2. Inline values in values.yaml — dev/lab only. The chart renders this
     Secret with stringData carrying the three values.

  3. Billing disabled — both existingSecretName empty AND inline values
     empty. The chart renders nothing here; admin-service starts up with
     "change-me" defaults from config.go and every billing endpoint
     returns an error. Use this only when intentionally running without
     billing (e.g. single-customer install with contract pricing).

If existingSecretName is unset but only some of the inline values are
provided, fail at template time — partial credentials are always a bug.
*/}}
{{- if not .Values.billing.stripe.existingSecretName }}
{{- $sk := .Values.billing.stripe.secretKey | default "" -}}
{{- $pk := .Values.billing.stripe.publishableKey | default "" -}}
{{- $wh := .Values.billing.stripe.webhookSecret | default "" -}}
{{- $any := or (or $sk $pk) $wh -}}
{{- $all := and (and $sk $pk) $wh -}}
{{- if and $any (not $all) }}
{{- fail "billing.stripe: provide all three of secretKey, publishableKey, webhookSecret — or use billing.stripe.existingSecretName" }}
{{- end }}
{{- if $all }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vistaplatform.billingSecretName" . }}
  labels:
    {{- include "vistaplatform.labels" . | nindent 4 }}
type: Opaque
stringData:
  stripe-secret-key: {{ $sk | quote }}
  stripe-publishable-key: {{ $pk | quote }}
  stripe-webhook-secret: {{ $wh | quote }}
{{- end }}
{{- end }}
