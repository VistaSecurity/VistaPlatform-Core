---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: cors-headers
  labels:
    {{- include "vistaplatform.labels" . | nindent 4 }}
spec:
  headers:
    accessControlAllowOriginList:
      - "https://{{ $dnsName }}"
      {{- if .Values.tls.adminDnsName }}
      - "https://{{ .Values.tls.adminDnsName }}"
      {{- end }}
      {{- range .Values.gateway.extraCorsOrigins | default list }}
      - {{ . | quote }}
      {{- end }}
    accessControlAllowMethods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    accessControlAllowHeaders:
      - Authorization
      - Content-Type
      - X-Requested-With
      - X-Impersonate-Tenant
      - X-Tenant-ID
      - X-User-ID
      - X-CSRF-Token
    accessControlAllowCredentials: true
    accessControlMaxAge: 86400
    addVaryHeader: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  labels:
    {{- include "vistaplatform.labels" . | nindent 4 }}
spec:
  headers:
    frameDeny: true
    contentTypeNosniff: true
    browserXssFilter: true
    referrerPolicy: strict-origin-when-cross-origin
    contentSecurityPolicy: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'
      https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:;
      connect-src 'self' https:; frame-ancestors 'none';"
    customResponseHeaders:
      Permissions-Policy: camera=(), microphone=(), geolocation=()
    {{- if ne .Values.tls.mode "none" }}
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    stsPreload: true
    {{- end }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-backend-cors
  labels:
    {{- include "vistaplatform.labels" . | nindent 4 }}
spec:
  headers:
    customResponseHeaders:
      Access-Control-Allow-Origin: ""
      Access-Control-Allow-Methods: ""
      Access-Control-Allow-Headers: ""
      Access-Control-Allow-Credentials: ""
      Access-Control-Max-Age: ""
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit-api
  labels:
    {{- include "vistaplatform.labels" . | nindent 4 }}
spec:
  rateLimit:
    average: 1000
    burst: 2000
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit-auth
