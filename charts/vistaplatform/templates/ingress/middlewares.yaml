  labels:
    {{- include "vistaplatform.labels" . | nindent 4 }}
spec:
  retry:
    attempts: 3
    initialInterval: 100ms
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: deny-admin-plane
  labels:
    {{- include "vistaplatform.labels" . | nindent 4 }}
spec:
  ipAllowList:
    sourceRange:
      - 192.0.2.0/24
    rejectStatusCode: 404
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: deny-internal-plane
  labels:
    {{- include "vistaplatform.labels" . | nindent 4 }}
spec:
  ipAllowList:
    sourceRange:
      - 192.0.2.0/24
    rejectStatusCode: 404
{{- if $adminAllowList }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: admin-plane-allowlist
  labels:
    {{- include "vistaplatform.labels" . | nindent 4 }}
spec:
  ipAllowList:
    sourceRange:
      {{- range $adminAllowList.sourceRange }}
      - {{ . | quote }}
      {{- end }}
    {{- with $adminAllowList.ipStrategy }}
    {{- if or .depth .excludedIPs }}
    ipStrategy:
      {{- if .depth }}
      depth: {{ .depth }}
      {{- end }}
      {{- with .excludedIPs }}
      excludedIPs:
        {{- range . }}
        - {{ . | quote }}
        {{- end }}
      {{- end }}
    {{- end }}
    {{- end }}
{{- end }}
