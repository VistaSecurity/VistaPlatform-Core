---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ $fullname }}-app
  labels:
    {{- include "vistaplatform.labels" . | nindent 4 }}
spec:
  entryPoints: {{ $entryPoints | toJson }}
  routes:
    - match: Host(`{{ $dnsName }}`)
      kind: Rule
      services:
        - name: web-ui
          port: 80
      middlewares:
        - name: security-headers
  {{- if $tlsSecret }}
  tls:
    secretName: {{ $tlsSecret }}
    options:
      name: {{ $fullname }}-tls-options
      namespace: {{ $namespace }}
  {{- end }}
{{- if $adminDnsName }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ $fullname }}-admin
  labels:
    {{- include "vistaplatform.labels" . | nindent 4 }}
spec:
  entryPoints: {{ $entryPoints | toJson }}
  routes:
    - match: Host(`{{ $adminDnsName }}`)
      kind: Rule
      services:
        - name: admin-ui
          port: 80
      middlewares:
        - name: security-headers
  {{- if $tlsSecret }}
  tls:
    secretName: {{ $tlsSecret }}
    options:
      name: {{ $fullname }}-tls-options
      namespace: {{ $namespace }}
  {{- end }}
{{- end }}
{{- if ne $tlsMode "none" }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ $fullname }}-redirect
  labels:
    {{- include "vistaplatform.labels" . | nindent 4 }}
spec:
  entryPoints: ["web"]
  routes:
    - match: Host(`{{ $dnsName }}`) || Host(`{{ $adminDnsName }}`)
      kind: Rule
      services:
        - name: web-ui
          port: 80
      middlewares:
        - name: redirect-https
{{- end }}
{{- end }}
