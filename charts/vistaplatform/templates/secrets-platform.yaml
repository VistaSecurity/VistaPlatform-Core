{{/*
Platform Secret: JWT_SECRET, INTERNAL_AUTH_SECRET, ENCRYPTION_MASTER_KEY.

Three ways these get set, in precedence order:

  1. platform.existingSecretName — you pre-applied your own Secret. Nothing is
     rendered here. This is the right answer for production and for anyone with
     an external secret manager.
  2. Values supplied inline (platform.jwtSecret and friends).
  3. Generated. A fresh install with no values gets strong random ones, so
     `helm install` works with no arguments at all.

(3) exists because requiring three secrets up front meant a stranger's first
command failed with a template error, which reads as a broken chart rather than
a deliberate prompt. Generating them is also safer than the alternative people
actually reach for, which is copying an example value out of the docs.

The lookup-then-generate pattern matches secrets-generated.yaml: on upgrade the
existing Secret is read back and reused verbatim, so rotating them is a
deliberate act rather than a side effect of `helm upgrade`. Note that
ENCRYPTION_MASTER_KEY encrypts stored integration credentials — if it changes,
those become undecryptable, which is exactly why this reuses rather than
regenerates.

`helm template` and `--dry-run` cannot perform a lookup, so they emit fresh
random values every time. That churn is expected and is not what gets installed.
*/}}
{{- if not .Values.platform.existingSecretName }}
{{- $name := include "vistaplatform.platformSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $jwt := .Values.platform.jwtSecret }}
{{- $internal := .Values.platform.internalAuthSecret }}
{{- $master := .Values.platform.encryptionMasterKey }}
{{- if $existing }}
{{- $jwt = default (index $existing.data "jwt-secret" | b64dec) $jwt }}
{{- $internal = default (index $existing.data "internal-auth-secret" | b64dec) $internal }}
{{- $master = default (index $existing.data "encryption-master-key" | b64dec) $master }}
{{- end }}
{{- $jwt = default (randAlphaNum 64) $jwt }}
{{- $internal = default (randAlphaNum 64) $internal }}
{{- $master = default (randAlphaNum 64) $master }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "vistaplatform.labels" . | nindent 4 }}
  annotations:
    # Survive `helm uninstall`: losing encryption-master-key orphans every
    # stored integration credential, and the PVCs are kept for the same reason.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  jwt-secret: {{ $jwt | quote }}
  internal-auth-secret: {{ $internal | quote }}
  encryption-master-key: {{ $master | quote }}
{{- end }}
