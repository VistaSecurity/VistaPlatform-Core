{{- if .Values.datastores.redis.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  labels:
    {{- include "vistaplatform.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      {{- include "vistaplatform.selectorLabels" (dict "ctx" . "component" "redis") | nindent 6 }}
  template:
    metadata:
      # Selector labels + the static part-of label only. The full
      # vistaplatform.labels set carries helm.sh/chart and the app version, so
      # on a pod template every chart bump would roll this single-replica
      # datastore. part-of is what the NetworkPolicies select on.
      labels:
        {{- include "vistaplatform.selectorLabels" (dict "ctx" . "component" "redis") | nindent 8 }}
        app.kubernetes.io/part-of: vistaplatform
    spec:
      automountServiceAccountToken: false
      {{- with include "vistaplatform.pullSecrets" . }}
      {{- . | nindent 6 }}
      {{- end }}
      securityContext:
        {{- $psc := mergeOverwrite (fromYaml (include "vistaplatform.podSecurityContext" .)) (dict "fsGroup" 999 "runAsUser" 999) }}
        {{- toYaml $psc | nindent 8 }}
      containers:
        - name: redis
          image: "{{ .Values.datastores.redis.image.repository }}:{{ .Values.datastores.redis.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "vistaplatform.containerSecurityContext" . | nindent 12 }}
          # The server is Valkey (BSD-3, Redis-protocol compatible). The
          # redis-server / redis-cli names are the compat symlinks the Valkey
          # image ships, kept so an operator who points
          # datastores.redis.image at a Redis-protocol mirror still starts.
          #
          # --dbfilename / --appenddirname give Valkey its OWN files on the
          # existing PVC. Valkey 8 cannot load the RDB that Redis 7.4 (format
          # 12) or Redis 8 (format 15) wrote — it exits with "Can't handle RDB
          # format version 12", a crash-loop on helm upgrade. With new names it
          # starts empty (Redis holds only caches and short-lived state), and
          # the old Redis files stay untouched beside it, so a helm rollback
          # to a Redis-image chart finds its data again.
          command:
            - redis-server
            - --dir
            - /data
            - --dbfilename
            - valkey-dump.rdb
            - --appenddirname
            - valkey-appendonlydir
            - --appendonly
            - "yes"
            - --requirepass
            - $(REDIS_PASSWORD)
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "vistaplatform.generatedSecretName" . }}
                  key: redis-password
          ports:
            - name: redis
              containerPort: 6379
          resources:
            {{- toYaml .Values.datastores.redis.resources | nindent 12 }}
          volumeMounts:
            - name: redis-data
              mountPath: /data
          livenessProbe:
            tcpSocket: { port: 6379 }
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a "$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG
            initialDelaySeconds: 5
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ coalesce .Values.datastores.redis.storageClassName .Values.datastores.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.datastores.redis.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    {{- include "vistaplatform.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  selector:
    {{- include "vistaplatform.selectorLabels" (dict "ctx" . "component" "redis") | nindent 4 }}
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
{{- end }}
