{{- if .Values.datastores.redis.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  labels:
    {{- include "vistaplatform.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      {{- include "vistaplatform.selectorLabels" (dict "ctx" . "component" "redis") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vistaplatform.labels" . | nindent 8 }}
        app.kubernetes.io/component: redis
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "vistaplatform.podSecurityContext" . | nindent 8 }}
        runAsUser: 999
        fsGroup: 999
      containers:
        - name: redis
          image: "{{ .Values.datastores.redis.image.repository }}:{{ .Values.datastores.redis.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "vistaplatform.containerSecurityContext" . | nindent 12 }}
          command:
            - redis-server
            - --appendonly
            - "yes"
            - --requirepass
            - $(REDIS_PASSWORD)
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "vistaplatform.generatedSecretName" . }}
                  key: redis-password
          ports:
            - name: redis
              containerPort: 6379
          resources:
            {{- toYaml .Values.datastores.redis.resources | nindent 12 }}
          volumeMounts:
            - name: redis-data
              mountPath: /data
          livenessProbe:
            tcpSocket: { port: 6379 }
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a "$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG
            initialDelaySeconds: 5
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ coalesce .Values.datastores.redis.storageClassName .Values.datastores.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.datastores.redis.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    {{- include "vistaplatform.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  selector:
    {{- include "vistaplatform.selectorLabels" (dict "ctx" . "component" "redis") | nindent 4 }}
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
{{- end }}
