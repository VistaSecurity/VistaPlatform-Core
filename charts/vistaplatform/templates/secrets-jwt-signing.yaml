{{/*
JWT signing keys (#584).

The platform used to sign AND verify every session token with one shared HS256
secret held by all ~17 services. Any pod, log line or core dump that touched it
could mint a token for any user, any tenant, any role.

Now one ECDSA P-256 private key is generated here and mounted into the two
services that ISSUE tokens — auth-service (tenant sessions) and admin-service
(platform sessions). Every other service fetches the PUBLIC half from the
issuer JWKS endpoint (`JWT_JWKS_URL`, defaulting to auth-service's plaintext
listener). A leak from a verifier grants nothing.

Same lookup-and-preserve pattern as secrets-generated.yaml: an existing key is
reused verbatim on upgrade, so a helm upgrade does NOT invalidate every live
session. helm.sh/resource-policy: keep means uninstall/reinstall into the same
namespace also keeps sessions working.

`helm template` and `--dry-run` cannot perform a lookup, so they emit a fresh
throwaway key. That is expected — do not read it as churn.

The `vistaplatform.io/legacy-hmac-sessions: none` annotation records that a
live INSTALL created this key, i.e. that no HS256 session ever existed on the
release. jwtSigning.acceptLegacyHmac=auto reads it (_jwt-signing.tpl) so a
fresh install does not re-open the legacy window on its first upgrade. It is
written only on that first render and then preserved as found: a Secret created
by an upgrade (signing switched on for a release that was issuing HS256) never
gets it, and auto falls back to the Secret's age.

Opting out: jwtSigning.enabled=false skips this entirely and the platform keeps
signing HS256 with the shared secret, exactly as before. That exists so the
upgrade is reversible, not because it is a reasonable long-term posture.
*/}}
{{- if .Values.jwtSigning.enabled }}
{{- $name := include "vistaplatform.jwtSigningSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $markerKey := include "vistaplatform.jwtLegacyHmacMarkerKey" . }}
{{- $facts := fromJson (include "vistaplatform.jwtLegacyHmacFacts" .) }}
{{- $marker := "" }}
{{- if $facts.found }}
{{- $marker = $facts.marker }}
{{- else if and .Release.IsInstall $facts.live }}
{{- $marker = "none" }}
{{- end }}
{{- $privPEM := "" }}
{{- if and $existing $existing.data }}
{{- $privPEM = index $existing.data "signing-key.pem" | default "" | b64dec }}
{{- end }}
{{- if and (not $privPEM) .Values.jwtSigning.existingPrivateKeyPEM }}
{{/*
  An operator-supplied key. Use this to import key material from a KMS or HSM
  export, or to pin the same key across two clusters. Only consulted on first
  render — once the Secret exists, the stored key wins, so changing this value
  later is a no-op rather than a silent session-invalidating rotation.
*/}}
{{- $privPEM = .Values.jwtSigning.existingPrivateKeyPEM }}
{{- end }}
{{- if not $privPEM }}
{{- $privPEM = genPrivateKey "ecdsa" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "vistaplatform.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    {{- if $marker }}
    {{ $markerKey }}: {{ $marker | quote }}
    {{- end }}
type: Opaque
stringData:
  {{/*
    One PEM file, one key. To rotate: prepend the NEW key's PEM block ahead of
    the current one and helm upgrade. The first block signs; later blocks stay
    published for verification so sessions minted before the rotation keep
    working until they expire. Drop the old block on a later upgrade, once one
    max-token-TTL has passed. See deployment-guide §5H.
  */}}
  signing-key.pem: |
{{ $privPEM | indent 4 }}
{{- end }}
