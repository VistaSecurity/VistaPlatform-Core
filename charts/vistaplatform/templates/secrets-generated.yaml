{{/*
Chart-managed Secret holding generated datastore credentials.

helm.sh/resource-policy: keep ensures the Secret survives `helm uninstall` so
that re-installing into the same namespace recovers the same credentials —
critical when PVCs are also kept and the existing Postgres/Redis/InfluxDB data
must remain accessible.

The lookup pattern: if the Secret already exists (upgrade path), reuse its
values verbatim. If it does not exist (fresh install), generate strong random
values. This means `helm template` and `helm install --dry-run` produce
ephemeral random values — that is expected, do not be alarmed by churn there.
*/}}
{{- $name := include "vistaplatform.generatedSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $pgPass := "" }}
{{- $redisPass := "" }}
{{- $influxPass := "" }}
{{- $influxToken := "" }}
{{- $natsToken := "" }}
{{- if and $existing $existing.data }}
{{- $pgPass     = index $existing.data "postgres-password"  | default "" | b64dec }}
{{- $redisPass  = index $existing.data "redis-password"     | default "" | b64dec }}
{{- $influxPass = index $existing.data "influx-password"    | default "" | b64dec }}
{{- $influxToken = index $existing.data "influx-token"      | default "" | b64dec }}
{{- $natsToken  = index $existing.data "nats-token"         | default "" | b64dec }}
{{- end }}
{{- if not $pgPass }}{{- $pgPass = randAlphaNum 32 }}{{- end }}
{{- if not $redisPass }}{{- $redisPass = randAlphaNum 32 }}{{- end }}
{{- if not $influxPass }}{{- $influxPass = randAlphaNum 32 }}{{- end }}
{{- if not $influxToken }}{{- $influxToken = randAlphaNum 48 }}{{- end }}
{{- if not $natsToken }}{{- $natsToken = randAlphaNum 32 }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "vistaplatform.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  postgres-password: {{ $pgPass | quote }}
  redis-password: {{ $redisPass | quote }}
  influx-password: {{ $influxPass | quote }}
  influx-token: {{ $influxToken | quote }}
  nats-token: {{ $natsToken | quote }}
