{{- if and .Values.networkPolicy.enabled .Values.networkPolicy.egressEnabled }}
{{/* ───────────────────────────────────────────────────────────────────────
     Egress allow rules. Activated only when networkPolicy.egressEnabled
     is true. Mirrors the consumer side of the existing ingress allow
     rules: the registry's .Values.backends[*].needs.{postgres,redis,nats,
     influxdb} fields decide which backends are granted outbound to each
     datastore. Backend-to-backend HTTP on :8080 is allowed for all
     backends (the gateway-free chart routes inter-service traffic
     directly). The services in .Values.networkPolicy.externalEgressBackends
     get a broader outbound allow (everything EXCEPT the cluster's own pod
     and Service CIDRs, plus link-local) so they can reach customer device
     networks / vendor APIs / SMTP / webhooks.
     ─────────────────────────────────────────────────────────────────── */}}

{{/* DNS egress for every pod in the namespace. Without this the default-deny
     egress block kills name resolution and every service fails to start. */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-dns
  labels:
    {{- include "vistaplatform.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.dnsNamespace }}
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---

{{/* Backend-to-backend HTTP on :8080. Compliance-engine → inventory-service
     (live RuleEvaluator fallback), tenant-health-service → multiple
     services, etc. Scoped to pods labeled part-of=vistaplatform in this
     namespace, which matches the existing allow-ingress-to-backends rule
     on the inbound side. */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-backend-to-backend
  labels:
    {{- include "vistaplatform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: vistaplatform
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: vistaplatform
      ports:
        - { protocol: TCP, port: 8080 }
        # mTLS variant of the same backend-to-backend path.
        - { protocol: TCP, port: 8443 }
---

{{/* Backends + jobs that need Postgres (consumer side of the existing
     allow-backends-to-postgres ingress rule). Same $pgConsumers list — appends
     rls-roles (only when serviceRls is enabled) so the role-grant Job can reach
     Postgres under egress default-deny (#916); off-toggle render is unchanged. */}}
{{- $pgConsumers := list "schema-migration" "seed-data" }}
{{- if .Values.serviceRls.enabled }}
  {{- $pgConsumers = append $pgConsumers "rls-roles" }}
{{- end }}
{{- range $name, $svc := .Values.backends }}
  {{- if (default (dict) $svc.needs).postgres }}
    {{- $pgConsumers = append $pgConsumers $name }}
  {{- end }}
{{- end }}
{{- if $pgConsumers }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-to-postgres
  labels:
    {{- include "vistaplatform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/component, operator: In, values: [{{ $pgConsumers | join "," }}] }
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: postgres
      ports:
        - { protocol: TCP, port: 5432 }
{{- end }}
---

{{/* Backends that need Redis. */}}
{{- $redisConsumers := list }}
{{- range $name, $svc := .Values.backends }}
  {{- if (default (dict) $svc.needs).redis }}
    {{- $redisConsumers = append $redisConsumers $name }}
  {{- end }}
{{- end }}
{{- if $redisConsumers }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-to-redis
  labels:
    {{- include "vistaplatform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/component, operator: In, values: [{{ $redisConsumers | join "," }}] }
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: redis
      ports:
        - { protocol: TCP, port: 6379 }
{{- end }}
---

{{/* Backends that need NATS. */}}
{{- $natsConsumers := list }}
{{- range $name, $svc := .Values.backends }}
  {{- if (default (dict) $svc.needs).nats }}
    {{- $natsConsumers = append $natsConsumers $name }}
  {{- end }}
{{- end }}
{{- if $natsConsumers }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-to-nats
  labels:
    {{- include "vistaplatform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/component, operator: In, values: [{{ $natsConsumers | join "," }}] }
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: nats
      ports:
        - { protocol: TCP, port: 4222 }
{{- end }}
---

{{/* monitoring-service polls the NATS HTTP monitor port (8222). */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-monitoring-to-nats-http
  labels:
    {{- include "vistaplatform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: monitoring-service
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: nats
      ports:
        - { protocol: TCP, port: 8222 }
---

{{/* Backends that need InfluxDB. */}}
{{- $influxConsumers := list }}
{{- range $name, $svc := .Values.backends }}
  {{- if (default (dict) $svc.needs).influxdb }}
    {{- $influxConsumers = append $influxConsumers $name }}
  {{- end }}
{{- end }}
{{- if and $influxConsumers .Values.datastores.influxdb.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-to-influxdb
  labels:
    {{- include "vistaplatform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/component, operator: In, values: [{{ $influxConsumers | join "," }}] }
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: influxdb
      ports:
        - { protocol: TCP, port: 8086 }
{{- end }}
---

{{/* Outbound egress for backends that legitimately need to leave the
     cluster: sensor-manager / cluster-sensor-service (TLS + SSH probing of
     arbitrary endpoints), device-interrogation-service (vendor mgmt APIs and
     SNMP/OT probes on customer networks), notification-service (webhooks +
     SMTP), and auth-service / admin-service / monitoring-service /
     cluster-sensor-service, which each open their own SMTP connection via
     shared/email rather than routing mail through a central relay pod.

     Scope is 0.0.0.0/0 MINUS .Values.networkPolicy.clusterInternalCIDRs
     (the cluster's own pod and Service ranges) MINUS link-local. It is
     deliberately NOT "0.0.0.0/0 minus all of RFC1918": the customer device
     networks these services exist to reach are themselves RFC1918, so
     excluding 10/8 + 172.16/12 + 192.168/16 blocked interrogation and
     internal active scanning outright while the API still reported success.

     What this does NOT permit: reaching other namespaces' pods or in-cluster
     ClusterIP Services by address, and the instance-metadata endpoint. What
     it DOES permit that a blanket RFC1918 block did not: any address on the
     customer's own networks, including node IPs unless the operator adds the
     node subnet to clusterInternalCIDRs. Ports come from
     .Values.networkPolicy.externalEgressPorts so an operator can tighten
     them. */}}
{{- if .Values.networkPolicy.externalEgressBackends }}
{{- $clusterCIDRs := .Values.networkPolicy.clusterInternalCIDRs | default (list) }}
{{- if not $clusterCIDRs }}
  {{- fail "networkPolicy.egressEnabled requires networkPolicy.clusterInternalCIDRs to list this cluster's pod and Service CIDRs. Leaving it empty would render allow-egress-outbound as an unrestricted outbound allow. Find yours with: kubectl cluster-info dump | grep -E 'cluster-cidr|service-cluster-ip-range'" }}
{{- end }}
{{- $egressPorts := .Values.networkPolicy.externalEgressPorts | default (list) }}
{{- if not $egressPorts }}
  {{- fail "networkPolicy.externalEgressPorts must list at least one port; an empty list would deny all outbound traffic for externalEgressBackends." }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-outbound
  labels:
    {{- include "vistaplatform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/component, operator: In, values: [{{ .Values.networkPolicy.externalEgressBackends | join "," }}] }
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- range $cidr := $clusterCIDRs }}
              - {{ $cidr | quote }}
              {{- end }}
              {{- /* Link-local (RFC 3927) incl. the cloud instance-metadata
                     endpoint 169.254.169.254. Not operator-configurable:
                     no supported outbound path needs it. */}}
              {{- if not (has "169.254.0.0/16" $clusterCIDRs) }}
              - "169.254.0.0/16"
              {{- end }}
      ports:
        {{- range $port := $egressPorts }}
        - protocol: {{ $port.protocol | default "TCP" }}
          port: {{ $port.port }}
          {{- if $port.endPort }}
          endPort: {{ $port.endPort }}
          {{- end }}
        {{- end }}
{{- end }}
{{- end }}
