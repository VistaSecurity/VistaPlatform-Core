{{/*
The two Kubernetes identities of platform maintenance (spec
platform-maintenance.md D1).

  maintenance-service       The maintenance-service pod's own identity: reads
                            the Helm release state and runs the backup and
                            update Jobs. The only backend that mounts a token.
  vistaplatform-updater     The identity the update / rollback Job runs
                            `helm upgrade` / `helm rollback` as. No workload in
                            the chart runs as it; the service creates the Job
                            from the template in update-job-configmap.yaml.

Both are namespace-scoped (Role, never ClusterRole); see rbac-*.yaml.
*/}}
{{- if include "vistaplatform.maintenanceEnabled" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: maintenance-service
  labels:
    {{- include "vistaplatform.labels" . | nindent 4 }}
    app.kubernetes.io/component: maintenance-service
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vistaplatform-updater
  labels:
    {{- include "vistaplatform.labels" . | nindent 4 }}
    app.kubernetes.io/component: maintenance-updater
# The updater's token is mounted only into the update Job's pod, which asks for
# it explicitly; nothing else running as this account should get one.
automountServiceAccountToken: false
{{- end }}
