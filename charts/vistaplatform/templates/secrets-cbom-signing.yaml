{{/*
CBOM artifact signing key.

cbom-service signs every artifact it is asked to sign (Enterprise) with one
Ed25519 private key. The key is DEDICATED: it is not INTERNAL_AUTH_SECRET, which
every backend holds for service-to-service MACs, so a compromised pod cannot
forge an artifact signature. Only cbom-service mounts this Secret
(CBOM_SIGNING_KEY_FILE, see backend/_deployment.tpl).

Where the key comes from, in order (the same shape as the install signing key
in secrets-install.yaml):

  1. `cbomSigning.keyPEM`, when set — used VERBATIM (a PKCS#8 "PRIVATE KEY"
     block holding an Ed25519 key). For GitOps renders (ArgoCD, Flux,
     `helm template | kubectl apply`), which cannot `lookup`; keep the value in
     an encrypted values file, never in plain git. This is also how an
     operator ROTATES the key.
  2. The existing Secret's signing-key.pem (lookup-and-preserve), reused on
     every `helm upgrade`.
  3. A new key from `genPrivateKey "ed25519"`, on first install.

helm.sh/resource-policy: keep means an uninstall/reinstall into the same
namespace keeps the key. `helm template` and `--dry-run` emit a throwaway key.

Rotation does not strand old artifacts: cbom-service records the public half of
every key it has signed with (cbom_signing_keys), so artifacts signed under a
retired key still verify under their original kid.
*/}}
{{- $cs := .Values.cbomSigning | default dict }}
{{- $name := include "vistaplatform.cbomSigningSecretName" . }}
{{- $pinned := $cs.keyPEM | default "" | toString | trim }}
{{- if and (not $cs.existingSecretName) (or (include "vistaplatform.generateSecrets" .) $pinned) }}
{{- $key := "" }}
{{- if $pinned }}
{{- if not (contains "BEGIN PRIVATE KEY" $pinned) }}
{{- fail "cbomSigning.keyPEM must be a PKCS#8 PEM (\"BEGIN PRIVATE KEY\" block) holding an Ed25519 key" }}
{{- end }}
{{- $key = $pinned }}
{{- else }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and $existing $existing.data }}
{{- $key = index $existing.data "signing-key.pem" | default "" | b64dec }}
{{- end }}
{{- if not $key }}
{{- $key = genPrivateKey "ed25519" }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "vistaplatform.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  signing-key.pem: |
{{ $key | trim | indent 4 }}
{{- end }}
