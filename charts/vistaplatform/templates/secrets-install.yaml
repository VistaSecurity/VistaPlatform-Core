{{/*
This install's identity: one UUID that never changes.

An MSP licence is bound to it (the token's vc_install_id), and the usage
reports an MSP install produces will carry it, so it must not change across
`helm upgrade`. Where the value comes from, in order:

  1. `install.id`, when set — used VERBATIM. This is the only reliable source
     for GitOps renders (ArgoCD, Flux, `helm template | kubectl apply`), which
     cannot perform a `lookup` and would otherwise write a fresh UUID on every
     render.
  2. The existing Secret's value (lookup-and-preserve, the same pattern as
     secrets-generated.yaml), reused on every `helm upgrade`.
  3. A new UUID, on the first install.

helm.sh/resource-policy: keep means an uninstall/reinstall into the same
namespace keeps the Secret too.

admin-service is the only consumer (INSTALL_ID, see backend/_deployment.tpl).
It records the id in the platform_install table on its FIRST boot; from then on
the database copy is authoritative. If this Secret later disagrees (a GitOps
render without install.id, a recreated Secret), admin-service keeps the
database id, logs a warning naming both ids, and tells the operator to pin
install.id to the database's id. So a drifted Secret cannot orphan a licence —
but it is still wrong, and pinning install.id is the fix.

`helm template` and `--dry-run` without install.id emit a fresh throwaway id.

The same Secret carries the install SIGNING KEY (signing-key.pem): the ECDSA
P-256 key every licence usage report is signed with (edition-licensing spec
PR 4). Vista Security's receiver pins the first key it sees to the licence, so
it must be exactly as stable as the id, and comes from the same three places:

  1. `install.signingKeyPEM`, when set — used VERBATIM (a PEM "EC PRIVATE KEY"
     or PKCS#8 "PRIVATE KEY" block, P-256). For GitOps renders; keep the value
     in a sealed/SOPS-encrypted values file, never in plain git.
  2. The existing Secret's signing-key.pem (lookup-and-preserve).
  3. A new key from genPrivateKey "ecdsa" (P-256), on the first install — or
     on the first upgrade to a chart that has this, for a Secret created
     before it: the stored install-id is reused and only the key is new.

admin-service alone mounts it (INSTALL_SIGNING_KEY_FILE, see
backend/_deployment.tpl) and records the public half in platform_install.
A rendered key that differs from the recorded one is logged loudly by
admin-service: that is a new signing identity as far as the receiver is
concerned.
*/}}
{{- $name := include "vistaplatform.installSecretName" . }}
{{- $pinned := (.Values.install | default dict).id | default "" | toString | trim }}
{{- $installID := "" }}
{{- if $pinned }}
{{- if not (regexMatch "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$" $pinned) }}
{{- fail (printf "install.id %q is not a UUID — it must be the id this install already uses (admin-service logs it at boot: \"[edition] this install's id: ...\")" $pinned) }}
{{- end }}
{{- $installID = $pinned }}
{{- else }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and $existing $existing.data }}
{{- $installID = index $existing.data "install-id" | default "" | b64dec }}
{{- end }}
{{- if not $installID }}
{{- $installID = uuidv4 }}
{{- end }}
{{- end }}
{{- $pinnedKey := (.Values.install | default dict).signingKeyPEM | default "" | toString | trim }}
{{- $signingKey := "" }}
{{- if $pinnedKey }}
{{- if not (regexMatch "-----BEGIN (EC )?PRIVATE KEY-----" $pinnedKey) }}
{{- fail "install.signingKeyPEM must be a PEM private key (\"-----BEGIN EC PRIVATE KEY-----\" or \"-----BEGIN PRIVATE KEY-----\"), ECDSA P-256" }}
{{- end }}
{{- $signingKey = $pinnedKey }}
{{- else }}
{{- $existingKey := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and $existingKey $existingKey.data }}
{{- $signingKey = index $existingKey.data "signing-key.pem" | default "" | b64dec }}
{{- end }}
{{- if not $signingKey }}
{{- $signingKey = genPrivateKey "ecdsa" }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "vistaplatform.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  install-id: {{ $installID | quote }}
  signing-key.pem: |
{{ $signingKey | trim | indent 4 }}
