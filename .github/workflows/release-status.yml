# Publish the feature-status feed for a release.
#
# The project website's release-status page lists the capabilities customers
# look for and where each stands. It reads features/latest.json from the
# `release-status` branch of this repository. This workflow writes it, from
# standards/feature-status.yaml as that file stands at the release tag.
#
#   features/latest.json      the latest STABLE release
#   features/<tag>.json       every release, kept as history
#
# WHEN. After Release Core succeeds for a tag, so a feature marked `available`
# is in a release that passed its gates. A dispatch republishes one tag (from
# that tag's catalogue) — the way to repair a run that failed part-way.
#
# ORDERING. The versioned file is pushed before latest.json is advanced, in two
# fast-forward pushes. latest.json only ever names the release GitHub reports as
# latest, and never a prerelease.
name: Release Status

on:
  workflow_run:
    workflows: ["Release Core"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to (re)publish, e.g. v4.4.0'
        required: true

permissions:
  contents: read

concurrency:
  group: release-status
  cancel-in-progress: false

env:
  STATUS_BRANCH: release-status

jobs:
  publish:
    # Public repository only. The private tree carries this file too, and its
    # Release Core runs (and succeeds) as a guard no-op on every commercial tag;
    # without this the job would take a GitHub-hosted runner there just to find
    # out it has nothing to do. Public, not a repository name: names change.
    if: >-
      github.event.repository.private == false &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push to the release-status branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Also present in the private tree this repository is exported from; Core is
      # precisely the tree with no services/*/ee.
      - name: Resolve the release
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          RUN_HEAD: ${{ github.event.workflow_run.head_branch }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if compgen -G "services/*/ee" > /dev/null; then
            echo "Not the Core tree — nothing to publish here."
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          TAG="${INPUT_TAG:-$RUN_HEAD}"
          # [[ =~ ]] anchors the whole string, so no newline reaches $GITHUB_OUTPUT.
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            if [ "$EVENT" = "workflow_dispatch" ]; then echo "::error::'$TAG' is not a release tag"; exit 1; fi
            echo "::notice::Release Core ran for '$TAG', not a release tag — nothing to publish"
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          { echo "run=true"; echo "tag=$TAG"; } >> "$GITHUB_OUTPUT"

      - name: Gate on the published release
        if: steps.tag.outputs.run == 'true'
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          if ! rel="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")"; then
            echo "::error::no GitHub Release for ${TAG}"; exit 1
          fi
          if [ "$(jq -r .draft <<<"$rel")" != "false" ]; then echo "::error::the ${TAG} release is a draft"; exit 1; fi
          # The release job uploads these last: all three present means it finished.
          for a in SHA256SUMS SHA256SUMS.sig SHA256SUMS.pem; do
            if ! jq -e --arg a "$a" 'any(.assets[]; .name == $a)' <<<"$rel" >/dev/null; then
              echo "::error::the ${TAG} release has no ${a} — its release job did not complete"; exit 1
            fi
          done
          {
            echo "commit=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG}" --jq .sha)"
            echo "published_at=$(jq -r .published_at <<<"$rel")"
            echo "url=$(jq -r .html_url <<<"$rel")"
            echo "prerelease=$(jq -r .prerelease <<<"$rel")"
            echo "latest=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2>/dev/null || true)"
          } >> "$GITHUB_OUTPUT"

      # The catalogue and generator as they stand AT THE TAG — the feed describes
      # that release, not whatever the default branch holds later.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: steps.tag.outputs.run == 'true'
        with:
          ref: ${{ steps.tag.outputs.tag }}
          path: release

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        if: steps.tag.outputs.run == 'true'
        with:
          node-version: '24'

      - name: Build the feed
        if: steps.tag.outputs.run == 'true'
        working-directory: release
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          COMMIT: ${{ steps.release.outputs.commit }}
          PUBLISHED_AT: ${{ steps.release.outputs.published_at }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ ! -f scripts/feature-status.mjs ] || [ ! -f standards/feature-status.yaml ]; then
            echo "::error::${TAG} predates the feature-status catalogue — nothing to publish for it"; exit 1
          fi
          (cd scripts && npm ci --no-fund --no-audit)
          node scripts/feature-status.mjs build --tag "$TAG" --commit "$COMMIT" \
            --published-at "$PUBLISHED_AT" --release-url "$RELEASE_URL" --run-url "$RUN_URL" \
            --out "$RUNNER_TEMP/features.json"

      - name: Publish to the status branch
        if: steps.tag.outputs.run == 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
          LATEST: ${{ steps.release.outputs.latest }}
        run: |
          set -euo pipefail
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          DIR="$RUNNER_TEMP/status"
          if git ls-remote --exit-code --heads origin "$STATUS_BRANCH" >/dev/null; then
            git fetch --no-tags --depth=1 origin "$STATUS_BRANCH"
            git worktree add --detach "$DIR" FETCH_HEAD
          else
            git worktree add --detach "$DIR"
            git -C "$DIR" checkout --quiet --orphan status-init
            git -C "$DIR" rm -r --quiet --force .
            printf '# Release status\n\nFeature status for each release, written only by the Release Status workflow.\n' > "$DIR/README.md"
            git -C "$DIR" add README.md
          fi
          cd "$DIR"

          publish() {  # publish <path> <message>
            mkdir -p "$(dirname "$1")"
            cp "$RUNNER_TEMP/features.json" "$1"
            git add "$1"
            if git diff --cached --quiet; then echo "$1 unchanged"; return 0; fi
            git commit --quiet -m "$2"
            # Fast-forward only; a rejection means another writer got there first.
            git push origin "HEAD:refs/heads/${STATUS_BRANCH}"
            echo "published $1"
          }

          publish "features/${TAG}.json" "features: ${TAG} (run ${GITHUB_RUN_ID})"
          if [ "$PRERELEASE" = "true" ] || [[ "$TAG" == *-* ]]; then
            echo "::notice::${TAG} is a prerelease — versioned file only"
          elif [ "$TAG" != "$LATEST" ]; then
            echo "::notice::${TAG} is not GitHub's latest release ('${LATEST:-none}') — versioned file only"
          else
            publish features/latest.json "features: latest → ${TAG}"
          fi

      - name: Summary
        if: always() && steps.tag.outputs.run == 'true'
        run: |
          F="$RUNNER_TEMP/features.json"
          [ -s "$F" ] || { echo "## Feature status — nothing published" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          {
            echo "## Feature status — $(jq -r .release.tag "$F")"
            echo
            echo "| Feature | Status | Edition |"
            echo "|---|---|---|"
            jq -r '.features[] | "| \(.name) | \(.status) | \(.edition) |"' "$F"
          } >> "$GITHUB_STEP_SUMMARY"
