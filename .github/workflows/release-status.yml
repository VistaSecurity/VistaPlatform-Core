# Publish the release-status feed for one release.
#
# The project website shows, for the latest stable release, which product
# capabilities were verified end to end for that exact version. It reads a
# small JSON document from the `release-status` branch of this repository:
#
#   latest.json          the latest STABLE release's verification
#   releases/<tag>.json  every verified release, kept as history
#
# The schema, the check catalogue and the validator live in
# scripts/release-status-feed.mjs. This workflow is the only writer.
#
# WHERE THE RESULTS COME FROM. Verification is not run here. It runs on the
# maintainers' own deployment of the release, which exercises the product the
# way a customer does — sensors registered, discoveries submitted, the tenant
# UI driven in a browser — and needs a live installation that a hosted runner
# does not have. When that run finishes it sends this repository a
# `release-verification` dispatch carrying exactly three things: the tag it
# verified, when, and one result per check. Everything that describes the
# RELEASE (its commit, publication time and URL) is read from GitHub below and
# never taken from the payload.
#
# THE GATE. A feed is published only for a tag whose GitHub Release exists, is
# not a draft, and carries the signed checksum files the Release Core `release`
# job uploads as its final step — so a tag push alone, or a release run that
# failed part-way, never gets a status. A payload that fails validation is
# rejected, not repaired.
#
# ORDERING. The versioned file is committed and pushed before latest.json is
# advanced, in two pushes. latest.json only ever names the release GitHub
# itself reports as latest, and never a prerelease: an RC may get a versioned
# file but cannot replace the stable pointer, and republishing an older tag
# (a correction) leaves latest.json alone.
#
# RERUNS AND CORRECTIONS. A second dispatch for the same tag replaces that
# tag's file. The sender dispatches only after its full verification suite
# completed, and a correction is a fresh verification run, never a hand-edited
# result. Every publication is a commit on the branch and a run of this
# workflow, so the history is auditable from both ends. Pushes are
# fast-forward only; nothing here force-pushes.
name: Release Status

on:
  repository_dispatch:
    types: [release-verification]

permissions:
  contents: read

# One publication at a time: two dispatches racing on the branch would turn
# the second push into a non-fast-forward rejection.
concurrency:
  group: release-status
  cancel-in-progress: false

env:
  STATUS_BRANCH: release-status

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push to the release-status branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # This workflow also exists in the private tree this repository is
      # exported from. Same test Release Core uses: Core is precisely the tree
      # with no services/*/ee.
      - name: Only in the Core tree
        id: guard
        run: |
          if compgen -G "services/*/ee" > /dev/null; then
            echo "Not the Core tree — nothing to publish here."
            echo "is_core=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_core=true" >> "$GITHUB_OUTPUT"
          fi

      # The payload goes to a file through an env var, never through `${{ }}`
      # inside a script: it is data, and interpolating it would make it code.
      - name: Validate the payload
        if: steps.guard.outputs.is_core == 'true'
        id: payload
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          set -euo pipefail
          P="$RUNNER_TEMP/payload.json"
          printf '%s' "$PAYLOAD" > "$P"
          node scripts/release-status-feed.mjs validate-payload "$P"
          echo "file=$P" >> "$GITHUB_OUTPUT"
          echo "tag=$(jq -r .tag "$P")" >> "$GITHUB_OUTPUT"

      - name: Gate on the published release
        if: steps.guard.outputs.is_core == 'true'
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.payload.outputs.tag }}
        run: |
          set -euo pipefail
          if ! rel="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")"; then
            echo "::error::no GitHub Release for ${TAG} — the release job has not published it; nothing to report on"
            exit 1
          fi
          if [ "$(jq -r .draft <<<"$rel")" != "false" ]; then
            echo "::error::the ${TAG} release is a draft"
            exit 1
          fi
          # The release job uploads these last. All three present means it
          # finished; any missing means it failed or is still running.
          for a in SHA256SUMS SHA256SUMS.sig SHA256SUMS.pem; do
            if ! jq -e --arg a "$a" 'any(.assets[]; .name == $a)' <<<"$rel" >/dev/null; then
              echo "::error::the ${TAG} release has no ${a} — its release job did not complete"
              exit 1
            fi
          done
          commit="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG}" --jq .sha)"
          latest="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2>/dev/null || true)"
          {
            echo "commit=${commit}"
            echo "published_at=$(jq -r .published_at <<<"$rel")"
            echo "url=$(jq -r .html_url <<<"$rel")"
            echo "prerelease=$(jq -r .prerelease <<<"$rel")"
            echo "latest=${latest}"
          } >> "$GITHUB_OUTPUT"
          echo "${TAG}: commit ${commit}, prerelease $(jq -r .prerelease <<<"$rel"); GitHub latest is '${latest:-none}'"

      - name: Build the feed
        if: steps.guard.outputs.is_core == 'true'
        env:
          PAYLOAD_FILE: ${{ steps.payload.outputs.file }}
          COMMIT: ${{ steps.release.outputs.commit }}
          PUBLISHED_AT: ${{ steps.release.outputs.published_at }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          node scripts/release-status-feed.mjs build --payload "$PAYLOAD_FILE" \
            --commit "$COMMIT" --published-at "$PUBLISHED_AT" \
            --release-url "$RELEASE_URL" --run-url "$RUN_URL" \
            --out "$RUNNER_TEMP/feed.json"
          cat "$RUNNER_TEMP/feed.json"

      - name: Publish to the status branch
        if: steps.guard.outputs.is_core == 'true'
        env:
          TAG: ${{ steps.payload.outputs.tag }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
          LATEST: ${{ steps.release.outputs.latest }}
        run: |
          set -euo pipefail
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          DIR="$RUNNER_TEMP/status"
          if git ls-remote --exit-code --heads origin "$STATUS_BRANCH" >/dev/null; then
            git fetch --no-tags --depth=1 origin "$STATUS_BRANCH"
            git worktree add --detach "$DIR" FETCH_HEAD
          else
            # First publication: an orphan branch holding only the feed.
            git worktree add --detach "$DIR"
            git -C "$DIR" checkout --quiet --orphan status-init
            git -C "$DIR" rm -r --quiet --force .
            {
              echo '# Release status'
              echo
              echo 'Machine-readable verification results for each release, written only by'
              echo 'the `Release Status` workflow (`.github/workflows/release-status.yml` on'
              echo 'the default branch). Schema and check catalogue:'
              echo '`scripts/release-status-feed.mjs`.'
              echo
              echo '- `latest.json` — the latest stable release'
              echo '- `releases/<tag>.json` — every verified release'
              echo
              echo 'A result describes a verification run against that exact release. It is'
              echo 'not a statement about service uptime or about any particular deployment.'
            } > "$DIR/README.md"
            git -C "$DIR" add README.md
          fi
          cd "$DIR"

          publish() {  # publish <path> <message>
            mkdir -p "$(dirname "$1")"
            cp "$RUNNER_TEMP/feed.json" "$1"
            git add "$1"
            if git diff --cached --quiet; then
              echo "$1 unchanged"
              return 0
            fi
            git commit --quiet -m "$2"
            # Fast-forward only. A rejection means another writer got there
            # first, and the right response is a failed run, not a force-push.
            git push origin "HEAD:refs/heads/${STATUS_BRANCH}"
            echo "published $1"
          }

          publish "releases/${TAG}.json" "status: ${TAG} verification (run ${GITHUB_RUN_ID})"

          if [ "$PRERELEASE" = "true" ] || [[ "$TAG" == *-* ]]; then
            echo "::notice::${TAG} is a prerelease — versioned file only; latest.json unchanged"
          elif [ "$TAG" != "$LATEST" ]; then
            echo "::notice::${TAG} is not GitHub's latest release ('${LATEST:-none}') — versioned file only; latest.json unchanged"
          else
            publish latest.json "status: latest → ${TAG}"
          fi

      - name: Summary
        if: always() && steps.guard.outputs.is_core == 'true'
        run: |
          F="$RUNNER_TEMP/feed.json"
          if [ ! -s "$F" ]; then
            echo "## Release status — nothing published" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Release status — $(jq -r .release.tag "$F")"
            echo
            echo "Verified at $(jq -r .verified_at "$F") against release commit \`$(jq -r .release.commit "$F")\`."
            echo
            echo "| Check | Result |"
            echo "|---|---|"
            jq -r '.checks | to_entries[] | "| \(.key) | \(.value.result) |"' "$F"
          } >> "$GITHUB_STEP_SUMMARY"
