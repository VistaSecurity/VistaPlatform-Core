# Build and publish the Core edition from source.
#
# This is the PUBLIC repository's release pipeline, and it is deliberately not
# the one the commercial editions use. Those are promoted bit-for-bit from an
# internal staging registry so the bytes we tested are the bytes that ship.
# Core has the opposite requirement: the images must be reproducible from the
# public source, so anyone can rebuild a tag and diff it against what we
# published. That claim is only worth making if the build starts from the same
# tree a reader can see, so this builds from source, in the open, every time.
#
# Two properties follow from that and are worth stating:
#
#   * Dockerfile.prod, NOT Dockerfile.dist. .dist compiles with `-tags ee` and
#     runs the result through garble. Enterprise code in a Core image would make
#     the edition boundary a runtime check only, and an obfuscated binary cannot
#     be checked against source at all — which would make "read the code you
#     run" untrue in the one place it matters.
#   * ghcr.io, not Docker Hub. A full install pulls ~20 images; Docker Hub's
#     anonymous rate limit is ~100 pulls per 6h per IP, so an evaluator behind a
#     shared NAT can fail their first install through no fault of their own and
#     read it as our bug. GHCR has no equivalent cliff and needs no credentials
#     beyond the built-in GITHUB_TOKEN.
#
# Base images: the official builds start from Docker Hardened Images (dhi.io) —
# the same hardened bases the commercial line uses — when DOCKERHUB_USERNAME /
# DOCKERHUB_TOKEN are configured (dhi.io authenticates with a Docker Hub account
# that holds a DHI subscription). Without those secrets — a fork, or a fresh
# repo before secrets land — the build falls back to the public library images
# the Dockerfiles default to, so anyone can still rebuild a tag from source
# without a subscription. The Dockerfile ARG defaults stay public for the same
# reason: `docker compose up` must work with no registry login.
name: Release Core

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to build (e.g. v0.1.0)'
        required: true

permissions:
  # contents: write is needed by the `release` job to create the GitHub Release
  # and upload the sensor/agent binaries to it. Every other job reads only.
  contents: write

env:
  RELEASE_REF: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # This workflow ships in the public tree, which means it also exists in the
  # private working tree it is exported from. Building Core there would publish
  # a second, confusing image line under the wrong owner. Rather than hard-code
  # a repository name (which breaks the day anything is renamed), detect what
  # kind of tree this is: Core is precisely the tree with no services/*/ee.
  guard:
    runs-on: ubuntu-latest
    # Reads the tree and nothing else. Without this it inherits the workflow's
    # top-level contents: write, which only the `release` job actually needs.
    permissions:
      contents: read
    outputs:
      is_core: ${{ steps.check.outputs.is_core }}
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
      - id: check
        run: |
          if compgen -G "services/*/ee" > /dev/null; then
            echo "This tree contains services/*/ee — it is not the Core tree. Skipping."
            echo "is_core=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_core=true" >> "$GITHUB_OUTPUT"
          fi
          VERSION="${RELEASE_REF}"
          case "$VERSION" in
            v*.*.*) ;;
            *) echo "::error::'$VERSION' is not a vX.Y.Z tag"; exit 1 ;;
          esac
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          # RELEASE CANDIDATES. A prerelease is any version carrying a `-`
          # suffix — v1.0.0-rc.1. The tag glob above already matches it
          # (`v*.*.*` is anchored and `*` spans the suffix), which is why an RC
          # needs no new trigger; what it needs is for everything downstream to
          # stop treating it as final. Three consequences, all handled below and
          # all pinned by scripts/test-release-tag-split.mjs:
          #
          #   * the GitHub Release is created --prerelease --latest=false, so an
          #     RC never becomes the repository's "Latest release" (the thing a
          #     reader lands on, and the thing install docs implicitly point at);
          #   * the images job does NOT move the :latest tag, so `docker pull
          #     ghcr.io/…/auth-service` keeps resolving to the last real release;
          #   * release notes come from the BASE version's CHANGELOG section,
          #     because an RC has no section of its own by rule.
          case "$VERSION" in
            *-*) echo "prerelease=true"  >> "$GITHUB_OUTPUT"
                 echo "::notice::$VERSION is a PRERELEASE — not latest, :latest untouched" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

  images:
    needs: guard
    if: needs.guard.outputs.is_core == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write        # keyless cosign signing via Fulcio/Rekor
    # Lifted to job env because the `secrets` context is NOT available in `if:`
    # — only env/github/inputs/job/matrix/needs/runner/steps/strategy/vars are.
    # A workflow referencing secrets there does not fail at runtime, it fails to
    # COMPILE, and GitHub reports it as a nameless "workflow file issue" with no
    # line number. Two workflows in this repo carried that bug unnoticed from
    # 2026-05 to 2026-08 because a workflow that never compiles never reports.
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: auth-service,                 context: ., dockerfile: services/auth-service/Dockerfile.prod }
          - { name: inventory-service,            context: ., dockerfile: services/inventory-service/Dockerfile.prod }
          - { name: compliance-engine,            context: ., dockerfile: services/compliance-engine/Dockerfile.prod }
          - { name: cbom-service,                 context: ., dockerfile: services/cbom-service/Dockerfile.prod }
          - { name: sensor-manager,               context: ., dockerfile: services/sensor-manager/Dockerfile.prod }
          - { name: admin-service,                context: ., dockerfile: services/admin-service/Dockerfile.prod }
          - { name: monitoring-service,           context: ., dockerfile: services/monitoring-service/Dockerfile.prod }
          - { name: cluster-sensor-service,       context: ., dockerfile: services/cluster-sensor-service/Dockerfile.prod }
          - { name: resource-tracker-service,     context: ., dockerfile: services/resource-tracker-service/Dockerfile.prod }
          - { name: tenant-health-service,        context: ., dockerfile: services/tenant-health-service/Dockerfile.prod }
          - { name: audit-service,                context: ., dockerfile: services/audit-service/Dockerfile.prod }
          - { name: device-interrogation-service, context: ., dockerfile: services/device-interrogation-service/Dockerfile.prod }
          - { name: discovery-processor-service,  context: ., dockerfile: services/discovery-processor-service/Dockerfile.prod }
          - { name: notification-service,         context: ., dockerfile: services/notification-service/Dockerfile.prod }
          - { name: pcap-processor,               context: ., dockerfile: services/pcap-processor/Dockerfile.prod }
          - { name: mcp-service,                  context: ., dockerfile: services/mcp-service/Dockerfile.prod }
          - { name: web-ui,                       context: ., dockerfile: frontend-v2/Dockerfile.prod }
          - { name: admin-ui,                     context: ., dockerfile: admin-ui-v2/Dockerfile.prod }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.version }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR paths must be lowercase; GitHub org names are not guaranteed to be.
      - id: owner
        run: echo "lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # Hardened bases when we can authenticate, public bases otherwise — see
      # the header comment. The secrets context is only readable at step level,
      # so the choice is computed here rather than in a job-level condition.
      - name: Log in to dhi.io (Docker Hardened Images)
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        run: echo "$DOCKERHUB_TOKEN" | docker login dhi.io -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Choose base images
        id: bases
        run: |
          if [ -n "${DOCKERHUB_USERNAME}" ] && [ -n "${DOCKERHUB_TOKEN}" ]; then
            echo "go=dhi.io/golang:1.26-alpine3.24-dev"    >> "$GITHUB_OUTPUT"
            echo "runtime=dhi.io/alpine-base:3.24-dev"     >> "$GITHUB_OUTPUT"
            echo "node=dhi.io/node:24-alpine3.22-dev"      >> "$GITHUB_OUTPUT"
            echo "Building from Docker Hardened Images (dhi.io)"
          else
            echo "go=golang:1.26-alpine"                   >> "$GITHUB_OUTPUT"
            echo "runtime=alpine:3.24.1"                   >> "$GITHUB_OUTPUT"
            echo "node=node:24-alpine"                     >> "$GITHUB_OUTPUT"
            echo "No Docker Hub credentials — building from public library images"
          fi

      # The version tag always; `:latest` only for a real release.
      #
      # Computed in a step rather than inlined in `tags:` because the condition
      # has to REMOVE a line, and an expression that renders to an empty line
      # inside a multi-line `tags:` block is a silent no-op-or-not depending on
      # how the action trims its input. Here the list is built explicitly and
      # the choice is visible in the run log.
      #
      # Why it matters: `:latest` is what an evaluator gets from a bare
      # `docker pull`, and what a copy-pasted `kubectl set image` without a tag
      # resolves to. Moving it to a release candidate would hand unreviewed
      # bits to anyone who never asked for an RC.
      - name: Image tags
        id: tags
        env:
          PRERELEASE: ${{ needs.guard.outputs.prerelease }}
          REPO: ghcr.io/${{ steps.owner.outputs.lc }}/${{ matrix.image.name }}
          V: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          {
            echo 'list<<TAGS_EOF'
            echo "${REPO}:${V}"
            if [ "$PRERELEASE" = 'true' ]; then
              echo "::notice::prerelease — not tagging ${REPO}:latest" >&2
            else
              echo "${REPO}:latest"
            fi
            echo 'TAGS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.tags.outputs.list }}
          build-args: |
            GO_BUILDER_IMAGE=${{ steps.bases.outputs.go }}
            RUNTIME_IMAGE=${{ steps.bases.outputs.runtime }}
            NODE_BUILDER=${{ steps.bases.outputs.node }}

      # Pinned to v3.x deliberately. cosign v4 requires the new bundle format for
      # sign-blob and drops the --output-signature/--output-certificate pair that
      # public/INSTALL.md and docsv4 SENSOR_REGISTRATION.md tell customers to verify
      # with. Moving to a bundle is a change to a published contract and needs the
      # docs changed with it — see the 0.10.0/0.10.1 release failures.
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5  # v3.10.1
        with:
          # Pin the cosign BINARY, not just the action. Without this the
          # version comes from the action's default, which floats with the
          # action: v3.9.2 installed cosign v2.5.3, v3.10.1 installs v2.6.1.
          # So an installer bump silently changed which cosign signs a
          # release — in the workflow whose signatures customers verify.
          # release-customer.yml has pinned for this reason for months;
          # this file did not, and dependabot is what surfaced it.
          # Stay on the v2 line: cosign v3 deleted --output-signature and
          # --output-certificate, which the checksum signing below needs
          # (scripts/test-cosign-bundle-format.mjs enforces that).
          cosign-release: 'v2.6.1'

      # Keyless: the signing identity is this workflow's OIDC token, so what a
      # verifier checks is "built by this workflow in this repo", not "signed by
      # a key we hold". There is no private key to leak or rotate.
      - name: Sign the image
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          cosign sign --yes \
            "ghcr.io/${{ steps.owner.outputs.lc }}/${{ matrix.image.name }}@${{ steps.build.outputs.digest }}"

  chart:
    needs: [guard, images]
    if: needs.guard.outputs.is_core == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.version }}
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1

      - id: owner
        run: echo "lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # TWO logins, and they are not redundant. `helm registry login` writes
      # helm's own credential store (~/.config/helm/registry/config.json); cosign
      # reads Docker's (~/.docker/config.json) and knows nothing about helm's.
      # With only the helm login the chart PUSHES fine and then signing dies on
      # `UNAUTHORIZED: authentication required` while pulling back the artifact
      # it just wrote. The images job never hit this because docker/login-action
      # happens to write the file cosign wants.
      - name: Log in to GHCR (helm — for the push)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u '${{ github.actor }}' --password-stdin

      - name: Log in to GHCR (docker config — for cosign)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # seed.sql is not committed under charts/ (see CLAUDE.md). Stage both
      # SQL files without whole-line comments so Helm's release Secret stays
      # below Kubernetes' 1 MiB limit; the tracked schema mirror stays exact.
      - name: Stage schema and seed into the chart
        run: scripts/stage-chart-sql.sh

      - name: Stamp the version from the tag
        run: |
          V="${{ needs.guard.outputs.version }}"; V="${V#v}"
          helm show chart charts/vistaplatform >/dev/null
          sed -i "s/^version:.*/version: ${V}/"    charts/vistaplatform/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${{ needs.guard.outputs.version }}\"/" charts/vistaplatform/Chart.yaml

      - name: Package and push
        id: push
        run: |
          helm package charts/vistaplatform -d /tmp/chart
          TGZ=$(ls /tmp/chart/*.tgz)
          OUT=$(helm push "$TGZ" "oci://ghcr.io/${{ steps.owner.outputs.lc }}" 2>&1)
          echo "$OUT"
          echo "digest=$(echo "$OUT" | grep -oE 'sha256:[a-f0-9]{64}' | head -1)" >> "$GITHUB_OUTPUT"

      # Pinned to v3.x deliberately. cosign v4 requires the new bundle format for
      # sign-blob and drops the --output-signature/--output-certificate pair that
      # public/INSTALL.md and docsv4 SENSOR_REGISTRATION.md tell customers to verify
      # with. Moving to a bundle is a change to a published contract and needs the
      # docs changed with it — see the 0.10.0/0.10.1 release failures.
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5  # v3.10.1
        with:
          # Pin the cosign BINARY, not just the action. Without this the
          # version comes from the action's default, which floats with the
          # action: v3.9.2 installed cosign v2.5.3, v3.10.1 installs v2.6.1.
          # So an installer bump silently changed which cosign signs a
          # release — in the workflow whose signatures customers verify.
          # release-customer.yml has pinned for this reason for months;
          # this file did not, and dependabot is what surfaced it.
          # Stay on the v2 line: cosign v3 deleted --output-signature and
          # --output-certificate, which the checksum signing below needs
          # (scripts/test-cosign-bundle-format.mjs enforces that).
          cosign-release: 'v2.6.1'
      - name: Sign the chart
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          cosign sign --yes \
            "ghcr.io/${{ steps.owner.outputs.lc }}/vistaplatform@${{ steps.push.outputs.digest }}"

  # ─── Sensor and agent binaries ──────────────────────────────────────────
  #
  # These two binaries run INSIDE a customer's network, on machines we never
  # see. Anyone can build them from this repository — and should be able to,
  # which is why the source is here — but requiring a Go toolchain and libpcap
  # headers before you can look at your own network is a bad first hour. Most
  # people evaluating this are not going to compile it.
  #
  # Why the runner matrix is not one Linux box:
  #
  #   sensor   libpcap => CGO_ENABLED=1 on linux and darwin, so those cannot be
  #            cross-compiled from a single host. linux/arm64 builds natively on
  #            an arm runner rather than dragging in an aarch64 toolchain plus a
  #            cross libpcap; darwin needs actual macOS. Windows is CGO-free
  #            (capture is loaded at runtime), so it cross-compiles from Linux.
  #
  #   agent    no cgo anywhere. Every platform cross-compiles from one Linux
  #            job, which is why it is a single entry below rather than a matrix.
  #
  # GitHub-hosted runners are free for public repositories, so this costs
  # nothing on the repo where it runs.
  binaries:
    needs: guard
    if: needs.guard.outputs.is_core == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # sensor — CGO, native per platform
          - { runner: ubuntu-latest,    target: sensor-linux-amd64,    artifact: crypto-sensor-linux-amd64 }
          - { runner: ubuntu-24.04-arm, target: sensor-linux-arm64,    artifact: crypto-sensor-linux-arm64 }
          - { runner: macos-15-intel,   target: sensor-darwin-amd64,   artifact: crypto-sensor-darwin-amd64 }
          - { runner: macos-14,         target: sensor-darwin-arm64,   artifact: crypto-sensor-darwin-arm64 }
          # sensor — CGO-free, cross-compiled
          - { runner: ubuntu-latest,    target: sensor-windows-amd64,  artifact: crypto-sensor-windows-amd64.exe }
          - { runner: ubuntu-latest,    target: sensor-windows-386,    artifact: crypto-sensor-windows-386.exe }
          # device agent — CGO-free everywhere, all six from one job
          - { runner: ubuntu-latest,    target: device-agent-all-platforms, artifact: 'device-agent-*' }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.version }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.work
          cache: false

      # linux only; macOS ships libpcap headers in the SDK, and the Windows
      # targets are CGO-free.
      - name: Install libpcap
        if: startsWith(matrix.runner, 'ubuntu') && startsWith(matrix.target, 'sensor-') && !contains(matrix.target, 'windows')
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      # AGENT_VERSION stamps main.Version via -ldflags so a shipped binary
      # reports the release tag instead of the unstamped default "dev".
      - name: Build
        run: make ${{ matrix.target }} AGENT_VERSION=${{ needs.guard.outputs.version }}

      # Unquoted on purpose: the device-agent entry is a glob covering all five
      # of its platforms from one job.
      - name: Stage
        run: |
          set -euo pipefail
          mkdir -p dist
          cp bin/${{ matrix.artifact }} dist/
          ls -la dist/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: bin-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  # ─── GitHub Release ─────────────────────────────────────────────────────
  #
  # The public repo had a bare tag and no Release page, which is where an
  # open-source project's users actually look for "what changed" and "give me a
  # binary". This creates it, attaches every binary, and signs the checksum file.
  #
  # Signing SHA256SUMS rather than each binary is deliberate: one signature
  # covers everything, and verifying it is two commands instead of fourteen.
  release:
    needs: [guard, binaries, images, chart]
    if: needs.guard.outputs.is_core == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write   # keyless cosign
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.version }}

      # `pattern` is not optional here. Without it this downloads EVERY artifact
      # the run produced, and docker/build-push-action silently uploads a
      # `<random>.dockerbuild` provenance artifact per image — 19 of them beside
      # the 7 binaries we actually want. Two consequences, one loud and one not:
      # the download died with "Artifact download failed after 5 retries" after
      # fetching exactly the 7 bin-* artifacts (v0.1.1 failed twice this way),
      # and had it succeeded, all 19 would have been copied into dist/, listed
      # in SHA256SUMS, signed, and attached to the public release.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: bin-*
          path: staged
          merge-multiple: true

      # The release is worth failing over an empty dist/. A rename of the
      # binaries jobs' artifact names would otherwise leave `pattern` matching
      # nothing and publish a release with no binaries and an empty SHA256SUMS,
      # which reads as "this release ships no binaries" rather than as a bug.
      - name: Assert the binaries arrived
        run: |
          set -euo pipefail
          n=$(find staged -type f | wc -l)
          echo "staged $n binary artifact(s):"; find staged -type f | sed 's/^/  /'
          [ "$n" -ge 7 ] || { echo "::error::expected at least 7 binaries, found $n"; exit 1; }

      # Stage under versioned filenames: crypto-sensor-linux-amd64 becomes
      # crypto-sensor-linux-amd64-vX.Y.Z (extension preserved for .exe). A
      # downloaded binary then states its release on disk — "which sensor is
      # this file" was unanswerable once it left the release page, and the
      # in-binary stamp only helps for binaries you can run where you are.
      # The version rides at the END so existing name-prefix globs
      # (-p 'crypto-sensor-linux-amd64*') keep matching. This rename is the
      # single naming choke point: SHA256SUMS is generated after it, so the
      # sums, the signature, and the release all carry the versioned names.
      - name: Checksums
        run: |
          set -euo pipefail
          V="${{ needs.guard.outputs.version }}"
          mkdir -p dist
          find staged -type f | while read -r f; do
            b=$(basename "$f")
            case "$b" in
              *.exe) out="${b%.exe}-${V}.exe" ;;
              *)     out="${b}-${V}" ;;
            esac
            cp "$f" "dist/$out"
          done
          # Assert the rename matched: an inert rename would silently ship the
          # old bare names again.
          n=$(find dist -type f ! -name "*-${V}*" | wc -l)
          [ "$n" -eq 0 ] || { echo "::error::$n staged file(s) missed the version stamp"; find dist -type f ! -name "*-${V}*"; exit 1; }
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      # Pinned to v3.x deliberately. cosign v4 requires the new bundle format for
      # sign-blob and drops the --output-signature/--output-certificate pair that
      # public/INSTALL.md and docsv4 SENSOR_REGISTRATION.md tell customers to verify
      # with. Moving to a bundle is a change to a published contract and needs the
      # docs changed with it — see the 0.10.0/0.10.1 release failures.
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5  # v3.10.1
        with:
          # Pin the cosign BINARY, not just the action. Without this the
          # version comes from the action's default, which floats with the
          # action: v3.9.2 installed cosign v2.5.3, v3.10.1 installs v2.6.1.
          # So an installer bump silently changed which cosign signs a
          # release — in the workflow whose signatures customers verify.
          # release-customer.yml has pinned for this reason for months;
          # this file did not, and dependabot is what surfaced it.
          # Stay on the v2 line: cosign v3 deleted --output-signature and
          # --output-certificate, which the checksum signing below needs
          # (scripts/test-cosign-bundle-format.mjs enforces that).
          cosign-release: 'v2.6.1'

      - name: Sign the checksums
        # --new-bundle-format=false is load-bearing, not legacy cruft. cosign v4
        # defaults it ON, which makes --output-signature/--output-certificate
        # no-ops and then fails on the empty --bundle path. Published verify
        # instructions (public/INSTALL.md, docsv4 SENSOR_REGISTRATION.md) tell
        # customers to pass --signature SHA256SUMS.sig --certificate
        # SHA256SUMS.pem, so those two files have to keep existing. Moving to a
        # bundle is a deliberate change to the published contract, not a flag flip.
        run: cosign sign-blob --yes --output-signature dist/SHA256SUMS.sig --output-certificate dist/SHA256SUMS.pem dist/SHA256SUMS

      # Release notes come from the CHANGELOG section for this version, the same
      # source the commercial line uses. Absent (a Core-only tree restarts its
      # CHANGELOG at the current version), fall back to a pointer rather than
      # failing the release over prose.
      # A PRERELEASE has no CHANGELOG section of its own — by rule: an RC is a
      # rehearsal of a release, and the notes it exists to test are the
      # release's notes. The export already relabels the base section under the
      # RC heading (scripts/prepare-public-tree.sh), so the first lookup
      # normally hits. The base-version fallback is the belt: it keeps this
      # working against a tree whose CHANGELOG was written by hand, instead of
      # silently degrading a release candidate's notes to a bare pointer.
      - name: Release notes
        run: |
          set -euo pipefail
          V="${{ needs.guard.outputs.version }}"; V="${V#v}"
          BASE="${V%%-*}"
          section() {
            awk -v v="$1" '$0 ~ "^## \\[" v "\\]" {f=1;next} f && /^## \[/ {exit} f' CHANGELOG.md
          }
          if section "$V" > notes.md && [ -s notes.md ]; then
            echo "using the CHANGELOG section for $V"
          elif [ "$BASE" != "$V" ] && section "$BASE" > notes.md && [ -s notes.md ]; then
            echo "$V is a prerelease with no section of its own — using the CHANGELOG section for $BASE"
          else
            printf 'See CHANGELOG.md for details.\n' > notes.md
          fi
          # A release section can grow into a reference document rather than
          # release notes — 1.0.0's per-change detail ran to ~200 KB, which is
          # why it now lives in docsv4/core/releases/1.0.0.md. A section may
          # therefore open with a hand-written LEAD — highlights,
          # breaking/upgrading, editions, verify — terminated by a marker, and
          # the Release body is that lead plus a pointer to the full list.
          #
          # Marker ABSENT (every section written before this, and every future
          # one whose author did not add a lead) falls through to the whole
          # section, unchanged. So this is an opt-in per section, not a new
          # requirement that can silently empty a release body.
          MARKER='<!-- release-notes-end -->'
          if grep -qF -- "$MARKER" notes.md; then
            # Everything strictly ABOVE the marker line; the marker itself is
            # not published. `index()` rather than a regex: the marker is an
            # HTML comment, full of characters a regex would read as syntax.
            awk -v m="$MARKER" 'index($0, m) { exit } { print }' notes.md > notes.lead
            # An empty lead would publish a release body consisting of a pointer
            # and nothing else — the marker on the section's first line, say.
            # Keep the whole section in that case rather than shipping nothing.
            if [ -s notes.lead ]; then
              { cat notes.lead
                printf '\n---\n\n_The complete list of changes in this release is in [CHANGELOG.md](CHANGELOG.md)._\n'
              } > notes.md
              echo "lifted the lead (through the ${MARKER} marker) as the release body"
            else
              echo "::warning::${MARKER} left an empty lead; publishing the whole CHANGELOG section"
            fi
            rm -f notes.lead
          else
            echo "no ${MARKER} marker in this section — publishing it whole"
          fi
          # GitHub caps a Release body at 125,000 characters and answers 422
          # above it — so the release would fail at its very LAST step, after
          # every image and the chart are built and signed, with an error that
          # says nothing about length. Not hypothetical: the 1.0.0 CHANGELOG
          # section was ~200 KB before its detail moved to
          # docsv4/core/releases/1.0.0.md, and nothing stops the next one.
          #
          # This stays BELOW the marker lift above and independent of it: the
          # lift is a choice the section's author makes, and the cap is what
          # holds when they did not make it (or made it badly). Two mechanisms,
          # because a body that is merely usually short is not a guarantee.
          #
          # Truncated at a line boundary (head -c can split a UTF-8 sequence;
          # dropping the final partial line handles that as well as the ragged
          # sentence) and pointed at CHANGELOG.md, which SHIPS in this
          # repository — so unlike the old "see the source repository" pointer,
          # it is a link the reader can actually follow.
          LIMIT=110000
          if [ "$(wc -c < notes.md)" -gt "$LIMIT" ]; then
            head -c "$LIMIT" notes.md | sed '$d' > notes.trunc
            { cat notes.trunc
              printf '\n\n---\n\n_These release notes were truncated to fit GitHub'"'"'s release-body limit._\n'
              printf '_The complete entry for this version is in [CHANGELOG.md](CHANGELOG.md)._\n'
            } > notes.md
            rm -f notes.trunc
            echo "::warning::the CHANGELOG section exceeded ${LIMIT} bytes; the release notes were truncated"
          fi

          if [ "${{ needs.guard.outputs.prerelease }}" = 'true' ]; then
            # Prepended, not appended: a reader who lands here from a search
            # result needs to know what this is before reading the notes.
            { printf '> **Release candidate.** Published through the real pipeline for\n'
              printf '> pre-release verification. Not the latest release, not announced, and\n'
              printf '> superseded by the final `v%s` release. Use it only if you are\n' "${BASE}"
              printf '> deliberately testing this candidate.\n\n'
              cat notes.md; } > notes.rc && mv notes.rc notes.md
          fi
          {
            printf '\n\n## Binaries\n\n'
            printf 'Pre-built sensor and device-agent binaries are attached. Both also build\n'
            printf 'from source in this repository — `make build-sensor`, `make build-device-agent`.\n\n'
            printf '**Packet capture runtime:** Linux sensors require libpcap; macOS includes it.\n'
            printf 'Windows sensors require Npcap. Install the runtime before launching a bare binary.\n'
            printf 'The Linux `scripts/install-sensor.sh` installer checks that the binary can load\n'
            printf 'before making changes and explains how to install missing dependencies.\n'
            printf 'To check only, place the verified binary in the current directory as\n'
            printf '`crypto-sensor`, run `chmod +x crypto-sensor`, then\n'
            printf '`bash scripts/install-sensor.sh --check-dependencies`.\n\n'
            printf '| | |\n|---|---|\n'
            printf '| Debian / Ubuntu | `apt install libpcap0.8` (or `libpcap0.8t64` on newer releases) |\n'
            printf '| RHEL / Fedora | `dnf install libpcap` |\n'
            printf '| macOS | already present |\n'
            printf '| Windows | install [Npcap](https://npcap.com/) |\n\n'
            printf 'The device agent is statically linked and needs nothing.\n'
            printf '\n\n## Verifying these binaries\n\n```bash\n'
            printf 'cosign verify-blob SHA256SUMS \\\n'
            printf '  --signature SHA256SUMS.sig --certificate SHA256SUMS.pem \\\n'
            # Double-quoted (GITHUB_REPOSITORY must expand), so the line
            # continuation needs FOUR backslashes: shell collapses \\\\ to \\,
            # printf renders \\ as one backslash and \n as the newline. The
            # previous \\\n reached printf as \\ + n — a literal "\n" in the
            # release body, which broke the command when pasted.
            printf "  --certificate-identity-regexp 'https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release-core.yml@.*' \\\\\n"
            printf "  --certificate-oidc-issuer https://token.actions.githubusercontent.com\n"
            printf 'sha256sum -c SHA256SUMS\n```\n'
          } >> notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ needs.guard.outputs.prerelease }}
        run: |
          set -euo pipefail
          TAG="${{ needs.guard.outputs.version }}"
          FLAGS=()
          if [ "$PRERELEASE" = 'true' ]; then
            # --prerelease marks it; --latest=false is the belt-and-braces half.
            # GitHub's own rule ("drafts and prereleases cannot be set as
            # latest") already excludes it, but `gh release create` sends
            # make_latest only when --latest is given, so the repository's
            # Latest pointer is otherwise decided by server-side defaulting we
            # do not control and cannot see in the run log. Saying it outright
            # costs one flag and removes the class of bug where an RC becomes
            # the page every reader lands on.
            FLAGS+=(--prerelease --latest=false)
          fi
          # ${FLAGS[@]+…} rather than a bare "${FLAGS[@]}": an empty array under
          # `set -u` is an unbound reference on bash before 4.4.
          gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag ${FLAGS[@]+"${FLAGS[@]}"} dist/* \
            || gh release upload "$TAG" dist/* --clobber
