# Grafana Dashboard Provisioning
apiVersion: 1

providers:
  - name: 'Crypto Inventory Dashboards'
    orgId: 1
    folder: 'Platform'
    folderUid: 'crypto-inventory'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/dashboards
