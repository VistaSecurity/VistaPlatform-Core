  middlewares:
    cors-headers:
      headers:
        accessControlAllowOriginList:
          - https://example.com
          - https://app.example.com
          - https://admin.example.com
          - https://demoapi.example.com
          - https://demoapp.example.com
          - https://demoadmin.example.com
        accessControlAllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        accessControlAllowHeaders:
          - Authorization
          - Content-Type
          - X-Requested-With
          - X-Impersonate-Tenant
          - X-Tenant-ID
          - X-User-ID
          - X-CSRF-Token
        accessControlAllowCredentials: true
        accessControlMaxAge: 86400
        addVaryHeader: true
    security-headers:
      headers:
        frameDeny: true
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: strict-origin-when-cross-origin
        contentSecurityPolicy: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:
          https:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'none';"
        customResponseHeaders:
          Permissions-Policy: camera=(), microphone=(), geolocation=()
        stsSeconds: 31536000
        stsIncludeSubdomains: true
    strip-backend-cors:
      headers:
        customResponseHeaders:
          Access-Control-Allow-Origin: ""
          Access-Control-Allow-Methods: ""
          Access-Control-Allow-Headers: ""
          Access-Control-Allow-Credentials: ""
          Access-Control-Max-Age: ""
    rate-limit-api:
      rateLimit:
        average: 1000
        burst: 2000
    rate-limit-auth:
      rateLimit:
        average: 200
        burst: 400
    compress:
      compress:
        minResponseBodyBytes: 1024
    body-size-limit:
      buffering:
        maxRequestBodyBytes: 104857600
    retry:
      retry:
        attempts: 3
        initialInterval: 100ms
    deny-admin-plane: &a5
      ipAllowList:
        sourceRange:
          - 192.0.2.0/24
        rejectStatusCode: 404
    deny-internal-plane: *a5
    circuit-breaker-auth-service:
      circuitBreaker: &a6
        expression: ResponseCodeRatio(500, 600, 0, 600) > 0.30
        checkPeriod: 10s
        fallbackDuration: 30s
        recoveryDuration: 60s
