  middlewares:
    cors-headers:
      headers:
        accessControlAllowOriginListRegex:
          - ^https?://.+$
        accessControlAllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        accessControlAllowHeaders:
          - Authorization
          - Content-Type
          - X-Requested-With
          - X-Impersonate-Tenant
          - X-Tenant-ID
          - X-User-ID
          - X-CSRF-Token
        accessControlAllowCredentials: true
        accessControlMaxAge: 86400
        addVaryHeader: true
    security-headers:
      headers:
        frameDeny: true
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: strict-origin-when-cross-origin
        contentSecurityPolicy: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:
          https:; font-src 'self' data:; connect-src 'self' http: https:; frame-ancestors 'none';"
        customResponseHeaders:
          Permissions-Policy: camera=(), microphone=(), geolocation=()
    strip-backend-cors:
      headers:
        customResponseHeaders:
          Access-Control-Allow-Origin: ""
          Access-Control-Allow-Methods: ""
          Access-Control-Allow-Headers: ""
          Access-Control-Allow-Credentials: ""
          Access-Control-Max-Age: ""
    rate-limit-api:
      rateLimit:
        average: 100
        burst: 200
    rate-limit-auth:
      rateLimit:
        average: 20
        burst: 50
    compress:
      compress:
        minResponseBodyBytes: 1024
    body-size-limit:
      buffering:
        maxRequestBodyBytes: 104857600
    retry:
      retry:
        attempts: 3
        initialInterval: 100ms
    deny-admin-plane: &a5
      ipAllowList:
        sourceRange:
          - 192.0.2.0/24
        rejectStatusCode: 404
    deny-internal-plane: *a5
