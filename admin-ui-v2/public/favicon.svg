<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Vista Operations">
  <!-- Mirrors the tenant brand mark (frontend-v2/public/favicon.svg): a Shield on
       the Vista gold gradient, dark-on-gold (#1a1300). Shield path = lucide-react
       Shield (v0.460). The blue corner dot (operator structural accent, --op-blue
       #3772FE) distinguishes the admin "Operations" tab from the tenant Console. -->
  <defs>
    <linearGradient id="vista-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="0.55" stop-color="#d8a000"/>
      <stop offset="1" stop-color="#b07e00"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#vista-gold)"/>
  <g transform="translate(6 6) scale(0.8333)">
    <path fill="#1a1300" d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>
  </g>
  <circle cx="25" cy="25" r="5.5" fill="#1a1300"/>
  <circle cx="25" cy="25" r="3.75" fill="#3772FE"/>
</svg>
