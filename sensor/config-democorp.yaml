sensorId: "103accf5-b73e-4dd1-9dbd-00beac74dd3a"
controlPlaneUrl: "http://localhost:8085"
registrationKey: "REG-tenant-123-20250930-2ed6d1"
reportingIntervalSeconds: 30

storage:
  maxStorageSize: 104857600    # 100 MB
  rotationSize: 10485760       # 10 MB
  retentionDays: 7
  dataPath: "/var/lib/crypto-sensor"
  encryptionKey: ""

capture:
  interfaces: ["eth0"]
  activeProbing: true
  networkDiscovery: true
  maxConnections: 1000
  timeoutSeconds: 30
  bufferSize: 1048576         # 1 MB

features:
  tls_analysis: true
  ssh_analysis: true
  certificate_analysis: true
  network_discovery: true
  active_probing: true
  air_gapped_export: false

# mTLS Configuration
# NOTE: Certificates are generated at deploy time by generate-service-certificates.sh
# Do NOT embed private keys in config files checked into version control.
tls:
  client_cert_path: "/var/lib/crypto-sensor/certs/client-cert.pem"
  client_key_path: "/var/lib/crypto-sensor/certs/client-key.pem"
  ca_cert_path: "/var/lib/crypto-sensor/certs/platform-ca-cert.pem"
