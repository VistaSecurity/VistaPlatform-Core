sensorId: "your-sensor-id"
controlPlaneUrl: "https://app.vistasecurity.io"
registrationKey: ""
reportingIntervalSeconds: 30

storage:
  maxStorageSize: 104857600    # 100 MB
  rotationSize: 10485760       # 10 MB
  retentionDays: 7
  dataPath: "/var/lib/crypto-sensor"

  # encryptionKey: AES encryption key for local discovery storage.
  # Provide a 64-character hex string (= 32 bytes, AES-256). Leave blank to
  # auto-generate a new key on first startup and persist it to keyPath.
  # Example: encryptionKey: "0102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f20"
  encryptionKey: ""

  # keyPath: Directory where the auto-generated encryption key is stored.
  # Intentionally separate from dataPath so ciphertext and key are not co-located.
  # Defaults (by OS):
  #   Linux:   $XDG_STATE_HOME/crypto-sensor  (usually ~/.local/state/crypto-sensor)
  #   macOS:   ~/Library/Application Support/CryptoSensorKeys
  #   Windows: %APPDATA%\CryptoSensor
  # keyPath: "/etc/crypto-sensor/keys"

capture:
  interfaces: ["eth0"]
  activeProbing: true
  # thirdPartyTLSEnrichment: let the TLS enricher connect to THIRD-PARTY TLS
  # services this network talks to, to read their certificates. Default false.
  # Local value: applies only until the platform delivers its own setting,
  # which then wins (recorded in <dataPath>/platform-probe-consent.json).
  # thirdPartyTLSEnrichment: false
  # ownedNetworks: public CIDRs to treat as yours (air-gapped equivalent of
  # registered network segments; IPv4 /8 or narrower, IPv6 /16 or narrower).
  # ownedNetworks: ["203.0.113.0/24"]
  networkDiscovery: true
  maxConnections: 1000
  timeoutSeconds: 30
  bufferSize: 1048576         # 1 MB

  # dedupTTLMinutes: Minimum minutes before re-reporting the same passive
  # observation (same dest IP, port, protocol). Also drives TLS enricher debounce.
  # Default 60. Override with env DEDUP_TTL_MINUTES or tenant Sensor Configuration UI.
  dedupTTLMinutes: 60

  # extraPortsToMonitor: Additional TCP ports the sensor captures AND decodes
  # as TLS, beyond its built-in ports (the TLS, SSH, SMB, RDP, Kerberos and
  # STARTTLS ports, plus the OT ports you enable). Use this for TLS on a
  # non-standard port without rebuilding the sensor. A listed port is always
  # treated as TLS; it never changes what a built-in or STARTTLS port means
  # (22 stays SSH, 445 stays SMB). Values outside 1-65535 are ignored.
  # Managed from the console as "Additional TLS ports" (the sensor's Control
  # tab, or Sensor defaults): this list is reported on the sensor's first
  # check-in and kept as its own setting; after that the console's value wins
  # and is written back here. Takes effect when the capture reopens (restart).
  # extraPortsToMonitor: [8444, 9443]

  # deepScan: When true, discovery jobs perform additional probe connections per
  # target to enumerate all accepted TLS versions (1.0–1.3) and check for
  # deprecated cipher suites. Increases network connections per target.
  # Off by default. Enable on specific jobs via the job options field instead
  # of enabling globally here.
  deepScan: false
